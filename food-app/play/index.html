  <div class="shell">
    <header class="top">

<script type="module">var Ke=Object.defineProperty;var ze=(e,t,i)=>t in e?Ke(e,t,{enumerable:!0,configurable:!0,writable:!0,value:i}):e[t]=i;var ye=(e,t,i)=>ze(e,typeof t!="symbol"?t+"":t,i);const P={anthocyanin:"안토시아닌",quercetin:"퀘르세틴",egcg:"카테킨 (EGCG)",curcumin:"커큐민",resveratrol:"레스베라트롤","chlorogenic-acid":"클로로겐산","cocoa-flavanol":"코코아 플라바놀",isoflavone:"이소플라본",ellagitannin:"엘라지탄닌·유롤리틴",hesperidin:"헤스페리딘","olive-polyphenol":"올리브 폴리페놀",lignan:"리그난","beta-carotene":"베타카로틴",lutein:"루테인·제아잔틴",lycopene:"라이코펜",astaxanthin:"아스타잔틴",sulforaphane:"설포라판",allicin:"알리신 (마늘 유황화합물)","dietary-nitrate":"식이 질산염",capsaicin:"캡사이신",gingerol:"진저롤·쇼가올",caffeine:"카페인","beta-glucan":"베타글루칸","prebiotic-fiber":"발효성 식이섬유 (프리바이오틱스)","resistant-starch":"저항성 전분","seaweed-polysaccharide":"해조 다당류 (알긴산·후코이단)","added-sugar":"첨가당·과당","refined-carb":"정제 탄수화물",probiotics:"유산균 (프로바이오틱스)","vitamin-c":"비타민 C","vitamin-k":"비타민 K",folate:"엽산","vitamin-e":"비타민 E","vitamin-d":"비타민 D","vitamin-b12":"비타민 B12",magnesium:"마그네슘",potassium:"칼륨","nonheme-iron":"비헴철 (식물성 철)","heme-iron":"헴철 (동물성 철)",calcium:"칼슘",iodine:"요오드",selenium:"셀레늄",zinc:"아연",choline:"콜린","epa-dha":"오메가3 EPA·DHA",ala:"알파리놀렌산 (식물성 오메가3)","linoleic-acid":"리놀레산 (오메가6)","oleic-acid":"올레산 (단일불포화지방)","saturated-fat":"포화지방","trans-fat":"트랜스지방","oxidized-lipids":"산화 지질 (과산화물·알데하이드)",mct:"중쇄지방산 (MCT)",lectin:"렉틴",oxalate:"옥살산",phytate:"피트산",gluten:"글루텐",glycoalkaloid:"글리코알칼로이드 (솔라닌)",acrylamide:"아크릴아마이드",nitrosamine:"아질산염·니트로사민","heat-byproducts":"고온 조리 부산물 (HCA·PAH·AGEs)",methylmercury:"메틸수은",ethanol:"알코올 (에탄올)",sodium:"나트륨"},Oe=Object.keys(P),S={antioxidant:"항산화","anti-inflammatory":"항염",vascular:"혈관·혈압",cholesterol:"콜레스테롤·지질","blood-sugar":"혈당·인슐린",gut:"장 건강",brain:"뇌·신경",eye:"눈","bone-muscle":"뼈·근육",liver:"간·해독",immune:"면역",hormone:"호르몬",skin:"피부",energy:"에너지 대사",cancer:"암 관련 연구","inflammation-risk":"염증 유발","oxidative-risk":"산화 스트레스 유발",autoimmune:"자가면역 관련"},ue=Object.keys(S),Ve=[{id:"anthocyanin",name:"안토시아닌",en:"Anthocyanins",aliases:["안토시아니딘","시아니딘","델피니딘","anthocyanidin","cyanidin"],kind:"폴리페놀",effect:"benefit",tags:["antioxidant","anti-inflammatory","vascular","brain","blood-sugar"],summary:"블루베리·검은콩·자색고구마·적양배추의 보라·파란색을 내는 플라보노이드 색소입니다. 시험관에서는 강력한 항산화제지만, 몸속에서는 활성산소를 직접 없애기보다 세포의 방어 스위치를 켜고 혈관의 산화질소를 늘리는 신호로 작용하는 것으로 보입니다.",pathways:[{title:"세포의 항산화 스위치(Nrf2) 켜기",evidence:"limited",steps:[{title:"섭취·흡수",body:"위와 소장에서 원형 그대로 일부가 흡수되지만, 혈액에 원형으로 도달하는 양은 먹은 양의 1~2% 안팎으로 매우 적습니다."},{title:"간·대장에서 변신",body:"간과 장벽에서 메틸화·글루쿠론산 포합으로 모양이 바뀌고, 대장 미생물은 고리 구조를 쪼개 프로토카테큐산(PCA)·페룰산 같은 페놀산을 만듭니다. 이 대사물이 원래 안토시아닌보다 훨씬 높은 농도로 오래(최대 48시간) 혈중에 머뭅니다."},{title:"세포 신호",body:"폴리페놀과 그 대사물은 세포에 약한 스트레스 신호처럼 작용해 Keap1 단백질에 붙잡혀 있던 전사인자 Nrf2를 풀어줍니다. Nrf2는 핵으로 들어가 DNA의 항산화반응요소(ARE)에 결합합니다."},{title:"결과",body:"글루타티온 합성 효소, 헴산화효소-1(HO-1), NQO1 같은 몸 자체의 항산화·해독 효소가 늘어나, 활성산소를 세포가 스스로 처리하는 능력이 커집니다."}],note:'이런 "적당한 자극으로 방어력을 키우는" 방식을 호르메시스(hormesis)라고 부릅니다. 세포·동물 연구 근거가 대부분입니다.'},{title:"혈관 내피 기능 개선 (산화질소 증가)",evidence:"moderate",steps:[{title:"흡수 후 1~2시간",body:"혈중 폴리페놀 대사물이 최고치에 이릅니다."},{title:"혈관 내피세포",body:"활성산소를 만드는 효소(NADPH 산화효소)의 활동을 낮추고, 산화질소를 만드는 내피 산화질소합성효소(eNOS)의 활성을 높이는 것으로 보입니다."},{title:"산화질소(NO) 보존",body:"활성산소(슈퍼옥사이드)는 산화질소를 파괴합니다. 활성산소가 줄고 생성이 늘면 혈관을 넓히는 산화질소가 더 오래 남습니다."},{title:"결과",body:"혈관 평활근이 이완되어 혈관이 부드럽게 넓어집니다. 사람 대상 무작위 대조시험에서 블루베리 섭취 후 혈류매개 혈관확장(FMD)이 개선됐고, 대사증후군 환자의 6개월 시험에서도 개선이 확인됐습니다."}]},{title:"활성산소 직접 중화 (시험관에서는 강함, 몸속에서는 제한적)",evidence:"limited",steps:[{title:"화학 구조",body:"고리 구조에 붙은 여러 개의 페놀성 수산기(-OH)가 전자와 수소를 내주어 슈퍼옥사이드·하이드록실 라디칼 같은 활성산소를 안정화합니다."},{title:"시험관 측정",body:"ORAC 같은 항산화 측정에서 비타민 C보다도 높은 수치가 나옵니다."},{title:"몸속의 한계",body:"혈중 안토시아닌은 나노몰(nM) 수준인데, 혈액의 주요 항산화 물질인 요산·비타민 C는 그보다 수천 배 많은 마이크로몰(μM) 수준으로 존재합니다. 그래서 혈액 속에서 직접 중화하는 기여는 작습니다."},{title:"예외: 장 속",body:"먹은 직후 위와 장 안에서는 농도가 높아, 함께 먹은 음식 속 지방이 소화 중에 산화되는 것을 줄이는 국소 효과는 있을 수 있습니다."}]}],evidenceNote:'사람 연구: 블루베리·베리류가 혈관 내피 기능(FMD)을 개선한다는 무작위 대조시험이 여럿 있고, 대규모 관찰연구에서는 안토시아닌·베리 섭취가 많을수록 심근경색과 제2형 당뇨 위험이 낮았습니다. 반면 "활성산소를 직접 중화한다"는 설명은 주로 시험관 결과이며, 현재 연구는 대사물과 세포 신호를 통한 간접 작용을 더 중요하게 봅니다.',facts:["산성에서는 붉은색, 중성~알칼리에서는 푸른색·녹색으로 변합니다. 적양배추 물이 pH 지시약이 되는 원리입니다.","열·빛·산소에 약해 오래 끓이면 줄어들지만, 냉동해도 대부분 유지됩니다.","미국 농무부(USDA)는 2012년, 시험관 항산화 수치가 몸속 효과를 반영하지 않는다는 이유로 ORAC 데이터베이스를 철회했습니다.","색소는 주로 껍질에 몰려 있어, 알이 작은 야생 블루베리가 재배종보다 100g당 함량이 높습니다."],cautions:["식품으로 먹는 양에서 알려진 위험은 거의 없습니다. 고농축 추출물 보충제가 식품과 같은 효과를 낸다는 근거는 부족합니다."],refs:["Czank C, et al. Am J Clin Nutr 2013 — 13C 표지 안토시아닌의 체내 흡수·대사 추적","Curtis PJ, et al. Am J Clin Nutr 2019 — 대사증후군 대상 블루베리 6개월 무작위 대조시험","Cassidy A, et al. Circulation 2013 — 안토시아닌 섭취와 젊은 여성의 심근경색 위험 (코호트)","Linus Pauling Institute, Micronutrient Information Center — Flavonoids"]},{id:"lectin",name:"렉틴",en:"Lectins",aliases:["피토헤마글루티닌","PHA","밀 배아 응집소","WGA","응집소","agglutinin","렉틴프리","렉틴 프리"],kind:"항영양소",effect:"caution",tags:["gut","immune","autoimmune"],summary:'특정 당(탄수화물)에 달라붙는 단백질로 콩·곡물·땅콩·가지과 채소에 있습니다. 날콩이나 덜 익힌 강낭콩의 렉틴(PHA)은 급성 식중독을 일으키지만 충분히 삶으면 대부분 파괴됩니다. "렉틴이 장누수와 자가면역을 일으킨다"는 주장은 세포·동물 연구에 기반한 가설 단계입니다.',pathways:[{title:"날콩 렉틴(PHA)의 급성 독성",evidence:"strong",steps:[{title:"섭취",body:"날것이나 덜 익힌 강낭콩(특히 붉은 강낭콩)에는 피토헤마글루티닌(PHA)이 매우 많습니다. 끓는 온도에 못 미치게(약 80℃) 데우면 오히려 날것보다 독성이 몇 배 높아진 사례가 보고되어, 저온 조리기가 특히 위험합니다."},{title:"위를 통과",body:"렉틴은 단백질 분해효소와 위산에 잘 견뎌 활성을 가진 채 소장까지 내려갑니다."},{title:"장 세포에 결합",body:"소장 상피세포 표면의 당사슬에 단단히 붙어 융모 세포의 기능을 떨어뜨리고, 장 신경을 자극해 구토 반사를 일으킵니다."},{title:"결과",body:"날콩 4~5알로도 1~3시간 안에 심한 구토·설사·복통이 생길 수 있습니다. 대개 몇 시간 안에 회복됩니다."}]},{title:"장 투과성·자가면역 가설",evidence:"contested",steps:[{title:"장 상피에 부착",body:"밀 배아 응집소(WGA) 같은 일부 렉틴은 시험관에서 장 상피세포에 붙고 세포 안으로 들어갈 수 있습니다."},{title:"장벽이 느슨해진다는 가설",body:"세포·동물 실험에서 세포 사이를 잇는 치밀결합(tight junction)이 느슨해져 장 투과성이 늘고, 면역세포가 자극받아 염증성 사이토카인이 나온다는 결과가 있습니다."},{title:"분자 모방 가설",body:"일부 연구자는 렉틴에 대한 항체가 비슷한 모양의 자기 조직과 교차 반응(분자 모방)해 자가면역을 부추길 수 있다고 제안합니다."},{title:"사람에서의 현실",body:"조리된 콩·통곡물을 먹는 사람에게서 자가면역질환이 늘었다는 근거는 없습니다. 오히려 콩·통곡물 섭취는 관찰연구에서 심혈관질환·당뇨 위험 감소와 연결됩니다. 글루텐에 반응하는 셀리악병처럼 진단된 질환은 별개 문제입니다."}],note:'"렉틴 프리 식단"의 효과를 검증한 무작위 대조시험은 부족합니다.'}],evidenceNote:"확실한 것: 날콩·설익은 콩의 렉틴은 급성 위장 독성을 일으키고, 충분한 가열(불린 뒤 팔팔 끓이기, 압력솥)로 활성이 거의 사라집니다. 불확실한 것: 조리된 식품 속 소량의 렉틴이 장누수·자가면역을 일으킨다는 주장은 대부분 세포·동물 실험과 임상 경험에 기반한 가설이며, 사람 대상 대조시험으로 확인되지 않았습니다.",facts:["미국 FDA 자료에 따르면 날 붉은 강낭콩의 렉틴 활성은 20,000~70,000 단위(HAU)이고, 충분히 삶으면 200~400 단위로 떨어집니다.","5시간 이상 불리고, 불린 물은 버린 뒤, 새 물에서 팔팔 끓는 상태로 충분히(최소 10분, 가능하면 30분 이상) 삶으면 안전합니다.","압력솥 조리는 렉틴을 거의 완전히 불활성화합니다. 통조림 콩은 이미 고온 처리되어 걱정이 거의 없습니다.","슬로우쿠커처럼 끓는점에 못 미치는 조리기에는 날콩을 넣기 전에 먼저 팔팔 끓여야 합니다."],cautions:["날콩가루·생콩 스무디처럼 가열하지 않은 콩 제품은 피하세요.","셀리악병·염증성 장질환 등 진단된 질환이 있어 식단을 바꾸려면 담당 의료진과 상의하세요."],refs:["U.S. FDA, Bad Bug Book (2nd ed.) — Phytohaemagglutinin (kidney bean lectin)","Harvard T.H. Chan School of Public Health, The Nutrition Source — Lectins"]},{id:"linoleic-acid",name:"리놀레산 (오메가6)",en:"Linoleic acid (omega-6)",aliases:["오메가6","오메가-6","omega-6","omega6","LA","n-6","씨앗기름","시드오일","seed oil"],kind:"지방산",effect:"mixed",tags:["cholesterol","vascular","inflammation-risk"],summary:'콩기름·옥수수유·해바라기씨유·카놀라유·견과류에 많은 필수 지방산입니다. "오메가6 → 아라키돈산 → 염증"이라는 설명이 널리 퍼져 있지만, 사람 대상 시험에서는 리놀레산 섭취를 늘려도 염증 지표가 오르지 않았고, 포화지방 대신 먹으면 LDL 콜레스테롤이 내려갑니다. 실제 문제는 고온·반복 가열로 산화될 때 커집니다.',pathways:[{title:"아라키돈산 → 염증 물질 경로 (염증 가설)",evidence:"contested",steps:[{title:"전환",body:"리놀레산은 간에서 불포화효소(델타-6, 델타-5)와 사슬 연장 효소를 거쳐 아라키돈산(AA)으로 바뀔 수 있습니다."},{title:"에이코사노이드 재료",body:"세포막의 아라키돈산은 COX·LOX 효소에 의해 프로스타글란딘E2, 류코트리엔B4 같은 염증 매개물질의 재료가 됩니다."},{title:"가설",body:'그래서 "오메가6를 많이 먹을수록 염증이 늘어난다"는 추론이 나왔습니다.'},{title:"실제 측정",body:"리놀레산이 아라키돈산으로 바뀌는 과정은 엄격히 조절되어, 섭취를 크게 늘리거나 줄여도 조직 아라키돈산은 거의 변하지 않았습니다. 무작위 대조시험들을 모은 체계적 고찰에서 CRP·IL-6 같은 염증 지표도 오르지 않았습니다. 아라키돈산에서는 염증을 끝내는 물질(리폭신)도 만들어집니다."}]},{title:"LDL 콜레스테롤 저하 (포화지방을 대체할 때)",evidence:"strong",steps:[{title:"간세포의 LDL 수용체",body:"포화지방은 간의 LDL 수용체 활성을 떨어뜨리는 반면, 다불포화지방으로 바꾸면 수용체 활성이 회복됩니다."},{title:"혈중 LDL 회수",body:"수용체가 늘면 혈액 속 LDL 입자가 간으로 더 많이 회수됩니다."},{title:"결과",body:"LDL 콜레스테롤이 낮아집니다. 포화지방 에너지의 5%를 다불포화지방으로 바꿀 때 관상동맥질환 위험이 약 10% 낮아졌다는 메타분석이 있습니다."}]},{title:"산화에 약한 구조",evidence:"strong",steps:[{title:"약한 고리",body:"두 이중결합 사이 탄소(비스-알릴 위치)의 수소가 쉽게 떨어져 나갑니다. 이중결합이 하나인 올레산보다 수십 배 빨리 산화됩니다."},{title:"연쇄 산화",body:"열·빛·금속이온이 있으면 지질 라디칼 → 지질과산화 라디칼 → 과산화물로 연쇄 반응이 번집니다."},{title:"분해 산물",body:"과산화물이 분해되며 4-하이드록시노네날(4-HNE) 같은 반응성 알데하이드가 생깁니다. 4-HNE는 특히 오메가6에서 만들어집니다(→ 산화 지질 참고)."},{title:"의미",body:"신선한 기름을 짧게 쓰는 것과 같은 기름으로 여러 번 튀기는 것은, 몸에 들어오는 산화물의 양이 크게 다릅니다."}]}],evidenceNote:"강한 근거: 포화지방을 리놀레산 같은 다불포화지방으로 바꾸면 LDL이 내려가고 심혈관질환 위험이 낮아집니다(메타분석, 미국심장협회 권고). 여러 나라 코호트를 통합한 분석에서도 혈중 리놀레산이 높은 사람의 심혈관 사망 위험이 더 낮았습니다. 반론: 오메가6:오메가3 비율 문제, 산화 LDL 가설, 오래된 시험(시드니 식이 심장 연구, 미네소타 관상동맥 실험)의 재분석에서 이득이 없거나 해로웠다는 결과가 있어 논쟁이 이어지고 있습니다. 합의된 부분: 고온에서 반복 가열한 기름은 피하는 것이 좋습니다.",facts:["몸에서 만들 수 없는 필수 지방산이며, 1일 영양성분 기준치는 10g입니다.","리놀레산 비율(대략): 해바라기씨유(일반형) 약 65%, 옥수수유 약 55%, 콩기름 약 51%, 참기름 약 41%, 카놀라유 약 19%, 올리브유 약 10%.","현대 식단의 오메가6 섭취는 식물성 기름 사용이 늘면서 20세기에 크게 증가했습니다. 오메가3를 늘리는 것이 오메가6를 무리하게 줄이는 것보다 근거가 탄탄합니다."],cautions:["튀김용으로 같은 기름을 여러 번 쓰지 마세요. 리놀레산이 많은 기름일수록 반복 가열 시 산화물이 빨리 늘어납니다."],refs:["Johnson GH, Fritsche K. J Acad Nutr Diet 2012 — 리놀레산 섭취와 염증 지표 무작위 대조시험 체계적 고찰","Mozaffarian D, et al. PLoS Med 2010 — 포화지방을 다불포화지방으로 대체한 시험 메타분석","Marklund M, et al. Circulation 2019 — 오메가6 바이오마커와 심혈관질환 (30개 코호트 통합)","Sacks FM, et al. Circulation 2017 — 미국심장협회 식이지방과 심혈관질환 권고","Ramsden CE, et al. BMJ 2013, BMJ 2016 — 시드니 식이 심장 연구·미네소타 관상동맥 실험 재분석"]},{id:"oxidized-lipids",name:"산화 지질 (과산화물·알데하이드)",en:"Lipid oxidation products",aliases:["4-HNE","HNE","말론디알데하이드","MDA","아크롤레인","산패","과산화지질","지질과산화","튀김기름","재사용 기름","쩐내"],kind:"유해 생성물",effect:"harm",tags:["oxidative-risk","inflammation-risk","vascular","liver"],summary:'기름이 열·빛·공기에 노출돼 산화되면 생기는 과산화물과 알데하이드(4-HNE, MDA, 아크롤레인 등)입니다. 튀김기름을 여러 번 재사용하거나 연기가 날 때까지 가열하면 크게 늘어납니다. "식물성 기름이 활성산소와 염증을 만든다"는 이야기의 실제 핵심 기전이 여기에 있습니다.',pathways:[{title:"기름 속에서: 가열 → 연쇄 산화",evidence:"strong",steps:[{title:"개시",body:"180℃ 전후의 튀김 온도에서 불포화지방산의 수소가 떨어져 나가 지질 라디칼(L•)이 생깁니다."},{title:"전파",body:"지질 라디칼이 산소와 결합해 지질과산화 라디칼(LOO•)이 되고, 옆 지방산의 수소를 빼앗으며 연쇄적으로 번집니다."},{title:"분해",body:"불안정한 지질과산화물(LOOH)이 쪼개지며 4-하이드록시노네날(4-HNE, 주로 오메가6에서), 말론디알데하이드(MDA), 아크롤레인 같은 반응성 알데하이드가 생깁니다."},{title:"누적",body:"같은 기름을 반복 사용할수록, 이중결합이 많은 기름일수록, 튀김 찌꺼기·물기가 섞일수록 산화물이 빨리 쌓입니다."}]},{title:"몸속에서: 알데하이드 → 산화 스트레스·염증",evidence:"limited",steps:[{title:"흡수",body:"음식 속 알데하이드와 산화된 지방 일부는 장에서 흡수되어 암죽미립(킬로미크론)에 실려 혈액으로 들어갑니다."},{title:"단백질 손상",body:"4-HNE·MDA는 단백질의 시스테인·라이신·히스티딘에 달라붙어(부가물 형성) 효소와 수용체의 기능을 떨어뜨립니다."},{title:"방어력 소모",body:"세포는 글루타티온으로 알데하이드를 해독하는데, 과부하가 걸리면 글루타티온이 고갈되고 미토콘드리아에서 활성산소가 더 새어 나옵니다."},{title:"염증 신호",body:"손상 신호가 NF-κB 경로를 켜서 TNF-α·IL-6 같은 염증성 사이토카인 분비가 늘어납니다. 동물실험에서 반복 가열한 기름은 혈관 내피 손상, 혈압 상승, 지방간을 일으켰습니다."}]},{title:"산화 LDL과 동맥경화",evidence:"moderate",steps:[{title:"LDL 산화",body:"혈관벽에 들어간 LDL 입자 속 다불포화지방이 산화되면 산화 LDL이 됩니다."},{title:"거품세포",body:"혈관벽의 대식세포가 청소 수용체(CD36 등)로 산화 LDL을 제한 없이 삼켜 거품세포가 됩니다."},{title:"플라크",body:"거품세포가 쌓이고 죽으면서 죽상동맥경화판(플라크)의 핵심을 이룹니다."},{title:"식이와의 연결",body:"먹은 산화 지질이 산화 LDL을 직접 늘리는지는 사람에서 확실하지 않습니다. 다만 LDL 자체를 낮추고 항산화 성분이 풍부한 식단이 산화 LDL을 줄인다는 연구가 있습니다."}]}],evidenceNote:"화학적으로 확실한 것: 불포화지방은 가열·재사용할수록 산화되어 반응성 알데하이드를 만들고, 이중결합이 많을수록 빠릅니다. 동물실험: 반복 가열한 기름은 산화 스트레스·염증·혈관 손상을 일으킵니다. 사람: 튀긴 음식을 자주 먹을수록 심혈관질환 위험이 높다는 관찰연구가 있지만, 신선한 식물성 기름을 적당히 쓰는 것이 해롭다는 근거는 아닙니다. 조리 온도와 재사용 횟수를 관리하는 것이 핵심입니다.",facts:['튀김기름의 열화 정도는 "총 극성 물질(TPM)"로 관리하며, 여러 유럽 국가는 24~27%를 넘는 기름을 폐기하도록 규정합니다.',"가열 안정성: 포화·단일불포화지방이 많은 기름(엑스트라버진 올리브유, 고올레산 해바라기유, 팜유, 버터기름)이 다불포화지방이 많은 기름(콩기름, 해바라기씨유, 옥수수유)보다 산화에 강합니다.","들기름·아마씨유처럼 오메가3가 많은 기름은 특히 산화가 빨라, 가열보다는 무침용으로 쓰고 냉장 보관하는 것이 좋습니다.","기름에서 나는 쩐내(산패취)는 이미 산화가 꽤 진행됐다는 신호입니다."],cautions:["같은 기름으로 여러 번 튀기지 말고, 연기가 날 때까지 가열하지 마세요.","고온 조리 연기(조리흄)에도 알데하이드가 들어 있으니 주방 환기를 충분히 하세요."],refs:["Esterbauer H, et al. Free Radic Biol Med 1991 — 4-HNE·말론디알데하이드의 화학과 생물학","Sacks FM, et al. Circulation 2017 — 미국심장협회 식이지방과 심혈관질환 권고"]}],Je=[],Ge=[],qe=[],We=[],x=[...Ve,...Je,...Ge,...qe,...We],D=new Map(x.map(e=>[e.id,e])),Ye=[{id:"spinach",name:"시금치",en:"Spinach",aliases:["시금치나물","포항초","섬초","spinach"],emoji:"🥬",category:"채소",summary:"질산염·루테인·비타민 K·엽산·마그네슘이 풍부한 대표 녹색 잎채소입니다. 대신 옥살산이 채소 중 최상위권이라, 데쳐서 기름에 무치는 한국식 나물 조리법이 장점은 살리고 단점은 줄이는 방식입니다.",verdict:{tone:"good",text:"자주 먹기 좋은 채소. 살짝 데쳐 기름에 무치면 흡수는 늘고 옥살산은 줄어듭니다."},basis:"생 시금치 100g",serving:{label:"나물 한 접시 분량 (생것 약 150g)",grams:150},nutrients:{kcal:23,carb:3.6,sugar:.4,fiber:2.2,protein:2.9,fat:.4,satFat:.06,mufa:.01,pufa:.17,la:.03,ala:.14,sodium:79,potassium:558,calcium:99,magnesium:79,iron:2.7,zinc:.53,selenium:1,vitA:469,vitC:28.1,vitE:2,vitK:483,vitB1:.08,vitB2:.19,vitB6:.2,folate:194},compounds:[{id:"dietary-nitrate",amount:"대략 100~250mg/100g (재배 조건·계절에 따라 편차 큼)",role:"장과 입속 세균을 거쳐 산화질소(NO)로 바뀌어 혈관을 넓히고 혈압을 낮추는 재료가 됩니다. 시금치는 질산염이 많은 대표 채소입니다."},{id:"lutein",amount:"루테인+제아잔틴 약 12mg/100g",role:"눈의 황반에 쌓여 청색광을 걸러내고 망막의 산화 손상을 줄입니다. 녹색 채소 중에서도 함량이 최상위권입니다."},{id:"vitamin-k",amount:"약 480μg/100g (기준치의 약 690%)",role:"혈액 응고 단백질과 뼈 단백질(오스테오칼신)을 활성화합니다. 한 접시로 하루 필요량을 몇 배 넘깁니다."},{id:"folate",amount:"194μg/100g",role:"DNA 합성과 메틸화 회로에 쓰여 호모시스테인을 낮추는 데 관여합니다. 열에 약해 오래 삶으면 줄어듭니다."},{id:"magnesium",amount:"79mg/100g",role:"300가지가 넘는 효소 반응의 보조 인자로, 근육 이완과 혈당 조절에 관여합니다."},{id:"beta-carotene",amount:"약 5.6mg/100g",role:"필요한 만큼 비타민 A로 바뀌어 점막과 시각 기능을 돕습니다."},{id:"nonheme-iron",amount:"2.7mg/100g (흡수율은 낮음)",role:"철 함량은 높은 편이지만 식물성 비헴철인 데다 옥살산이 흡수를 방해해, 실제로 흡수되는 양은 적습니다."},{id:"oxalate",amount:"약 600~1,000mg/100g (채소 중 최상위권)",role:"칼슘·철과 결합해 흡수를 방해하고, 수산칼슘 신장결석 위험이 있는 사람에게 부담이 됩니다. 데치면 크게 줄어듭니다."}],howToEat:[{title:"끓는 물에 30초~1분 데치고 물은 버리기",body:"수용성 옥살산이 데친 물로 빠져나가 30~87%까지 줄어듭니다. 대신 비타민 C·엽산도 함께 빠지므로 짧게 데치고, 데친 물은 국물로 쓰지 않는 것이 좋습니다."},{title:"참기름·들기름에 무치기",body:"루테인·베타카로틴·비타민 K는 지용성이라 기름과 함께 먹을 때 흡수가 몇 배 높아집니다. 나물 무침이 과학적으로 좋은 조합입니다."},{title:"비타민 C와 함께 먹기",body:"비헴철은 비타민 C와 함께 먹으면 흡수가 늘어납니다. 레몬즙을 조금 뿌리거나 파프리카·과일을 곁들이세요."},{title:"생으로 대량 섭취는 피하기",body:"그린 스무디처럼 생시금치를 매일 많이 갈아 먹으면 옥살산 섭취가 크게 늘어납니다. 생으로는 샐러드에 곁들이는 정도가 적당합니다."},{title:"데친 시금치는 빨리 먹기",body:"조리한 시금치를 따뜻한 곳에 오래 두거나 여러 번 데우면 세균이 질산염을 아질산염으로 바꿉니다. 냉장 보관하고 1~2일 안에 드세요."}],pairings:{good:["참기름·들기름 (지용성 성분 흡수↑)","두부·멸치 (장 속에서 옥살산을 칼슘이 붙잡아 배출)","레몬·파프리카 (철 흡수↑)"],avoid:["식사 직후 진한 녹차·커피 (탄닌이 비헴철 흡수를 방해)"]},cautions:["와파린(쿠마딘) 복용 중이라면 비타민 K가 약효에 영향을 줍니다. 끊기보다는 매일 비슷한 양을 일정하게 먹는 것이 원칙이며, 담당 의사와 상의하세요.","수산칼슘 신장결석 병력이 있다면 생시금치 대량 섭취를 피하고, 데쳐서 칼슘 식품과 함께 드세요.","어린 영아에게 조리한 시금치를 오래 보관·재가열해 먹이면 아질산염이 늘어 메트헤모글로빈혈증 위험이 있습니다."],myths:[{claim:"시금치는 철분의 왕이라 빈혈에 최고다",truth:"철 함량 자체는 채소 중 높은 편(2.7mg/100g)이지만 흡수율이 낮은 비헴철이고, 옥살산이 흡수를 더 방해합니다. 빈혈 관리에는 헴철 식품(육류·조개류)이나 비타민 C와의 조합이 더 효과적입니다."},{claim:"시금치와 두부를 같이 먹으면 결석이 생긴다",truth:"오히려 반대에 가깝습니다. 장 속에서 옥살산이 두부의 칼슘과 결합해 대변으로 배출되므로 몸에 흡수되는 옥살산이 줄어듭니다. 다만 그만큼 칼슘 흡수도 일부 줄어듭니다."}]},{id:"blueberry",name:"블루베리",en:"Blueberry",aliases:["블루베리","냉동블루베리","야생블루베리","blueberries","빌베리"],emoji:"🫐",category:"과일",summary:"안토시아닌이 풍부한 대표 베리입니다. 몸속에서는 안토시아닌이 활성산소를 직접 없애기보다 장내 미생물 대사물과 세포 신호를 통해 혈관 기능과 항산화 방어력을 높이는 것으로 보이며, 사람 대상 시험에서 혈관 기능 개선이 확인됐습니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 하루 한 줌~한 컵, 생으로 또는 냉동으로."},basis:"생 블루베리 100g",serving:{label:"1컵 (약 150g)",grams:150},nutrients:{kcal:57,carb:14.5,sugar:10,fiber:2.4,protein:.7,fat:.3,satFat:.03,mufa:.05,pufa:.15,la:.09,ala:.06,sodium:1,potassium:77,calcium:6,magnesium:6,iron:.28,zinc:.16,selenium:.1,vitA:3,vitC:9.7,vitE:.57,vitK:19.3,vitB1:.04,vitB2:.04,vitB6:.05,folate:6},compounds:[{id:"anthocyanin",amount:"재배종 약 160mg/100g, 야생종은 2~3배",role:"블루베리의 핵심 성분. 대장 미생물이 만든 페놀산 대사물과 함께 Nrf2 항산화 스위치를 켜고, 혈관 내피의 산화질소를 늘려 혈관 기능을 개선합니다."},{id:"chlorogenic-acid",amount:"과일 중 많은 편",role:"포도당 흡수를 늦추고 간의 당 생성을 조절하는 폴리페놀로, 식후 혈당 상승을 완만하게 하는 데 기여할 수 있습니다."},{id:"quercetin",amount:"소량 (약 3~8mg/100g)",role:"안토시아닌과 함께 작용하는 플라보놀로, 항염 신호 조절에 관여합니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.4g/100g (펙틴 포함)",role:"펙틴 같은 발효성 섬유가 장내 유익균의 먹이가 되어 짧은사슬지방산을 만듭니다."},{id:"vitamin-k",amount:"19μg/100g",role:"과일 치고는 비타민 K가 있는 편으로, 한 컵이면 기준치의 약 40%입니다."}],howToEat:[{title:"생으로, 또는 냉동으로",body:"냉동해도 안토시아닌은 대부분 유지됩니다. 제철이 아닐 때는 무가당 냉동 블루베리가 경제적이고 영양 손실도 적습니다."},{title:"오래 가열하지 않기",body:"잼·머핀처럼 오래 가열하거나 굽는 조리는 안토시아닌을 크게 줄입니다. 요거트·오트밀에 마지막에 올리세요."},{title:"하루 한 컵(약 150g) 정도",body:"대사증후군 환자의 6개월 무작위 대조시험에서 하루 한 컵 분량의 블루베리가 혈관 기능과 콜레스테롤 지표를 개선했습니다."},{title:"껍질째, 작은 알일수록 좋다",body:"색소는 껍질에 몰려 있어, 알이 작을수록 무게 대비 안토시아닌이 많습니다. 짙은 남색이 선명한 것을 고르세요."}],pairings:{good:["플레인 요거트·오트밀 (섬유·단백질과 함께 먹으면 혈당이 완만)","호두·아몬드 (지방과 함께 폴리페놀 흡수 보조)"],avoid:["설탕 시럽·가당 잼 (당 부담이 효과를 상쇄)"]},cautions:["블루베리 주스·가당 건블루베리는 당이 농축되어 있어 생과를 대신하기 어렵습니다.","블루베리 추출물 보충제는 식품과 같은 효과가 입증되지 않았습니다."],myths:[{claim:"블루베리의 안토시아닌이 몸속 활성산소를 직접 중화한다",truth:"시험관에서는 맞지만, 혈액 속 안토시아닌 농도는 요산·비타민 C보다 수천 배 낮아 직접 중화하는 몫은 작습니다. 실제로는 ① 대장 미생물이 만든 대사물, ② 세포의 방어 스위치(Nrf2)를 켜는 신호, ③ 혈관 내피의 산화질소 증가를 통해 작용합니다. 산화 스트레스를 낮추는 방향은 같지만 경로가 다릅니다."},{claim:"블루베리를 먹으면 시력이 좋아진다",truth:"2차대전 조종사의 빌베리 잼 일화에서 퍼진 이야기입니다. 야간 시력 개선을 검증한 대조시험들에서는 효과가 확인되지 않았습니다."}]},{id:"kidney-bean",name:"강낭콩",en:"Kidney bean",aliases:["붉은강낭콩","빨간강낭콩","키드니빈","kidney beans","울타리콩"],emoji:"🫘",category:"콩·견과·씨앗",summary:"식이섬유·식물성 단백질·엽산이 풍부한 콩입니다. 날것이나 덜 익힌 강낭콩의 렉틴(PHA)은 급성 식중독을 일으키지만, 불려서 충분히 삶으면 렉틴 활성이 99% 이상 사라집니다. 렉틴 논쟁의 대표 식품이라 조리법이 핵심입니다.",verdict:{tone:"good",text:"반드시 불려서 팔팔 끓여 익히세요. 제대로 익히면 섬유·단백질·엽산이 풍부한 좋은 식품입니다."},basis:"삶은 강낭콩 100g (무염)",serving:{label:"반 컵 (약 90g)",grams:90},nutrients:{kcal:127,carb:22.8,sugar:.3,fiber:6.4,protein:8.7,fat:.5,satFat:.07,mufa:.04,pufa:.28,sodium:2,potassium:405,calcium:28,magnesium:45,iron:2.9,zinc:1.07,selenium:1.2,vitC:1.2,vitK:8.4,vitB1:.16,vitB2:.06,vitB6:.12,folate:130},compounds:[{id:"lectin",amount:"날것 20,000~70,000 단위 → 충분히 삶으면 200~400 단위",role:"날콩·설익은 콩에서는 급성 구토·설사를 일으키는 원인 물질입니다. 충분한 가열로 거의 불활성화됩니다."},{id:"resistant-starch",amount:"콩류 중 많은 편, 식히면 증가",role:"소장에서 소화되지 않고 대장으로 가서 유익균의 먹이가 되며, 식후 혈당 상승을 완만하게 합니다."},{id:"prebiotic-fiber",amount:"식이섬유 6.4g/100g",role:"올리고당·수용성 섬유가 장내 발효되어 부티르산 같은 짧은사슬지방산을 만듭니다. 가스가 차는 이유이기도 합니다."},{id:"folate",amount:"130μg/100g",role:"엽산이 풍부해 반 컵으로 기준치의 약 30%를 채웁니다."},{id:"potassium",amount:"405mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."},{id:"nonheme-iron",amount:"2.9mg/100g",role:"식물성 철로, 비타민 C와 함께 먹으면 흡수가 늘어납니다."},{id:"phytate",amount:"콩류 전반에 존재",role:"철·아연 흡수를 일부 방해하지만, 불리고 익히면 줄어들고 항산화 작용도 있습니다."}],howToEat:[{title:"5시간 이상 불리고 불린 물은 버리기",body:"불리면 조리 시간이 줄고, 가스를 만드는 올리고당과 피트산 일부가 빠져나갑니다."},{title:"새 물에서 팔팔 끓여 충분히 삶기",body:"끓는 상태를 최소 10분 이상, 가능하면 30분 이상 유지해 속까지 익히세요. 압력솥이면 더 확실합니다. 끓는점에 못 미치는 저온 조리(슬로우쿠커)는 오히려 독성을 키울 수 있어, 먼저 팔팔 끓인 뒤 넣어야 합니다."},{title:"밥에 넣을 때는 불린 콩을 압력밥솥으로",body:"불린 강낭콩을 압력밥솥으로 지으면 충분히 익습니다. 씹었을 때 딱딱하거나 설익었다면 먹지 마세요."},{title:"식혀 먹으면 저항성 전분 증가",body:"익힌 콩을 냉장고에서 식히면 전분이 재결정화되어 저항성 전분이 늘어납니다. 샐러드로 먹기 좋습니다."},{title:"양은 조금씩 늘리기",body:"평소 콩을 적게 먹었다면 소량부터 시작하세요. 장내 미생물이 적응하면서 가스·복부 팽만이 줄어듭니다."}],pairings:{good:["현미·잡곡밥 (곡물과 콩의 아미노산이 서로 보완)","토마토·파프리카 (비타민 C로 철 흡수↑)"],avoid:["설익은 상태로 먹기"]},cautions:["날것·설익은 강낭콩은 절대 먹지 마세요. 4~5알로도 1~3시간 안에 심한 구토·설사가 생길 수 있습니다.","신장질환으로 칼륨 제한 중이라면 양을 조절하세요.","과민성대장증후군(FODMAP 민감)이 있으면 가스·복통이 생길 수 있어 소량부터 시도하세요."],myths:[{claim:"콩의 렉틴이 장누수와 자가면역질환을 일으키니 콩을 끊어야 한다",truth:'충분히 익힌 콩의 렉틴 활성은 날것의 1% 미만으로 떨어집니다. 콩을 많이 먹는 식단(지중해식·장수 지역)에서 자가면역질환이 늘었다는 근거는 없고, 콩 섭취는 심혈관질환·당뇨 위험 감소와 연관됩니다. "렉틴이 자가면역을 일으킨다"는 것은 세포·동물 연구에 기반한 가설 단계입니다.'}]},{id:"canola-oil",name:"카놀라유",en:"Canola oil",aliases:["카놀라","유채유","채종유","canola","rapeseed oil","씨앗기름","시드오일"],emoji:"🫗",category:"기름·지방",summary:"단일불포화지방(올레산)이 약 60%, 오메가6 리놀레산 약 19%, 식물성 오메가3(ALA) 약 9%인 기름입니다. 신선한 기름을 적당히 쓰면 포화지방 대비 LDL을 낮추지만, 여러 번 튀김에 재사용하면 산화 알데하이드가 쌓여 산화 스트레스와 염증 쪽으로 기울 수 있습니다.",verdict:{tone:"balanced",text:"신선하게, 적당량 쓰면 괜찮은 기름. 반복 가열 튀김은 피하세요."},basis:"카놀라유 100g",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:884,fat:100,satFat:7.4,mufa:63.3,pufa:28.1,transFat:.4,la:18.6,ala:9.1,vitE:17.5,vitK:71.3},compounds:[{id:"oleic-acid",amount:"약 60g/100g",role:"가장 많은 지방산. 이중결합이 하나라 비교적 산화에 강하고, 포화지방 대신 먹으면 LDL을 낮춥니다."},{id:"linoleic-acid",amount:"약 19g/100g",role:"필수 오메가6. 신선할 때는 LDL 저하에 기여하지만, 고온 반복 가열 시 산화의 주요 출발점이 됩니다."},{id:"ala",amount:"약 9g/100g",role:"식물성 오메가3. 1큰술로 ALA 기준치(1.3g)에 가까운 양을 채우지만, 이중결합이 3개라 가열에 가장 약한 성분입니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 →
