","한천(우뭇가사리)은 거의 소화되지 않아 열량이 매우 낮고, 물을 많이 품어 배변량을 늘립니다.",'식품첨가물 카라기난(홍조류 유래)은 "장 염증을 일으킨다"는 논란이 있지만, 동물에서 문제가 된 것은 주로 산으로 분해한 저분자형(폴리지난)이며 식품용 카라기난의 사람 위해 근거는 제한적입니다.'],cautions:["다시마·미역은 요오드가 매우 많아, 갑상선질환이 있거나 해조 추출물 보충제를 먹는다면 요오드 과잉에 주의하세요(→ 요오드 참고).","후코이단 보충제는 항응고 작용이 있을 수 있어 와파린 등 항응고제 복용 중이면 의료진과 상의하세요.","톳은 무기비소가 많을 수 있어 충분히 불리고 데친 뒤 물을 버리고 조리하는 것이 좋습니다."],refs:["Hehemann JH, et al. Nature 2010 — 해양 세균의 해조 다당 분해 효소 유전자가 일본인 장내 세균으로 전달","Brownlee IA, et al. Crit Rev Food Sci Nutr 2005 — 식이섬유로서의 알긴산","Fitton JH. Mar Drugs 2011 — 후코이단의 치료적 잠재력 고찰"]},{id:"added-sugar",name:"첨가당·과당",en:"Added sugars and fructose",aliases:["설탕","과당","액상과당","고과당 옥수수시럽","HFCS","첨가당","자유당","당류","단순당","물엿","시럽","sugar","fructose","sucrose","가당 음료","탄산음료"],kind:"식이섬유·탄수화물",effect:"harm",tags:["blood-sugar","liver","cholesterol","inflammation-risk"],summary:"가공·조리 중에 넣는 설탕·물엿·시럽·액상과당과 꿀·과일주스 속 당(자유당)입니다. 설탕은 포도당과 과당이 하나씩 붙은 분자인데, 과당은 간에서 조절 장치를 거치지 않고 대사되어 과하게 먹으면 지방 합성·지방간·중성지방·요산을 늘립니다. 특히 음료로 마시는 당이 문제이며, 통과일 속 당과는 구분해야 합니다.",pathways:[{title:"과당 → 간의 조절 관문 우회 → 지방 합성",evidence:"moderate",steps:[{title:"분해·흡수",body:"설탕은 소장의 수크라아제가 포도당과 과당으로 쪼개고, 과당은 GLUT5 운반체로 흡수됩니다. 소량의 과당은 소장이 먼저 처리하지만, 음료처럼 한꺼번에 많이 들어오면 넘친 과당이 간으로 몰려갑니다."},{title:"브레이크 없는 첫 단계",body:"간에서 과당은 과당인산화효소(케토헥소키나아제)가 빠르게 과당-1-인산으로 바꿉니다. 포도당 대사의 핵심 관문인 포스포프럭토키나아제(PFK-1)는 세포 에너지가 충분하면 속도를 늦추지만, 과당은 이 관문 아래로 곧장 들어가 조절을 받지 않습니다."},{title:"지방 재료로",body:"넘치는 탄소가 아세틸-CoA를 거쳐 새로 지방을 만드는 과정(드노보 지방합성)으로 흘러갑니다. 과당은 ChREBP·SREBP-1c 같은 지방합성 유전자 스위치도 켭니다."},{title:"결과",body:"간에 지방이 쌓이고, 중성지방이 VLDL로 포장되어 혈중 중성지방이 오르며, 간의 인슐린 감수성이 떨어집니다. 과당 음료를 10주 마신 시험에서 같은 열량의 포도당 음료보다 내장지방, 간의 지방 합성, 식후 중성지방이 더 늘었습니다."}],note:"이 해로움은 주로 에너지가 남을 때(과잉 섭취) 뚜렷합니다. 같은 열량 안에서 다른 탄수화물을 과당으로 바꾼 시험에서는 차이가 작았습니다."},{title:"ATP 소모 → 요산 증가",evidence:"moderate",steps:[{title:"급속한 인산화",body:"과당인산화효소는 과당이 들어오는 대로 ATP를 써서 인산을 붙이기 때문에, 과당을 한꺼번에 많이 먹으면 간세포의 ATP가 순간적으로 고갈됩니다."},{title:"퓨린 분해",body:"ATP가 ADP·AMP로 쌓이면 AMP 탈아미노효소가 AMP를 이노신 → 하이포잔틴 → 잔틴으로 분해하고, 잔틴산화효소가 이를 요산으로 바꿉니다."},{title:"결과",body:"과당 섭취 후 혈중 요산이 빠르게 오릅니다. 대규모 코호트에서 가당 청량음료를 하루 2잔 이상 마시는 남성은 통풍 위험이 약 1.9배였습니다."},{title:"추가 영향",body:"요산은 혈관 내피의 산화질소를 줄이고 산화 스트레스를 높인다는 실험 결과가 있어, 과당과 고혈압을 잇는 고리로 연구되고 있습니다(근거 제한적)."}]},{title:"마시는 당 → 포만감 없는 열량 → 체중·당뇨",evidence:"strong",steps:[{title:"액체 열량",body:"음료 속 당은 씹지 않고 빠르게 흡수되며, 같은 열량의 고형 음식보다 포만감을 덜 줘 다음 식사량을 충분히 줄이지 못합니다."},{title:"체중 증가",body:"어린이를 18개월간 가당 음료와 무가당 음료에 무작위 배정한 시험에서, 무가당 음료군의 체중·체지방 증가가 더 적었습니다."},{title:"인슐린 저항성",body:"반복되는 당 부하와 간·내장 지방 증가가 인슐린 저항성을 키웁니다."},{title:"결과",body:"메타분석에서 가당 음료를 하루 1~2잔 마시는 사람은 거의 마시지 않는 사람보다 제2형 당뇨 위험이 약 26% 높았습니다."}]}],evidenceNote:'강한 근거: 가당 음료가 체중 증가·제2형 당뇨·충치와 연관된다는 코호트·무작위 시험·메타분석이 일관됩니다. WHO는 자유당을 총 에너지의 10% 미만(가능하면 5% 미만)으로 권고합니다. 중간 근거: 과당이 간의 지방 합성·중성지방·요산을 늘린다는 대사 연구는 탄탄하지만, 주로 과잉 열량 조건에서 뚜렷합니다. 논쟁 중: "설탕이 마약처럼 중독된다"는 주장은 동물 연구 위주이며 사람에서는 결론이 나지 않았습니다. 통과일은 섬유·수분·폴리페놀이 함께 있어 흡수가 느리고, 코호트에서 통과일을 많이 먹을수록 당뇨 위험이 오히려 낮았습니다(과일주스는 반대).',facts:["WHO 권고 5% 미만은 2,000kcal 기준 하루 약 25g(각설탕 6~8개)입니다. 가당 탄산음료 한 캔(355mL)에는 약 35~40g이 들어 있습니다.","식약처는 가공식품을 통한 당류 섭취를 하루 열량의 10% 이내(2,000kcal 기준 50g)로 권고합니다.","액상과당(고과당 옥수수시럽)은 과당 비율이 약 42~55%로 설탕(50%)과 비슷해, 대사 영향도 설탕과 크게 다르지 않습니다.","충치균(뮤탄스 연쇄상구균)은 설탕을 발효해 젖산으로 치아를 녹이고, 설탕으로 끈적한 글루칸을 만들어 치태를 키웁니다. 먹는 양뿐 아니라 먹는 횟수가 중요합니다."],cautions:["통풍·고요산혈증·지방간·고중성지방혈증이 있다면 가당 음료와 과일주스부터 줄이세요.","유전성 과당불내증(알돌라아제 B 결핍)이 있으면 과당·설탕·소르비톨을 엄격히 피해야 합니다.","미국심장협회는 2세 미만 아이에게 첨가당을 주지 말 것을 권고합니다. 1세 미만 영아에게 꿀은 보툴리누스균 위험 때문에 먹이면 안 됩니다."],refs:["WHO 2015 — Guideline: Sugars intake for adults and children","Stanhope KL, et al. J Clin Invest 2009 — 과당·포도당 음료 10주 섭취와 내장지방·지질·인슐린 감수성","Malik VS, et al. Diabetes Care 2010 — 가당 음료와 대사증후군·제2형 당뇨 메타분석","Choi HK, Curhan G. BMJ 2008 — 청량음료·과당 섭취와 남성 통풍 위험 (코호트)"]},{id:"refined-carb",name:"정제 탄수화물",en:"Refined carbohydrates",aliases:["정제 곡물","흰쌀","백미","흰밥","흰 밀가루","밀가루","흰빵","떡","국수","혈당지수","GI","혈당 스파이크","혈당 급상승","refined grain","white rice"],kind:"식이섬유·탄수화물",effect:"caution",tags:["blood-sugar","oxidative-risk","inflammation-risk"],summary:'도정·제분으로 겨와 씨눈을 벗겨낸 흰쌀·흰 밀가루와 이를 쓴 빵·면·떡입니다. 섬유·비타민 B군·마그네슘이 대부분 사라지고 빨리 소화되는 전분만 남아 식후 혈당이 가파르게 오릅니다. 흰쌀밥을 많이 먹을수록 제2형 당뇨 위험이 높아지는 연관은 특히 아시아인에서 뚜렷합니다. 탄수화물 자체보다 "정제된 형태와 양"이 문제입니다.',pathways:[{title:"빠른 소화 → 혈당 급상승 → 인슐린 → 반응성 저혈당",evidence:"moderate",steps:[{title:"벗겨진 곡물",body:"도정·제분은 곡물의 겉겨(섬유·폴리페놀·무기질)와 씨눈(비타민 E·B군·지방)을 제거하고 전분이 가득한 배젖만 남깁니다. 현미를 백미로 깎으면 식이섬유와 마그네슘이 대략 3분의 1~4분의 1로 줄어듭니다."},{title:"빠른 분해",body:"익혀서 호화된 고운 전분은 침과 췌장의 아밀라아제가 빠르게 포도당으로 쪼개고, 포도당은 소장의 SGLT1 운반체로 곧바로 흡수됩니다. 흰쌀밥·흰빵·떡은 대개 혈당지수(GI) 70 이상인 고GI 식품입니다."},{title:"인슐린 급분비",body:"혈당이 빠르게 치솟으면 췌장이 인슐린을 많이 분비해 포도당을 근육·지방·간으로 밀어 넣습니다."},{title:"반응성 저혈당·허기",body:"일부 사람에서는 인슐린이 과하게 작동해 2~4시간 뒤 혈당이 공복 수준 아래로 떨어지고, 허기·피로·단 것에 대한 욕구가 생깁니다. 비만 청소년이 고GI 식사를 한 뒤 다음 끼니에 더 많이 먹었다는 시험이 있습니다."}],note:'"인슐린이 지방을 저장시켜 살이 찐다"는 탄수화물-인슐린 모델은 논쟁 중입니다. 열량을 엄격히 통제한 시험에서는 저탄수화물 식단이 체지방 감량에서 뚜렷하게 앞서지 않았습니다.'},{title:"혈당 변동 → 산화 스트레스·혈관",evidence:"limited",steps:[{title:"세포로 몰리는 포도당",body:"식후 고혈당이 되면 혈관 내피세포처럼 인슐린 없이 포도당을 받아들이는 세포 안으로 포도당이 많이 들어옵니다."},{title:"미토콘드리아 과부하",body:"전자전달계에 전자가 넘치면서 슈퍼옥사이드(활성산소) 생성이 늘고, 최종당화산물(AGEs)·단백질인산화효소C(PKC)·폴리올 경로가 활성화됩니다."},{title:"혈당 변동의 영향",body:"제2형 당뇨 환자에서 하루 혈당 변동 폭이 클수록 산화 스트레스 지표(소변 8-iso-PGF2α)가 높았고, 이 연관은 평균 혈당(당화혈색소)보다 뚜렷했습니다."},{title:"결과",body:"식후 혈당 급상승은 일시적인 혈관 내피 기능 저하·염증 지표 증가와 연관됩니다. 당뇨가 없는 사람에서의 장기적 의미는 아직 불확실합니다."}]},{title:"장기 섭취와 제2형 당뇨",evidence:"moderate",steps:[{title:"반복 부하",body:"매 끼니 고GI 식사가 반복되면 췌장 베타세포가 인슐린을 많이 만들어야 하고, 간·근육의 인슐린 저항성과 겹치면 부담이 커집니다."},{title:"빠진 보호 성분",body:"겨의 섬유·마그네슘·폴리페놀은 인슐린 감수성과 관련이 있는데, 정제 과정에서 이것들이 함께 사라집니다."},{title:"역학",body:"메타분석에서 흰쌀밥을 가장 많이 먹는 그룹은 가장 적게 먹는 그룹보다 제2형 당뇨 위험이 아시아인(중국·일본)에서 약 55%, 서양인에서 약 12% 높았고, 하루 한 공기 늘 때마다 위험이 약 11% 늘었습니다."},{title:"대안",body:"통곡물 섭취는 반대로 제2형 당뇨·심혈관질환 위험 감소와 일관되게 연관됩니다."}]}],evidenceNote:'중간 근거: 흰쌀·정제곡물 섭취와 제2형 당뇨의 연관은 코호트 메타분석에서 일관되고, 통곡물 섭취는 위험 감소와 연관됩니다. 고GI 식사가 식후 혈당·인슐린을 크게 올리는 것은 확실합니다. 제한·논쟁: 식후 혈당 변동이 당뇨 없는 사람에서도 산화 스트레스로 장기적 해를 끼치는지, 인슐린이 비만의 주원인인지는 결론이 나지 않았습니다. 정제 탄수화물은 "독"이 아니라 양·빈도·곁들이는 음식에 따라 영향이 달라지는 주의 대상입니다.',facts:["같은 끼니에서 채소·단백질을 먼저, 밥을 나중에 먹으면 식후 혈당 최고치가 낮아졌다는 시험이 있습니다(식사 순서 효과). 섬유가 위 배출을 늦추고 단백질·지방이 GLP-1 분비를 먼저 자극하기 때문으로 봅니다.","찰기 있는 단립종 쌀(한국·일본 쌀)은 아밀로펙틴이 많아 바스마티 같은 장립종보다 GI가 높은 편입니다. 잡곡·콩을 섞거나 밥을 식히면 GI가 내려갑니다.","식초를 곁들인 식사에서 식후 혈당·인슐린 상승이 줄었다는 소규모 시험들이 있습니다.",'한국인은 에너지의 약 60% 안팎을 탄수화물에서 얻어, 탄수화물의 "질"(통곡물 비율)을 바꾸는 효과가 큰 편입니다.'],cautions:["당뇨·당뇨 전단계라면 밥 양을 줄이고 잡곡·채소·단백질을 함께 먹는 방식으로 식후 혈당을 관리하세요.","탄수화물을 극단적으로 끊는 식단은 장기 근거가 엇갈리고, 당뇨약(특히 인슐린·SGLT2 억제제)을 복용 중이면 저혈당·케톤산증 위험이 있어 의료진과 상의해야 합니다."],refs:["Hu EA, et al. BMJ 2012 — 흰쌀밥 섭취와 제2형 당뇨 위험 메타분석","Monnier L, et al. JAMA 2006 — 제2형 당뇨 환자의 급성 혈당 변동과 산화 스트레스","Shukla AP, et al. Diabetes Care 2015 — 식사 순서가 식후 혈당·인슐린에 미치는 영향","Ludwig DS, et al. Pediatrics 1999 — 고혈당지수 식사와 이후 과식"]},{id:"probiotics",name:"유산균 (프로바이오틱스)",en:"Probiotics",aliases:["유산균","프로바이오틱스","락토바실러스","비피더스","비피도박테리움","김치 유산균","류코노스톡","발효식품","요구르트","장내미생물","포스트바이오틱스","probiotics","Lactobacillus","Bifidobacterium"],kind:"미생물",effect:"benefit",tags:["gut","immune","anti-inflammatory"],summary:'적당량을 먹었을 때 건강에 이로운 살아 있는 미생물입니다. 김치·요구르트·된장 같은 발효식품과 보충제로 섭취합니다. 효과는 균주마다 다르고, 대부분 장에 정착하지 않고 머물다 지나가면서 작용합니다. 항생제 관련 설사 예방처럼 근거가 있는 쓰임도 있지만, "유산균이면 다 좋다"는 과장입니다.',pathways:[{title:"위를 통과해 장을 지나가는 여정",evidence:"moderate",steps:[{title:"위산·담즙 관문",body:"먹은 균의 상당수는 위산과 담즙에 죽고, 산에 강한 균주나 음식과 함께 먹은 균이 더 많이 살아남습니다."},{title:"일시 체류",body:"살아남은 균은 장에서 며칠~몇 주 머물며 활동하지만, 대부분 이미 자리 잡은 장내 미생물 생태계에 정착하지 못하고 섭취를 멈추면 사라집니다."},{title:"개인차",body:"내시경으로 장 점막을 직접 채취한 연구에서 같은 유산균을 먹어도 잘 머무르는 사람과 거의 받아들이지 않는 사람이 있었고, 원래의 장내 미생물 구성이 이를 좌우했습니다."},{title:"항생제 후 회복",body:"항생제 복용 뒤 복합 유산균 보충제를 먹은 사람은 오히려 원래 장내 미생물로 돌아오는 속도가 늦었다는 연구도 있어, 언제나 이롭다고 단정하기 어렵습니다."}]},{title:"장 속 국소 작용 → 설사 예방",evidence:"moderate",steps:[{title:"산 생성",body:"유산균은 당을 발효해 젖산·아세트산을 만들어 장 내용물을 약산성으로 만듭니다."},{title:"경쟁과 항균 물질",body:"장 점막의 부착 자리와 영양분을 두고 병원균과 경쟁하고, 박테리오신 같은 항균 펩타이드를 분비합니다."},{title:"장벽 지원",body:"일부 균주는 점액 분비와 상피세포의 치밀결합을 강화합니다."},{title:"결과",body:"무작위 시험 메타분석에서 항생제와 함께 유산균을 먹으면 항생제 관련 설사 위험이 약 40% 줄었습니다. 락토바실러스 람노서스 GG, 효모인 사카로미세스 보울라디 같은 특정 균주의 근거가 중심입니다."}]},{title:"면역 신호와 발효식품",evidence:"limited",steps:[{title:"면역세포와의 대화",body:"유산균의 세포벽 성분(리포테이코산 등)은 장 점막 수지상세포의 톨유사수용체(TLR2)에 인식되어, IL-10 같은 항염 신호와 조절 T세포 반응을 유도할 수 있습니다(주로 세포·동물 연구)."},{title:"발효식품 식단 시험",body:"건강한 성인이 10주간 요구르트·케피어·김치·콤부차 등 발효식품을 하루 여러 번 먹자 장내 미생물 다양성이 늘고 IL-6 등 염증 관련 단백질 19가지가 줄었습니다. 같은 기간 고섬유 식단 군에서는 다양성이 늘지 않았습니다."},{title:"해석",body:"발효식품에는 살아 있는 균뿐 아니라 죽은 균체와 발효 대사물(유기산·펩타이드)도 들어 있어, 무엇이 효과를 냈는지는 분리되지 않았습니다."},{title:"한계",body:"참가자 수십 명 규모의 시험이며, 질병 예방으로 이어지는지는 아직 모릅니다."}]}],evidenceNote:'중간 근거: 특정 균주의 항생제 관련 설사 예방, 미숙아 괴사성 장염 예방(의료진 관리 하), 일부 과민성대장증후군 증상 개선에 무작위 시험 근거가 있습니다. 균주마다 효과가 달라 "유산균" 전체로 일반화할 수 없습니다. 제한적: 면역 강화, 비만, 우울·불안(장-뇌 축), 피부 질환에 대한 효과는 소규모 시험이나 동물 연구 수준입니다. 발효식품 섭취가 장내 미생물 다양성과 염증 지표를 개선했다는 무작위 시험이 나오면서, 보충제보다 다양한 발효식품을 먹는 방향이 주목받고 있습니다.',facts:["김치는 발효 초기에는 류코노스톡 메센테로이데스가, 익어서 신맛이 강해질수록 락토바실러스 플란타룸·사케이 같은 산에 강한 균이 우세해집니다. 잘 익은 김치에는 1g당 대략 1억 마리 안팎의 유산균이 있습니다.","김치찌개·볶음김치처럼 가열하면 유산균은 대부분 죽습니다. 죽은 균체와 발효 산물(포스트바이오틱스)의 효과는 연구 중입니다.","2020년 락토바실러스 속이 25개 속으로 재분류되어, 예를 들어 L. plantarum은 Lactiplantibacillus plantarum, L. rhamnosus는 Lacticaseibacillus rhamnosus가 되었습니다. 제품 라벨의 균 이름이 바뀐 이유입니다.","요구르트의 살아 있는 균(스트렙토코쿠스 써모필루스·락토바실러스 불가리쿠스)은 유당을 대신 분해해 유당불내증이 있는 사람의 소화를 돕습니다. EFSA가 인정한 효과입니다."],cautions:["면역이 크게 저하된 사람(항암치료·장기이식), 중심정맥관을 가진 중환자, 중증 급성 췌장염 환자에서는 유산균·효모 보충제가 혈류 감염을 일으키거나 해가 된 사례가 있어 의료진 판단이 필요합니다.","미숙아에게 보충제를 임의로 먹이지 마세요. 미국 FDA는 2023년 미숙아가 프로바이오틱스 균에 의한 패혈증으로 사망한 사례를 들어 경고했습니다.","김치·장아찌 같은 발효 채소는 나트륨이 많을 수 있어 양을 조절하세요."],refs:["Hill C, et al. Nat Rev Gastroenterol Hepatol 2014 — ISAPP 프로바이오틱스 정의·범위 합의","Hempel S, et al. JAMA 2012 — 항생제 관련 설사 예방·치료 프로바이오틱스 메타분석","Wastyk HC, et al. Cell 2021 — 발효식품·고섬유 식단 10주 무작위 시험과 장내 미생물·면역 지표","Suez J, et al. Cell 2018 — 항생제 후 프로바이오틱스가 장내 미생물 회복을 늦춤"]},{id:"vitamin-c",name:"비타민 C",en:"Vitamin C (ascorbic acid)",aliases:["비타민C","비타민씨","아스코르브산","아스코르빈산","ascorbic acid","vitamin C","괴혈병","고용량 비타민 C","메가도스"],kind:"비타민",effect:"benefit",tags:["antioxidant","immune","skin"],summary:"물에 녹는 대표 항산화 비타민으로, 사람은 몸에서 만들지 못해 음식으로 먹어야 합니다. 전자를 내주어 활성산소를 안정시키고 비타민 E를 재생하며, 콜라겐을 만드는 효소의 보조인자로 피부·잇몸·혈관을 튼튼하게 합니다. 식물성 철의 흡수를 늘리는 효과도 확실합니다. 반면 고용량 보충제는 흡수가 포화되어 기대만큼 효과가 커지지 않습니다.",pathways:[{title:"콜라겐을 만드는 효소의 보조인자",evidence:"strong",steps:[{title:"효소의 철 유지",body:"콜라겐 사슬의 프롤린·라이신에 수산기(-OH)를 붙이는 프롤릴·라이실 수산화효소는 활성 중심에 2가 철(Fe2+)이 필요합니다. 반응 중 철이 3가로 산화되면 비타민 C가 다시 2가로 되돌립니다."},{title:"튼튼한 삼중나선",body:"수산화된 프롤린은 콜라겐 세 가닥이 꼬인 삼중나선을 체온에서 안정시키는 수소결합을 만듭니다."},{title:"결핍 시",body:"수산화가 부족한 콜라겐은 불안정해 쉽게 분해되고 혈관벽·잇몸·피부가 약해집니다. 괴혈병의 잇몸 출혈, 피부 점상출혈, 상처 회복 지연, 꼬인 체모가 이 때문입니다."},{title:"다른 효소들",body:"같은 원리로 카르니틴 합성(지방산 운반), 노르에피네프린 합성(도파민 β-수산화효소), 일부 후성유전 효소(TET)에도 쓰입니다."}]},{title:"식물성 철(비헴철) 흡수 증가",evidence:"strong",steps:[{title:"3가 철의 문제",body:"곡물·콩·채소의 비헴철은 주로 3가 철(Fe3+)로, 소장의 약알칼리 환경에서 잘 녹지 않고 피트산·폴리페놀과 결합해 흡수가 어렵습니다."},{title:"환원과 킬레이트",body:"비타민 C는 3가 철을 2가 철(Fe2+)로 환원하고, 철과 녹는 복합체를 만들어 소장까지 녹은 상태로 유지합니다."},{title:"운반체 통과",body:"2가 철은 십이지장 세포의 DMT1 운반체로 흡수됩니다."},{title:"결과",body:"한 끼에 비타민 C 수십 mg(귤 1~2개 분량)을 곁들이면 그 끼니의 비헴철 흡수가 2배 이상 늘 수 있습니다. 다만 장기간 보충했을 때 철 저장량 변화는 이보다 작았습니다."}]},{title:"전자를 내주는 항산화 네트워크",evidence:"moderate",steps:[{title:"흡수와 분포",body:"소장의 나트륨 의존 운반체 SVCT1로 흡수되고, 조직에서는 SVCT2가 세포 안으로 끌어들입니다. 뇌·부신·백혈구·눈의 수정체에는 혈중보다 수십 배 높은 농도로 모입니다."},{title:"전자 공여",body:"아스코르브산은 전자를 쉽게 내주어 슈퍼옥사이드·하이드록실 라디칼·지질과산화 라디칼 같은 활성산소를 안정시키고, 자신은 비교적 안정한 아스코르빌 라디칼을 거쳐 탈수소아스코르브산이 됩니다."},{title:"비타민 E 재생",body:"세포막에서 지질 산화를 막느라 산화된 비타민 E(토코페록실 라디칼)에 전자를 넘겨 다시 쓸 수 있게 되돌립니다."},{title:"재활용",body:'산화된 비타민 C는 글루타티온 등에 의해 다시 아스코르브산으로 환원됩니다. 비타민 C·E·글루타티온이 서로 전자를 주고받는 "항산화 네트워크"를 이룹니다.'}],note:"정상적인 몸속 역할은 확실하지만, 부족하지 않은 사람이 보충제를 먹어 심혈관질환·암을 줄였다는 대규모 무작위 시험 결과는 없습니다."}],evidenceNote:"강한 근거: 괴혈병 예방(하루 10mg 정도로도 예방), 콜라겐 합성, 비헴철 흡수 증가는 확실합니다. 감기: 코크란 체계적 고찰에서 규칙적 보충(하루 200mg 이상)은 일반인의 감기 발생을 줄이지 못했지만 앓는 기간을 성인 약 8%, 어린이 약 14% 줄였고, 마라톤 선수·군인처럼 극심한 신체 스트레스를 받는 사람에서는 발생을 절반가량 줄였습니다. 증상이 생긴 뒤 먹기 시작하는 것은 일관된 효과가 없었습니다. 제한적: 대규모 무작위 시험에서 비타민 C 보충제는 심혈관질환·암 예방 효과를 보이지 못했습니다.",facts:["흡수는 포화됩니다. 한 번에 200mg 정도까지는 거의 다 흡수되지만 1g 이상에서는 흡수율이 절반 아래로 떨어지고, 남는 양은 소변으로 나갑니다. 하루 200~400mg이면 혈중 농도가 거의 최고치에 이릅니다.","함량(100g당 대략): 빨간 파프리카 약 130mg, 키위(그린) 약 90mg, 브로콜리 약 90mg, 딸기 약 60mg, 오렌지 약 50mg, 귤 약 27mg.","물에 녹고 열·산소·알칼리에 약해 오래 삶으면 절반 가까이 잃을 수 있습니다. 생으로 먹거나 짧게 찌거나 전자레인지로 익히는 편이 보존에 유리합니다.","한국 성인 권장섭취량은 하루 100mg, 상한섭취량은 2,000mg입니다. 흡연자는 산화 스트레스 때문에 더 많이 필요합니다."],cautions:["하루 1g 안팎의 고용량 보충제를 꾸준히 먹은 남성에서 신장결석 위험이 약 2배였습니다. 비타민 C 일부가 옥살산으로 대사되기 때문으로, 결석 병력이 있다면 고용량을 피하세요.","혈색소침착증(철 과잉 질환)이 있다면 비타민 C 보충제가 철 흡수를 더 늘려 해로울 수 있습니다.","G6PD 결핍증이 있으면 고용량 정맥 주사 시 용혈이 생길 수 있습니다. 고용량 비타민 C 주사의 항암 효과는 아직 연구 단계입니다."],refs:["Levine M, et al. PNAS 1996 — 건강한 성인의 비타민 C 약동학과 흡수 포화","Hemilä H, Chalker E. Cochrane Database Syst Rev 2013 — 비타민 C와 감기 예방·치료","Thomas LD, et al. JAMA Intern Med 2013 — 비타민 C 보충제와 남성 신장결석 위험","NIH Office of Dietary Supplements — Vitamin C Fact Sheet for Health Professionals"]},{id:"vitamin-k",name:"비타민 K",en:"Vitamin K (phylloquinone, menaquinones)",aliases:["비타민K","필로퀴논","메나퀴논","K1","K2","MK-4","MK-7","비타민 K2","낫토","청국장","phylloquinone","menaquinone","와파린","감마카르복실화"],kind:"비타민",effect:"benefit",tags:["bone-muscle","vascular"],summary:'혈액 응고 단백질과 뼈·혈관 단백질을 "켜는" 지용성 비타민입니다. 녹색 잎채소의 K1(필로퀴논)과 세균이 만드는 K2(메나퀴논: 청국장·낫토의 MK-7, 치즈·달걀·육류의 MK-4 등)가 있습니다. 와파린 복용자는 섭취량을 일정하게 유지하는 것이 핵심이고, 뼈·혈관 석회화 예방 효과는 아직 근거가 제한적입니다.',pathways:[{title:"감마-카르복실화: 단백질에 칼슘 손잡이 달기",evidence:"strong",steps:[{title:"흡수",body:"K1은 지방과 함께 담즙에 녹아 흡수되어 암죽미립에 실려 간으로 갑니다. 채소 속 K1은 엽록체에 단단히 묶여 흡수율이 낮은 편이라, 기름과 함께 먹으면 흡수가 늘어납니다."},{title:"효소 반응",body:"간세포의 소포체에서 감마-글루타밀 카르복실화효소(GGCX)가 환원형 비타민 K를 이용해, 특정 단백질의 글루탐산(Glu)에 카복실기를 하나 더 붙여 감마-카복시글루탐산(Gla)으로 바꿉니다."},{title:"칼슘 결합",body:"Gla 잔기는 칼슘 이온을 붙잡는 손잡이 역할을 해, 단백질이 세포막 인지질 표면에 달라붙어 작동할 수 있게 합니다."},{title:"결과",body:"응고인자 II(프로트롬빈)·VII·IX·X와 응고를 조절하는 단백질 C·S가 활성화됩니다. 결핍되면 멍이 잘 들고 피가 잘 멈추지 않습니다."}],note:"신생아는 태반을 통한 전달이 적고 장내 세균도 거의 없어 비타민 K가 부족하기 쉬워, 출생 직후 비타민 K 주사로 신생아 출혈을 예방합니다."},{title:"비타민 K 재활용 회로와 와파린",evidence:"strong",steps:[{title:"산화",body:"카르복실화 반응을 한 번 할 때마다 비타민 K는 에폭사이드 형태로 산화됩니다."},{title:"재활용 효소",body:"비타민 K 에폭사이드 환원효소(VKORC1)가 이를 다시 환원형으로 되돌려, 적은 양의 비타민 K가 여러 번 재사용됩니다."},{title:"와파린의 작용",body:"항응고제 와파린은 VKORC1을 억제해 재활용 회로를 끊습니다. 그러면 응고인자가 카르복실화되지 못해 피가 덜 굳습니다. VKORC1 유전형에 따라 필요한 와파린 용량이 달라, 동아시아인은 대체로 적은 용량이 필요합니다."},{title:"음식과의 줄다리기",body:"비타민 K를 갑자기 많이 먹으면 와파린 효과가 약해지고(INR 하락, 혈전 위험), 갑자기 줄이면 효과가 강해집니다(INR 상승, 출혈 위험). 그래서 채소를 끊는 것이 아니라 매일 비슷한 양을 유지하는 것이 원칙입니다."}]},{title:"뼈(오스테오칼신)와 혈관(MGP) 단백질",evidence:"limited",steps:[{title:"뼈",body:"조골세포가 만드는 오스테오칼신도 비타민 K 의존성 Gla 단백질로, 카르복실화되어야 뼈의 무기질(하이드록시아파타이트)에 잘 결합합니다."},{title:"혈관",body:"혈관 평활근이 만드는 기질 Gla 단백질(MGP)은 카르복실화되면 혈관벽에 칼슘이 쌓이는 것을 억제합니다. MGP가 없는 생쥐는 동맥이 심하게 석회화되고, 와파린을 오래 복용한 사람에서도 혈관 석회화가 더 많았습니다."},{title:"관찰연구",body:"네덜란드 로테르담 연구에서 K2(메나퀴논) 섭취가 많은 사람은 대동맥 석회화와 관상동맥질환 사망 위험이 낮았지만, K1 섭취와는 연관이 없었습니다."},{title:"무작위 시험",body:"비타민 K 보충제가 골밀도·골절이나 혈관 석회화 진행을 줄였는지에 대한 시험 결과는 일관되지 않고, 대부분 뚜렷한 효과를 보이지 못했습니다. 일본에서는 고용량 MK-4(하루 45mg)가 골다공증 치료제로 쓰입니다."}]}],evidenceNote:'강한 근거: 비타민 K가 응고인자를 활성화하는 기전, 와파린과의 상호작용, 신생아 비타민 K 예방 주사의 효과는 확실합니다. 제한적~중간: 비타민 K 섭취·혈중 지표가 골절·혈관 석회화 위험과 연관된다는 관찰연구는 있지만, 보충제 무작위 시험은 대체로 뚜렷한 효과를 보이지 못했습니다. "K2가 칼슘을 뼈로 보내고 혈관에서 빼낸다"는 설명은 기전상 그럴듯하지만 사람에서 질병 예방 효과로 입증되지는 않았습니다.',facts:["함량(100g당 대략): 생시금치 약 480μg, 케일은 수백 μg, 브로콜리 약 100μg이며 깻잎·상추 같은 잎채소도 많습니다. 1일 영양성분 기준치는 70μg입니다.","K1의 혈중 반감기는 몇 시간이지만, 낫토 유래 MK-7은 약 3일로 훨씬 오래 혈액에 남습니다.","몸속에서 K1 일부는 조직에서 MK-4로 바뀝니다. 장내 세균도 메나퀴논을 만들지만 실제로 흡수되어 기여하는 양은 불확실합니다.","식품 속 K1·K2는 과잉 독성이 알려지지 않아 상한섭취량이 없습니다. 합성 비타민 K3(메나디온)는 독성 때문에 사람 보충제로 쓰지 않습니다."],cautions:["와파린 복용자는 녹색 채소를 끊지 말고 매일 비슷한 양을 드세요. 녹즙·케일 주스, 청국장·낫토(MK-7이 매우 많음), 비타민 K 보충제는 시작·중단하기 전에 담당 의사와 상의하세요.","아픽사반·리바록사반·다비가트란 같은 비(非)비타민 K 경구 항응고제(NOAC)는 비타민 K 섭취의 영향을 받지 않습니다.","광범위 항생제를 오래 쓰거나 지방 흡수 장애(담즙 정체, 오르리스타트 복용 등)가 있으면 비타민 K가 부족해질 수 있습니다."],refs:["NIH Office of Dietary Supplements — Vitamin K Fact Sheet for Health Professionals","Schurgers LJ, et al. Blood 2007 — 합성 K1과 낫토 유래 MK-7의 비교 (반감기·활성)","Geleijnse JM, et al. J Nutr 2004 — 로테르담 연구, 메나퀴논 섭취와 관상동맥질환","Linus Pauling Institute, Micronutrient Information Center — Vitamin K"]}],Zt=[{id:"folate",name:"엽산",en:"Folate (vitamin B9)",aliases:["비타민 B9","B9","폴산","폴레이트","folic acid","folate","메틸엽산","활성엽산","5-MTHF","MTHFR","호모시스테인"],kind:"비타민",effect:"benefit",tags:["brain","vascular","cancer"],summary:'녹색 잎채소·콩·간에 많은 수용성 비타민 B군으로, 탄소 한 개(일탄소 단위)를 운반해 DNA를 만들고 메틸화 회로를 돌리는 데 쓰입니다. 임신 전후 엽산 보충이 신경관결손을 크게 줄인다는 것은 가장 확실한 영양 근거 중 하나지만, MTHFR 유전자 변이를 둘러싼 "활성엽산만 먹어야 한다"는 주장은 과장된 면이 있습니다.',pathways:[{title:"일탄소 대사: DNA 재료와 메틸화 회로",evidence:"strong",steps:[{title:"흡수",body:"음식 속 엽산은 글루탐산 꼬리가 여러 개 달린 형태(폴리글루타메이트)입니다. 소장 표면의 효소(글루타메이트 카복시펩티데이스 II)가 꼬리를 잘라낸 뒤 양성자 연계 엽산 수송체(PCFT)로 흡수됩니다. 음식 엽산의 이용률은 대략 50%, 보충제·강화식품의 합성 엽산(folic acid)은 식사와 함께 먹을 때 약 85%입니다."},{title:"활성형으로 전환",body:"흡수된 엽산은 테트라하이드로엽산(THF)이 되어 아미노산 세린에서 탄소 한 개를 받아 5,10-메틸렌-THF가 됩니다. 합성 엽산은 먼저 디하이드로엽산 환원효소(DHFR)로 환원되어야 하는데, 사람 간의 DHFR 활성이 낮아 고용량을 먹으면 대사되지 않은 엽산이 혈액에 남습니다."},{title:"DNA 재료 공급",body:"5,10-메틸렌-THF는 티미딜산 합성효소에 탄소를 넘겨 DNA 염기 티민(dTMP)을 만듭니다. 엽산이 모자라면 DNA에 우라실이 잘못 끼어들고 세포 분열이 늦어져, 분열이 빠른 골수에서 크고 미숙한 적혈구가 나오는 거대적혈구빈혈이 생깁니다."},{title:"메틸화 회로",body:"MTHFR 효소가 5,10-메틸렌-THF를 5-메틸-THF로 바꾸면, 메티오닌 합성효소(비타민 B12 필요)가 그 메틸기를 호모시스테인에 넘겨 메티오닌을 만듭니다. 메티오닌은 SAMe(S-아데노실메티오닌)가 되어 DNA·신경전달물질·인지질에 메틸기를 공급하는 몸의 주된 메틸 공여체가 됩니다."},{title:"결과",body:"엽산이 충분하면 호모시스테인이 메티오닌으로 재활용되어 혈중 호모시스테인이 내려갑니다. 다만 엽산·B군 보충으로 호모시스테인을 낮춘 여러 대규모 시험에서 심근경색은 줄지 않았고, 뇌졸중은 엽산 강화 정책이 없는 중국의 고혈압 환자 시험(CSPPT)에서 약 21% 줄었습니다."}]},{title:"임신 초기 신경관결손 예방",evidence:"strong",steps:[{title:"신경관이 닫히는 시기",body:"태아의 뇌와 척수가 될 신경관은 수정 후 약 28일 안에 닫힙니다. 많은 여성이 아직 임신 사실을 모르는 시기입니다."},{title:"세포 분열 폭증",body:"이 시기에는 세포가 폭발적으로 분열해 DNA 합성과 메틸화 수요가 급증합니다. 엽산이 모자라면 신경관이 제대로 닫히지 않아 무뇌증·척추갈림증(이분척추) 같은 신경관결손이 생길 수 있습니다."},{title:"사람 근거",body:"1991년 영국 MRC 무작위 시험에서 엽산 보충은 신경관결손 재발을 약 72% 줄였고, 1992년 헝가리 시험에서는 첫 발생도 예방했습니다. 밀가루에 엽산을 의무적으로 강화한 나라들에서도 신경관결손이 줄었습니다."},{title:"권고",body:"임신 가능성이 있는 여성은 적어도 임신 1개월 전부터 임신 초기(12주 무렵)까지 음식과 별도로 합성 엽산 400μg을 매일 먹도록 권고됩니다. 이전에 신경관결손 아이를 가졌던 경우 등 고위험군에게는 의사가 훨씬 높은 용량(4~5mg)을 처방합니다."}]},{title:"MTHFR 변이: 실제 영향과 유행하는 과장",evidence:"contested",steps:[{title:"변이",body:"MTHFR 유전자의 677번 염기가 C에서 T로 바뀐 변이(C677T)가 있으면 효소가 열에 불안정해집니다. 두 유전자 모두 변이인 TT형은 효소 활성이 정상의 약 30%, 하나만 변이인 CT형은 약 65% 수준입니다. TT형은 인구 집단에 따라 차이가 크지만 동아시아·유럽에서 대략 10~20%로 드물지 않습니다."},{title:"실제 영향",body:"TT형은 엽산 섭취가 부족할 때 호모시스테인이 더 높아집니다. 하지만 엽산을 충분히 먹으면 그 차이가 크게 줄어듭니다. 즉 변이의 영향은 엽산 상태에 따라 달라집니다."},{title:"유행하는 주장",body:'"메틸화가 안 되는 체질이라 일반 엽산은 해롭고 활성엽산(5-MTHF, 메틸엽산)만 먹어야 한다", "만성피로·불안·유산의 숨은 원인이다"라는 주장이 건강 콘텐츠에서 널리 퍼져 있습니다.'},{title:"근거",body:"미국 질병통제예방센터(CDC)는 MTHFR 변이가 있어도 일반 엽산이 신경관결손 예방에 효과적이며 같은 용량을 권한다고 밝혔고, 미국 의학유전학회(ACMG)는 혈전 평가나 반복 유산 원인 검사로 MTHFR 유전자형 검사를 권하지 않습니다. 메틸엽산은 대안이 될 수는 있지만 건강 결과에서 더 낫다는 근거는 부족합니다."}]}],evidenceNote:'강한 근거: 임신 전후 엽산 보충의 신경관결손 예방(무작위 대조시험, 강화 정책의 결과), 엽산 결핍에 따른 거대적혈구빈혈. 엽산 보충은 호모시스테인을 확실히 낮추지만 심근경색 예방 효과는 확인되지 않았고, 뇌졸중 감소는 엽산 섭취가 낮은 인구에서 뚜렷했습니다. 암과의 관계는 양면적입니다. 결핍은 DNA 손상을 늘릴 수 있지만, 이미 대장 선종이 있던 사람에게 엽산 1mg을 준 시험에서는 재발이 줄지 않았고 진행성 병변이 늘어나는 경향이 있어, 고용량 보충을 "많을수록 좋다"로 볼 수는 없습니다.',facts:["1μg DFE(식이엽산당량) = 음식 엽산 1μg = 식사와 함께 먹은 합성 엽산 0.6μg입니다. 합성 엽산이 더 잘 흡수되기 때문입니다.","한국인 성인 권장섭취량은 400μg DFE, 상한섭취량은 보충제·강화식품의 합성 엽산 기준 1,000μg입니다. 음식 속 엽산에는 상한이 없습니다.","수용성이고 열·빛·산소에 약해, 오래 삶으면 물로 빠지고 분해되어 절반 이상 줄 수 있습니다. 채소는 짧게 데치거나 찌고, 생채소·과일로도 섭취하세요.","엽산(葉酸)이라는 이름은 1940년대 초 시금치 잎에서 처음 분리되어 붙었습니다. 녹색 잎채소·콩류·아스파라거스·브로콜리·간에 많습니다."],cautions:["합성 엽산을 하루 1,000μg 넘게 먹으면 비타민 B12 결핍으로 생긴 빈혈이 교정되어 결핍이 가려지고, 그 사이 신경 손상은 계속 진행될 수 있습니다. 고령자·채식인이 고용량 엽산을 먹는다면 B12 상태도 확인하세요.","메토트렉세이트(엽산 대사를 막는 약)나 일부 항경련제(페니토인 등)를 복용 중이라면 엽산 보충 여부와 용량을 담당 의사와 정하세요."],refs:["MRC Vitamin Study Research Group. Lancet 1991 — 엽산 보충의 신경관결손 재발 예방 무작위 시험","Czeizel AE, Dudás I. N Engl J Med 1992 — 임신 전 엽산 함유 종합비타민의 신경관결손 첫 발생 예방","Huo Y, et al. JAMA 2015 — 중국 고혈압 성인에서 에날라프릴+엽산의 뇌졸중 1차 예방 (CSPPT)","NIH Office of Dietary Supplements — Folate Fact Sheet for Health Professionals"]},{id:"vitamin-e",name:"비타민 E",en:"Vitamin E (tocopherols and tocotrienols)",aliases:["토코페롤","토코트리에놀","tocopherol","tocotrienol","알파토코페롤","α-토코페롤","vitamin E","비타민E"],kind:"비타민",effect:"benefit",tags:["antioxidant","vascular","immune","liver"],summary:"견과류·씨앗·식물성 기름에 많은 지용성 항산화 비타민입니다. 세포막 속에서 지방이 연쇄적으로 산화되는 반응을 끊는 핵심 방어자이며, 쓰고 난 뒤에는 비타민 C가 되살립니다. 음식으로 먹는 비타민 E는 이롭지만, 심장병·암 예방을 기대한 고용량 보충제 시험들은 이득을 보여주지 못했고 일부에서는 해로운 신호가 나왔습니다.",pathways:[{title:"세포막 지질과산화 연쇄 끊기",evidence:"strong",steps:[{title:"흡수",body:"지용성이라 식사 속 지방·담즙과 함께 미셀에 녹아 흡수되고, 암죽미립(킬로미크론)에 실려 림프를 거쳐 간으로 갑니다. 기름기 없는 식사나 공복에 보충제만 먹으면 흡수가 떨어집니다."},{title:"간의 선별",body:"간의 α-토코페롤 전달 단백질(α-TTP)이 여덟 가지 형태 가운데 α-토코페롤만 골라 VLDL에 실어 혈액으로 내보냅니다. γ-토코페롤·토코트리에놀 등은 CYP4F2 효소로 분해되어 배출되므로, 식단에 γ형이 많아도 혈액과 조직에는 α형이 주로 남습니다."},{title:"막 속 배치",body:"비타민 E는 긴 꼬리를 세포막 지방산 사이에 꽂고, 수산기(-OH)가 달린 크로마놀 고리를 막 표면 쪽에 둡니다. 산화되기 쉬운 다불포화지방산 바로 옆에서 대기하는 셈입니다."},{title:"연쇄 차단",body:"지질과산화 라디칼(LOO•)이 옆 지방산의 수소를 빼앗기 전에, 비타민 E가 훨씬 빠르게 자기 수소를 내줍니다. 그 결과 생긴 토코페록실 라디칼은 비교적 안정해 연쇄를 더 퍼뜨리지 않으므로, 산화 연쇄 반응이 거기서 끊깁니다."},{title:"재생",body:"막 표면에서 비타민 C가 토코페록실 라디칼에 전자를 주어 비타민 E를 되살리고, 비타민 C는 다시 글루타티온·NADPH 계통으로 회복됩니다. 그래서 항산화 비타민은 하나만 많이 먹기보다 서로 짝을 이룰 때 제대로 작동합니다."}]},{title:"고용량 보충제: 기대와 다른 시험 결과",evidence:"strong",steps:[{title:"가설",body:"산화 LDL이 동맥경화의 핵심이라면, 비타민 E로 LDL 산화를 막아 심장병을 예방할 수 있을 것이라 기대했습니다. 1990년대 관찰연구에서는 비타민 E 보충제를 먹는 사람의 심장병 위험이 낮았습니다."},{title:"심혈관 시험",body:"HOPE 시험(고위험 환자 약 9,500명, 천연형 400IU, 평균 4.5년)에서 심근경색·뇌졸중·심혈관 사망은 줄지 않았고, 연장 추적(HOPE-TOO)에서는 심부전이 오히려 늘었습니다. 미국 남성 의사 대상 시험(PHS II)에서도 이득이 없었고 출혈성 뇌졸중이 늘어나는 경향이 있었습니다."},{title:"암 시험",body:"SELECT 시험에서 남성 약 3만 5천 명이 합성형 비타민 E 400IU를 매일 먹었더니, 연장 추적에서 전립선암이 위약군보다 약 17% 많았습니다."},{title:"해석",body:"이미 결핍이 아닌 사람에게 α형 한 가지만 고용량으로 주면 추가 이득이 없고, 혈중 γ-토코페롤을 떨어뜨리거나 고농도에서 산화를 부추기는 쪽으로 작용할 가능성이 제기됩니다. 관찰연구의 이득은 보충제를 먹는 사람들의 건강한 생활습관이 섞인 결과였을 가능성이 큽니다."}]},{title:"비알코올성 지방간염의 치료 보조",evidence:"moderate",steps:[{title:"간세포의 산화 부담",body:"지방이 쌓인 간세포에서는 지방산 산화가 늘며 활성산소가 많아지고, 지질과산화가 염증과 섬유화를 부추깁니다."},{title:"임상시험",body:"PIVENS 시험에서 당뇨병이 없는 비알코올성 지방간염 환자가 천연형 비타민 E 800IU를 약 2년 동안 먹었을 때, 위약보다 간 조직의 지방·염증이 개선된 비율이 높았습니다."},{title:"한계",body:"당뇨병·간경변 환자에 대한 근거는 부족하고 고용량 장기 복용의 안전성(출혈, 전립선암 신호) 문제가 있어, 조직검사 등으로 진단받은 환자에게 의사가 판단해 쓰는 치료입니다. 일반인의 지방간 예방용이 아닙니다."}]}],evidenceNote:"확실한 것: 비타민 E는 세포막 지질과산화 연쇄를 끊는 주요 지용성 항산화제이며, 결핍 시(지방 흡수장애, α-TTP 유전 결손) 운동실조·말초신경병증이 생깁니다. 대규모 무작위 대조시험: 400IU 이상의 보충제는 심혈관질환·암을 예방하지 못했고, SELECT에서는 전립선암이 늘었습니다. 고용량 보충이 전체 사망을 늘릴 수 있다는 메타분석도 있지만 논쟁이 있습니다. 견과류·씨앗으로 먹는 비타민 E는 다른 영양소와 함께 오며 이런 우려와 거리가 멉니다.",facts:["비타민 E는 토코페롤 4종(α·β·γ·δ)과 토코트리에놀 4종을 합친 이름입니다. 몸이 유지하는 것은 주로 α-토코페롤이며, 영양 기준(mg α-TE)도 이것을 기준으로 합니다.","천연형(RRR-α, d-α)은 1IU가 약 0.67mg, 합성형(all-rac-α, dl-α)은 1IU가 약 0.45mg입니다. 합성형은 8가지 입체이성질체 중 절반만 α-TTP가 인식해 같은 mg이라도 활성이 낮습니다.","100g당 약: 해바라기씨 35mg, 아몬드 26mg. 다불포화지방이 많은 기름일수록 비타민 E도 함께 많아, 기름 자체의 산화를 막는 천연 방부제 역할을 합니다. 기름을 고온에서 오래 쓰면 비타민 E가 먼저 소모됩니다.","한국인 성인 충분섭취량은 12mg α-TE, 상한섭취량은 540mg입니다."],cautions:["고용량 보충제(하루 400IU 이상)는 이득 근거가 없고, 혈소판 기능과 비타민 K 의존 응고를 방해해 와파린 등 항응고제·항혈소판제와 함께 먹으면 출혈 위험이 커질 수 있습니다.","수술을 앞두고 있다면 고용량 비타민 E 보충제를 복용 중인지 의료진에게 알리세요."],refs:["Yusuf S, et al. N Engl J Med 2000 — HOPE 시험: 비타민 E 400IU의 심혈관 사건 예방 효과 없음","Klein EA, et al. JAMA 2011 — SELECT 연장 추적: 비타민 E 400IU 보충군의 전립선암 증가","Sanyal AJ, et al. N Engl J Med 2010 — PIVENS: 비당뇨 비알코올성 지방간염에서 비타민 E 800IU","NIH Office of Dietary Supplements — Vitamin E Fact Sheet for Health Professionals"]},{id:"vitamin-d",name:"비타민 D",en:"Vitamin D",aliases:["비타민D","비타민 D3","비타민 D2","콜레칼시페롤","에르고칼시페롤","cholecalciferol","ergocalciferol","칼시트리올","25(OH)D","햇빛 비타민"],kind:"비타민",effect:"benefit",tags:["bone-muscle","immune","autoimmune","hormone"],summary:"햇빛(UVB)을 받은 피부에서 주로 만들어지고 간과 신장을 거쳐 호르몬처럼 활성화되는 지용성 비타민입니다. 장의 칼슘 흡수를 조절해 뼈를 지키고 면역세포에도 작용합니다. 결핍을 교정하는 것은 확실히 중요하지만, 충분한 사람이 보충제를 더 먹어 암·심장병을 예방한다는 기대는 대규모 시험에서 확인되지 않았습니다.",pathways:[{title:"햇빛 → 간 → 신장 → 비타민 D 수용체: 칼슘 흡수",evidence:"strong",steps:[{title:"피부 합성",body:"피부의 7-디하이드로콜레스테롤이 UVB(290~315nm)를 받아 프리비타민 D3가 되고, 체온에 의해 비타민 D3로 바뀝니다. 햇빛을 오래 받으면 여분은 비활성 물질(루미스테롤 등)로 바뀌어 햇빛만으로는 과잉이 생기지 않습니다. 겨울철, 자외선 차단제, 실내 생활, 짙은 피부색, 고령에서는 합성이 크게 줄어듭니다."},{title:"간에서 25(OH)D",body:"피부에서 만들거나 먹은 비타민 D는 간의 25-수산화효소(CYP2R1)에 의해 25(OH)D(칼시디올)가 됩니다. 반감기가 2~3주로 길어, 혈액검사에서 비타민 D 상태를 볼 때 이 값을 측정합니다."},{title:"신장에서 활성형",body:"혈중 칼슘이 낮으면 부갑상선호르몬(PTH)이 신장의 1α-수산화효소(CYP27B1)를 켜서 활성형 1,25(OH)2D(칼시트리올)를 만듭니다. FGF23과 높은 칼슘은 이 과정을 억제하고, CYP24A1 효소가 활성형을 분해해 과잉을 막습니다."},{title:"비타민 D 수용체(VDR)",body:"칼시트리올은 세포핵의 비타민 D 수용체에 결합해 RXR과 짝을 이룬 뒤, DNA의 비타민 D 반응 요소(VDRE)에 붙어 여러 유전자의 발현을 조절합니다."},{title:"결과",body:"소장 세포의 칼슘 통로(TRPV6)와 칼슘 운반 단백질(칼빈딘)이 늘어 칼슘 흡수가 증가합니다. 비타민 D가 부족하면 칼슘 흡수가 떨어지고 PTH가 올라 뼈에서 칼슘이 빠져나가, 어린이는 구루병, 성인은 골연화증이 생기고 골다공증이 악화됩니다."}]},{title:"면역 조절",evidence:"moderate",steps:[{title:"면역세포의 자체 활성화",body:"대식세포·수지상세포·T세포는 비타민 D 수용체와 1α-수산화효소를 모두 가지고 있어, 혈중 25(OH)D를 가져다 세포 안에서 직접 활성형으로 바꿔 씁니다."},{title:"선천면역",body:"대식세포가 세균 신호를 감지하면 비타민 D 경로가 켜져 항균 펩타이드 카텔리시딘(LL-37) 생성이 늘어납니다."},{title:"적응면역",body:"수지상세포의 성숙을 늦추고 Th1·Th17 같은 공격적인 T세포 반응을 누르며 조절 T세포(Treg)를 늘리는 쪽으로 작용합니다. 이것이 자가면역질환 억제 가설의 근거입니다."},{title:"사람 근거",body:"VITAL 시험의 보조 연구(약 2만 6천 명, 하루 2,000IU, 약 5년)에서 류마티스관절염·건선·자가면역 갑상선질환 등 자가면역질환 발생이 22% 줄었습니다. 급성 호흡기 감염은 결핍자가 매일 복용할 때 소폭 줄었다는 메타분석이 있습니다."}],note:"자가면역질환 감소는 단일 대형 시험의 결과로, 재현 연구가 더 필요합니다."},{title:"보충제 대형 시험: 기대보다 작은 효과",evidence:"strong",steps:[{title:"관찰연구의 연관",body:"혈중 비타민 D가 낮은 사람은 암·심혈관질환·우울증·사망 위험이 높았습니다."},{title:"교란 요인",body:"아프거나 실내 생활이 많거나 비만한 사람은 햇빛 노출이 적고 비타민 D가 지방조직에 격리되어 혈중 농도가 낮습니다. 낮은 비타민 D가 병의 원인이 아니라 결과·표지일 수 있습니다."},{title:"VITAL 시험",body:"결핍을 선별하지 않은 미국 성인에게 하루 2,000IU를 약 5년 준 결과, 침습성 암과 주요 심혈관 사건은 줄지 않았고 골절도 줄지 않았습니다. 암 사망은 첫 1~2년을 제외한 분석에서 감소 경향이 있었습니다."},{title:"결론",body:"결핍을 교정하는 것은 뼈 건강에 중요하지만, 이미 충분한 사람이 더 먹는다고 추가 이득이 생기지는 않습니다. 연 1회 초고용량 투여는 오히려 낙상·골절을 늘린 시험도 있습니다."}]}],evidenceNote:'강한 근거: 비타민 D 결핍은 구루병·골연화증을 일으키며 칼슘 흡수와 뼈 대사에 필수입니다. 대규모 무작위 대조시험(VITAL)에서 결핍을 선별하지 않은 일반 성인의 암·심혈관질환·골절은 줄지 않았습니다. 같은 시험의 보조 분석에서 자가면역질환이 22% 줄었지만 단일 시험 결과이며, 급성 호흡기 감염은 결핍자에서 소폭 줄었다는 메타분석이 있습니다. "비타민 D가 낮으면 여러 병이 많다"는 관찰 연관은 상당 부분 건강 상태·비만·실내 생활의 영향으로 해석됩니다.',facts:["1μg = 40IU입니다. 한국인 충분섭취량은 성인 10μg(400IU), 65세 이상 15μg(600IU), 상한섭취량은 100μg(4,000IU)입니다.","음식으로는 기름진 생선(연어·고등어·청어·정어리)이 가장 좋은 공급원이고, 달걀노른자와 간에는 적게 들어 있습니다. 햇볕이나 자외선에 말린 버섯은 에르고스테롤이 비타민 D2로 바뀌어 함량이 늘어납니다.","D3(콜레칼시페롤)가 D2(에르고칼시페롤)보다 혈중 25(OH)D를 올리고 유지하는 데 더 효과적이라는 메타분석이 있습니다.","국민건강영양조사 분석들에서 한국 성인의 절반 이상이 혈중 25(OH)D 20ng/mL 미만으로 보고되어 왔습니다. 실내 생활, 자외선 차단, 겨울철의 약한 UVB가 주된 이유입니다.","지용성이라 지방이 있는 식사와 함께 먹을 때 잘 흡수되고, 비만한 사람은 같은 용량에도 혈중 농도가 덜 오릅니다."],cautions:["고용량을 장기간(대개 하루 10,000IU 이상을 수개월) 먹으면 고칼슘혈증으로 구역·갈증·다뇨·신장결석·부정맥이 생길 수 있습니다. 연 1회 50만IU 같은 초고용량 몰아 먹기는 고령 여성의 낙상·골절을 늘린 시험이 있어 권하지 않습니다.","사르코이드증 같은 육아종 질환, 부갑상선기능항진증이 있거나 티아지드 이뇨제를 복용 중이면 고칼슘혈증 위험이 커지므로 보충 전에 의사와 상의하세요."],refs:["Manson JE, et al. N Engl J Med 2019 — VITAL: 비타민 D 2,000IU와 암·심혈관질환 (전체 감소 없음)","Hahn J, et al. BMJ 2022 — VITAL 보조 연구: 비타민 D 보충 후 자가면역질환 22% 감소","LeBoff MS, et al. N Engl J Med 2022 — VITAL: 일반 성인에서 비타민 D 보충의 골절 예방 효과 없음","NIH Office of Dietary Supplements — Vitamin D Fact Sheet for Health Professionals"]},{id:"vitamin-b12",name:"비타민 B12",en:"Vitamin B12 (cobalamin)",aliases:["코발라민","cobalamin","메틸코발라민","시아노코발라민","B12","비타민B12","내인자","악성빈혈"],kind:"비타민",effect:"benefit",tags:["brain","energy"],summary:"코발트를 품은 비타민으로 오직 미생물만 만들 수 있어, 사람은 고기·생선·조개·달걀·유제품 같은 동물성 식품에서 얻습니다. 위산과 내인자가 있어야 흡수되기 때문에 채식인뿐 아니라 위축성 위염이 있는 고령자, 메트포르민·위산억제제를 오래 복용하는 사람도 결핍 위험이 큽니다. 결핍되면 빈혈과 되돌리기 어려운 신경 손상이 생깁니다.",pathways:[{title:"흡수의 여정: 위산 → 내인자 → 회장",evidence:"strong",steps:[{title:"위에서 분리",body:"음식 속 B12는 단백질에 묶여 있어, 위산과 펩신이 단백질을 분해해야 풀려납니다. 풀려난 B12는 침에서 나온 합토코린(R-단백질)에 먼저 붙습니다."},{title:"십이지장에서 갈아타기",body:"췌장 효소가 합토코린을 분해하면, B12는 위벽세포가 분비한 내인자(intrinsic factor)와 결합합니다."},{title:"회장 끝에서 흡수",body:"내인자-B12 복합체는 소장 마지막 부분(회장 말단)의 큐빌린 수용체에 붙어 흡수됩니다. 이 경로는 한 번에 약 1.5~2μg에서 포화됩니다. 내인자 없이 확산으로 흡수되는 양은 약 1%라서, 1,000μg 같은 고용량 경구제는 내인자가 없어도 필요량을 채울 수 있습니다."},{title:"운반과 저장",body:"혈액에서는 트랜스코발라민에 실려 세포로 들어가고, 간에 수 mg이 저장됩니다. 그래서 섭취나 흡수가 끊겨도 결핍 증상은 보통 몇 년에 걸쳐 서서히 나타납니다."}]},{title:"두 효소: 적혈구와 신경을 지키는 원리",evidence:"strong",steps:[{title:"메티오닌 합성효소",body:"메틸코발라민 형태로 5-메틸-THF의 메틸기를 호모시스테인에 넘겨 메티오닌을 만들고, 엽산을 다시 쓸 수 있는 THF로 되돌립니다."},{title:"메틸엽산 함정",body:"B12가 없으면 엽산이 5-메틸-THF 형태에 갇혀 DNA 합성에 쓰이지 못합니다. 그 결과 엽산 결핍과 똑같은 거대적혈구빈혈이 생기고 호모시스테인이 오릅니다."},{title:"메틸말로닐-CoA 뮤타아제",body:"미토콘드리아에서 아데노실코발라민 형태로 메틸말로닐-CoA를 숙시닐-CoA로 바꿔, 홀수 사슬 지방산과 일부 아미노산을 에너지 회로(TCA 회로)로 보냅니다. B12가 부족하면 메틸말로닐산(MMA)이 쌓이며, 이것이 결핍을 확인하는 민감한 검사 지표입니다."},{title:"신경 손상",body:"메틸화 저하와 비정상 지방산 축적이 신경 수초(미엘린)를 손상시키는 것으로 설명됩니다. 손발 저림, 균형 감각 저하, 보행 장애(아급성 연합 척수변성), 기억력 저하·우울이 생길 수 있고, 빈혈 없이 신경 증상이 먼저 오기도 합니다. 늦게 발견하면 회복되지 않을 수 있습니다."}]},{title:"결핍 위험이 커지는 조건",evidence:"moderate",steps:[{title:"위산·내인자 부족",body:"고령자의 10~30%에게 있는 위축성 위염은 음식 단백질에서 B12를 떼어내지 못하게 합니다. 헬리코박터 감염과 위축성 위염이 흔한 한국에서 특히 중요합니다. 내인자에 대한 자가항체가 생기는 악성빈혈이나 위절제 수술 후에도 흡수가 크게 떨어집니다."},{title:"약물",body:"메트포르민을 오래 복용하면 B12 결핍이 늘어난다는 것이 당뇨병예방프로그램(DPP) 장기 추적에서 확인됐습니다. 위산억제제(PPI·H2 차단제)를 2년 이상 쓴 사람에게 결핍이 많았다는 대규모 환자-대조군 연구도 있습니다."},{title:"채식",body:"동물성 식품을 전혀 먹지 않는 비건은 몇 년 안에 결핍될 수 있어 강화식품이나 보충제가 사실상 필수입니다. 비건 어머니가 모유 수유하는 영아는 저장량이 적어 더 빨리 결핍 증상(발달 지연 등)이 나타날 수 있습니다."},{title:"대처",body:"보충제·강화식품의 결정형 B12는 단백질에서 떼어낼 필요가 없어 위축성 위염이 있어도 흡수됩니다. 악성빈혈처럼 내인자가 없으면 고용량 경구제나 주사로 보충합니다."}]}],evidenceNote:"강한 근거: B12 결핍은 거대적혈구빈혈과 되돌리기 어려운 신경 손상을 일으키며, 보충으로 예방·치료됩니다. 메트포르민 장기 복용과 B12 저하는 무작위 시험의 장기 추적에서 확인되어 당뇨병 진료 지침이 정기 검사를 권합니다. 위산억제제와의 연관은 관찰연구 근거입니다. 결핍이 없는 사람에게 B12 주사나 고용량 보충이 피로 해소·기억력 향상에 도움이 된다는 근거는 부족합니다.",facts:["조개류(바지락·꼬막)와 간은 100g에 권장량의 수십 배가 들어 있고, 생선·육류·달걀·우유도 좋은 공급원입니다. 한국인 성인 권장섭취량은 2.4μg입니다.","달걀 속 B12는 흡수율이 10%에 못 미쳐 다른 동물성 식품보다 이용률이 낮습니다.","스피룰리나의 B12는 대부분 사람에게 작용하지 않는 유사체(슈도비타민 B12)입니다. 김에는 활성형이 일부 있다는 보고가 있지만 함량 편차가 커서 채식인의 믿을 만한 공급원으로 권하지 않습니다.","혈청 B12가 경계 수준일 때는 메틸말로닐산(MMA)·호모시스테인을 함께 측정하면 결핍을 더 정확히 가릴 수 있습니다.","독성이 낮아 상한섭취량이 정해져 있지 않습니다."],cautions:["채식인, 50세 이상, 메트포르민·위산억제제 장기 복용자, 위절제 수술을 받은 사람은 정기적으로 B12 상태를 확인하세요.",'아산화질소(휘핑크림 가스, 이른바 "해피벌룬") 흡입은 B12를 불활성화해 짧은 기간에도 척수 손상을 일으킨 사례가 있습니다.',"고용량 엽산을 먹으면 B12 결핍 빈혈이 가려져 신경 손상 발견이 늦어질 수 있습니다."],refs:["Stabler SP. N Engl J Med 2013 — Vitamin B12 deficiency (임상 리뷰)","Aroda VR, et al. J Clin Endocrinol Metab 2016 — 당뇨병예방프로그램 장기 추적: 메트포르민과 B12 결핍","Lam JR, et al. JAMA 2013 — 위산억제제 장기 사용과 B12 결핍 (환자-대조군 연구)","NIH Office of Dietary Supplements — Vitamin B12 Fact Sheet for Health Professionals"]},{id:"magnesium",name:"마그네슘",en:"Magnesium",aliases:["Mg","magnesium","마그네슘 보충제","산화마그네슘","구연산마그네슘"],kind:"무기질·영양소",effect:"benefit",tags:["energy","bone-muscle","blood-sugar","vascular","brain"],summary:"견과류·씨앗·통곡물·녹색 채소·콩에 많은 무기질로, 몸속 ATP는 마그네슘과 짝을 이룬 Mg-ATP 형태로 작동합니다. 300가지가 넘는 효소 반응을 돕고 칼슘 통로와 신경 수용체를 조절해 근육·신경·혈관을 안정시킵니다. 정제 곡물 위주 식단에서는 부족하기 쉽지만, 보충제의 효과는 흔히 알려진 것보다 작습니다.",pathways:[{title:"Mg-ATP: 에너지 대사의 짝",evidence:"strong",steps:[{title:"흡수",body:"섭취한 마그네슘의 약 30~40%가 흡수됩니다. 소장에서는 세포 사이 틈으로 수동 흡수되고, 원위 소장과 대장에서는 TRPM6·TRPM7 통로로 능동 흡수됩니다. 적게 먹을수록 흡수율이 올라갑니다."},{title:"콩팥의 조절",body:"걸러진 마그네슘의 대부분은 콩팥의 헨레 고리와 원위세관(TRPM6)에서 다시 흡수됩니다. 균형을 콩팥이 맞추기 때문에 신장 기능이 떨어지면 마그네슘이 쌓입니다."},{title:"ATP와 결합",body:"세포 속 ATP는 대부분 마그네슘 이온과 결합한 Mg-ATP로 존재합니다. 인산기를 옮기는 키나아제는 Mg-ATP를 실제 기질로 인식하므로, 해당과정(헥소키나아제 등), DNA·단백질 합성, 이온 펌프(Na/K-ATPase)가 모두 마그네슘에 의존합니다."},{title:"결과",body:"마그네슘이 심하게 모자라면 에너지 대사와 이온 균형이 흐트러져 저칼륨혈증·저칼슘혈증이 함께 오고, 근육 떨림·경련·부정맥이 생길 수 있습니다. 이때는 마그네슘을 먼저 채워야 칼륨·칼슘도 교정됩니다."}]},{title:"칼슘의 문지기: 신경·근육·혈관 안정",evidence:"moderate",steps:[{title:"NMDA 수용체",body:"신경세포의 NMDA 수용체 통로를 마그네슘 이온이 막고 있다가 충분한 자극이 올 때만 비켜납니다. 과도한 칼슘 유입과 흥분을 막는 안전장치입니다."},{title:"근육 이완",body:"칼슘이 들어오면 근육이 수축하고, 근소포체 펌프(SERCA)가 Mg-ATP를 써서 칼슘을 다시 거둬들여야 이완됩니다. 마그네슘은 L형 칼슘 통로를 통한 칼슘 유입도 조절합니다."},{title:"혈관",body:"혈관 평활근의 칼슘 유입이 줄어 이완이 쉬워집니다. 무작위 대조시험 메타분석에서 하루 약 300~400mg을 3개월가량 보충하면 수축기 혈압이 평균 약 2mmHg 내려갔습니다."},{title:"확실한 쓰임과 한계",body:"황산마그네슘 주사는 자간증 경련 예방의 표준 치료입니다. 반면 고령자의 흔한 야간 다리 경련에는 마그네슘 보충제가 효과가 거의 없다는 코크란 고찰이 있습니다."}]},{title:"인슐린 신호와 혈당",evidence:"moderate",steps:[{title:"수용체 활성화",body:"인슐린이 수용체에 붙으면 수용체의 티로신 키나아제가 스스로를 인산화해야 신호가 전달되는데, 여기에도 Mg-ATP가 필요합니다."},{title:"결핍의 악순환",body:"세포 속 마그네슘이 낮으면 인슐린 신호가 약해지고, 고혈당은 소변으로 마그네슘 배출을 늘려 다시 부족해지는 악순환이 생깁니다."},{title:"사람 근거",body:"전향적 코호트 메타분석에서 마그네슘 섭취가 많을수록 제2형 당뇨병 위험이 낮았고, 보충 시험에서는 당뇨병이나 저마그네슘혈증이 있는 사람의 공복혈당·인슐린 저항성이 소폭 개선됐습니다. 마그네슘이 충분한 사람에게 추가 보충의 이득은 불분명합니다."}]}],evidenceNote:"확실한 것: 필수 무기질이며, 심한 결핍은 저칼륨·저칼슘혈증·부정맥·경련을 일으킵니다. 황산마그네슘은 자간증 치료의 표준입니다. 중간 근거: 섭취가 많을수록 제2형 당뇨병·고혈압 위험이 낮은 관찰 연관이 일관되고, 보충 시험에서 혈압이 소폭 내려갑니다. 약한 근거: 수면·불안·피로 개선 주장은 소규모 시험이 대부분이며, 편두통 예방은 일부 시험에서 효과가 있었습니다. 근육 경련에는 효과가 거의 없습니다.",facts:["몸속 마그네슘 약 25g 중 50~60%는 뼈에, 나머지 대부분은 세포 안에 있고 혈청에는 1% 미만입니다. 그래서 혈액 검사가 정상이어도 몸 전체로는 부족할 수 있습니다.","100g당 약: 호박씨 590mg, 아몬드 270mg, 시금치 79mg. 엽록소 분자의 중심 금속이 마그네슘이라 진한 녹색 채소에 많습니다.","곡물을 도정하면 겨·배아와 함께 대부분 사라져, 흰 밀가루의 마그네슘은 통밀가루보다 80% 안팎 적습니다. 현미·통곡물이 백미·흰 밀가루보다 훨씬 좋은 공급원입니다.","보충제 중 산화마그네슘은 함량은 높지만 흡수율이 낮아 변비약으로도 쓰이고, 구연산·글리시네이트 형태는 상대적으로 흡수가 잘 되는 편입니다.","보충제·약품으로 먹는 마그네슘의 상한섭취량은 성인 350mg입니다(음식 속 마그네슘은 제외)."],cautions:["보충제는 삼투 작용으로 설사를 일으킬 수 있습니다.","신장 기능이 떨어진 사람은 고마그네슘혈증(저혈압·근력 저하·부정맥) 위험이 있어, 마그네슘이 든 변비약·제산제·보충제를 의사와 상의하세요.","테트라사이클린·퀴놀론 항생제, 골다공증약(비스포스포네이트)의 흡수를 방해하므로 최소 2시간 간격을 두세요. 위산억제제(PPI)를 오래 쓰면 저마그네슘혈증이 생길 수 있습니다."],refs:["Zhang X, et al. Hypertension 2016 — 마그네슘 보충의 혈압 효과: 무작위 대조시험 메타분석","Garrison SR, et al. Cochrane Database Syst Rev 2020 — 근육 경련에 대한 마그네슘","NIH Office of Dietary Supplements — Magnesium Fact Sheet for Health Professionals"]},{id:"potassium",name:"칼륨",en:"Potassium",aliases:["K","포타슘","potassium","대체소금","저나트륨 소금","칼륨소금","나트륨 칼륨 비율"],kind:"무기질·영양소",effect:"benefit",tags:["vascular","bone-muscle"],summary:"채소·과일·콩·감자에 많은, 세포 안의 주된 양이온입니다. 콩팥에서 나트륨 배출을 늘리고 혈관을 이완시켜 혈압을 낮추며, 섭취가 많을수록 뇌졸중 위험이 낮습니다. 짜게 먹는 한국 식단에서 특히 중요하지만, 신장 기능이 떨어졌거나 특정 혈압약을 먹는 사람은 고칼륨혈증에 주의해야 합니다.",pathways:[{title:"나트륨 배출과 혈관 이완 → 혈압 저하",evidence:"strong",steps:[{title:"흡수",body:"음식 속 칼륨의 약 85~90%가 소장에서 흡수되고, 인슐린 등의 신호로 대부분 곧바로 세포 안으로 들어갑니다. 여분은 주로 소변으로 나갑니다."},{title:"콩팥의 나트륨 스위치",body:"칼륨을 충분히 먹으면 콩팥 원위세관의 WNK–SPAK 신호가 약해져 나트륨-염소 공동수송체(NCC, 티아지드 이뇨제의 표적)가 덜 작동합니다. 나트륨이 덜 재흡수되어 소변으로 더 나가므로, 칼륨이 자연 이뇨제처럼 작용합니다."},{title:"혈관 이완",body:"혈관 평활근에서 Na/K-ATPase와 내향정류 칼륨 통로(Kir)의 활성이 커지면 세포막이 과분극되어 칼슘 유입이 줄고 혈관이 넓어집니다."},{title:"결과",body:"무작위 대조시험 메타분석에서 칼륨 섭취를 늘리면 수축기 혈압이 평균 약 3.5mmHg 내려갔고(고혈압인 사람에서 더 큼), 코호트에서는 섭취가 많은 사람의 뇌졸중 위험이 약 24% 낮았습니다. 소금 일부를 염화칼륨으로 바꾼 중국 농촌 대규모 시험(SSaSS)에서는 뇌졸중이 14%, 사망이 12% 줄었습니다."}]},{title:"세포막 전위와 심장 리듬",evidence:"strong",steps:[{title:"Na/K-ATPase 펌프",body:"ATP 하나를 써서 나트륨 3개를 세포 밖으로, 칼륨 2개를 세포 안으로 옮깁니다. 몸속 칼륨의 약 98%가 세포 안에 있습니다."},{title:"막전위",body:"세포 안팎의 칼륨 농도 차이가 신경·근육·심장 세포의 휴지 막전위를 결정합니다. 혈중 칼륨이 좁은 정상 범위(대략 3.5~5.0mmol/L)를 벗어나면 흥분성이 흐트러집니다."},{title:"콩팥의 조절",body:"알도스테론이 콩팥 집합관에서 칼륨 배출을 늘려 균형을 맞춥니다. 신장이 건강하면 음식으로 먹는 칼륨이 과잉될 일은 거의 없습니다."},{title:"이상이 생기면",body:"설사·구토·이뇨제로 칼륨이 부족하면 근력 저하·부정맥이 생기고, 신장 배출이 막힌 상태에서 칼륨이 쌓이면 심장 전도 이상과 심정지까지 올 수 있습니다."}]}],evidenceNote:"강한 근거: 칼륨 섭취 증가는 혈압을 낮추며(무작위 대조시험 메타분석), 칼륨 함유 대체소금은 뇌졸중·심혈관 사건·사망을 줄였습니다(SSaSS, 뇌졸중 병력이 있거나 60세 이상 고혈압인 약 2만 1천 명). 관찰연구에서 칼륨 섭취가 많을수록 뇌졸중 위험이 낮습니다. 다만 대체소금 시험은 신장질환자와 칼륨 보충제·칼륨보존 이뇨제 복용자를 제외했으므로, 이들에게 그대로 적용하면 안 됩니다.",facts:["한국인 성인 충분섭취량은 3,500mg이고, 세계보건기구(WHO)는 하루 3,510mg 이상을 권고합니다.","100g당 약: 시금치 560mg, 감자 420mg, 바나나 360mg. 콩·버섯·토마토·고구마·아보카도도 좋은 공급원입니다.","물에 녹는 성질이라 채소를 잘게 썰어 물에 담갔다가 삶고 그 물을 버리면 칼륨이 상당량 빠집니다. 일반인에게는 손실이지만, 칼륨 제한이 필요한 신장질환자에게는 유용한 조리법입니다.","국·찌개·김치·젓갈 위주의 한국 식단은 나트륨이 많아 나트륨:칼륨 비율이 높은 편입니다. 소금을 줄이는 것과 채소·과일로 칼륨을 늘리는 것이 함께 혈압을 낮춥니다.","식품은 가공할수록 칼륨은 줄고 나트륨은 늘어나는 경향이 있습니다."],cautions:["만성콩팥병이 있거나 ACE 억제제·안지오텐신 수용체 차단제(ARB)·칼륨보존 이뇨제(스피로노락톤 등)를 복용 중이면 고칼륨혈증 위험이 있습니다. 칼륨 대체소금·칼륨 보충제·녹즙을 많이 먹기 전에 의사와 상의하세요.","고농도 칼륨 정제는 위장 점막을 손상시킬 수 있어, 칼륨 보충제는 의사 처방에 따라 복용하는 것이 원칙입니다."],refs:["Aburto NJ, et al. BMJ 2013 — 칼륨 섭취와 혈압·심혈관질환 위험 메타분석","Neal B, et al. N Engl J Med 2021 — SSaSS: 칼륨 함유 대체소금과 뇌졸중·사망 감소 (중국 농촌)","WHO 2012 — Guideline: Potassium intake for adults and children","NIH Office of Dietary Supplements — Potassium Fact Sheet for Health Professionals"]},{id:"nonheme-iron",name:"비헴철 (식물성 철)",en:"Non-heme iron",aliases:["비헴철","식물성 철","철분","철","iron","non-heme iron","철분제","빈혈","헵시딘","hepcidin"],kind:"무기질·영양소",effect:"benefit",tags:["energy","brain","immune"],summary:"콩·두부·녹색 채소·곡물·강화식품과 대부분의 철분제에 들어 있는 철로, 식이 철의 대부분을 차지합니다. 흡수율이 헴철보다 낮고 함께 먹는 음식에 크게 좌우됩니다. 비타민 C와 고기는 흡수를 높이고 피트산·차의 탄닌·칼슘은 낮추며, 몸은 헵시딘이라는 호르몬으로 필요한 만큼만 흡수하도록 조절합니다.",pathways:[{title:"흡수: Fe3+ → Fe2+ → DMT1",evidence:"strong",steps:[{title:"위에서 녹이기",body:"식물 속 철은 주로 3가 철(Fe3+)입니다. 위산이 이를 녹여 흡수 가능한 상태로 만들지만, 산도가 낮아지는 십이지장에서는 Fe3+가 다시 녹지 않는 덩어리를 만들기 쉽습니다."},{title:"2가 철로 환원",body:"십이지장 세포 표면의 환원효소(Dcytb)와 음식 속 비타민 C가 Fe3+를 2가 철(Fe2+)로 바꿉니다."},{title:"DMT1로 흡수",body:"Fe2+는 2가 금속 수송체(DMT1)를 통해 장세포 안으로 들어갑니다. 세포 안에서는 페리틴에 저장되거나, 필요할 때 철 출구인 페로포틴을 통해 혈액으로 나갑니다."},{title:"혈액으로",body:"나가는 순간 헤페스틴이 다시 Fe3+로 산화시키고, 트랜스페린에 실려 골수(헤모글로빈 합성)·근육(미오글로빈)·뇌 등으로 운반됩니다."}]},{title:"헵시딘: 몸이 흡수량을 정하는 방식",evidence:"strong",steps:[{title:"철이 충분할 때",body:"간은 철 저장이 충분하면 헵시딘 호르몬을 더 만듭니다."},{title:"페로포틴 차단",body:"헵시딘은 장세포와 대식세포의 철 출구인 페로포틴에 붙어 분해시킵니다. 장세포에 갇힌 철은 며칠 뒤 세포가 떨어져 나갈 때 대변으로 버려집니다."},{title:"부족하거나 염증일 때",body:'철이 부족하거나 적혈구 생성이 늘면 헵시딘이 줄어 흡수가 몇 배로 늘어납니다. 반대로 감염·만성 염증에서는 IL-6가 헵시딘을 올려, 철을 먹어도 잘 흡수되지 않는 "염증성 빈혈"이 생깁니다.'},{title:"복용법에 주는 의미",body:"철분제를 한 번 먹으면 헵시딘이 약 하루 동안 올라가 있어, 격일로 먹을 때가 매일 먹을 때보다 흡수 비율이 높았다는 시험이 있습니다."}]},{title:"식사 속 촉진제와 억제제",evidence:"strong",steps:[{title:"비타민 C",body:"비타민 C는 Fe3+를 Fe2+로 바꾸고 철과 녹는 복합체를 만들어, 같은 끼니의 비헴철 흡수를 몇 배 높일 수 있습니다."},{title:"고기·생선 인자",body:"고기·생선·닭고기를 함께 먹으면 근육 단백질의 소화 산물(시스테인이 든 펩타이드 등)이 철을 녹는 상태로 유지해 비헴철 흡수가 늘어납니다."},{title:"피트산",body:"통곡물·콩·견과의 피트산은 철과 단단히 결합해 흡수를 크게 막습니다. 불리기·발아·발효는 피트산을 분해해 흡수를 개선합니다."},{title:"폴리페놀·칼슘",body:"식사와 함께 마신 홍차·녹차·커피의 탄닌·폴리페놀은 철과 결합해 흡수를 절반 이상 줄일 수 있습니다. 칼슘도 한 끼 흡수를 낮추지만, 장기적으로 철 상태에 주는 영향은 작습니다."}],note:"한 끼 흡수 실험에서는 차이가 크지만, 다양한 식사를 오래 하면 몸이 흡수율을 조절해 실제 철 상태의 차이는 이보다 작습니다."}],evidenceNote:"강한 근거: 비헴철 흡수 기전(Dcytb·DMT1·페로포틴·헵시딘)과 비타민 C·피트산·폴리페놀의 영향은 동위원소 흡수 실험으로 잘 확인됐습니다. 철 결핍은 세계에서 가장 흔한 영양 결핍으로, 가임기 여성·임산부·영유아·청소년에게 빈혈·피로·집중력 저하를 일으킵니다. 철이 충분한 사람이 철분제를 먹어 얻는 이득은 없고, 필요 이상의 철은 위장 불편과 산화 부담을 늘릴 수 있습니다.",facts:["비헴철의 흡수율은 철 상태와 식사 구성에 따라 약 2~20%로, 헴철(15~35%)보다 낮습니다.","미국 기준으로 채식인은 흡수율이 낮은 점을 고려해 일반 권장량의 약 1.8배가 필요하다고 봅니다.","한국인 권장섭취량은 성인 남성 10mg, 19~49세 여성 14mg입니다. 월경이 있는 여성의 필요량이 큽니다.","무쇠 냄비·팬으로 토마토소스처럼 산성인 음식을 조리하면 음식의 철 함량이 늘어납니다.","녹차·커피는 식사와 1~2시간 간격을 두고 마시면 흡수 방해를 줄일 수 있습니다."],cautions:["철분제는 결핍이 확인된 경우에 드세요. 변비·속쓰림이 흔하고, 어린이가 성인용 철분제를 삼키면 치명적 중독이 생길 수 있어 보관에 주의해야 합니다.","철분제는 레보티록신(갑상선약), 테트라사이클린·퀴놀론 항생제, 레보도파의 흡수를 방해하므로 복용 간격을 두세요.","남성이나 폐경 후 여성에게 원인 모를 철결핍빈혈이 있으면 위장관 출혈 등 원인 검사가 먼저입니다."],refs:["Hurrell R, Egli I. Am J Clin Nutr 2010 — 철의 생체이용률과 흡수 촉진·억제 인자","Stoffel NU, et al. Lancet Haematol 2017 — 철분제 격일 복용 시 흡수 비율 증가","NIH Office of Dietary Supplements — Iron Fact Sheet for Health Professionals"]},{id:"heme-iron",name:"헴철 (동물성 철)",en:"Heme iron",aliases:["헴철","동물성 철","heme iron","haem iron","헤모글로빈","미오글로빈","적색육 철"],kind:"무기질·영양소",effect:"mixed",tags:["energy","cancer","blood-sugar","oxidative-risk"],summary:"고기·생선·간·선지·조개에 들어 있는 헤모글로빈·미오글로빈의 철로, 헴 고리째 흡수되어 흡수율(15~35%)이 높고 식물성 억제제의 영향을 덜 받습니다. 철결핍 예방에는 효율적이지만, 흡수 조절이 상대적으로 느슨하고 장 속에서 헴이 N-니트로소화합물 생성과 지질과산화를 촉진한다는 점이 적색육과 대장암 연관의 기전 후보로 연구되고 있습니다.",pathways:[{title:"헴째 흡수 → 철결핍 예방",evidence:"strong",steps:[{title:"소화",body:"위와 소장에서 헤모글로빈·미오글로빈의 단백질 부분이 분해되고, 철을 품은 헴 고리가 떨어져 나옵니다."},{title:"흡수",body:"헴은 통째로 소장 세포 안으로 들어갑니다. 한때 HCP1이 헴 수송체로 제안됐지만 주로 엽산 수송체(PCFT)로 밝혀져, 정확한 흡수 경로는 아직 완전히 밝혀지지 않았습니다. 철이 헴 고리 안에 보호되어 있어 피트산·탄닌의 방해를 거의 받지 않습니다."},{title:"철 꺼내기",body:"장세포 안에서 헴산화효소(HO-1)가 헴 고리를 열어 Fe2+를 꺼내고, 이 철은 비헴철과 같은 경로(페로포틴 → 트랜스페린)로 혈액에 나갑니다."},{title:"결과",body:"육류를 먹는 식단에서 헴철은 섭취 철의 10~15%에 불과하지만 흡수되는 철의 40% 이상을 차지할 수 있고, 함께 먹은 비헴철의 흡수도 높여 철결핍빈혈 예방에 효율적입니다. 다만 흡수 단계의 조절이 비헴철보다 느슨해, 철이 충분한 사람에서도 흡수가 크게 줄지 않습니다."}]},{title:"대장 속 헴: 니트로소화·지질과산화 가설",evidence:"limited",steps:[{title:"대장에 도달",body:"흡수되지 않은 헴은 대장까지 내려갑니다. 적색육을 많이 먹을수록 대장 속 헴이 많아집니다."},{title:"N-니트로소화합물",body:"헴은 장 속에서 N-니트로소화합물(NOC) 생성을 촉매합니다. 사람 식이 시험에서 적색육 섭취를 늘리자 대변의 NOC와, 떨어져 나온 대장 세포의 NOC 관련 DNA 부가물이 늘었습니다."},{title:"지질과산화",body:"헴 철은 장 속 지방의 과산화를 촉매해 말론디알데하이드(MDA)·4-HNE 같은 알데하이드를 만듭니다. 쥐 실험에서 이것이 대장 상피를 손상시키고 세포 증식을 늘렸으며, 칼슘을 함께 주면 헴이 붙잡혀 효과가 줄었습니다."},{title:"역학과의 연결",body:'국제암연구소(IARC)는 역학 근거를 바탕으로 적색육을 "아마도 발암성(2A군)", 가공육을 "발암성(1군)"으로 분류했고, 적색육 하루 100g마다 대장암 위험이 약 17% 증가한다고 추정했습니다. 헴은 이를 설명하는 유력한 후보 기전이지만 유일한 원인으로 확정되지는 않았습니다(고온 조리 부산물·니트로사민 등도 관여).'}],note:"기전 근거는 주로 동물·세포 실험과 소규모 사람 표지자 연구이고, 적색육과 대장암의 연관은 관찰연구 근거입니다."},{title:"철 과부하·산화 스트레스와 제2형 당뇨병",evidence:"limited",steps:[{title:"펜톤 반응",body:"세포 속 유리 철(Fe2+)은 과산화수소와 반응해 매우 공격적인 하이드록실 라디칼(•OH)을 만듭니다."},{title:"취약한 베타세포",body:"인슐린을 만드는 췌장 베타세포는 항산화 효소가 적어 산화 손상에 약합니다. 철이 심하게 쌓이는 유전성 혈색소증 환자에게 당뇨병이 흔한 것이 이 경로의 방증입니다."},{title:"사람 연구",body:"관찰연구 메타분석에서 헴철 섭취와 혈중 페리틴이 높을수록 제2형 당뇨병 위험이 높았습니다. 다만 적색육을 많이 먹는 식습관·비만 같은 교란 요인을 완전히 배제하기 어렵고, 무작위 시험 근거는 없습니다."}]}],evidenceNote:"확실한 것: 헴철은 흡수율이 높아 철결핍빈혈 예방·치료에 효율적인 식품 철입니다. 관찰 근거: 적색육·가공육 섭취와 대장암(IARC 분류), 헴철 섭취와 제2형 당뇨병 위험 증가의 연관이 보고됩니다. 헴이 장 속에서 NOC·지질과산화를 촉진한다는 기전은 동물 실험과 사람 표지자 연구로 뒷받침되는 가설 단계입니다. 결론적으로 철이 필요한 사람(가임기 여성, 성장기, 빈혈)에게는 좋은 공급원이지만, 많이 먹을수록 좋은 것은 아닙니다.",facts:["헴철은 소·양 같은 적색육에 가장 많고 닭고기·생선에는 상대적으로 적습니다. 간·선지·굴·바지락도 철이 매우 풍부합니다.","흡수율은 약 15~35%로 비헴철(약 2~20%)보다 높고 피트산·탄닌의 영향을 거의 받지 않지만, 칼슘은 헴철 흡수도 일부 낮춥니다.","세계암연구기금(WCRF)은 적색육을 조리 후 무게로 주당 350~500g 이하로, 가공육은 가능한 한 적게 먹도록 권합니다.","고기를 채소·콩과 함께 먹으면 헴철과 함께 식물성 비헴철의 흡수도 높아집니다."],cautions:["유전성 혈색소증 등 철 과잉 질환이 있으면 헴철은 조절을 덜 받고 흡수되므로, 간·적색육·철 강화식품 섭취를 의사와 조절하세요.",'빈혈이 없는 성인 남성과 폐경 후 여성은 철 필요량이 적어, 적색육이나 철분제를 "많을수록 좋다"로 볼 이유가 없습니다.'],refs:["Bouvard V, et al. Lancet Oncol 2015 — IARC: 가공육 1군, 적색육 2A군 발암물질 분류","Bastide NM, Pierre FH, Corpet DE. Cancer Prev Res 2011 — 헴철과 대장암: 메타분석과 기전 리뷰","World Cancer Research Fund/AICR, Third Expert Report 2018 — 적색육·가공육 섭취 권고","NIH Office of Dietary Supplements — Iron Fact Sheet for Health Professionals"]},{id:"calcium",name:"칼슘",en:"Calcium",aliases:["Ca","calcium","칼슘 보충제","탄산칼슘","구연산칼슘","칼슘제"],kind:"무기질·영양소",effect:"benefit",tags:["bone-muscle","vascular"],summary:"몸속 칼슘의 99%는 뼈와 치아에 있고, 나머지 1%가 근육 수축·신경 전달·혈액 응고를 조절합니다. 비타민 D가 있어야 잘 흡수되고, 장 속에서는 옥살산과 결합해 신장결석을 오히려 막아 줍니다. 음식 칼슘은 안전하지만, 칼슘 보충제와 심혈관질환의 관계는 논쟁 중입니다.",pathways:[{title:"흡수와 뼈 저장고",evidence:"strong",steps:[{title:"두 가지 흡수 경로",body:"섭취량이 적을 때는 십이지장에서 비타민 D가 늘려 준 칼슘 통로(TRPV6)·칼빈딘 단백질을 통한 능동 흡수가 중심이고, 섭취량이 많을 때는 소장 전체의 세포 사이 틈으로 수동 흡수됩니다. 성인은 섭취한 칼슘의 약 25~30%를 흡수하며, 나이가 들수록 흡수율이 떨어집니다."},{title:"혈중 농도 지키기",body:"혈중 칼슘이 조금만 떨어져도 부갑상선호르몬(PTH)이 나와 신장의 활성 비타민 D 생성을 늘리고(흡수 증가), 신장의 칼슘 재흡수를 늘리며, 뼈에서 칼슘을 꺼냅니다."},{title:"세포 신호",body:"세포 안으로 들어온 칼슘은 근육에서 트로포닌 C에 붙어 수축을 일으키고, 신경 말단에서 신경전달물질 방출을 촉발하며, 혈액 응고 과정에도 쓰입니다."},{title:"결과",body:"섭취가 오랫동안 부족하면 혈중 농도를 지키기 위해 뼈의 칼슘이 계속 빠져나가 골밀도가 떨어집니다. 청소년기에는 최대 골량을 쌓고, 중년 이후에는 손실을 늦추는 것이 목표입니다."}]},{title:"장 속 옥살산 붙잡기: 결석 예방",evidence:"moderate",steps:[{title:"장 속 결합",body:"식사와 함께 먹은 칼슘은 장 속에서 시금치·견과·차 등의 옥살산과 결합해 녹지 않는 옥살산칼슘이 되어 대변으로 나갑니다."},{title:"소변 옥살산 감소",body:"흡수되는 옥살산이 줄어 소변의 옥살산 농도가 내려가고, 신장에서 옥살산칼슘 결석이 만들어질 재료가 줄어듭니다."},{title:"사람 근거",body:"대규모 코호트에서 음식 칼슘을 많이 먹은 사람의 신장결석 위험이 더 낮았고, 결석 재발 환자 무작위 시험에서 정상 칼슘·저염·저동물성단백 식단이 저칼슘 식단보다 재발을 줄였습니다."},{title:"보충제는 다르다",body:"식사와 떨어져 먹는 칼슘 보충제는 옥살산을 붙잡지 못하고 소변 칼슘만 늘릴 수 있습니다. 여성건강연구(WHI) 시험에서 칼슘·비타민 D 보충군의 신장결석이 약 17% 늘었습니다."}]},{title:"칼슘 보충제와 심혈관 논쟁",evidence:"contested",steps:[{title:"흡수 속도 차이",body:"보충제 500~1,000mg을 한 번에 먹으면 음식으로 먹을 때보다 혈중 칼슘이 빠르고 높게 올라 몇 시간 유지됩니다."},{title:"가설",body:"이 급격한 상승이 혈관 석회화나 혈액 응고를 부추길 수 있다는 가설이 제기됐습니다."},{title:"연구 결과",body:"2010년 BMJ 메타분석에서 비타민 D 없이 칼슘 보충제만 먹은 사람의 심근경색 위험이 약 30% 높았지만, 이후 여러 분석에서는 연관이 없거나 약했습니다. 음식 칼슘은 심혈관 위험 증가와 연결되지 않았습니다."},{title:"실제 적용",body:"칼슘은 가능하면 음식으로 채우고, 보충제는 음식으로 부족한 만큼만 나눠 먹는 것이 현재의 합리적 선택입니다. 지역사회 일반 성인에서 칼슘 보충제의 골절 예방 효과도 기대보다 작다는 분석이 있습니다."}]}],evidenceNote:"확실한 것: 칼슘은 뼈의 주성분이며 흡수는 비타민 D에 의존합니다. 음식 칼슘을 충분히 먹는 것은 신장결석 위험을 낮춥니다(코호트와 무작위 시험). 논쟁 중인 것: 칼슘 보충제가 심근경색 위험을 높이는지(메타분석마다 결론이 다름), 그리고 일반 성인에서 칼슘 보충제가 골절을 얼마나 줄이는지(효과가 작거나 일관되지 않음). 결핍 위험이 큰 고령자·골다공증 환자는 비타민 D와 함께 의사 판단에 따라 보충합니다.",facts:["칼슘은 국민건강영양조사에서 한국인이 가장 부족하게 먹는 영양소 중 하나로 꼽힙니다. 한국인 성인 권장섭취량은 700~800mg입니다.","흡수율은 식품마다 달라, 우유 칼슘은 약 30%가 흡수되지만 옥살산이 많은 시금치 칼슘은 약 5%만 흡수됩니다. 케일·청경채처럼 옥살산이 적은 채소는 우유와 비슷하거나 더 잘 흡수됩니다.","두부는 응고제에 따라 칼슘이 크게 달라, 황산칼슘으로 굳힌 두부가 간수(염화마그네슘)로 굳힌 두부보다 칼슘이 많습니다. 뼈째 먹는 멸치·뱅어포도 좋은 공급원입니다.","보충제는 한 번에 500mg 이하로 나눠 먹을 때 흡수가 좋습니다. 탄산칼슘은 위산이 필요해 식사와 함께, 구연산칼슘은 공복에도 흡수됩니다.","나트륨을 많이 먹으면 소변으로 칼슘이 더 빠져나갑니다."],cautions:["보충제로 상한섭취량(성인 하루 2,000~2,500mg)을 넘기면 고칼슘혈증·신장결석·변비 위험이 커집니다.","칼슘은 철·아연, 레보티록신(갑상선약), 테트라사이클린·퀴놀론 항생제, 비스포스포네이트의 흡수를 방해하므로 복용 간격을 두세요."],refs:["Bolland MJ, et al. BMJ 2010 — 칼슘 보충제와 심근경색 위험 메타분석","Curhan GC, et al. N Engl J Med 1993 — 식이 칼슘 섭취와 신장결석 위험 (코호트)","Borghi L, et al. N Engl J Med 2002 — 정상 칼슘·저염·저동물성단백 식단과 결석 재발 (무작위 시험)","NIH Office of Dietary Supplements — Calcium Fact Sheet for Health Professionals"]},{id:"iodine",name:"요오드",en:"Iodine",aliases:["아이오딘","iodine","요오드화칼륨","KI","갑상선","다시마 요오드","해조류"],kind:"무기질·영양소",effect:"mixed",tags:["hormone","brain","energy","autoimmune"],summary:"갑상선호르몬(T4·T3)의 핵심 재료로, 부족하면 갑상선종과 아이의 뇌 발달 장애를 일으키고 너무 많아도 갑상선 기능을 떨어뜨립니다. 해조류를 즐겨 먹는 한국인은 세계적으로 요오드 섭취가 많은 편이라, 결핍보다 과잉을 더 신경 써야 하는 드문 영양소입니다.",pathways:[{title:"갑상선호르몬 만들기",evidence:"strong",steps:[{title:"흡수",body:"음식 속 요오드는 요오드화물(I−)로 바뀌어 위와 십이지장에서 90% 이상 흡수됩니다."},{title:"갑상선으로 모으기",body:"갑상선 세포의 나트륨-요오드 공동수송체(NIS)가 혈중 요오드를 끌어모읍니다. 몸속 요오드의 대부분이 갑상선에 있습니다."},{title:"TPO의 결합 반응",body:"갑상선 과산화효소(TPO)가 과산화수소를 이용해 요오드를 산화시키고 티로글로불린 단백질의 티로신에 붙입니다(MIT·DIT). 이것이 짝지어 T4(요오드 4개)와 T3(요오드 3개)가 됩니다."},{title:"활성화와 작용",body:"분비된 T4는 조직에서 탈요오드화효소(셀레늄을 함유한 효소)에 의해 활성형 T3로 바뀌고, T3는 핵 속 갑상선호르몬 수용체에 결합해 기초대사량·체온·심박수와 뇌 발달 유전자를 조절합니다."}]},{title:"결핍: 갑상선종과 뇌 발달 장애",evidence:"strong",steps:[{title:"호르몬 부족",body:"요오드가 모자라 호르몬이 부족해지면 뇌하수체가 갑상선자극호르몬(TSH)을 더 분비합니다."},{title:"갑상선종",body:"TSH 자극이 계속되면 갑상선 세포가 늘어나 갑상선이 커집니다(갑상선종)."},{title:"임신·영아",body:"태아의 뇌는 어머니의 갑상선호르몬에 의존하므로, 임신 중 심한 결핍은 크레틴병(지적장애·성장 장애)을, 가벼운 결핍도 아이의 인지 발달 저하를 일으킬 수 있습니다. WHO는 요오드 결핍을 예방 가능한 지적장애의 가장 흔한 원인으로 꼽습니다."},{title:"예방",body:"많은 나라가 소금에 요오드를 넣는 정책으로 결핍을 크게 줄였습니다."}]},{title:"과잉: 볼프-차이코프 효과와 갑상선 이상",evidence:"moderate",steps:[{title:"급성 차단",body:"요오드가 갑자기 많이 들어오면 갑상선은 호르몬 합성을 일시적으로 멈춥니다(볼프-차이코프 효과). 호르몬이 과다하게 만들어지는 것을 막는 안전장치입니다."},{title:"정상적인 탈출",body:"건강한 갑상선은 며칠 안에 NIS를 줄여 요오드 유입을 낮추고 합성을 재개합니다."},{title:"탈출 실패",body:"하시모토 갑상선염 같은 자가면역 갑상선염, 갑상선 수술·방사성요오드 치료 이력이 있는 사람, 태아·신생아, 고령자는 탈출하지 못해 갑상선기능저하증이 생길 수 있습니다. 반대로 결절성 갑상선종이 있으면 과잉 요오드가 갑상선기능항진증을 일으키기도 합니다(요오드-바제도 현상)."},{title:"인구 연구",body:'중국에서 요오드 섭취가 "과다" 수준인 지역일수록 무증상 갑상선기능저하증과 자가면역 갑상선염이 많았습니다.'}]}],evidenceNote:'강한 근거: 요오드는 갑상선호르몬 합성에 필수이며, 결핍은 갑상선종·크레틴병·아이의 인지 저하를 일으킵니다. 중간 근거: 만성적인 과잉 섭취는 취약한 사람에서 갑상선기능저하와 자가면역 갑상선염을 늘립니다(인구 연구). 한국인은 해조류로 섭취량이 많고 개인차가 매우 커서, 평소 식사로는 문제가 드물지만 다시마 등을 매일 많이 먹거나 요오드 보충제를 더하면 상한을 넘기 쉽습니다. 갑상선질환자가 해조류를 "완전히" 끊어야 한다는 근거는 없으며, 과량을 피하는 것이 핵심입니다.',facts:["한국인 성인 권장섭취량은 150μg, 상한섭취량은 2,400μg입니다(미국 상한은 1,100μg).","마른 다시마는 종류에 따라 1g에 1,000μg을 넘기도 해 몇 g만으로 상한섭취량을 넘을 수 있습니다. 김·미역은 다시마보다 훨씬 적습니다.","요오드는 물에 잘 녹아, 다시마를 끓이면 상당량이 국물로 빠져나옵니다. 건더기를 건져내도 국물에는 요오드가 남습니다.","갑상선암 수술 후 방사성요오드 치료를 앞두면 치료 효과를 높이기 위해 일정 기간 저요오드식을 하도록 지시받습니다."],cautions:["하시모토 갑상선염 등 갑상선질환이 있다면 다시마·요오드 보충제 같은 고용량 급원은 피하고, 해조류 섭취량은 담당 의사와 상의하세요.","출산 후 미역국을 하루 여러 그릇 먹으면 요오드 섭취가 매우 많아지고 모유로도 전달되어, 특히 미숙아의 갑상선 기능에 영향을 줄 수 있다는 국내 보고가 있습니다.","아미오다론(부정맥 약)과 요오드 조영제는 요오드를 대량 포함해 갑상선 기능 이상을 일으킬 수 있습니다."],refs:["Zimmermann MB. Endocr Rev 2009 — 요오드 결핍 (리뷰)","Teng W, et al. N Engl J Med 2006 — 중국의 요오드 섭취 수준과 갑상선질환","Leung AM, Braverman LE. Nat Rev Endocrinol 2014 — 요오드 과잉의 결과","보건복지부·한국영양학회 — 2020 한국인 영양소 섭취기준"]},{id:"selenium",name:"셀레늄",en:"Selenium",aliases:["Se","셀렌","selenium","셀레노메티오닌","브라질너트","글루타티온 퍼옥시다제","GPx"],kind:"무기질·영양소",effect:"mixed",tags:["antioxidant","hormone","immune","cancer"],summary:"셀레노단백질의 핵심 원소로, 과산화물을 없애는 글루타티온 퍼옥시다제, 티오레독신 환원효소, 갑상선호르몬을 활성화하는 탈요오드화효소를 만듭니다. 부족해도 문제지만 필요량과 독성량의 간격이 좁은 U자형 관계라, 이미 충분한 사람이 보충제를 더 먹으면 이득 없이 당뇨병 위험 신호가 나타났습니다.",pathways:[{title:"셀레노단백질 만들기: 몸의 과산화물 청소",evidence:"strong",steps:[{title:"섭취·흡수",body:"곡물·견과에는 셀레노메티오닌, 고기·생선에는 셀레노시스테인 형태로 들어 있으며 대부분 잘 흡수됩니다."},{title:"공통 경로로 전환",body:'모든 형태는 셀레나이드(H2Se)를 거쳐 셀레노인산이 되고, 특수한 tRNA 위에서 "21번째 아미노산" 셀레노시스테인으로 조립됩니다. 원래 멈춤 신호인 유전암호 UGA를 셀레노시스테인으로 읽게 하는 특수 구조(SECIS)가 필요합니다.'},{title:"표적 효소",body:"사람에게는 25가지 셀레노단백질이 있습니다. 글루타티온 퍼옥시다제(GPx)는 과산화수소와 지질과산화물을 물·알코올로 바꾸고, 특히 GPx4는 세포막 인지질 과산화물을 제거해 철 의존 세포사(페로토시스)를 막습니다. 티오레독신 환원효소는 산화된 단백질을 되돌립니다."},{title:"결과",body:"셀레늄이 충분하면 이 효소들이 최대 활성에 이르고, 그 이상 먹어도 효소 활성은 더 오르지 않습니다. 토양 셀레늄이 매우 적은 중국 일부 지역에서는 결핍성 심근병증(커산병)이 나타났습니다."}]},{title:"U자형 관계: 충분한 사람의 보충제",evidence:"moderate",steps:[{title:"기대",body:"1996년 NPC 시험의 2차 분석에서 셀레늄 보충군의 전립선암이 적어 암 예방 효과가 기대됐습니다."},{title:"대규모 검증",body:"SELECT 시험(남성 약 3만 5천 명, 셀레노메티오닌 200μg)에서 전립선암은 줄지 않았고, 코크란 고찰도 셀레늄 보충의 암 예방 효과가 없다고 결론지었습니다."},{title:"당뇨병 신호",body:"NPC 시험 재분석에서 셀레늄 200μg 보충군의 제2형 당뇨병 위험이 약 55% 높았고, SELECT에서도 통계적으로 유의하지 않은 증가 경향이 있었습니다. 셀레노단백질이 과하면 인슐린 신호를 방해한다는 동물 연구가 기전 후보입니다."},{title:"해석",body:"셀레늄은 기준 상태가 낮은 사람에게만 이득이 있고, 혈중 농도가 이미 충분한 사람에게 더하면 효과가 없거나 해로울 수 있습니다."}]},{title:"갑상선: 탈요오드화효소와 자가면역 갑상선염",evidence:"contested",steps:[{title:"탈요오드화효소",body:"T4를 활성형 T3로 바꾸거나 불활성화하는 탈요오드화효소(DIO1~3)가 셀레노단백질입니다. 갑상선은 몸에서 셀레늄 농도가 가장 높은 기관 중 하나입니다."},{title:"갑상선 보호",body:"갑상선은 호르몬을 만들 때 과산화수소를 쓰는데, GPx가 이 과산화수소로부터 갑상선 세포를 보호합니다."},{title:"임상 연구",body:"하시모토 갑상선염 환자에게 셀레늄을 주면 항TPO 항체가 내려갔다는 시험들이 있지만, 갑상선 기능이나 증상이 좋아졌다는 근거는 일관되지 않습니다. 가벼운 그레이브스 안병증에서는 셀레늄 보충이 도움이 됐다는 무작위 시험이 있습니다."}]}],evidenceNote:"강한 근거: 셀레늄은 필수 미량원소이며 결핍은 커산병 같은 질환을 일으킵니다. 무작위 대조시험: 셀레늄이 충분한 인구에서 보충은 암을 예방하지 못했고(SELECT, 코크란 고찰), 제2형 당뇨병 위험 증가 신호가 있습니다. 논쟁 중: 자가면역 갑상선염에서 항체는 낮추지만 임상적 이득은 불분명합니다. 생선·달걀·곡물·견과 같은 음식으로 먹는 것이 적정 범위를 유지하는 가장 안전한 방법입니다.",facts:["한국인 성인 권장섭취량은 60μg, 상한섭취량은 400μg입니다.","브라질너트 한 알에 평균 수십 μg(재배 토양에 따라 편차가 매우 큼)이 들어 있어 몇 알만으로 하루 권장량을 넘고, 매일 한 줌씩 먹으면 상한섭취량을 넘을 수 있습니다.","식물성 식품의 셀레늄 함량은 토양 셀레늄에 좌우되어 지역 차가 큽니다. 생선·조개·달걀·육류는 비교적 안정적인 공급원입니다.","셀레노메티오닌은 메티오닌 대신 몸 단백질에 섞여 들어가 저장되기 때문에, 고용량 보충 시 체내에 오래 남습니다."],cautions:["과잉(셀레늄 중독) 증상은 마늘 냄새 같은 입냄새, 금속 맛, 머리카락·손발톱이 부서지고 빠짐, 피부 발진, 피로·신경 증상입니다. 라벨 표시보다 훨씬 많은 셀레늄이 든 보충제로 집단 중독이 생긴 사례도 있습니다.","셀레늄이 든 종합비타민·항산화제와 브라질너트를 겹쳐 먹지 않도록 하세요."],refs:["Rayman MP. Lancet 2012 — Selenium and human health (U자형 관계 리뷰)","Lippman SM, et al. JAMA 2009 — SELECT: 셀레늄·비타민 E 보충의 전립선암 예방 효과 없음","Stranges S, et al. Ann Intern Med 2007 — NPC 시험 재분석: 셀레늄 보충과 제2형 당뇨병 위험 증가","NIH Office of Dietary Supplements — Selenium Fact Sheet for Health Professionals"]},{id:"zinc",name:"아연",en:"Zinc",aliases:["Zn","zinc","징크","아연 보충제","아연 로젠지","아연 캔디"],kind:"무기질·영양소",effect:"benefit",tags:["immune","skin","antioxidant","hormone"],summary:"수백 가지 효소와 수많은 단백질의 구조를 잡는 필수 미량원소로, 면역세포 성숙·상처 회복·미각·성장에 관여합니다. 몸에 따로 저장하는 곳이 없어 꾸준히 먹어야 하고, 곡물·콩의 피트산이 흡수를 방해합니다. 감기 초기 아연 로젠지는 기간을 줄일 수 있지만, 고용량 장기 보충은 구리 결핍을 일으킵니다.",pathways:[{title:"흡수와 몸속 역할",evidence:"strong",steps:[{title:"흡수",body:"소장 세포막의 ZIP4 수송체로 흡수되어 ZnT1 수송체로 혈액에 나갑니다. ZIP4 유전자에 결함이 있으면 선천성 아연 결핍(장병성 선단피부염)이 생깁니다."},{title:"피트산의 방해",body:"통곡물·콩의 피트산은 장 속에서 아연과 녹지 않는 복합체를 만들어 흡수를 크게 줄입니다. 피트산:아연 몰비가 15를 넘는 식단은 흡수율이 낮은 식단으로 분류됩니다. 발효·발아·불리기는 피트산을 줄여 흡수를 높입니다."},{title:"효소와 구조",body:'아연은 탄산탈수효소, 알코올 탈수소효소, 구리·아연 슈퍼옥사이드 디스뮤타제(SOD1) 같은 효소의 활성 중심이고, DNA에 결합하는 "징크핑거" 전사인자의 구조를 잡아 줍니다. 사람 단백질의 약 10%가 아연과 결합하는 것으로 추정됩니다.'},{title:"결핍의 결과",body:"결핍되면 성장 지연, 상처 회복 지연, 피부염, 미각 저하, 탈모, 면역 저하가 나타납니다."}]},{title:"면역: T세포 성숙과 감기 로젠지",evidence:"moderate",steps:[{title:"흉선과 T세포",body:"흉선 호르몬 티물린은 아연이 있어야 활성을 가지며, 아연이 부족하면 흉선이 위축되고 T세포의 수와 기능이 떨어집니다."},{title:"감염 방어",body:"개발도상국 어린이 연구에서 아연 결핍은 설사·폐렴 위험을 높였고, 급성 설사에 아연을 주면 기간과 중증도가 줄어 WHO·유니세프가 경구수액과 함께 아연 투여를 권합니다."},{title:"감기 로젠지",body:"입안에서 천천히 녹이는 아연 로젠지(아세트산·글루콘산 아연, 하루 약 75mg 이상)를 증상 시작 24시간 안에 먹으면 감기 기간이 줄었다는 메타분석이 있습니다. 목 점막에 닿은 아연 이온이 리노바이러스 증식과 염증 반응을 억제하는 것으로 추정되지만, 제형·용량이 제각각이라 근거의 확실성은 중간 이하로 평가됩니다."},{title:"예방은 다르다",body:"결핍이 없는 사람이 평소 아연을 더 먹어 감기를 예방한다는 근거는 약합니다."}]},{title:"과잉 보충 → 구리 결핍",evidence:"strong",steps:[{title:"메탈로티오네인 유도",body:"아연을 많이 먹으면 장세포가 금속 결합 단백질 메탈로티오네인을 대량으로 만듭니다."},{title:"구리 가두기",body:"메탈로티오네인은 아연보다 구리에 더 단단히 붙어, 구리가 장세포에 갇힌 채 세포가 떨어져 나갈 때 대변으로 버려집니다."},{title:"결과",body:"고용량 아연을 장기간 먹거나 아연이 든 틀니 접착제를 과다 사용한 사람에게 구리 결핍으로 빈혈·백혈구 감소, 척수 손상(보행 장애)이 생긴 사례가 있습니다. 이 원리를 거꾸로 이용해 구리가 쌓이는 윌슨병 치료에 아연을 씁니다."}]}],evidenceNote:"강한 근거: 아연 결핍은 성장·면역·피부·미각에 문제를 일으키고, 개발도상국 어린이의 설사 치료에 아연 보충이 효과적입니다. 과잉 보충이 구리 결핍을 일으키는 것도 확실합니다. 중간 근거: 감기 초기 아연 로젠지가 기간을 줄인다는 메타분석이 있지만 연구 간 차이가 큽니다. 코에 뿌리는 아연 제품은 후각 상실 보고로 미국 FDA가 경고했습니다. 결핍이 없는 사람에게 면역 강화·피부 개선을 위한 고용량 보충의 근거는 약합니다.",facts:["몸속 아연은 약 2~3g이며 대부분 근육과 뼈에 있고, 따로 꺼내 쓸 저장고가 없어 매일 섭취가 필요합니다.","굴이 식품 중 가장 풍부하고 소고기·게·돼지고기·호박씨·콩류가 뒤를 잇습니다. 동물성 식품의 아연은 피트산이 없어 흡수가 잘 됩니다.","상한섭취량은 성인 기준 약 35~40mg(국가마다 차이)입니다.","노인성 황반변성 진행을 늦춘 AREDS 시험의 조합에는 아연 80mg이 포함됐고, 구리 결핍을 막기 위해 구리 2mg을 함께 넣었습니다."],cautions:["고용량 아연을 장기간 먹으면 구리 결핍이 생길 수 있고, 공복에 먹으면 구역·구토가 흔합니다.","아연은 테트라사이클린·퀴놀론 항생제의 흡수를 방해하므로 복용 간격을 두세요.","코에 뿌리거나 바르는 아연 제품은 후각 상실 위험이 있어 피하세요."],refs:["Prasad AS. Adv Nutr 2013 — 사람 아연 결핍의 발견과 건강 영향","Hemilä H. JRSM Open 2017 — 아연 로젠지와 감기 기간 메타분석","WHO/UNICEF 2004 — 급성 설사의 임상 관리: 경구수액과 아연 공동 성명","NIH Office of Dietary Supplements — Zinc Fact Sheet for Health Professionals"]},{id:"choline",name:"콜린",en:"Choline",aliases:["choline","레시틴","lecithin","포스파티딜콜린","phosphatidylcholine","베타인","TMAO","알파GPC"],kind:"무기질·영양소",effect:"benefit",tags:["liver","brain","vascular"],summary:"달걀노른자·간·콩·생선에 많은 필수 영양소로, 세포막(포스파티딜콜린), 신경전달물질(아세틸콜린), 메틸 공여체(베타인)의 재료입니다. 간은 콜린이 있어야 지방을 내보낼 수 있어, 부족하면 지방간이 생긴다는 것이 사람 결핍 연구로 확인됐습니다. 장내미생물이 콜린에서 만드는 TMAO와 심혈관질환의 관계는 논쟁 중입니다.",pathways:[{title:"간의 지방 수출: 결핍 → 지방간",evidence:"strong",steps:[{title:"섭취와 자체 합성",body:"음식에서는 주로 포스파티딜콜린(레시틴) 형태로 먹고, 간에서도 PEMT 효소가 SAMe의 메틸기 3개를 써서 일부를 만듭니다. 하지만 몸에서 만드는 양만으로는 부족해 음식으로 먹어야 합니다."},{title:"VLDL 조립",body:"간은 중성지방을 VLDL 입자에 담아 혈액으로 내보내는데, 이 입자의 껍질을 이루는 데 포스파티딜콜린이 꼭 필요합니다."},{title:"결핍 시",body:"콜린이 부족하면 VLDL을 충분히 만들지 못해 중성지방이 간세포에 쌓이고 간세포 손상(간효소 상승)이 생깁니다. 콜린이 없는 정맥영양을 받던 환자의 지방간이 콜린 공급으로 회복된 사례도 있습니다."},{title:"사람 결핍 연구",body:"콜린 결핍 식단을 먹인 연구에서 남성의 77%, 폐경 여성의 80%가 지방간이나 근육 손상을 보였지만, 폐경 전 여성은 44%에 그쳤습니다. 에스트로겐이 PEMT를 켜서 스스로 만드는 양이 많기 때문입니다."}]},{title:"아세틸콜린과 베타인: 신경 전달과 메틸 공급",evidence:"limited",steps:[{title:"아세틸콜린 합성",body:"신경 말단에서 콜린 아세틸전달효소가 콜린과 아세틸-CoA로 아세틸콜린을 만듭니다. 아세틸콜린은 기억·주의력, 근육 수축, 부교감신경 신호를 전달합니다."},{title:"베타인으로 산화",body:"간·신장의 미토콘드리아에서 콜린은 베타인으로 산화되고, 베타인-호모시스테인 메틸전달효소(BHMT)가 호모시스테인에 메틸기를 줘 메티오닌을 만듭니다. 엽산·B12 경로와 별개인 두 번째 메틸화 회로입니다."},{title:"임신과 태아 뇌",body:"태반은 콜린을 적극적으로 태아에게 보내며, 동물 연구에서 임신 중 콜린 보충은 새끼의 해마 발달과 기억력을 개선했습니다. 사람에서는 임신 후기 콜린 섭취를 늘린 군의 영아 정보처리 속도가 빨랐다는 소규모 시험 등이 있지만 아직 제한적입니다."},{title:"성인 인지 기능",body:"콜린·레시틴 보충제가 건강한 성인의 기억력을 높인다는 근거는 부족합니다."}]},{title:"장내미생물 TMAO 논쟁",evidence:"contested",steps:[{title:"TMA 생성",body:"소장에서 흡수되지 않은 콜린·카르니틴 일부를 장내세균이 트리메틸아민(TMA)으로 분해합니다."},{title:"TMAO 전환",body:"TMA는 간의 FMO3 효소에 의해 트리메틸아민 N-옥사이드(TMAO)로 바뀝니다."},{title:"가설",body:"혈중 TMAO가 높은 사람의 심혈관 사건이 많았고(2013년 NEJM), 동물에서는 TMAO가 혈소판 활성화와 동맥경화를 부추겼습니다."},{title:"반론",body:"생선은 TMAO 자체를 많이 함유해 달걀보다 혈중 TMAO를 훨씬 크게 올리지만 심혈관 위험 감소와 연결됩니다. TMAO는 신장으로 배출되어 신장 기능 저하의 표지일 가능성이 있고, 달걀 섭취와 심혈관질환의 연관은 대규모 분석에서 대체로 중립적입니다. 원인인지 표지인지 아직 결론이 나지 않았습니다."}]}],evidenceNote:"강한 근거: 콜린은 필수 영양소이며 사람 결핍 연구에서 지방간·근육 손상이 확인됐습니다. 제한적 근거: 임신 중 충분한 콜린 섭취가 아이의 뇌 발달에 이롭다는 연구는 주로 동물 실험과 소규모 사람 연구입니다. 논쟁 중: TMAO와 심혈관질환의 인과 관계. 미국 조사에서는 많은 사람이 충분섭취량에 못 미쳤으며, 달걀·콩·생선을 통한 섭취가 현실적인 방법입니다.",facts:["큰 달걀 1개에 약 147mg이 들어 있고 대부분 노른자에 있습니다. 소간·닭간, 콩, 생선, 닭고기, 브로콜리 같은 십자화과 채소에도 있습니다.","미국 충분섭취량은 성인 남성 550mg, 여성 425mg(임신 450mg, 수유 550mg)이며 상한섭취량은 3.5g입니다.",'"레시틴"은 포스파티딜콜린이 주성분인 인지질 혼합물로, 대두·달걀노른자에서 추출해 식품 유화제로도 씁니다.',"PEMT 유전자 변이가 있거나 폐경 후인 여성, 임신·수유부는 필요량이 커질 수 있습니다."],cautions:["보충제로 하루 수 g을 먹으면 몸에서 생선 비린내(TMA)가 나거나 땀, 저혈압, 설사가 생길 수 있습니다.","트리메틸아민뇨증(생선냄새증후군)이 있으면 콜린이 많은 식품을 조절해야 합니다."],refs:["Fischer LM, et al. Am J Clin Nutr 2007 — 성별·폐경 상태에 따른 콜린 필요량 (사람 결핍 식단 연구)","Zeisel SH, da Costa KA. Nutr Rev 2009 — Choline: an essential nutrient for public health","Tang WH, et al. N Engl J Med 2013 — 장내미생물의 포스파티딜콜린 대사(TMAO)와 심혈관 위험","NIH Office of Dietary Supplements — Choline Fact Sheet for Health Professionals"]},{id:"epa-dha",name:"오메가3 EPA·DHA",en:"EPA and DHA (long-chain omega-3)",aliases:["오메가3","오메가-3","omega-3","EPA","DHA","에이코사펜타엔산","도코사헥사엔산","피쉬오일","생선기름","어유","크릴오일","알티지오메가3"],kind:"지방산",effect:"benefit",tags:["cholesterol","vascular","anti-inflammatory","brain","eye"],summary:"고등어·연어·정어리 같은 등푸른생선에 많은 긴 사슬 오메가3 지방산입니다. 세포막에 들어가 아라키돈산과 경쟁하고 염증을 끝내는 매개체의 재료가 되며, 고용량(하루 2~4g)은 중성지방을 확실히 낮춥니다. 반면 보충제의 심혈관 사건 예방 효과는 시험마다 엇갈리고, 고용량은 심방세동 위험을 높입니다.",pathways:[{title:"중성지방 저하",evidence:"strong",steps:[{title:"흡수",body:"생선이나 보충제의 EPA·DHA는 중성지방·인지질·에틸에스테르 형태로 흡수되어 암죽미립(킬로미크론)에 실립니다. 에틸에스테르형 보충제는 지방이 있는 식사와 함께 먹어야 잘 흡수됩니다."},{title:"간의 지방 합성 억제",body:"간에서 지방 합성 전사인자 SREBP-1c를 억제하고, 지방산 연소를 촉진하는 PPARα를 활성화합니다. 중성지방을 만들 재료는 줄고 태우는 양은 늘어납니다."},{title:"VLDL 감소와 제거 촉진",body:"간이 내보내는 VLDL(중성지방 운반 입자)이 줄고, 혈관의 지단백 지방분해효소(LPL) 활성이 올라 혈중 중성지방 제거가 빨라집니다."},{title:"결과",body:"하루 2~4g을 먹으면 중성지방이 용량에 비례해 내려가며, 중성지방이 높은 사람에게 4g은 30% 이상 낮출 수 있습니다(미국심장협회 권고). 생선 식사 수준(하루 수백 mg)의 효과는 작습니다."}]},{title:"세포막 교체와 염증 해소",evidence:"limited",steps:[{title:"세포막 편입",body:"섭취한 EPA·DHA는 적혈구·면역세포·혈소판의 세포막 인지질에 들어가, 그 자리의 아라키돈산(오메가6)을 일부 밀어냅니다."},{title:"효소 경쟁",body:"COX·LOX 효소를 두고 아라키돈산과 경쟁해, 강한 염증·응고 매개물질(프로스타글란딘E2, 트롬복산A2, 류코트리엔B4) 대신 효력이 약한 3계열·5계열 매개물질을 만듭니다. 트롬복산이 줄면 혈소판 응집이 약해집니다."},{title:"특수 전구 매개체(SPM)",body:'EPA에서 E계열 레졸빈, DHA에서 D계열 레졸빈·프로텍틴·마레신이 만들어집니다. 이들은 염증을 억누르기보다 호중구 유입을 멈추고 대식세포가 잔해를 치우게 해 염증을 "끝내는" 신호로 작용합니다.'},{title:"사람에서는",body:"세포·동물 연구에서는 효과가 뚜렷하지만, 사람 시험에서 CRP 같은 염증 지표 감소는 작거나 일관되지 않습니다. 류마티스관절염에서는 고용량이 관절 통증과 진통제 사용을 약간 줄였다는 메타분석이 있습니다."}]},{title:"심혈관 사건: 엇갈린 대형 시험과 심방세동",evidence:"contested",steps:[{title:"생선 섭취",body:"관찰연구에서 등푸른생선을 주 1~2회 먹는 사람의 관상동맥질환 사망 위험이 낮았습니다. 그래서 여러 학회가 생선을 주 2회 권합니다."},{title:"REDUCE-IT와 JELIS",body:"스타틴 복용 중 중성지방이 높은 고위험 환자에게 고순도 EPA 4g(이코사펜트 에틸)을 준 REDUCE-IT에서 심혈관 사건이 25% 줄었습니다. 일본 JELIS 시험(EPA 1.8g)에서도 감소했습니다."},{title:"STRENGTH와 일반 용량 시험",body:"비슷한 환자에게 EPA+DHA 4g을 준 STRENGTH는 이득이 없어 조기 중단됐고, 1g 보충 시험(VITAL, ASCEND)도 주요 심혈관 사건을 줄이지 못했습니다. REDUCE-IT의 위약(광물성 기름)이 LDL·염증 지표를 올려 효과가 부풀려졌을 수 있다는 지적도 있습니다."},{title:"심방세동",body:"대형 시험 메타분석에서 오메가3 보충은 심방세동 위험을 약 25% 높였고, 하루 1g을 넘는 용량에서는 약 49%로 증가 폭이 더 컸습니다. 출혈이 약간 늘어난다는 보고도 있습니다."}]}],evidenceNote:"강한 근거: 하루 2~4g의 EPA·DHA는 중성지방을 낮춥니다. 중간 근거: 생선을 주 1~2회 먹는 식습관과 관상동맥질환 사망 감소(관찰연구). 논쟁 중: 보충제의 심혈관 사건 예방. 고순도 EPA 고용량(REDUCE-IT)은 효과가 있었지만 EPA+DHA 혼합(STRENGTH)과 일반 용량 시험은 효과가 없었고, 고용량 보충은 심방세동을 늘립니다. 염증 해소 매개체(레졸빈 등)의 작용은 주로 세포·동물 연구 단계입니다.",facts:["100g당 대략 연어·고등어에 1~2g이 들어 있고 정어리·꽁치·청어도 풍부합니다. 참치 통조림(라이트)·흰살생선은 적습니다.","DHA는 뇌 회백질과 망막 광수용체의 세포막에 특히 많이 농축되어 있으며 태아·영아의 뇌와 눈 발달에 쓰입니다. 뇌에는 MFSD2A라는 수송체를 통해 들어갑니다.","임신 중 오메가3 보충이 조산, 특히 34주 이전 조기 조산 위험을 낮춘다는 코크란 고찰이 있습니다.",'흔한 1g 어유 캡슐의 EPA+DHA는 보통 300mg 안팎이므로, 제품 라벨의 "EPA+DHA 함량"을 확인해야 합니다.',"생선의 EPA·DHA는 원래 미세조류가 만든 것이며, 조류 오일은 채식인의 DHA 공급원이 됩니다."],cautions:["고용량 보충제(하루 1g 이상, 특히 2~4g)는 심방세동 위험을 높일 수 있고, 항응고제·항혈소판제와 함께 먹으면 출혈이 늘 수 있으므로 의사와 상의하세요.","어유 캡슐은 산화되기 쉬우니 서늘하고 어두운 곳에 보관하고, 비린내가 심하면 산패를 의심하세요.","임산부·어린이는 수은이 적은 중소형 생선(고등어·연어·정어리·꽁치)을 고르고, 대형 포식어(황새치·대형 참치류)는 제한하세요."],refs:["Bhatt DL, et al. N Engl J Med 2019 — REDUCE-IT: 고순도 EPA 4g과 심혈관 사건 감소","Nicholls SJ, et al. JAMA 2020 — STRENGTH: EPA+DHA 4g, 심혈관 이득 없음","Gencer B, et al. Circulation 2021 — 오메가3 보충과 심방세동 위험 메타분석","Skulas-Ray AC, et al. Circulation 2019 — 미국심장협회: 고중성지방혈증 관리를 위한 오메가3 권고"]},{id:"ala",name:"알파리놀렌산 (식물성 오메가3)",en:"Alpha-linolenic acid (ALA)",aliases:["ALA","알파리놀렌산","α-리놀렌산","alpha-linolenic acid","식물성 오메가3","들기름 오메가3","아마씨유","아마씨","치아씨드"],kind:"지방산",effect:"benefit",tags:["vascular","cholesterol","anti-inflammatory"],summary:"들기름·아마씨·치아씨·호두·카놀라유에 있는 식물성 오메가3 필수 지방산입니다. 몸에서 EPA로는 일부, DHA로는 아주 조금만 바뀌므로 생선 오메가3를 완전히 대신하지는 못합니다. 섭취가 많을수록 심혈관질환 위험이 조금 낮다는 관찰 근거가 있고, 이중결합이 세 개라 산화에 매우 약해 보관과 조리법이 중요합니다.",pathways:[{title:"EPA·DHA로의 제한적 전환",evidence:"strong",steps:[{title:"흡수 후 운명",body:"섭취한 ALA의 상당 부분은 에너지로 태워지거나(베타산화) 지방조직에 저장되고, 일부만 긴 사슬 오메가3로 전환됩니다."},{title:"전환 효소",body:"델타-6 불포화효소(FADS2) → 사슬 연장효소 → 델타-5 불포화효소(FADS1)를 거쳐 EPA가 되고, DHA까지 가려면 여러 단계와 퍼옥시좀 베타산화를 더 거쳐야 합니다. 이 효소들을 리놀레산(오메가6)과 나눠 쓰기 때문에 서로 경쟁합니다."},{title:"전환율",body:"동위원소 추적 연구마다 편차가 크지만, EPA로는 대략 수~10% 남짓, DHA로는 대개 1% 안팎 이하로 측정됩니다. 젊은 여성은 에스트로겐의 영향으로 남성보다 전환율이 높게 나타납니다."},{title:"의미",body:"ALA를 늘리면 혈중 EPA는 조금 오르지만 DHA는 거의 오르지 않습니다. 생선을 먹지 않는 임산부·채식인이 DHA가 필요하다면 미세조류 오일이 현실적인 대안입니다."}]},{title:"심혈관 위험과의 연관",evidence:"moderate",steps:[{title:"관찰연구",body:"메타분석에서 ALA 섭취가 하루 1g 많을수록 심혈관질환 위험이 약 10% 낮았습니다."},{title:"가능한 기전",body:"ALA 자체의 부정맥 억제 효과, 일부 EPA로의 전환, 포화지방을 대체할 때의 LDL 저하, 그리고 ALA가 많은 음식(견과·씨앗)의 다른 성분이 함께 작용할 수 있습니다."},{title:"시험 결과",body:"심근경색 환자에게 ALA 2g을 넣은 마가린을 준 Alpha Omega 시험에서는 유의한 감소가 없었고, 여러 시험을 모은 코크란 고찰은 심혈관 사건을 아주 약간 줄일 가능성을 제시했습니다. ALA가 풍부한 지중해식 식단 시험(리옹 식이 심장 연구)의 큰 효과는 식단 전체를 바꾼 결과입니다."}]},{title:"산화에 매우 약한 구조",evidence:"strong",steps:[{title:"약한 고리",body:"이중결합이 세 개라 수소가 쉽게 떨어지는 비스-알릴 위치가 두 곳입니다. 리놀레산보다 약 2배, 올레산보다 20배 이상 빨리 산화됩니다."},{title:"산패",body:"빛·열·공기를 만나면 과산화물과 알데하이드가 빠르게 생기고 비린내·쩐내가 납니다(→ 산화 지질 참고)."},{title:"보관과 조리",body:"들기름·아마씨유는 작은 병으로 사서 냉장 보관하고 개봉 후 빨리 쓰며, 고온 볶음·튀김보다 나물 무침·드레싱처럼 가열하지 않는 용도가 좋습니다. 씨앗째로 두면 껍질과 항산화 성분 덕분에 기름으로 짠 것보다 훨씬 안정적입니다."}]}],evidenceNote:'확실한 것: ALA는 필수 지방산이고 EPA, 특히 DHA로의 전환은 제한적입니다(동위원소 추적 연구). 중간 근거: 섭취가 많을수록 심혈관질환 위험이 소폭 낮다는 관찰 연관이 일관되지만, ALA 단독 보충 시험의 효과는 작거나 불분명합니다. "식물성 오메가3로 생선 오메가3를 대신할 수 있다"는 말은 DHA에 관해서는 사실이 아닙니다.',facts:["지방산 중 ALA 비율(대략): 들기름 55~65%, 아마씨유 약 53%, 카놀라유 약 9%, 콩기름 약 7%. 100g당 치아씨 약 18g, 호두 약 9g입니다.","1일 영양성분 기준치는 1.3g이며, 들기름 한 숟가락(10g 안팎)이면 이를 몇 배 넘습니다.","통 아마씨는 소화되지 않고 그대로 나오기 쉬워 갈아서 먹어야 ALA를 흡수할 수 있습니다. 간 아마씨는 산화가 빠르니 냉장·냉동 보관하세요.","리놀레산(오메가6)을 과도하게 먹으면 같은 전환 효소를 두고 경쟁해 ALA의 전환이 더 줄어들 수 있습니다."],cautions:["쩐내나 심한 비린내가 나는 들기름·아마씨유는 이미 산화된 것이므로 먹지 마세요.","아마씨·치아씨는 식이섬유가 많아 한꺼번에 많이 먹으면 복부 팽만이 생길 수 있으니 물을 충분히 함께 드세요."],refs:["Burdge GC, Calder PC. Reprod Nutr Dev 2005 — 성인에서 ALA의 긴 사슬 오메가3 전환","Pan A, et al. Am J Clin Nutr 2012 — ALA 섭취와 심혈관질환 위험 메타분석","Kromhout D, et al. N Engl J Med 2010 — Alpha Omega 시험: 심근경색 후 EPA·DHA·ALA 보충","Linus Pauling Institute, Micronutrient Information Center — Essential Fatty Acids"]}],te=[{id:"oleic-acid",name:"올레산 (단일불포화지방)",en:"Oleic acid (monounsaturated fat)",aliases:["올레인산","오메가9","오메가-9","omega-9","MUFA","단일불포화지방산","고올레산","high oleic"],kind:"지방산",effect:"benefit",tags:["cholesterol","vascular","blood-sugar"],summary:"올리브유·카놀라유·아보카도·견과류에 많은 대표적인 단일불포화지방산(오메가9)입니다. 포화지방이나 정제 탄수화물 대신 먹으면 LDL 콜레스테롤과 중성지방이 좋아지고, 이중결합이 하나뿐이라 다불포화지방보다 산화에 훨씬 강합니다.",pathways:[{title:"포화지방 대신 먹을 때 LDL 콜레스테롤 저하",evidence:"strong",steps:[{title:'핵심은 "대체"',body:"올레산 자체가 LDL을 낮추는 약처럼 작용하는 것은 아닙니다. 버터·라드·팜유 같은 포화지방을 올리브유·카놀라유로 바꿀 때 효과가 나타납니다."},{title:"간세포 LDL 수용체",body:"팔미트산 같은 포화지방은 간세포의 LDL 수용체 활성을 떨어뜨립니다. 같은 자리를 올레산이 채우면 이 억제가 풀려 수용체 활성이 회복됩니다(→ 포화지방 참고)."},{title:"혈중 LDL 회수",body:"늘어난 LDL 수용체가 혈액 속 LDL 입자를 간으로 더 많이 거둬들여 LDL 콜레스테롤이 낮아집니다."},{title:"탄수화물 대신일 때",body:"흰쌀·흰빵·설탕 같은 정제 탄수화물 대신 먹으면 LDL 변화는 작지만, 간의 중성지방 합성이 줄어 혈중 중성지방이 내려가고 HDL 콜레스테롤이 조금 오릅니다."}],note:"LDL 저하 폭은 같은 양을 리놀레산(다불포화지방)으로 바꿀 때보다 약간 작습니다."},{title:"산화에 강한 구조 → LDL이 덜 산화됨",evidence:"moderate",steps:[{title:"이중결합 하나",body:"올레산은 이중결합이 하나라서, 리놀레산처럼 두 이중결합 사이에서 수소가 쉽게 떨어져 나가는 약한 자리(비스-알릴 위치)가 없습니다. 그래서 리놀레산보다 수십 배 느리게 산화됩니다."},{title:"조리 중 안정성",body:"가열할 때 과산화물과 4-HNE 같은 반응성 알데하이드가 덜 생깁니다(→ 산화 지질 참고). 엑스트라버진 올리브유는 폴리페놀·비타민 E까지 들어 있어 가정의 볶음 온도에서 비교적 안정합니다."},{title:"LDL 입자의 조성 변화",body:"올레산이 많은 식사를 하면 LDL 입자 속 지방산 중 올레산 비율이 올라갑니다. 사람 급식 연구에서 이런 LDL은 시험관 산화 실험에서 산화가 늦게 시작됐습니다."},{title:"의미",body:"혈관벽에서 산화 LDL이 대식세포에 삼켜져 거품세포가 되는 과정(동맥경화의 시작)이 덜 일어날 수 있다는 근거입니다. 다만 이것이 심혈관 사건 감소로 이어지는지는 직접 확인되지 않았습니다."}]},{title:"팔미트산의 지방독성 완충 (세포 연구)",evidence:"limited",steps:[{title:"포화지방이 넘칠 때",body:"간·근육·췌장 베타세포에 팔미트산이 넘치면 세라마이드·디아실글리세롤(DAG)이 쌓이고 소포체 스트레스와 인슐린 신호 장애가 생깁니다(→ 포화지방 참고)."},{title:"중성지방으로 안전하게 저장",body:"세포 실험에서 올레산을 함께 주면 팔미트산이 중성지방으로 묶여 지질방울에 저장되고, 세라마이드 합성 쪽으로 덜 흘러갑니다."},{title:"결과",body:"팔미트산만 줄 때 나타나던 세포 사멸, NF-κB 염증 신호, 인슐린 저항성이 줄어듭니다."},{title:"사람에서는",body:"세포·동물 결과이며, 사람에서 올레산이 이 경로로 인슐린 감수성을 높인다는 직접 증거는 제한적입니다."}]}],evidenceNote:"강한 근거: 포화지방을 올레산이 많은 기름으로 바꾸면 LDL 콜레스테롤이 내려갑니다(대조 급식 연구 메타 회귀분석). 식단 수준 근거: 엑스트라버진 올리브유를 넉넉히 쓴 지중해식은 저지방 권고 식단보다 심근경색·뇌졸중·심혈관 사망을 합친 위험을 약 30% 낮췄습니다(PREDIMED, 2018 재분석). 다만 이 효과에는 올리브 폴리페놀·견과·채소 등 식단 전체가 기여하므로 올레산만의 효과로 볼 수는 없습니다. 올레산의 항염·인슐린 감수성 효과는 주로 세포·동물 연구입니다.",facts:["올레산 비율(대략): 올리브유 55~83%(보통 70% 안팎), 고올레산 해바라기유 80% 안팎, 카놀라유 약 60%, 아보카도 지방 약 60~70%, 돼지기름 약 40%.","사람 몸의 지방조직에서 가장 많은 지방산이 올레산입니다. 필수 지방산은 아니어서 몸이 스테아르산으로부터 SCD1(스테아로일-CoA 불포화효소)로 직접 만들 수 있습니다.",'미국 FDA는 2018년, 올레산이 70% 이상인 기름을 포화지방 대신 하루 약 1.5큰술(20g) 쓰면 관상동맥질환 위험을 낮출 수 있다는 "제한적 건강강조표시"를 허용했습니다.',"미국 대규모 코호트에서 올리브유를 하루 반 큰술(약 7g) 넘게 먹은 사람은 거의 먹지 않은 사람보다 심혈관질환 위험이 약 14% 낮았습니다(관찰연구).","정제 올리브유(퓨어·포마스)는 올레산 함량은 비슷해도 폴리페놀이 훨씬 적습니다(→ 올리브 폴리페놀 참고)."],cautions:["올레산이 많은 기름도 1g에 9kcal인 지방입니다. 기존 식단에 얹어 먹기보다 버터·쇼트닝·가공육 지방을 대체하는 방식이 효과적입니다."],refs:["Estruch R, et al. N Engl J Med 2018 — PREDIMED: 엑스트라버진 올리브유·견과 지중해식의 심혈관질환 1차 예방 (재분석·재발표)","Mensink RP. WHO 2016 — 포화지방산 대체가 혈중 지질에 미치는 영향 체계적 고찰·회귀분석","Guasch-Ferré M, et al. J Am Coll Cardiol 2020 — 미국 성인의 올리브유 섭취와 심혈관질환 위험 (코호트)","Listenberger LL, et al. Proc Natl Acad Sci USA 2003 — 중성지방 축적이 지방산 유도 지방독성을 막는다 (세포 연구)"]},{id:"saturated-fat",name:"포화지방",en:"Saturated fat",aliases:["포화지방산","SFA","팔미트산","스테아르산","라우르산","미리스트산","palmitic acid","stearic acid","lauric acid"],kind:"지방산",effect:"mixed",tags:["cholesterol","vascular","blood-sugar","inflammation-risk"],summary:"버터·라드·소기름·팜유·코코넛오일·치즈·가공육에 많은, 이중결합이 없는 지방산입니다. 라우르산·미리스트산·팔미트산이 간의 LDL 수용체를 줄여 LDL 콜레스테롤을 올리는 것은 확실하지만, 스테아르산은 거의 중립이며 어떤 식품에 들어 있는지·무엇 대신 먹는지에 따라 건강 영향이 크게 달라집니다.",pathways:[{title:"간 LDL 수용체 감소 → LDL 콜레스테롤 상승",evidence:"strong",steps:[{title:"간으로 전달",body:"긴사슬 포화지방산(C12~C16)은 암죽미립에 실려 흡수된 뒤, 남은 입자가 간으로 들어가 간세포의 지질 조성을 바꿉니다."},{title:"간세포 신호",body:'포화지방은 간세포 안 콜레스테롤이 에스테르 형태로 저장되지 않고 유리 콜레스테롤로 남도록 기울게 해, 세포가 "콜레스테롤이 충분하다"고 느끼게 만드는 것으로 설명됩니다. 그러면 LDL 수용체 유전자를 켜는 전사인자 SREBP-2의 활성이 떨어집니다(동물 연구에서 제안된 분자 기전).'},{title:"LDL 회수 감소",body:"간 표면의 LDL 수용체가 줄어 혈액 속 LDL 입자가 덜 회수되고 오래 머뭅니다."},{title:"결과",body:"LDL 콜레스테롤이 올라갑니다. LDL은 유전·임상 연구로 동맥경화의 원인 인자임이 확립되어 있습니다. 라우르산(C12)·미리스트산(C14)·팔미트산(C16)이 LDL을 올리고, 스테아르산(C18)은 몸에서 일부가 올레산으로 바뀌어 LDL에 거의 영향이 없습니다."}],note:"라우르산은 HDL도 가장 많이 올립니다. 하지만 약으로 HDL을 올려도 심혈관 사건이 줄지 않았기 때문에, HDL이 함께 오른다는 점을 LDL 상승의 면죄부로 보기는 어렵습니다."},{title:"팔미트산 → 세라마이드·TLR4·NF-κB: 인슐린 저항성과 염증",evidence:"limited",steps:[{title:"팔미트산이 넘칠 때",body:"에너지 과잉·비만 상태에서는 혈중 유리지방산이 늘고 간·근육·지방조직에 팔미트산이 넘칩니다. 팔미트산은 음식뿐 아니라, 당·정제 탄수화물을 많이 먹을 때 간에서 새로 만들어지는 지방(지방 신생합성)의 주산물이기도 합니다."},{title:"세라마이드·DAG 축적",body:"남는 팔미토일-CoA는 세린과 결합해(세린 팔미토일전이효소, SPT) 세라마이드가 되고, 일부는 디아실글리세롤(DAG)로 쌓입니다. 세라마이드는 PP2A·PKCζ를 통해 인슐린 신호의 핵심인 Akt를 끄고, DAG는 PKCθ(근육)·PKCε(간)를 켜서 인슐린 수용체·IRS-1 신호를 막습니다. 세라마이드는 미토콘드리아 전자전달계도 방해해 활성산소 누출을 늘립니다."},{title:"면역 신호",body:"대식세포·지방세포에서 팔미트산은 선천면역 수용체 TLR4 신호와 엮여 IKKβ·JNK를 거쳐 NF-κB를 켜고 TNF-α·IL-6 분비를 늘립니다. NLRP3 인플라마좀을 활성화해 IL-1β도 늘립니다. 다만 팔미트산이 TLR4에 직접 붙는지는 논란이며, 간 단백질 페투인-A를 매개로 하거나 이미 켜진 TLR4 신호를 세포 대사 재편으로 증폭한다는 설명도 있습니다."},{title:"사람에서는",body:"체중이 늘도록 과식시킨 시험에서 팜유(팔미트산) 과식은 해바라기씨유(리놀레산) 과식보다 간 지방·내장지방을 더 늘렸고, 포화지방 과식이 간 지방과 세라마이드를 더 늘렸다는 연구도 있습니다. 하지만 체중이 유지되는 일반 식사에서 포화지방이 CRP 같은 염증 지표를 올린다는 결과는 일관되지 않습니다."}],note:"이 경로의 세부 신호는 대부분 세포·동물 연구에서 나왔고, 과잉 열량·비만이라는 조건에서 두드러집니다."},{title:"어떤 식품에서, 무엇 대신 먹느냐",evidence:"contested",steps:[{title:"대체 영양소",body:"포화지방을 다불포화지방으로 바꾸면 관상동맥질환 위험이 낮아지지만, 흰쌀·흰빵·설탕 같은 정제 탄수화물로 바꾸면 이득이 거의 없었습니다(코호트 통합 분석)."},{title:"식품 매트릭스",body:"치즈는 같은 양의 유지방을 버터로 먹을 때보다 LDL을 덜 올렸다는 무작위 대조시험이 있습니다. 칼슘이 장에서 지방산과 결합해 대변으로 배출되고, 우유 지방구막(MFGM)의 인지질이 콜레스테롤 흡수에 영향을 주는 것으로 추정합니다."},{title:"관찰연구의 엇갈림",body:"요구르트·치즈 같은 발효 유제품은 관찰연구에서 심혈관 위험과 중립 또는 약간 낮은 연관을 보인 반면, 가공육은 위험 증가와 연관됩니다. 포화지방 총량만 본 일부 메타분석에서 심혈관질환과 뚜렷한 연관이 없게 나온 것도 이런 차이가 섞였기 때문으로 보입니다."},{title:"정리",body:'"포화지방은 무해하다"도, "모든 포화지방 식품이 똑같이 해롭다"도 근거와 맞지 않습니다. LDL 상승은 일관되며, 식품별 차이는 연구가 진행 중입니다.'}]}],evidenceNote:"강한 근거: 라우르산·미리스트산·팔미트산은 LDL을 올리며(대조 급식 연구), 2년 이상 포화지방을 줄인 무작위 대조시험을 모은 코크런 고찰에서 심혈관 사건이 약 17% 줄었습니다(총사망률 감소는 뚜렷하지 않음). 논쟁 중: 포화지방 총량과 심혈관질환의 관찰연구 연관은 약하거나 없게 나오기도 하며, 유제품 같은 식품 매트릭스의 영향은 연구가 진행 중입니다. 제한적: 팔미트산이 TLR4·세라마이드를 통해 염증과 인슐린 저항성을 일으키는 기전은 주로 세포·동물, 과식 실험 근거입니다.",facts:["WHO(2023 지침)는 포화지방을 총열량의 10% 미만(2,000kcal 기준 약 22g)으로 권하고, 한국인 영양소 섭취기준은 성인 7% 미만을 제시합니다. 식품 표시의 1일 영양성분 기준치는 15g입니다.","포화지방 비율(대략): 코코넛오일 약 85%, 버터 약 63%, 팜유 약 50%, 소기름 약 50%, 돼지기름 약 40%, 올리브유 약 14%.","초콜릿 원료인 코코아버터는 포화지방이 약 60%지만, 그중 상당 부분이 LDL에 중립적인 스테아르산입니다.","포화지방은 산화에 강해 고온 조리에서 산화물이 적게 생긴다는 장점이 있습니다. 이는 혈중 지질에 대한 영향과는 별개의 문제입니다."],cautions:["LDL 콜레스테롤이 높거나 심혈관질환이 있으면 포화지방을 줄이는 것이 표준 권고입니다(미국심장협회는 이 경우 총열량의 6% 이하 권고).","저탄고지·키토 식단에서 버터·코코넛오일을 크게 늘린 뒤 LDL이 급격히 오르는 사람이 있으니 혈액검사로 확인하세요."],refs:["Mensink RP. WHO 2016 — 포화지방산이 혈중 지질에 미치는 영향 체계적 고찰·회귀분석","Hooper L, et al. Cochrane Database Syst Rev 2020 — 포화지방 섭취 감소와 심혈관질환 (무작위 대조시험 메타분석)","Rosqvist F, et al. Diabetes 2014 — 포화지방(팜유)과 다불포화지방(해바라기씨유) 과식이 간·내장지방에 미치는 차이","WHO 2023 — Saturated fatty acid and trans-fatty acid intake for adults and children (지침)"]},{id:"trans-fat",name:"트랜스지방",en:"Trans fat",aliases:["트랜스지방산","부분경화유","PHO","엘라이드산","경화유","trans fatty acid","elaidic acid"],kind:"지방산",effect:"harm",tags:["cholesterol","vascular","inflammation-risk","oxidative-risk"],summary:"식물성 기름에 수소를 부분적으로 첨가해 굳힌 부분경화유(PHO)에서 생기는 지방산으로, 대표 성분은 엘라이드산입니다. LDL은 올리고 HDL은 낮추는 이중 악영향에 염증과 혈관 내피 기능 저하까지 확인되어 식이 지방 중 가장 해로운 것으로 평가되며, 여러 나라가 사용을 금지했습니다.",pathways:[{title:"CETP 활성화 → LDL 상승·HDL 감소",evidence:"strong",steps:[{title:"만들어지는 과정",body:"액체 식물성 기름에 니켈 촉매로 수소를 부분 첨가하면 일부 시스(cis) 이중결합이 트랜스(trans) 형태로 뒤집힙니다. 트랜스 지방산은 사슬이 곧게 펴져 포화지방처럼 상온에서 굳고 잘 산패되지 않아, 과자·튀김·쇼트닝에 널리 쓰였습니다."},{title:"혈중 지단백 변화",body:"트랜스지방은 콜레스테릴에스테르 전달 단백(CETP)의 활성을 높여 HDL의 콜레스테롤을 LDL·VLDL로 옮기고, LDL 입자가 혈중에서 제거되는 속도를 늦춥니다."},{title:"지질 결과",body:"LDL은 포화지방만큼 올리면서 HDL은 낮추고, 중성지방과 지단백(a)도 올립니다. 그래서 총콜레스테롤/HDL 비율에 대한 악영향이 같은 양의 포화지방보다 약 2배 큽니다."},{title:"임상 결과",body:"전향적 연구를 통합한 결과, 트랜스지방 섭취가 총열량의 2%(2,000kcal 기준 약 4.4g) 늘 때마다 관상동맥질환 위험이 약 23% 높았습니다."}]},{title:"혈관 내피의 염증과 기능 저하",evidence:"moderate",steps:[{title:"세포막에 편입",body:"먹은 트랜스 지방산은 혈관 내피세포·혈소판·지방조직의 세포막 인지질에 들어가 막의 유동성과 지질 뗏목(lipid raft) 구성을 바꿀 수 있습니다."},{title:"염증 신호 (세포 연구)",body:"내피세포·대식세포 실험에서 엘라이드산은 NF-κB를 활성화하고 활성산소 생성을 늘리며, 백혈구를 붙잡는 접착분자(ICAM-1·VCAM-1)와 TNF-α 발현을 높였습니다. 내피의 산화질소(NO) 생성은 줄었습니다."},{title:"사람에서 측정된 변화",body:"통제된 급식 시험에서 트랜스지방 식단은 CRP 같은 염증 지표를 올렸고, 대규모 간호사 코호트에서도 섭취가 많을수록 CRP·IL-6·TNF 수용체와 가용성 접착분자·E-셀렉틴 농도가 높았습니다. 포화지방을 트랜스지방으로 바꾼 시험에서는 혈류매개 혈관확장(FMD)이 떨어졌습니다."},{title:"결과",body:"내피 기능 저하와 만성 염증은 동맥경화판의 형성과 불안정화를 부추깁니다. 트랜스지방의 심혈관 위험이 지질 변화만으로 예상되는 것보다 큰 이유로 설명됩니다."}],note:"염증 신호의 세부(NF-κB·활성산소)는 세포 연구이고, 염증 지표 상승과 내피 기능 저하는 사람에서 확인됐습니다."}],evidenceNote:"강한 근거: 산업적 트랜스지방은 LDL을 올리고 HDL을 낮추며(대조 급식 메타분석), 섭취량과 관상동맥질환 위험이 일관되게 연결됩니다. 미국 뉴욕주 일부 카운티에서 트랜스지방 사용을 제한한 뒤 심근경색·뇌졸중 입원이 줄었다는 자연실험 결과도 있습니다. 안전한 섭취 수준은 제시되지 않으며, WHO는 총열량의 1% 미만과 산업적 트랜스지방의 완전 제거를 권고합니다. 우유·소고기의 천연 트랜스지방은 통상 섭취량에서 뚜렷한 해가 확인되지 않았습니다.",facts:['미국 FDA는 2015년 부분경화유가 더 이상 "일반적으로 안전하다(GRAS)"고 볼 수 없다고 결정했고, 2018년부터 식품 첨가를 원칙적으로 금지했습니다. WHO는 2018년 산업적 트랜스지방 퇴출 전략(REPLACE)을 발표했습니다.','한국은 2007년부터 가공식품의 트랜스지방 표시를 의무화했습니다. 1회 제공량당 0.2g 미만은 "0"으로 표시할 수 있어, "0g"이어도 아주 적은 양은 들어 있을 수 있습니다. 원재료명에 "부분경화유"가 있는지 확인하는 것이 더 정확합니다.',"소·양 같은 되새김 동물의 위에서 미생물이 만드는 천연 트랜스지방(주로 바크센산)은 유제품·소고기 지방에 수 % 들어 있습니다. 통상 섭취량에서는 심혈관 위험과 뚜렷한 연관이 없지만, 매우 많은 양을 준 시험에서는 LDL을 비슷하게 올렸습니다.","가정에서 기름을 튀김 온도로 가열해도 트랜스지방은 아주 조금만 생깁니다. 반복 가열한 기름의 주된 문제는 트랜스지방보다 산화물입니다(→ 산화 지질 참고)."],cautions:["수입 과자, 저가 제과·제빵, 쇼트닝을 쓰는 제품에는 아직 부분경화유가 쓰일 수 있으니 원재료명을 확인하세요."],refs:["Mozaffarian D, et al. N Engl J Med 2006 — 트랜스지방산과 심혈관질환 (종합 고찰)","Mozaffarian D, et al. Am J Clin Nutr 2004 — 트랜스지방 섭취와 여성의 전신 염증 지표 (간호사 건강 연구)","de Roos NM, et al. Arterioscler Thromb Vasc Biol 2001 — 포화지방을 트랜스지방으로 대체 시 HDL 감소와 혈관 내피 기능 저하","WHO 2018 — REPLACE: 산업적 트랜스지방 퇴출 실행 패키지"]},{id:"mct",name:"중쇄지방산 (MCT)",en:"Medium-chain triglycerides (MCT)",aliases:["MCT오일","MCT 오일","중쇄중성지방","중쇄지방","카프릴산","카프르산","C8","C10","caprylic acid","방탄커피"],kind:"지방산",effect:"mixed",tags:["energy","cholesterol","brain"],summary:'탄소 6~12개짜리 지방산으로 된 중성지방입니다. MCT오일의 주성분인 카프릴산(C8)·카프르산(C10)은 문맥을 통해 곧장 간으로 가서 빠르게 연소되고 케톤을 만듭니다. 반면 코코넛오일의 주성분인 라우르산(C12)은 상당 부분 긴사슬 지방처럼 흡수되고 LDL을 올리므로, "코코넛오일 = MCT오일"이라는 마케팅은 과장입니다.',pathways:[{title:"문맥 → 간 → 빠른 연소와 케톤 생성",evidence:"strong",steps:[{title:"소화",body:"MCT는 위·소장의 지방분해효소에 빠르게 분해되고, 담즙 미셀에 크게 의존하지 않고도 흡수됩니다."},{title:"흡수 경로",body:"긴사슬 지방산은 장세포에서 암죽미립으로 포장되어 림프관을 거쳐 전신을 돈 뒤에야 간에 이르지만, 중쇄 지방산(C8·C10)은 대부분 그대로 문맥 혈액으로 들어가 알부민에 실려 곧장 간으로 갑니다."},{title:"미토콘드리아로 직행",body:"간세포에서 긴사슬 지방산이 통과해야 하는 카르니틴 운반 관문(CPT1)을 대부분 거치지 않고 미토콘드리아로 들어가 빠르게 베타산화됩니다. 그래서 CPT1을 막는 말로닐-CoA(식후 인슐린 신호)의 억제도 덜 받습니다."},{title:"케톤 생성",body:"아세틸-CoA가 한꺼번에 많이 생기면 HMG-CoA 합성효소 경로로 넘어가 베타하이드록시부티르산·아세토아세트산 같은 케톤체가 만들어집니다. C8이 가장 케톤을 잘 만들며, 탄수화물을 함께 먹으면 상승 폭은 작습니다."}],note:"이 특성 덕분에 지방 흡수장애, 유미흉(림프 누출), 일부 지방산 대사 질환, 소아 뇌전증의 케톤 식이(MCT 케톤 식이)에 의료용으로 쓰여 왔습니다."},{title:"코코넛오일은 MCT오일이 아니다",evidence:"strong",steps:[{title:"조성",body:"코코넛오일 지방산의 약 절반은 라우르산(C12)이고, 미리스트산(C14)·팔미트산(C16)도 들어 있습니다. MCT오일의 주성분인 C8·C10은 합쳐도 10~15% 안팎입니다."},{title:"라우르산의 흡수",body:"라우르산은 중쇄와 긴사슬의 경계에 있어, 상당 부분이 긴사슬 지방처럼 암죽미립에 실려 림프로 흡수됩니다. 간으로 직행하는 C8·C10과 대사 방식이 다릅니다."},{title:"혈중 지질",body:"라우르산은 간 LDL 수용체 활성을 낮춰 LDL을 올립니다(→ 포화지방 참고). 무작위 대조시험을 모은 메타분석에서 코코넛오일은 비열대성 식물성 기름보다 LDL을 약 10mg/dL 더 올렸습니다(HDL도 약간 올림)."},{title:"결론",body:"코코넛오일로 MCT오일 연구 결과(케톤 생성, 체중 효과)를 기대하기는 어렵습니다. 미국심장협회도 LDL 상승을 이유로 코코넛오일 사용을 권하지 않습니다."}]},{title:"체중·포만감 효과 (작음)",evidence:"moderate",steps:[{title:"열 발생",body:"MCT는 지방조직에 저장되기보다 바로 연소되는 경향이 있어, 같은 열량의 긴사슬 지방보다 식후 에너지 소비가 약간 더 늘어납니다."},{title:"포만감",body:"케톤과 장 호르몬 변화로 포만감이 조금 커지고 다음 끼니 섭취가 줄었다는 단기 연구가 있습니다."},{title:"실제 체중 변화",body:"긴사슬 지방을 MCT로 바꾼 무작위 대조시험 메타분석에서 체중은 평균 약 0.5kg 더 줄었습니다. 의미는 있지만 작은 효과입니다."},{title:"주의점",body:"MCT오일도 1g에 약 8.3kcal입니다. 방탄커피처럼 기존 식사에 얹어 먹으면 열량만 늘어납니다."}]}],evidenceNote:"확실한 것: C8·C10은 문맥으로 흡수되어 빠르게 산화되고 케톤을 만들며, 의료용 영양에 오래 쓰여 왔습니다. 코코넛오일은 비열대성 식물성 기름보다 LDL을 올립니다(메타분석). 제한적인 것: 체중 감소 효과는 작고 단기 연구 위주이며, 알츠하이머병 등 인지 기능 개선은 소규모 시험에서 일부 결과가 있을 뿐 확립되지 않았습니다. C8·C10 자체의 장기적인 LDL·심혈관 영향에 대한 자료는 부족합니다.",facts:["MCT오일은 코코넛오일·팜핵유에서 주로 C8·C10만 분리해 만든 정제 기름으로, 상온에서 액체이고 맛과 향이 거의 없습니다.","코코넛오일은 약 85%가 포화지방이라 상온(약 24℃ 이하)에서 굳습니다.","케톤을 가장 많이 만드는 것은 C8이고, C10은 그보다 적으며, 라우르산(C12)은 훨씬 적습니다."],cautions:["한 번에 많이 먹으면 복통·설사·메스꺼움이 흔합니다. 1작은술 정도부터 시작해 나눠 드세요.","제1형 당뇨병이나 간질환이 있거나 케톤 식이를 하려면 의료진과 상의하세요."],refs:["Neelakantan N, et al. Circulation 2020 — 코코넛오일 섭취가 심혈관 위험 인자에 미치는 영향 (무작위 대조시험 메타분석)","Mumme K, Stonehouse W. J Acad Nutr Diet 2015 — MCT의 체중 감소 효과 (무작위 대조시험 메타분석)","Sacks FM, et al. Circulation 2017 — 미국심장협회 식이지방과 심혈관질환 권고 (코코넛오일 포함)"]},{id:"oxalate",name:"옥살산",en:"Oxalate (oxalic acid)",aliases:["옥살산염","수산","수산염","옥살레이트","oxalic acid","수산칼슘","저옥살산"],kind:"항영양소",effect:"caution",tags:["bone-muscle","inflammation-risk","oxidative-risk"],summary:"시금치·근대·비트잎·아몬드·코코아·찻잎 등에 많은 유기산입니다. 장에서 칼슘과 결합해 칼슘 흡수를 방해하고, 흡수된 옥살산은 분해되지 못한 채 신장으로 배출되며 칼슘과 만나 신장결석(수산칼슘 결석)의 재료가 됩니다. 건강한 사람에게 채소 속 옥살산이 문제가 되는 경우는 드물지만, 결석이나 흡수장애가 있으면 조절이 필요합니다.",pathways:[{title:"장 속에서 칼슘과 결합",evidence:"strong",steps:[{title:"두 가지 형태",body:"식물 속 옥살산은 물에 녹는 가용성 형태(옥살산 칼륨·나트륨)와 이미 칼슘과 결합해 녹지 않는 결정 형태로 존재합니다. 시금치는 가용성 옥살산이 특히 많습니다."},{title:"장 속 결합",body:"장 안에서 가용성 옥살산은 함께 있는 칼슘·마그네슘과 결합해 녹지 않는 수산칼슘이 되어 대변으로 나갑니다. 그래서 시금치 칼슘의 흡수율은 약 5%로, 우유(약 27%)보다 훨씬 낮습니다."},{title:"흡수되는 몫",body:"칼슘과 결합하지 못한 옥살산 일부(대개 먹은 양의 몇 % 수준)가 소장·대장에서 흡수됩니다. 식사에 칼슘이 적으면 흡수가 늘고, 대장의 옥살산 분해 세균(옥살로박터 포르미게네스 등)이 적어도 늘어납니다."},{title:"흡수가 크게 느는 경우",body:"지방 흡수장애(비만대사 수술 후, 크론병, 단장증후군)에서는 흡수되지 못한 지방산이 칼슘을 먼저 붙잡아, 옥살산이 자유롭게 남아 대장에서 과도하게 흡수됩니다(장성 과옥살산뇨증)."}]},{title:"신장에서 결정 → 결석·세포 손상·염증",evidence:"moderate",steps:[{title:"배출",body:"사람에게는 옥살산을 분해하는 효소가 없어, 흡수된 옥살산은 그대로 신장에서 걸러져 소변으로 나갑니다. 소변 옥살산의 상당 부분(대략 절반 안팎)은 간에서 스스로 만든 것이고 나머지가 음식에서 옵니다."},{title:"과포화·결정화",body:"소변 속 칼슘과 옥살산이 녹을 수 있는 한계를 넘으면 수산칼슘 결정이 생깁니다. 소변량이 적거나 소변 칼슘이 많을 때(짠 식사 등) 쉽게 생기고, 소변의 구연산·마그네슘은 결정화를 막습니다."},{title:"세포 손상과 염증 (세포·동물 연구)",body:"고농도 옥살산과 결정은 세뇨관 세포의 NADPH 산화효소를 자극해 활성산소를 만들고, 지질과산화로 세포막을 손상시킵니다. 세포에 삼켜진 결정은 NLRP3 인플라마좀을 켜서 IL-1β를 분비시키고, 손상된 세포 표면에는 결정이 더 잘 달라붙는 악순환이 생깁니다."},{title:"결과",body:"결정이 자라 신장결석이 되며, 신장결석의 약 70~80%가 수산칼슘 결석입니다. 드물게 녹즙·스무디로 짧은 기간 매우 많은 옥살산을 먹고 급성 신장 손상(옥살산 신병증)이 생긴 사례가 보고됐습니다."}],note:"결석 형성은 사람에서 확인된 사실이고, 활성산소·인플라마좀 단계는 주로 세포·동물 연구입니다."},{title:"고용량 비타민 C → 옥살산",evidence:"moderate",steps:[{title:"분해",body:"비타민 C(아스코르브산)는 몸속에서 일부가 산화되어 디하이드로아스코르브산을 거쳐 옥살산으로 분해됩니다."},{title:"용량 의존",body:"음식으로 먹는 양에서는 문제가 거의 없지만, 하루 1,000mg 이상의 보충제를 먹으면 소변 옥살산이 늘어납니다."},{title:"결과",body:"스웨덴 남성 코호트에서 비타민 C 보충제를 먹은 사람의 신장결석 위험이 약 2배였습니다. 여성 코호트에서는 연관이 뚜렷하지 않았습니다."}]}],evidenceNote:'확실한 것: 옥살산은 장에서 칼슘 흡수를 줄이고, 소변 옥살산이 많으면 수산칼슘 결석 위험이 커집니다. 결석 예방에는 칼슘을 줄이는 것이 아니라 식사와 함께 충분히 먹는 것이 도움이 됩니다(코호트·무작위 대조시험). 근거 부족: "옥살산이 몸에 쌓여 관절통·피로·통증을 일으키니 저옥살산 식단을 해야 한다"는 주장은, 결석이나 흡수장애가 없는 사람에 대해 사람 연구로 확인되지 않았습니다.',facts:["데치거나 삶으면 가용성 옥살산이 물로 빠져나가 대략 30~90% 줄어듭니다(데친 물은 버리세요). 찌기는 덜 줄고, 굽기·볶기로는 거의 줄지 않습니다.","옥살산이 많은 식품: 시금치, 근대, 비트잎, 대황, 아몬드·캐슈너트, 코코아·초콜릿, 찻잎.","두부·유제품·멸치처럼 칼슘이 든 식품을 함께 먹으면 장에서 옥살산이 묶여 흡수가 줄어듭니다.","신장결석이 있는 사람도 옥살산 식품을 완전히 끊기보다, 물을 충분히 마시고(하루 소변 2L 이상), 칼슘을 식사로 충분히 먹고, 소금과 동물성 단백질을 줄이는 것이 표준 권고입니다."],cautions:["수산칼슘 결석이 있었던 사람은 시금치 녹즙·생 시금치 스무디처럼 옥살산을 대량으로 먹는 습관을 피하세요.","비만대사 수술을 받았거나 크론병 등 지방 흡수장애가 있으면 옥살산 흡수가 크게 늘 수 있어 의료진의 식이 지도가 필요합니다.","신장질환자는 스타프루트(카람볼라)를 먹지 마세요. 옥살산과 신경독성 물질이 함께 들어 있어 급성 신손상·신경 증상 사례가 보고되어 있습니다."],refs:["Curhan GC, et al. N Engl J Med 1993 — 식이 칼슘 섭취가 많을수록 신장결석 위험 감소 (코호트)","Heaney RP, et al. Am J Clin Nutr 1988 — 시금치 칼슘의 흡수율","Thomas LD, et al. JAMA Intern Med 2013 — 비타민 C 보충제와 남성 신장결석 위험 (스웨덴 코호트)","Mulay SR, et al. J Clin Invest 2013 — 수산칼슘 결정이 NLRP3 인플라마좀을 통해 신장 염증을 일으킴 (동물 연구)"]},{id:"phytate",name:"피트산",en:"Phytate (phytic acid, IP6)",aliases:["피틴산","피트산염","피테이트","IP6","이노시톨 육인산","phytic acid","피타아제"],kind:"항영양소",effect:"mixed",tags:["antioxidant","gut","bone-muscle","cancer"],summary:"통곡물·콩·견과·씨앗의 겨층과 배아에 인을 저장하는 형태(이노시톨 육인산, IP6)입니다. 철·아연·칼슘을 붙잡아 흡수를 떨어뜨리는 대표적 항영양소지만, 불리기·발효·발아로 상당 부분 분해되고, 철을 붙잡아 활성산소 생성을 막는 항산화 작용과 결석 억제 같은 이점도 있습니다.",pathways:[{title:"무기질 킬레이트 → 철·아연 흡수 감소",evidence:"strong",steps:[{title:"구조",body:"이노시톨 고리에 인산기 6개가 붙어 있어 장의 pH에서 강한 음전하를 띱니다."},{title:"결합",body:"음전하를 띤 인산기가 철(Fe³⁺)·아연(Zn²⁺)·칼슘(Ca²⁺)·마그네슘 같은 양이온을 붙잡아(킬레이트) 녹지 않는 복합체를 만듭니다."},{title:"분해하지 못함",body:"사람의 소장에는 피트산을 분해하는 효소(피타아제)가 거의 없어, 복합체는 흡수되지 못하고 대장으로 넘어갑니다."},{title:"결과",body:"비헴철과 아연의 흡수가 특히 크게 줄어듭니다. WHO/FAO는 식사의 피트산:아연 몰비가 15를 넘으면 아연 흡수율이 낮은 식단으로 분류합니다. 정제되지 않은 곡물·콩을 주식으로 하는 지역, 채식인, 성장기 아동·임신부에게 의미가 큽니다."}]},{title:"불리기·발효·발아로 분해",evidence:"strong",steps:[{title:"곡물 속 효소 깨우기",body:"곡물과 콩에는 스스로 피트산을 분해하는 효소(피타아제)가 들어 있습니다. 따뜻한 물에 불리면 이 효소가 활성화됩니다."},{title:"발아",body:"싹이 트는 동안 씨앗은 저장해 둔 인을 쓰기 위해 피타아제를 늘려 피트산을 스스로 분해합니다(발아현미·새싹 곡물)."},{title:"발효",body:"사워도우의 젖산균이 반죽을 산성으로 만들면 밀가루 속 피타아제가 잘 작동하는 pH가 되어, 일반 이스트 빵보다 피트산이 훨씬 많이 줄어듭니다. 된장·청국장·템페 같은 콩 발효식품도 미생물 효소로 피트산이 줄어듭니다."},{title:"가열만으로는 부족",body:"피트산은 열에 강해 단순히 끓이는 것만으로는 조금밖에 줄지 않습니다. 불린 물을 버리고 조리하면 조금 더 줄어듭니다."}]},{title:"이로운 면: 철 킬레이트 항산화·결석 억제",evidence:"limited",steps:[{title:"펜톤 반응 차단",body:"자유로운 철 이온은 과산화수소와 반응해(펜톤 반응) 가장 공격적인 활성산소인 하이드록실 라디칼(•OH)을 만듭니다. 피트산은 철을 붙잡아 이 반응을 막습니다."},{title:"장 속 항산화",body:"장 안에서 철이 촉매하는 지질과산화를 줄이는 것으로 보고되며, 동물실험에서 대장 종양을 줄인 결과가 있습니다."},{title:"결석 억제",body:"소변 속 피트산은 수산칼슘 결정이 자라는 것을 억제합니다. 대규모 여성 코호트에서 피트산 섭취가 많을수록 신장결석 위험이 낮았습니다."},{title:"한계",body:"항암 효과는 세포·동물 연구 위주이며, IP6 보충제의 효과를 사람에서 확인한 시험은 부족합니다."}]}],evidenceNote:"확실한 것: 피트산은 비헴철·아연 흡수를 용량 의존적으로 줄이며(동위원소 흡수 연구), 불리기·발효·발아가 이를 개선합니다. 고기·생선·비타민 C 식품을 함께 먹는 균형 잡힌 식사에서 통곡물 속 피트산이 결핍을 일으키는 경우는 드뭅니다. 제한적인 것: 항산화·항암·결석 억제 같은 이점은 동물 연구와 관찰연구 수준입니다.",facts:["곡물·콩 속 인의 대부분(약 60~80%)이 피트산 형태로 저장되어 있습니다.","비타민 C와 고기·생선(육류 인자)은 피트산의 비헴철 흡수 방해를 상당 부분 상쇄합니다(→ 비헴철 참고).","현미를 따뜻한 물에 충분히 불리거나 발아현미를 쓰면 피트산이 줄고 밥도 부드러워집니다."],cautions:["철결핍성 빈혈·아연 결핍이 있거나 채식을 한다면 콩·곡물을 불리거나 발효해 먹고, 비타민 C가 많은 채소·과일을 함께 드세요.","철분제·아연 보충제는 통곡물·콩이 많은 식사와 시간을 떨어뜨려 먹으면 흡수에 유리합니다."],refs:["Gibson RS, et al. Nutr Rev 2018 — 식물성 식품의 피트산이 철·아연 생체이용률에 미치는 영향","WHO/FAO 2004 — Vitamin and mineral requirements in human nutrition (피트산:아연 몰비 기준)","Graf E, Eaton JW. Free Radic Biol Med 1990 — 피트산의 항산화 기능 (철 킬
