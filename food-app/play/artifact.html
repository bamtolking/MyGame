는 사람 시험 근거는 부족합니다. 같은 이유로 "여성호르몬 때문에 유방암 환자는 먹으면 안 된다"는 걱정도 근거가 약합니다.'},{claim:"석류 주스가 전립선암을 막는다",truth:"치료 뒤 PSA가 다시 오르는 환자에서 석류 주스가 PSA 상승 속도를 늦췄다는 초기 시험(Pantuck 등, Clin Cancer Res 2006)은 대조군이 없었습니다. 이후 위약 대조 시험에서는 위약군과 뚜렷한 차이가 없었습니다. 치료를 대신할 근거는 없습니다."}]},{id:"grape",name:"포도",en:"Grape",aliases:["캠벨","캠벨얼리","거봉","샤인머스캣","머루포도","청포도","적포도","건포도","포도주스","grape","grapes","raisin"],emoji:"🍇",category:"과일",summary:'적·흑포도 껍질의 안토시아닌, 씨의 프로안토시아니딘, 퀘르세틴이 주요 폴리페놀이고, 유명한 레스베라트롤은 껍질에 미량만 있습니다. 당이 100g당 약 15g으로 과일 중 많은 편이라 껍질째 적당량 먹는 것이 좋습니다. "레드와인의 레스베라트롤이 건강에 좋다"는 이야기는 실제 함량과 사람 근거를 보면 크게 과장되었습니다.',verdict:{tone:"balanced",text:"껍질째 한 번에 한 컵(약 150g) 정도로. 짙은 색 포도일수록 폴리페놀이 많고, 주스·건포도는 당이 농축됩니다."},basis:"생 포도(적·청포도, 껍질 포함) 100g",serving:{label:"한 컵 (약 150g)",grams:150},nutrients:{kcal:69,carb:18.1,sugar:15.5,fiber:.9,protein:.72,fat:.16,satFat:.05,mufa:.01,pufa:.05,sodium:2,potassium:191,calcium:10,magnesium:7,iron:.36,zinc:.07,vitA:3,vitC:3.2,vitE:.19,vitK:14.6,vitB1:.07,vitB2:.07,vitB6:.09,folate:2},compounds:[{id:"anthocyanin",amount:"적·흑포도 껍질에 집중 (청포도·샤인머스캣에는 거의 없음)",role:"캠벨·거봉 같은 짙은 포도의 보라색 색소로 껍질에 몰려 있습니다. 대사물이 혈관 내피의 산화질소 생성과 Nrf2 항산화 신호에 관여하는 것으로 연구됩니다."},{id:"resveratrol",amount:"껍질에 미량 (생포도 100g당 대략 1mg 미만)",role:"곰팡이 감염·자외선 스트레스에 반응해 껍질에서 만들어지는 방어 물질입니다. 동물실험에서 효과를 낸 양은 사람으로 치면 하루 수백 mg 이상이라, 포도로 먹는 양과는 수백 배 이상 차이가 납니다."},{id:"added-sugar",effect:"mixed",amount:"당 약 15g/100g (포도당·과당이 거의 반반)",role:"과일 중 당이 많고 섬유는 적어(0.9g) 혈당을 비교적 빨리 올리는 편이지만, GI는 대략 45~60의 중간 정도입니다. 주스·건포도로 가공하면 섬유 없이 당이 농축됩니다."},{id:"quercetin",amount:"껍질에 소량",role:"껍질에 있는 플라보놀로, 안토시아닌·프로안토시아니딘과 함께 항염 신호 조절에 관여합니다."},{id:"potassium",amount:"191mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."},{id:"vitamin-k",amount:"약 15μg/100g",role:"한 컵이면 기준치의 약 30%입니다. 와파린 복용자는 매일 비슷한 양을 유지하는 것이 좋습니다."}],howToEat:[{title:"껍질째, 씨가 있으면 씨도 씹어서",body:"안토시아닌·레스베라트롤·퀘르세틴은 껍질에, 프로안토시아니딘(축합형 탄닌)은 씨에 몰려 있습니다. 과육만 빨아 먹고 껍질을 뱉으면 폴리페놀의 대부분을 버리는 셈입니다."},{title:"송이째 흐르는 물에 씻기",body:"표면의 흰 가루(과분)는 포도가 스스로 만드는 천연 왁스로 농약이 아닙니다. 가지째 흐르는 물에 헹군 뒤 알을 떼어 드세요."},{title:"주스·건포도보다 생과로",body:"건포도는 수분이 빠져 당이 100g당 약 60g으로 4배가량 농축되고, 주스는 섬유가 빠져 흡수가 빠릅니다. 대규모 코호트(Muraki 등, BMJ 2013)에서 포도·건포도를 포함한 통과일은 제2형 당뇨 위험 감소와, 과일주스는 위험 증가와 연관됐습니다."},{title:"견과·치즈와 함께",body:"단백질·지방이 있는 음식과 함께 먹으면 위 배출이 느려져 당 흡수가 완만해집니다."}],pairings:{good:["견과·치즈 (혈당 완만)","짙은 색 포도 위주로"],avoid:["포도주스·가당 포도 음료를 물처럼 마시기"]},cautions:["개·고양이에게 포도와 건포도는 소량으로도 급성 신장 손상을 일으킬 수 있습니다(원인 물질로 주석산이 거론됨). 반려동물이 먹지 않도록 주의하세요.","5세 미만 어린이에게 큰 포도알은 기도를 막을 수 있어 4등분해 주는 것이 안전합니다.","레스베라트롤 고용량 보충제는 혈소판 기능과 약물 대사효소에 영향을 줄 수 있어, 항응고제를 먹는다면 의사와 상의하세요."],myths:[{claim:"레드와인에 레스베라트롤이 있어 매일 한두 잔은 건강에 좋다",truth:"레드와인의 레스베라트롤은 보통 1L당 수 mg 수준이라, 동물실험의 효과량을 맞추려면 하루 수백 잔 이상이 필요합니다. 이탈리아 노인 코호트(InCHIANTI, Semba 등, JAMA Intern Med 2014)에서 식사로 섭취한 레스베라트롤 대사물 수치는 사망·심혈관질환·암 위험과 관련이 없었습니다. 알코올은 소량에서도 여러 암 위험을 높이는 1군 발암물질이라, 건강을 위해 와인을 시작할 이유는 없습니다."},{claim:"포도는 당이 많아 당뇨가 있으면 먹으면 안 된다",truth:"과일 중 당이 많은 편이지만 GI는 중간 정도이고, 통과일로서의 포도 섭취는 당뇨 위험 증가와 연관되지 않았습니다. 당뇨가 있다면 한 번에 한 줌(약 100g, 당 약 15g) 정도로 양을 정하고 자신의 혈당 반응을 확인하는 것이 요령입니다."}]},{id:"avocado",name:"아보카도",en:"Avocado",aliases:["아보카도","과카몰리","아보카도오일","악어배","avocado","hass avocado","guacamole"],emoji:"🥑",category:"과일",summary:"지방이 약 15%로 과일로서는 특이하게 올리브유처럼 올레산(단일불포화지방)이 대부분이고, 식이섬유·칼륨·엽산·비타민 E가 함께 들어 있습니다. 함께 먹은 채소의 카로티노이드 흡수를 몇 배로 높인다는 것이 사람 시험으로 확인됐습니다. 반 개에 약 110kcal로 열량 밀도가 높으니 다른 지방을 대체하는 방식으로 먹는 것이 좋습니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 반 개 정도를 채소 샐러드에 곁들이면 채소 영양소 흡수까지 늘어납니다."},basis:"생 아보카도 과육 100g",serving:{label:"반 개 (과육 약 70g)",grams:70},nutrients:{kcal:160,carb:8.5,sugar:.66,fiber:6.7,protein:2,fat:14.7,satFat:2.1,mufa:9.8,pufa:1.8,la:1.67,ala:.11,sodium:7,potassium:485,calcium:12,magnesium:29,iron:.55,zinc:.64,selenium:.4,vitA:7,vitC:10,vitE:2.07,vitK:21,vitB1:.07,vitB2:.13,vitB6:.26,folate:81},compounds:[{id:"oleic-acid",amount:"약 9g/100g (전체 지방의 약 2/3)",role:"올리브유와 같은 단일불포화지방으로, 포화지방 대신 먹으면 LDL을 낮춥니다. 이중결합이 하나뿐이라 다불포화지방보다 산화에 강합니다."},{id:"prebiotic-fiber",amount:"식이섬유 6.7g/100g (과일 중 최상위권)",role:"반 개로 식이섬유 약 4.7g을 채웁니다. 수용성·불용성 섬유가 섞여 있어 대장에서 짧은사슬지방산을 만들고 포만감을 높입니다."},{id:"potassium",amount:"485mg/100g (바나나보다 많음)",role:"나트륨 배출과 혈관 긴장 조절을 통해 혈압을 낮추는 방향으로 작용합니다."},{id:"folate",amount:"81μg/100g",role:"반 개면 엽산 기준치의 약 14%로, 과일 중 많은 편입니다."},{id:"vitamin-e",amount:"약 2.1mg/100g",role:"세포막의 불포화지방이 산화되는 연쇄반응을 끊는 지용성 항산화제로, 아보카도 자체의 지방과 함께 있어 흡수가 잘 됩니다."},{id:"lutein",amount:"약 0.27mg/100g",role:"양은 시금치보다 훨씬 적지만 지방과 함께 들어 있어 흡수율이 높습니다. 아보카도의 진짜 역할은 함께 먹은 채소의 루테인·카로틴 흡수를 돕는 것입니다."},{id:"vitamin-k",amount:"약 21μg/100g",role:"반 개면 기준치의 약 20%입니다."}],howToEat:[{title:"채소 샐러드·살사에 넣기",body:"카로티노이드는 지용성이라 장에서 담즙산과 함께 미셀을 이뤄야 흡수됩니다. 사람 시험(Unlu 등, J Nutr 2005)에서 샐러드에 아보카도를 넣자 루테인과 α·β-카로틴 흡수가 여러 배로 늘었고, 토마토 살사에 넣자 라이코펜 흡수도 크게 늘었습니다."},{title:"버터·마요네즈 대신 빵에 바르기",body:"포화지방이 많은 스프레드를 아보카도로 바꾸면 지방의 질이 좋아집니다. 하루 1개를 포함한 중등도 지방 식단이 LDL을 낮췄다는 교차 시험(Wang 등, J Am Heart Assoc 2015)이 있습니다."},{title:"자른 면에는 레몬즙",body:"자르면 폴리페놀 산화효소(PPO)가 작용해 갈변합니다. 레몬·라임즙의 산과 비타민 C가 이를 늦추고, 씨를 남긴 쪽을 랩으로 밀착해 두면 덜 변합니다."},{title:"후숙은 실온에서, 익으면 냉장",body:"껍질이 짙어지고 살짝 눌렀을 때 들어가면 먹기 좋은 상태입니다. 딱딱하면 실온에서 며칠 후숙하고, 익은 뒤에는 냉장해 과숙을 늦추세요."}],pairings:{good:["토마토·당근·시금치 샐러드 (카로티노이드 흡수↑)","달걀·통곡물 빵"],avoid:["버터·베이컨과 함께 과하게 (열량·포화지방 누적)"]},cautions:["라텍스 알레르기가 있다면 아보카도·바나나·키위·밤에 교차반응(라텍스-과일 증후군)을 보일 수 있습니다. 아보카도의 1형 키티네이스(Pers a 1)가 라텍스의 헤베인과 구조가 비슷하기 때문입니다.","와파린 복용자에서 아보카도를 먹은 뒤 INR이 떨어졌다는 사례 보고가 있습니다. 갑자기 많이 먹기 시작하지 말고 섭취량을 일정하게 유지하세요.","신장질환으로 칼륨을 제한 중이라면 양을 조절하세요."],myths:[{claim:"아보카도는 지방이 많아 살찌고 콜레스테롤을 올린다",truth:"지방 대부분이 올레산이고 콜레스테롤은 없습니다. 하루 1개를 6개월 먹게 한 대규모 무작위 시험(HAT, Lichtenstein 등, J Am Heart Assoc 2022)에서 체중과 내장지방은 늘지 않았고 LDL은 소폭 낮아졌습니다. 다만 뱃살을 줄여 주지도 않았으니, 다른 지방을 대체하는 방식이 핵심입니다."}]},{id:"brown-rice",name:"현미",en:"Brown rice",aliases:["현미밥","발아현미","찹쌀현미","오분도미","칠분도미","brown rice","germinated brown rice"],emoji:"🌾",category:"곡물",summary:"왕겨만 벗기고 쌀겨층과 씨눈을 남긴 쌀로, 백미보다 식이섬유는 4~6배, 마그네슘은 약 3배 많습니다. 백미 일부를 현미로 바꾸면 제2형 당뇨 위험이 낮아진다는 관찰연구가 있습니다. 대신 쌀겨층에는 무기질 흡수를 방해하는 피트산과 토양에서 온 무기비소도 몰려 있어, 씻고 불리고 물을 넉넉히 잡는 조리법이 도움이 됩니다.",verdict:{tone:"good",text:"백미 대신 자주 먹기 좋은 곡물. 충분히 불려 부드럽게 짓고, 백미와 섞어 시작해도 좋습니다."},basis:"지은 현미밥 100g (무염)",serving:{label:"밥 1공기 (약 210g)",grams:210},nutrients:{kcal:112,carb:23.5,fiber:1.8,protein:2.3,fat:.8,sodium:1,potassium:79,calcium:10,magnesium:44,iron:.5,zinc:.62,vitB1:.1,vitB6:.15},compounds:[{id:"prebiotic-fiber",amount:"식이섬유 약 1.8g/100g (백미의 4~6배)",role:"쌀겨층의 아라비노자일란·셀룰로스가 씹는 시간을 늘리고 전분 소화를 늦추며, 일부는 대장에서 발효되어 짧은사슬지방산이 됩니다. 밥 1공기면 약 3.8g입니다."},{id:"magnesium",amount:"약 44mg/100g (백미의 약 3배)",role:"인슐린 수용체 신호와 포도당 대사 효소의 보조 인자입니다. 마그네슘 섭취가 많을수록 당뇨 위험이 낮다는 관찰연구가 일관되며, 밥 1공기면 기준치의 약 30%입니다."},{id:"phytate",amount:"쌀겨층에 집중 (백미의 수 배)",role:"인산기가 철·아연·칼슘과 결합해 흡수를 낮춥니다. 다양한 식사를 하는 성인에게는 큰 문제가 아니지만, 철·아연이 부족하기 쉬운 채식인·성장기 아이·임산부는 불리기·발아로 줄이는 것이 좋습니다. 철이 일으키는 산화 반응을 막는 항산화 작용도 있습니다."},{id:"resistant-starch",amount:"지은 뒤 식히면 증가",role:"밥을 식히면 아밀로스 사슬이 재결정화(노화)되어 소화효소가 분해하기 어려운 저항성 전분이 늘어납니다. 대장 미생물의 먹이가 되어 부티르산을 만듭니다."}],howToEat:[{title:"씻고 충분히 불리기, 또는 발아현미",body:"6시간 이상 불리면 겨층이 수분을 머금어 부드럽게 지어지고 피트산도 조금 줄어듭니다. 싹을 틔운 발아현미는 쌀 자체의 피트산 분해효소(피테이스)가 활성화되어 피트산이 더 줄고, GABA가 늘며 식감도 부드럽습니다."},{title:"물을 넉넉히 잡아 무기비소 줄이기",body:"벼는 논물에서 비소를 흡수해 쌀겨층에 쌓기 때문에 현미가 백미보다 무기비소가 많습니다. 여러 번 씻고, 쌀의 5~6배 물로 끓인 뒤 남은 물을 버리고 뜸 들이는 방식은 무기비소를 약 40~60% 줄일 수 있습니다. 수용성 비타민·무기질도 함께 빠지므로, 현미를 매일 주식으로 먹거나 영유아에게 먹일 때 특히 고려할 만합니다."},{title:"천천히 잘 씹어 먹기",body:"현미는 씹는 시간이 길어져 식사 속도가 느려지고, 포만 호르몬(GLP-1 등)이 따라올 시간이 생깁니다. 소화가 불편하면 오분도미·칠분도미나 백미와 섞어 시작하세요."},{title:"서늘한 곳이나 냉장 보관",body:"쌀겨층에는 지방과 지방분해효소가 있어 도정 후 시간이 지나면 산패해 쩐내가 납니다. 소량씩 사서 밀폐해 서늘한 곳에, 여름에는 냉장 보관하세요."},{title:"식혀 먹으면 저항성 전분 증가 (단, 빨리 냉장)",body:"냉장고에서 식힌 밥은 저항성 전분이 늘고 다시 데워도 일부 유지됩니다. 지은 밥을 실온에 오래 두면 바실루스 세레우스가 열에 강한 독소를 만들 수 있으니 1~2시간 안에 냉장·냉동하세요."}],pairings:{good:["콩·두부 (곡물에 부족한 라이신을 콩이 보완)","채소 반찬 (비타민 C로 철 흡수 보완)"],avoid:["식사 직후 진한 녹차·커피 (철 흡수를 추가로 방해)"]},cautions:["만성 신장질환으로 인·칼륨을 제한 중이라면 현미는 백미보다 인·칼륨이 많아 의료진과 상의하세요.","국제식품규격(Codex)의 무기비소 기준은 백미 0.2mg/kg, 현미 0.35mg/kg으로 현미가 더 높게 설정될 만큼 겨층에 비소가 많습니다. 영유아 이유식을 현미 위주로 만든다면 다른 곡물을 섞고 물을 넉넉히 잡아 조리하세요.","위장이 약하거나 과민성대장증후군이 있으면 덜 익은 현미가 더부룩함을 일으킬 수 있습니다. 충분히 불려 압력솥으로 부드럽게 지으세요."],myths:[{claim:"현미는 혈당을 거의 올리지 않는다",truth:"국제 GI 표의 평균값은 백미 약 73, 현미 약 68로 생각보다 차이가 작습니다(품종·조리법에 따라 편차 큼). 현미의 이득은 GI보다 섬유·마그네슘과 느린 식사 속도에서 나옵니다. 하버드 코호트(Sun 등, Arch Intern Med 2010)에서 하루 백미 50g을 같은 양의 현미로 바꾸는 것은 제2형 당뇨 위험 약 16% 감소와, 통곡물 전체로 바꾸는 것은 약 36% 감소와 연관됐습니다."},{claim:"현미의 피트산(항영양소) 때문에 오히려 백미가 더 건강하다",truth:"피트산은 철·아연 흡수를 낮추지만, 다양한 식사를 하는 성인에서 현미 때문에 결핍이 생긴다는 근거는 약합니다. 항영양소가 걱정되면 불리기·발아로 줄이는 편이 섬유·마그네슘 이득을 버리는 것보다 합리적입니다."}]},{id:"white-rice",name:"백미 (흰쌀밥)",en:"White rice",aliases:["백미","흰쌀밥","쌀밥","흰밥","쌀","공깃밥","즉석밥","찹쌀","찹쌀밥","white rice","rice","cooked rice"],emoji:"🍚",category:"곡물",summary:"쌀겨층과 씨눈을 깎아낸 쌀로, 전분이 대부분인 정제 탄수화물입니다. 소화가 빠르고 GI가 높은 편이라 밥 양이 많은 식사를 반복하면 식후 혈당과 인슐린 부담이 커집니다. 쌀밥 섭취가 많을수록 제2형 당뇨 위험이 높았고 이 연관은 아시아인에서 더 뚜렷했습니다. 다만 양 조절, 먹는 순서, 잡곡 섞기, 식혀 먹기로 부담을 상당히 줄일 수 있습니다.",verdict:{tone:"balanced",text:"주식으로 괜찮지만 양을 조절하세요. 잡곡을 섞고, 채소·단백질 반찬을 먼저 먹은 뒤 밥을 먹으면 혈당 부담이 줄어듭니다."},basis:"지은 백미밥 100g (단립·중립종, 무염)",serving:{label:"밥 1공기 (약 210g)",grams:210},nutrients:{kcal:130,carb:28.6,fiber:.3,protein:2.4,fat:.2,sodium:1,potassium:29,magnesium:13,iron:.2,vitB1:.02},compounds:[{id:"refined-carb",amount:"탄수화물 약 29g/100g (밥 1공기 약 60g)",role:"도정으로 섬유가 벗겨진 전분은 침과 췌장의 아밀레이스에 빠르게 분해되어 포도당으로 흡수됩니다. 찰기가 많을수록(아밀로스가 적고 아밀로펙틴이 많을수록) 소화가 빨라, 찰진 한국 쌀과 찹쌀은 GI가 높은 편입니다."},{id:"resistant-starch",amount:"갓 지은 밥은 적음, 식히면 증가",role:"지은 밥을 냉장고에서 식히면 아밀로스 사슬이 다시 결정화(노화)되어 소화되지 않는 전분이 늘고, 다시 데워도 일부 유지됩니다. 식혔다 데운 밥이 갓 지은 밥보다 식후 혈당을 덜 올렸다는 소규모 사람 시험이 있습니다."},{id:"magnesium",amount:"약 13mg/100g (현미의 약 1/3)",role:"도정 과정에서 겨층과 함께 마그네슘·비타민 B1·식이섬유의 대부분이 사라집니다. 쌀밥 위주 식사라면 채소·콩·견과·해조류 반찬으로 채워야 합니다."},{id:"phytate",amount:"겨층과 함께 대부분 제거됨",role:"피트산이 적어 철·아연 흡수 방해는 거의 없지만, 애초에 쌀 자체의 무기질이 적습니다."}],howToEat:[{title:"잡곡·현미·콩 섞기",body:"백미 일부를 현미·보리·귀리·콩으로 바꾸면 섬유·마그네슘·단백질이 늘고 식후 혈당 상승이 완만해집니다. 보리·귀리의 베타글루칸은 위 배출과 전분 소화를 늦춥니다."},{title:"채소·단백질 먼저, 밥은 나중에",body:"채소와 고기·생선·두부를 먼저 먹고 밥을 나중에 먹으면, 섬유가 장에서 당 흡수를 늦추고 단백질·지방이 GLP-1 분비를 늘려 위 배출을 늦춥니다. 제2형 당뇨 환자 대상 소규모 시험(Shukla 등, Diabetes Care 2015)에서 같은 식사라도 이 순서로 먹었을 때 식후 30~60분 혈당이 약 30~40% 낮았습니다."},{title:"밥 양은 1공기 이하, 국에 말아 급히 먹지 않기",body:"국에 말면 잘 씹지 않고 빨리 삼키게 되어 식사 속도와 혈당 상승이 빨라지기 쉽습니다. 공기 크기를 정해 두면 양 조절이 쉬워집니다."},{title:"식혀서 데워 먹기 (보관은 반드시 냉장)",body:"남은 밥을 냉장고에서 10시간 이상 식힌 뒤 데우면 저항성 전분이 늘어납니다. 단, 실온에 방치한 밥은 바실루스 세레우스 포자가 싹을 틔워 열에 강한 구토 독소를 만들 수 있으니, 지은 밥은 1~2시간 안에 냉장하거나 냉동하세요."},{title:"찹쌀·떡은 더 빠르게 흡수",body:"찹쌀은 아밀로스가 거의 없어 멥쌀보다 소화가 빠르고, 떡은 쌀을 조밀하게 뭉친 것이라 같은 무게에 탄수화물이 더 많습니다."}],pairings:{good:["나물·김치·해조류 (섬유)","생선·두부·달걀 (단백질로 혈당 완만)","현미·보리·귀리·콩 (잡곡밥)"],avoid:["국에 말아 빨리 먹기","밥+면·떡처럼 탄수화물 겹치기"]},cautions:["당뇨·당뇨 전단계라면 밥 양을 일정하게 정하고 식후 혈당을 측정해 자신에게 맞는 양을 찾는 것이 좋습니다.","쌀은 다른 곡물보다 무기비소를 많이 흡수하는 작물입니다. 백미는 현미보다 적지만, 영유아에게 쌀과자·쌀음료를 주식처럼 많이 먹이는 것은 피하세요."],myths:[{claim:"밥(탄수화물)은 무조건 살찌니 끊어야 한다",truth:"체중은 전체 열량과 식사의 질에 달려 있습니다. 코호트 메타분석(Seidelmann 등, Lancet Public Health 2018)에서 탄수화물 비율과 사망 위험은 U자 관계로, 약 40% 미만이나 약 70% 초과일 때 모두 위험이 높았고 50~55%에서 가장 낮았습니다. 밥을 끊기보다 양을 줄이고 잡곡·채소·단백질과 함께 먹는 것이 현실적입니다."},{claim:"한국인은 수천 년 쌀밥을 먹어 와서 혈당 걱정이 없다",truth:"오히려 쌀을 많이 먹는 아시아인에서 연관이 더 뚜렷했습니다. 메타분석(Hu 등, BMJ 2012)에서 흰쌀밥을 하루 1회분 더 먹을 때마다 제2형 당뇨 위험이 약 11% 높았고, 가장 많이 먹는 아시아인 집단은 가장 적게 먹는 집단보다 위험이 약 55% 높았습니다. 과거에는 잡곡을 많이 섞고 몸을 많이 써서 지금과 조건이 달랐습니다."}]},{id:"wheat",name:"밀 (밀가루·빵)",en:"Wheat",aliases:["밀","밀가루","중력분","강력분","박력분","통밀","통밀가루","빵","식빵","통밀빵","국수","칼국수","수제비","파스타","우리밀","wheat","flour","bread","whole wheat"],emoji:"🍞",category:"곡물",summary:'한국인이 쌀 다음으로 많이 먹는 곡물로, 대부분 겨와 배아를 뺀 백밀가루(정제 탄수화물)로 먹습니다. 글루텐은 셀리악병 환자에게는 반드시 피해야 할 단백질이지만 한국인에게 셀리악병은 매우 드물고, "밀가루를 끊으니 속이 편하다"는 경험의 상당 부분은 밀의 발효성 탄수화물(프럭탄)로 설명됩니다. 통밀로 먹으면 섬유·마그네슘이 몇 배로 늘고, 통곡물 섭취는 심혈관질환·사망 위험 감소와 연관됩니다.',verdict:{tone:"balanced",text:"가능하면 통밀·발효빵으로, 양을 정해서. 셀리악병이 아니라면 글루텐 자체를 두려워할 근거는 약합니다."},basis:"백밀가루(중력분, 비강화) 100g",serving:{label:"국수·수제비 1인분에 드는 밀가루 약 100g",grams:100},nutrients:{kcal:364,carb:76.3,sugar:.27,fiber:2.7,protein:10.3,fat:1,satFat:.16,mufa:.09,pufa:.41,sodium:2,potassium:107,calcium:15,magnesium:22,iron:1.17,zinc:.7,vitE:.06,vitB1:.12,vitB2:.04,vitB6:.04,folate:26},compounds:[{id:"refined-carb",amount:"전분 약 70g/100g",role:"겨·배아를 제거한 백밀가루는 전분과 글루텐 단백질이 대부분입니다. 곱게 빻아 표면적이 넓어 소화가 빠르며 흰빵의 GI는 약 75로 높습니다. 면·파스타는 조밀한 구조 덕분에 빵보다 GI가 낮습니다."},{id:"gluten",amount:"밀가루 단백질(약 10%)의 대부분",role:"글리아딘과 글루테닌이 물과 반죽되며 그물 구조를 만들어 빵을 부풀게 합니다. 글리아딘의 일부 펩타이드는 소화효소로 완전히 분해되지 않아, 셀리악병 유전형(HLA-DQ2·DQ8)을 가진 사람에게서 T세포 면역 반응과 소장 융모 손상을 일으킵니다."},{id:"prebiotic-fiber",amount:"백밀가루 약 2.7g, 통밀가루 약 11g/100g (프럭탄·아라비노자일란)",role:"밀은 서구 식단에서 가장 큰 프럭탄 공급원입니다. 프럭탄은 대장에서 빠르게 발효되어 비피도박테리아를 늘리지만, 과민성대장증후군이 있는 사람에게는 가스·복부팽만의 원인이 됩니다."},{id:"magnesium",amount:"백밀가루 약 22mg, 통밀가루 약 140mg/100g",role:"마그네슘·아연·철·비타민 B1·비타민 E는 대부분 겨와 배아에 있어 정제 과정에서 크게 줄어듭니다. 통밀로 바꾸면 몇 배로 늘어납니다."},{id:"phytate",amount:"통밀에 많음 (백밀가루는 적음)",role:"통밀 겨층의 피트산이 철·아연 흡수를 낮춥니다. 효모·사워도우 발효 중 밀 자체의 피테이스가 활성화되어 피트산이 상당 부분 분해되므로, 오래 발효한 빵은 무기질 흡수에 유리합니다."},{id:"lectin",amount:"밀 배아 응집소(WGA), 주로 배아·통밀에",role:"N-아세틸글루코사민·시알산에 결합하는 렉틴으로, 시험관에서는 장 상피세포에 붙어 염증 신호를 낼 수 있습니다. 열에 비교적 강하지만 굽기·삶기로 활성이 상당히 줄며, 식사로 먹는 양의 WGA가 사람에게 해롭다는 직접 근거는 부족합니다."},{id:"acrylamide",amount:"빵 껍질·토스트·비스킷의 갈색 부분",role:"밀가루의 아미노산 아스파라진이 120℃ 이상에서 당과 반응(마이야르 반응)해 생깁니다. 짙게 구울수록 늘어납니다."}],howToEat:[{title:"통밀·호밀 빵 고르기",body:'"통밀 100%"이거나 원재료 첫 번째가 통밀가루인지 확인하세요. 갈색 빵이라도 캐러멜 색소를 넣은 백밀가루 빵이 많습니다. 통곡물을 하루 90g 먹는 것은 심혈관질환·총사망 위험 약 20% 감소와 연관됐습니다(Aune 등, BMJ 2016 메타분석).'},{title:"사워도우·오래 발효한 빵",body:"긴 발효 동안 효모·젖산균과 밀 자체 효소가 프럭탄과 피트산을 분해해, 과민성대장증후군이 있는 사람의 가스·팽만이 덜하고 무기질 흡수가 나아질 수 있습니다. 다만 셀리악병 환자에게 안전해지지는 않습니다."},{title:"면은 살짝 덜 삶고, 채소·단백질과 함께",body:"파스타·국수를 알 덴테로 삶으면 전분 구조가 덜 풀려 소화가 느려집니다. 채소와 달걀·고기·두부를 넉넉히 넣으면 식후 혈당이 완만해집니다."},{title:"토스트는 황금색까지만",body:'짙은 갈색으로 태우면 아크릴아마이드가 급격히 늘어납니다. 영국 식품기준청(FSA)은 "황금색까지만(Go for Gold)" 굽기를 권장합니다.'},{title:"빵은 얼렸다가 데워 먹기",body:"빵을 냉동했다 해동해 구우면 전분이 노화되어 식후 혈당 반응이 줄었다는 소규모 연구가 있습니다."}],pairings:{good:["달걀·치즈·두부·채소 (단백질·섬유로 혈당 완만)","올리브유 (버터 대신)"],avoid:["설탕·버터·크림이 많은 빵·과자 (정제 탄수화물+첨가당+포화지방)"]},cautions:["셀리악병 환자는 하루 수십 mg 수준의 글루텐으로도 소장 손상이 이어질 수 있어 밀·보리·호밀을 완전히 피해야 합니다. 설사·체중 감소·철결핍빈혈이 계속된다면 글루텐을 끊기 전에 먼저 검사(조직 트랜스글루타미네이스 항체, 소장 내시경)를 받으세요. 미리 끊으면 검사가 음성으로 나올 수 있습니다.","밀 알레르기는 셀리악병과 다른 IgE 반응입니다. 밀을 먹고 운동한 뒤 두드러기·호흡곤란이 생기는 밀 의존성 운동유발 아나필락시스도 있어 진료가 필요합니다. 밀은 국내 알레르기 유발물질 표시 대상입니다.","과민성대장증후군이 있다면 밀의 프럭탄이 증상을 일으킬 수 있어, 저포드맵(FODMAP) 식단 기간에는 양을 줄여 보는 방법이 있습니다."],myths:[{claim:"글루텐은 누구에게나 장누수와 염증을 일으키니 모두 끊어야 한다",truth:"글리아딘이 장 세포에서 조눌린 분비를 늘려 세포 사이 틈을 일시적으로 넓힌다는 실험 결과는 있지만, 셀리악병이 아닌 사람에서 이것이 질병으로 이어진다는 근거는 부족합니다. 글루텐 민감을 호소하는 사람의 이중맹검 시험에서는 글루텐보다 프럭탄이 증상과 더 관련됐습니다(Skodje 등, Gastroenterology 2018). 셀리악병이 없는 사람이 글루텐을 끊으면 통곡물 섭취가 줄어 오히려 불리할 수 있다는 분석(Lebwohl 등, BMJ 2017)도 있습니다."},{claim:"현대 밀은 품종 개량으로 글루텐이 폭증해 옛날 밀과 다르다",truth:"20세기 미국 밀의 단백질 자료를 분석한 연구(Kasarda, J Agric Food Chem 2013)에서 글루텐 함량이 뚜렷하게 늘었다는 근거는 없었습니다. 달라진 것은 밀을 먹는 방식(정제 밀가루, 가공식품과 빵 소비 증가) 쪽이 더 큽니다."}]},{id:"oat",name:"귀리",en:"Oats",aliases:["오트밀","오트","오트밀죽","압착귀리","롤드오트","퀵오트","인스턴트오트밀","스틸컷오트","귀리쌀","오트브랜","귀리가루","오버나이트오트","오트밀크","귀리우유","oat","oats","oatmeal","oat bran"],emoji:"🥣",category:"곡물",summary:"수용성 식이섬유인 베타글루칸이 풍부해, 하루 3g 이상 먹으면 LDL 콜레스테롤이 내려간다는 것이 여러 무작위 대조시험과 메타분석으로 확인된 곡물입니다. 단백질·마그네슘·철·아연도 곡물 중 많은 편이고, 귀리에만 있는 폴리페놀인 아베난쓰라마이드는 항염·가려움 완화 작용으로 연구됩니다. 가공 정도에 따라 혈당 반응이 크게 달라, 인스턴트보다 통귀리·압착귀리가 좋습니다.",verdict:{tone:"good",text:"자주 먹기 좋은 곡물. 인스턴트보다 압착·통귀리로, 하루 베타글루칸 3g(마른 귀리 약 70g)을 목표로 하면 콜레스테롤에 도움이 됩니다."},basis:"마른 귀리(통귀리·압착귀리) 100g",serving:{label:"오트밀 1회 (마른 귀리 약 40g)",grams:40},nutrients:{kcal:389,carb:66.3,fiber:10.6,protein:16.9,fat:6.9,satFat:1.2,mufa:2.2,pufa:2.5,sodium:2,potassium:429,calcium:54,magnesium:177,iron:4.7,zinc:4,vitB1:.76,vitB2:.14,vitB6:.12,folate:56},compounds:[{id:"beta-glucan",amount:"약 3~6g/100g (품종에 따라, 오트브랜은 7g 이상)",role:"물에 녹아 끈적한 젤이 되어 ① 소장에서 담즙산을 붙잡아 대변으로 내보내고(간이 담즙산을 새로 만들려고 콜레스테롤을 끌어다 쓰며 LDL 수용체를 늘림), ② 위 배출과 포도당 흡수를 늦춥니다. 하루 3g 이상에서 LDL이 평균 약 5~7% 낮아졌습니다."},{id:"magnesium",amount:"약 177mg/100g",role:"곡물 중 많은 편으로, 오트밀 1회분(40g)이면 기준치의 약 22%입니다."},{id:"nonheme-iron",amount:"약 4.7mg/100g",role:"식물성 철이라 흡수율은 낮지만 양은 많은 편입니다. 과일의 비타민 C와 함께 먹으면 흡수가 늘어납니다."},{id:"zinc",amount:"약 4mg/100g",role:"면역과 상처 회복에 필요한 아연을 곡물 중 많이 담고 있지만, 피트산 때문에 흡수율은 제한됩니다."},{id:"phytate",amount:"겨층에 많음 (대략 1% 안팎)",role:"철·아연 흡수를 방해합니다. 귀리는 자체 피테이스 활성이 낮은 데다 가공 중 열처리로 더 약해져, 물에 불리기만 해서는 잘 줄지 않습니다."},{id:"gluten",amount:"귀리 자체에는 밀 글루텐이 없음 (아베닌은 있음), 교차오염 흔함",role:"귀리의 저장 단백질 아베닌은 대부분의 셀리악병 환자에게 문제를 일으키지 않지만, 재배·가공 중 밀·보리가 섞이는 교차오염이 흔합니다. 드물게 아베닌 자체에 반응하는 셀리악병 환자도 있습니다."}],howToEat:[{title:"인스턴트보다 압착·스틸컷 귀리",body:"가공이 적을수록 전분 입자가 온전해 소화가 느립니다. GI는 대략 스틸컷·압착 귀리 50~60, 인스턴트 오트밀 70~80으로 보고되고, 가당 시리얼형 제품은 더 높습니다. 베타글루칸도 지나치게 잘게 가공하면 분자량과 점도가 떨어져 효과가 약해질 수 있습니다."},{title:"하루 베타글루칸 3g 채우기",body:"마른 귀리 약 70g 또는 오트브랜 약 40g이 기준입니다. 아침 오트밀(40g)에 귀리를 섞은 밥을 더하면 채우기 쉽습니다. LDL 저하 효과는 먹는 동안만 유지되니 꾸준히 먹는 것이 중요합니다."},{title:"통귀리(귀리쌀)는 불려서 밥에",body:"통귀리는 겨층이 단단해 30분 이상 불리거나 압력솥으로 지어야 부드럽습니다. 쌀에 섞으면 밥 전체의 식후 혈당 반응이 완만해집니다."},{title:"가당 그래놀라·오트바 주의",body:"시판 그래놀라와 오트바는 설탕·시럽·기름을 넣어 구운 제품이 많아 당과 열량이 크게 늘어납니다. 플레인 귀리에 과일·견과로 단맛과 식감을 더하세요."}],pairings:{good:["베리류·바나나 (비타민 C, 자연스러운 단맛)","견과·씨앗 (지방·단백질로 포만감)","플레인 요거트·우유 (단백질)"],avoid:["설탕·시럽 듬뿍"]},cautions:['셀리악병 환자는 교차오염 없는 "글루텐 프리" 인증 귀리만 드시고, 처음 먹을 때 증상과 검사 수치를 확인하세요.',"평소 섬유를 적게 먹었다면 양을 조금씩 늘리고 물을 충분히 드세요. 갑자기 늘리면 가스·더부룩함이 생길 수 있습니다.","오트밀크(귀리 음료)는 효소로 전분을 분해해 만드는 경우가 많아 당(맥아당)이 생기고 베타글루칸은 적어, 귀리를 먹는 것과 효과가 다릅니다."],myths:[{claim:"귀리는 글루텐 프리 곡물이라 셀리악병 환자도 마음껏 먹어도 된다",truth:'귀리에는 밀의 글루텐(글리아딘·글루테닌)이 없지만 비슷한 단백질 아베닌이 있고, 일반 귀리 제품은 밀·보리 교차오염이 흔해 셀리악병 환자에게 안전하지 않을 수 있습니다. "글루텐 프리" 표시 제품을 고르세요.'},{claim:"오트밀을 먹으면 콜레스테롤약을 끊어도 된다",truth:"베타글루칸의 LDL 저하 폭은 평균 약 5~10% 수준이고, 스타틴은 보통 30~50% 이상입니다. 식단은 약의 효과를 보완하지만 처방받은 약을 스스로 끊는 근거가 되지는 못합니다."}]},{id:"soybean",name:"대두 (콩·두부)",en:"Soybean",aliases:["대두","콩","메주콩","백태","서리태","검은콩","흑태","두부","연두부","순두부","두유","콩물","콩국수","콩비지","청국장","낫토","풋콩","에다마메","soy","soybean","tofu","soymilk","natto","edamame"],emoji:"🫘",category:"콩·견과·씨앗",summary:'마른 콩 기준 단백질이 약 36%로 식물성 식품 중 가장 많고 필수아미노산 구성이 좋은 "밭의 고기"입니다. 이소플라본(제니스테인·다이드제인)이 에스트로겐 수용체에 약하게 결합하는 식물성 에스트로겐이라 유방암·남성호르몬에 대한 걱정이 많지만, 사람 연구에서 식품으로 먹는 콩은 유방암 위험을 높이거나 남성의 테스토스테론을 낮추지 않았습니다. 날콩의 렉틴·트립신 억제제는 충분히 익히면 대부분 사라집니다.',verdict:{tone:"good",text:"자주 먹기 좋아요. 두부·콩밥·두유·청국장 등 익히거나 발효한 형태로 하루 1~2회."},basis:"삶은 대두 100g (무염)",serving:{label:"삶은 콩 반 컵 (약 90g)",grams:90},nutrients:{kcal:172,carb:8.4,sugar:3,fiber:6,protein:18.2,fat:9,satFat:1.3,mufa:2,pufa:5.1,la:4.5,ala:.6,sodium:1,potassium:515,calcium:102,magnesium:86,iron:5.1,zinc:1.15,selenium:7.3,vitC:1.7,vitE:.35,vitK:19.2,vitB1:.16,vitB2:.29,vitB6:.23,folate:54},compounds:[{id:"isoflavone",amount:"대략 삶은 콩 50~60mg/100g, 두부 20~30mg/100g, 두유 약 10mg/100mL (제품별 편차 큼)",role:"제니스테인·다이드제인이 에스트로겐 수용체, 특히 β형(ERβ)에 선택적으로 약하게 결합합니다. 폐경 후 안면홍조를 약간 줄이고, 콩을 많이 먹는 아시아 여성에서 유방암 위험이 낮은 연관이 관찰됩니다. 장내 세균이 다이드제인을 에쿠올로 바꾸는 능력이 사람마다 달라 효과 차이의 한 원인으로 연구됩니다."},{id:"prebiotic-fiber",amount:"식이섬유 6g/100g + 올리고당(라피노스·스타키오스)",role:"사람 소화효소로 분해되지 않는 α-갈락토올리고당이 대장에서 발효되어 비피도박테리아를 늘리지만 가스의 원인이 되기도 합니다. 두부로 만들면 섬유는 대부분 비지로 빠집니다."},{id:"linoleic-acid",amount:"약 4.5g/100g",role:"콩 지방의 약 절반이 오메가6 리놀레산입니다. 통콩·두부로 먹을 때는 양이 많지 않고, 포화지방 대신 먹을 때 LDL 저하에 기여합니다."},{id:"ala",amount:"약 0.6g/100g",role:"콩류로서는 식물성 오메가3가 많은 편이라 반 컵이면 ALA 기준치의 약 40%입니다."},{id:"calcium",amount:"삶은 콩 약 100mg/100g, 두부는 응고제에 따라 수십~수백 mg",role:"황산칼슘(석고)으로 굳힌 두부는 100g당 칼슘이 수백 mg(미국 일반 두부 약 350mg)에 이르러 좋은 칼슘 공급원이 됩니다. 염화마그네슘(간수)으로 굳힌 두부는 칼슘이 적은 대신 마그네슘이 늘어납니다. 포장의 응고제 표시로 확인할 수 있습니다."},{id:"magnesium",amount:"약 86mg/100g",role:"반 컵이면 기준치의 약 25%입니다."},{id:"lectin",amount:"날콩에 많음 (대두 응집소 SBA) → 충분히 가열하면 대부분 불활성",role:"날콩이나 덜 익힌 콩물에는 렉틴과 함께 단백질 소화효소를 막는 트립신 억제제(쿠니츠형·보우만-버크형)가 있어 복통·설사를 일으킬 수 있습니다. 두부·두유는 콩물을 끓이는 과정에서, 콩밥·콩자반은 충분히 익히는 과정에서 대부분 불활성화됩니다."},{id:"phytate",amount:"콩류 중 많은 편",role:"철·아연 흡수를 낮춥니다. 된장·청국장·낫토·템페 같은 발효 과정에서 상당히 줄어듭니다."}],howToEat:[{title:"날콩·콩물은 충분히 익히기",body:"콩국수용 콩물이나 집 두유를 만들 때는 불린 콩을 충분히 삶은 뒤 가세요. 트립신 억제제는 열에 비교적 강해 비린내가 날 정도로 살짝 데치면 일부 남아 소화 장애를 일으킬 수 있습니다."},{title:"불린 물은 버리고 삶기",body:"불린 물을 버리고 새 물로 삶으면 가스를 만드는 올리고당 일부가 빠져나갑니다. 평소 콩을 적게 먹었다면 소량부터 늘리세요."},{title:"두부는 응고제 표시 확인",body:"칼슘을 챙기려면 황산칼슘·염화칼슘 두부를 고르세요. 부드러운 연두부(글루코노델타락톤 응고)는 칼슘이 적습니다."},{title:"발효 콩으로 다양하게",body:"청국장·낫토·된장은 발효 중 피트산과 올리고당이 줄고 단백질이 일부 분해되어 소화가 편해집니다. 낫토·청국장에는 바실루스균이 만든 비타민 K2(메나퀴논-7)가 있습니다. 된장은 나트륨이 많으니 양을 조절하세요."},{title:"곡물과 함께 먹기",body:"곡물에 부족한 라이신을 콩이, 콩에 상대적으로 적은 메티오닌을 곡물이 보완합니다. 콩밥이나 두부 반찬과 잡곡밥은 좋은 조합입니다."}],pairings:{good:["잡곡밥 (아미노산 상호 보완)","시금치·나물 (두부의 칼슘이 옥살산과 결합)","김치·채소 (비타민 C로 철 흡수↑)"],avoid:["갑상선약(레보티록신)과 같은 시간에 먹기"]},cautions:["레보티록신(갑상선호르몬제)을 먹는다면 콩 제품·두유와 복용 시간을 몇 시간(보통 4시간 정도) 떼세요. 콩이 장에서 약 흡수를 방해해 용량 조절이 필요했다는 보고가 있습니다. 갑상선 기능이 정상인 사람에서 식품으로 먹는 콩이 갑상선 기능을 떨어뜨린다는 근거는 약하지만, 요오드가 부족하면 영향이 커질 수 있습니다.","낫토·청국장은 비타민 K2가 많아 와파린 복용자는 담당 의사와 상의하세요. 특히 낫토는 와파린 효과를 크게 떨어뜨리는 것으로 알려져 있습니다.","대두는 국내 알레르기 유발물질 표시 대상이며, 영유아에게 비교적 흔한 알레르기입니다(대부분 자라면서 사라짐).","이소플라본 고농축 보충제는 식품과 다릅니다. 유방암 치료 중이거나 호르몬 관련 질환이 있다면 보충제는 의사와 상의하세요."],myths:[{claim:"콩의 식물성 에스트로겐이 유방암을 일으키거나 재발시킨다",truth:"걱정의 출발점은 설치류에 고용량 제니스테인을 준 실험이지만, 설치류는 이소플라본 대사가 사람과 다릅니다. 사람 코호트에서 콩 섭취는 유방암 위험 증가와 연관되지 않았고, 유방암 생존자 5천여 명을 추적한 중국 연구(Shu 등, JAMA 2009)에서는 콩을 많이 먹을수록 재발·사망 위험이 낮았습니다. 미국암학회 등도 식품으로 먹는 콩은 안전하다고 봅니다."},{claim:"콩을 먹으면 남성호르몬이 줄고 여성화된다",truth:"임상시험 메타분석(Hamilton-Reeves 등, Fertil Steril 2010)에서 콩 단백질·이소플라본은 남성의 테스토스테론과 유리 테스토스테론 수치를 바꾸지 않았습니다. 여성형 유방 같은 사례 보고는 하루 두유 수 리터처럼 극단적인 양을 먹은 경우였습니다."}]},{id:"peanut",name:"땅콩",en:"Peanut",aliases:["볶은땅콩","생땅콩","삶은땅콩","땅콩버터","피넛버터","땅콩잼","낙화생","peanut","peanuts","peanut butter","groundnut"],emoji:"🥜",category:"콩·견과·씨앗",summary:"견과처럼 먹지만 식물학적으로는 콩과 식물입니다. 지방의 약 절반이 올레산, 약 1/3이 오메가6 리놀레산이고 비타민 E·나이아신·마그네슘·엽산이 풍부합니다. 땅콩을 많이 먹을수록 총사망·심혈관 사망 위험이 낮았다는 대규모 코호트가 있습니다. 주의할 점은 알레르기와 곰팡이 독소(아플라톡신)이며, 볶아도 남는 땅콩 렉틴은 흥미로운 연구 주제이지만 건강 영향은 불분명합니다.",verdict:{tone:"good",text:"하루 한 줌(약 30g)이면 좋은 간식. 무염·무가당으로 드시고, 곰팡이 냄새가 나거나 변색된 땅콩은 버리세요."},basis:"생 땅콩(속껍질 포함 알맹이) 100g",serving:{label:"한 줌 (약 30g)",grams:30},nutrients:{kcal:567,carb:16.1,sugar:4.7,fiber:8.5,protein:25.8,fat:49.2,satFat:6.3,mufa:24.4,pufa:15.6,la:15.6,sodium:18,potassium:705,calcium:92,magnesium:168,iron:4.6,zinc:3.3,selenium:7.2,vitE:8.3,vitB1:.64,vitB2:.14,vitB6:.35,folate:240},compounds:[{id:"oleic-acid",amount:"약 24g/100g (지방의 약 절반)",role:"올리브유와 같은 단일불포화지방으로, 포화지방·정제 탄수화물 대신 먹을 때 LDL과 중성지방을 낮춥니다. 고올레산 품종은 올레산 비율이 80% 가까이 됩니다."},{id:"linoleic-acid",amount:"약 16g/100g",role:"필수 오메가6 지방산입니다. 통땅콩으로 먹을 때는 비타민 E와 폴리페놀이 함께 있어 산화로부터 보호되며, 리놀레산 섭취를 늘려도 염증 지표가 오르지 않았다는 시험들이 있습니다."},{id:"vitamin-e",amount:"약 8mg/100g",role:"한 줌이면 기준치의 약 23%로, 세포막 지질의 산화 연쇄반응을 끊습니다."},{id:"magnesium",amount:"약 168mg/100g",role:"한 줌이면 기준치의 약 16%입니다."},{id:"folate",amount:"생땅콩 약 240μg/100g",role:"견과류 중 엽산이 특히 많아 한 줌이면 기준치의 약 18%입니다. 볶으면 일부 줄어듭니다."},{id:"resveratrol",amount:"소량 (속껍질·삶은 땅콩에 상대적으로 많음)",role:"포도처럼 곰팡이·스트레스에 반응해 만들어지는 방어 물질이지만, 양이 적어 건강 효과를 기대할 수준은 아닙니다."},{id:"lectin",amount:"땅콩 응집소(PNA), 볶아도 일부 남음",role:"특정 당사슬(TF 항원, Galβ1-3GalNAc)에 결합하는 렉틴입니다. 땅콩을 먹은 사람의 혈액에서 PNA가 검출됐다는 보고(Wang 등, Lancet 1998)가 있고, 시험관에서는 이 당사슬을 가진 대장암 세포의 증식을 자극했습니다. 그러나 사람에서 이것이 질병 위험으로 이어진다는 근거는 없고, 땅콩 섭취는 코호트에서 오히려 낮은 사망 위험과 연관됩니다."}],howToEat:[{title:"무염 볶은 땅콩이나 삶은 땅콩으로",body:"가염·꿀땅콩·땅콩과자는 나트륨과 당이 더해집니다. 껍질째 삶은 땅콩은 볶은 것보다 폴리페놀·레스베라트롤이 많이 남는 것으로 보고됩니다."},{title:"붉은 속껍질째 먹기",body:"얇은 속껍질에 프로안토시아니딘·레스베라트롤 같은 폴리페놀이 몰려 있습니다."},{title:"땅콩버터는 원재료가 땅콩(과 소금)뿐인 것",body:"설탕과 경화유를 넣은 제품이 많습니다. 기름이 위로 분리되는 제품은 첨가물이 없다는 뜻이니 잘 섞어 냉장 보관하면 됩니다."},{title:"곰팡이·쩐내 나는 땅콩은 버리기",body:"아플라톡신은 볶아도 완전히 파괴되지 않습니다. 쭈글쭈글하거나 변색·곰팡이 핀 알, 쓴맛·쩐내가 나는 땅콩은 먹지 말고, 껍질째 땅콩은 습기 없이 서늘하게 보관하세요."}],pairings:{good:["사과·바나나 (섬유·당과 함께 포만감)","채소 샐러드·무침 (다진 땅콩으로 고소함)"],avoid:["가염·꿀·초콜릿 코팅 땅콩","술안주로 대량"]},cautions:["땅콩 알레르기는 소량으로도 아나필락시스를 일으킬 수 있고 성인이 되어도 잘 사라지지 않습니다. 볶은 땅콩은 마이야르 반응으로 알레르기 단백질(Ara h 2 등)의 반응성이 오히려 커질 수 있습니다. 땅콩은 국내 알레르기 유발물질 표시 대상입니다.","중증 습진이나 달걀 알레르기가 있는 고위험 영아에게 생후 4~11개월부터 땅콩 식품을 꾸준히 먹이자 5세 땅콩 알레르기가 약 80% 줄었습니다(LEAP 시험, Du Toit 등, NEJM 2015). 고위험 영아는 먼저 전문의와 상의하고, 통땅콩은 질식 위험이 있어 5세 미만에게 주지 마세요.","아플라톡신 B1은 국제암연구소(IARC) 1군 발암물질로, 특히 B형간염 보유자에서 간암 위험을 크게 높입니다. 국내 유통 제품은 기준으로 관리되지만, 오래 둔 땅콩이나 출처가 불분명한 벌크 땅콩은 주의하세요."],myths:[{claim:"땅콩은 오메가6가 많아 몸에 염증을 일으킨다",truth:"리놀레산이 염증 매개물질의 원료인 아라키돈산으로 바뀌는 과정은 엄격히 조절되어, 리놀레산 섭취를 늘려도 혈중·조직 아라키돈산은 거의 늘지 않았습니다. 땅콩·견과 섭취는 코호트에서 CRP 등 염증 지표가 낮은 것과 연관됐고, 미국·중국 대규모 코호트(Luu 등, JAMA Intern Med 2015)에서 땅콩을 많이 먹을수록 총사망·심혈관 사망 위험이 낮았습니다."},{claim:"땅콩 렉틴이 몸에 흡수되어 자가면역질환이나 암을 일으킨다",truth:"볶은 땅콩에서도 렉틴(PNA)이 일부 남아 혈액에서 검출될 수 있다는 것은 사실이지만(Wang 등, Lancet 1998), 이것이 사람에서 자가면역질환이나 암을 늘린다는 근거는 없습니다. 연구자들도 의미를 단정하지 못하는 초기 관찰 단계입니다."}]},{id:"almond",name:"아몬드",en:"Almond",aliases:["생아몬드","구운아몬드","아몬드슬라이스","아몬드버터","아몬드가루","아몬드우유","아몬드밀크","almond","almonds"],emoji:"🌰",category:"콩·견과·씨앗",summary:"견과 중 비타민 E(알파토코페롤)가 가장 풍부한 편으로 100g에 약 26mg, 한 줌(약 23알)이면 하루 기준치의 약 65%입니다. 올레산·마그네슘·식이섬유·칼슘도 많고, 매일 먹을 때 LDL 콜레스테롤이 섭취량에 비례해 낮아진다는 시험이 있습니다. 다만 옥살산이 견과 중 많은 편이라 신장결석 병력이 있다면 양을 조절하는 것이 좋습니다.",verdict:{tone:"good",text:"하루 한 줌(약 25~30g)이 적당합니다. 무염으로, 갈색 껍질째 드세요."},basis:"생 아몬드(껍질째) 100g",serving:{label:"한 줌 (약 23알, 28g)",grams:28},nutrients:{kcal:579,carb:21.6,sugar:4.4,fiber:12.5,protein:21.2,fat:49.9,satFat:3.8,mufa:31.6,pufa:12.3,la:12.3,sodium:1,potassium:733,calcium:269,magnesium:270,iron:3.7,zinc:3.1,selenium:4.1,vitE:25.6,vitB1:.21,vitB2:1.14,vitB6:.14,folate:44},compounds:[{id:"vitamin-e",amount:"약 26mg/100g",role:"세포막과 LDL 입자 속 불포화지방이 산화되는 연쇄반응을 끊는 지용성 항산화제입니다. 아몬드 자체의 지방과 함께 있어 흡수도 잘 되며, 한 줌으로 기준치의 약 65%를 채웁니다."},{id:"oleic-acid",amount:"약 31g/100g (지방의 약 60%)",role:"포화지방 대신 먹을 때 LDL을 낮추는 단일불포화지방입니다."},{id:"magnesium",amount:"약 270mg/100g",role:"한 줌이면 기준치의 약 24%로, 혈압·혈당 조절과 근육 이완에 관여합니다."},{id:"prebiotic-fiber",amount:"식이섬유 12.5g/100g",role:"한 줌에 약 3.5g입니다. 세포벽이 단단해 씹어도 지방 일부가 세포 안에 갇힌 채 대장까지 가며, 실제로 흡수되는 열량이 표시보다 약 20% 적다는 연구(Novotny 등, Am J Clin Nutr 2012)가 있습니다. 껍질의 섬유와 폴리페놀은 장내 미생물의 먹이가 됩니다."},{id:"calcium",amount:"약 270mg/100g",role:"견과 중 칼슘이 많은 편이지만, 옥살산·피트산 때문에 흡수율은 우유보다 낮습니다."},{id:"oxalate",amount:"대략 400mg 안팎/100g (견과 중 높은 편)",role:"장에서 칼슘과 결합해 흡수를 방해하고, 흡수된 옥살산은 소변으로 나가며 수산칼슘 결석의 재료가 됩니다. 한 줌 정도면 대부분 문제되지 않지만, 아몬드가루·아몬드버터로 많이 먹으면 양이 크게 늘어납니다."},{id:"phytate",amount:"대략 1% 안팎",role:"철·아연 흡수를 방해하는 한편 항산화 작용도 있습니다. 한 줌 정도에서는 영향이 크지 않습니다."}],howToEat:[{title:"갈색 껍질째 먹기",body:"아몬드 폴리페놀(카테킨·플라보놀 배당체 등)의 대부분은 얇은 갈색 껍질에 있습니다. 껍질의 폴리페놀과 알맹이의 비타민 E가 함께 LDL 산화를 억제한다는 연구가 있습니다."},{title:"생으로 또는 연하게 볶은 것",body:"가염·꿀버터 아몬드는 나트륨과 당이 더해집니다. 고온에서 짙게 볶으면 아몬드의 아스파라진과 당이 반응해 아크릴아마이드가 생길 수 있어 연한 갈색 정도가 좋습니다."},{title:"꼭꼭 씹어 먹기",body:"씹는 횟수가 많을수록 세포벽이 더 부서져 지방과 비타민 E가 더 많이 흡수되고, 포만 호르몬 반응도 커진다는 연구가 있습니다."},{title:"다른 간식을 대체해 매일 한 줌",body:"과자·빵 같은 간식 대신 매일 아몬드를 먹었을 때 LDL이 섭취량에 비례해 낮아졌습니다(Jenkins 등, Circulation 2002). 간식에 더하기만 하면 열량이 늘어납니다."}],pairings:{good:["요거트·오트밀 (포만감, 비타민 E 흡수)","과일 (당 흡수 완만)","우유·요거트 같은 칼슘 식품 (장에서 옥살산을 붙잡음)"],avoid:["설탕 코팅·가염 아몬드"]},cautions:["수산칼슘 신장결석 병력이 있다면 하루 한 줌 이내로 제한하고, 아몬드가루·아몬드버터를 주식처럼 쓰지 마세요.","쓴 아몬드(bitter almond)와 살구씨는 청산배당체 아미그달린이 많아 날로 여러 알 먹으면 시안화물 중독이 생길 수 있습니다. 시판되는 단맛 아몬드(sweet almond)에는 아주 적습니다.","나무 견과 알레르기가 있다면 피하세요.","시판 아몬드우유는 아몬드 함량이 낮은 제품이 많아, 아몬드의 영양을 기대하기 어렵습니다."],myths:[{claim:"아몬드는 불려서(활성화해서) 먹어야 피트산·효소 억제제가 없어져 몸에 좋다",truth:"아몬드를 물에 밤새 불린 시험에서 피트산은 눈에 띄게 줄지 않았고 소화 불편감도 개선되지 않았습니다. 식감이 좋다면 불려 먹어도 되지만 건강상 꼭 필요한 과정은 아닙니다."},{claim:"아몬드는 열량이 높아 살이 찐다",truth:'표시 열량보다 실제 흡수되는 열량이 약 20% 적고, 견과를 포함한 식단 시험에서 체중이 늘지 않은 경우가 많습니다. 다만 간식을 "추가"하는 것이 아니라 "대체"할 때의 이야기입니다.'}]},{id:"walnut",name:"호두",en:"Walnut",aliases:["생호두","볶은호두","호두알","호두기름","walnut","walnuts","english walnut"],emoji:"🌰",category:"콩·견과·씨앗",summary:"견과 중 유일하게 식물성 오메가3(ALA)가 많아 100g에 약 9g, 한 줌(약 28g)이면 하루 기준치의 약 2배입니다. 오메가6 리놀레산도 약 38g으로 많고, 속껍질에는 엘라지탄닌(페둔쿨라진)이 있어 장내 미생물이 유롤리틴으로 바꿉니다. 매일 먹게 한 무작위 시험에서 LDL이 낮아졌습니다. 불포화지방이 많아 산패가 빠르므로 냉장·냉동 보관이 중요합니다.",verdict:{tone:"good",text:"하루 한 줌(알맹이 7개 정도)이면 좋은 식물성 오메가3 공급원. 냉장 보관하고 쩐내 나면 버리세요."},basis:"생 호두(속껍질째) 100g",serving:{label:"한 줌 (알맹이 약 7개, 28g)",grams:28},nutrients:{kcal:654,carb:13.7,sugar:2.6,fiber:6.7,protein:15.2,fat:65.2,satFat:6.1,mufa:8.9,pufa:47.2,la:38.1,ala:9.1,sodium:2,potassium:441,calcium:98,magnesium:158,iron:2.9,zinc:3.1,selenium:4.9,vitE:.7,vitK:2.7,vitB1:.34,vitB2:.15,vitB6:.54,folate:98},compounds:[{id:"ala",amount:"약 9.1g/100g",role:"호두 지방의 약 14%가 알파리놀렌산이라 한 줌이면 약 2.5g입니다. 몸에서 EPA로는 수 %, DHA로는 1% 안팎만 전환되므로 생선의 EPA·DHA를 대신하기는 어렵지만, ALA 섭취가 많을수록 심혈관 사망 위험이 낮은 연관이 관찰됩니다."},{id:"ellagitannin",amount:"페둔쿨라진 등, 주로 얇은 속껍질에",role:"장에서 엘라그산으로 풀린 뒤 대장 미생물이 유롤리틴으로 바꿉니다. 얼마나 많이 만드는지는 장내 미생물 구성에 따라 사람마다 다릅니다."},{id:"linoleic-acid",amount:"약 38g/100g",role:"호두 지방에서 가장 큰 부분은 오메가6 리놀레산입니다. 오메가6:오메가3 비율이 약 4:1로 다른 견과보다 훨씬 균형 잡혀 있고, 포화지방 대신 먹을 때 LDL 저하에 기여합니다."},{id:"vitamin-e",amount:"감마토코페롤 약 20mg/100g (알파토코페롤은 약 0.7mg)",role:"호두의 비타민 E는 대부분 감마형입니다. 감마토코페롤은 과산화아질산 같은 활성질소종을 잡는 데 알파형보다 유리하다는 연구가 있지만, 영양 기준치(알파토코페롤)에는 적게 잡힙니다. 호두 속 많은 불포화지방을 산화로부터 지키는 역할을 합니다."},{id:"magnesium",amount:"약 158mg/100g",role:"한 줌이면 기준치의 약 14%입니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 실온·빛에 오래 두면 증가",role:"다불포화지방이 전체 지방의 70% 이상이라, 깐 호두를 실온·빛·열에 오래 두면 과산화물과 헥사날 같은 알데하이드가 생겨 쩐내가 납니다. 산패한 호두는 맛뿐 아니라 이로운 성분도 줄어듭니다."}],howToEat:[{title:"밀폐해 냉장·냉동 보관",body:"깐 호두는 밀폐해 냉장(수개월) 또는 냉동(1년 가까이) 보관하세요. 기름 냄새·페인트 냄새나 강한 쓴맛이 나면 산패한 것입니다."},{title:"속껍질은 벗기지 않기",body:"떫은맛을 내는 얇은 속껍질에 폴리페놀(엘라지탄닌)의 대부분이 있습니다. 떫은맛이 싫다면 약불에 잠깐 볶으면 덜해지지만, 고온에서 오래 볶으면 불포화지방 산화가 늘어납니다."},{title:"날로 간식·샐러드에, 호두기름은 가열하지 않기",body:"호두기름은 다불포화지방이 많아 산화에 약하므로 볶음·튀김보다 샐러드 드레싱에 적합합니다."},{title:"다른 간식 대신 매일 한 줌",body:"노인 700여 명에게 2년간 매일 호두를 먹게 한 시험(WAHA, Rajaram 등, Circulation 2021)에서 LDL과 작은 LDL 입자 수가 소폭 줄었습니다."}],pairings:{good:["오트밀·요거트","샐러드 (드레싱 대신)","석류·딸기 (엘라지탄닌 식품끼리)"],avoid:["고온에서 오래 볶거나 튀기기"]},cautions:["나무 견과 알레르기가 있다면 피하세요. 호두는 국내 알레르기 유발물질 표시 대상입니다.","곰팡이가 피거나 검게 변한 호두는 곰팡이 독소 위험이 있어 버리세요.","열량이 높아(한 줌 약 180kcal) 다른 간식을 대체하는 방식으로 드세요."],myths:[{claim:"호두는 뇌를 닮아 머리에 좋다",truth:'모양이 닮은 것은 우연입니다(옛 "형상 원리" 사고). 호두를 포함한 식사가 인지 기능에 도움이 되는지 연구되고 있지만, WAHA 시험에서도 2년간 인지 기능에 뚜렷한 차이는 없었습니다.'}]},{id:"flaxseed",name:"아마씨",en:"Flaxseed",aliases:["아마","골든아마씨","아마씨가루","아마씨유","아마인","아마인유","린시드","flaxseed","flax","linseed"],emoji:"🌱",category:"콩·견과·씨앗",summary:"ALA(식물성 오메가3)가 식품 중 가장 많은 편인 씨앗으로 100g에 약 23g이고, 리그난(SDG)은 다른 식품보다 수십~수백 배 많습니다. 식이섬유가 약 27%에 이르고 그중 상당 부분이 물을 머금는 점액성 섬유입니다. 껍질이 단단해 통째로 먹으면 상당수가 소화되지 않고 그대로 배출되므로 갈아서 먹어야 합니다. 매일 간 아마씨 30g이 혈압을 낮춘 무작위 시험이 있습니다.",verdict:{tone:"good",text:"갈아서 하루 1~2큰술(10~20g). 간 것은 밀폐 냉장하고, 물을 충분히 드세요."},basis:"마른 아마씨 100g",serving:{label:"간 아마씨 약 1.5큰술 (10g)",grams:10},nutrients:{kcal:534,carb:28.9,sugar:1.55,fiber:27.3,protein:18.3,fat:42.2,satFat:3.7,mufa:7.5,pufa:28.7,la:5.9,ala:22.8,sodium:30,potassium:813,calcium:255,magnesium:392,iron:5.7,zinc:4.3,selenium:25.4,vitE:.31,vitK:4.3,vitB1:1.64,vitB2:.16,vitB6:.47,folate:87},compounds:[{id:"ala",amount:"약 23g/100g (지방의 절반 이상)",role:"간 아마씨 10g이면 ALA 약 2.3g으로 하루 기준치의 약 1.8배입니다. 몸에서 EPA로 일부(수 %), DHA로는 극히 적게 전환되어, 혈중 EPA는 올려도 DHA는 거의 늘지 않습니다."},{id:"lignan",amount:"대략 수백 mg/100g (측정법에 따라 더 높게도 보고), 일반 식물성 식품의 수십~수백 배",role:"세코이소라리시레시놀 디글루코사이드(SDG)가 대장 미생물에 의해 엔테로다이올·엔테로락톤(장 리그난)으로 바뀌어 흡수됩니다. 약한 에스트로겐·항에스트로겐 작용과 항산화 작용이 있어 호르몬 관련 암과 혈압에 대해 연구되지만, 사람 근거는 아직 제한적입니다."},{id:"prebiotic-fiber",amount:"식이섬유 약 27g/100g (점액질 수용성 섬유 포함)",role:"껍질의 점액질(뮤실리지)은 물을 만나면 끈적한 젤이 되어 변을 부드럽게 하고, 담즙산을 붙잡아 LDL을 낮추는 데 기여하며, 대장에서 발효됩니다. 10g이면 섬유 약 2.7g입니다."},{id:"magnesium",amount:"약 390mg/100g",role:"함량은 매우 높지만 한 번에 먹는 양이 적어(10g) 기준치의 약 12%입니다."},{id:"oxidized-lipids",amount:"통씨는 안정적 → 간 뒤, 특히 아마씨유는 산화가 빨라짐",role:"통씨는 껍질과 리그난 같은 항산화 성분이 지방을 보호해 오래 보관할 수 있지만, 갈면 ALA가 공기에 노출됩니다. 아마씨유는 더 빨리 산패하고, 가열 조리에 쓰면 알데하이드 같은 산화물이 생깁니다."}],howToEat:[{title:"반드시 갈아서 먹기",body:"통 아마씨는 단단한 껍질 때문에 상당수가 소화되지 않고 그대로 배출됩니다. 통씨를 먹었을 때는 간 것에 비해 혈중 ALA가 거의 오르지 않았다는 비교 시험이 있습니다. 먹기 직전 그라인더로 갈거나, 간 제품을 사서 밀폐 냉장 보관하세요."},{title:"요거트·오트밀·샐러드에 뿌리기",body:"고소한 맛이라 요거트·오트밀·나물·샐러드에 잘 어울립니다. 빵·머핀에 넣어 구워도 ALA는 대부분 유지된다는 연구가 있지만, 아마씨유를 볶음·튀김에 쓰는 것은 피하세요."},{title:"물을 충분히 마시기",body:"점액성 섬유가 장에서 물을 흡수해 부피가 커집니다. 물 없이 많이 먹으면 오히려 변비나 드물게 장폐색을 일으킬 수 있습니다."},{title:"하루 1~2큰술, 날것 대량은 피하기",body:"아마씨에는 청산배당체(리누스타틴 등)가 소량 있어 날것을 한 번에 많이 먹으면 시안화물이 생길 수 있습니다. 하루 1~2큰술(10~20g)은 일반적으로 문제되지 않고, 빵·머핀처럼 가열한 식품에 넣으면 더 줄어듭니다."}],pairings:{good:["플레인 요거트·오트밀","생선 (EPA·DHA는 생선에서, ALA는 아마씨에서)","물 한 컵"],avoid:["아마씨유로 볶음·튀김"]},cautions:["섬유가 약 흡수를 늦출 수 있어 복용 중인 약과는 1~2시간 간격을 두는 것이 안전합니다.","혈압을 낮추고 혈소판 응집을 약하게 억제할 가능성이 있어, 항응고제·항혈소판제·혈압약을 복용 중이라면 많은 양은 의사와 상의하세요. 사람에서 의미 있는 출혈 증가가 확인된 것은 아닙니다.","장폐색·장협착 병력이 있거나 삼키기 어려운 사람은 피하세요.","임신·수유 중 대량 섭취(리그난은 식물성 에스트로겐)는 안전성 자료가 부족하므로 일반 식사 수준으로 드세요."],myths:[{claim:"아마씨를 먹으면 오메가3가 충분해 생선이나 오메가3 영양제가 필요 없다",truth:"ALA는 EPA로 수 %, DHA로는 1% 안팎만 전환되어 아마씨를 먹어도 뇌·망막에 필요한 DHA는 거의 늘지 않습니다. 아마씨는 ALA·리그난·섬유의 좋은 공급원이고, EPA·DHA는 생선이나 미세조류 오일로 채우는 것이 현실적입니다."},{claim:"아마씨는 청산배당체 때문에 먹으면 위험하다",truth:"날것을 한 번에 많이 먹을 때 이론적 위험이 있지만, 하루 1~2큰술 수준에서 중독은 드뭅니다. 말초동맥질환 환자에게 간 아마씨 30g을 빵·머핀 등에 섞어 6개월간 매일 먹게 한 무작위 시험(FlaxPAD, Rodriguez-Leyva 등, Hypertension 2013)에서 안전성 문제는 보고되지 않았고, 수축기 혈압이 약 10mmHg, 이완기 혈압이 약 7mmHg 낮아졌습니다."}]}],Pe=[{id:"palm-oil",name:"팜유",en:"Palm oil",aliases:["팜 오일","팜올레인","팜스테아린","적색팜유","레드팜유","palm oil","palm olein","red palm oil"],emoji:"🌴",category:"기름·지방",summary:"기름야자 열매의 과육에서 짠 기름으로, 포화지방이 약 50%(대부분 팔미트산), 올레산 약 37~40%, 리놀레산 약 10%입니다. 산화에 강하고 값이 싸서 라면(유탕면)·과자·도넛·튀김·크리머·마가린 같은 가공식품에 가장 많이 쓰입니다. 몸속에서 가장 확실한 영향은 팔미트산이 LDL 콜레스테롤을 올리는 것이고, 고온 정제 공정에서 생기는 글리시딜 에스테르·3-MCPD 에스테르가 별도의 관리 대상입니다.",verdict:{tone:"caution",text:"집에서 쓸 일은 적고 주로 가공식품으로 먹게 됩니다. 튀긴 가공식품을 줄이는 것이 곧 팜유를 줄이는 방법입니다."},basis:"정제 팜유 100g",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:884,fat:100,satFat:49.3,mufa:37,pufa:9.3,la:9.1,ala:.2,vitE:15.9,vitK:8},compounds:[{id:"saturated-fat",amount:"약 49g/100g (팔미트산 약 44g, 스테아르산 약 4g)",role:"팜유의 핵심 성분입니다. 팔미트산은 간세포의 LDL 수용체 활성을 떨어뜨려 혈중 LDL 콜레스테롤을 올립니다. 세포·동물 실험에서는 과잉의 팔미트산이 TLR4 염증 신호와 세라마이드 생성을 자극하는 지방산으로도 알려져 있습니다."},{id:"oleic-acid",amount:"약 37g/100g",role:"두 번째로 많은 지방산입니다. 포화지방과 반반 섞여 있어 상온에서 반고체가 되고, 다불포화지방이 적은 덕분에 튀김 중 산화가 느립니다."},{id:"vitamin-e",amount:"약 16mg/100g (알파토코페롤 기준), 토코트리에놀이 많음",role:"팜유의 비타민 E는 70% 안팎이 토코트리에놀 형태로, 기름 자체의 산화를 막아줍니다. 정제 과정에서 일부 줄어듭니다."},{id:"linoleic-acid",amount:"약 9g/100g",role:"다불포화지방이 콩기름(약 50g)의 5분의 1 수준이라, 반복 가열해도 4-HNE 같은 오메가6 유래 알데하이드가 덜 생깁니다."},{id:"beta-carotene",amount:"비정제 적색 팜유만 카로티노이드 약 50~70mg/100g, 정제 팜유는 거의 없음",role:"적색 팜유의 주황색을 내는 색소로 비타민 A 공급원이 됩니다. 일반 식용·가공용 정제 팜유는 탈색 공정에서 대부분 사라집니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 업소용 튀김기름으로 장시간 쓰면 증가",role:"산화 안정성은 높지만 공장·매장에서 오래 튀기면 결국 산화 알데하이드와 극성 물질이 쌓입니다(→ 산화 지질 참고)."}],howToEat:[{title:"가공식품 원재료명에서 확인하기",body:'원재료명에 "팜유", "팜올레인", 또는 팜유가 섞인 "정제가공유지·식물성유지"로 표시되는 경우가 많습니다. 유탕면, 과자, 도넛, 냉동 튀김, 커피크리머, 초콜릿 가공품이 대표적이며, 영양표시의 포화지방 수치로 양을 가늠할 수 있습니다.'},{title:"유탕면은 비유탕면으로 바꾸거나 면을 한 번 데치기",body:"라면 면은 팜유에 튀겨 만들어 포화지방 대부분이 면에서 나옵니다. 면을 끓는 물에 한 번 데쳐 물을 버린 뒤 다시 끓이면 표면의 기름이 일부 빠집니다. 건면(비유탕면) 제품은 지방이 훨씬 적습니다."},{title:"가정 튀김용으로는 굳이 필요 없음",body:"팜유는 고온 안정성 때문에 업소용 튀김에 쓰이지만, 가정에서는 올리브유·카놀라유로도 충분히 튀길 수 있고 포화지방은 훨씬 적습니다."},{title:"적색 팜유는 가열보다 소량 곁들임으로",body:"비정제 적색 팜유의 카로티노이드·토코트리에놀은 고온에서 쉽게 파괴됩니다. 비타민 A가 부족한 지역에서는 유용한 공급원이지만, 포화지방 구성은 일반 팜유와 같습니다."}],pairings:{good:["적색 팜유 + 채소 요리 (카로티노이드 흡수↑)"],avoid:["유탕면·과자·튀김 간식을 하루에 겹쳐 먹기 (포화지방·열량 누적)"]},cautions:["LDL 콜레스테롤이 높거나 심혈관질환이 있다면 팜유가 많이 든 가공식품의 포화지방을 합산해 보세요. 포화지방 1일 기준치는 15g입니다.","정제 팜유는 240℃가 넘는 고온 탈취 공정에서 글리시딜 지방산 에스테르와 3-MCPD 에스테르가 생깁니다. EFSA(2016)는 식물성 유지 중 팜유·팜지방에서 가장 높게 검출된다고 평가했고, 몸속에서 풀려나는 글리시돌을 유전독성 발암물질로 보았습니다. 이후 업계의 저감과 EU 최대 기준(2018) 도입으로 수치가 크게 낮아졌으며, 체중당 섭취량이 많은 영유아 분유가 가장 우선 관리 대상입니다.",'트랜스지방을 없애기 위해 부분경화유 대신 팜유를 쓰는 제품이 많아, "트랜스지방 0g"인 대신 포화지방이 늘어난 경우가 있습니다.'],myths:[{claim:"팜유는 몸에 들어오면 활성산소를 만들고 염증을 일으킨다",truth:'경로를 나눠 봐야 합니다. ① LDL 상승(근거 강함): 팔미트산은 간세포의 LDL 수용체를 줄여 혈중 LDL을 올립니다. 올리브유·카놀라유 같은 불포화 기름 대신 팜유를 먹으면 LDL이 오른다는 대조시험이 많습니다. ② 세포 염증 신호(주로 세포·동물): 과잉의 팔미트산은 대식세포의 TLR4 신호와 NLRP3 인플라마좀을 자극하고, 세라마이드·디아실글리세롤로 바뀌어 인슐린 신호를 방해하며 소포체 스트레스와 미토콘드리아 활성산소를 늘립니다. 사람에서는 팜유 머핀으로 열량을 초과 섭취시킨 7주 시험에서 해바라기씨유 머핀보다 간 지방·내장지방이 더 늘었습니다. ③ 산화: 팜유 자체는 다불포화지방이 적어 콩기름보다 튀김 중 산화 알데하이드가 덜 생깁니다. 즉 팜유의 문제는 "산화된 기름"보다 "포화지방이 많고, 주로 튀긴 가공식품 형태로 먹는다는 점"에 가깝습니다.'},{claim:"팜유는 식물성이니 라드·버터 같은 동물성 지방보다 건강하다",truth:'식물성이라도 포화지방이 약 49%로 라드(약 39%)보다 많고, 버터(지방 중 약 63%)보다는 적습니다. 콜레스테롤이 없을 뿐 LDL에 주는 영향은 포화지방의 양과 종류를 따라갑니다. "식물성"이라는 표시보다 지방산 구성을 보세요.'},{claim:"팜유가 들어간 과자·라면은 발암물질 덩어리다",truth:"글리시딜 에스테르·3-MCPD 에스테르는 실제 관리 대상이지만, EFSA가 특히 우려한 것은 체중당 섭취량이 많은 영유아·어린이의 높은 섭취군이었습니다. 이후 정제 공정 개선으로 수치가 크게 줄었습니다. 성인에게 현실적으로 더 중요한 것은 팜유 가공식품을 자주 먹을 때 쌓이는 포화지방·열량·나트륨입니다."}]},{id:"margarine",name:"마가린",en:"Margarine",aliases:["마아가린","스프레드","쇼트닝","가공유지","부분경화유","경화유","버터 대용","margarine","shortening"],emoji:"🍞",category:"기름·지방",summary:"식물성 기름을 굳혀 버터처럼 만든 가공 유지입니다. 과거에는 수소를 첨가해 굳히는 부분경화 과정에서 트랜스지방이 많이 생겨, LDL은 올리고 HDL은 낮추며 염증 지표까지 높이는 대표 식품이었습니다. 지금은 규제와 표시 의무화로 트랜스지방을 크게 줄인 대신 팜유·에스테르 교환 유지 등으로 굳히는 제품이 많아, 제품마다 포화지방·트랜스지방 구성이 크게 다릅니다.",verdict:{tone:"caution",text:'원재료명에 "부분경화유"가 있으면 피하고, 버터 대용이라도 소량만. 영양표시의 포화지방·트랜스지방을 꼭 확인하세요.'},basis:"시판 마가린(지방 약 80%) 100g — 원료·제조법에 따라 지방산 구성이 제품마다 크게 다름",serving:{label:"빵 한 쪽에 바르는 양 (약 10g)",grams:10},nutrients:{kcal:717,carb:.7,protein:.2,fat:80},compounds:[{id:"trans-fat",amount:"부분경화유 제품은 과거 지방의 10~20%대까지, 현재 대부분 제품은 크게 줄어듦 — 제품별 확인 필요",role:"니켈 촉매와 수소로 액상 기름을 굳힐 때 일부 이중결합이 수소를 받지 못하고 꺾인 시스형에서 곧은 트랜스형으로 뒤집힙니다. 이 인공 트랜스지방은 LDL은 올리고 HDL은 낮추는 지방으로, 같은 열량당 심혈관 위험이 가장 큽니다."},{id:"saturated-fat",amount:"제품에 따라 크게 다름 (팜유·팜핵유 기반 제품일수록 많음)",role:"트랜스지방 없이 기름을 굳히려면 고체 지방이 필요해 팜유·팜핵유·코코넛유 같은 포화지방 원료가 쓰입니다. 트랜스지방이 줄어든 만큼 포화지방이 늘어난 제품이 많습니다."},{id:"linoleic-acid",amount:"대두유·해바라기씨유 기반 제품에 많음",role:"액상 식물성 기름 부분에서 옵니다. 부드러운 튜브형 제품처럼 액상 기름 비율이 높을수록 포화지방이 적어 LDL 측면에서 유리합니다."},{id:"oleic-acid",amount:"카놀라유·팜유 원료 부분에 존재",role:"원료 기름에서 오는 단일불포화지방으로, 비율은 제품마다 다릅니다."}],howToEat:[{title:'원재료명에서 "부분경화유" 확인',body:'"부분경화유(partially hydrogenated oil)"는 트랜스지방의 주된 출처입니다. 반면 "완전경화유"는 이중결합이 모두 포화되어 트랜스지방은 거의 없지만 그만큼 포화지방(스테아르산)이 됩니다. 원재료명에 부분경화유가 없고 영양표시의 트랜스지방이 0g인 제품을 고르세요.'},{title:'"트랜스지방 0g"의 의미 알기',body:'식약처 표시기준상 트랜스지방은 표시 단위당 0.2g 미만이면 "0g"으로 표시할 수 있습니다. 표시 단위가 작은 제품은 0g이어도 조금 들어 있을 수 있으니, 원재료명의 부분경화유 여부를 함께 보는 것이 확실합니다.'},{title:"볶음·부침에는 액상 기름으로",body:"볶음·부침에는 마가린 대신 올리브유·카놀라유 같은 액상 기름을 쓰면 포화·트랜스지방이 모두 줄어듭니다. 빵에 바를 때는 얇게, 소량만 쓰세요."},{title:"페이스트리·도넛·파이는 빈도 조절",body:"겹겹이 바삭한 크루아상·페이스트리·도넛·파이는 마가린·쇼트닝 같은 고체 유지를 많이 씁니다. 빵집 제품은 영양표시가 없는 경우가 많아, 자주 먹는다면 빈도를 줄이는 것이 현실적인 방법입니다."}],pairings:{avoid:["부분경화유 쇼트닝·마가린으로 튀긴 간식","버터·마가린을 듬뿍 쓴 제과를 매일 간식으로"]},cautions:["심혈관질환·이상지질혈증이 있다면 트랜스지방은 가능한 한 0에 가깝게 유지하세요. WHO는 트랜스지방을 총 섭취 열량의 1% 미만으로 제한하도록 권고합니다.","영양표시가 없는 업소용 유지나 즉석 제과·튀김 간식은 원재료 확인이 어려워, 자주 먹을수록 주의가 필요합니다."],myths:[{claim:"마가린은 몸에 들어오면 활성산소와 염증을 일으키는 최악의 기름이다",truth:'과거 부분경화유 마가린에는 근거가 뚜렷합니다. 인공 트랜스지방은 ① 혈액에서 LDL이 제거되는 속도를 늦추고, CETP 활성을 높여 HDL의 콜레스테롤을 LDL 쪽으로 옮겨 LDL은 올리고 HDL은 낮춥니다. ② 세포막 인지질에 끼어들어 혈관 내피세포의 NF-κB 염증 신호를 켜고, 사람 연구에서 CRP·IL-6·TNF 수용체 같은 염증 지표를 높였으며 혈관 내피 기능을 떨어뜨렸습니다. 섭취 열량의 2%만 트랜스지방으로 바뀌어도 관상동맥질환 위험이 약 23% 높아진다는 분석이 있습니다(근거 강함). 반면 트랜스지방을 줄인 요즘 제품에서는 이 경로가 대부분 사라졌고, 남은 쟁점은 제품에 따라 포화지방이 많을 수 있다는 점입니다. "마가린 = 트랜스지방"은 옛 제품 기준이고, 지금은 제품별 확인이 답입니다.'},{claim:"마가린은 식물성이라 버터보다 무조건 낫다",truth:"트랜스지방이 거의 없고 액상 기름 비중이 높은 부드러운 제품은 버터보다 포화지방이 적어 LDL 측면에서 유리할 수 있습니다. 하지만 팜유를 많이 쓴 딱딱한 제과용 제품은 포화지방이 버터에 가까울 수 있고, 부분경화유 제품이라면 버터보다 나쁩니다. 식물성 여부보다 지방산 구성이 기준입니다."},{claim:"에스테르 교환 유지는 트랜스지방이 없으니 완전히 안전하다",truth:"에스테르 교환은 수소를 넣지 않고 지방산이 글리세롤에 붙는 위치만 재배열해 굳히는 방법이라 트랜스지방이 생기지 않습니다. 사람 시험에서 혈중 지질에 대한 영향은 대체로 원래 지방산 구성을 따라가는 것으로 보이지만, 식후 혈당·지질 대사에 대한 연구는 적고 결과가 엇갈려 아직 판단하기 이릅니다(근거 제한적)."}]},{id:"olive-oil",name:"올리브유",en:"Olive oil (extra virgin)",aliases:["올리브오일","엑스트라버진","엑스트라버진 올리브유","퓨어 올리브유","올리브 포마스","EVOO","olive oil","extra virgin olive oil"],emoji:"🫒",category:"기름·지방",summary:"올리브 열매를 짠 기름으로 올레산(단일불포화지방)이 약 70~75%, 리놀레산은 약 10%에 불과합니다. 화학 처리 없이 짜낸 엑스트라버진 올리브유에는 하이드록시티로솔·올레오칸탈 같은 폴리페놀이 남아 있어, 기름 자체의 산화를 막고 몸속에서는 LDL 입자의 산화를 줄입니다. 지중해식 식단 대규모 무작위 시험(PREDIMED)에서 심혈관질환 감소와 연결된 기름입니다.",verdict:{tone:"good",text:"기본 기름으로 쓰기 좋아요. 향과 폴리페놀이 살아 있는 엑스트라버진을, 너무 오래 두지 말고."},basis:"올리브유 100g (USDA 일반 올리브유 기준 — 엑스트라버진도 지방산 구성은 비슷하고, 폴리페놀은 엑스트라버진에만 의미 있게 남음)",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:884,fat:100,satFat:13.8,mufa:73,pufa:10.5,la:9.8,ala:.76,vitE:14.4,vitK:60},compounds:[{id:"oleic-acid",amount:"약 71g/100g",role:"올리브유의 주성분입니다. 이중결합이 하나뿐이라 리놀레산보다 산화가 훨씬 느리고, 포화지방 대신 먹으면 LDL을 낮춥니다."},{id:"olive-polyphenol",amount:"엑스트라버진 대략 10~50mg/100g (품종·수확 시기·신선도에 따라 큰 차이), 정제유는 거의 없음",role:"하이드록시티로솔은 LDL 입자에 실려 LDL 산화를 막고(EFSA 인정 건강강조표시), 올레오칸탈은 COX 효소를 억제하는 약한 항염 작용을 합니다. 기름 안에서는 불포화지방의 산화를 막아 가열 안정성을 높입니다."},{id:"vitamin-e",amount:"약 14mg/100g",role:"폴리페놀과 함께 기름 속 지방의 산화를 막는 지용성 항산화제입니다."},{id:"linoleic-acid",amount:"약 10g/100g",role:"콩기름의 5분의 1 수준이라, 가열할 때 4-HNE 같은 오메가6 유래 알데하이드가 덜 생깁니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 오래되거나 빛에 노출되면 증가",role:"산화에 강한 편이지만 투명한 병·밝은 곳·개봉 후 오래 두면 폴리페놀이 먼저 소모되고 이어서 산패가 진행됩니다."}],howToEat:[{title:"엑스트라버진을 고르고 수확일·병 색을 확인",body:'폴리페놀은 압착 직후가 가장 많고 시간이 지날수록 줄어듭니다. 수확(압착) 연도가 최근이고, 빛을 막는 짙은 색 병이나 캔에 든 제품을 고르세요. "퓨어", "라이트", "포마스" 올리브유는 정제 과정에서 폴리페놀이 대부분 사라집니다.'},{title:"볶음·부침에 써도 된다",body:"엑스트라버진 올리브유의 발연점은 대략 190~210℃로 볶음·부침 온도보다 높고, 단일불포화지방과 폴리페놀 덕분에 다불포화지방이 많은 기름보다 가열 중 극성 물질·알데하이드가 적게 생깁니다. 다만 가열할수록 폴리페놀과 향은 줄어듭니다."},{title:"생으로 쓰면 폴리페놀을 가장 많이",body:"샐러드·나물·빵 찍어 먹기·완성된 요리 위에 두르면 폴리페놀과 향을 그대로 섭취할 수 있습니다. 목이 따끔한 매운맛은 올레오칸탈이 목구멍의 TRPA1 수용체를 자극해서, 쌉쌀한 맛은 올레우로페인 계열 폴리페놀 때문입니다."},{title:"서늘하고 어두운 곳에, 개봉 후 몇 달 안에",body:"빛·열·공기는 폴리페놀을 먼저 소모시키고 이어서 지방을 산화시킵니다. 가스레인지 옆을 피하고 뚜껑을 꼭 닫으세요. 냉장하면 뿌옇게 굳는데 품질 문제는 아닙니다."}],pairings:{good:["토마토 (라이코펜 흡수↑)","채소·콩류 (지용성 성분 흡수↑)","생선·통곡물 (지중해식 조합)"],avoid:["버터·마가린과 겹쳐 쓰기 (대체해야 이득이 생김)"]},cautions:["열량은 다른 기름과 같습니다(1큰술 약 120kcal). 좋은 기름이라도 다른 지방을 대체하지 않고 더하기만 하면 열량 과잉이 됩니다.","향이 없고 기름 맛만 나거나, 크레용·오래된 견과 같은 쩐내가 나면 이미 산화가 진행된 것입니다."],myths:[{claim:"올리브유는 발연점이 낮아 가열하면 독성 물질이 생긴다",truth:"발연점만으로 가열 안정성을 판단하기 어렵습니다. 산화는 이중결합이 많을수록 빠른데, 올리브유는 다불포화지방이 약 10%로 적고 폴리페놀·비타민 E가 산화를 막습니다. 여러 가열 실험에서 엑스트라버진 올리브유는 다불포화지방이 많은 기름보다 산화 생성물이 적었습니다. 가정의 볶음·부침에는 충분히 안정적이며, 연기가 날 때까지 달구지만 않으면 됩니다."},{claim:"올리브유 폴리페놀이 몸속 활성산소를 직접 없앤다",truth:'확인된 것은 더 구체적인 작용입니다. 하이드록시티로솔은 흡수가 잘 되는 편이고 LDL 입자에 실려 LDL 산화를 막는다는 사람 시험(EUROLIVE)이 있어, EFSA가 올리브유 20g당 폴리페놀 5mg 이상인 제품에 건강강조표시를 인정했습니다. Nrf2 활성·NF-κB 억제 같은 나머지 항염 작용은 주로 세포·동물 근거이고, 올레오칸탈의 COX 억제도 올리브유 50g이 이부프로펜 성인 진통 용량의 약 10%에 해당하는 정도로 약합니다. "직접 중화"보다 LDL 보호와 세포 신호 조절이 핵심입니다.'},{claim:"올리브유면 등급과 상관없이 다 같다",truth:'"엑스트라버진"은 기계적 압착만 하고 산도·관능 기준을 통과한 등급이고, "퓨어(또는 그냥 올리브유)"는 정제 올리브유에 버진유를 조금 섞은 것, "포마스"는 짜고 남은 찌꺼기에서 용매로 추출해 정제한 기름입니다. 지방산 구성은 비슷하지만 폴리페놀 같은 미량 성분은 엑스트라버진에만 의미 있게 남습니다. PREDIMED 시험에서 쓴 것도 엑스트라버진입니다.'}]},{id:"soybean-oil",name:"콩기름 (대두유)",en:"Soybean oil",aliases:["콩기름","대두유","식용유","대두 기름","튀김기름","씨앗기름","시드오일","soybean oil","soy oil"],emoji:"🍳",category:"기름·지방",summary:'콩에서 추출한 기름으로 리놀레산(오메가6)이 약 50%, 올레산 약 23%, 알파리놀렌산(오메가3) 약 7%입니다. 한국 가정과 외식에서 "식용유"로 가장 흔히 쓰이는 기름 중 하나입니다. 신선한 콩기름은 포화지방 대신 쓰면 LDL을 낮추지만, 이중결합이 많아 반복 가열하면 올리브유·팜유보다 산화 알데하이드가 빠르게 쌓입니다. "씨앗기름이 염증을 일으킨다"는 논쟁의 중심에 있는 기름입니다.',verdict:{tone:"balanced",text:"신선한 기름을 볶음·부침에 적당히 쓰는 건 괜찮아요. 튀김기름 재사용과 연기 날 때까지 가열은 피하세요."},basis:"정제 콩기름(대두유) 100g",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:884,fat:100,satFat:15.6,mufa:22.8,pufa:57.7,la:50.4,ala:6.8,vitE:8.2,vitK:184},compounds:[{id:"linoleic-acid",amount:"약 50g/100g",role:"가장 많은 지방산입니다. 신선할 때는 포화지방 대신 먹으면 LDL을 낮추지만, 두 이중결합 사이 탄소의 수소가 쉽게 떨어져 나가 튀김 온도에서 산화의 주된 출발점이 됩니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 튀김 재사용 시 빠르게 증가",role:'반복 가열한 콩기름에는 리놀레산에서 생긴 4-HNE와 아크롤레인 같은 알데하이드가 쌓입니다. 이것이 몸속에서 글루타티온을 소모시키고 NF-κB 염증 신호를 켜는 것이 "기름이 활성산소와 염증을 만든다"는 이야기의 실제 경로입니다(→ 산화 지질 참고).'},{id:"ala",amount:"약 7g/100g",role:"식물성 오메가3로 1큰술에 약 1g, 기준치(1.3g)의 약 70%입니다. 다만 이중결합이 3개라 가열에 가장 약하고, 오래 가열한 콩기름의 비린 냄새(풍미 역전)의 원인이기도 합니다."},{id:"vitamin-e",amount:"알파토코페롤 약 8mg/100g, 감마토코페롤은 그보다 훨씬 많음",role:"기름 속 다불포화지방을 지키는 천연 항산화제입니다. 튀길수록 먼저 소모되고, 바닥나면 산화가 빨라집니다."},{id:"vitamin-k",amount:"약 180μg/100g",role:"식물성 기름 중 비타민 K1이 많은 편으로, 1큰술에 기준치의 약 35%입니다."},{id:"oleic-acid",amount:"약 22g/100g",role:"세 번째로 많은 지방산입니다. 올레산 비율을 높인 고올레산 콩기름은 가열 안정성이 크게 좋아집니다."}],howToEat:[{title:"볶음·부침은 괜찮지만 연기 나기 전까지만",body:"정제 콩기름의 발연점은 대략 230℃ 안팎으로 높은 편이지만, 발연점과 산화 안정성은 다릅니다. 다불포화지방이 많아 같은 온도에서 올리브유·카놀라유보다 빨리 산화되니, 팬이 달궈지면 바로 재료를 넣고 연기가 날 때까지 두지 마세요."},{title:"튀김기름 재사용은 1~2회 이내",body:"170~180℃ 튀김을 반복할수록 산화물과 극성 물질이 쌓입니다. 색이 짙어지고, 거품이 잘 꺼지지 않고, 끈적해지고, 쩐내가 나면 버리세요. 다시 쓸 기름은 찌꺼기를 걸러 밀봉해 어두운 곳에 둡니다."},{title:"외식 튀김은 빈도로 조절",body:"업소 튀김기름은 가정보다 훨씬 오래 쓰일 수 있고 먹는 사람이 신선도를 확인할 방법이 없습니다. 치킨·튀김·전을 자주 먹는다면 빈도를 줄이는 것이 가장 현실적인 방법입니다."},{title:"작은 병을 사서 빛을 피해 보관",body:"개봉 후 공기와 빛에 노출되면 서서히 산화됩니다. 몇 달 안에 다 쓸 수 있는 크기를 사고, 가스레인지 옆·창가를 피하세요."}],pairings:{good:["채소 볶음·나물 (지용성 비타민·카로티노이드 흡수↑)","생선·들기름 같은 오메가3 식품 (오메가6 위주 식단의 균형)"],avoid:["여러 번 쓴 튀김기름","튀김 외식을 하루에 여러 번"]},cautions:["와파린을 복용 중이라면 비타민 K가 많은 기름임을 알아두세요. 끊기보다 평소 쓰는 양을 일정하게 유지하는 것이 원칙입니다.","대두 알레르기가 있어도 고도로 정제한 콩기름은 단백질이 대부분 제거되어 대개 반응하지 않지만, 압착·비정제 콩기름은 반응할 수 있습니다.","튀김·볶음 연기(조리흄)에는 아크롤레인 같은 알데하이드가 들어 있으니 주방 환기를 충분히 하세요."],myths:[{claim:"콩기름 같은 씨앗기름은 오메가6가 많아 몸속에서 활성산소와 염증을 만든다",truth:'두 갈래로 나눠 봐야 합니다. ① 신선한 기름의 리놀레산: 흡수된 리놀레산 일부는 간에서 불포화효소를 거쳐 아라키돈산이 되고, 아라키돈산은 COX·LOX 효소로 염증 매개물질의 재료가 됩니다. 하지만 이 전환은 엄격히 조절되어, 사람 시험에서 리놀레산 섭취를 늘려도 조직 아라키돈산과 CRP·IL-6 같은 염증 지표가 오르지 않았습니다. 여러 나라 코호트를 통합한 분석에서는 혈중 리놀레산이 높을수록 심혈관질환 위험이 오히려 낮았습니다. ② 산화된 기름: 반복 가열한 기름에는 과산화물과 4-HNE·아크롤레인 같은 알데하이드가 이미 만들어져 있습니다. 이것이 흡수되면 단백질에 달라붙고 글루타티온을 소모시키며 미토콘드리아 활성산소와 NF-κB 염증 신호를 늘립니다(주로 동물·세포 근거). 결론적으로 위험의 핵심은 "오메가6 자체"보다 "산화된 기름"과 "튀긴 음식을 자주 먹는 식습관"입니다.'},{claim:"콩기름은 설탕(과당)보다 더 살찌게 한다",truth:"고지방 사료에 콩기름 또는 코코넛유를 넣고 과당 추가 여부를 비교한 2015년 쥐 실험에서, 콩기름 사료가 체중·지방간·인슐린 저항성을 더 늘렸다는 결과가 알려지며 퍼진 이야기입니다. 사람에게 그대로 적용하기 어렵고, 사람 시험에서는 포화지방 대신 다불포화지방을 과잉 섭취했을 때 간 지방이 오히려 덜 늘었습니다."}]},{id:"butter",name:"버터",en:"Butter",aliases:["가염버터","무염버터","기버터","정제버터","목초버터","그래스페드 버터","방탄커피","ghee","butter"],emoji:"🧈",category:"기름·지방",summary:"우유 지방을 모아 굳힌 것으로 지방이 약 81%, 그중 약 63%가 포화지방(팔미트산·미리스트산·스테아르산)입니다. 비타민 A가 많고, 부티르산 같은 짧은·중간 사슬 지방산과 소량의 천연 트랜스지방(반추동물 유래)이 들어 있습니다. 포화지방이 많아 산화에는 강하지만, 몸속에서는 LDL 콜레스테롤을 올리는 것이 가장 확실한 영향입니다. 우유 고형분 때문에 발연점이 낮아 고온 조리에는 맞지 않습니다.",verdict:{tone:"caution",text:"풍미를 내는 용도로 소량이면 괜찮아요. LDL이 높다면 요리의 기본 기름은 식물성 기름으로 바꾸세요."},basis:"무염 버터 100g (가염 버터는 나트륨이 100g당 약 600~700mg)",serving:{label:"빵 한 쪽에 바르는 양 (약 10g)",grams:10},nutrients:{kcal:717,carb:.06,protein:.85,fat:81.1,satFat:51.4,mufa:21,pufa:3,transFat:3.3,la:2.7,ala:.32,cholesterol:215,sodium:11,calcium:24,vitA:684,vitE:2.3,vitK:7},compounds:[{id:"saturated-fat",amount:"약 51g/100g (팔미트산·미리스트산·스테아르산)",role:"버터 지방의 약 3분의 2입니다. 특히 팔미트산과 미리스트산이 간의 LDL 수용체 활성을 떨어뜨려 LDL 콜레스테롤을 올립니다. 스테아르산은 LDL에 미치는 영향이 거의 없습니다."},{id:"trans-fat",amount:"약 3g/100g (천연 반추동물 트랜스지방: 박센산·CLA)",role:"소의 반추위 미생물이 만든 천연 트랜스지방입니다. 박센산이 대부분이며 일부는 몸에서 공액리놀레산(CLA)으로 바뀝니다. 일반 섭취량에서 인공 트랜스지방처럼 심혈관 위험을 높인다는 근거는 약하지만, 이롭다고 확정할 근거도 부족합니다."},{id:"mct",amount:"짧은·중간 사슬 지방산 합계 지방의 약 10% (부티르산 약 3%)",role:"부티르산(C4)·카프로산(C6)·카프릴산(C8)·카프르산(C10)은 문맥으로 바로 흡수되어 간에서 빨리 연소됩니다. 버터 향에도 관여하지만 양이 적고 소장에서 흡수되므로, 대장 세균이 식이섬유로 만드는 부티르산 같은 장 건강 효과를 기대하기는 어렵습니다."},{id:"beta-carotene",amount:"소량 (목초 사육 젖소 버터일수록 많아 더 노란색)",role:"버터의 노란색을 내는 색소입니다. 버터의 비타민 A(684μg RAE/100g)는 대부분 이미 활성형인 레티놀이고, 베타카로틴은 일부를 보탭니다."}],howToEat:[{title:"약한 불에서, 태우지 않기",body:"일반 버터는 수분과 우유 단백질·유당 때문에 발연점이 약 150~175℃로 낮습니다. 센 불에서는 우유 고형분이 타고 지방이 분해되며 아크롤레인 같은 자극성 물질이 생깁니다. 불을 줄인 뒤 마지막에 넣어 풍미를 내는 용도로 쓰세요."},{title:"고온 조리에는 기(ghee)나 식물성 기름",body:"버터를 약불에 녹여 수분과 우유 고형분을 걸러낸 기(정제 버터)는 발연점이 약 230~250℃로 높아집니다. 다만 포화지방 비율은 버터와 같아 LDL 측면의 이점은 없습니다."},{title:"버터 일부를 올리브유로 바꾸기",body:"포화지방을 불포화지방으로 바꾸는 것이 LDL을 낮추는 가장 확실한 식이 방법입니다. 빵은 올리브유에 찍어 먹고, 볶음은 식물성 기름에 버터 한 조각만 더해 향을 내는 식으로 비율을 조절할 수 있습니다."},{title:"버터를 음료로 많이 먹는 방식은 주의",body:'"방탄커피"처럼 커피에 버터 1큰술(14g)을 넣으면 한 잔에 포화지방이 약 7g으로 하루 기준치(15g)의 절반입니다. 사람에 따라 LDL이 크게 오를 수 있으니, 꾸준히 먹는다면 혈중 지질을 확인하세요.'}],pairings:{good:["올리브유와 섞어 쓰기 (풍미는 살리고 포화지방은 줄임)","구운 채소 소량 (지용성 성분 흡수↑)"],avoid:["센 불 볶음·튀김","가염 버터 + 짠 음식 (나트륨 누적)"]},cautions:["LDL 콜레스테롤이 높거나 가족성 고콜레스테롤혈증이 있다면 버터의 포화지방이 LDL을 특히 크게 올릴 수 있습니다.","가염 버터는 10g에 나트륨이 약 60~70mg 들어 있습니다.","유당은 매우 적어 유당불내증이 있어도 대개 괜찮지만, 우유 단백질 알레르기가 있다면 버터에도 반응할 수 있습니다."],myths:[{claim:"버터는 천연 지방이라 몸에 좋고, 포화지방이 해롭다는 건 옛날 이야기다",truth:'포화지방과 심장병의 관계가 식품에 따라 다르다는 연구가 늘었지만(요구르트·치즈는 대체로 중립적), 포화지방이 LDL을 올린다는 것은 수많은 대조시험에서 일관된 사실입니다. 관찰연구 메타분석에서 버터 섭취는 심혈관질환과 뚜렷한 관련이 없었지만 총사망률과는 약하게 관련됐고, 이것이 버터가 "이롭다"는 뜻은 아닙니다. 버터·코코넛유·올리브유를 4주간 비교한 영국 시험에서도 버터가 LDL을 가장 많이 올렸습니다.'},{claim:"목초를 먹인 그래스페드 버터는 포화지방 걱정이 없다",truth:"목초 사육 버터는 오메가3·CLA·베타카로틴이 조금 더 많지만, 포화지방 비율은 일반 버터와 비슷합니다. LDL에 주는 영향도 크게 다르지 않습니다."},{claim:"버터는 산화에 강하니 식물성 기름보다 무조건 안전하다",truth:"포화지방이 많아 가열 중 산화 알데하이드가 적게 생기는 것은 맞습니다. 하지만 버터는 우유 고형분이 타는 온도가 낮아 고온 조리에 맞지 않고, 몸속에서는 산화가 아니라 LDL 상승이라는 다른 경로로 심혈관 위험에 영향을 줍니다. 조리 중 산화 안정성과 몸에 미치는 영향은 별개의 문제입니다."}]},{id:"coconut-oil",name:"코코넛오일",en:"Coconut oil",aliases:["코코넛유","코코넛 오일","버진 코코넛오일","코코넛 기름","VCO","coconut oil","오일풀링"],emoji:"🥥",category:"기름·지방",summary:'코코넛 과육에서 얻은 기름으로 포화지방이 약 82%로 버터(지방 중 약 63%)보다도 높고, 그중 라우르산(C12)이 지방산의 약 45~50%를 차지합니다. "중쇄지방(MCT)이라 살이 안 찌고 심장에 좋다"는 마케팅이 퍼졌지만, 연구에 쓰인 MCT 오일(C8·C10)과 코코넛오일은 구성이 다르고, 코코넛오일은 LDL과 HDL을 모두 올립니다.',verdict:{tone:"caution",text:"향을 즐기는 정도로 가끔. 건강 효과를 기대하고 매일 먹을 기름은 아닙니다."},basis:"코코넛오일 100g",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:892,fat:99.1,satFat:82.5,mufa:6.3,pufa:1.7,la:1.7},compounds:[{id:"saturated-fat",amount:"약 82g/100g (라우르산 약 42g, 미리스트산 약 17g, 팔미트산 약 9g)",role:"대부분이 포화지방입니다. 라우르산·미리스트산은 간의 LDL 수용체 활성을 떨어뜨려 LDL을 올리는 힘이 강한 편이고, 라우르산은 HDL도 함께 올립니다."},{id:"mct",amount:"카프릴산(C8)+카프르산(C10) 약 12g/100g 안팎, 라우르산(C12)까지 포함하면 약 55g",role:"진짜 MCT 오일의 주성분인 C8·C10은 코코넛오일의 약 12%뿐입니다. 이들은 문맥으로 바로 흡수되어 간에서 빨리 연소되고 케톤체를 만들지만, 주성분인 라우르산은 상당 부분이 긴사슬 지방처럼 암죽미립(킬로미크론)에 실려 림프로 흡수됩니다."},{id:"oleic-acid",amount:"약 6g/100g",role:"불포화지방은 다 합쳐도 10%가 안 됩니다. 그만큼 산화에는 매우 강합니다."},{id:"oxidized-lipids",amount:"가열해도 적게 생김",role:"이중결합이 거의 없어 볶음·튀김 중 산화 알데하이드가 적게 생깁니다. 다만 버진 코코넛오일의 발연점은 약 175℃로 높지 않습니다."}],howToEat:[{title:"향이 필요한 요리에 소량",body:"동남아 커리·베이킹처럼 코코넛 향이 어울리는 요리에 소량 쓰는 정도가 적당합니다. 매일 쓰는 기본 기름으로는 불포화지방이 많은 기름이 LDL 관리에 유리합니다."},{title:"MCT 효과를 원한다면 MCT 오일과 구분",body:"체중·케톤 관련 연구 대부분은 C8·C10으로 만든 MCT 오일로 한 것입니다. 그 효과도 일반 기름 대비 몇 주에서 몇 달에 걸쳐 체중이 평균 0.5kg 안팎 더 줄어드는 정도로 작고, MCT 오일은 한 번에 많이 먹으면 복통·설사가 흔합니다."},{title:"굳었다 녹았다 하는 것은 정상",body:"약 24℃ 아래에서는 하얗게 굳고 그 위에서는 투명한 액체가 됩니다. 포화지방이 많다는 표시일 뿐 품질 변화는 아닙니다."}],pairings:{good:["채소·해산물 커리 (채소의 섬유·폴리페놀과 함께)"],avoid:["버터·팜유 가공식품과 겹쳐 먹기 (포화지방 누적)"]},cautions:["LDL 콜레스테롤이 높거나 심혈관질환이 있다면 코코넛오일은 LDL을 올리는 기름임을 기억하세요. 미국심장협회는 2017년 권고에서 코코넛오일 사용을 권하지 않았습니다.","저탄수·케톤 식단으로 코코넛오일을 많이 먹는다면 LDL이 크게 오를 수 있으니 혈중 지질을 확인하세요."],myths:[{claim:"코코넛오일은 MCT라 살이 안 찌고 바로 에너지로 쓰인다",truth:"MCT의 장점으로 알려진 빠른 흡수·연소는 C8·C10 이야기입니다. 코코넛오일 지방산의 절반가량인 라우르산(C12)은 상당 부분이 긴사슬 지방처럼 림프관을 통해 흡수되므로, 코코넛오일을 MCT 오일과 같은 것으로 볼 수 없습니다. 1큰술 약 120kcal로 열량도 다른 기름과 같습니다."},{claim:"코코넛오일은 HDL을 올려주니 심장에 좋은 기름이다",truth:"임상시험 메타분석에서 코코넛오일은 비열대성 식물성 기름보다 LDL을 평균 약 10mg/dL 올렸고 HDL도 올렸습니다. 하지만 HDL을 식품이나 약으로 올려서 심혈관 위험이 줄어든다는 근거는 없어, LDL 상승을 상쇄한다고 볼 수 없습니다. 버터보다는 LDL을 덜 올린다는 시험이 있지만, 올리브유·카놀라유와 비교하면 불리합니다."},{claim:"코코넛오일로 오일풀링을 하면 몸속 독소가 빠진다",truth:"입안에 기름을 머금고 헹구는 오일풀링이 몸의 독소를 빼낸다는 근거는 없습니다. 입속 세균·치태 감소에 대한 소규모 연구가 있을 뿐이며, 양치질과 치실을 대신할 수 없습니다."}]},{id:"perilla-oil",name:"들기름",en:"Perilla oil",aliases:["생들기름","저온압착 들기름","볶은 들기름","들깨기름","들깨유","perilla oil","오메가3 기름"],emoji:"🌿",category:"기름·지방",summary:"들깨를 짠 기름으로 식물성 오메가3인 알파리놀렌산(ALA)이 지방산의 약 55~64%를 차지해, 아마씨유와 함께 가장 많은 편입니다. 1작은술만으로 ALA 하루 기준치를 넘깁니다. 대신 이중결합이 3개인 ALA가 대부분이라 산화가 가장 빠른 기름 중 하나여서, 가열 요리보다 무침·마무리용으로 쓰고 냉장 보관해 빨리 먹는 것이 핵심입니다.",verdict:{tone:"good",text:"나물 무침·비빔 등 생으로 쓰기 좋은 오메가3 기름. 냉장 보관하고 개봉 후 빨리 드세요."},basis:"들기름 100g (USDA 자료 없음 — 지방산 값은 문헌의 대략치로, 들깨 품종·볶음 정도에 따라 차이)",serving:{label:"1작은술 (약 5g)",grams:5},nutrients:{kcal:884,fat:100,satFat:8.5,mufa:14,pufa:72,la:14,ala:57},compounds:[{id:"ala",amount:"약 55~60g/100g (지방산의 약 55~64%)",role:"들기름의 핵심입니다. 1작은술(5g)에 약 2.8g으로 기준치(1.3g)의 2배가 넘습니다. 몸속에서 세포막의 오메가3 비율을 높이고 일부는 EPA로 바뀌지만, DHA로 바뀌는 양은 1% 미만으로 매우 적습니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 상온·빛·개봉 후 시간이 지나면 빠르게 증가",role:"ALA는 리놀레산보다도 2배 이상 빨리 산화됩니다. 산화되면 비린내·쩐내가 나고, 과산화물과 4-HHE·프로파날 같은 오메가3 유래 알데하이드가 생깁니다(→ 산화 지질 참고)."},{id:"linoleic-acid",amount:"약 13~15g/100g",role:"오메가6가 오메가3의 약 4분의 1이라, 오메가6가 많은 식단의 균형을 맞추는 데 도움이 됩니다."},{id:"oleic-acid",amount:"약 13~17g/100g",role:"산화에 강한 단일불포화지방의 비율이 낮아, 기름 전체의 산화 안정성은 낮은 편입니다."},{id:"vitamin-e",amount:"주로 감마토코페롤",role:"ALA의 산화를 늦추는 천연 항산화제지만, 개봉 후 ALA를 오래 지켜줄 만큼 많지는 않습니다."},{id:"heat-byproducts",amount:"들깨를 과하게 볶은 제품에서 문제 (식약처 식용유지 벤조피렌 기준 2.0μg/kg)",role:"들깨를 너무 높은 온도로 오래 볶으면 벤조피렌 같은 다환방향족탄화수소(PAH)가 생길 수 있어, 식약처가 식용유지의 벤조피렌 기준을 두고 초과 제품을 회수합니다."}],howToEat:[{title:"가열보다 무침·비빔·마무리용",body:"나물 무침, 비빔밥, 두부·김 무침에 쓰거나 국·볶음은 불을 끈 뒤 두르는 방식이 ALA를 가장 잘 살립니다. 센 불 볶음·튀김에 쓰면 ALA가 빠르게 산화되어 이점은 줄고 산화물만 늘어납니다."},{title:"개봉 후 냉장 보관, 1~2개월 안에",body:"들기름은 냉장 보관이 원칙입니다(참기름은 산화에 강해 실온 보관이 가능하고 냉장하면 뿌옇게 굳기 쉽습니다). 작은 병을 사서 빛이 들지 않게 보관하고, 비린내·쩐내가 나면 버리세요."},{title:"생들기름과 볶은 들기름",body:"저온압착 생들기름은 향이 약하지만 고온 볶음에서 생길 수 있는 PAH 걱정이 적습니다. 볶은 들기름은 고소한 향이 강하고, 볶을 때 생긴 갈색화 반응 산물이 산화를 다소 늦춘다는 연구도 있습니다. 어느 쪽이든 신선도 관리가 더 중요합니다."},{title:"들깨가루도 같은 원리로 보관",body:"볶은 들깨가루도 ALA가 많아 공기에 노출되면 금방 산패합니다. 밀봉해 냉장·냉동 보관하세요."}],pairings:{good:["나물·두부·김 (지용성 비타민·카로티노이드 흡수↑)","비빔밥·국 (불을 끈 뒤 마무리 기름으로)"],avoid:["센 불 볶음·튀김","실온에 오래 둔 기름"]},cautions:["쩐내나 비린내가 나는 들기름은 이미 산화된 것입니다. 산화된 기름은 오메가3 이점보다 산화물 섭취가 더 커집니다.","열량은 다른 기름과 같습니다(1큰술 약 120kcal). 건강 목적으로 따로 떠먹으면 그만큼 열량이 더해집니다."],myths:[{claim:"들기름은 오메가3라 많이 먹을수록 염증이 줄어든다",truth:'ALA 섭취가 많을수록 심혈관질환 위험이 조금 낮다는 관찰연구 메타분석(하루 1g 늘 때 약 10% 감소)이 있지만, ALA가 염증성 질환을 치료한다는 근거는 약합니다. ALA는 몸에서 EPA로 일부만, DHA로는 1% 미만이 바뀌어 생선의 EPA·DHA를 대신하기 어렵습니다. 또 산화된 들기름은 오히려 알데하이드를 들여오므로 "신선한 기름을 적당량"이 조건입니다.'},{claim:"들기름 한 숟가락을 공복에 먹으면 혈관이 깨끗해진다",truth:"공복 섭취가 효과를 높인다는 근거는 없습니다. ALA는 식사와 함께 먹어도 잘 흡수되고, 1큰술(약 120kcal)을 따로 먹으면 그만큼 열량이 늘어납니다. 나물·비빔밥에 평소 쓰는 기름을 들기름으로 바꾸는 쪽이 현실적입니다."}]},{id:"sesame-oil",name:"참기름",en:"Sesame oil",aliases:["참깨기름","참깨유","볶은 참기름","sesame oil","toasted sesame oil"],emoji:"🥢",category:"기름·지방",summary:"볶은 참깨를 짠 기름으로 리놀레산(오메가6) 약 41%와 올레산 약 40%가 비슷하게 섞여 있습니다. 다불포화지방이 많은데도 산화에 잘 견디는데, 세사민·세사몰린 같은 리그난과 볶을 때 세사몰린에서 생기는 세사몰, 감마토코페롤이 기름을 지켜주기 때문입니다. 한국 요리처럼 소량을 향미유로 쓰는 방식이 잘 맞는 기름입니다.",verdict:{tone:"good",text:"나물·비빔·마무리 향미유로 소량씩 쓰기 좋아요. 실온의 어두운 곳에 보관하세요."},basis:"참기름 100g (USDA 참기름 기준 — 볶은 참기름도 지방산 구성은 비슷)",serving:{label:"1작은술 (약 5g)",grams:5},nutrients:{kcal:884,fat:100,satFat:14.2,mufa:39.7,pufa:41.7,la:41.3,ala:.3,vitE:1.4,vitK:13.6},compounds:[{id:"lignan",amount:"세사민 대략 0.3~1g/100g + 세사몰린 (품종·제조법에 따라 차이)",role:"참기름을 산화에서 지키는 주역입니다. 볶는 과정에서 세사몰린 일부가 강력한 항산화 물질인 세사몰로 바뀌어, 다불포화지방이 많은데도 오래 보관할 수 있습니다. 몸속에서는 감마토코페롤의 분해를 늦추고 콜레스테롤 흡수를 줄이는 작용이 동물·소규모 사람 연구에서 보고되었습니다."},{id:"linoleic-acid",amount:"약 41g/100g",role:"가장 많은 지방산입니다. 다만 향미유로 1작은술씩 쓰는 양에서는 약 2g으로, 하루 오메가6 섭취에서 차지하는 비중이 크지 않습니다."},{id:"oleic-acid",amount:"약 39g/100g",role:"리놀레산과 거의 같은 양의 단일불포화지방으로, 기름의 산화 안정성을 보탭니다."},{id:"vitamin-e",amount:"대부분 감마토코페롤 (알파토코페롤은 약 1mg/100g)",role:"세사민과 함께 기름 속 산화를 막습니다. 참깨를 먹으면 세사민이 간에서 감마토코페롤의 분해를 늦춰 혈중 농도가 올라갔다는 소규모 사람 연구가 있습니다."},{id:"heat-byproducts",amount:"참깨를 과하게 볶을 때 벤조피렌 등 PAH 생성 가능 (식약처 식용유지 기준 2.0μg/kg)",role:"참깨를 너무 높은 온도로 오래 볶으면 다환방향족탄화수소(PAH)가 생길 수 있어 식약처가 참기름·들기름의 벤조피렌을 관리합니다. 기준을 지킨 제품을 향미유로 소량 쓰는 양에서는 노출이 적습니다."}],howToEat:[{title:"불을 끈 뒤 마지막에 두르기",body:"참기름의 고소한 향(피라진 같은 볶음 향)은 휘발성이라 오래 가열하면 날아갑니다. 나물·비빔밥·국·볶음에 불을 끈 뒤 두르면 향도 살고 기름의 산화도 적습니다."},{title:"볶음에 써도 비교적 안정적",body:"리그난과 세사몰 덕분에 리놀레산 비율이 비슷한 다른 씨앗기름보다 가열 산화에 강합니다. 다만 볶은 참기름의 발연점은 대략 170~180℃로 높지 않아 센 불 튀김에는 맞지 않습니다."},{title:"실온의 어두운 곳에 보관",body:"참기름은 산화 안정성이 높아 실온 보관이 가능하고, 냉장하면 뿌옇게 굳을 수 있습니다. 직사광선과 가스레인지 열은 피하세요. 냉장 보관하는 들기름과 반대라고 기억하면 편합니다."},{title:"나물 무침에 쓰면 지용성 성분 흡수↑",body:"시금치·고사리·콩나물 무침에 참기름을 두르면 루테인·베타카로틴·비타민 K 같은 지용성 성분의 흡수가 늘어납니다."}],pairings:{good:["시금치·나물 (지용성 비타민 흡수↑)","들기름과 번갈아 쓰기 (오메가6·오메가3 균형)"],avoid:["센 불 튀김"]},cautions:["참깨 알레르기가 있으면 참기름에도 반응할 수 있습니다. 특히 정제하지 않은 볶은 참기름은 단백질이 남아 있을 가능성이 큽니다.",'"향미유"처럼 다른 식용유에 참기름·향을 섞은 제품은 리그난이 훨씬 적습니다. 원재료명에서 참깨 비율을 확인하세요.'],myths:[{claim:"참기름은 오메가6가 많아 염증을 일으키는 씨앗기름이다",truth:"리놀레산이 약 41%인 것은 사실이지만, ① 한국 요리에서 쓰는 양이 1작은술 안팎으로 적고, ② 리그난·세사몰·감마토코페롤이 산화를 막아 가열·보관 중 산화물이 잘 생기지 않습니다. 신선한 리놀레산이 사람에서 염증 지표를 올린다는 근거도 약합니다. 문제가 되는 것은 산화된 기름인데, 참기름은 씨앗기름 중 산화에 가장 강한 편입니다."},{claim:"세사민 보충제를 먹으면 콜레스테롤과 간 기능이 좋아진다",truth:"세사민은 동물실험에서 콜레스테롤 흡수·합성을 줄이고 간의 지방 연소를 늘렸고, 소규모 사람 시험에서 LDL·혈압이 조금 내려간 결과가 있습니다. 하지만 시험 규모가 작고 결과가 일정하지 않아 보충제의 효과를 단정하기는 이릅니다(근거 제한적)."}]},{id:"egg",name:"달걀",en:"Egg",aliases:["계란","삶은 달걀","삶은 계란","노른자","흰자","달걀노른자","계란노른자","egg","eggs"],emoji:"🥚",category:"육류·달걀",summary:"소화가 잘되는 완전 단백질에 콜린·루테인·비타민 D·B12·셀레늄이 한 알에 고루 들어 있는 식품입니다. 달걀 한 개(노른자)에 콜레스테롤이 약 186mg 있지만, 대부분의 사람은 식이 콜레스테롤이 혈중 콜레스테롤에 미치는 영향이 작고, 하루 1개 정도는 심혈관질환 위험과 관련이 없다는 연구가 많습니다. 당뇨가 있거나 콜레스테롤 반응이 큰 사람은 노른자 개수를 조절하는 것이 좋습니다.",verdict:{tone:"good",text:"하루 1개 정도는 대부분 괜찮아요. 삶거나 찌는 조리가 가장 무난합니다."},basis:"생 달걀(전란) 100g — 껍데기를 뺀 큰 달걀 약 2개",serving:{label:"1개 (껍데기 제외 약 50g)",grams:50},nutrients:{kcal:143,carb:.72,sugar:.37,protein:12.6,fat:9.5,satFat:3.1,mufa:3.7,pufa:1.9,cholesterol:372,sodium:142,potassium:138,calcium:56,magnesium:12,iron:1.75,zinc:1.29,selenium:30.7,vitA:160,vitD:2,vitE:1.05,vitB1:.04,vitB2:.46,vitB6:.17,folate:47,vitB12:.89},compounds:[{id:"choline",amount:"약 290mg/100g (1개 약 145mg)",role:"대부분 노른자의 포스파티딜콜린 형태로, 세포막과 신경전달물질 아세틸콜린의 재료이자 간에서 지방을 VLDL로 내보내는 데 필요합니다. 콜린이 가장 많은 흔한 식품 중 하나입니다."},{id:"lutein",amount:"루테인+제아잔틴 약 0.5mg/100g (사료에 따라 차이)",role:"양은 시금치보다 훨씬 적지만 노른자의 지방과 함께 있어 흡수율이 높습니다. 사람 연구에서 달걀의 루테인이 시금치·보충제보다 혈중 농도를 효율적으로 올렸습니다."},{id:"vitamin-d",amount:"약 2μg/100g (1개 약 1μg)",role:"비타민 D가 들어 있는 흔치 않은 식품으로, 한 개로 기준치의 약 10%를 채웁니다. 노른자에 있습니다."},{id:"vitamin-b12",amount:"약 0.9μg/100g",role:"적혈구 생성과 신경 기능에 필요한 비타민으로, 한 개로 기준치의 약 20%입니다."},{id:"selenium",amount:"약 31μg/100g",role:"항산화 효소인 글루타티온 과산화효소의 구성 성분으로, 한 개로 기준치의 약 28%입니다."},{id:"saturated-fat",amount:"약 3g/100g (1개 약 1.6g)",role:"노른자 지방은 포화지방보다 불포화지방이 많고 양도 적습니다. 달걀과 함께 먹는 베이컨·소시지·버터의 포화지방이 LDL에 더 큰 영향을 줍니다."}],howToEat:[{title:"삶기·찌기·수란이 가장 무난",body:"물로 익히는 조리는 기름이 더해지지 않고, 노른자의 콜레스테롤이 고온에서 산화되는 것도 적습니다. 버터·기름에 센 불로 오래 굽거나 분말 달걀처럼 고온 가공한 제품일수록 산화 콜레스테롤(옥시스테롤)이 늘어납니다."},{title:"흰자는 익혀서",body:"날흰자의 아비딘은 비오틴(비타민 B7)과 단단히 결합해 흡수를 막습니다. 익히면 아비딘이 변성되어 이 문제가 사라집니다. 날달걀 흰자를 매일 많이 먹는 경우가 아니면 결핍까지 가지는 않습니다."},{title:"노른자까지 먹기",body:"콜린·루테인·비타민 D·B12는 대부분 노른자에 있습니다. 흰자만 먹으면 단백질은 얻지만 이런 성분은 대부분 빠집니다."},{title:"껍데기 번호 확인하고 바로 냉장",body:"껍데기의 앞 4자리는 산란일자, 마지막 숫자는 사육환경(1 방사, 2 평사, 3 개선 케이지, 4 기존 케이지)입니다. 구입 후 씻지 않은 채 바로 냉장하고, 조리 직전에 씻으세요."}],pairings:{good:["시금치·토마토 등 채소 (노른자 지방이 채소 카로티노이드 흡수를 높임)","통곡물빵·잡곡밥"],avoid:["베이컨·소시지·버터와 매일 함께 (포화지방·나트륨 누적)"]},cautions:["살모넬라 위험 때문에 임산부·영유아·노인·면역저하자는 노른자까지 완전히 익혀 먹는 것이 안전합니다. 금이 간 달걀은 쓰지 마세요.","제2형 당뇨가 있는 사람은 달걀을 많이 먹을수록 심혈관질환 위험이 높았다는 관찰연구가 있어 하루 1개 이내를 권하는 경우가 많습니다. LDL이 높다면 노른자 개수를 의료진과 상의하세요.","달걀은 영유아에게 흔한 식품 알레르기 원인 중 하나입니다(대부분 자라면서 좋아집니다)."],myths:[{claim:"달걀 노른자는 콜레스테롤 덩어리라 먹으면 혈관이 막힌다",truth:"간은 몸에 필요한 콜레스테롤 대부분을 스스로 만들고, 먹는 양이 늘면 장 흡수와 간 합성을 줄여 균형을 맞춥니다. 그래서 대부분의 사람은 식이 콜레스테롤이 LDL을 조금만 올립니다(사람마다 반응 차이가 큼). 대규모 코호트 분석에서 하루 1개 정도의 달걀은 심혈관질환 위험과 관련이 없었고, 아시아 인구에서는 약간 낮은 경향도 있었습니다. 미국심장협회도 건강한 사람은 하루 1개 정도를 포함할 수 있다고 봅니다. 다만 콜레스테롤 반응이 큰 사람과 당뇨인은 예외입니다."},{claim:"달걀의 콜린이 TMAO를 만들어 심장병을 일으킨다",truth:"콜린은 장내 세균에 의해 트리메틸아민(TMA)으로 분해되고, 간의 FMO3 효소가 이를 TMAO로 바꿉니다. TMAO가 높은 사람의 심혈관 위험이 높다는 관찰연구와 동물실험이 있지만, 사람 시험에서 달걀은 콜린 보충제(콜린염)와 달리 TMAO를 크게 올리지 않았습니다. 달걀이 TMAO를 통해 심장병을 일으킨다는 직접 근거는 없고, TMAO가 원인인지 표지자인지도 논쟁 중입니다."},{claim:"날달걀이 익힌 달걀보다 영양이 더 좋다",truth:"사람 연구에서 날달걀 단백질의 소화·흡수율은 약 50% 수준으로, 익힌 달걀(약 90%)보다 크게 낮았습니다. 날흰자의 아비딘은 비오틴 흡수를 막고 살모넬라 위험도 있어, 익혀 먹는 쪽이 영양·안전 모두에서 낫습니다."}]},{id:"beef",name:"소고기",en:"Beef",aliases:["쇠고기","한우","등심","안심","불고기","스테이크","다짐육","적색육","beef","red meat","steak"],emoji:"🥩",category:"육류·달걀",summary:'흡수율이 높은 헴철과 아연, 비타민 B12, 양질의 단백질이 풍부한 적색육입니다. 반면 포화지방이 많고, 장 속에서 헴철이 지방 산화와 N-니트로소 화합물 생성을 촉진하며, 고온 직화로 구우면 HCA·PAH가 생깁니다. IARC는 적색육을 "인체 발암 추정 물질(2A군)"로 분류했습니다. 먹는 양과 조리법이 이익과 위험을 가르는 식품입니다.',verdict:{tone:"balanced",text:"살코기 위주로 익힌 양 주 350~500g 이내, 직화보다 삶기·찜·국으로 드세요."},basis:"생 소고기 100g (USDA 다짐육 살코기 80%·지방 20% 기준 — 부위·마블링에 따라 지방 차이 큼)",serving:{label:"구이 1인분 (생고기 약 150g)",grams:150},nutrients:{kcal:254,protein:17.2,fat:20,satFat:7.6,mufa:8.9,pufa:.48,cholesterol:71,sodium:66,potassium:270,calcium:18,magnesium:17,iron:1.94,zinc:4.18,selenium:15,vitB12:2.14},compounds:[{id:"heme-iron",amount:"철 약 2mg/100g 중 절반 안팎이 헴철",role:"헴철은 흡수율이 15~35%로 식물성 비헴철(약 2~20%)보다 훨씬 높아 철 결핍 예방에 효과적입니다. 반면 장 속에 남은 헴은 지방 산화와 N-니트로소 화합물 생성을 촉진하는 촉매로 작용해, 적색육과 대장암을 잇는 주요 경로로 지목됩니다."},{id:"vitamin-b12",amount:"약 2μg/100g",role:"1인분(150g)으로 하루 기준치를 넘깁니다. 동물성 식품에만 있는 비타민입니다."},{id:"zinc",amount:"약 4mg/100g",role:"1인분으로 기준치의 약 70%를 채웁니다. 동물성 아연은 피트산의 방해를 받지 않아 흡수가 잘 됩니다."},{id:"saturated-fat",amount:"약 7.6g/100g (살코기 부위는 훨씬 적고, 마블링이 많을수록 증가)",role:"소 지방의 약 40%가 포화지방(팔미트산·스테아르산)입니다. 마블링이 많은 부위일수록 LDL을 올리는 포화지방 섭취가 늘어납니다."},{id:"heat-byproducts",amount:"직화·고온 구이, 바싹 익힐수록 증가",role:"근육 속 크레아틴·아미노산·당이 150℃ 이상에서 반응해 HCA가 생기고, 기름이 불에 떨어져 생긴 연기에서 PAH가 고기에 붙습니다. 간의 CYP1A2 효소가 이들을 활성화하면 DNA에 달라붙을 수 있습니다."},{id:"oleic-acid",amount:"소 지방의 약 40~45%",role:"소 지방에서 가장 많은 단일 지방산은 올레산입니다. 한우처럼 마블링이 많은 고기는 올레산 비율이 높지만, 지방 총량이 늘면서 포화지방의 절대량도 함께 늘어납니다."},{id:"selenium",amount:"약 15μg/100g",role:"항산화 효소인 글루타티온 과산화효소의 재료가 됩니다."}],howToEat:[{title:"삶기·찜·국·수육 위주로",body:"물로 익히는 조리는 온도가 100℃ 안팎이라 HCA·PAH가 거의 생기지 않습니다. 소고기뭇국, 수육, 찜은 적색육을 먹는 방법 중 부산물이 가장 적은 편입니다."},{title:"구울 때는 자주 뒤집고 탄 부분은 잘라내기",body:"자주 뒤집으면 표면 온도가 덜 올라가 HCA가 줄어듭니다. 숯불 직화는 떨어진 기름이 타면서 PAH 연기가 생기므로 불과 거리를 두고, 검게 탄 부분은 먹지 마세요. 전자레인지로 살짝 먼저 익히면 HCA 전구물질이 육즙으로 빠져나가 생성량이 줄어듭니다."},{title:"양념에 재워 굽기",body:"마늘·양파·허브(로즈메리 등)가 든 양념에 재우면 굽는 동안 HCA 생성이 줄었다는 실험 연구들이 있습니다. 다만 설탕이 많은 불고기 양념은 쉽게 타므로 불을 세게 하지 마세요."},{title:"살코기 부위, 채소와 함께 1인분 100~150g",body:"안심·홍두깨·우둔 같은 살코기 부위는 포화지방이 적습니다. 채소를 곁들여 고기 양을 줄이면 세계암연구기금(WCRF) 권고인 익힌 적색육 주 350~500g 이내를 맞추기 쉽습니다."}],pairings:{good:["쌈채소·나물 (식이섬유, 고기 양 조절)",'시금치·콩·잡곡 (고기의 "육류 인자"가 식물성 비헴철 흡수를 높임)',"마늘·양파 양념"],avoid:["숯불 직화로 탄 부위","가공육과 함께 매일"]},cautions:["통풍이 있다면 적색육의 퓨린이 요산을 올릴 수 있어 양을 조절하세요.","혈색소증(철 과부하)이 있다면 헴철이 많은 적색육을 줄여야 합니다.","만성 신장질환으로 단백질·인·칼륨을 제한 중이라면 1회 양을 의료진과 정하세요.","다짐육·햄버거 패티는 속까지 완전히 익혀 드세요(장출혈성대장균 위험)."],myths:[{claim:"적색육은 IARC 발암물질이라 담배처럼 위험하다",truth:'IARC 분류는 "발암성 근거가 얼마나 확실한가"를 나타낼 뿐 위험의 크기를 뜻하지 않습니다. 적색육(2A군)은 매일 100g을 더 먹을 때 대장암 위험이 약 17% 높아지는 수준으로 추정되며, 흡연자의 폐암 위험(수십 배)과는 규모가 전혀 다릅니다. 경로로는 ① 장 속 헴철이 지방 산화(알데하이드)와 N-니트로소 화합물 생성을 촉진해 대장 상피를 자극하고, ② 고온 조리 시 HCA·PAH가 생기는 것이 주로 거론됩니다. 적당량을 삶거나 찌는 조리로 먹는 것은 합리적인 선택입니다.'},{claim:"마블링 좋은 한우는 올레산이 많아 몸에 좋은 지방이다",truth:"한우 지방은 올레산 비율이 높은 편인 것이 맞습니다. 하지만 마블링이 많을수록 지방 총량이 크게 늘어 포화지방의 절대량도 함께 늘어납니다. 올레산 비율이 높다고 해서 올리브유처럼 LDL을 낮추는 효과를 기대하기는 어렵습니다."},{claim:"소고기의 카르니틴이 TMAO를 만들어 동맥경화를 일으킨다",truth:"적색육의 L-카르니틴은 장내 세균에 의해 트리메틸아민(TMA)으로 바뀌고, 간의 FMO3 효소가 이를 TMAO로 만듭니다. 쥐에서 TMAO가 동맥경화를 촉진했고, 사람 시험에서도 적색육 위주 식단을 한 달 먹으면 TMAO가 올라갔다가 끊으면 다시 내려갔습니다. 다만 TMAO가 원인인지 표지자일 뿐인지는 아직 논쟁 중이며, 적색육의 심혈관 영향 중 가장 확실한 것은 포화지방을 통한 LDL 상승입니다."}]},{id:"pork-belly",name:"삼겹살",en:"Pork belly",aliases:["오겹살","대패삼겹살","돼지고기","돼지 삼겹살","수육","보쌈","pork belly","pork"],emoji:"🥓",category:"육류·달걀",summary:"살코기와 지방이 층층이 겹친 돼지 뱃살로, 돼지고기 부위 중 지방이 가장 많습니다. 돼지 지방은 올레산(단일불포화지방)이 가장 많지만 포화지방도 3분의 1이 넘고, 돼지고기 특유의 비타민 B1(티아민)이 들어 있습니다. 한국식 불판·숯불 구이에서는 기름이 타며 생기는 PAH, 고온에서 생기는 HCA, 산화된 지방 연기가 문제이고, 수육·보쌈처럼 삶으면 이런 부산물이 거의 생기지 않습니다.",verdict:{tone:"caution",text:"가끔 즐기되 삶거나(수육), 구울 때는 기름을 빼고 탄 부분은 버리고 채소 쌈과 함께."},basis:"생 돼지 삼겹살 100g (USDA 돼지 뱃살 기준 — 지방층이 두꺼운 기준이라 한국 시판 삼겹살은 대개 이보다 지방이 적고, 살코기 비율에 따라 크게 다름)",serving:{label:"1인분 (생고기 약 150g)",grams:150},nutrients:{kcal:518,protein:9.3,fat:53,satFat:19.3,mufa:24.7,pufa:5.7,cholesterol:72,sodium:32,potassium:185,iron:.52,zinc:1.02,vitB1:.4},compounds:[{id:"saturated-fat",amount:"약 19g/100g (1인분 150g에 약 29g)",role:"이 기준으로 1인분이면 포화지방 하루 기준치(15g)의 약 2배입니다(구우며 빠지는 기름만큼 실제 섭취는 줄어듦). 포화지방은 간의 LDL 수용체를 줄여 LDL을 올립니다."},{id:"oleic-acid",amount:"약 23g/100g (돼지 지방의 약 45%)",role:"돼지 지방에서 가장 많은 지방산입니다. 포화지방만 있는 것은 아니지만 지방 총량이 워낙 많아 포화지방 섭취도 함께 많아집니다."},{id:"heat-byproducts",amount:"숯불·직화·바싹 굽기에서 증가",role:"떨어진 기름이 숯·불꽃에 타면서 벤조피렌 같은 PAH가 연기로 고기에 달라붙고, 뜨거운 표면에서는 HCA가 생깁니다. 삼겹살은 불에 떨어지는 기름이 많아 PAH가 생기기 쉬운 고기입니다."},{id:"oxidized-lipids",amount:"불판에 고인 기름을 오래 가열할수록 증가",role:"불판에 고인 돼지기름을 계속 가열하면 산화 알데하이드가 늘고, 그 기름에 김치·마늘·밥을 볶아 먹으면 산화물도 함께 먹게 됩니다. 구이 연기(조리흄)에도 알데하이드와 초미세먼지가 들어 있습니다."},{id:"linoleic-acid",amount:"약 5g/100g (사료에 따라 차이)",role:"돼지는 사료의 지방산이 거의 그대로 지방에 쌓이는 동물이라, 옥수수·대두박 사료를 먹은 돼지 지방에는 리놀레산이 소고기보다 많습니다. 그만큼 소 지방보다 가열 산화에 약합니다."}],howToEat:[{title:"수육·보쌈으로 삶아 먹기",body:"물에 삶으면 100℃ 안팎이라 HCA·PAH가 거의 생기지 않고, 지방 일부가 국물로 빠집니다. 된장·월계수잎·양파를 넣으면 잡내도 줄어듭니다. 삶은 물 위에 뜬 기름은 걷어내세요."},{title:"기름이 빠지는 불판에서, 불꽃에 닿지 않게",body:"기울어진 불판이나 홈이 있는 팬으로 기름을 빼면 지방 섭취가 줄고, 기름이 타며 생기는 연기도 줄어듭니다. 숯불 직화는 기름이 불에 떨어져 PAH가 생기므로 불과 거리를 두세요."},{title:"탄 부분은 잘라내고 겉을 태우지 않기",body:"검게 탄 부분에는 HCA·PAH가 몰려 있습니다. 돼지고기는 속까지 충분히 익혀야 하지만 겉을 태울 정도로 굽지 마세요. 고인 기름에 김치·마늘을 오래 굽는 것도 줄이는 편이 좋습니다."},{title:"쌈채소·마늘·김치와 함께",body:"상추·깻잎 같은 쌈채소는 식이섬유와 폴리페놀을 보태고, 쌈으로 싸 먹으면 고기 양이 자연스럽게 줄어듭니다. 채소 폴리페놀이 식사 중 지방 산화를 줄일 수 있다는 실험 연구도 있지만, 탄 고기를 무해하게 만들 정도는 아닙니다."},{title:"실내에서 구울 때는 환기",body:"밀폐된 실내에서 고기를 구우면 초미세먼지와 알데하이드 농도가 크게 올라갑니다. 레인지 후드를 켜고 창문을 열어 두세요."}],pairings:{good:["상추·깻잎 쌈 (식이섬유·폴리페놀, 고기 양 조절)","마늘·양파","김치·나물 반찬"],avoid:["불판에 고인 기름에 볶음밥·김치를 오래 굽기","술과 함께 과식"]},cautions:["돼지고기는 속까지 완전히 익혀 드세요(기생충, E형 간염 바이러스 등).","돼지고기도 IARC가 2A군으로 분류한 적색육에 포함됩니다. LDL이 높거나 지방간이 있다면 구이 삼겹살은 가끔으로 제한하고 안심·뒷다리살 같은 살코기 부위를 활용하세요.","소금장·쌈장을 많이 찍으면 나트륨 섭취가 크게 늘어납니다."],myths:[{claim:"삼겹살 기름이 목에 낀 미세먼지·황사를 씻어낸다",truth:"먹은 음식은 식도로 내려가고, 미세먼지가 들어가는 곳은 기도와 폐입니다. 돼지기름이 호흡기의 먼지를 씻어낸다는 근거는 없습니다. 오히려 실내에서 고기를 구울 때 나오는 연기가 초미세먼지를 크게 늘립니다. 미세먼지가 심한 날에는 물을 충분히 마시고 외출 후 손·얼굴을 씻는 것이 실제로 도움이 됩니다."},{claim:"삼겹살 지방은 불포화지방이 많아 괜찮은 지방이다",truth:'돼지 지방에 올레산 같은 단일불포화지방이 가장 많은 것은 사실이지만, 포화지방도 약 36%라 1인분만으로 포화지방이 하루 기준치를 넘기기 쉽습니다. "좋은 지방도 있다"보다 "지방 총량이 매우 많다"가 더 중요한 사실입니다.'}]},{id:"processed-meat",name:"가공육 (햄·소시지·베이컨)",en:"Processed meat (ham, sausage, bacon)",aliases:["가공육","햄","소시지","베이컨","비엔나소시지","캔햄","런천미트","핫도그","살라미","육포","아질산나트륨","발색제","processed meat","ham","sausage","bacon"],emoji:"🌭",category:"육류·달걀",summary:'소금·아질산염으로 염지하거나 훈연·발효해 만든 고기로, IARC가 대장암에 대해 "인체 발암 물질(1군)"로 분류했습니다. 하루 50g(소시지 2~3개)을 더 먹을 때마다 대장암 위험이 약 18% 높아지는 것으로 추정됩니다. 주요 경로로는 아질산염에서 생기는 N-니트로소 화합물, 헴철, 고온 조리 부산물이 꼽히며, 나트륨과 포화지방도 많아 심혈관질환·당뇨 위험과도 관련됩니다.',verdict:{tone:"limit",text:"가능한 한 적게. 먹는다면 가끔, 데쳐서, 채소와 함께. 매일 먹는 반찬·도시락 습관은 줄이세요."},basis:"비엔나·프랑크 소시지(돼지·소 혼합) 100g 대략값 — 제품마다 차이 큼 (슬라이스 햄은 지방이 적고, 베이컨은 지방이 훨씬 많음)",serving:{label:"소시지 2~3개 또는 햄 3~4장 (약 50g)",grams:50},nutrients:{kcal:300,carb:3,protein:11,fat:27,satFat:10,sodium:1e3},compounds:[{id:"nitrosamine",amount:"발색제 아질산나트륨 사용 기준: 식육가공품 0.07g/kg 이하(아질산 이온 기준)",role:"아질산염이 고기의 아민과 만나 위 속이나 고온 조리 중(특히 베이컨을 바삭하게 구울 때) N-니트로소 화합물을 만듭니다. 이들은 간의 CYP2E1 같은 효소로 활성화되어 DNA에 알킬기를 붙이는 발암 물질입니다."},{id:"heme-iron",amount:"원료육 유래, 염지육은 니트로실 헴 형태",role:"가공육의 분홍색은 아질산염이 헴과 결합한 니트로실 헴 때문입니다. 니트로실 헴은 장 속에서 N-니트로소 화합물 생성과 지질 과산화를 촉진해, 동물실험에서 대장 점막 손상과 전암 병변을 늘렸습니다."},{id:"sodium",amount:"약 1,000mg/100g (제품에 따라 차이 큼)",role:"소시지 2~3개(50g)에 나트륨 약 500mg으로 하루 기준치의 약 4분의 1입니다. 혈압을 올리고, 가공육과 심혈관질환의 연관을 설명하는 요인 중 하나로 꼽힙니다."},{id:"saturated-fat",amount:"약 10g/100g (제품에 따라 차이)",role:"소시지·베이컨은 지방 함량이 높아 포화지방 섭취를 늘립니다."},{id:"heat-byproducts",amount:"굽거나 튀길 때 증가, 훈연 제품에는 PAH",role:"소시지·베이컨을 팬에 바삭하게 굽거나 튀기면 HCA와 산화 부산물이 늘고, 훈연 제품에는 연기 속 PAH가 남아 있을 수 있습니다."}],howToEat:[{title:"끓는 물에 데친 뒤 조리하기",body:'칼집을 내 끓는 물에 1~2분 데치면 표면의 기름과 나트륨, 아질산염 일부가 물로 빠져나갑니다. 줄어드는 양은 제한적이라 "안전하게 만드는 방법"이 아니라 "부담을 조금 줄이는 방법"입니다.'},{title:"바삭하게 굽거나 튀기지 않기",body:"베이컨처럼 아질산염이 든 고기를 고온에서 바삭하게 구우면 N-니트로소피롤리딘 같은 니트로사민이 늘어납니다. 약한 불에서 익히거나 전자레인지로 조리하면 팬 튀김보다 니트로사민이 적었다는 연구가 있습니다."},{title:"채소·과일과 함께",body:"비타민 C와 폴리페놀은 위 속에서 아질산염이 니트로사민으로 바뀌는 반응을 방해합니다. 그래서 제조할 때도 비타민 C 유도체(아스코르빈산·에리토르빈산나트륨)를 함께 넣습니다. 부대찌개·도시락이라도 채소를 늘리세요."},{title:"양과 빈도를 정해 두기",body:'세계암연구기금(WCRF)은 가공육을 "먹더라도 아주 적게" 먹으라고 권합니다. 매일 먹는 반찬이 아니라 가끔 먹는 음식으로 두는 것이 가장 효과적인 방법입니다.'}],pairings:{good:["채소 반찬·과일 (비타민 C·폴리페놀이 위 속 니트로사민 생성 억제)","잡곡밥·통곡물 (식이섬유)"],avoid:["라면·부대찌개 국물 (나트륨 중복)","바삭하게 튀기거나 굽기"]},cautions:["고혈압·심부전·만성 신장질환이 있다면 가공육의 나트륨이 특히 부담이 됩니다.","임산부는 조리 없이 먹는 햄·살라미 같은 제품을 피하고 충분히 가열해 드세요(리스테리아 위험).","영유아 이유식·어린이 간식으로 자주 쓰지 않는 것이 좋습니다(나트륨·아질산염)."],myths:[{claim:"가공육은 담배와 같은 1군 발암물질이니 담배만큼 해롭다",truth:'IARC 1군은 "사람에게 암을 일으킨다는 근거가 확실하다"는 뜻이지 위험의 크기가 같다는 뜻이 아닙니다. 가공육은 하루 50g당 대장암 위험이 약 18% 높아지는 수준(상대위험)으로 흡연의 폐암 위험보다 훨씬 작습니다. 다만 근거가 확실하므로 적게 먹는 것이 권장됩니다. 한국인 평균 섭취량은 서구보다 적은 편이지만, 매일 먹는 사람의 위험은 평균과 다릅니다.'},{claim:'"아질산나트륨 무첨가" 햄은 안전하다',truth:'"무첨가" 제품 상당수는 셀러리·채소 분말처럼 질산염이 많은 원료를 넣어 발효 과정에서 아질산염이 생기게 하므로, 결과적으로 아질산염이 들어 있을 수 있습니다. 또 헴철·나트륨·고온 조리 부산물은 아질산염과 상관없이 남습니다. 무첨가 표시보다 먹는 양과 빈도가 더 중요합니다.'},{claim:"아질산염은 무조건 독이다",truth:"아질산염은 보툴리누스균 증식을 막는 중요한 보존 역할을 합니다. 채소의 질산염도 몸속에서 아질산염으로 바뀌어 혈관을 넓히는 산화질소의 재료가 됩니다. 문제는 아질산염이 고기의 아민·헴과 만나 니트로소 화합물을 만드는 조건(고기, 고온, 비타민 C 부족)에 있습니다."}]},{id:"salmon",name:"연어",en:"Salmon",aliases:["생연어","연어회","연어초밥","훈제연어","연어스테이크","노르웨이연어","salmon","atlantic salmon"],emoji:"🍣",category:"해산물·해조류",summary:"오메가3 EPA·DHA가 풍부한 대표 생선으로, 양식 대서양연어 100g에 약 2g이 들어 있습니다. EPA·DHA는 세포막에 들어가 염증 매개물질을 덜 만들게 하고, 염증을 끝내는 물질(레졸빈 등)의 재료가 됩니다. 비타민 D·B12·셀레늄과 붉은색을 내는 아스타잔틴도 들어 있으며, 수은은 낮은 편입니다.",verdict:{tone:"good",text:"주 1~2회 생선 섭취에 넣기 좋아요. 굽기·찜·오븐이 튀김보다 오메가3를 잘 지킵니다."},basis:"생 양식 대서양연어 100g (자연산은 지방이 적고 비타민 D·아스타잔틴이 더 많은 편)",serving:{label:"1토막 (약 100g)",grams:100},nutrients:{kcal:208,protein:20.4,fat:13.4,satFat:3.05,mufa:3.77,pufa:3.89,epaDha:1970,cholesterol:55,sodium:59,potassium:363,selenium:24,vitB12:3.23},compounds:[{id:"epa-dha",amount:"약 2g/100g (EPA 약 0.9g + DHA 약 1.1g)",role:"한 토막으로 EPA+DHA 기준치(330mg)의 약 6배입니다. 세포막 인지질에서 아라키돈산 자리를 일부 대신해 프로스타글란딘E2·류코트리엔B4 같은 염증 매개물질을 줄이고, 염증을 끝내는 레졸빈·프로텍틴을 만들며, 간에서 중성지방 합성을 줄입니다."},{id:"vitamin-d",amount:"익힌 양식 대서양연어 85g에 약 13μg (NIH ODS), 사료·자연산 여부에 따라 편차 큼",role:"비타민 D가 식품으로 의미 있게 들어 있는 몇 안 되는 식품입니다. 칼슘 흡수와 뼈·근육·면역 기능에 관여합니다."},{id:"astaxanthin",amount:"양식 약 0.5~1mg/100g, 자연산 홍연어는 수 mg/100g",role:"연어 살의 붉은색을 내는 카로티노이드로, 세포막을 가로질러 박혀 지질 과산화를 막습니다. 양식 연어는 사료에 아스타잔틴을 넣어 색을 냅니다. 식품으로 먹는 양에서 사람에게 뚜렷한 효과가 있는지는 근거가 제한적입니다."},{id:"selenium",amount:"약 24μg/100g",role:"한 토막으로 기준치의 약 45%입니다. 글루타티온 과산화효소의 재료이며, 생선 속 수은과 결합해 독성을 줄이는 역할도 제안됩니다."},{id:"vitamin-b12",amount:"약 3μg/100g",role:"한 토막으로 하루 기준치를 넘깁니다."},{id:"methylmercury",amount:"낮은 편 (평균 약 0.02ppm 수준)",role:'먹이사슬 아래쪽에서 비교적 짧게 사는 어종이라 수은이 적어, 미국 FDA·EPA의 "가장 좋은 선택" 목록에 들어 있습니다. 임산부도 주 2~3회 먹을 수 있는 어종입니다.'}],howToEat:[{title:"굽기·찜·오븐·에어프라이어로",body:"EPA·DHA는 일반적인 굽기·찜에서 대부분 유지됩니다. 기름에 튀기면 연어 지방이 튀김기름으로 빠져나가고 오메가6 기름이 대신 스며들어, 오메가3 이점이 줄어듭니다."},{title:"회·초밥은 신선도와 냉동 여부 확인",body:"사료로 기르는 양식 대서양연어는 고래회충(아니사키스) 위험이 매우 낮지만, 자연산 연어는 날로 먹기 전에 영하 20℃ 이하에서 7일 이상 냉동하는 것이 안전합니다."},{title:"비린내가 나면 산화된 것",body:"EPA·DHA는 이중결합이 5~6개라 공기와 빛에 매우 빨리 산화됩니다. 냉장으로 1~2일 안에 먹고, 오래 둘 거면 바로 냉동하세요. 비린내가 강해진 연어는 산화 지질이 늘어난 상태입니다."},{title:"훈제연어는 소금과 보관 조건 확인",body:"훈제연어는 소금에 절여 생연어보다 나트륨이 훨씬 많고, 가열하지 않는 냉훈제 제품은 리스테리아 위험이 있어 임산부는 피하는 것이 좋습니다."}],pairings:{good:["채소·통곡물 (지중해식 조합)","레몬·허브 (소금 대신 풍미)"],avoid:["튀김옷·마요네즈 소스를 매번 곁들이기 (열량↑, 오메가3 이점 희석)"]},cautions:["와파린 같은 항응고제를 복용 중이어도 생선으로 먹는 양은 대개 문제없지만, 오메가3 보충제를 고용량으로 추가할 때는 의사와 상의하세요.","임산부는 날것·냉훈제 연어를 피하고 익혀 드세요."],myths:[{claim:"양식 연어는 색소와 오염물질 범벅이라 먹으면 안 된다",truth:"양식 연어의 붉은색은 사료에 넣는 아스타잔틴으로, 자연에서 연어가 먹는 새우·크릴의 색소와 같은 성분입니다. 양식 연어는 자연산보다 오메가6가 많고, 사료의 어유 비중이 줄면서 과거보다 EPA·DHA가 줄었다는 보고도 있지만, 여전히 100g당 EPA+DHA가 1~2g 수준으로 풍부합니다. 과거 문제된 PCB·다이옥신 같은 잔류 오염물질도 기준 이하로 관리되며, 전문가 평가는 대체로 섭취 이득이 위험보다 크다는 쪽입니다."},{claim:"오메가3 보충제를 먹으면 생선을 안 먹어도 된다",truth:"생선 섭취는 심장질환 사망 감소와 꾸준히 연관되지만, 오메가3 보충제의 대규모 시험 결과는 엇갈립니다. 고용량 정제 EPA는 일부 고위험군에서 효과가 있었지만, 일반 용량 보충제는 대체로 효과가 뚜렷하지 않았습니다. 생선에는 비타민 D·셀레늄·단백질이 함께 있고, 포화지방이 많은 음식을 대신하는 효과도 있습니다."}]},{id:"mackerel",name:"고등어",en:"Mackerel",aliases:["고등어구이","고등어조림","자반고등어","간고등어","노르웨이고등어","고갈비","등푸른생선","mackerel"],emoji:"🐟",category:"해산물·해조류",summary:"한국인이 가장 흔히 먹는 등푸른생선으로, EPA·DHA가 100g당 약 2g 이상이고 비타민 D·B12·셀레늄이 풍부합니다. 오메가3가 많은 만큼 신선도가 떨어지거나 센 불에 오래 구우면 지방이 쉽게 산화되고, 상온에 둔 고등어는 세균이 만든 히스타민으로 식중독(스콤브로이드)을 일으킬 수 있어 신선도 관리가 핵심입니다. 수은은 낮은 편입니다.",verdict:{tone:"good",text:"주 1~2회 먹기 좋은 생선. 신선한 것을 굽거나 조리고, 자반고등어는 소금을 고려하세요."},basis:"생 고등어(대서양) 100g — 계절·크기에 따라 지방 함량 차이가 큼(가을~겨울에 기름이 많음)",serving:{label:"구이 1토막 (생선 약 100g)",grams:100},nutrients:{kcal:205,protein:18.6,fat:13.9,satFat:3.26,mufa:5.46,pufa:3.35,epaDha:2300,cholesterol:70,sodium:90,potassium:314,magnesium:76,iron:1.63,selenium:44.1,vitD:16.1,vitB12:8.71},compounds:[{id:"epa-dha",amount:"약 2.3g/100g (EPA 약 0.9g + DHA 약 1.4g)",role:"한 토막으로 EPA+DHA 기준치의 약 7배입니다. 간에서 중성지방 합성을 줄이고, 세포막에서 아라키돈산과 경쟁해 염증 매개물질 생성을 줄이며, 염증을 끝내는 레졸빈의 재료가 됩니다."},{id:"vitamin-d",amount:"약 16μg/100g",role:"한 토막으로 기준치(10μg)를 넘깁니다. 비타민 D를 식품으로 채우기 가장 쉬운 생선 중 하나입니다."},{id:"vitamin-b12",amount:"약 8.7μg/100g",role:"기준치의 3배가 넘습니다. 적혈구 생성과 신경 기능, 호모시스테인 대사에 필요합니다."},{id:"selenium",amount:"약 44μg/100g",role:"기준치의 약 80%로, 글루타티온 과산화효소 같은 항산화 효소의 재료입니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 상온 보관·센 불에 오래 굽기·재가열 시 증가",role:"EPA·DHA는 이중결합이 5~6개라 리놀레산보다 훨씬 빨리 산화됩니다. 비린내가 강해지는 것은 산화가 진행된 신호이고, 센 불에 오래 구우면 오메가3 일부가 산화되어 사라집니다."},{id:"methylmercury",amount:"대서양·태평양 고등어는 낮은 편",role:'한국에서 주로 먹는 고등어(대서양·태평양산)는 수은이 낮아 미국 FDA·EPA의 "가장 좋은 선택"에 들어갑니다. 이름이 비슷한 대형 어종 킹매커럴(king mackerel)은 수은이 높아 따로 구분됩니다.'},{id:"sodium",amount:"생물 약 90mg/100g, 자반·간고등어는 소금 간으로 크게 증가",role:"생고등어 자체는 나트륨이 적지만, 소금에 절인 자반·간고등어는 한 토막으로 나트륨 섭취가 크게 늘어납니다."}],howToEat:[{title:"조림·찜, 또는 중불에 짧게 굽기",body:"센 불에 오래 구우면 기름이 튀고 타면서 산화 지질과 조리 연기가 많이 생깁니다. 오븐·에어프라이어·그릴 팬에서 중불로 굽거나, 무·김치를 넣은 조림·찜으로 하면 산화가 덜하고 연기도 적습니다."},{title:"구울 때 환기는 필수",body:"생선을 기름에 구우면 초미세먼지와 알데하이드가 연기로 퍼집니다. 레인지 후드를 켜고 창문을 열어 두세요."},{title:"사자마자 냉장·냉동",body:"고등어를 상온에 두면 세균이 살 속 히스티딘을 히스타민으로 바꿉니다. 히스타민은 굽거나 끓여도 파괴되지 않으므로, 산 뒤 바로 냉장·냉동하고 눈이 흐리거나 살이 물러진 것은 피하세요."},{title:"자반고등어는 물에 담가 소금기 빼기",body:"간고등어·자반고등어는 소금에 절여 나트륨이 많습니다. 조리 전에 쌀뜨물이나 물에 잠시 담그면 표면의 소금이 일부 빠집니다."}],pairings:{good:["무·김치를 넣은 조림 (채소와 함께 조리)","레몬·무즙 (비린내 완화)","채소 반찬·잡곡밥"],avoid:["자반고등어 + 짠 찌개 (나트륨 중복)"]},cautions:["먹은 뒤 몇 분~1시간 안에 얼굴이 붉어지고 두통·두드러기·입안이 얼얼한 느낌이 나면 히스타민 식중독(스콤브로이드)일 수 있습니다. 증상이 알레르기와 비슷하며, 호흡곤란이 있으면 즉시 진료를 받으세요.","결핵약 이소니아지드를 복용 중이면 히스타민 분해가 억제되어, 등푸른생선을 먹고 얼굴 붉어짐·두통 같은 히스타민 반응이 생기기 쉽습니다.","고등어는 식품 알레르기 표시 대상 식품입니다. 생선 알레르기가 있다면 주의하세요."],myths:[{claim:"고등어를 구우면 미세먼지가 나오니 고등어가 미세먼지 주범이다",truth:"2016년 환경부가 밀폐된 주방에서 고등어를 구울 때 초미세먼지 농도가 크게 치솟는다는 측정 결과를 발표하면서 퍼진 이야기입니다. 이는 고등어 자체의 문제가 아니라 기름진 재료를 팬에 굽거나 튀기는 조리 방식과 환기 부족의 문제로, 삼겹살 구이나 전 부치기에서도 비슷하게 나타납니다. 대기 미세먼지의 원인과는 별개이며, 조리 중 후드·창문 환기로 크게 줄일 수 있습니다."},{claim:"생선의 오메가3는 굽기만 해도 다 파괴된다",truth:"일반적인 굽기·조림·찜에서 EPA·DHA는 상당 부분 남습니다. 손실이 큰 것은 기름에 튀길 때(생선 기름이 튀김기름으로 빠져나감)와 센 불에서 태우듯 오래 구울 때입니다."}]}],Ne=[{id:"tuna",name:"참치",en:"Tuna",aliases:["참치캔","참치통조림","참치회","참다랑어","눈다랑어","황다랑어","가다랑어","다랑어","살코기참치","참치뱃살","오도로","tuna","bluefin tuna","skipjack"],emoji:"🐟",category:"해산물·해조류",summary:"단백질·셀레늄·비타민 D·B12가 풍부한 붉은살 생선입니다. 오메가3(EPA·DHA)는 회로 먹는 참다랑어, 특히 뱃살에 많고 통조림에는 적은 편입니다. 먹이사슬 꼭대기의 대형 어종이라 메틸수은이 쌓이는 것이 핵심 주의점으로, 대형 참다랑어·눈다랑어 회 > 황다랑어 > 통조림용 가다랑어 순으로 많습니다.",verdict:{tone:"balanced",text:"통조림(가다랑어)은 주 2~3회 무난하고, 대형 참치회는 가끔. 임산부·어린이는 식약처 권고량을 지키세요."},basis:"생 참다랑어 100g (회, 부위에 따라 지방 편차 큼)",serving:{label:"회 한 접시 (약 100g)",grams:100},nutrients:{kcal:144,carb:0,protein:23.3,fat:4.9,satFat:1.26,mufa:1.6,pufa:1.43,epaDha:1170,cholesterol:38,sodium:39,potassium:252,calcium:8,magnesium:50,iron:1.02,zinc:.6,selenium:36.5,vitA:655,vitD:5.7,vitB1:.24,vitB2:.25,vitB6:.46,folate:2,vitB12:9.4},compounds:[{id:"epa-dha",amount:"생 참다랑어 약 1.2g/100g, 물에 담근 통조림은 약 0.2g/100g",role:"세포막에 들어가 염증을 가라앉히는 매개체(레졸빈 등)의 재료가 되고 간의 중성지방 합성을 줄입니다. 기름진 뱃살일수록 많고, 통조림용 가다랑어는 기름기가 적어 훨씬 적습니다."},{id:"methylmercury",amount:"통조림용 가다랑어 평균 약 0.1mg/kg, 눈다랑어 평균 약 0.7mg/kg (미국 FDA 조사), 국내 다랑어류 기준 1.0mg/kg 이하",role:"플랑크톤 → 작은 물고기 → 대형 어종으로 올라가며 농축됩니다. 근육 단백질의 시스테인에 결합해 있어 굽거나 끓여도 줄지 않고, 태아·영유아의 신경 발달이 가장 민감합니다."},{id:"selenium",amount:"약 37μg/100g (통조림은 약 70~80μg/100g)",role:"글루타티온 과산화효소 같은 항산화 효소의 재료입니다. 셀레늄이 수은과 결합해 독성을 일부 완화한다는 가설(셀레늄-수은 비율)이 있지만, 사람에서 보호 효과가 확정되지는 않았습니다."},{id:"vitamin-d",amount:"약 5.7μg/100g (통조림은 약 1μg/100g)",role:"생선 중에서도 많은 편으로, 회 한 접시에 기준치(10μg)의 절반 이상을 채웁니다."},{id:"vitamin-b12",amount:"약 9.4μg/100g",role:"한 접시로 하루 기준치의 약 4배를 채우며, 적혈구 생성과 신경 수초 유지에 쓰입니다."},{id:"heme-iron",amount:"철 약 1mg/100g (상당 부분이 헴철)",role:"붉은 살색을 내는 미오글로빈의 헴철로, 식물성 비헴철보다 흡수가 잘 됩니다."}],howToEat:[{title:'통조림은 "살코기(가다랑어)" 위주로',body:"가다랑어는 몸집이 작고 수명이 짧아 수은이 적습니다. 흰살 참치(날개다랑어) 통조림은 가다랑어의 약 3배, 눈다랑어·참다랑어는 5배 이상입니다."},{title:"기름 담금 통조림은 기름을 따라 버리기",body:"통조림 기름은 대개 대두유·카놀라유 같은 식물성 기름이라 열량과 오메가6를 더합니다. 체에 밭쳐 기름을 빼면 열량이 크게 줄지만, 기름에 녹아 나온 오메가3 일부도 함께 빠집니다."},{title:"대형 참치회는 가끔 한 접시",body:"참다랑어·눈다랑어 회는 EPA·DHA가 많지만 수은도 많습니다. 자주 먹는다면 주 1회 정도로 하고, 오메가3는 고등어·연어·정어리처럼 수은이 적은 기름진 생선으로 채우는 편이 유리합니다."},{title:"수은은 조리로 줄지 않는다",body:"굽기·끓이기·통조림 가공 모두 메틸수은을 없애지 못합니다. 어종과 먹는 양으로 조절하는 것이 유일한 방법입니다."},{title:"참치마요·참치찌개는 곁들이는 재료를 확인",body:"마요네즈는 열량·오메가6를, 김치찌개 국물은 나트륨을 크게 더합니다. 채소와 비빔밥·샐러드로 먹으면 부담이 적습니다."}],pairings:{good:["현미밥·채소 비빔 (단백질과 섬유의 균형)","레몬·채소 샐러드"],avoid:["마요네즈 듬뿍 (열량·오메가6 증가)"]},cautions:["임신부·수유부: 식약처 권고는 일반 어류·참치통조림 주 400g 이하, 다랑어·새치류·상어류(참치회 포함)는 주 100g 이하입니다. 어린이는 연령별로 더 적은 양이 권고됩니다.","참치·고등어 같은 붉은살 생선을 상온에 두면 세균이 히스티딘을 히스타민으로 바꿔, 먹은 뒤 얼굴 붉어짐·두드러기·두통이 생길 수 있습니다(히스타민 식중독). 히스타민은 가열해도 없어지지 않으니 냉장·냉동 유통된 것을 드세요.","통조림은 생선보다 나트륨이 많습니다. 나트륨 제한 중이면 저염 제품을 고르세요."],myths:[{claim:"참치캔은 수은 덩어리라 먹으면 안 된다",truth:"통조림용 가다랑어의 수은은 평균 약 0.1mg/kg으로 생선 중 중간 이하입니다. 일반 성인이 주 2~3회 먹는 것은 문제될 가능성이 낮고, 임산부도 식약처 권고량(주 400g) 안에서 먹을 수 있습니다. 수은이 많은 것은 대형 참다랑어·눈다랑어 회와 흰살 참치입니다."},{claim:"참치캔만 먹어도 오메가3는 충분하다",truth:"통조림용 가다랑어는 기름기가 적어 EPA+DHA가 100g당 약 0.2g으로, 고등어·연어(1~2g)의 몇 분의 일에 그칩니다. 오메가3가 목적이라면 기름진 생선이 낫습니다."}]},{id:"seaweed",name:"해조류 (미역·다시마·김)",en:"Seaweed (wakame, kelp, laver)",aliases:["미역","미역국","다시마","김","김밥김","조미김","파래","톳","매생이","곰피","해초","해조류","seaweed","wakame","kombu","kelp","nori","laver"],emoji:"🌿",category:"해산물·해조류",summary:"요오드·엽산·칼슘·마그네슘과 알긴산·후코이단 같은 해조 다당류가 풍부합니다. 가장 큰 특징은 요오드로, 종류와 건조 상태에 따라 편차가 매우 커서 다시마 >> 미역 > 김 순입니다. 적당량은 갑상선 호르몬의 재료지만, 다시마를 많이 먹으면 한국인 성인 상한섭취량(하루 2,400μg)을 쉽게 넘습니다.",verdict:{tone:"balanced",text:"미역·김은 반찬으로 자주 먹어도 좋지만, 다시마는 국물을 우리는 정도로. 매끼 대량 섭취는 요오드 과잉에 주의하세요."},basis:"생미역 100g (USDA 미역 기준, 요오드는 종류별로 본문 참고)",serving:{label:"미역국 한 그릇 (불린 미역 약 50g)",grams:50},nutrients:{kcal:45,carb:9.1,sugar:.65,fiber:.5,protein:3,fat:.64,satFat:.13,mufa:.06,pufa:.22,sodium:872,potassium:50,calcium:150,magnesium:107,iron:2.18,zinc:.38,selenium:.7,vitA:18,vitC:3,vitK:5.3,vitB1:.06,vitB2:.23,folate:196},compounds:[{id:"iodine",amount:"마른 다시마는 1g에 수천 μg, 마른 미역은 100g당 수천 μg, 김은 1장(약 2g)에 수십 μg (산지·제품별 편차 매우 큼)",role:"갑상선이 호르몬(T4·T3)을 만드는 필수 재료입니다. 해조류는 바닷물의 요오드를 크게 농축하는데, 다시마는 몇 g만 먹어도 하루 상한섭취량을 넘길 수 있습니다."},{id:"seaweed-polysaccharide",amount:"알긴산은 갈조류(미역·다시마) 건조 무게의 약 20~40%",role:"미역·다시마의 미끈한 점액 성분입니다. 소장에서 소화되지 않는 수용성 섬유로 위 배출과 당 흡수를 늦추고 대장에서 일부 발효됩니다. 후코이단의 항암·면역 효과는 주로 세포·동물 연구입니다."},{id:"folate",amount:"생미역 약 196μg/100g",role:"DNA 합성과 메틸화 회로에 쓰이는 엽산이 녹색 채소 못지않게 많아, 미역국 한 그릇(50g)으로 기준치의 약 25%를 채웁니다."},{id:"magnesium",amount:"생미역 약 107mg/100g",role:"효소 반응과 근육 이완에 필요한 마그네슘을 반찬 수준에서 보태 줍니다."},{id:"calcium",amount:"생미역 약 150mg/100g",role:"무게당으로는 우유보다 많지만 한 번에 먹는 양이 적어, 실제 기여는 반찬 수준입니다."},{id:"vitamin-k",amount:"생 다시마 약 66μg/100g, 미역은 적음",role:"혈액 응고 단백질을 활성화합니다. 와파린 복용자는 해조류를 갑자기 많이 먹는 것을 피하고 일정하게 먹어야 합니다."}],howToEat:[{title:"다시마는 우려내고 건더기는 조금만",body:"요오드는 물에 잘 녹아 다시마 육수에도 상당량 나옵니다. 우린 다시마를 통째로 먹거나 진한 다시마 국물을 매일 먹으면 요오드가 상한을 쉽게 넘으니, 육수용으로 쓰고 건더기는 조금만 드세요."},{title:"미역국은 한 그릇 정도로",body:"미역국 한 그릇만으로도 하루 권장량(150μg)의 몇 배가 될 수 있습니다. 하루 1~2그릇 정도면 충분하며, 매끼 여러 그릇을 몇 주씩 먹는 것은 피하세요."},{title:"들기름·소고기·조개와 함께",body:"미역의 카로티노이드(푸코잔틴·베타카로틴)는 지용성이라 기름과 함께 먹으면 흡수가 늘고, 단백질 재료가 들어가 한 끼 균형도 좋아집니다."},{title:"조미김은 나트륨·기름을 고려",body:"조미김은 소금과 식용유를 발라 구운 것이라 나트륨·지방이 더해지고, 개봉 후 오래 두면 기름이 산화됩니다. 맨김을 살짝 구워 먹는 것이 가장 담백합니다."},{title:"톳은 불리고 데친 물을 버리기",body:"톳은 무기비소가 많은 해조류입니다. 물에 충분히 불린 뒤 끓는 물에 데치고 그 물을 버리면 무기비소가 크게 줄어듭니다."}],pairings:{good:["들기름·소고기·조개 (미역국: 지용성 성분 흡수와 단백질 보완)","두부·채소 (칼슘·단백질 보완)"],avoid:["다시마환·요오드 보충제와 겹쳐 먹기"]},cautions:["갑상선 질환(하시모토 갑상선염, 갑상선기능항진증, 치료 중인 결절 등)이 있다면 다시마·다시마환·요오드 보충제를 많이 먹지 말고 주치의와 상의하세요. 요오드 과잉은 기능 저하와 항진을 모두 일으킬 수 있습니다.","산후에 미역국을 매끼 여러 주 먹으면 요오드 섭취가 매우 높아지고, 모유 요오드가 높아져 미숙아의 갑상선 기능 저하와 연관됐다는 한국 연구가 있습니다. 하루 1~2그릇 정도가 적당합니다.","톳(히지키)은 무기비소 때문에 영국 식품기준청(FSA)이 2004년 섭취 자제를 권고했습니다. 먹는다면 불리고 데쳐서 가끔 드세요.","와파린 복용자는 김·파래·다시마 같은 해조류를 갑자기 많이 먹지 말고 일정한 양을 유지하세요."],myths:[{claim:"산후 미역국이 피를 맑게 하
