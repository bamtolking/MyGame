<script type="module">var qt=Object.defineProperty;var Wt=(t,e,i)=>e in t?qt(t,e,{enumerable:!0,configurable:!0,writable:!0,value:i}):t[e]=i;var st=(t,e,i)=>Wt(t,typeof e!="symbol"?e+"":e,i);const Z={anthocyanin:"안토시아닌",quercetin:"퀘르세틴",egcg:"카테킨 (EGCG)",curcumin:"커큐민",resveratrol:"레스베라트롤","chlorogenic-acid":"클로로겐산","cocoa-flavanol":"코코아 플라바놀",isoflavone:"이소플라본",ellagitannin:"엘라지탄닌·유롤리틴",hesperidin:"헤스페리딘","olive-polyphenol":"올리브 폴리페놀",lignan:"리그난","beta-carotene":"베타카로틴",lutein:"루테인·제아잔틴",lycopene:"라이코펜",astaxanthin:"아스타잔틴",sulforaphane:"설포라판",allicin:"알리신 (마늘 유황화합물)","dietary-nitrate":"식이 질산염",capsaicin:"캡사이신",gingerol:"진저롤·쇼가올",caffeine:"카페인","beta-glucan":"베타글루칸","prebiotic-fiber":"발효성 식이섬유 (프리바이오틱스)","resistant-starch":"저항성 전분","seaweed-polysaccharide":"해조 다당류 (알긴산·후코이단)","added-sugar":"첨가당·과당","refined-carb":"정제 탄수화물",probiotics:"유산균 (프로바이오틱스)","vitamin-c":"비타민 C","vitamin-k":"비타민 K",folate:"엽산","vitamin-e":"비타민 E","vitamin-d":"비타민 D","vitamin-b12":"비타민 B12",magnesium:"마그네슘",potassium:"칼륨","nonheme-iron":"비헴철 (식물성 철)","heme-iron":"헴철 (동물성 철)",calcium:"칼슘",iodine:"요오드",selenium:"셀레늄",zinc:"아연",choline:"콜린","epa-dha":"오메가3 EPA·DHA",ala:"알파리놀렌산 (식물성 오메가3)","linoleic-acid":"리놀레산 (오메가6)","oleic-acid":"올레산 (단일불포화지방)","saturated-fat":"포화지방","trans-fat":"트랜스지방","oxidized-lipids":"산화 지질 (과산화물·알데하이드)",mct:"중쇄지방산 (MCT)",lectin:"렉틴",oxalate:"옥살산",phytate:"피트산",gluten:"글루텐",glycoalkaloid:"글리코알칼로이드 (솔라닌)",acrylamide:"아크릴아마이드",nitrosamine:"아질산염·니트로사민","heat-byproducts":"고온 조리 부산물 (HCA·PAH·AGEs)",methylmercury:"메틸수은",ethanol:"알코올 (에탄올)",sodium:"나트륨"},kt=Object.keys(Z),R={antioxidant:"항산화","anti-inflammatory":"항염",vascular:"혈관·혈압",cholesterol:"콜레스테롤·지질","blood-sugar":"혈당·인슐린",gut:"장 건강",brain:"뇌·신경",eye:"눈","bone-muscle":"뼈·근육",liver:"간·해독",immune:"면역",hormone:"호르몬",skin:"피부",energy:"에너지 대사",cancer:"암 관련 연구","inflammation-risk":"염증 유발","oxidative-risk":"산화 스트레스 유발",autoimmune:"자가면역 관련"},pt=Object.keys(R),Yt=[{id:"anthocyanin",name:"안토시아닌",en:"Anthocyanins",aliases:["안토시아니딘","시아니딘","델피니딘","anthocyanidin","cyanidin"],kind:"폴리페놀",effect:"benefit",tags:["antioxidant","anti-inflammatory","vascular","brain","blood-sugar"],summary:"블루베리·검은콩·자색고구마·적양배추의 보라·파란색을 내는 플라보노이드 색소입니다. 시험관에서는 강력한 항산화제지만, 몸속에서는 활성산소를 직접 없애기보다 세포의 방어 스위치를 켜고 혈관의 산화질소를 늘리는 신호로 작용하는 것으로 보입니다.",pathways:[{title:"세포의 항산화 스위치(Nrf2) 켜기",evidence:"limited",steps:[{title:"섭취·흡수",body:"위와 소장에서 원형 그대로 일부가 흡수되지만, 혈액에 원형으로 도달하는 양은 먹은 양의 1~2% 안팎으로 매우 적습니다."},{title:"간·대장에서 변신",body:"간과 장벽에서 메틸화·글루쿠론산 포합으로 모양이 바뀌고, 대장 미생물은 고리 구조를 쪼개 프로토카테큐산(PCA)·페룰산 같은 페놀산을 만듭니다. 이 대사물이 원래 안토시아닌보다 훨씬 높은 농도로 오래(최대 48시간) 혈중에 머뭅니다."},{title:"세포 신호",body:"폴리페놀과 그 대사물은 세포에 약한 스트레스 신호처럼 작용해 Keap1 단백질에 붙잡혀 있던 전사인자 Nrf2를 풀어줍니다. Nrf2는 핵으로 들어가 DNA의 항산화반응요소(ARE)에 결합합니다."},{title:"결과",body:"글루타티온 합성 효소, 헴산화효소-1(HO-1), NQO1 같은 몸 자체의 항산화·해독 효소가 늘어나, 활성산소를 세포가 스스로 처리하는 능력이 커집니다."}],note:'이런 "적당한 자극으로 방어력을 키우는" 방식을 호르메시스(hormesis)라고 부릅니다. 세포·동물 연구 근거가 대부분입니다.'},{title:"혈관 내피 기능 개선 (산화질소 증가)",evidence:"moderate",steps:[{title:"흡수 후 1~2시간",body:"혈중 폴리페놀 대사물이 최고치에 이릅니다."},{title:"혈관 내피세포",body:"활성산소를 만드는 효소(NADPH 산화효소)의 활동을 낮추고, 산화질소를 만드는 내피 산화질소합성효소(eNOS)의 활성을 높이는 것으로 보입니다."},{title:"산화질소(NO) 보존",body:"활성산소(슈퍼옥사이드)는 산화질소를 파괴합니다. 활성산소가 줄고 생성이 늘면 혈관을 넓히는 산화질소가 더 오래 남습니다."},{title:"결과",body:"혈관 평활근이 이완되어 혈관이 부드럽게 넓어집니다. 사람 대상 무작위 대조시험에서 블루베리 섭취 후 혈류매개 혈관확장(FMD)이 개선됐고, 대사증후군 환자의 6개월 시험에서도 개선이 확인됐습니다."}]},{title:"활성산소 직접 중화 (시험관에서는 강함, 몸속에서는 제한적)",evidence:"limited",steps:[{title:"화학 구조",body:"고리 구조에 붙은 여러 개의 페놀성 수산기(-OH)가 전자와 수소를 내주어 슈퍼옥사이드·하이드록실 라디칼 같은 활성산소를 안정화합니다."},{title:"시험관 측정",body:"ORAC 같은 항산화 측정에서 비타민 C보다도 높은 수치가 나옵니다."},{title:"몸속의 한계",body:"혈중 안토시아닌은 나노몰(nM) 수준인데, 혈액의 주요 항산화 물질인 요산·비타민 C는 그보다 수천 배 많은 마이크로몰(μM) 수준으로 존재합니다. 그래서 혈액 속에서 직접 중화하는 기여는 작습니다."},{title:"예외: 장 속",body:"먹은 직후 위와 장 안에서는 농도가 높아, 함께 먹은 음식 속 지방이 소화 중에 산화되는 것을 줄이는 국소 효과는 있을 수 있습니다."}]}],evidenceNote:'사람 연구: 블루베리·베리류가 혈관 내피 기능(FMD)을 개선한다는 무작위 대조시험이 여럿 있고, 대규모 관찰연구에서는 안토시아닌·베리 섭취가 많을수록 심근경색과 제2형 당뇨 위험이 낮았습니다. 반면 "활성산소를 직접 중화한다"는 설명은 주로 시험관 결과이며, 현재 연구는 대사물과 세포 신호를 통한 간접 작용을 더 중요하게 봅니다.',facts:["산성에서는 붉은색, 중성~알칼리에서는 푸른색·녹색으로 변합니다. 적양배추 물이 pH 지시약이 되는 원리입니다.","열·빛·산소에 약해 오래 끓이면 줄어들지만, 냉동해도 대부분 유지됩니다.","미국 농무부(USDA)는 2012년, 시험관 항산화 수치가 몸속 효과를 반영하지 않는다는 이유로 ORAC 데이터베이스를 철회했습니다.","색소는 주로 껍질에 몰려 있어, 알이 작은 야생 블루베리가 재배종보다 100g당 함량이 높습니다."],cautions:["식품으로 먹는 양에서 알려진 위험은 거의 없습니다. 고농축 추출물 보충제가 식품과 같은 효과를 낸다는 근거는 부족합니다."],refs:["Czank C, et al. Am J Clin Nutr 2013 — 13C 표지 안토시아닌의 체내 흡수·대사 추적","Curtis PJ, et al. Am J Clin Nutr 2019 — 대사증후군 대상 블루베리 6개월 무작위 대조시험","Cassidy A, et al. Circulation 2013 — 안토시아닌 섭취와 젊은 여성의 심근경색 위험 (코호트)","Linus Pauling Institute, Micronutrient Information Center — Flavonoids"]},{id:"lectin",name:"렉틴",en:"Lectins",aliases:["피토헤마글루티닌","PHA","밀 배아 응집소","WGA","응집소","agglutinin","렉틴프리","렉틴 프리"],kind:"항영양소",effect:"caution",tags:["gut","immune","autoimmune"],summary:'특정 당(탄수화물)에 달라붙는 단백질로 콩·곡물·땅콩·가지과 채소에 있습니다. 날콩이나 덜 익힌 강낭콩의 렉틴(PHA)은 급성 식중독을 일으키지만 충분히 삶으면 대부분 파괴됩니다. "렉틴이 장누수와 자가면역을 일으킨다"는 주장은 세포·동물 연구에 기반한 가설 단계입니다.',pathways:[{title:"날콩 렉틴(PHA)의 급성 독성",evidence:"strong",steps:[{title:"섭취",body:"날것이나 덜 익힌 강낭콩(특히 붉은 강낭콩)에는 피토헤마글루티닌(PHA)이 매우 많습니다. 끓는 온도에 못 미치게(약 80℃) 데우면 오히려 날것보다 독성이 몇 배 높아진 사례가 보고되어, 저온 조리기가 특히 위험합니다."},{title:"위를 통과",body:"렉틴은 단백질 분해효소와 위산에 잘 견뎌 활성을 가진 채 소장까지 내려갑니다."},{title:"장 세포에 결합",body:"소장 상피세포 표면의 당사슬에 단단히 붙어 융모 세포의 기능을 떨어뜨리고, 장 신경을 자극해 구토 반사를 일으킵니다."},{title:"결과",body:"날콩 4~5알로도 1~3시간 안에 심한 구토·설사·복통이 생길 수 있습니다. 대개 몇 시간 안에 회복됩니다."}]},{title:"장 투과성·자가면역 가설",evidence:"contested",steps:[{title:"장 상피에 부착",body:"밀 배아 응집소(WGA) 같은 일부 렉틴은 시험관에서 장 상피세포에 붙고 세포 안으로 들어갈 수 있습니다."},{title:"장벽이 느슨해진다는 가설",body:"세포·동물 실험에서 세포 사이를 잇는 치밀결합(tight junction)이 느슨해져 장 투과성이 늘고, 면역세포가 자극받아 염증성 사이토카인이 나온다는 결과가 있습니다."},{title:"분자 모방 가설",body:"일부 연구자는 렉틴에 대한 항체가 비슷한 모양의 자기 조직과 교차 반응(분자 모방)해 자가면역을 부추길 수 있다고 제안합니다."},{title:"사람에서의 현실",body:"조리된 콩·통곡물을 먹는 사람에게서 자가면역질환이 늘었다는 근거는 없습니다. 오히려 콩·통곡물 섭취는 관찰연구에서 심혈관질환·당뇨 위험 감소와 연결됩니다. 글루텐에 반응하는 셀리악병처럼 진단된 질환은 별개 문제입니다."}],note:'"렉틴 프리 식단"의 효과를 검증한 무작위 대조시험은 부족합니다.'}],evidenceNote:"확실한 것: 날콩·설익은 콩의 렉틴은 급성 위장 독성을 일으키고, 충분한 가열(불린 뒤 팔팔 끓이기, 압력솥)로 활성이 거의 사라집니다. 불확실한 것: 조리된 식품 속 소량의 렉틴이 장누수·자가면역을 일으킨다는 주장은 대부분 세포·동물 실험과 임상 경험에 기반한 가설이며, 사람 대상 대조시험으로 확인되지 않았습니다.",facts:["미국 FDA 자료에 따르면 날 붉은 강낭콩의 렉틴 활성은 20,000~70,000 단위(HAU)이고, 충분히 삶으면 200~400 단위로 떨어집니다.","5시간 이상 불리고, 불린 물은 버린 뒤, 새 물에서 팔팔 끓는 상태로 충분히(최소 10분, 가능하면 30분 이상) 삶으면 안전합니다.","압력솥 조리는 렉틴을 거의 완전히 불활성화합니다. 통조림 콩은 이미 고온 처리되어 걱정이 거의 없습니다.","슬로우쿠커처럼 끓는점에 못 미치는 조리기에는 날콩을 넣기 전에 먼저 팔팔 끓여야 합니다."],cautions:["날콩가루·생콩 스무디처럼 가열하지 않은 콩 제품은 피하세요.","셀리악병·염증성 장질환 등 진단된 질환이 있어 식단을 바꾸려면 담당 의료진과 상의하세요."],refs:["U.S. FDA, Bad Bug Book (2nd ed.) — Phytohaemagglutinin (kidney bean lectin)","Harvard T.H. Chan School of Public Health, The Nutrition Source — Lectins"]},{id:"linoleic-acid",name:"리놀레산 (오메가6)",en:"Linoleic acid (omega-6)",aliases:["오메가6","오메가-6","omega-6","omega6","LA","n-6","씨앗기름","시드오일","seed oil"],kind:"지방산",effect:"mixed",tags:["cholesterol","vascular","inflammation-risk"],summary:'콩기름·옥수수유·해바라기씨유·카놀라유·견과류에 많은 필수 지방산입니다. "오메가6 → 아라키돈산 → 염증"이라는 설명이 널리 퍼져 있지만, 사람 대상 시험에서는 리놀레산 섭취를 늘려도 염증 지표가 오르지 않았고, 포화지방 대신 먹으면 LDL 콜레스테롤이 내려갑니다. 실제 문제는 고온·반복 가열로 산화될 때 커집니다.',pathways:[{title:"아라키돈산 → 염증 물질 경로 (염증 가설)",evidence:"contested",steps:[{title:"전환",body:"리놀레산은 간에서 불포화효소(델타-6, 델타-5)와 사슬 연장 효소를 거쳐 아라키돈산(AA)으로 바뀔 수 있습니다."},{title:"에이코사노이드 재료",body:"세포막의 아라키돈산은 COX·LOX 효소에 의해 프로스타글란딘E2, 류코트리엔B4 같은 염증 매개물질의 재료가 됩니다."},{title:"가설",body:'그래서 "오메가6를 많이 먹을수록 염증이 늘어난다"는 추론이 나왔습니다.'},{title:"실제 측정",body:"리놀레산이 아라키돈산으로 바뀌는 과정은 엄격히 조절되어, 섭취를 크게 늘리거나 줄여도 조직 아라키돈산은 거의 변하지 않았습니다. 무작위 대조시험들을 모은 체계적 고찰에서 CRP·IL-6 같은 염증 지표도 오르지 않았습니다. 아라키돈산에서는 염증을 끝내는 물질(리폭신)도 만들어집니다."}]},{title:"LDL 콜레스테롤 저하 (포화지방을 대체할 때)",evidence:"strong",steps:[{title:"간세포의 LDL 수용체",body:"포화지방은 간의 LDL 수용체 활성을 떨어뜨리는 반면, 다불포화지방으로 바꾸면 수용체 활성이 회복됩니다."},{title:"혈중 LDL 회수",body:"수용체가 늘면 혈액 속 LDL 입자가 간으로 더 많이 회수됩니다."},{title:"결과",body:"LDL 콜레스테롤이 낮아집니다. 포화지방 에너지의 5%를 다불포화지방으로 바꿀 때 관상동맥질환 위험이 약 10% 낮아졌다는 메타분석이 있습니다."}]},{title:"산화에 약한 구조",evidence:"strong",steps:[{title:"약한 고리",body:"두 이중결합 사이 탄소(비스-알릴 위치)의 수소가 쉽게 떨어져 나갑니다. 이중결합이 하나인 올레산보다 수십 배 빨리 산화됩니다."},{title:"연쇄 산화",body:"열·빛·금속이온이 있으면 지질 라디칼 → 지질과산화 라디칼 → 과산화물로 연쇄 반응이 번집니다."},{title:"분해 산물",body:"과산화물이 분해되며 4-하이드록시노네날(4-HNE) 같은 반응성 알데하이드가 생깁니다. 4-HNE는 특히 오메가6에서 만들어집니다(→ 산화 지질 참고)."},{title:"의미",body:"신선한 기름을 짧게 쓰는 것과 같은 기름으로 여러 번 튀기는 것은, 몸에 들어오는 산화물의 양이 크게 다릅니다."}]}],evidenceNote:"강한 근거: 포화지방을 리놀레산 같은 다불포화지방으로 바꾸면 LDL이 내려가고 심혈관질환 위험이 낮아집니다(메타분석, 미국심장협회 권고). 여러 나라 코호트를 통합한 분석에서도 혈중 리놀레산이 높은 사람의 심혈관 사망 위험이 더 낮았습니다. 반론: 오메가6:오메가3 비율 문제, 산화 LDL 가설, 오래된 시험(시드니 식이 심장 연구, 미네소타 관상동맥 실험)의 재분석에서 이득이 없거나 해로웠다는 결과가 있어 논쟁이 이어지고 있습니다. 합의된 부분: 고온에서 반복 가열한 기름은 피하는 것이 좋습니다.",facts:["몸에서 만들 수 없는 필수 지방산이며, 1일 영양성분 기준치는 10g입니다.","리놀레산 비율(대략): 해바라기씨유(일반형) 약 65%, 옥수수유 약 55%, 콩기름 약 51%, 참기름 약 41%, 카놀라유 약 19%, 올리브유 약 10%.","현대 식단의 오메가6 섭취는 식물성 기름 사용이 늘면서 20세기에 크게 증가했습니다. 오메가3를 늘리는 것이 오메가6를 무리하게 줄이는 것보다 근거가 탄탄합니다."],cautions:["튀김용으로 같은 기름을 여러 번 쓰지 마세요. 리놀레산이 많은 기름일수록 반복 가열 시 산화물이 빨리 늘어납니다."],refs:["Johnson GH, Fritsche K. J Acad Nutr Diet 2012 — 리놀레산 섭취와 염증 지표 무작위 대조시험 체계적 고찰","Mozaffarian D, et al. PLoS Med 2010 — 포화지방을 다불포화지방으로 대체한 시험 메타분석","Marklund M, et al. Circulation 2019 — 오메가6 바이오마커와 심혈관질환 (30개 코호트 통합)","Sacks FM, et al. Circulation 2017 — 미국심장협회 식이지방과 심혈관질환 권고","Ramsden CE, et al. BMJ 2013, BMJ 2016 — 시드니 식이 심장 연구·미네소타 관상동맥 실험 재분석"]},{id:"oxidized-lipids",name:"산화 지질 (과산화물·알데하이드)",en:"Lipid oxidation products",aliases:["4-HNE","HNE","말론디알데하이드","MDA","아크롤레인","산패","과산화지질","지질과산화","튀김기름","재사용 기름","쩐내"],kind:"유해 생성물",effect:"harm",tags:["oxidative-risk","inflammation-risk","vascular","liver"],summary:'기름이 열·빛·공기에 노출돼 산화되면 생기는 과산화물과 알데하이드(4-HNE, MDA, 아크롤레인 등)입니다. 튀김기름을 여러 번 재사용하거나 연기가 날 때까지 가열하면 크게 늘어납니다. "식물성 기름이 활성산소와 염증을 만든다"는 이야기의 실제 핵심 기전이 여기에 있습니다.',pathways:[{title:"기름 속에서: 가열 → 연쇄 산화",evidence:"strong",steps:[{title:"개시",body:"180℃ 전후의 튀김 온도에서 불포화지방산의 수소가 떨어져 나가 지질 라디칼(L•)이 생깁니다."},{title:"전파",body:"지질 라디칼이 산소와 결합해 지질과산화 라디칼(LOO•)이 되고, 옆 지방산의 수소를 빼앗으며 연쇄적으로 번집니다."},{title:"분해",body:"불안정한 지질과산화물(LOOH)이 쪼개지며 4-하이드록시노네날(4-HNE, 주로 오메가6에서), 말론디알데하이드(MDA), 아크롤레인 같은 반응성 알데하이드가 생깁니다."},{title:"누적",body:"같은 기름을 반복 사용할수록, 이중결합이 많은 기름일수록, 튀김 찌꺼기·물기가 섞일수록 산화물이 빨리 쌓입니다."}]},{title:"몸속에서: 알데하이드 → 산화 스트레스·염증",evidence:"limited",steps:[{title:"흡수",body:"음식 속 알데하이드와 산화된 지방 일부는 장에서 흡수되어 암죽미립(킬로미크론)에 실려 혈액으로 들어갑니다."},{title:"단백질 손상",body:"4-HNE·MDA는 단백질의 시스테인·라이신·히스티딘에 달라붙어(부가물 형성) 효소와 수용체의 기능을 떨어뜨립니다."},{title:"방어력 소모",body:"세포는 글루타티온으로 알데하이드를 해독하는데, 과부하가 걸리면 글루타티온이 고갈되고 미토콘드리아에서 활성산소가 더 새어 나옵니다."},{title:"염증 신호",body:"손상 신호가 NF-κB 경로를 켜서 TNF-α·IL-6 같은 염증성 사이토카인 분비가 늘어납니다. 동물실험에서 반복 가열한 기름은 혈관 내피 손상, 혈압 상승, 지방간을 일으켰습니다."}]},{title:"산화 LDL과 동맥경화",evidence:"moderate",steps:[{title:"LDL 산화",body:"혈관벽에 들어간 LDL 입자 속 다불포화지방이 산화되면 산화 LDL이 됩니다."},{title:"거품세포",body:"혈관벽의 대식세포가 청소 수용체(CD36 등)로 산화 LDL을 제한 없이 삼켜 거품세포가 됩니다."},{title:"플라크",body:"거품세포가 쌓이고 죽으면서 죽상동맥경화판(플라크)의 핵심을 이룹니다."},{title:"식이와의 연결",body:"먹은 산화 지질이 산화 LDL을 직접 늘리는지는 사람에서 확실하지 않습니다. 다만 LDL 자체를 낮추고 항산화 성분이 풍부한 식단이 산화 LDL을 줄인다는 연구가 있습니다."}]}],evidenceNote:"화학적으로 확실한 것: 불포화지방은 가열·재사용할수록 산화되어 반응성 알데하이드를 만들고, 이중결합이 많을수록 빠릅니다. 동물실험: 반복 가열한 기름은 산화 스트레스·염증·혈관 손상을 일으킵니다. 사람: 튀긴 음식을 자주 먹을수록 심혈관질환 위험이 높다는 관찰연구가 있지만, 신선한 식물성 기름을 적당히 쓰는 것이 해롭다는 근거는 아닙니다. 조리 온도와 재사용 횟수를 관리하는 것이 핵심입니다.",facts:['튀김기름의 열화 정도는 "총 극성 물질(TPM)"로 관리하며, 여러 유럽 국가는 24~27%를 넘는 기름을 폐기하도록 규정합니다.',"가열 안정성: 포화·단일불포화지방이 많은 기름(엑스트라버진 올리브유, 고올레산 해바라기유, 팜유, 버터기름)이 다불포화지방이 많은 기름(콩기름, 해바라기씨유, 옥수수유)보다 산화에 강합니다.","들기름·아마씨유처럼 오메가3가 많은 기름은 특히 산화가 빨라, 가열보다는 무침용으로 쓰고 냉장 보관하는 것이 좋습니다.","기름에서 나는 쩐내(산패취)는 이미 산화가 꽤 진행됐다는 신호입니다."],cautions:["같은 기름으로 여러 번 튀기지 말고, 연기가 날 때까지 가열하지 마세요.","고온 조리 연기(조리흄)에도 알데하이드가 들어 있으니 주방 환기를 충분히 하세요."],refs:["Esterbauer H, et al. Free Radic Biol Med 1991 — 4-HNE·말론디알데하이드의 화학과 생물학","Sacks FM, et al. Circulation 2017 — 미국심장협회 식이지방과 심혈관질환 권고"]}],Qt=[{id:"quercetin",name:"퀘르세틴",en:"Quercetin",aliases:["쿼세틴","케르세틴","퀘세틴","quercetin","루틴","rutin","이소람네틴","플라보놀","flavonol","천연 항히스타민"],kind:"폴리페놀",effect:"benefit",tags:["anti-inflammatory","antioxidant","vascular","immune"],summary:"양파·케이퍼·케일·사과 껍질·차에 들어 있는 대표 플라보놀입니다. 식품 속에서는 당이 붙은 배당체로 존재하며, 양파의 포도당 배당체가 가장 잘 흡수됩니다. 세포 실험에서는 항염·항산화 신호를 폭넓게 조절하지만, 사람에게서 확인된 효과는 고용량 보충제에서의 소폭 혈압 저하 정도입니다.",pathways:[{title:"흡수: 어떤 당이 붙어 있느냐가 관건",evidence:"strong",steps:[{title:"식품 속 형태",body:"식품 속 퀘르세틴은 대부분 당이 붙은 배당체입니다. 양파에는 포도당이 붙은 형태(퀘르세틴-4′-글루코사이드 등), 사과에는 갈락토스·아라비노스 등이 붙은 형태, 차·메밀에는 루티노스가 붙은 루틴이 많습니다."},{title:"소장에서 빠른 흡수",body:"포도당 배당체는 소장 상피의 락타아제-플로리진 가수분해효소(LPH)와 세포 안 β-글루코시다아제가 당을 떼어내 빠르게 흡수됩니다. 양파를 먹으면 1시간 안팎에 혈중 농도가 최고치에 이릅니다."},{title:"대장을 거치는 느린 흡수",body:"루틴처럼 람노스가 붙은 형태는 사람 효소로 끊을 수 없어 대장까지 내려가 세균이 당을 떼어낸 뒤에야 흡수됩니다. 사람 연구에서 사과·루틴의 퀘르세틴 흡수량은 양파의 약 30% 수준이었고, 최고치도 몇 시간 늦게 나타났습니다."},{title:"장벽·간에서 변형",body:"흡수된 퀘르세틴은 장벽과 간에서 글루쿠론산·황산 포합과 메틸화(이소람네틴 등)를 거쳐, 혈중에는 거의 대사물 형태로 존재합니다. 비교적 천천히 제거되어 매일 먹으면 혈중 농도가 조금씩 쌓입니다."}]},{title:"염증 신호 조절 (세포 실험 중심)",evidence:"limited",steps:[{title:"조직에서 다시 풀려남",body:"혈중의 글루쿠론산 포합체는 염증 부위의 대식세포가 가진 β-글루쿠로니다아제에 의해 다시 퀘르세틴으로 풀려나 세포 안으로 들어갈 수 있다는 연구가 있습니다."},{title:"염증 스위치 억제",body:"세포 실험에서 퀘르세틴은 IκB 키나아제(IKK)를 억제해 NF-κB가 핵으로 들어가는 것을 막고, MAPK 신호와 COX-2·iNOS·TNF-α 발현을 낮춥니다."},{title:"비만세포 안정화",body:'비만세포에서 히스타민·트립타아제·염증성 사이토카인이 분비되는 것을 억제한다는 세포 실험이 있어 "천연 항히스타민"으로 알려졌습니다.'},{title:"농도의 벽",body:"이런 효과는 대부분 수~수십 μM 농도에서 관찰되지만, 식사로 먹었을 때 혈중 농도는 대사물을 합해도 대개 1μM에 못 미치고, 고용량 보충제로도 수 μM 이하입니다."}],note:'"천연 항히스타민" 효과는 세포·동물 실험에 기반하며, 알레르기 비염 등에서 이를 확인한 사람 대상 대조시험은 부족합니다.'},{title:"혈압 소폭 저하 (보충제 용량)",evidence:"moderate",steps:[{title:"용량",body:"혈압 효과가 관찰된 용량은 하루 500mg 이상으로, 보통 식단에서 먹는 양(하루 수~수십 mg)의 수십 배입니다."},{title:"혈관 내피",body:"퀘르세틴 대사물이 NADPH 산화효소를 억제해 슈퍼옥사이드를 줄이고 산화질소(NO) 이용도를 높이는 것으로 추정되며, 사람 시험에서 혈관을 수축시키는 엔도텔린-1이 줄었다는 보고도 있습니다."},{title:"결과",body:"무작위 대조시험 메타분석에서 하루 500mg 이상 보충 시 수축기·이완기 혈압이 각각 약 3mmHg 안팎 낮아졌습니다. 혈압약을 대신할 수준은 아닙니다."}]}],evidenceNote:'확실한 것: 양파 속 포도당 배당체가 가장 잘 흡수되고, 몸속에서는 대부분 포합 대사물로 존재합니다. 사람 시험: 하루 500mg 이상 보충제에서 혈압이 소폭 낮아졌다는 메타분석이 있으나, 식품 섭취량에서의 효과는 확인되지 않았습니다. 항염·항히스타민·항바이러스·"노화세포 제거" 같은 주장은 대부분 세포·동물 연구나 약물과 병용한 초기 시험에 근거합니다. 관찰연구(네덜란드 Zutphen 노인 연구 등)에서 플라보놀 섭취가 많을수록 심혈관질환 사망이 적었지만, 채소·과일·차 섭취 전체와 분리하기 어렵습니다.',facts:["양파는 100g당 약 20~40mg(붉은 양파와 바깥쪽 겹일수록 많음), 케이퍼는 100g당 100mg을 훌쩍 넘는 최고 수준의 공급원입니다. 사과는 과육보다 껍질에 몰려 있습니다.","배당체 형태는 물에 녹기 때문에 양파를 오래 삶으면 일부가 국물로 빠져나갑니다. 국물째 먹거나 볶는 조리가 손실이 적습니다.","일반 식단의 퀘르세틴 섭취는 하루 수~수십 mg이고, 보충제는 한 알에 500mg 안팎인 제품이 많습니다.",'항암제 다사티닙과 퀘르세틴을 함께 쓰는 "노화세포 제거(세놀리틱)" 연구가 주목받지만, 이는 약물 병용 연구로 퀘르세틴 단독 보충이나 식품 섭취에 그대로 적용할 수 없습니다.'],cautions:["고용량 보충제는 일부 약물 대사 효소(CYP)와 약물 수송체를 억제할 수 있어, 항응고제·면역억제제·항암제처럼 치료 범위가 좁은 약을 먹는다면 먼저 상의하세요.","임신·수유 중이거나 신장질환이 있다면 고용량 보충제의 안전성 자료가 부족합니다."],refs:["Hollman PC, et al. FEBS Lett 1997 — 양파·사과·루틴에서 퀘르세틴의 상대적 생체이용률","Serban MC, et al. J Am Heart Assoc 2016 — 퀘르세틴 보충과 혈압 무작위 대조시험 메타분석","Hertog MG, et al. Lancet 1993 — 플라보노이드 섭취와 관상동맥질환 사망 (Zutphen 노인 연구)","Linus Pauling Institute, Micronutrient Information Center — Flavonoids"]},{id:"egcg",name:"카테킨 (EGCG)",en:"Epigallocatechin gallate (green tea catechins)",aliases:["EGCG","에피갈로카테킨갈레이트","에피갈로카테킨 갈레이트","녹차 카테킨","카테킨","catechin","녹차추출물","녹차 추출물","차 폴리페놀","말차"],kind:"폴리페놀",effect:"mixed",tags:["antioxidant","cholesterol","liver","energy"],summary:"녹차에 가장 많은 플라바놀로, 녹차 카테킨의 절반 이상을 차지합니다. 차로 마실 때는 LDL 콜레스테롤을 소폭 낮추는 등 이로운 쪽 근거가 쌓여 있지만, 고농축 추출물을 보충제로 많이 먹으면 간 손상 위험이 있고, 식사와 함께 마신 차는 식물성 철(비헴철) 흡수를 떨어뜨립니다.",pathways:[{title:"LDL 콜레스테롤 소폭 저하",evidence:"moderate",steps:[{title:"장 속에서",body:"카테킨은 장 안에서 담즙산 미셀의 구조를 흐트러뜨려, 음식과 담즙 속 콜레스테롤이 미셀에 녹아드는 것을 방해합니다."},{title:"흡수 감소",body:"소장에서 흡수되는 콜레스테롤이 줄고 더 많은 양이 대변으로 배출됩니다."},{title:"간의 반응",body:"간은 부족해진 콜레스테롤을 채우려고 LDL 수용체를 늘려 혈액 속 LDL을 더 많이 회수합니다."},{title:"결과",body:"무작위 대조시험 메타분석에서 녹차·카테킨 섭취는 총콜레스테롤과 LDL 콜레스테롤을 소폭(수 mg/dL 수준) 낮췄습니다. 효과는 작지만 비교적 일관됩니다."}]},{title:"고용량 추출물과 간 손상",evidence:"strong",steps:[{title:"섭취 형태의 차이",body:"우린 녹차 한 잔의 EGCG는 수십 mg 수준이지만, 다이어트용 녹차 추출물 캡슐은 하루 수백 mg~1g 이상을 한꺼번에 줄 수 있습니다."},{title:"빈속 복용",body:"공복에 먹으면 식사와 함께 먹을 때보다 혈중 EGCG가 몇 배 높아집니다. 간 손상 사례 중에는 빈속에 여러 번 나누어 먹은 경우가 많았습니다."},{title:"간세포 손상",body:"고농도 EGCG는 간세포 미토콘드리아 기능을 떨어뜨리고, 스스로 산화되며 과산화수소 같은 활성산소를 만들어 세포를 손상시킬 수 있습니다. 일부 사례는 면역이 관여하는 체질 반응으로 보이며 특정 유전형(HLA-B*35:01)과의 관련이 보고됐습니다."},{title:"결과",body:"EFSA는 2018년 평가에서 보충제로 하루 800mg 이상의 EGCG를 먹으면 간 수치(ALT 등)가 유의하게 오른다고 결론 내렸고, 안전한 보충 용량은 정하지 못했습니다. 드물게 급성 간염·간이식 사례도 보고됐습니다. 우려낸 차 음료는 일반적으로 안전한 것으로 평가됩니다."}]},{title:"비헴철 흡수 억제",evidence:"strong",steps:[{title:"구조",body:"EGCG의 갈로일기(수산기 3개가 나란히 붙은 부분)는 철 이온을 강하게 붙잡습니다."},{title:"장 속 결합",body:"식사와 함께 차를 마시면 장 안에서 식물성 비헴철과 결합해 흡수되지 않는 복합체를 만듭니다."},{title:"결과",body:"식사와 함께 마신 차는 비헴철 흡수를 크게(시험에 따라 절반 이상) 줄입니다. 고기의 헴철에는 영향이 훨씬 적습니다."},{title:"의미",body:"철 결핍·빈혈이 있거나 채식 위주라면 차는 식사 1시간 전후로 간격을 두는 것이 좋습니다. 반대로 철이 과잉 축적되는 혈색소증 환자에게는 도움이 될 수 있습니다."}]}],evidenceNote:"사람 근거: 녹차·카테킨이 LDL 콜레스테롤을 소폭 낮춘다는 무작위 대조시험 메타분석이 있고, 일본 코호트에서 녹차를 많이 마시는 사람의 심혈관 사망 위험이 낮았습니다. 체중 감량 효과는 작아 임상적 의미가 없다는 코크란 고찰이 있고, 암 예방 효과는 사람에서 확인되지 않았습니다. 위험: 고용량 추출물 보충제(하루 800mg 이상)는 간 수치를 올린다는 대조시험 근거가 있습니다. 차로 마시는 것과 추출물 캡슐은 구분해서 봐야 합니다.",facts:["우린 녹차 한 잔의 EGCG는 찻잎 양·물 온도·우리는 시간에 따라 크게 달라 대략 수십~100mg 안팎입니다. 말차는 잎 전체를 갈아 마시므로 같은 양이라도 더 많이 섭취합니다.","홍차는 발효(산화) 과정에서 카테킨이 테아플라빈·테아루비긴으로 중합되어 EGCG가 훨씬 적습니다.","EGCG는 흡수율이 낮아 대부분 대장으로 내려가며, 장내미생물이 이를 발레로락톤·페놀산 같은 작은 대사물로 쪼갭니다.","세포·동물 실험에서는 Nrf2·AMPK를 활성화하고 지방 산화를 늘리지만, 사람의 체중 감소 효과는 임상적으로 의미 있는 수준이 아니었습니다."],cautions:["녹차 추출물 보충제(특히 다이어트 제품)는 빈속에 먹지 말고 고용량을 피하세요. 피로·황달·짙은 소변·오른쪽 윗배 통증이 생기면 즉시 중단하고 진료를 받으세요.","철 결핍성 빈혈이 있거나 임신 중이라면 식사 중·직후의 진한 차는 피하고 1시간 정도 간격을 두세요.","녹차가 일부 약(예: 베타차단제 나돌롤)의 흡수를 크게 떨어뜨린 연구가 있어, 약을 차와 함께 삼키지 않는 것이 좋습니다."],refs:["EFSA ANS Panel. EFSA Journal 2018 — 녹차 카테킨의 안전성에 관한 과학적 의견 (보충제 EGCG 800mg/일 이상에서 간 수치 상승)","Zheng XX, et al. Am J Clin Nutr 2011 — 녹차 섭취와 혈중 총·LDL 콜레스테롤 무작위 대조시험 메타분석","Kuriyama S, et al. JAMA 2006 — 녹차 섭취와 심혈관·전체 사망 (일본 오사키 코호트)","Jurgens TM, et al. Cochrane Database Syst Rev 2012 — 녹차와 체중 감량·유지"]},{id:"curcumin",name:"커큐민",en:"Curcumin",aliases:["강황","울금","터메릭","turmeric","커큐미노이드","curcuminoid","쿠르쿠민","curcumin","강황 보충제"],kind:"폴리페놀",effect:"benefit",tags:["anti-inflammatory","bone-muscle","antioxidant","liver"],summary:"강황(울금) 뿌리줄기의 노란 색소로, 강황 가루 무게의 3% 안팎을 차지합니다. 세포 실험에서는 NF-κB 같은 염증 스위치를 끄는 물질로 유명하지만, 먹으면 거의 흡수되지 않고 곧바로 대사되는 것이 최대 약점입니다. 사람 시험에서는 무릎 골관절염 통증을 소폭 줄였다는 결과가 있는 반면, 보충제와 관련된 간 손상 사례가 드물게 보고되고 있습니다.",pathways:[{title:"흡수의 벽: 매우 낮은 생체이용률",evidence:"strong",steps:[{title:"녹지 않고 불안정",body:"커큐민은 물에 거의 녹지 않고, 장 속 중성~알칼리 환경에서 빠르게 분해됩니다."},{title:"즉시 포합",body:"흡수된 소량도 장벽과 간에서 글루쿠론산·황산이 붙어(포합) 곧바로 활성이 약한 형태로 바뀝니다."},{title:"혈중 농도",body:"하루 수 g을 먹어도 혈중 유리 커큐민은 나노몰(nM) 수준이거나 검출되지 않는 경우가 많습니다. 세포 실험에서 효과를 보인 수~수십 μM과는 큰 차이가 있습니다."},{title:"흡수를 높이는 방법",body:"후추의 피페린은 장·간의 글루쿠론산 포합 효소를 억제해, 사람 연구에서 커큐민 2g에 피페린 20mg을 함께 먹었을 때 생체이용률이 약 20배(2000%) 높아졌습니다. 기름과 함께 먹거나 인지질·미셀 제형으로 만들어도 흡수가 늘어납니다."}]},{title:"염증 스위치(NF-κB) 억제",evidence:"limited",steps:[{title:"세포 실험",body:"커큐민은 IκB 키나아제(IKK)를 억제해 NF-κB가 핵으로 들어가지 못하게 하고, COX-2·iNOS·TNF-α·IL-6 발현을 낮춥니다. STAT3·AP-1·Nrf2 등 수십 가지 표적에 작용한다는 보고가 있습니다."},{title:"비판",body:'반응성이 큰 구조 때문에 실험 도구·단백질에 비특이적으로 달라붙어 "가짜 양성" 결과를 자주 내는 물질(PAINS)로 분류되기도 합니다. 2017년 의약화학 고찰은 커큐민이 불안정하고 흡수가 나빠 약물 후보로 적합하지 않다고 결론 내렸습니다.'},{title:"장 속 국소 작용",body:"흡수되지 않은 커큐민은 장 안에 비교적 높은 농도로 머물러, 장 점막과 장내미생물에 직접 작용할 가능성이 있습니다. 궤양성 대장염에서 표준 치료에 더한 소규모 시험이 이런 가능성을 뒷받침합니다."}]},{title:"무릎 골관절염 통증 완화",evidence:"moderate",steps:[{title:"투여",body:"무릎 골관절염 환자에게 커큐미노이드를 표준화한 강황 추출물을 하루 수백 mg~1g 이상 투여한 시험들이 있습니다."},{title:"작용 추정",body:"관절 활막의 염증 매개물질(PGE2, IL-1β 등)을 줄이는 것으로 추정되지만, 흡수가 낮아 정확한 기전은 불확실합니다."},{title:"결과",body:"메타분석에서 위약보다 통증·기능 점수가 개선됐고, 일부 시험에서는 소염진통제와 비슷한 수준이었습니다. 2021년 호주 무작위 대조시험에서도 12주간 무릎 통증이 위약보다 줄었지만, 관절 삼출·활막염 부피는 차이가 없었습니다."},{title:"한계",body:"시험 규모가 작고 기간이 짧으며 제조사 후원 시험이 많습니다. 연골 구조를 바꾼다는 근거는 없습니다."}]}],evidenceNote:"사람 근거: 무릎 골관절염 통증 완화는 작은 무작위 대조시험 여러 개와 메타분석이 뒷받침하지만 규모와 품질에 한계가 있습니다. 치매·암·우울증 등 다른 질환에 대한 효과는 사람 시험에서 일관되지 않습니다. 기전 연구: 수많은 세포 실험 결과가 있으나 실제 혈중 농도와 동떨어진 농도에서 얻은 것이 많고, 실험 간섭 물질이라는 비판이 있습니다. 음식 양념으로 먹는 강황은 안전하지만, 시험에서 효과를 본 양에는 미치지 못합니다.",facts:["강황 가루 속 커큐미노이드는 약 3% 안팎(대략 2~5%)입니다. 강황 1작은술(약 3g)에는 커큐민이 100mg 안팎이라, 시험에 쓰인 양(하루 500mg~2g)보다 훨씬 적습니다.","카레 가루는 강황 외 향신료가 섞여 있어 커큐민 함량이 강황 가루보다 낮습니다.","커큐민은 빛에 약해 쉽게 바래고, 알칼리(비누 등)에 닿으면 붉은 갈색으로 변합니다.","인도 전통 조리처럼 기름에 볶고 후추와 함께 쓰면 흡수 면에서 유리합니다."],cautions:["강황·커큐민 보충제와 관련된 약물 유발 간 손상 사례가 여러 나라에서 보고됐습니다(2019년 이탈리아 집단 사례, 미국 약물유발간손상 네트워크). 드물지만 흡수를 높인 제형이 위험을 키울 수 있다는 우려도 있으니, 피로·황달·짙은 소변이 생기면 중단하고 진료를 받으세요.","혈소판 기능에 영향을 줄 수 있어 와파린·항혈소판제를 복용 중이거나 수술을 앞두고 있다면 고용량 보충제를 피하세요.","담낭 수축을 촉진하므로 담석이나 담도 폐쇄가 있다면 보충제는 의료진과 상의하세요."],refs:["Shoba G, et al. Planta Med 1998 — 피페린 병용 시 사람에서 커큐민 생체이용률 증가","Nelson KM, et al. J Med Chem 2017 — 커큐민의 의약화학적 한계(불안정성·PAINS) 고찰","Wang Z, et al. Ann Intern Med 2021 — 무릎 골관절염에서 강황 추출물 12주 무작위 대조시험","NIH LiverTox — Turmeric (강황 관련 간 손상 자료)"]},{id:"resveratrol",name:"레스베라트롤",en:"Resveratrol",aliases:["레스베라톨","resveratrol","적포도주","레드와인","레드 와인","프렌치 패러독스","호장근","시르투인","SIRT1","장수 유전자"],kind:"폴리페놀",effect:"mixed",tags:["antioxidant","vascular","energy","anti-inflammatory"],summary:'적포도 껍질·땅콩·베리류에 극미량 들어 있는 스틸벤계 폴리페놀입니다. 2000년대 효모·쥐 실험에서 "장수 유전자(시르투인, SIRT1)를 켠다"며 큰 주목을 받았지만, 이후 사람 대상 시험은 대부분 뚜렷한 효과를 보이지 못했고 SIRT1 활성화 자체에도 반론이 나왔습니다. 와인으로 의미 있는 양을 얻는 것은 불가능합니다.',pathways:[{title:'SIRT1·"장수 유전자" 가설',evidence:"contested",steps:[{title:"시작",body:"2003년 효모 실험에서 레스베라트롤이 시르투인(사람의 SIRT1에 해당)을 활성화하고 수명을 늘린다는 결과가 발표됐습니다."},{title:"기대",body:"SIRT1은 NAD+를 쓰는 탈아세틸화 효소로, PGC-1α를 통해 미토콘드리아 생성을 늘리는 등 열량 제한과 비슷한 효과를 낸다고 기대되었습니다. 고열량 식이를 먹인 쥐의 건강·생존이 개선됐다는 연구도 나왔습니다."},{title:"반론",body:"이후 SIRT1 활성화가 실험에 쓴 형광 표지 기질 때문에 나타난 인공적 결과라는 연구가 나왔고, 파리·선충 수명 연장도 재현되지 않은 경우가 많았습니다. 지금은 포스포디에스테라아제 억제 → AMPK 활성화 같은 간접 경로가 제안됩니다."},{title:"사람에서",body:"건강한 사람이나 비만·당뇨 환자 대상 시험에서 인슐린 감수성·혈압·염증 지표 결과는 엇갈렸고, 대부분 효과가 없거나 작았습니다."}]},{title:"흡수는 잘 되지만 곧바로 대사됨",evidence:"strong",steps:[{title:"흡수",body:"먹은 레스베라트롤의 약 70%는 장에서 흡수됩니다."},{title:"빠른 포합",body:"장벽과 간에서 곧바로 글루쿠론산·황산 포합되어, 혈중에 원형으로 남는 비율(생체이용률)은 1% 미만입니다."},{title:"장내미생물",body:"일부는 대장 미생물이 디하이드로레스베라트롤 등으로 바꿉니다."},{title:"의미",body:"세포 실험에서 쓰인 농도(수~수십 μM)는 식품으로는 도달할 수 없고, 보충제 고용량에서도 원형 농도는 낮습니다."}]},{title:"고용량 보충제가 운동 효과를 둔화시킬 가능성",evidence:"limited",steps:[{title:"운동 적응",body:"운동 중 생기는 적당한 활성산소는 미토콘드리아와 혈관이 적응하도록 만드는 신호로 쓰입니다."},{title:"항산화 보충제의 역설",body:"강한 항산화 보충제가 이 신호를 약하게 만들어 운동 적응을 방해할 수 있다는 가설이 있습니다."},{title:"결과",body:"60대 남성 대상 8주 무작위 대조시험에서 운동과 함께 하루 250mg 레스베라트롤을 먹은 군은 위약군보다 혈압·혈중 지질·최대 산소섭취량 개선이 적었습니다. 소규모 시험 하나의 결과라 일반화에는 한계가 있습니다."}]}],evidenceNote:'사람 근거: 대규모 시험에서 확인된 건강 효과는 없습니다. 이탈리아 노인 코호트(InCHIANTI)에서는 식사로 얻는 레스베라트롤(소변 대사물로 측정) 수준이 염증·심혈관질환·암·사망과 관련이 없었습니다. 동물 연구의 극적인 결과는 사람의 식품 섭취량보다 훨씬 많은 용량에서 나온 것이 대부분입니다. 적포도주의 심혈관 이득("프렌치 패러독스")을 설명하는 데 흔히 쓰이지만, 레스베라트롤 함량이 너무 적어 설명이 되지 않습니다.',facts:["적포도주 1리터에는 대개 수 mg 이하가 들어 있어, 쥐 실험 용량을 사람에게 맞추려면 하루에 와인 수십 병 이상을 마셔야 하는 셈입니다.","보충제 원료는 대부분 포도가 아니라 호장근(Polygonum cuspidatum) 뿌리 추출물입니다.","땅콩·피스타치오·블루베리·다크초콜릿에도 있지만 식품 1회 분량 속 양은 대개 1mg에 한참 못 미칩니다."],cautions:["하루 1g 이상의 고용량 보충제는 설사·복통 같은 위장 증상이 흔합니다.","혈소판 응집 억제와 약물 대사 효소(CYP3A4 등) 억제 작용이 있어, 항응고제·항혈소판제 등 복용 중이라면 보충제 전에 상의하세요.","레스베라트롤을 이유로 술을 마시는 것은 권하지 않습니다. 알코올은 국제암연구소(IARC) 1군 발암물질입니다."],refs:["Howitz KT, et al. Nature 2003 — 레스베라트롤의 시르투인 활성화와 효모 수명 연장 (가설의 출발점)","Walle T, et al. Drug Metab Dispos 2004 — 경구 레스베라트롤의 높은 흡수율과 매우 낮은 생체이용률","Semba RD, et al. JAMA Intern Med 2014 — 식이 레스베라트롤 대사물과 염증·심혈관질환·암·사망 (InCHIANTI)","Gliemann L, et al. J Physiol 2013 — 노년 남성에서 레스베라트롤이 운동 훈련의 심혈관 이득을 둔화"]},{id:"chlorogenic-acid",name:"클로로겐산",en:"Chlorogenic acids",aliases:["클로로젠산","클로로겐산류","CGA","chlorogenic acid","카페오일퀸산","커피 폴리페놀","녹색 커피콩","생두 추출물","green coffee bean"],kind:"폴리페놀",effect:"benefit",tags:["blood-sugar","antioxidant","liver","vascular"],summary:"커피콩에 특히 많고 블루베리·사과·가지·감자에도 있는 페놀산(카페산과 퀸산의 결합체)입니다. 장에서 포도당 흡수를 늦추고 간의 당 생성에 영향을 주는 것으로 보이며, 커피를 많이 마시는 사람에게서 제2형 당뇨가 적은 이유 중 하나로 거론됩니다. 다만 사람 근거는 주로 관찰연구와 단기 시험입니다.",pathways:[{title:"식후 혈당: 장에서 포도당 흡수 늦추기",evidence:"limited",steps:[{title:"소장에서",body:"클로로겐산은 탄수화물 분해효소(α-글루코시다아제)를 약하게 억제하고, 포도당 수송체(SGLT1·GLUT2)를 통한 흡수를 늦추는 것으로 보입니다."},{title:"장 호르몬",body:"흡수가 늦어진 포도당이 소장 아래쪽까지 내려가면서, 인슐린 분비와 포만에 관여하는 장 호르몬(GIP·GLP-1)의 분비 양상이 바뀐다는 사람 연구가 있습니다."},{title:"결과",body:"사람 대상 단기 시험에서 클로로겐산은 경구 포도당 부하 초반의 혈당·인슐린 상승을 다소 완만하게 했습니다. 장기적으로 당화혈색소를 낮춘다는 근거는 아직 부족합니다."}]},{title:"간의 당 생성 조절",evidence:"limited",steps:[{title:"흡수·대사",body:"먹은 클로로겐산의 약 3분의 1은 소장에서 흡수되고, 나머지는 대장에서 장내미생물이 카페산·디하이드로카페산·페룰산 등으로 분해한 뒤 흡수됩니다."},{title:"간 효소",body:"동물·세포 실험에서 클로로겐산은 간이 포도당을 혈액으로 내보내는 마지막 단계인 포도당-6-인산분해효소(G6Pase) 시스템을 억제하고, AMPK를 활성화해 당신생 유전자(PEPCK 등) 발현을 낮춥니다."},{title:"결과",body:"공복 시 간이 내보내는 포도당이 줄어드는 방향으로 작용합니다. 이는 주로 동물 실험에서 확인된 내용입니다."}]},{title:"커피와 제2형 당뇨 위험 (관찰연구)",evidence:"moderate",steps:[{title:"관찰",body:"수십 개의 전향 코호트를 모은 메타분석에서 커피를 많이 마실수록 제2형 당뇨 위험이 낮았고, 하루 한 잔 늘 때마다 위험이 몇 %씩 낮아지는 용량-반응 관계가 나타났습니다."},{title:"디카페인에서도",body:"디카페인 커피에서도 비슷한 경향이 있어, 카페인 외의 성분(클로로겐산, 트리고넬린, 마그네슘 등)이 관여하는 것으로 추정됩니다."},{title:"한계",body:"커피를 마시는 사람과 아닌 사람의 생활습관 차이를 완전히 보정하기 어렵고, 클로로겐산만의 효과로 나누어 볼 수 없습니다."}]}],evidenceNote:'관찰연구: 커피 섭취와 제2형 당뇨 위험 감소의 관련성은 여러 나라에서 일관되며 디카페인에서도 나타납니다. 시험: 클로로겐산의 단기 식후 혈당 완화는 소규모 시험에서 확인됐지만, 장기적인 당뇨 예방 효과는 무작위 시험으로 검증되지 않았습니다. "녹색 커피콩 추출물로 살이 빠진다"는 주장의 대표 근거였던 연구는 철회되었습니다.',facts:["커피 한 잔에 대략 70~350mg이 들어 있어, 커피를 마시는 사람에게는 가장 큰 폴리페놀 공급원입니다.","로스팅할수록 분해되어 약배전 커피에 더 많고 강배전 커피에서는 크게 줄어듭니다. 대신 로스팅 중 일부는 향·색 성분(멜라노이딘)과 락톤으로 바뀝니다.","사과·감자·가지를 자르면 갈색으로 변하는 것은 폴리페놀 산화효소가 클로로겐산 같은 페놀을 산화시키기 때문입니다.","생두(녹색 커피콩) 추출물 체중 감량 연구(2012)는 자료 문제로 2014년 철회되었고, 미국 연방거래위원회(FTC)가 판매사를 제재했습니다."],cautions:["커피로 섭취할 때는 카페인 양을 함께 고려하세요.","커피의 폴리페놀도 식사와 함께 마시면 비헴철 흡수를 떨어뜨립니다. 철 결핍이 있다면 식사와 1시간 정도 간격을 두세요."],refs:["Clifford MN. J Sci Food Agric 1999 — 클로로겐산의 종류·함량과 식이 섭취량","Olthof MR, et al. J Nutr 2001 — 사람에서 클로로겐산·카페산의 흡수 (회장루 환자 연구)","van Dijk AE, et al. Diabetes Care 2009 — 디카페인 커피·클로로겐산·트리고넬린의 급성 포도당 내성 효과","Ding M, et al. Diabetes Care 2014 — 커피 섭취와 제2형 당뇨 위험 (전향 코호트 메타분석)"]},{id:"cocoa-flavanol",name:"코코아 플라바놀",en:"Cocoa flavanols",aliases:["에피카테킨","(-)-에피카테킨","epicatechin","프로시아니딘","procyanidin","카카오 폴리페놀","카카오","코코아","다크초콜릿","다크 초콜릿"],kind:"폴리페놀",effect:"benefit",tags:["vascular","antioxidant","brain"],summary:"카카오콩에 풍부한 에피카테킨과 그 중합체(프로시아니딘)입니다. 에피카테킨은 혈관 내피의 산화질소를 늘려 혈관을 넓히며, 유럽식품안전청(EFSA)은 하루 200mg의 코코아 플라바놀이 혈관 탄력 유지에 도움이 된다는 건강강조표시를 승인했습니다. 다만 대규모 장기 시험(COSMOS)에서 전체 심혈관 사건은 유의하게 줄지 않았고, 초콜릿은 가공 과정에서 플라바놀이 크게 줄어듭니다.",pathways:[{title:"에피카테킨 → 산화질소 → 혈관 확장",evidence:"strong",steps:[{title:"흡수",body:"(-)-에피카테킨은 소장에서 흡수되어 먹은 뒤 약 2시간에 혈중 최고치에 이르고, 곧 글루쿠론산·황산 포합·메틸화된 대사물로 바뀝니다."},{title:"혈관 내피",body:"에피카테킨과 그 대사물은 내피 산화질소합성효소(eNOS)를 활성화하고, 산화질소를 파괴하는 활성산소를 만드는 NADPH 산화효소를 억제하는 것으로 보입니다."},{title:"산화질소 증가",body:"사람 시험에서 고플라바놀 코코아를 마신 뒤 혈중 산화질소 대사물이 늘고, 그 시점에 혈관 확장이 최대가 됐습니다. 순수 에피카테킨만 먹어도 비슷한 효과가 나타나 핵심 활성 성분으로 확인됐습니다."},{title:"결과",body:"혈류매개 혈관확장(FMD)이 일관되게 개선되고, 혈압은 평균 2mmHg 안팎으로 소폭 낮아집니다."}]},{title:"장내미생물 대사: 프로시아니딘 → 발레로락톤",evidence:"limited",steps:[{title:"대장 도달",body:"에피카테킨이 여러 개 이어진 프로시아니딘은 분자가 커서 소장에서 거의 흡수되지 않고 대장까지 내려갑니다."},{title:"미생물 분해",body:"대장 미생물이 이를 쪼개 페닐-γ-발레로락톤과 페놀산 같은 작은 대사물로 만들고, 이들이 흡수되어 혈중에 오래 머뭅니다."},{title:"가능한 작용",body:"이 대사물이 혈관·뇌에 작용할 가능성이 연구되고 있고, 고플라바놀 코코아가 비피도박테리움·락토바실러스 같은 균을 늘렸다는 소규모 사람 연구가 있습니다."}]},{title:"심혈관 사건 예방: 대규모 시험 결과",evidence:"contested",steps:[{title:"시험 설계 (COSMOS)",body:"미국 고령자 약 2만 1천 명에게 코코아 추출물(플라바놀 500mg, 그중 에피카테킨 80mg)이나 위약을 평균 3.6년간 먹게 했습니다."},{title:"주결과",body:"전체 심혈관 사건은 약 10% 적었지만 통계적으로 유의하지 않았습니다."},{title:"이차 결과",body:"심혈관 사망은 약 27% 낮았지만, 이차 결과여서 확정적인 결론으로 보지 않습니다. 같은 시험의 인지 기능 연구에서도 뚜렷한 이득은 없었습니다."},{title:"의미",body:"혈관 기능 개선이 곧바로 심근경색·뇌졸중 예방으로 이어진다고 단정하기 어렵습니다. 추출물 보충과 초콜릿 섭취는 다르며, 초콜릿의 당·열량은 따로 고려해야 합니다."}]}],evidenceNote:"사람 근거: 코코아 플라바놀이 혈관 내피 기능(FMD)을 개선하고 혈압을 소폭 낮춘다는 무작위 대조시험과 메타분석이 일관되며, EFSA가 건강강조표시를 승인했습니다. 대규모 장기 시험 COSMOS에서는 전체 심혈관 사건 감소가 통계적으로 유의하지 않았고, 심혈관 사망 감소는 이차 결과였습니다. 인지 기능 개선은 일부 소규모 시험 결과만 있어 불확실합니다.",facts:["EFSA 건강강조표시 조건은 하루 코코아 플라바놀 200mg입니다. 이는 플라바놀을 보존하도록 특별히 가공한 코코아 가루 약 2.5g 또는 다크초콜릿 약 10g 기준이며, 일반 초콜릿으로는 훨씬 많이 먹어야 합니다.","코코아 가루를 알칼리 처리(더치 프로세스)하면 색이 짙어지고 쓴맛이 줄지만, 처리 강도에 따라 플라바놀이 절반에서 대부분까지 사라집니다. 카카오 발효·로스팅 과정에서도 줄어듭니다.","카카오 함량(%)이 높다고 플라바놀이 많은 것은 아닙니다. 가공 방식에 따라 같은 카카오 함량에서도 몇 배 차이가 납니다."],cautions:["다크초콜릿은 100g당 500kcal가 넘는 고열량 식품이고 당·포화지방도 많습니다. 효과를 기대하고 많이 먹는 것은 권하지 않습니다.","카카오는 토양의 카드뮴·납을 흡수할 수 있어 일부 다크초콜릿 제품에서 중금속 함량이 문제가 된 적이 있습니다. 매일 먹는다면 신뢰할 만한 제품을 고르세요.","테오브로민·카페인이 들어 있어 늦은 시간에 많이 먹으면 수면에 영향을 줄 수 있습니다."],refs:["Schroeter H, et al. PNAS 2006 — (-)-에피카테킨이 코코아의 혈관 기능 개선 효과를 매개함","EFSA NDA Panel. EFSA Journal 2012 — 코코아 플라바놀과 정상 혈관 탄력 유지 건강강조표시","Sesso HD, et al. Am J Clin Nutr 2022 — COSMOS: 코코아 추출물 보충과 심혈관 사건 무작위 대조시험","Hooper L, et al. Am J Clin Nutr 2012 — 초콜릿·코코아·플라바놀과 심혈관 건강 무작위 시험 메타분석"]},{id:"isoflavone",name:"이소플라본",en:"Soy isoflavones",aliases:["제니스테인","다이드제인","글리시테인","genistein","daidzein","에쿠올","equol","식물성 에스트로겐","피토에스트로겐","phytoestrogen","대두 이소플라본","콩 이소플라본"],kind:"폴리페놀",effect:"mixed",tags:["hormone","bone-muscle","cancer","vascular"],summary:"콩(대두)에 특히 많은 식물성 에스트로겐으로, 제니스테인·다이드제인이 대표적입니다. 에스트로겐 수용체 중 β형에 더 잘 붙어 몸의 에스트로겐과 다르게 작용하며, 장내미생물이 다이드제인을 에쿠올로 바꾸는 능력이 사람마다 달라 효과에도 개인차가 큽니다. 갱년기 안면홍조를 소폭 줄이고, 우려와 달리 콩 식품이 유방암 위험을 높인다는 근거는 없습니다.",pathways:[{title:"흡수와 에쿠올 생산 (사람마다 다름)",evidence:"strong",steps:[{title:"식품 속 형태",body:"콩 속 이소플라본은 대부분 당이 붙은 배당체(제니스틴·다이드진)이며, 된장·미소처럼 발효하면 당이 떨어진 아글리콘 비율이 높아집니다."},{title:"흡수",body:"소장의 β-글루코시다아제와 장내미생물이 당을 떼어내면 제니스테인·다이드제인이 흡수되고, 간에서 포합되어 혈액을 돕니다."},{title:"에쿠올 전환",body:"다이드제인은 일부 장내미생물에 의해 에쿠올로 바뀝니다. 에쿠올은 에스트로겐 수용체β에 더 강하게 붙고 더 오래 머뭅니다. 에쿠올을 만드는 사람은 서양 성인의 약 20~30%, 아시아 성인의 약 50~60%로 알려져 있습니다."},{title:"의미",body:"같은 양의 콩을 먹어도 에쿠올 생산 여부에 따라 몸속 활성 물질의 양이 달라, 연구 결과가 엇갈리는 이유 중 하나로 여겨집니다."}]},{title:"에스트로겐 수용체β 선택성과 갱년기 증상",evidence:"moderate",steps:[{title:"수용체 결합",body:"제니스테인의 결합력은 몸의 에스트라디올보다 훨씬 약하지만, 에스트로겐 수용체α보다 β에 약 20배 더 잘 붙습니다."},{title:"조직별 차이",body:"수용체β는 뼈·혈관·뇌 등에 상대적으로 많고, 자궁·유방 세포의 증식에는 주로 α가 관여합니다. 그래서 이소플라본은 조직과 호르몬 환경에 따라 약한 에스트로겐처럼, 또는 에스트로겐을 일부 막는 쪽으로 작용할 수 있습니다."},{title:"갱년기 안면홍조",body:"무작위 대조시험 메타분석에서 하루 약 50mg 이상의 콩 이소플라본은 안면홍조 빈도를 위약보다 약 20%, 강도를 약 26% 더 줄였습니다. 호르몬 치료보다 효과가 작고, 최대 효과까지 수개월이 걸립니다."},{title:"뼈",body:"폐경 여성의 골밀도 감소를 늦췄다는 시험도 있지만 결과가 일관되지 않습니다."}]},{title:"유방암·갑상선·남성 호르몬 우려와 실제 근거",evidence:"moderate",steps:[{title:"우려의 출발",body:'"에스트로겐처럼 작용하니 유방암을 키운다"는 우려는 주로 설치류 실험에서 나왔습니다. 설치류는 사람보다 활성형(포합되지 않은) 이소플라본의 혈중 비율이 훨씬 높아 그대로 적용하기 어렵습니다.'},{title:"사람 코호트",body:"상하이 유방암 생존자 연구 등 아시아 코호트에서 콩 식품을 많이 먹는 여성의 유방암 재발·사망 위험은 오히려 낮았습니다. 주요 암 관련 기관도 콩 식품을 피할 필요는 없다고 봅니다."},{title:"갑상선",body:"이소플라본은 시험관에서 갑상선 과산화효소(TPO)를 억제하지만, 요오드가 충분한 사람의 갑상선 기능에는 대체로 영향이 없었습니다. 요오드가 부족하거나 갑상선기능저하증이 있으면 예외일 수 있습니다."},{title:"남성",body:"무작위 시험 메타분석에서 콩 단백질·이소플라본은 남성의 테스토스테론·에스트로겐 수치에 영향을 주지 않았습니다."}]}],evidenceNote:"비교적 확실한 것: 갱년기 안면홍조 소폭 완화(메타분석), 남성 호르몬에 영향 없음(메타분석), 아시아 코호트에서 콩 식품과 유방암 위험·재발 증가 없음. 불확실한 것: 뼈 건강·인지 기능·심혈관 효과는 결과가 엇갈립니다. 안심할 만한 근거는 대부분 전통 콩 식품에서 나왔으며, 고용량 분리 이소플라본 보충제의 장기 안전성은 상대적으로 덜 알려져 있습니다.",facts:["전통 콩 식품 1회분(두부 약 100g, 두유 한 컵 등)에는 이소플라본이 대략 20~30mg(아글리콘 기준) 들어 있고, 한국·일본 성인은 콩 식품으로 하루 수십 mg을 먹습니다.","콩기름에는 이소플라본이 거의 없고, 간장에도 매우 적습니다.","에쿠올 생산 능력은 장내미생물 구성에 달려 있어 식습관·항생제 사용 등에 따라 달라질 수 있습니다."],cautions:["갑상선호르몬제(레보티록신)를 먹는다면 콩 식품·이소플라본 보충제가 약 흡수를 떨어뜨릴 수 있으니 몇 시간 간격을 두고, 섭취량을 크게 바꾸면 갑상선 수치를 확인하세요.","에스트로겐 수용체 양성 유방암 치료 중(타목시펜·아로마타아제 억제제 등)이라면 고용량 이소플라본 보충제는 피하고 담당 의사와 상의하세요. 일상적인 콩 식품은 대개 괜찮은 것으로 봅니다.","요오드가 부족한 상태에서 콩을 매우 많이 먹으면 갑상선 부담이 커질 수 있습니다."],refs:["Kuiper GG, et al. Endocrinology 1998 — 식물성 에스트로겐의 에스트로겐 수용체β 결합 특성","Taku K, et al. Menopause 2012 — 콩 이소플라본과 갱년기 안면홍조 무작위 대조시험 메타분석","Shu XO, et al. JAMA 2009 — 콩 식품 섭취와 유방암 생존자의 재발·사망 (상하이 유방암 생존 연구)","Hamilton-Reeves JM, et al. Fertil Steril 2010 — 콩 단백질·이소플라본과 남성 생식호르몬 메타분석"]},{id:"ellagitannin",name:"엘라지탄닌·유롤리틴",en:"Ellagitannins and urolithins",aliases:["엘라지탄닌","엘라그산","엘라직산","ellagic acid","퓨니칼라진","푸니칼라진","punicalagin","유롤리틴","유로리틴","유롤리틴 A","urolithin A","석류 폴리페놀"],kind:"폴리페놀",effect:"benefit",tags:["gut","bone-muscle","anti-inflammatory","energy"],summary:"석류·호두·딸기·라즈베리, 오크통에서 숙성한 술에 있는 가수분해형 탄닌입니다. 그대로는 거의 흡수되지 않고, 장내미생물이 엘라그산을 거쳐 유롤리틴으로 바꿔야 흡수됩니다. 유롤리틴 A는 손상된 미토콘드리아를 청소하는 미토파지를 촉진한다는 연구로 주목받지만, 만드는 능력이 사람마다 크게 다르고 사람 근거는 초기 단계입니다.",pathways:[{title:"장내미생물이 만드는 유롤리틴",evidence:"strong",steps:[{title:"섭취",body:"석류의 퓨니칼라진, 호두의 페둔쿨라긴, 딸기·라즈베리의 산귀인 같은 엘라지탄닌은 분자가 커서 그대로는 흡수되지 않습니다."},{title:"가수분해",body:"장 속에서 엘라지탄닌이 분해되어 엘라그산이 나오지만, 엘라그산도 물에 잘 녹지 않아 흡수율이 매우 낮습니다."},{title:"미생물 전환",body:"대장의 특정 세균(고르도니박터, 엘라지박터 등)이 엘라그산의 고리를 열고 수산기를 하나씩 떼어내, 유롤리틴 M5(수산기 5개)에서 시작해 D·C를 거쳐 A(2개)나 B(1개)로 바꿉니다."},{title:"대사형",body:"유롤리틴 A만 만드는 사람(대사형 A), 이소유롤리틴 A·유롤리틴 B까지 만드는 사람(대사형 B), 거의 만들지 못하는 사람(대사형 0)으로 나뉘며, 나이·장내미생물·식습관에 따라 달라집니다."}]},{title:"유롤리틴 A와 미토파지",evidence:"limited",steps:[{title:"흡수",body:"유롤리틴은 대장에서 흡수되어 간에서 대부분 글루쿠론산 포합체로 바뀌며, 섭취 후 하루~이틀에 걸쳐 혈중·소변에서 검출됩니다."},{title:"미토파지 유도",body:"선충·쥐 실험에서 유롤리틴 A는 PINK1-Parkin 경로 등을 통해 손상된 미토콘드리아를 골라 분해하는 미토파지를 촉진했습니다."},{title:"동물에서의 결과",body:"선충의 수명이 늘고, 늙은 쥐의 근지구력이 향상됐습니다."},{title:"사람에서",body:"노인·중년 대상 소규모 무작위 시험에서 정제 유롤리틴 A 보충제(하루 500~1,000mg)가 근육의 미토콘드리아 관련 지표와 일부 근지구력 지표를 개선했지만, 결과가 일관되지 않고 대부분 제조사 후원 연구입니다."}]},{title:"장벽 강화·항염",evidence:"limited",steps:[{title:"장 점막",body:"동물 실험에서 유롤리틴 A는 장 상피의 AhR-Nrf2 경로를 통해 세포 사이를 잇는 치밀결합 단백질을 늘려 장벽을 강화하고 대장염을 완화했습니다."},{title:"염증 신호",body:"대식세포에서 NF-κB 신호와 염증성 사이토카인 분비를 줄인다는 세포 실험이 있습니다."},{title:"사람에서",body:"장 투과성이나 염증성 장질환에 대한 사람 시험 근거는 아직 부족합니다."}]}],evidenceNote:"확실한 것: 엘라지탄닌은 장내미생물을 거쳐 유롤리틴으로 바뀌어 흡수되며, 생산 능력에 큰 개인차가 있습니다. 초기 근거: 유롤리틴 A의 미토파지·근기능 효과는 동물 실험에서 뚜렷하고, 사람에서는 정제 보충제 소규모 시험 몇 개가 있는 단계입니다. 석류 주스의 심혈관·전립선 효과를 보고한 초기 연구들은 규모가 작고 대조군이 약해 확정적이지 않습니다.",facts:["석류는 껍질과 속 막에 퓨니칼라진이 가장 많아, 과일을 통째로 압착한 주스에 알맹이보다 더 많이 들어갑니다.","엘라그산 자체는 시험관에서 강한 항산화제지만 혈중 농도가 매우 낮아, 몸속 효과의 주인공은 유롤리틴으로 봅니다.","같은 양의 석류나 호두를 먹어도 소변 속 유롤리틴 양은 사람에 따라 크게 차이 납니다.","오크통에서 숙성한 와인·위스키의 떫은맛 일부도 나무에서 녹아나온 엘라지탄닌입니다."],cautions:["석류 주스는 당이 많아 과일을 통째로 먹을 때보다 혈당 부담이 큽니다.","석류 주스가 약물 대사 효소에 영향을 준다는 실험 결과와 와파린 복용자의 사례 보고가 있어, 항응고제 복용 중이라면 매일 많은 양을 마시기 전에 상의하세요."],refs:["Ryu D, et al. Nat Med 2016 — 유롤리틴 A의 미토파지 유도와 선충 수명·쥐 근기능 개선","Andreux PA, et al. Nat Metab 2019 — 유롤리틴 A 첫 사람 투여 시험: 안전성과 근육 미토콘드리아 지표","Singh R, et al. Nat Commun 2019 — 유롤리틴 A가 AhR-Nrf2 경로로 장벽을 강화 (동물 실험)"]},{id:"hesperidin",name:"헤스페리딘",en:"Hesperidin",aliases:["헤스페레틴","hesperetin","hesperidin","플라바논","flavanone","감귤 플라보노이드","비타민 P","진피","귤껍질","귤락"],kind:"폴리페놀",effect:"benefit",tags:["vascular","anti-inflammatory","antioxidant"],summary:"오렌지·귤·레몬 같은 감귤류에 가장 많은 플라바논으로, 과육보다 껍질과 하얀 속껍질(알베도)·속 막에 몰려 있습니다. 대장 미생물이 당을 떼어내야 흡수되어 흡수가 늦고 개인차가 크며, 혈관 내피 기능과 혈압을 소폭 개선한다는 사람 시험이 있지만 결과가 일관되지는 않습니다.",pathways:[{title:"대장 미생물을 거치는 늦은 흡수",evidence:"strong",steps:[{title:"식품 속 형태",body:"헤스페리딘은 헤스페레틴에 루티노스(람노스+포도당)가 붙은 형태입니다."},{title:"소장 통과",body:"사람의 소장 효소는 람노스 결합을 끊지 못해 대부분 그대로 대장까지 내려갑니다."},{title:"대장에서 흡수",body:"장내미생물의 α-람노시다아제·β-글루코시다아제가 당을 떼어내면 헤스페레틴이 흡수되어 간에서 포합됩니다. 혈중 최고치는 먹은 뒤 5~7시간에 나타납니다."},{title:"개인차",body:"장내미생물에 따라 흡수량이 사람마다 크게 다릅니다. 효소로 람노스를 미리 떼어낸 형태(헤스페레틴-7-글루코사이드)는 소장에서 흡수되어 더 빠르고 많이 흡수됩니다."}]},{title:"혈관 내피 기능·혈압",evidence:"moderate",steps:[{title:"내피세포 신호",body:"세포 실험에서 헤스페레틴은 Fyn-PI3K-Akt-AMPK 신호를 거쳐 내피 산화질소합성효소(eNOS)를 활성화해 산화질소 생성을 늘립니다."},{title:"대사증후군 환자 시험",body:"3주간 하루 500mg의 헤스페리딘은 위약보다 혈류매개 혈관확장(FMD)을 개선하고 CRP 등 염증 표지를 낮췄습니다."},{title:"오렌지 주스 시험",body:"과체중 중년 남성에서 오렌지 주스와 같은 양의 헤스페리딘은 4주 뒤 이완기 혈압을 낮추고 식후 미세혈관 반응을 개선했습니다."},{title:"관찰연구",body:"대규모 여성 코호트에서 플라바논(주로 감귤류) 섭취가 많을수록 허혈성 뇌졸중 위험이 낮았습니다. 다만 모든 시험에서 효과가 재현된 것은 아닙니다."}]}],evidenceNote:"사람 근거: 소규모 무작위 대조시험에서 혈관 내피 기능과 이완기 혈압 개선이 보고됐고, 관찰연구에서 감귤류 플라바논 섭취가 뇌졸중 위험 감소와 관련됐습니다. 그러나 시험 규모가 작고 결과가 엇갈려 효과 크기는 불확실합니다. 혈당·지질·인지 기능 효과는 주로 동물 실험 단계입니다.",facts:["오렌지 주스 한 컵(약 240ml)에는 헤스페리딘이 대략 수십~100여 mg 들어 있고, 하얀 막과 알베도가 많을수록 늘어납니다. 귤의 하얀 실(귤락)을 떼지 않고 먹는 것이 좋은 이유입니다.","물에 잘 녹지 않아 주스에서는 일부가 과육 침전물로 가라앉습니다. 흔들어 마시면 더 많이 섭취합니다.","말린 귤껍질(진피)은 헤스페리딘 함량이 매우 높아 한약재로 쓰입니다.","디오스민과 헤스페리딘을 섞은 미분화 정제 플라보노이드 분획은 만성 정맥부전·치질 증상에 쓰는 의약품입니다."],cautions:["오렌지 주스 속 플라보노이드(헤스페리딘 등)는 장의 약물 흡수 수송체(OATP)를 억제해 펙소페나딘(알레르기약) 같은 일부 약의 흡수를 줄일 수 있으니, 약은 물로 드세요.","주스보다 과일을 통째로 먹는 쪽이 당 부담이 적고 섬유도 함께 얻습니다."],refs:["Morand C, et al. Am J Clin Nutr 2011 — 헤스페리딘이 오렌지 주스의 혈관 보호 효과에 기여 (무작위 교차시험)","Rizza S, et al. J Clin Endocrinol Metab 2011 — 대사증후군 환자에서 헤스페리딘의 내피 기능·염증 표지 개선","Nielsen IL, et al. J Nutr 2006 — 효소로 람노스를 제거한 헤스페리딘의 생체이용률 향상","Cassidy A, et al. Stroke 2012 — 플라보노이드 섭취와 여성의 뇌졸중 위험 (간호사 건강 연구)"]},{id:"olive-polyphenol",name:"올리브 폴리페놀",en:"Olive polyphenols",aliases:["하이드록시티로솔","히드록시티로솔","hydroxytyrosol","티로솔","올레우로페인","oleuropein","올레오칸탈","oleocanthal","올레아세인","엑스트라버진 올리브유","EVOO"],kind:"폴리페놀",effect:"benefit",tags:["vascular","cholesterol","antioxidant","anti-inflammatory"],summary:"엑스트라버진 올리브유와 올리브 열매에 있는 페놀 화합물로, 하이드록시티로솔·올레우로페인 유도체·올레오칸탈이 대표적입니다. 혈중 LDL이 산화되는 것을 막는 효과로 EFSA 건강강조표시가 승인됐고, 올레오칸탈은 진통소염제 이부프로펜처럼 COX 효소를 억제합니다. 정제 올리브유(퓨어·라이트)에는 거의 남아 있지 않습니다.",pathways:[{title:"LDL 산화 방지 (하이드록시티로솔)",evidence:"strong",steps:[{title:"흡수",body:"하이드록시티로솔과 티로솔은 폴리페놀 중에서는 흡수가 잘 되는 편이며, 올레우로페인 유도체는 위·장에서 분해되어 하이드록시티로솔을 내놓습니다."},{title:"LDL에 결합",body:"흡수된 페놀 일부가 LDL 입자와 함께 이동하며, LDL 속 다불포화지방이 산화되는 연쇄 반응을 초기에 끊습니다."},{title:"사람 시험",body:"유럽 5개국 남성 200명 대상 EUROLIVE 교차시험에서 폴리페놀이 많은 올리브유일수록 HDL이 더 오르고 산화 LDL이 더 많이 줄었습니다."},{title:"공인된 효과",body:'EFSA는 올리브유 20g당 하이드록시티로솔과 그 유도체가 5mg 이상인 제품에 "혈중 지질을 산화 스트레스로부터 보호하는 데 기여한다"는 표시를 허용합니다.'}]},{title:"올레오칸탈의 COX 억제 (이부프로펜 유사)",evidence:"limited",steps:[{title:"발견",body:"신선한 엑스트라버진 올리브유를 삼킬 때 목이 따끔한 느낌이 이부프로펜 시럽과 비슷하다는 관찰에서 출발해, 원인 물질인 올레오칸탈이 밝혀졌습니다."},{title:"목의 수용체",body:"따끔함은 목 부위에 주로 분포하는 자극 감지 수용체 TRPA1이 올레오칸탈에 반응하기 때문입니다. 그래서 입안보다 목에서 느껴집니다."},{title:"효소 억제",body:"시험관에서 올레오칸탈은 이부프로펜처럼 COX-1·COX-2를 억제해 염증 매개물질인 프로스타글란딘 생성을 줄입니다."},{title:"몸속 의미",body:"연구진은 올리브유 50g의 올레오칸탈이 성인 이부프로펜 진통 용량의 약 10%에 해당한다고 추정했습니다. 약처럼 쓸 수준은 아니지만, 매일 오래 먹는 식단의 저강도 항염 효과에 기여할 수 있다는 가설입니다."}]},{title:"지중해식 식단과 심혈관 사건 (PREDIMED)",evidence:"moderate",steps:[{title:"시험",body:"스페인의 심혈관 고위험군 약 7,400명을 지중해식+엑스트라버진 올리브유, 지중해식+견과류, 저지방 식단 권고군으로 나눴습니다. 올리브유군은 가구당 주 1리터의 엑스트라버진 올리브유를 받았습니다."},{title:"결과",body:"약 5년 동안 올리브유군의 주요 심혈관 사건(심근경색·뇌졸중·심혈관 사망)이 대조군보다 약 30% 적었습니다."},{title:"한계",body:"2013년 원 논문은 일부 기관의 무작위 배정 문제로 철회된 뒤 재분석되어 2018년 다시 발표됐고 결론은 유지됐습니다. 올리브유 폴리페놀만이 아니라 식단 전체의 효과입니다."}]}],evidenceNote:"강한 근거: 폴리페놀이 많은 올리브유가 LDL 산화를 줄인다는 무작위 시험(EUROLIVE 등)과 EFSA 건강강조표시. 중간 근거: 엑스트라버진 올리브유를 포함한 지중해식 식단이 심혈관 사건을 줄였다는 PREDIMED 시험(식단 전체의 효과). 초기 근거: 올레오칸탈의 항염·신경보호·항암 효과는 시험관·동물 실험 위주입니다.",facts:["엑스트라버진 올리브유의 폴리페놀은 품종·수확 시기·착유·보관에 따라 kg당 수십 mg에서 1,000mg 이상까지 차이가 큽니다. 쓴맛과 목 따끔함이 강할수록 대체로 많습니다.","정제 올리브유(퓨어·라이트 올리브유, 포마스유)는 정제 과정에서 폴리페놀 대부분이 제거됩니다.","빛·열·공기에 노출되면 점점 줄어듭니다. 어두운 병에 담아 서늘한 곳에 두고, 개봉 후 몇 달 안에 쓰세요.","생올리브는 올레우로페인 때문에 매우 써서 소금물 절임이나 알칼리 처리로 쓴맛을 뺀 뒤 먹습니다. 알칼리 처리는 폴리페놀을 더 많이 줄입니다.","가정 조리 온도의 볶음·부침에는 써도 괜찮습니다. 단일불포화지방과 폴리페놀 덕분에 산화에 비교적 강하지만, 가열하는 동안 폴리페놀 일부는 소모됩니다."],cautions:["올리브유도 1큰술(약 14g)에 약 120kcal입니다. 다른 기름에 더하기보다 대체하는 방식으로 쓰는 것이 좋습니다."],refs:["Covas MI, et al. Ann Intern Med 2006 — 올리브유 폴리페놀 함량과 심혈관 위험 지표 (EUROLIVE 무작위 교차시험)","EFSA NDA Panel. EFSA Journal 2011 — 올리브유 폴리페놀과 LDL 입자의 산화 손상 보호 건강강조표시","Beauchamp GK, et al. Nature 2005 — 엑스트라버진 올리브유의 이부프로펜 유사 활성 (올레오칸탈)","Estruch R, et al. N Engl J Med 2018 — 지중해식 식단과 심혈관질환 1차 예방 (PREDIMED 재분석)"]},{id:"lignan",name:"리그난",en:"Lignans",aliases:["SDG","세코이소라리시레시놀","secoisolariciresinol","엔테로락톤","enterolactone","엔테로디올","세사민","sesamin","세사몰","sesamol","아마씨 리그난","참깨 리그난"],kind:"폴리페놀",effect:"benefit",tags:["hormone","vascular","antioxidant","cancer"],summary:"아마씨에 압도적으로 많고 참깨·통곡물·채소에도 있는 식물성 폴리페놀입니다. 아마씨의 SDG는 장내미생물을 거쳐 약한 에스트로겐 활성을 가진 엔테로락톤으로 바뀌고, 참깨의 세사민·세사몰은 참기름을 산패에 강하게 하고 몸속 비타민 E 분해를 늦춥니다. 사람 근거는 대부분 관찰연구나 소규모 시험입니다.",pathways:[{title:"아마씨 SDG → 엔테로락톤 (장내미생물 전환)",evidence:"limited",steps:[{title:"섭취",body:"아마씨의 리그난은 주로 세코이소라리시레시놀 디글루코사이드(SDG)로, 씨 껍질 쪽에 많습니다. 통째로 삼키면 소화되지 않고 그대로 배출되기 쉬워 갈아 먹어야 합니다."},{title:"미생물 전환",body:'대장 미생물이 당을 떼어내고 메틸기·수산기를 떼는 여러 단계를 거쳐 엔테로디올과 엔테로락톤("장 리그난")을 만듭니다. 이 과정은 전적으로 장내미생물에 달려 있습니다.'},{title:"표적",body:"엔테로락톤은 에스트로겐 수용체에 약하게 결합하고, 세포 실험에서 에스트로겐을 만드는 아로마타아제를 억제하는 등 호르몬 신호를 조절하는 것으로 보입니다."},{title:"결과",body:"관찰연구에서 혈중 엔테로락톤이 높은 폐경 후 여성의 유방암 예후가 좋았다는 보고가 있지만, 엔테로락톤은 식이섬유·채소 섭취와 장 건강을 함께 반영하는 지표라 인과관계는 불확실합니다."}]},{title:"갈은 아마씨와 혈압",evidence:"moderate",steps:[{title:"시험",body:"말초동맥질환 환자가 갈은 아마씨 30g을 6개월간 매일 먹은 캐나다 무작위 시험(FlaxPAD)에서 수축기 혈압이 약 10mmHg, 이완기 혈압이 약 7mmHg 낮아졌습니다."},{title:"기전 추정",body:"혈압 저하는 알파리놀렌산(ALA)에서 유래한 지질 신호물질(옥실리핀)의 변화와 관련이 있었고, 리그난·식이섬유도 함께 기여했을 것으로 봅니다."},{title:"한계",body:"여러 시험을 모은 분석에서도 아마씨는 혈압을 소폭 낮췄지만, 이는 아마씨 전체의 효과이며 리그난만의 효과로 분리되지 않았습니다."}]},{title:"참깨 리그난: 산화 안정성과 비타민 E 보존",evidence:"limited",steps:[{title:"참깨의 리그난",body:"참깨에는 세사민·세사몰린이 있고, 볶거나 정제하는 과정에서 세사몰린 일부가 강한 항산화제인 세사몰로 바뀝니다."},{title:"기름 속에서",body:"세사몰과 볶을 때 생기는 마이야르 반응 산물이 산화를 막아, 참기름은 리놀레산 비율이 높은데도 산패에 비교적 강합니다."},{title:"몸속에서",body:"세사민은 간에서 비타민 E를 분해하는 효소(CYP4F2, 토코페롤 ω-수산화효소)를 억제해, 사람 시험에서 혈중 감마-토코페롤을 높였습니다."},{title:"기타",body:"동물 실험에서 세사민은 지방산 불포화효소(델타-5)를 억제하고 간의 지방산 연소를 늘렸지만, 사람에서의 의미는 불확실합니다."}]}],evidenceNote:"확실한 것: 아마씨 리그난은 장내미생물을 거쳐 엔테로락톤으로 바뀌며, 장내미생물 차이에 따라 생산량이 크게 다릅니다. 사람 근거: 갈은 아마씨의 혈압 저하는 무작위 시험이 있지만 리그난만의 효과는 아닙니다. 유방암·전립선암·심혈관질환과 엔테로락톤의 관련성은 관찰연구마다 결과가 엇갈립니다. 참깨 리그난의 비타민 E 보존 효과는 소규모 사람 시험과 동물 실험 수준입니다.",facts:["아마씨는 100g당 리그난이 수백 mg으로, 다른 식품보다 수십~수백 배 많은 최대 공급원입니다.","아마씨유는 리그난이 대부분 씨 껍질에 남아 적습니다(리그난을 따로 넣은 제품 제외). 리그난을 원하면 갈은 아마씨를 드세요.","갈은 아마씨는 알파리놀렌산이 산화되기 쉬워 밀폐해 냉장·냉동 보관하고, 가능하면 먹기 직전에 가는 것이 좋습니다.","항생제를 쓴 사람은 혈중 엔테로락톤이 한동안 낮다는 관찰이 있어, 장내미생물이 리그난 효과의 열쇠임을 보여 줍니다."],cautions:["아마씨는 섬유가 많아 갑자기 많이 먹으면 복부 팽만이 생길 수 있으니 물과 함께 소량(하루 1~2큰술)부터 시작하세요. 섬유가 약 흡수를 늦출 수 있어 약과는 시간 간격을 두세요.","날 아마씨에는 시안 배당체가 소량 있어, 한꺼번에 많은 양을 날로 먹는 것은 피하세요.","호르몬 민감성 질환(유방암 등)을 치료 중이라면 리그난 보충제는 담당 의사와 상의하세요. 식품으로 먹는 양은 대개 문제가 되지 않는 것으로 봅니다."],refs:["Milder IE, et al. Br J Nutr 2005 — 식물성 식품의 리그난 함량 데이터베이스","Rodriguez-Leyva D, et al. Hypertension 2013 — 갈은 아마씨 6개월 섭취와 혈압 (FlaxPAD 무작위 시험)","Cooney RV, et al. Nutr Cancer 2001 — 참깨 섭취와 사람 혈중 감마-토코페롤 증가","Linus Pauling Institute, Micronutrient Information Center — Lignans"]},{id:"beta-carotene",name:"베타카로틴",en:"Beta-carotene",aliases:["β-카로틴","베타 카로틴","β-carotene","beta carotene","카로틴","carotene","프로비타민 A","provitamin A","카로틴혈증"],kind:"카로티노이드",effect:"mixed",tags:["eye","immune","skin","antioxidant","cancer"],summary:"당근·고구마·호박·시금치의 주황색 색소로, 몸에 필요한 만큼만 비타민 A로 바뀌는 프로비타민 A입니다. 식품으로 먹으면 안전하고 이롭지만, 흡연자에게 고용량 보충제를 준 대규모 시험 두 건에서 폐암이 오히려 늘어, 식품과 보충제를 분명히 구분해야 하는 대표 성분입니다.",pathways:[{title:"필요한 만큼만 비타민 A로 전환 (BCO1)",evidence:"strong",steps:[{title:"흡수",body:"지용성이라 음식 속 지방과 함께 담즙산 미셀에 녹아야 흡수됩니다. 생당근처럼 세포벽에 갇혀 있으면 흡수율이 낮고, 가열·다지기와 기름이 함께하면 크게 늘어납니다."},{title:"장 세포에서 절단",body:"소장 상피세포의 BCO1(베타카로틴 산소화효소 1)이 분자 가운데를 잘라 레티날 2분자를 만들고, 이것이 레티놀(비타민 A)로 바뀌어 간으로 운반·저장됩니다."},{title:"되먹임 조절",body:"비타민 A가 충분하면 레티노산이 전사인자 ISX를 켜서 BCO1과 카로티노이드 흡수 수용체(SR-B1)를 억제합니다. 그래서 식품 베타카로틴을 많이 먹어도 비타민 A 과잉증이 생기지 않습니다."},{title:"개인차",body:"BCO1 유전자의 흔한 변이가 있는 사람은 전환 효율이 낮을 수 있습니다. 전환되지 않은 베타카로틴은 그대로 혈액·지방조직·피부에 쌓입니다."}]},{title:"흡연자의 고용량 보충제와 폐암 증가",evidence:"strong",steps:[{title:"관찰연구의 기대",body:"채소·과일로 베타카로틴을 많이 먹는 사람에게 폐암이 적다는 관찰에서 보충제로 암을 예방하려는 시험이 시작됐습니다."},{title:"ATBC 시험",body:"핀란드 남성 흡연자 약 2만 9천 명에게 하루 20mg을 준 결과, 폐암 발생이 약 18% 늘었습니다."},{title:"CARET 시험",body:"흡연자·석면 노출자에게 베타카로틴 30mg과 비타민 A를 준 결과 폐암이 약 28% 늘어 시험이 조기 중단됐습니다."},{title:"추정 기전",body:"담배 연기의 강한 산화 환경에서 고농도 베타카로틴이 비정상적으로 쪼개져 산화 산물이 생기고, 폐의 레티노산 신호가 흐트러진다는 가설이 족제비(페럿) 실험에서 제시됐습니다."}],note:"비흡연자가 대부분인 시험(미국 의사 건강 연구)에서는 이득도 해도 없었습니다. 식품 속 베타카로틴에서는 이런 위험이 관찰되지 않습니다."},{title:"항산화: 일중항산소 소거",evidence:"limited",steps:[{title:"구조",body:"11개의 공액 이중결합이 들뜬 에너지를 받아들여, 빛을 받은 피부·눈에서 생기는 일중항산소를 열로 바꿔 없앱니다."},{title:"산소 농도의 영향",body:"산소 농도가 낮은 조직에서는 좋은 항산화제지만, 산소 농도가 높으면 스스로 산화되어 항산화력이 떨어지고 산화를 부추길 수도 있다는 화학 연구가 있습니다."},{title:"몸속 의미",body:"식품 카로티노이드가 피부에 쌓여 자외선 홍반을 약간 줄인다는 소규모 시험이 있지만, 자외선차단제를 대신할 수준은 아닙니다."}]}],evidenceNote:"강한 근거: 흡연자·석면 노출자의 고용량 베타카로틴 보충제는 폐암 위험을 높입니다(ATBC·CARET). 비흡연자에게도 보충제의 암·심혈관 예방 효과는 없었습니다. 식품: 채소·과일 속 베타카로틴 섭취와 혈중 농도가 높을수록 여러 만성질환 위험이 낮다는 관찰연구가 많지만, 채소·과일 전체의 효과를 반영할 가능성이 큽니다. 비타민 A 공급원으로서의 역할은 확실합니다.",facts:["비타민 A 환산: 식품 속 베타카로틴 12μg이 레티놀 1μg(RAE)에 해당합니다. 기름에 녹인 보충제 형태는 2μg이 1μg에 해당할 만큼 흡수가 훨씬 좋습니다.","생당근보다 익혀서 기름과 함께 먹은 당근의 흡수율이 높습니다. 무지방 드레싱을 곁들인 샐러드로는 카로티노이드가 거의 흡수되지 않았다는 시험도 있습니다.","당근·귤·호박을 많이 먹어 손바닥·발바닥이 노래지는 카로틴혈증은 무해하며 섭취를 줄이면 서서히 사라집니다. 눈 흰자위는 노래지지 않아 황달과 구별됩니다.","원래 AREDS 눈 영양제에는 베타카로틴이 들어 있었지만, 흡연자 폐암 위험 때문에 AREDS2 처방에서는 루테인·제아잔틴으로 바뀌었습니다."],cautions:["흡연자(최근에 끊은 사람 포함)와 석면 노출자는 베타카로틴 보충제(고용량 종합비타민 포함)를 피하세요. 식품으로 먹는 것은 괜찮습니다.","임신 중 비타민 A를 보충해야 한다면, 고용량일 때 기형 위험이 있는 레티놀보다 베타카로틴 형태가 더 안전합니다."],refs:["Alpha-Tocopherol, Beta Carotene Cancer Prevention Study Group. N Engl J Med 1994 — 흡연 남성에서 알파토코페롤·베타카로틴 보충과 폐암 (ATBC)","Omenn GS, et al. N Engl J Med 1996 — 베타카로틴·비타민 A 보충과 폐암·심혈관질환 (CARET)","Brown MJ, et al. Am J Clin Nutr 2004 — 드레싱의 지방 함량과 샐러드 카로티노이드 흡수","NIH Office of Dietary Supplements — Vitamin A and Carotenoids, Fact Sheet for Health Professionals"]},{id:"lutein",name:"루테인·제아잔틴",en:"Lutein and zeaxanthin",aliases:["루테인","제아잔틴","지아잔틴","lutein","zeaxanthin","메소제아잔틴","meso-zeaxanthin","황반색소","눈 영양제","마리골드","메리골드"],kind:"카로티노이드",effect:"benefit",tags:["eye","antioxidant","brain"],summary:'케일·시금치 같은 짙은 녹색 채소와 달걀노른자·옥수수에 있는 노란 카로티노이드로, 눈의 황반에 선택적으로 모여 "황반색소"를 이룹니다. 청색광을 걸러내고 망막의 산화 손상을 줄이며, 중기 황반변성 환자의 진행을 늦추는 영양제(AREDS2)의 핵심 성분입니다.',pathways:[{title:"황반에 모여 청색광 필터가 됨",evidence:"strong",steps:[{title:"흡수·운반",body:"지용성이라 지방과 함께 미셀에 녹아 흡수되고, 킬로미크론을 거쳐 주로 HDL에 실려 운반됩니다."},{title:"망막으로 선택적 이동",body:"망막에는 루테인 결합 단백질(StARD3)과 제아잔틴 결합 단백질(GSTP1)이 있어, 혈중의 수십 가지 카로티노이드 중 루테인·제아잔틴만 골라 황반 중심부에 혈중보다 훨씬 높은 농도로 모읍니다."},{title:"메소-제아잔틴",body:"황반에서는 루테인 일부가 RPE65 효소에 의해 메소-제아잔틴으로 바뀌어, 시력이 가장 예민한 중심와에 가장 많이 쌓입니다."},{title:"청색광 흡수",body:"황반색소는 약 460nm 파장의 청색광을 가장 잘 흡수해 광수용체에 닿기 전에 상당 부분을 걸러내고, 광수용체 막의 DHA가 일중항산소로 산화되는 것을 막습니다."},{title:"결과",body:"식품이나 보충제로 섭취를 늘리면 황반색소 광학밀도(MPOD)가 수개월에 걸쳐 올라갑니다."}]},{title:"황반변성 진행 억제 (AREDS2)",evidence:"moderate",steps:[{title:"대상",body:"미국 국립안연구소(NEI)가 중기 이상 나이관련 황반변성 환자 약 4,200명을 약 5년간 추적한 무작위 시험입니다."},{title:"비교",body:"기존 AREDS 영양제(비타민 C·E, 아연, 구리, 베타카로틴)에 루테인 10mg·제아잔틴 2mg을 더했을 때의 효과를 비교했습니다."},{title:"결과",body:"전체적으로는 진행 위험이 유의하게 더 줄지 않았지만, 평소 식사로 루테인을 가장 적게 먹던 사람들에게는 이득이 있었습니다. 베타카로틴 대신 루테인·제아잔틴을 넣은 조합이 진행을 약간 더 늦췄고, 과거 흡연자에게서 보인 베타카로틴 관련 폐암 증가도 피할 수 있었습니다."},{title:"적용 범위",body:"이 결과는 중기 이상 황반변성 환자 대상이며, 건강한 사람의 예방 효과는 확인되지 않았습니다."}]},{title:"뇌와 인지 기능",evidence:"limited",steps:[{title:"뇌 축적",body:"루테인은 사람 뇌 조직에서 가장 많이 발견되는 카로티노이드 중 하나로, 신경세포막에 자리 잡습니다."},{title:"간접 지표",body:"황반색소 밀도는 뇌 속 루테인 농도와 관련이 있어, 뇌 루테인을 간접적으로 보여 주는 지표로 쓰입니다."},{title:"결과",body:"황반색소 밀도가 높은 노인일수록 인지 검사 점수가 좋다는 관찰연구와 소규모 보충 시험이 있지만, 치매 예방 효과는 확인되지 않았습니다."}]}],evidenceNote:"강한 근거: 루테인·제아잔틴 섭취를 늘리면 황반색소 밀도가 오릅니다. 중간 근거: 중기 황반변성 환자에게 AREDS2 영양제는 진행 위험을 낮추며, 베타카로틴이 든 예전 처방보다 안전합니다. 불확실: 건강한 사람의 황반변성·백내장 예방, 스마트폰 화면으로 인한 눈 피로 개선, 인지 기능 개선은 관찰연구나 소규모 시험 수준입니다.",facts:["생시금치 100g에 약 12mg이 들어 있고 익힌 케일은 더 많습니다. 달걀 1개에는 수백 μg으로 양은 적지만, 노른자의 지방과 함께 있어 흡수율이 높습니다.","짙은 녹색 채소에서는 엽록소에 가려 노란색이 보이지 않을 뿐이며, 노란 옥수수·주황 파프리카·단호박에도 들어 있습니다.","보충제 루테인은 대부분 마리골드(메리골드) 꽃잎에서 추출합니다."],cautions:["흡연자(과거 흡연자 포함)라면 베타카로틴이 든 예전 AREDS 처방 대신 루테인·제아잔틴이 든 AREDS2 처방이 권고됩니다.","눈 영양제가 황반변성 치료나 정기 안과 검진을 대신하지 못합니다."],refs:["Age-Related Eye Disease Study 2 (AREDS2) Research Group. JAMA 2013 — 루테인·제아잔틴·오메가3와 나이관련 황반변성 무작위 대조시험","Chung HY, et al. J Nutr 2004 — 달걀·시금치·보충제의 루테인 생체이용률 비교","Linus Pauling Institute, Micronutrient Information Center — Carotenoids"]},{id:"lycopene",name:"라이코펜",en:"Lycopene",aliases:["리코펜","lycopene","토마토 색소","토마토 페이스트","토마토소스"],kind:"카로티노이드",effect:"benefit",tags:["antioxidant","cancer","vascular","skin"],summary:"토마토·수박·핑크 자몽·구아바의 붉은 색소로, 비타민 A로 바뀌지 않는 카로티노이드입니다. 생토마토보다 기름에 익힌 토마토소스·페이스트에서 훨씬 잘 흡수되며, 카로티노이드 중 일중항산소를 가장 잘 없앱니다. 전립선암 예방 효과는 관찰연구마다 결과가 달라 확실하지 않습니다.",pathways:[{title:"가열+기름으로 흡수 증가 (시스형 전환)",evidence:"strong",steps:[{title:"식품 속 형태",body:"생토마토의 라이코펜은 대부분 곧게 뻗은 전트랜스형이며, 세포 안에 결정 형태로 단단히 갇혀 있습니다."},{title:"가열",body:"가열하면 세포벽이 무너져 라이코펜이 빠져나오고, 기름과 함께 가열하면 일부가 구부러진 시스형으로 바뀝니다."},{title:"흡수",body:"시스형은 결정을 덜 만들어 담즙산 미셀에 잘 녹고 킬로미크론에 잘 실립니다. 사람 연구에서 토마토 페이스트는 같은 양의 라이코펜을 생토마토로 먹을 때보다 혈중 농도를 훨씬 많이 올렸습니다."},{title:"몸속 분포",body:"혈액과 조직(전립선·고환·간·피부)에서는 라이코펜의 절반 이상이 시스형으로 존재합니다."}]},{title:"일중항산소 소거와 항산화",evidence:"limited",steps:[{title:"구조",body:"양 끝에 고리가 없는 긴 사슬에 11개의 공액 이중결합이 이어져 있습니다."},{title:"소거",body:"시험관에서 카로티노이드 중 일중항산소를 가장 효율적으로 없앱니다. 에너지를 받아 열로 흘려보낸 뒤 원래 상태로 돌아가 여러 번 작용할 수 있습니다."},{title:"몸속 의미",body:"LDL과 피부처럼 지질이 많은 곳에 실려 산화를 줄이는 것으로 추정됩니다. 토마토 페이스트를 10주간 먹은 소규모 시험에서 자외선에 의한 피부 홍반이 줄었지만, 자외선차단제를 대신할 수준은 아닙니다."}]},{title:"전립선암 관련 연구",evidence:"contested",steps:[{title:"조직 축적",body:"라이코펜은 전립선에 특히 많이 쌓이는 카로티노이드입니다."},{title:"제안된 기전",body:"세포 실험에서 라이코펜은 IGF-1 신호를 약화하고, 세포 간 신호 통로(갭 연결, 코넥신 43)를 늘리며, 안드로겐 신호와 세포 증식을 억제했습니다."},{title:"관찰연구",body:"미국 남성 보건전문가 추적연구에서 토마토소스를 자주 먹는 사람의 전립선암 위험이 낮았지만, 다른 코호트에서는 관련이 없거나 약했습니다."},{title:"평가",body:'미국 FDA는 건강강조표시 근거 검토에서 토마토와 전립선암의 관련성 근거는 "매우 제한적"이며, 라이코펜 자체가 암 위험을 낮춘다는 신뢰할 만한 근거는 없다고 결론 내렸습니다.'}]}],evidenceNote:"확실한 것: 가열·기름 조리로 흡수가 크게 늘고, 몸속에서는 시스형 비율이 높아집니다. 엇갈리는 것: 전립선암 위험 감소는 일부 코호트에서만 관찰됐고, 라이코펜 보충제 시험은 뚜렷한 예방 효과를 보이지 못했습니다. 혈중 라이코펜이 높을수록 심혈관질환 위험이 낮다는 관찰연구도 있지만, 토마토를 즐겨 먹는 식습관 전체의 효과일 수 있습니다.",facts:["100g당 대략 생토마토 2.5~3mg, 수박 약 4.5mg, 토마토 페이스트 약 30mg입니다. 구아바·핑크 자몽도 좋은 공급원입니다.","베타카로틴과 달리 양 끝에 고리(β-이오논 고리)가 없어 비타민 A로 바뀌지 않습니다.","완숙할수록, 붉은색이 짙을수록 함량이 높습니다.","토마토 식품을 아주 많이 먹으면 피부가 주황빛을 띠는 라이코펜혈증이 생길 수 있지만 무해하며 되돌릴 수 있습니다."],cautions:["라이코펜 보충제가 토마토 식품만큼의 효과를 낸다는 근거는 부족합니다.","역류성 식도염이 있다면 토마토소스의 산도가 증상을 악화시킬 수 있습니다."],refs:["Gärtner C, et al. Am J Clin Nutr 1997 — 생토마토보다 토마토 페이스트의 라이코펜 생체이용률이 높음","Di Mascio P, et al. Arch Biochem Biophys 1989 — 라이코펜의 일중항산소 소거 능력 (카로티노이드 중 최고)","Giovannucci E, et al. J Natl Cancer Inst 1995 — 카로티노이드·레티놀 섭취와 전립선암 위험 (보건전문가 추적연구)","Kavanaugh CJ, et al. J Natl Cancer Inst 2007 — 미국 FDA의 토마토·라이코펜과 암 건강강조표시 근거 검토"]},{id:"astaxanthin",name:"아스타잔틴",en:"Astaxanthin",aliases:["아스타크산틴","아스타잔친","astaxanthin","헤마토코쿠스","Haematococcus","크릴오일","연어 색소","새우 색소"],kind:"카로티노이드",effect:"benefit",tags:["antioxidant","skin","eye","anti-inflammatory"],summary:"미세조류(헤마토코쿠스 등)가 만들어 먹이사슬을 따라 크릴·새우·게·연어·송어에 쌓이는 붉은 카로티노이드입니다. 양 끝에 극성 고리가 있어 세포막을 가로질러 박히는 독특한 구조로 막의 산화를 막는 것으로 보이지만, 피부·눈 피로·운동 회복 등에 대한 사람 근거는 소규모 시험 수준입니다.",pathways:[{title:"세포막을 가로지르는 항산화 구조",evidence:"limited",steps:[{title:"구조",body:"긴 폴리엔 사슬 양 끝의 고리에 수산기(-OH)와 케톤기(=O)가 있어 양 끝은 물과 친하고, 가운데 사슬은 기름과 친합니다."},{title:"세포막 배치",body:"이 때문에 세포막 지질 이중층을 가로질러, 양 끝은 막의 안팎 표면에 사슬은 막 속에 놓입니다. 막 속과 표면 양쪽에서 라디칼을 붙잡을 수 있습니다."},{title:"막 모델 실험",body:"시험관에서 일중항산소 소거와 지질 과산화 억제 능력이 크고, 막 모델 연구에서 베타카로틴·라이코펜과 달리 막 구조를 흐트러뜨리거나 산화를 부추기지 않았습니다."},{title:"몸속",body:"흡수된 아스타잔틴은 지단백에 실려 운반되며, 소규모 사람 시험에서 LDL이 산화되기까지 걸리는 시간이 늘었다는 보고가 있습니다."}]},{title:"피부·눈·근육에 대한 사람 연구",evidence:"limited",steps:[{title:"흡수",body:"지용성이고 흡수율이 낮아 기름진 식사와 함께 먹을 때 혈중 농도가 더 올라갑니다."},{title:"피부",body:"하루 수~10여 mg을 수주간 먹은 소규모 시험에서 피부 수분·탄력이나 주름 지표가 약간 개선됐다는 결과가 있습니다."},{title:"눈·운동",body:"눈 피로(초점 조절 기능) 개선이나 운동 후 회복 지표 개선을 보고한 소규모 시험들이 있습니다."},{title:"한계",body:"대부분 참가자가 수십 명 수준이고 제조사 후원 연구가 많으며, 결과가 일관되지 않습니다."}]}],evidenceNote:'사람 근거: 산화 스트레스 지표·LDL 산화·피부 지표 개선을 보고한 소규모 무작위 시험이 있지만, 질병 예방이나 운동 능력 향상을 확인한 대규모 시험은 없습니다. "비타민 C의 6,000배 항산화력" 같은 광고 수치는 시험관의 특정 조건(일중항산소 소거)에서 측정한 값으로, 몸속 효과를 뜻하지 않습니다. 안전성은 비교적 양호해, EFSA는 2020년 보충제로 성인 하루 8mg까지 안전하다고 평가했습니다.',facts:["새우·게를 익히면 빨개지는 이유: 살아 있을 때는 아스타잔틴이 단백질(크러스타시아닌)과 결합해 청회색을 띠다가, 가열하면 단백질이 변성되며 원래의 붉은색이 드러납니다.","양식 연어·송어는 사료에 아스타잔틴(합성 또는 미생물 유래)을 넣어 살색을 냅니다. 넣지 않으면 살이 회백색이 됩니다.","보충제는 주로 헤마토코쿠스 조류에서 추출하며, 크릴오일의 붉은색도 아스타잔틴입니다.","사람 몸에서는 비타민 A로 거의 바뀌지 않습니다."],cautions:["보충제 효과를 과장하는 광고가 많습니다. 연어·새우 같은 식품으로 먹으면 오메가3와 단백질도 함께 얻습니다."],refs:["EFSA NDA Panel. EFSA Journal 2020 — 신규식품으로서 아스타잔틴 보충제의 안전성 (성인 8mg/일)","McNulty HP, et al. Biochim Biophys Acta 2007 — 카로티노이드 종류에 따라 다른 세포막 지질 과산화 효과 (막 모델)"]}],Xt=[{id:"sulforaphane",name:"설포라판",en:"Sulforaphane",aliases:["글루코라파닌","글루코라판닌","이소티오시아네이트","미로시나아제","glucoraphanin","isothiocyanate","myrosinase","브로콜리 새싹","브로콜리싹","십자화과"],kind:"유황화합물",effect:"benefit",tags:["antioxidant","anti-inflammatory","liver","cancer"],summary:"브로콜리·양배추·케일·무 같은 십자화과 채소의 유황화합물입니다. 채소 속에는 전구물질(글루코라파닌)로 들어 있다가, 썰거나 씹을 때 효소(미로시나아제)와 만나야 비로소 만들어집니다. 알려진 식이 성분 중 세포의 해독·항산화 효소를 켜는(Nrf2 활성) 힘이 가장 강한 편에 속합니다.",pathways:[{title:"썰거나 씹을 때 만들어지는 성분",evidence:"strong",steps:[{title:"따로 보관된 재료",body:"글루코라파닌(글루코시놀레이트의 일종)과 이를 분해하는 효소 미로시나아제는 식물 세포 안에서 서로 다른 칸에 떨어져 있습니다. 벌레가 잎을 씹을 때 둘이 만나 매운 방어물질이 생기는, 식물의 방어 장치입니다."},{title:"세포가 부서지면 반응",body:"썰기·다지기·씹기로 세포가 부서지면 미로시나아제가 글루코라파닌에서 포도당을 떼어내고, 남은 부분이 재배열되어 이소티오시아네이트인 설포라판이 됩니다."},{title:"가열의 영향",body:"미로시나아제는 열에 약해 오래 삶거나 푹 찌면 활성을 잃습니다. 이때는 대장 세균이 일부를 대신 전환하지만 사람마다 편차가 크고 양도 훨씬 적어, 푹 익힌 브로콜리는 생것이나 살짝 익힌 것보다 설포라판 흡수량이 여러 배 낮았습니다."},{title:"엉뚱한 산물",body:"브로콜리에는 에피티오특이단백질(ESP)도 있어, 반응을 효과가 거의 없는 설포라판 니트릴 쪽으로 돌리기도 합니다. 약 60℃로 살짝 데우면 ESP가 먼저 불활성화되고 미로시나아제는 남아, 설포라판이 오히려 늘어난다는 실험 결과가 있습니다."}]},{title:"Keap1–Nrf2 해독·항산화 스위치",evidence:"moderate",steps:[{title:"흡수·포합",body:"설포라판은 소장에서 빠르게 흡수되어 섭취 후 1~3시간에 혈중 최고치에 이릅니다. 세포 안에서 글루타티온과 결합한 뒤 머캅투르산 경로를 거쳐 대부분 24시간 안에 소변으로 나갑니다."},{title:"Keap1 센서 건드리기",body:"설포라판은 황(티올)과 반응하기 쉬운 친전자성 분자입니다. 평소 Nrf2를 붙잡아 분해시키는 Keap1 단백질의 시스테인 잔기(센서)를 변형해 Nrf2를 놓아주게 만듭니다."},{title:"Nrf2 핵 이동",body:"분해되지 않고 쌓인 Nrf2가 핵으로 들어가 DNA의 항산화반응요소(ARE)에 결합합니다."},{title:"결과",body:"NQO1, 헴산화효소-1(HO-1), 글루타티온 S-전이효소(GST), 글루타티온 합성효소 같은 해독·항산화 효소가 늘어납니다. 사람에게 브로콜리 새싹을 먹인 시험에서도 상기도 점막 세포의 해독효소 증가 같은 생체지표 변화가 관찰됐습니다."}],note:'활성산소를 직접 중화하기보다 세포의 방어 효소를 늘리는 "간접 항산화제"입니다. 설포라판 자체는 하루 안에 배출되지만 늘어난 효소는 그보다 오래 남습니다.'},{title:"대기 오염물질 해독 촉진 (중국 치둥 시험)",evidence:"moderate",steps:[{title:"배경",body:"중국 장쑤성 치둥(Qidong)은 대기오염과 곰팡이독소(아플라톡신) 노출이 많았던 지역입니다."},{title:"개입",body:"주민 약 290명에게 12주 동안 브로콜리 새싹 음료(글루코라파닌·설포라판 함유) 또는 위약 음료를 매일 마시게 했습니다."},{title:"측정",body:"새싹 음료를 마신 사람은 벤젠의 글루타티온 결합 대사물 소변 배출이 약 60%, 아크롤레인 대사물이 약 20% 늘었습니다. 해독 효소가 늘어 오염물질을 더 빨리 포합·배출했다는 뜻입니다."},{title:"해석",body:"해독 속도가 빨라졌다는 생체지표 근거이며, 암이나 질병 발생이 줄었다는 결과는 아닙니다."}]}],evidenceNote:"사람 근거: 브로콜리 새싹·설포라판 음료가 해독효소 발현과 오염물질 배출 같은 생체지표를 바꾼다는 무작위 대조시험이 있습니다. 관찰연구에서 십자화과 채소를 많이 먹는 사람의 일부 암 위험이 낮은 경향이 있으나 일관되지 않고, 설포라판이 암을 예방·치료한다는 사람 시험 근거는 아직 부족합니다. 항암 효과로 알려진 내용의 상당 부분은 세포·동물 연구입니다.",facts:["3일 된 브로콜리 새싹에는 성숙한 브로콜리보다 글루코라파닌이 수십 배(연구에서 10~100배) 많습니다.","브로콜리를 썰어 잠시 두었다가 조리하거나, 푹 익힌 브로콜리에 겨자가루·생무·루콜라처럼 미로시나아제가 살아 있는 재료를 곁들이면 설포라판 생성을 늘릴 수 있습니다.","오래 삶기보다 몇 분 이내로 짧게 찌거나 볶는 편이 효소와 성분을 더 많이 보존합니다. 물에 삶으면 글루코라파닌 자체도 국물로 빠져나갑니다.","시판 냉동 브로콜리는 얼리기 전 데치는 과정에서 미로시나아제가 대부분 불활성화되어 있습니다. 겨자가루 등을 곁들이면 보완할 수 있습니다."],cautions:["새싹 채소는 따뜻하고 습한 환경에서 키워 살모넬라·대장균 오염 사례가 있습니다. 면역저하자·임산부·영유아는 생 새싹을 피하거나 익혀 드세요.","설포라판·브로콜리 추출물 보충제는 제품마다 함량과 전환 효율이 크게 다르고, 식품보다 낫다는 근거는 부족합니다."],refs:["Zhang Y, Talalay P, et al. PNAS 1992 — 브로콜리에서 해독효소 유도물질 설포라판을 분리·구조 규명","Fahey JW, Zhang Y, Talalay P. PNAS 1997 — 브로콜리 새싹의 높은 글루코라파닌 함량","Egner PA, et al. Cancer Prev Res 2014 — 중국 치둥 주민 대상 브로콜리 새싹 음료 무작위 시험 (벤젠·아크롤레인 배출 증가)","Linus Pauling Institute, Micronutrient Information Center — Isothiocyanates"]},{id:"allicin",name:"알리신 (마늘 유황화합물)",en:"Allicin and garlic organosulfur compounds",aliases:["알리신","알린","알리이나아제","아호엔","다이알릴 다이설파이드","DADS","S-알릴시스테인","SAC","흑마늘","숙성마늘","마늘","티오설피네이트","alliin","ajoene","garlic"],kind:"유황화합물",effect:"benefit",tags:["vascular","cholesterol","immune","cancer"],summary:"마늘 특유의 알싸한 향을 내는 유황화합물입니다. 온전한 마늘에는 없고, 으깨거나 썰 때 알린과 효소 알리이나아제가 만나 몇 초 만에 생깁니다. 알리신 자체는 매우 불안정해 곧 여러 다황화물로 바뀌고, 이것이 몸속에서 황화수소(H2S)를 내놓아 혈관을 이완시키는 것으로 보입니다.",pathways:[{title:"으깰 때 생기는 알리신",evidence:"strong",steps:[{title:"세포 속 칸막이",body:"마늘 세포에는 냄새 없는 알린(S-알릴시스테인 설폭사이드)과 이를 분해하는 효소 알리이나아제가 서로 다른 칸에 떨어져 있습니다. 통마늘에서 냄새가 약한 이유입니다."},{title:"으깨기",body:"세포가 부서지면 알리이나아제가 알린을 알릴설펜산으로 바꾸고, 두 분자가 곧바로 결합해 알리신(다이알릴 티오설피네이트)이 됩니다. 반응은 수 초~1분 안에 대부분 끝납니다."},{title:"불안정한 알리신",body:"알리신은 실온에서도 시간이 지나면, 가열하면 훨씬 빨리 다이알릴 다이설파이드(DADS)·트라이설파이드(DATS)·아호엔·비닐다이티인 같은 화합물로 바뀝니다. 기름에 재운 마늘에서는 아호엔이 많이 생깁니다."},{title:"가열 전에 기다리기",body:"알리이나아제는 열과 강한 산에 약합니다. 통마늘이나 으깬 직후의 마늘을 바로 가열하면 효소가 먼저 파괴되어 알리신이 거의 생기지 않습니다. 동물 연구에서 으깬 뒤 10분 두었다가 가열하면 효과가 상당 부분 보존됐습니다."}]},{title:"다황화물 → 황화수소(H2S) → 혈관 이완",evidence:"moderate",steps:[{title:"흡수",body:"알리신 원형은 혈액에서 거의 검출되지 않습니다. 흡수 과정에서 글루타티온 같은 티올과 반응하거나 다황화물로 바뀌어 작용합니다."},{title:"적혈구에서 H2S 생성",body:"DADS·DATS 같은 다황화물이 적혈구 속 글루타티온과 반응하면 황화수소(H2S)가 나옵니다. H2S는 몸이 스스로도 만드는 혈관 신호 기체입니다."},{title:"혈관 평활근",body:"H2S는 혈관 평활근의 ATP 민감성 칼륨 통로(K-ATP)를 열어 세포를 과분극시키고, 산화질소 신호도 도와 혈관을 이완시킵니다."},{title:"결과",body:"고혈압이 있는 사람을 대상으로 한 무작위 시험 메타분석에서 마늘 보충제(주로 숙성마늘 추출물·마늘 분말)가 수축기 혈압을 평균 약 8mmHg 낮췄습니다. 정상 혈압인 사람에서는 효과가 작았습니다."}],note:"숙성마늘 추출물의 주성분은 알리신이 아니라 안정한 수용성 S-알릴시스테인(SAC)이어서, 혈압 효과를 알리신 하나로만 설명하기는 어렵습니다."},{title:"혈소판 응집 억제 (출혈 주의로 이어짐)",evidence:"limited",steps:[{title:"아호엔·다황화물",body:"알리신에서 생긴 아호엔과 다황화물은 시험관에서 혈소판이 서로 엉겨 붙는 반응을 억제합니다."},{title:"기전",body:"혈소판 활성화 신호(트롬복산 생성 등)와 혈소판끼리 피브리노겐으로 연결되는 과정을 방해하는 것으로 보입니다."},{title:"사람에서",body:"보충제 용량에서 출혈 시간이 길어지거나 수술 중 출혈이 늘었다는 사례 보고가 있습니다. 음식 양념으로 먹는 양에서는 대개 문제가 되지 않습니다."},{title:"의미",body:"혈전 예방 목적으로 쓰기엔 근거가 부족하고, 오히려 항응고제·항혈소판제와 겹칠 때 주의할 점이 됩니다."}]}],evidenceNote:"비교적 확실한 것: 마늘 보충제가 고혈압인 사람의 혈압을 소폭 낮춘다는 무작위 시험 메타분석이 있습니다. 엇갈리는 것: 콜레스테롤을 소폭 낮춘다는 메타분석과, 6개월간 생마늘·보충제 모두 LDL을 바꾸지 못한 잘 설계된 시험이 공존합니다. 항균·항암 작용은 대부분 시험관·동물 연구이며, 관찰연구에서 파·마늘류를 많이 먹는 사람의 위암 위험이 낮은 경향이 있지만 인과로 확인되지는 않았습니다. 감기 예방 근거도 부족합니다.",facts:["양파·파·부추의 알싸한 맛과 눈물 성분도 같은 원리입니다. 양파에서는 이소알린이 분해되어 티오설피네이트와 눈물을 나게 하는 성분(프로판티알-S-옥사이드)이 생깁니다.","흑마늘은 고온·다습한 조건에서 숙성시켜 만들며, 알리신은 거의 없고 S-알릴시스테인과 마이야르 반응 산물이 늘어납니다. 생마늘과 성분 구성이 전혀 다릅니다.","마늘 냄새가 다음 날까지 남는 것은 대사산물인 알릴메틸설파이드(AMS)가 천천히 분해되며 폐와 피부로 배출되기 때문입니다.","마늘 보충제는 제품에 따라 알리신 생성 능력이 크게 다릅니다. 위산이 알리이나아제를 불활성화하므로 장용성 코팅 여부도 영향을 줍니다."],cautions:["와파린·아스피린·클로피도그렐 같은 항응고제·항혈소판제를 복용 중이면 마늘 보충제가 출혈 위험을 높일 수 있습니다. 수술 전 1~2주는 보충제를 중단하도록 권고하는 경우가 많습니다.","마늘 보충제가 HIV 치료제 사퀴나비르의 혈중 농도를 크게 낮춘 연구가 있어, 약을 복용 중이면 의료진과 상의하세요.","생마늘을 빈속에 많이 먹으면 속쓰림·위장 자극이 생길 수 있고, 생마늘을 피부에 오래 붙이면 화학적 화상이 생길 수 있습니다."],refs:["Benavides GA, et al. PNAS 2007 — 마늘 유래 다황화물이 적혈구에서 황화수소를 만들어 혈관을 이완","Ried K. J Nutr 2016 — 마늘의 혈압·콜레스테롤 효과 메타분석 (고혈압 환자 수축기 약 8mmHg 저하)","Gardner CD, et al. Arch Intern Med 2007 — 생마늘·마늘 보충제 6개월 무작위 시험, LDL 변화 없음","Song K, Milner JA. J Nutr 2001 — 가열이 마늘의 항암 관련 활성에 미치는 영향 (으깬 뒤 10분 두기, 동물)"]},{id:"dietary-nitrate",name:"식이 질산염",en:"Dietary nitrate",aliases:["질산염","아질산염","산화질소","NO","nitrate","nitrite","nitric oxide","비트 주스","비트즙","비트루트","장-침샘 순환"],kind:"기타 식물성분",effect:"benefit",tags:["vascular","energy","bone-muscle"],summary:"시금치·루콜라·상추·비트·셀러리·배추 같은 채소에 많은 무기 질산염(NO3-)입니다. 몸속에서 입속 세균을 거쳐 아질산염, 다시 산화질소(NO)로 바뀌어 혈관을 넓히고 혈압을 낮춥니다. 가공육의 아질산염과 이름이 비슷하지만, 함께 들어 있는 성분과 몸속에서의 운명이 다릅니다.",pathways:[{title:"질산염 → 아질산염 → 산화질소 (장-침샘 순환)",evidence:"strong",steps:[{title:"흡수",body:"채소 속 질산염은 위와 소장 상부에서 거의 전부 흡수되어 30분~1시간 안에 혈중 농도가 오릅니다."},{title:"침샘 농축",body:"혈중 질산염의 약 25%를 침샘이 적극적으로 끌어모아, 침 속 질산염 농도가 혈중보다 10~20배 높아집니다. 나머지 대부분은 소변으로 배출됩니다."},{title:"혀 세균의 환원",body:"혀 뒤쪽 틈에 사는 세균(베일로넬라·나이세리아·로티아 등)이 질산염 환원효소로 질산염을 아질산염(NO2-)으로 바꿉니다. 사람 몸에는 이 효소가 거의 없어 입속 세균에 의존합니다."},{title:"삼킨 뒤",body:"아질산염이 섞인 침이 위로 내려가면 산성 환경에서 일부가 산화질소로 바뀌어 위 점막 혈류와 점액을 늘리고 세균을 억제합니다. 나머지 아질산염은 흡수되어 섭취 2~3시간 뒤 혈중 농도가 최고에 이릅니다."},{title:"혈관에서 NO",body:"산소가 적거나 산성인 조직에서 탈산소 헤모글로빈·미오글로빈·잔틴산화환원효소가 아질산염을 NO로 되돌립니다. NO는 평활근의 가용성 구아닐산 고리화효소(sGC)를 켜 cGMP를 늘리고 혈관을 이완시킵니다."}],note:"혈관 내피가 아르기닌으로 NO를 만드는 경로(eNOS)가 노화·질병으로 약해질 때, 이 질산염 경로가 보조 공급원 역할을 합니다."},{title:"혈압 저하와 구강청결제의 방해",evidence:"moderate",steps:[{title:"급성 효과",body:"건강한 사람이 비트 주스 500mL를 마시자 2.5~3시간 뒤 혈압이 약 10/8mmHg 내려갔습니다. 침을 삼키지 않고 뱉게 하자 혈중 아질산염 상승과 혈압 저하가 모두 사라져, 입속 세균 단계가 핵심임이 확인됐습니다."},{title:"고혈압 환자",body:"고혈압 환자가 4주간 매일 질산염이 든 비트 주스(250mL)를 마신 무작위 시험에서 수축기 혈압이 약 8mmHg 낮아졌고, 혈관 내피 기능과 동맥 경직도도 개선됐습니다."},{title:"구강청결제",body:"건강한 사람이 7일간 항균 구강청결제(클로르헥시딘)를 쓰자 입속 질산염 환원이 줄고 혈중 아질산염이 떨어지며 혈압이 2~3.5mmHg 올랐습니다."},{title:"의미",body:"혈압 효과는 입속 세균에 달려 있습니다. 강한 살균 구강청결제를 하루 여러 번 쓰는 습관은 이 경로를 약화시킬 수 있습니다."}]},{title:"운동 효율 (산소 비용 감소)",evidence:"moderate",steps:[{title:"근육의 NO 공급",body:"근육, 특히 고강도 운동으로 산소가 부족해지고 산성화된 근육에서 아질산염이 NO로 잘 바뀝니다."},{title:"미토콘드리아·근수축 효율",body:"같은 양의 ATP를 만드는 데 드는 산소가 줄고, 근수축에 드는 ATP 비용도 줄어드는 것으로 보입니다."},{title:"결과",body:"질산염이 든 비트 주스를 며칠 마신 사람은 같은 강도의 운동에서 산소 소비가 몇 % 줄고, 고강도 운동을 버티는 시간이 늘었습니다(무작위 교차시험)."},{title:"한계",body:"이미 잘 훈련된 엘리트 선수에서는 효과가 작거나 없다는 결과가 많습니다."}]}],evidenceNote:'강한 근거: 질산염 → 아질산염 → NO 경로 자체와, 질산염이 풍부한 비트 주스·채소가 혈압을 낮춘다는 무작위 대조시험이 여럿 있습니다. 관찰연구에서도 채소 질산염 섭취가 많을수록 심혈관질환 위험이 낮았습니다. 반면 질산염·아질산염은 특정 조건(가공육, 비타민 C가 부족한 환경)에서 발암성 N-니트로소 화합물을 만들 수 있어, 국제암연구소(IARC)는 "체내 니트로소화가 일어나는 조건에서 섭취한 질산염·아질산염"을 2A군(발암 추정)으로 분류했습니다. 채소 속 질산염은 비타민 C·폴리페놀과 함께 들어와 NO 생성 쪽으로 기울고, 채소 섭취는 전반적으로 위암 위험 감소와 연관됩니다.',facts:["유럽식품안전청(EFSA) 분류로 질산염이 매우 많은 채소(100g당 250mg 초과)는 루콜라·시금치·상추·비트·셀러리 등이고, 배추·대파(리크)·파슬리 등은 그다음(100~250mg)입니다. 재배 계절과 일조량에 따라 몇 배 차이가 납니다.","햇빛이 적은 겨울철·시설 재배 잎채소에 질산염이 더 많이 쌓입니다. 질산염은 물에 녹아 데치거나 삶으면 일부가 물로 빠져나갑니다.","질산염의 1일 섭취 허용량(ADI)은 체중 kg당 3.7mg(질산 이온 기준)이지만, EFSA는 채소 섭취의 이점이 질산염의 잠재적 위험보다 크다고 평가했습니다.","가공육의 아질산염은 고기 단백질의 아민·헴철과 함께 위산 속에서 니트로사민을 만들기 쉽습니다. 채소는 비타민 C·폴리페놀이 아질산염을 NO로 돌려 니트로사민 생성을 억제합니다(→ 아질산염·니트로사민 참고).","비트 주스를 마신 뒤 소변·대변이 붉어지는 것은 색소(베타시아닌) 때문이며 대개 무해합니다."],cautions:["생후 3개월 미만 영아는 위산이 약하고 메트헤모글로빈을 되돌리는 효소 활성이 낮아, 질산염이 많은 지하수로 탄 분유나 오래 보관한 시금치·비트 이유식으로 메트헤모글로빈혈증(청색증)이 생길 수 있습니다.","조리한 질산염 채소를 실온에 오래 두면 세균이 질산염을 아질산염으로 바꿉니다. 빨리 냉장 보관하세요.","질산염 협심증약이나 발기부전 치료제(PDE5 억제제), 혈압약을 복용 중이라면 고농축 비트 분말·질산염 보충제는 혈압 저하가 겹칠 수 있어 의사와 상의하세요."],refs:["Lundberg JO, Weitzberg E, Gladwin MT. Nat Rev Drug Discov 2008 — 질산염-아질산염-산화질소 경로","Webb AJ, et al. Hypertension 2008 — 비트 주스의 급성 혈압 저하와 침 뱉기 실험","Kapil V, et al. Hypertension 2015 — 고혈압 환자 4주 질산염 비트 주스 무작위 시험","Kapil V, et al. Free Radic Biol Med 2013 — 항균 구강청결제가 입속 질산염 환원과 혈압에 미치는 영향"]},{id:"capsaicin",name:"캡사이신",en:"Capsaicin",aliases:["고추","매운맛","캡사이시노이드","캡시에이트","capsaicinoid","TRPV1","청양고추","고춧가루","스코빌"],kind:"기타 식물성분",effect:"mixed",tags:["energy","gut","vascular","cancer"],summary:'고추의 매운맛 성분입니다. 맛 수용체가 아니라 뜨거움을 감지하는 통증 수용체(TRPV1)를 켜서 "화끈한" 느낌을 만듭니다. 에너지 소비를 약간 늘리고, 대규모 관찰연구에서 매운 음식을 자주 먹는 사람의 사망률이 더 낮았지만, 위식도역류·과민성대장이 있는 사람에게는 증상을 악화시킬 수 있습니다.',pathways:[{title:"TRPV1: 뜨거움 센서를 켜는 매운맛",evidence:"strong",steps:[{title:"결합",body:"캡사이신은 입·위장·피부의 감각신경(C섬유) 끝에 있는 TRPV1 이온 통로에 결합합니다. TRPV1은 원래 약 43℃ 이상의 열과 산(酸)을 감지하는 센서입니다."},{title:"신경 흥분",body:'통로가 열리면 칼슘·나트륨 이온이 들어와 신경이 흥분하고, 뇌는 이를 "뜨겁다·아프다"로 인식합니다. 땀·콧물·얼굴 붉어짐이 뒤따릅니다.'},{title:"신경펩타이드 분비",body:"자극된 신경 끝에서 서브스턴스 P와 CGRP가 나와 국소 혈관을 넓히고 점막 혈류를 늘립니다."},{title:"둔감화",body:'반복·고농도로 노출되면 신경 말단이 일시적으로 기능을 잃고 서브스턴스 P가 고갈되어 통증 감각이 둔해집니다. 매운 음식에 "익숙해지는" 이유이자, 고농도 캡사이신 패치가 신경병증 통증 치료제로 쓰이는 원리입니다.'}],note:"TRPV1을 밝힌 연구는 2021년 노벨 생리의학상(데이비드 줄리어스)으로 이어졌습니다."},{title:"교감신경 → 열 생산·식욕",evidence:"moderate",steps:[{title:"흡수",body:"캡사이신은 위·소장에서 잘 흡수되지만 간에서 빠르게 대사되어 혈중 농도는 낮습니다. 작용의 상당 부분은 위장관 신경을 통한 반사로 일어납니다."},{title:"교감신경 활성",body:"위장관의 TRPV1 자극이 신경 반사를 통해 교감신경을 활성화하고 부신에서 아드레날린 분비를 늘립니다."},{title:"열 생산",body:"교감신경 신호가 갈색지방의 UCP1을 활성화하고 지방 분해·지방 산화를 늘려 열을 냅니다."},{title:"결과",body:"사람 시험 메타분석에서 에너지 소비가 하루 수십 kcal(약 50kcal 안팎) 늘고 식욕·섭취량이 약간 줄었습니다. 체중 감량 수단으로 보기엔 작은 효과입니다."}]},{title:"위장관: 궤양 원인은 아니지만 역류·과민성 장은 악화",evidence:"contested",steps:[{title:"궤양과의 관계",body:"위궤양의 주원인은 헬리코박터균과 소염진통제(NSAIDs)입니다. 캡사이신은 CGRP를 통해 위 점막 혈류와 점액·중탄산 분비를 늘려, 동물실험과 소규모 사람 연구에서 알코올·아스피린에 의한 점막 손상을 오히려 줄였습니다."},{title:"식도",body:"위식도역류질환 환자는 식도 점막의 통증 신경이 예민해져 있어 매운 음식이 속쓰림을 쉽게 유발합니다."},{title:"장",body:"과민성대장증후군 환자의 장 점막에는 TRPV1 신경섬유가 늘어나 있다는 보고가 있어 복통·작열감·설사가 악화될 수 있습니다. 반대로 꾸준한 소량 섭취로 둔감화되어 소화불량 증상이 줄었다는 소규모 시험도 있어 개인차가 큽니다."},{title:"위암 연구",body:"일부 한국·멕시코 환자-대조군 연구에서 고추 섭취가 위암 위험과 연관됐지만, 고추장·김치·젓갈처럼 짠 음식과 함께 먹는 식습관과 헬리코박터 감염이 제대로 분리되지 않아 캡사이신 자체의 영향으로 보기는 어렵습니다."}]}],evidenceNote:'사람 근거: 중국 약 49만 명 코호트(China Kadoorie Biobank)에서 매운 음식을 주 6~7일 먹는 사람의 총사망률이 주 1회 미만인 사람보다 약 14% 낮았고, 미국 NHANES 코호트에서도 비슷한 역상관이 나왔습니다. 다만 관찰연구라 생활습관 교란을 배제할 수 없습니다. 열 생산 증가는 무작위 시험 메타분석으로 확인됐지만 크기가 작습니다. "매운 음식이 위궤양을 일으킨다"는 통념은 근거가 약하고, 위암과의 연관은 소금·헬리코박터 교란 때문에 결론이 엇갈립니다.',facts:["캡사이신은 씨 자체보다 씨가 붙은 하얀 태좌(심지)에서 주로 만들어집니다. 씨와 심지를 빼면 매운맛이 크게 줄어듭니다.","캡사이신은 물에 거의 녹지 않고 지방·알코올에 녹습니다. 매울 때 물보다 우유(카제인 단백질과 지방)가 더 효과적인 이유입니다.","매운 정도는 스코빌 지수(SHU)로 나타내며, 순수 캡사이신은 약 1,600만 SHU입니다.","고추에는 캡사이신 외에도 비타민 C(특히 풋고추)와 카로티노이드(붉은 고추의 캡산틴)가 풍부합니다."],cautions:["위식도역류질환·과민성대장증후군·치질이 있으면 매운 음식이 증상을 악화시킬 수 있습니다.",'극단적으로 매운 제품을 한꺼번에 먹는 "매운맛 챌린지" 후 심한 구토·흉통·일시적 뇌혈관 수축으로 응급실을 찾은 사례가 보고됐습니다. 어린이는 특히 주의하세요.',"고추를 만진 손으로 눈·점막을 만지지 마세요. 물로는 잘 씻기지 않으니 비누나 식용유로 닦아내세요."],refs:["Caterina MJ, et al. Nature 1997 — 캡사이신 수용체(TRPV1) 발견","Lv J, et al. BMJ 2015 — 중국 약 49만 명 코호트, 매운 음식 섭취와 사망률","Ludy MJ, Moore GE, Mattes RD. Chem Senses 2012 — 캡사이신·캡시에이트와 에너지 균형 메타분석","Chopan M, Littenberg B. PLoS One 2017 — 미국 NHANES III 고추 섭취와 사망률"]},{id:"gingerol",name:"진저롤·쇼가올",en:"Gingerols and shogaols",aliases:["진저롤","쇼가올","진저론","생강","건강","말린 생강","gingerol","shogaol","zingerone","ginger"],kind:"기타 식물성분",effect:"benefit",tags:["gut","anti-inflammatory","antioxidant"],summary:"생강의 매운맛을 내는 페놀 성분입니다. 생생강에는 진저롤이 많고, 말리거나 가열하면 더 맵고 얼얼한 쇼가올로, 오래 끓이면 순한 진저론으로 바뀝니다. 입덧 같은 메스꺼움 완화는 사람 대상 시험 근거가 비교적 탄탄하고, 항염 효과는 아직 근거가 제한적입니다.",pathways:[{title:"메스꺼움 완화",evidence:"moderate",steps:[{title:"섭취·흡수",body:"진저롤·쇼가올은 소장에서 흡수된 뒤 빠르게 글루쿠론산·황산 포합체로 바뀌어 원형 농도는 낮습니다. 그래서 작용의 상당 부분은 위장관 안에서 일어나는 것으로 봅니다."},{title:"세로토닌(5-HT3) 수용체",body:"구토 반사는 장 크롬친화세포에서 나온 세로토닌이 미주신경의 5-HT3 수용체를 자극하며 시작됩니다. 진저롤·쇼가올은 동물·세포 실험에서 이 수용체를 억제했습니다. 항구토제 온단세트론과 같은 표적입니다."},{title:"위 운동",body:"사람 연구에서 생강이 위 배출을 빠르게 하고 위 전정부 수축을 도와, 음식이 위에 오래 머물며 생기는 메스꺼움을 줄였습니다."},{title:"결과",body:"임신 초기 입덧에 대한 무작위 시험 메타분석에서 하루 약 1g의 생강이 위약보다 메스꺼움을 줄였습니다(구토 횟수 감소는 뚜렷하지 않음). 항암치료 관련 메스꺼움은 결과가 엇갈립니다."}]},{title:"염증 효소 억제",evidence:"limited",steps:[{title:"표적 효소",body:"진저롤·쇼가올은 시험관에서 COX-2와 5-LOX를 억제해 프로스타글란딘·류코트리엔 생성을 줄이고, 염증 전사인자 NF-κB 신호를 약화시킵니다."},{title:"쇼가올의 특성",body:"쇼가올은 반응성 이중결합(α,β-불포화 케톤)이 있어, 세포 연구에서 Nrf2 방어 경로를 켜는 힘이 진저롤보다 강했습니다."},{title:"사람에서",body:"무릎 골관절염 무작위 시험 메타분석에서 생강이 통증을 소폭 줄였고, 소규모 시험들에서 생리통을 진통제와 비슷하게 줄였다는 결과가 있습니다. 다만 시험 규모가 작고 질이 고르지 않습니다."}],note:"소염진통제만큼 강하지는 않고, 음식으로 먹는 양과 추출물 용량 사이의 차이도 큽니다."}],evidenceNote:"비교적 탄탄한 근거: 임신 입덧 완화에 대한 여러 무작위 시험과 메타분석이 있고, 미국산부인과학회(ACOG)도 비약물 선택지로 언급합니다. 수술 후·항암치료 관련 메스꺼움과 멀미는 결과가 엇갈립니다. 항염·항산화·혈당 개선은 세포·동물 연구가 많고 사람 시험은 작고 짧아 제한적인 수준입니다.",facts:["생생강의 주성분은 [6]-진저롤이고, 말리거나 가열하면 물 분자가 빠지며 [6]-쇼가올로 바뀝니다. 말린 생강(건강)이 더 맵고 얼얼한 이유입니다.","오래 끓이면 진저롤 일부가 쪼개져 매운맛이 덜하고 달큰한 향의 진저론이 됩니다.","진저롤과 쇼가올도 고추의 캡사이신 수용체(TRPV1)를 자극해 몸이 따뜻해지는 느낌을 줍니다.","입덧 시험에서는 흔히 생강 가루 하루 약 1g을 몇 번에 나눠 썼습니다."],cautions:["고용량 생강 보충제는 이론적으로 혈소판 기능에 영향을 줄 수 있어, 와파린 등 항응고제 복용자는 의료진과 상의하세요. 음식 양념 정도는 대개 문제가 없습니다.","하루 수 g 이상 먹으면 속쓰림·설사·복부 불편이 생길 수 있습니다.","임신 중에는 음식 수준이나 시험에서 쓴 양(하루 약 1g) 안에서 드시고, 출산이 임박했거나 출혈 위험이 있으면 고용량을 피하세요."],refs:["Viljoen E, et al. Nutr J 2014 — 임신 입덧에 대한 생강의 효과·안전성 메타분석","Bartels EM, et al. Osteoarthritis Cartilage 2015 — 골관절염 환자 대상 생강 무작위 시험 메타분석","NIH National Center for Complementary and Integrative Health (NCCIH) — Ginger"]},{id:"caffeine",name:"카페인",en:"Caffeine",aliases:["커피","에너지음료","아데노신","caffeine","CYP1A2","디카페인","카페인 권장량"],kind:"기타 식물성분",effect:"mixed",tags:["brain","energy","vascular"],summary:"커피·차·초콜릿·에너지음료에 든 각성 성분입니다. 졸음 신호인 아데노신이 수용체에 붙지 못하게 막아 정신을 맑게 하고 운동 능력도 높입니다. 대신 반감기가 3~7시간이라 오후에 마시면 밤잠을 방해하고, 분해 속도가 유전자·흡연·임신에 따라 크게 달라 같은 양에도 반응이 사람마다 다릅니다.",pathways:[{title:"아데노신 수용체 차단 → 각성",evidence:"strong",steps:[{title:"흡수",body:"카페인은 위·소장에서 거의 100% 흡수되어 보통 30~60분(15분~2시간) 안에 혈중 최고치에 이르고, 뇌로 쉽게 들어갑니다."},{title:"졸음 물질 아데노신",body:"깨어 있는 동안 뇌에서 에너지(ATP)가 쓰이면서 아데노신이 쌓이고, 아데노신이 A1·A2A 수용체에 붙으면 신경 활동이 억제되며 졸음(수면 압력)이 커집니다."},{title:"경쟁적 차단",body:"카페인은 아데노신과 모양이 비슷해 수용체 자리를 차지하지만 신호는 내지 않습니다. 억제가 풀리고, 선조체에서 A2A 수용체와 짝을 이루는 도파민 D2 수용체의 신호가 강해집니다."},{title:"결과",body:"각성·집중·반응 속도가 좋아지고 피로감이 줄어듭니다. 체중 kg당 약 3~6mg은 지구력 운동 수행을 높인다는 근거가 탄탄합니다."}],note:"매일 마시면 뇌가 아데노신 수용체를 늘려 적응(내성)합니다. 갑자기 끊으면 12~24시간 뒤부터 두통·졸림·집중력 저하 같은 금단 증상이 며칠 이어질 수 있습니다."},{title:"분해 속도와 수면",evidence:"strong",steps:[{title:"간 대사",body:"카페인의 약 95%는 간의 CYP1A2 효소가 파라잔틴(대부분), 테오브로민, 테오필린으로 분해합니다."},{title:"반감기의 개인차",body:"건강한 성인의 반감기는 약 3~7시간입니다. 흡연은 CYP1A2를 유도해 반감기를 크게 줄이고, 경구피임약은 약 2배로 늘리며, 임신 후기에는 10~15시간까지 길어집니다. CYP1A2 유전자 변이에 따라 빨리 분해하는 사람과 느리게 분해하는 사람이 나뉩니다."},{title:"수면",body:"잠자리에 들기 6시간 전에 카페인 400mg을 먹어도 총수면시간이 1시간 이상 줄었다는 시험이 있습니다. 깊은 잠(서파수면)도 줄어, 본인이 느끼지 못해도 수면의 질이 떨어질 수 있습니다."},{title:"실천",body:"수면이 예민하다면 이른 오후 이후에는 카페인을 피하는 것이 좋습니다. 잠이 부족해 다음 날 카페인을 더 찾는 악순환도 흔합니다."}]},{title:"혈압·심혈관: 급성 상승과 장기 영향",evidence:"moderate",steps:[{title:"급성 반응",body:"고혈압 환자 연구 메타분석에서 카페인 200~300mg은 1시간 안에 혈압을 수축기 약 8mmHg, 이완기 약 6mmHg 올렸고 이 상승은 3시간 이상 이어졌습니다. 아데노신 차단과 교감신경 활성이 원인입니다."},{title:"내성",body:"매일 마시는 사람은 이 혈압 상승 반응이 상당 부분 둔해집니다."},{title:"장기 관찰",body:"커피를 꾸준히 마시는 사람에서 고혈압·심혈관질환 위험이 늘지 않았고, 하루 3~4잔 안팎까지는 오히려 사망·제2형 당뇨 위험이 낮은 쪽과 연관됐습니다. 다만 이는 커피 속 클로로겐산 등 다른 성분의 영향이 섞인 결과입니다(디카페인도 당뇨 위험 감소와 연관)."},{title:"유전형 논쟁",body:'한 환자-대조군 연구에서 CYP1A2 "느린 분해형"은 커피를 많이 마실수록 심근경색 위험이 높았고 "빠른 분해형"은 그렇지 않았습니다. 다른 연구의 재현 결과는 엇갈립니다.'}]}],evidenceNote:"강한 근거: 각성·운동 수행 향상, 수면 방해, 급성 혈압 상승은 무작위 시험으로 확인됐습니다. 관찰연구에서 적당한 커피 섭취는 사망·제2형 당뇨·간질환 위험 감소와 연관되지만, 이는 커피 전체의 효과이며 카페인 단독의 효과로 보기는 어렵습니다. 임신 중 고용량 섭취는 저체중 출생·유산 위험 증가와 연관되어 기관들이 상한을 낮게 권고합니다. 유전형에 따른 심혈관 위험 차이는 아직 논쟁 중입니다.",facts:["식약처 1일 최대 섭취 권고량: 성인 400mg, 임산부 300mg, 어린이·청소년 체중 kg당 2.5mg 이하. 유럽식품안전청(EFSA)은 임산부 하루 200mg, 성인 1회 200mg까지를 안전한 수준으로 봅니다.","대략적 함량: 원두커피 240mL 약 95mg, 카페 아메리카노 1잔은 샷 수에 따라 약 100~200mg 이상, 녹차 1잔 약 20~40mg, 콜라 355mL 약 35mg, 에너지음료 250mL 약 60~100mg.","순수 카페인 분말·고농축 액상은 한 티스푼에 커피 수십 잔 분량이 들어 있어, 미국 FDA가 사망 사례와 함께 경고했습니다.","커피의 이뇨 효과는 규칙적으로 마시는 사람에서 약해, 적당량의 커피는 수분 섭취로 대부분 계산됩니다."],cautions:["불안장애·공황장애·부정맥·위식도역류가 있으면 증상이 악화될 수 있습니다.","항우울제 플루복사민, 항생제 시프로플록사신 같은 CYP1A2 억제 약물은 카페인 분해를 크게 늦춥니다. 기관지확장제 테오필린과는 작용이 겹칩니다.","에너지음료를 술과 섞으면 취한 정도를 덜 느껴 과음하기 쉽습니다."],refs:["Mesas AE, et al. Am J Clin Nutr 2011 — 고혈압 환자의 커피·카페인과 혈압 메타분석","Drake C, et al. J Clin Sleep Med 2013 — 취침 0·3·6시간 전 카페인 섭취와 수면","Cornelis MC, et al. JAMA 2006 — 커피, CYP1A2 유전형과 심근경색 위험","EFSA NDA Panel 2015 — Scientific Opinion on the safety of caffeine"]},{id:"beta-glucan",name:"베타글루칸",en:"Beta-glucan",aliases:["베타 글루칸","β-글루칸","beta-glucan","β-glucan","귀리","오트밀","오트브랜","보리","수용성 식이섬유","버섯 베타글루칸","렌티난","덱틴-1"],kind:"식이섬유·탄수화물",effect:"benefit",tags:["cholesterol","blood-sugar","gut","immune"],summary:"귀리·보리에 많은 수용성 식이섬유로, 물을 만나면 끈적한 젤이 됩니다. 이 점성이 장에서 담즙산을 붙잡아 LDL 콜레스테롤을 낮추고 식후 혈당 상승을 완만하게 합니다. 하루 3g 섭취 시 콜레스테롤 저하 효과는 미국 FDA와 유럽 EFSA가 건강강조표시를 인정할 만큼 근거가 탄탄합니다. 버섯의 베타글루칸은 구조와 작용이 다릅니다.",pathways:[{title:"담즙산 배출 → 간의 콜레스테롤 소모 → LDL 저하",evidence:"strong",steps:[{title:"점성 젤 형성",body:"귀리·보리 베타글루칸(β-1,3/β-1,4 결합이 섞인 사슬)은 소장에서 물을 흡수해 장 내용물의 점도를 높입니다."},{title:"담즙산 재흡수 차단",body:"간이 콜레스테롤로 만든 담즙산은 원래 95% 가까이가 소장 끝(회장)에서 재흡수되어 간으로 돌아갑니다(장간 순환). 끈적한 젤이 담즙산을 붙잡아 재흡수를 줄이고 대변으로 더 많이 내보냅니다."},{title:"간의 보충 생산",body:"담즙산이 모자라면 간은 CYP7A1(콜레스테롤 7α-수산화효소)을 늘려 콜레스테롤로 새 담즙산을 만듭니다. 그만큼 간세포 속 콜레스테롤이 줄어듭니다."},{title:"LDL 수용체 증가",body:"콜레스테롤이 부족해진 간세포는 SREBP-2 신호로 LDL 수용체를 늘려 혈중 LDL을 더 많이 거둬들입니다."},{title:"결과",body:"무작위 시험 메타분석에서 귀리 베타글루칸 하루 3g 이상이 LDL을 평균 약 0.25mmol/L(약 10mg/dL, 대략 5~7%) 낮췄습니다."}]},{title:"식후 혈당 완만",evidence:"strong",steps:[{title:"위 배출 지연",body:"점성이 위에서 소장으로 음식이 넘어가는 속도를 늦춥니다."},{title:"흡수 속도 저하",body:"소장에서 소화효소(아밀라아제)가 전분과 섞이고, 만들어진 포도당이 장벽까지 퍼져 나가는 속도가 느려집니다."},{title:"결과",body:"식후 혈당·인슐린 최고치가 낮아집니다. 탄수화물 30g당 베타글루칸 약 4g을 함께 먹을 때 효과가 확인되어 EFSA가 표시를 인정했습니다."}],note:"분자량과 점성이 효과를 좌우합니다. 가공 과정(고온·효소 처리, 곱게 분쇄, 반죽 발효)에서 베타글루칸 사슬이 잘리면 효과가 줄 수 있습니다."},{title:"버섯·효모 베타글루칸과 면역 (구조가 다름)",evidence:"limited",steps:[{title:"다른 구조",body:"버섯·효모의 베타글루칸은 β-1,3 주사슬에 β-1,6 곁가지가 붙은 구조로, 귀리·보리의 것과 다릅니다."},{title:"면역세포 인식",body:"대식세포·수지상세포 표면의 덱틴-1(Dectin-1) 수용체가 이 구조를 곰팡이 세포벽처럼 인식해 면역 신호(Syk 경로)를 켭니다."},{title:"장 면역",body:"동물 연구에서 먹은 입자형 베타글루칸이 소장 파이어판의 M세포를 통해 면역세포와 만나는 것으로 보입니다."},{title:"사람에서",body:"효모 베타글루칸이 상기도 감염 증상을 줄였다는 소규모 시험이 있지만 일관되지 않습니다. 표고버섯 렌티난은 일본에서 주사제로 위암 항암 보조요법에 쓰였지만, 먹는 버섯·보충제의 면역·항암 효과는 입증되지 않았습니다."}]}],evidenceNote:'강한 근거: 귀리·보리 베타글루칸 하루 3g이 LDL 콜레스테롤을 낮춘다는 것은 수십 건의 무작위 시험과 메타분석으로 확인되어, FDA(1997년 귀리, 이후 보리)와 EFSA가 건강강조표시를 인정했습니다. 식후 혈당 완화도 일관됩니다. 제한적인 것: 버섯·효모 베타글루칸의 "면역 강화"는 주로 세포·동물 연구이며, 사람에서의 효과는 작거나 불확실합니다.',facts:["베타글루칸 함량(대략): 귀리 약 3~6%, 보리는 품종에 따라 약 2~10%입니다. 미국 기준 오트브랜은 베타글루칸 5.5% 이상이어야 합니다.","하루 3g은 건조 귀리 약 70~80g(오트밀 한 그릇 반 정도)에 해당해, 한 끼로 채우기보다 보리·귀리를 여러 끼에 나눠 먹는 편이 현실적입니다.","보리밥·귀리밥이 흰쌀밥보다 식후 혈당을 덜 올리는 이유 중 하나가 베타글루칸입니다.","귀리 음료(오트밀크)는 제조 중 효소 처리와 여과를 거쳐 베타글루칸 함량과 분자량이 제품마다 크게 다릅니다."],cautions:["섭취를 갑자기 늘리면 복부 팽만·가스가 생길 수 있으니 서서히 늘리고 물을 충분히 드세요.","섬유가 많은 식사는 갑상선호르몬제 같은 일부 약의 흡수를 늦출 수 있어, 약은 식사와 시간 간격을 두고 복용하세요."],refs:["Whitehead A, et al. Am J Clin Nutr 2014 — 귀리 베타글루칸의 콜레스테롤 저하 무작위 시험 메타분석","U.S. FDA, 21 CFR 101.81 — 특정 식품의 수용성 식이섬유와 관상동맥질환 위험 건강강조표시","EFSA NDA Panel 2010·2011 — 귀리·보리 베타글루칸의 혈중 콜레스테롤·식후 혈당 건강강조표시 과학적 의견"]},{id:"prebiotic-fiber",name:"발효성 식이섬유 (프리바이오틱스)",en:"Fermentable fiber (prebiotics)",aliases:["프리바이오틱스","이눌린","프럭토올리고당","FOS","갈락토올리고당","GOS","펙틴","짧은사슬지방산","단쇄지방산","SCFA","부티르산","낙산","inulin","prebiotics","식이섬유"],kind:"식이섬유·탄수화물",effect:"benefit",tags:["gut","immune","blood-sugar","anti-inflammatory"],summary:"사람의 소화효소로는 분해되지 않고 대장까지 내려가 장내 미생물의 먹이가 되는 식이섬유입니다. 양파·마늘·우엉·돼지감자의 이눌린·프럭토올리고당, 사과·귤의 펙틴, 콩의 갈락토올리고당 등이 대표적입니다. 미생물이 이를 발효해 만든 짧은사슬지방산이 대장 세포의 연료가 되고, 면역·식욕·혈당 신호로 작용합니다.",pathways:[{title:"발효 → 짧은사슬지방산 → 대장 세포 연료·장벽",evidence:"moderate",steps:[{title:"소화되지 않고 통과",body:"이눌린·프럭토올리고당의 β-2,1 결합이나 펙틴의 구조는 사람 소화효소가 끊지 못해, 소장을 그대로 지나 대장에 도착합니다."},{title:"미생물 발효",body:'비피도박테리움 같은 세균이 이를 분해하고, 그 산물을 다른 세균(페칼리박테리움 등)이 이어받는 "교차 먹이 주기"를 거쳐 아세트산·프로피온산·부티르산이 대략 60:20:20 비율로 만들어집니다.'},{title:"대장 세포의 연료",body:"대장 상피세포는 에너지의 상당 부분(약 70%로 추정)을 부티르산에서 얻습니다. 부티르산을 태우며 산소를 소모해 장 안을 무산소 상태로 유지하는데, 이것이 유익한 혐기성 세균에게 유리한 환경을 만듭니다."},{title:"장벽 강화",body:"부티르산은 치밀결합 단백질과 점액(MUC2) 생산을 늘리고, 짧은사슬지방산은 장 내용물을 약산성으로 만들어 병원성 세균의 증식을 억제합니다."}]},{title:"장 호르몬 → 식욕·혈당",evidence:"moderate",steps:[{title:"L세포의 감지",body:"대장의 내분비 L세포가 GPR41(FFAR3)·GPR43(FFAR2) 수용체로 짧은사슬지방산, 특히 프로피온산을 감지합니다."},{title:"호르몬 분비",body:"GLP-1과 PYY가 분비되어 포만감을 높이고, 위 배출을 늦추며, 인슐린 분비를 돕습니다."},{title:"사람 시험",body:"프로피온산을 대장에 직접 전달하는 물질을 24주간 먹은 과체중 성인은 GLP-1·PYY 분비가 늘고 체중 증가가 더 적었습니다."},{title:"결과",body:"식이섬유가 많은 식단은 제2형 당뇨·심혈관질환 위험 감소와 일관되게 연관되며, 이 장 호르몬 신호가 설명 중 하나입니다."}]},{title:"짧은사슬지방산 → 면역 조절",evidence:"limited",steps:[{title:"수용체",body:"짧은사슬지방산은 장 상피와 면역세포의 GPR43·GPR41·GPR109A 수용체에 결합합니다."},{title:"후성유전 조절",body:"부티르산은 히스톤 탈아세틸화효소(HDAC)를 억제해, 면역을 가라앉히는 전사인자 Foxp3 유전자가 켜지기 쉽게 만듭니다."},{title:"조절 T세포 증가",body:"생쥐 연구에서 부티르산이 대장의 조절 T세포(Treg) 분화를 늘려 대장염을 줄였습니다."},{title:"사람에서",body:"섬유 섭취가 많은 사람에서 염증 지표가 낮은 경향이 있지만, 프리바이오틱스 보충이 자가면역·알레르기 질환을 예방한다는 사람 근거는 아직 부족합니다."}]}],evidenceNote:"확실한 것: 이눌린·프럭토올리고당이 장내 비피도박테리아를 늘리고, 식이섬유 섭취가 많을수록(하루 25~29g 이상) 사망·심혈관질환·제2형 당뇨·대장암 위험이 낮다는 대규모 메타분석이 있습니다. 치커리 이눌린(하루 12g)의 배변 횟수 증가는 EFSA가 인정했습니다. 제한적인 것: 짧은사슬지방산을 통한 면역 조절(조절 T세포)은 주로 동물 연구이며, 특정 프리바이오틱스 보충제가 사람 질병을 예방한다는 근거는 아직 적습니다.",facts:["이눌린·프럭토올리고당이 많은 식품: 치커리 뿌리, 돼지감자, 우엉, 양파, 마늘, 대파, 아스파라거스, 덜 익은 바나나.","이눌린형 프럭탄은 대장을 약산성으로 만들어 칼슘 흡수를 늘린다는 청소년 대상 무작위 시험이 있습니다.","식약처 1일 영양성분 기준치는 식이섬유 25g입니다.","모유 속 올리고당(HMO)은 아기 장의 비피도박테리아를 키우는 천연 프리바이오틱스입니다."],cautions:["이눌린·프럭토올리고당·갈락토올리고당은 FODMAP에 속해, 과민성대장증후군이 있으면 가스·복부팽만·복통이 심해질 수 있습니다. 증상이 있으면 소량부터 시작하세요.","보충제로 하루 수십 g을 갑자기 먹으면 대부분의 사람에게 가스·설사가 생깁니다. 식품으로 서서히 늘리는 편이 좋습니다."],refs:["Gibson GR, et al. Nat Rev Gastroenterol Hepatol 2017 — 국제 프로바이오틱스·프리바이오틱스 학회(ISAPP)의 프리바이오틱스 정의 합의","Furusawa Y, et al. Nature 2013 — 장내 세균 유래 부티르산이 대장 조절 T세포 분화를 유도 (생쥐)","Chambers ES, et al. Gut 2015 — 프로피온산을 대장에 전달한 과체중 성인 24주 무작위 시험","Reynolds A, et al. Lancet 2019 — 탄수화물의 질(식이섬유·통곡물)과 비감염성 질환 메타분석"]},{id:"resistant-starch",name:"저항성 전분",en:"Resistant starch",aliases:["저항 전분","난소화성 전분","RS","노화 전분","식은 밥","찬밥","초록 바나나","고아밀로스","resistant starch","retrograded starch"],kind:"식이섬유·탄수화물",effect:"benefit",tags:["gut","blood-sugar"],summary:"소장에서 소화되지 않고 대장까지 가는 전분으로, 식이섬유처럼 작용합니다. 익힌 밥·감자·파스타를 식히면 전분 사슬이 다시 뭉쳐(노화) 저항성 전분이 늘어나고, 다시 데워도 일부는 남습니다. 대장 세균이 이를 발효해 부티르산을 많이 만듭니다. 다만 식은 밥으로 늘어나는 양은 크지 않아 효과도 적당히 기대해야 합니다.",pathways:[{title:"익혔다 식히면 늘어나는 이유 (호화와 노화)",evidence:"strong",steps:[{title:"날 전분",body:"생전분은 아밀로스·아밀로펙틴 사슬이 촘촘한 결정 알갱이를 이루어 소화효소가 잘 파고들지 못합니다(RS2: 생감자, 초록 바나나, 고아밀로스 옥수수)."},{title:"호화",body:"물과 함께 가열하면 알갱이가 부풀고 결정이 풀려(호화) 아밀라아제가 쉽게 분해합니다. 갓 지은 밥이 빨리 소화되는 이유입니다."},{title:"노화(재결정화)",body:"식히면, 특히 냉장 온도(약 4℃)에서 곧은 사슬인 아밀로스끼리 이중나선으로 다시 뭉쳐 효소가 풀지 못하는 결정(RS3)이 생깁니다. 밥이 굳고 떡이 딱딱해지는 것과 같은 현상입니다."},{title:"재가열",body:"노화된 아밀로스 결정은 100℃보다 높은 온도에서야 풀리는 편이라, 전자레인지로 다시 데워도 저항성 전분이 상당 부분 남습니다. 냉장 후 데운 밥에서 저항성 전분이 늘고 혈당 반응이 약간 낮았다는 소규모 사람 연구가 있습니다."}],note:'늘어나는 양은 밥 100g당 대략 1g 안팎이라, 식은 밥이 "다이어트 밥"이 되는 것은 아닙니다. 밥의 양과 반찬 구성이 더 중요합니다.'},{title:"대장 발효 → 부티르산",evidence:"moderate",steps:[{title:"대장 도착",body:"저항성 전분은 소장에서 흡수되지 않고 대장에 도착합니다."},{title:"핵심 분해자",body:"루미노코쿠스 브로미(Ruminococcus bromii) 같은 특정 세균이 먼저 결정 전분을 분해하고, 풀려난 당을 다른 세균이 받아 씁니다."},{title:"부티르산 생성",body:"다른 식이섬유에 비해 부티르산을 많이 만드는 편입니다. 부티르산은 대장 세포의 주 연료이자 항염 신호입니다(→ 프리바이오틱스 참고)."},{title:"개인차",body:"장에 이런 분해 세균이 적은 사람은 저항성 전분을 먹어도 부티르산이 잘 늘지 않았습니다."}]},{title:"식후 혈당과 인슐린 감수성",evidence:"moderate",steps:[{title:"식후 혈당",body:"같은 무게의 전분 중 일부가 소화되지 않으므로 식후 혈당·인슐린 상승이 줄어듭니다. EFSA는 빵 등에서 전분의 14% 이상을 저항성 전분으로 바꾸면 식후 혈당 반응이 낮아진다는 표시를 인정했습니다."},{title:"두 번째 식사 효과",body:"저녁에 먹은 발효성 탄수화물이 다음 날 아침 식사의 혈당 반응까지 낮춘다는 연구가 있습니다. 대장 발효 산물과 장 호르몬이 매개하는 것으로 추정합니다."},{title:"인슐린 감수성",body:"하루 15~30g의 저항성 전분(주로 고아밀로스 옥수수 전분 보충)을 몇 주 먹은 시험에서 인슐린 감수성이 개선됐지만, 연구마다 결과가 일정하지는 않습니다."}]}],evidenceNote:"확실한 것: 조리·냉각에 따라 저항성 전분 양이 변하는 원리(호화·노화)와, 저항성 전분이 식후 혈당 반응을 낮춘다는 점(EFSA 인정). 중간 수준: 고용량 보충(하루 15~30g) 시험에서 인슐린 감수성 개선이 관찰됐으나 연구마다 엇갈립니다. 식은 밥·감자처럼 일상 조리로 얻는 양은 보충 시험보다 훨씬 적어, 효과도 작다고 보는 것이 정직합니다.",facts:["종류: RS1(통곡물·콩의 세포벽에 갇힌 전분), RS2(생감자·초록 바나나의 날 전분 알갱이), RS3(익혔다 식힌 노화 전분), RS4(화학적으로 변형한 가공 전분).","아밀로스가 많을수록 노화가 잘 일어나 저항성 전분이 늘어납니다. 아밀로펙틴이 대부분인 찹쌀·찰떡은 노화가 느리고, 멥쌀과 고아밀로스 품종이 유리합니다.","바나나는 익을수록 전분이 당으로 바뀌어 저항성 전분이 크게 줄어듭니다.","콩·렌틸·통곡물은 조리 후에도 세포벽에 갇힌 전분(RS1)이 남아 좋은 공급원입니다."],cautions:["밥을 실온에 오래 두면 바실루스 세레우스균 포자가 싹터 열에 강한 구토 독소를 만듭니다. 이 독소는 다시 데워도 파괴되지 않으니, 식힐 밥은 1~2시간 안에 냉장하고 하루 이틀 안에 드세요.","저항성 전분 보충제를 갑자기 많이 먹으면 가스·복부팽만이 생길 수 있습니다.","당뇨가 있다면 식은 밥도 탄수화물이므로 양 조절이 먼저입니다."],refs:["Englyst HN, Kingman SM, Cummings JH. Eur J Clin Nutr 1992 — 영양학적으로 중요한 전분 분획(저항성 전분)의 분류와 측정","Robertson MD, et al. Am J Clin Nutr 2005 — 저항성 전분의 인슐린 감수성 개선 효과","Ze X, et al. ISME J 2012 — 사람 대장에서 저항성 전분 분해의 핵심 세균 Ruminococcus bromii","EFSA NDA Panel 2011 — 저항성 전분과 식후 혈당 반응 감소 건강강조표시 과학적 의견"]},{id:"seaweed-polysaccharide",name:"해조 다당류 (알긴산·후코이단)",en:"Seaweed polysaccharides (alginate, fucoidan)",aliases:["알긴산","알긴산나트륨","후코이단","라미나린","한천","아가","카라기난","포르피란","미역귀","해조류 식이섬유","alginate","fucoidan","agar","carrageenan"],kind:"식이섬유·탄수화물",effect:"benefit",tags:["gut","blood-sugar","immune","cancer"],summary:'미역·다시마·톳 같은 갈조류의 알긴산·후코이단, 김·우뭇가사리 같은 홍조류의 포르피란·한천 등 해조류 특유의 다당류입니다. 대부분 소화되지 않는 식이섬유로 작용해 장에서 점성 젤을 만들고, 일부는 장내 세균이 발효합니다. "후코이단 항암" 같은 주장은 대부분 시험관·동물 결과이고 사람 근거는 부족합니다.',pathways:[{title:"알긴산: 위장에서 젤 → 포만감·흡수 지연",evidence:"limited",steps:[{title:"구조",body:'알긴산은 만누론산과 글루론산이 이어진 사슬로, 칼슘 같은 2가 양이온을 만나면 "달걀판(egg-box)" 구조로 엮여 젤이 됩니다.'},{title:"위에서 젤",body:"위산과 음식 속 칼슘을 만나 젤을 형성하면 위 배출이 늦어지고 포만감이 늘 수 있습니다. 알긴산 젤이 위 내용물 위에 떠서 막을 만드는 원리는 역류성 식도염 약(알긴산나트륨 제제)에도 쓰입니다."},{title:"소장에서",body:"점성이 당·지방의 흡수 속도를 늦춰, 사람 시험에서 식후 혈당·인슐린 상승을 줄였다는 보고가 있습니다."},{title:"결과",body:"체중·식욕에 대한 사람 시험은 효과가 있다는 결과와 없다는 결과가 섞여 있습니다."}]},{title:"결합 작용 주장 (중금속·나트륨)",evidence:"limited",steps:[{title:"이온 결합",body:"알긴산의 카복실기는 스트론튬·납·카드뮴 같은 2가 금속 이온과 결합합니다. 방사성 스트론튬의 장 흡수를 줄였다는 초기 연구가 있습니다."},{title:"나트륨 주장",body:"칼륨형 알긴산이 장에서 나트륨과 교환·결합해 배출을 늘린다는 주장이 있으나, 일상 식품으로서의 효과를 확인한 사람 시험은 부족합니다."},{title:"한계",body:'결합은 칼슘·철·아연 같은 필수 무기질에도 똑같이 일어날 수 있고, 먹은 중금속을 "해독"한다는 표현은 과장입니다.'}]},{title:"후코이단: 시험관의 항암·면역 작용과 사람 근거의 간극",evidence:"limited",steps:[{title:"구조",body:"후코이단은 황산기가 붙은 푸코스 중심의 다당류로, 특히 미역귀(미역의 포자엽)에 많습니다."},{title:"시험관·동물",body:"암세포 자멸사 유도, 혈관신생 억제, 대식세포·NK세포 활성화, 헤파린과 비슷한 항응고 작용이 보고되었습니다."},{title:"흡수의 한계",body:"분자가 매우 커서 먹었을 때 혈액으로 흡수되는 양은 극히 적습니다. 시험관에서 쓴 농도를 사람 몸에서 재현하기 어렵습니다."},{title:"사람에서",body:"소규모 보충제 시험 외에는 근거가 없고, 암 예방·치료 효과는 확인되지 않았습니다. 항암치료를 대신해서는 안 됩니다."}]}],evidenceNote:"제한적 근거: 알긴산이 식후 혈당·포만감에 영향을 준다는 소규모 사람 시험이 있으나 일관되지 않고, 알긴산나트륨 약의 역류 방지 효과는 식품 섭취와 다릅니다. 후코이단의 항암·면역 효과는 대부분 시험관·동물 결과입니다. 해조류를 자주 먹는 식습관 자체의 장점(식이섬유·무기질)은 인정되지만, 해조 다당류 보충제의 효과는 입증되지 않았습니다. 해조류의 요오드는 별도 성분(요오드)으로 따로 봐야 합니다.",facts:["일본인의 장내 세균 일부(박테로이데스 플레베이우스)는 김의 포르피란을 분해하는 효소 유전자를 해양 세균에서 넘겨받은 것으로 밝혀졌습니다. 해조류를 오래 먹어온 식문화가 장내 미생물 유전자에 남은 사례입니다.","미역·다시마를 불리거나 끓일 때 나오는 미끈한 점액이 알긴산·후코이단 같은 다당류입니다.
