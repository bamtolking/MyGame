레이트)","Curhan GC, et al. Arch Intern Med 2004 — 젊은 여성의 식이 요인과 신장결석 위험 (피트산 포함, 코호트)"]},{id:"gluten",name:"글루텐",en:"Gluten",aliases:["글리아딘","글루테닌","gliadin","셀리악","셀리악병","celiac","밀 단백질","글루텐프리","글루텐 프리","조눌린","zonulin"],kind:"항영양소",effect:"mixed",tags:["gut","immune","autoimmune","inflammation-risk"],summary:'밀·보리·호밀의 저장 단백질(글리아딘·글루테닌)로, 반죽의 쫄깃함을 만듭니다. 셀리악병 환자에게는 면역 반응으로 소장 융모를 파괴하는 확실한 원인 물질이지만, 셀리악병이 아닌 사람에게 "글루텐이 장누수와 자가면역을 일으킨다"는 주장은 근거가 제한적이고, 글루텐 민감성의 일부는 밀의 프럭탄(FODMAP) 때문인 것으로 보입니다.',pathways:[{title:"셀리악병: 탈아미드화 → HLA-DQ2/DQ8 → T세포 → 융모 위축",evidence:"strong",steps:[{title:"소화에 저항하는 펩타이드",body:"글리아딘은 프롤린과 글루타민이 매우 많아 위·췌장·소장 점막의 단백질분해효소로 끝까지 잘리지 않습니다. 대표적으로 α-글리아딘의 33개 아미노산 조각(33-mer)이 온전히 남습니다."},{title:"장벽 통과와 탈아미드화",body:"이 펩타이드가 장 상피를 건너 점막 아래층에 이르면, 조직 트랜스글루타미나아제(tTG)가 글루타민을 글루탐산으로 바꿉니다(탈아미드화). 음전하가 생긴 펩타이드는 면역 분자 HLA-DQ2·DQ8에 훨씬 단단히 결합합니다."},{title:"T세포 활성화",body:"항원제시세포가 이 펩타이드를 HLA-DQ2/DQ8에 얹어 보여 주면 글루텐 특이 CD4 T세포가 활성화되어 인터페론-γ·IL-21을 분비합니다. 상피세포가 내는 IL-15는 상피 내 림프구를 살해 세포로 바꾸고, B세포는 tTG에 대한 자가항체를 만듭니다."},{title:"결과",body:"장 상피세포가 파괴되어 융모가 납작해지고(융모 위축) 움이 과형성됩니다. 흡수 면적이 줄어 철결핍 빈혈·골다공증·설사·체중 감소가 생기며, 글루텐을 엄격히 끊으면 회복됩니다."}],note:"HLA-DQ2/DQ8은 서구 인구의 30~40%가 가지고 있지만 셀리악병은 약 1%에서만 생깁니다. 유전자는 필요조건일 뿐 충분조건이 아닙니다."},{title:'조눌린·장 투과성("장누수") 가설',evidence:"contested",steps:[{title:"수용체 결합",body:"글리아딘 조각은 장 상피세포의 케모카인 수용체 CXCR3에 결합해 MyD88 신호를 거쳐 조눌린(프리-햅토글로빈2)의 분비를 유도합니다."},{title:"치밀결합 열림",body:"조눌린은 EGFR·PAR2 수용체를 거쳐 치밀결합 단백(ZO-1 등)을 인산화하고 액틴 골격을 재배열해 세포 사이 틈을 벌립니다."},{title:"셀리악병에서",body:"셀리악병 환자는 조눌린이 높고 장 투과성이 실제로 증가해 있으며, 이것이 글루텐 펩타이드 유입을 늘리는 고리로 작용합니다."},{title:"셀리악병이 아닌 사람에서",body:'비셀리악 장 조직 절편에 글리아딘을 떨어뜨리면 투과성이 잠시 늘었다는 실험은 있지만, 건강한 사람이 글루텐을 먹어 임상적으로 의미 있는 "장누수"와 전신 염증·자가면역이 생긴다는 증거는 없습니다. 흔히 쓰이는 혈중 조눌린 검사 키트가 실제로는 다른 단백질을 잰다는 연구도 있어 해석에 주의가 필요합니다.'}]},{title:"비셀리악 글루텐 민감성: 글루텐인가, 프럭탄인가",evidence:"contested",steps:[{title:"증상",body:"셀리악병·밀 알레르기가 아닌데도 밀을 먹으면 복부 팽만·복통·피로를 느끼는 사람들이 있습니다."},{title:"이중맹검 시험",body:"스스로 글루텐 민감성이라고 여기는 사람들에게 글루텐·프럭탄·위약을 모르게 바꿔 먹인 시험에서, 증상을 더 일으킨 것은 글루텐이 아니라 프럭탄이었습니다. 프럭탄은 소장에서 흡수되지 않고 대장에서 발효되어 가스와 팽만을 만드는 FODMAP입니다."},{title:"다른 후보",body:"밀의 아밀라아제-트립신 억제제(ATI)가 장 면역세포의 TLR4를 자극한다는 세포·동물 연구도 있습니다."},{title:"정리",body:"일부 사람은 글루텐 자체에 반응하는 것으로 보이지만 소수이며, 많은 경우 저FODMAP 식단이 더 적절한 해결책일 수 있습니다."}]}],evidenceNote:'강한 근거: 셀리악병의 면역 기전(tTG 탈아미드화, HLA-DQ2/DQ8, T세포 매개 융모 손상)과 엄격한 무글루텐 식단의 치료 효과. 논쟁 중: 조눌린을 통한 투과성 증가는 셀리악병에서는 확인됐지만, 일반인의 "장누수"나 하시모토 갑상선염 같은 자가면역의 원인이라는 주장은 사람 대조시험으로 뒷받침되지 않습니다. 셀리악병이 없는 사람에서 장기적인 글루텐 섭취는 관상동맥질환 위험과 연관이 없었고, 글루텐을 피하느라 통곡물을 줄이면 오히려 불리할 수 있다는 코호트 결과가 있습니다.',facts:["셀리악병은 세계적으로 약 1%에서 나타나지만, 한국·동아시아에서는 관련 유전형(HLA-DQ2)이 드물어 매우 드물게 보고됩니다.","진단용 혈액검사(tTG-IgA)와 내시경 조직검사는 글루텐을 먹고 있는 상태에서 해야 정확합니다. 먼저 끊으면 검사가 음성으로 나올 수 있습니다.",'국제 기준(코덱스)에서 "글루텐프리"는 글루텐 20ppm(20mg/kg) 이하를 뜻합니다. 귀리 단백질(아베닌)은 대부분의 셀리악 환자가 견디지만 밀과의 교차 오염이 흔합니다.',"밀 알레르기(IgE 매개)는 셀리악병과 다른 질환이며, 오메가-5 글리아딘은 밀을 먹고 운동할 때 생기는 아나필락시스의 주요 원인 항원입니다.","무글루텐 가공식품은 식감을 위해 정제 전분·당·지방을 더 넣는 경우가 많고 식이섬유는 적은 편입니다."],cautions:["셀리악병이 의심되면(만성 설사, 원인 모를 철결핍 빈혈, 이른 골다공증) 글루텐을 끊기 전에 먼저 검사를 받으세요.","셀리악병 환자는 하루 수십 mg의 글루텐으로도 장 손상이 생길 수 있어 교차 오염까지 관리해야 합니다."],refs:["Shan L, et al. Science 2002 — 소화에 저항하는 글리아딘 33-mer 펩타이드와 셀리악병","Lammers KM, et al. Gastroenterology 2008 — 글리아딘이 CXCR3에 결합해 조눌린 분비와 장 투과성 증가를 유도","Skodje GI, et al. Gastroenterology 2018 — 자가 보고 비셀리악 글루텐 민감성의 증상 원인은 글루텐보다 프럭탄 (이중맹검 교차시험)","Lebwohl B, et al. BMJ 2017 — 셀리악병이 없는 성인의 장기 글루텐 섭취와 관상동맥질환 위험 (코호트)"]},{id:"glycoalkaloid",name:"글리코알칼로이드 (솔라닌)",en:"Glycoalkaloids (solanine, chaconine)",aliases:["솔라닌","차코닌","solanine","chaconine","감자 싹","녹색 감자","토마틴","가지과","nightshade"],kind:"항영양소",effect:"caution",tags:["gut","brain","autoimmune"],summary:"감자·토마토·가지 같은 가지과 식물이 벌레와 병균을 막으려고 만드는 쓴맛의 천연 독소로, 감자의 솔라닌·차코닌이 대표적입니다. 보통 감자에는 적지만 빛을 받아 녹색으로 변하거나 싹이 난 부분에 몰려 있어, 많이 먹으면 구토·설사와 신경 증상을 일으킵니다. 가지과 채소가 관절염·자가면역을 악화한다는 주장은 사람 근거가 부족합니다.",pathways:[{title:"세포막 콜레스테롤 결합 → 막 파괴 → 위장 증상",evidence:"strong",steps:[{title:"구조",body:"스테로이드 뼈대(솔라니딘)에 당사슬 3개가 붙어 있습니다. 감자 글리코알칼로이드의 약 95%가 α-솔라닌과 α-차코닌이며, 차코닌이 더 독하고 둘이 함께 있으면 작용이 커집니다."},{title:"막 결합",body:"장 상피세포 막의 콜레스테롤과 결합해 복합체를 만들고, 막 구조를 흐트러뜨려 구멍을 냅니다."},{title:"장 점막 손상",body:"세포 내용물이 새고 상피세포가 손상되며 장벽 기능이 떨어집니다."},{title:"결과",body:"먹은 뒤 수 시간~하루 안에 목의 아린 느낌·쓴맛, 메스꺼움·구토·복통·설사가 나타납니다. 대부분 며칠 안에 회복되지만 대량 섭취 시 탈수와 전신 증상으로 이어질 수 있습니다."}],note:"중독 사례는 사람에서 여러 번 보고됐고, 막 파괴 기전은 세포 실험으로 밝혀졌습니다."},{title:"콜린에스테라아제 억제 → 신경 증상",evidence:"limited",steps:[{title:"흡수",body:"장에서 일부가 흡수되어 혈액을 따라 온몸으로 퍼집니다."},{title:"효소 억제",body:"신경 전달물질 아세틸콜린을 분해하는 아세틸콜린에스테라아제와 혈장의 부티릴콜린에스테라아제를 가역적으로 억제합니다(시험관·동물 연구)."},{title:"결과",body:"심한 중독에서는 두통·어지러움·졸림·혼란·맥박 이상 같은 신경 증상이 나타나며, 매우 드물게 사망 사례도 보고됐습니다. 이 증상에 콜린에스테라아제 억제가 얼마나 기여하는지는 아직 분명하지 않습니다."}]},{title:"가지과 채소와 관절염·장 염증 주장",evidence:"contested",steps:[{title:"주장",body:"가지과 채소(감자·토마토·가지·고추)를 끊으면 관절염·자가면역 증상이 좋아진다는 주장이 자가면역 프로토콜(AIP) 같은 제한 식단에서 널리 쓰입니다."},{title:"동물 근거",body:"염증성 장질환이 잘 생기도록 유전자를 조작한 생쥐에게 감자 글리코알칼로이드를 먹이자 장 투과성이 늘고 장염이 악화됐습니다. 배양 장세포에서도 장벽이 약해졌습니다."},{title:"사람 근거",body:"가지과 채소 제한이 관절염을 개선한다는 무작위 대조시험은 없고, 보통 식사에서 먹는 양이 사람의 장벽을 손상시킨다는 증거도 없습니다."},{title:"실용적 접근",body:"특정 음식 뒤 증상이 반복되면 일정 기간 빼 보고 다시 먹어 보는 방식으로 개인 반응을 확인할 수 있지만, 영양가 높은 채소군을 근거 없이 통째로 끊을 필요는 없습니다."}]}],evidenceNote:"확실한 것: 녹색으로 변하거나 싹이 난 감자로 인한 급성 중독은 여러 차례 보고됐고, 유럽식품안전청(EFSA)은 체중 1kg당 1mg을 사람에게 위장 증상이 나타날 수 있는 최저 수준으로 봤습니다. 체중 1kg당 2~5mg이면 뚜렷한 중독, 3~6mg은 치명적일 수 있는 양으로 보고됩니다. 제한적·논쟁: 신경 증상의 기전(콜린에스테라아제 억제)은 주로 실험실 결과이며, 가지과 채소가 관절염·자가면역을 악화한다는 주장은 동물 모델 외에 사람 근거가 없습니다.",facts:["시판 감자는 대개 100g당 수 mg 수준으로, 흔히 쓰는 안전 상한(100g당 20mg)보다 낮습니다. 껍질과 그 바로 아래층, 싹눈, 녹색 부위에 몰려 있으며 싹에는 수십 배 이상 높은 농도가 들어 있습니다.","녹색 자체는 엽록소라 해롭지 않지만, 빛을 받으면 엽록소와 글리코알칼로이드가 함께 늘어나므로 녹색은 경고 신호입니다.","열에 강해 삶기·찌기·굽기·튀기기로는 거의 줄지 않습니다. 녹색 부위와 싹·싹눈을 넉넉히 도려내고 껍질을 벗기는 것이 가장 효과적입니다.","예시: 체중 60kg 성인에게 1kg당 1mg은 60mg입니다. 100g당 30mg인 녹색 감자라면 200g만 먹어도 이 양에 이릅니다.","덜 익은 녹색 토마토의 토마틴은 장에서 콜레스테롤과 결합해 대부분 흡수되지 않아, 감자 글리코알칼로이드보다 독성이 훨씬 약합니다."],cautions:["쓴맛이 나거나 혀·목이 아린 감자는 먹지 마세요. 농도가 높다는 신호입니다.","감자는 빛이 들지 않는 서늘한 곳에 보관하고, 녹색이 넓게 퍼졌거나 싹이 많이 난 감자는 버리세요.","어린이는 체중이 적어 같은 양에도 더 위험합니다."],refs:["EFSA CONTAM Panel. EFSA Journal 2020 — 식품·사료 속 글리코알칼로이드(특히 감자)의 위해성 평가","Friedman M. J Agric Food Chem 2006 — 감자 글리코알칼로이드와 대사물: 식물과 식단에서의 역할","Patel B, et al. Inflamm Bowel Dis 2002 — 감자 글리코알칼로이드가 장 투과성을 높이고 염증성 장질환 생쥐 모델을 악화"]},{id:"acrylamide",name:"아크릴아마이드",en:"Acrylamide",aliases:["아크릴아미드","acrylamide","글리시다마이드","glycidamide"],kind:"유해 생성물",effect:"harm",tags:["cancer","oxidative-risk","brain"],summary:"감자·곡물 속 아미노산(아스파라긴)과 당이 120℃ 이상의 건조한 고온에서 반응할 때 생기는 물질로, 감자튀김·감자칩·과자·토스트·커피에 들어 있습니다. 몸속에서 DNA에 붙는 글리시다마이드로 바뀌어 동물에서 암을 일으키며, IARC 2A군(발암 추정)이지만 사람 역학 연구의 결과는 일관되지 않습니다.",pathways:[{title:"생성: 아스파라긴 + 환원당 → 마이야르 반응",evidence:"strong",steps:[{title:"재료",body:"감자·밀 같은 식물에는 유리 아미노산인 아스파라긴과, 포도당·과당 같은 환원당이 들어 있습니다."},{title:"고온 건조 조건",body:"120℃를 넘는 튀기기·굽기·볶기에서 표면의 물이 날아가면 마이야르 반응(갈변 반응)이 일어납니다. 끓이거나 찌는 100℃ 조리에서는 거의 생기지 않습니다."},{title:"분해 경로",body:"아스파라긴과 당이 결합한 쉬프 염기가 탈카르복실화되고 쪼개지면서 아크릴아마이드가 떨어져 나옵니다."},{title:"결과",body:"온도가 높고 시간이 길수록, 색이 짙을수록 많아집니다. 황금색에서 갈색·검은색으로 갈수록 급격히 늘어납니다."}]},{title:"CYP2E1 → 글리시다마이드 → DNA 부가물",evidence:"limited",steps:[{title:"흡수",body:"아크릴아마이드는 작고 물에 잘 녹아 장에서 빠르게 흡수되어 온몸으로 퍼지고, 태반도 통과합니다."},{title:"활성화",body:"간의 시토크롬 P450 2E1(CYP2E1)이 아크릴아마이드를 에폭사이드 형태인 글리시다마이드로 산화합니다."},{title:"DNA 손상",body:"글리시다마이드는 DNA의 구아닌·아데닌에 공유결합해 부가물(N7-GA-Gua 등)을 만들고, 복제 과정에서 돌연변이를 남깁니다. 사람 혈액에서도 헤모글로빈 부가물로 노출이 확인됩니다."},{title:"결과",body:"쥐에게 평생 먹인 실험에서 갑상샘·유선 등 여러 장기에 종양이 늘었습니다. 사람에서는 대부분의 코호트에서 뚜렷한 암 위험 증가가 없었고, 일부 코호트에서 비흡연 여성의 자궁내막암·난소암과 약한 연관이 보고됐지만 일관되지 않습니다."}],note:'동물 실험에서 종양을 만든 용량은 사람의 평균 식품 노출보다 수백 배 이상 높습니다. 그래도 유전독성 발암물질은 "안전한 문턱"을 정하기 어려워, EFSA는 노출을 합리적으로 가능한 한 낮추라고 권고합니다.'},{title:"글루타티온 소모·신경 독성 (고용량)",evidence:"limited",steps:[{title:"친전자성",body:"아크릴아마이드는 전자를 끌어당기는 이중결합을 가져, 단백질과 글루타티온의 시스테인(-SH)에 잘 달라붙습니다."},{title:"해독",body:"대부분 글루타티온과 결합해(글루타티온 S-전이효소) 머캅투르산 형태로 소변으로 나갑니다. 이것이 주된 해독 경로입니다."},{title:"과부하 시",body:"동물에게 많은 양을 주면 글루타티온이 고갈되어 산화 스트레스가 늘고, 신경 말단 단백질의 시스테인이 손상됩니다."},{title:"결과",body:"직업적으로 고농도에 노출된 노동자에게 손발 저림·근력 저하 같은 말초신경병증이 생긴 사례가 있습니다. 식품으로 먹는 양은 이보다 훨씬 적어 신경 독성 우려는 낮습니다."}]}],evidenceNote:"확실한 것: 생성 조건(아스파라긴·환원당·120℃ 이상의 건조 가열)과 줄이는 방법. 동물: 유전독성 발암물질로 여러 장기에 종양을 만듭니다. 사람: IARC 2A군(발암 추정)이며, 식품 노출과 암의 연관을 본 역학 연구는 대체로 음성이거나 일관되지 않습니다. EFSA(2015)는 현재 식품 노출 수준이 모든 연령대에서 발암 위험을 높일 가능성이 있다며 노출 저감을 권고했습니다.",facts:["2002년 스웨덴 연구진이 튀기고 구운 식품에서 처음 보고했습니다.",'줄이는 법: 황금색까지만 익히기(영국 식품기준청의 "Go for Gold" 캠페인), 튀기거나 굽기 전 썬 감자를 물에 15~30분 담가 표면의 당·아스파라긴을 씻어 내기, 빵은 연한 갈색까지만 굽기.',"생감자를 저온에 오래 두면 전분이 당으로 바뀌어(저온 당화) 튀길 때 아크릴아마이드가 늘 수 있어 냉장 보관을 피하라는 권고가 오래 있었습니다. 다만 영국 식품기준청은 2023년, 냉장 보관의 영향이 생각보다 작다는 연구를 반영해 이 권고를 거둬들였습니다.","커피는 로스팅 초반에 아크릴아마이드가 생겼다가 로스팅이 길어지면 줄어, 강배전이 약배전보다 약간 적습니다. 곡물·치커리로 만든 커피 대용품은 함량이 높은 편입니다.","흡연은 식품보다 큰 노출원으로, 흡연자는 비흡연자보다 몸속 아크릴아마이드 부가물이 몇 배 높습니다."],cautions:["까맣게 탄 토스트·감자튀김·과자의 탄 부분은 먹지 마세요.","어린이는 체중에 비해 과자·감자칩을 많이 먹어 체중당 노출이 어른보다 높은 편입니다."],refs:["Tareke E, et al. J Agric Food Chem 2002 — 가열 조리 식품의 아크릴아마이드 첫 보고","Mottram DS, et al. Nature 2002 — 아크릴아마이드는 마이야르 반응(아스파라긴+당)으로 생성","EFSA CONTAM Panel. EFSA Journal 2015 — 식품 속 아크릴아마이드에 대한 과학적 의견","IARC Monographs Vol. 60 (1994) — 아크릴아마이드 2A군 분류"]},{id:"nitrosamine",name:"아질산염·니트로사민",en:"Nitrite and N-nitrosamines",aliases:["아질산나트륨","아질산염","니트로사민","nitrite","nitrosamine","NDMA","N-니트로소화합물","발색제","가공육"],kind:"유해 생성물",effect:"harm",tags:["cancer","gut","oxidative-risk"],summary:"햄·베이컨·소시지 같은 가공육에 발색·보존용으로 넣는 아질산염이 단백질에서 나온 아민과 반응하면 발암성 N-니트로소화합물(니트로사민 등)이 생깁니다. 위 속 산성 환경과 베이컨을 바삭하게 굽는 고온에서 잘 생기며, 붉은 고기의 헴철은 장 속에서 이 반응을 촉진합니다. 가공육은 IARC 1군 발암물질입니다.",pathways:[{title:"아질산염 + 아민 → 니트로사민 → DNA 알킬화",evidence:"moderate",steps:[{title:"니트로소화",body:"아질산염은 위산 속에서 아질산(HNO₂)이 되고, 더 반응성이 큰 니트로소화제(N₂O₃ 등)로 바뀌어 고기 단백질에서 나온 2차 아민과 결합해 N-니트로사민을 만듭니다. 베이컨을 고온에서 바삭하게 구울 때는 식품 안에서 N-니트로소피롤리딘 같은 니트로사민이 직접 생깁니다."},{title:"효소에 의한 활성화",body:"니트로사민 자체는 비교적 안정하지만, CYP2E1 같은 시토크롬 P450 효소가 알파 탄소에 수산기를 붙이면(α-수산화) 불안정해져 알킬디아조늄 이온으로 쪼개집니다."},{title:"DNA 알킬화",body:"알킬디아조늄 이온이 DNA 염기에 메틸기 등을 붙여 O⁶-메틸구아닌 같은 손상을 만들고, 복구효소(MGMT)가 처리하지 못하면 G→A 돌연변이가 남습니다."},{title:"결과",body:'니트로사민은 동물에서 강력한 발암물질입니다. 사람의 위 속에서 니트로소화가 일어난다는 것도 확인되어, IARC는 "체내 니트로소화가 일어나는 조건에서 섭취한 질산염·아질산염"을 2A군으로 분류했습니다.'}]},{title:"헴철 → 장 속 N-니트로소화합물·지질과산화 → 대장 상피 자극",evidence:"moderate",steps:[{title:"헴이 대장까지",body:"붉은 고기와 가공육의 헴철은 일부만 흡수되고 상당량이 대장까지 내려갑니다(→ 헴철 참고)."},{title:"내인성 니트로소화 촉매",body:"헴은 장 속에서 니트로실헴·니트로소티올 같은 N-니트로소화합물 생성을 촉진합니다. 사람 급식 연구에서 붉은 고기를 많이 먹을수록 대변 속 N-니트로소화합물이 용량 의존적으로 늘었고, 단백질이나 무기 철을 늘린 식단에서는 늘지 않았습니다."},{title:"지질과산화",body:"헴 철은 장 속 지방의 과산화를 촉매해 4-HNE·말론디알데하이드 같은 알데하이드를 만들고, 이것이 대장 상피를 손상시킵니다(쥐 연구)."},{title:"상피 과증식",body:"손상된 상피를 메우려 세포 증식이 빨라지면서 돌연변이가 쌓일 기회가 늘어납니다. 쥐 실험에서는 칼슘과 엽록소(녹색 채소)가 헴의 이런 작용을 줄였습니다."}],note:"대변 N-니트로소화합물 증가는 사람에서 확인됐고, 지질과산화·상피 과증식 단계는 주로 쥐 연구 결과입니다."},{title:"채소의 질산염은 왜 다른가",evidence:"moderate",steps:[{title:"질산염 순환",body:"시금치·배추·비트 같은 채소의 질산염은 흡수된 뒤 일부(약 25%)가 침샘으로 분비되고, 입안 세균이 이를 아질산염으로 바꿉니다."},{title:"다른 운명",body:"채소에는 비타민 C·폴리페놀이 함께 들어 있어 위 속에서 아질산염을 니트로사민 대신 산화질소(NO) 쪽으로 돌립니다. 아민이 풍부한 고기와 헴이 함께 있는 조건도 아닙니다."},{title:"결과",body:"관찰연구에서 신선한 채소 섭취는 위암·대장암 위험 증가와 연관되지 않았고, 채소 질산염은 오히려 혈압을 낮추는 산화질소의 재료가 됩니다(→ 식이 질산염 참고). 다만 소금에 절인 채소는 소금과 니트로사민 때문에 예외일 수 있습니다."}],note:'문제는 아질산염 자체보다 "아질산염 + 아민 + 헴 + 고온" 조합입니다.'}],evidenceNote:"IARC(2015)는 가공육을 대장암의 1군 발암물질로, 붉은 고기를 2A군으로 분류했습니다. 가공육을 하루 50g 더 먹을 때마다 대장암 위험이 약 18% 높아집니다(관찰연구 메타분석). 이는 상대위험으로, 평생 대장암 위험이 5%인 사람이라면 약 6%로 오르는 정도입니다. 니트로사민과 헴이 주요 기전 후보로 꼽히지만, 사람에서 어느 기전이 얼마나 기여하는지는 완전히 밝혀지지 않았습니다.",facts:["아질산염은 보툴리누스균 증식을 막고, 고기 색소(미오글로빈)와 결합해 분홍색을 내며, 특유의 햄 맛을 만듭니다. 식중독 예방이라는 이점 때문에 완전히 빼기 어렵습니다.","가공육에 비타민 C(아스코르브산)나 에리소르브산을 함께 넣는 것은 아질산염이 니트로사민이 되는 반응을 억제하기 위해서입니다.",'"아질산염 무첨가" 제품 중에는 셀러리 분말 같은 채소 질산염을 발효로 아질산염으로 바꿔 쓰는 경우가 있어, 결과적으로 비슷한 아질산염이 들어 있을 수 있습니다.',"가공육 50g은 대략 햄 두세 장이나 핫도그용 소시지 한 개 정도입니다.","중국식 소금 절임 생선도 IARC 1군 발암물질(비인두암)이며, 염장·건조 과정에서 생기는 니트로사민이 원인으로 추정됩니다."],cautions:["베이컨·햄은 까맣게 태우지 마세요. 전자레인지나 중간 불로 익히면 니트로사민이 덜 생깁니다.","가공육을 먹을 때 채소·과일을 곁들이는 것이 권장되지만, 이것이 위험을 완전히 상쇄한다는 사람 근거는 없습니다. 먹는 양과 횟수를 줄이는 것이 우선입니다."],refs:["Bouvard V, et al. Lancet Oncol 2015 — IARC의 붉은 고기·가공육 발암성 평가","IARC Monographs Vol. 114 (2018) — Red meat and processed meat","IARC Monographs Vol. 94 (2010) — 섭취한 질산염·아질산염 (체내 니트로소화 조건에서 2A군)","Bastide NM, et al. Cancer Prev Res 2011 — 헴철과 대장암: 메타분석과 기전 고찰"]},{id:"heat-byproducts",name:"고온 조리 부산물 (HCA·PAH·AGEs)",en:"High-heat cooking byproducts (HCAs, PAHs, AGEs)",aliases:["HCA","헤테로고리아민","헤테로사이클릭아민","PAH","다환방향족탄화수소","벤조피렌","benzo[a]pyrene","최종당화산물","AGEs","AGE","탄 고기","직화구이","숯불구이"],kind:"유해 생성물",effect:"harm",tags:["cancer","oxidative-risk","inflammation-risk","vascular"],summary:"고기·생선을 높은 온도에서 굽거나 직화로 익힐 때 생기는 세 가지 부산물입니다. 헤테로고리아민(HCA)은 근육 속 크레아틴과 아미노산이, 다환방향족탄화수소(PAH)는 불에 떨어진 기름의 연기가, 최종당화산물(AGEs)은 단백질과 당의 갈변 반응이 만듭니다. 동물에서는 발암·염증 작용이 뚜렷하지만, 사람에서의 근거는 제한적입니다.",pathways:[{title:"HCA: 크레아틴 + 아미노산 → CYP1A2·NAT2 활성화 → DNA 부가물",evidence:"limited",steps:[{title:"생성",body:"소·돼지·닭·생선 같은 근육 고기를 150℃ 이상에서 오래 구우면, 근육의 크레아틴(크레아티닌)과 유리 아미노산·당이 반응해 PhIP·MeIQx 같은 HCA가 생깁니다. 바싹 익힐수록, 팬에 눌어붙은 부분일수록 많습니다."},{title:"간에서 활성화",body:"흡수된 HCA는 간의 CYP1A2가 N-수산화하고, 이어 N-아세틸전이효소(NAT2)나 설포전이효소가 에스테르를 붙이면 반응성이 매우 큰 니트레늄 이온이 됩니다."},{title:"DNA 부가물",body:"니트레늄 이온이 DNA 구아닌의 C8 위치에 결합해 부가물을 만들고 돌연변이를 일으킵니다."},{title:"결과",body:"쥐에게 PhIP를 먹이면 대장·전립선·유선에 종양이 생깁니다. 사람에서는 바싹 익힌 고기·HCA 섭취가 대장암·췌장암·전립선암과 연관됐다는 관찰연구가 일부 있지만 일관되지 않습니다."}]},{title:"PAH(벤조피렌): AhR → CYP1A1/1B1 → BPDE",evidence:"limited",steps:[{title:"생성",body:"고기 기름과 육즙이 숯불·불꽃에 떨어져 타면서 생긴 연기 속 벤조[a]피렌 같은 PAH가 고기 표면에 달라붙습니다. 불꽃에 직접 그을리거나 훈제할 때도 생깁니다."},{title:"AhR 수용체",body:"흡수된 벤조피렌은 세포 안 방향족탄화수소 수용체(AhR)에 결합해, 자신을 대사할 효소 CYP1A1·CYP1B1의 생성을 늘립니다."},{title:"BPDE 생성",body:"CYP1A1/1B1과 에폭사이드 가수분해효소가 차례로 작용해 벤조피렌-다이올-에폭사이드(BPDE)가 만들어지고, 구아닌에 결합해 G→T 돌연변이를 남깁니다. 다른 대사 경로로 생긴 퀴논은 산화·환원을 반복하며 활성산소를 만듭니다."},{title:"결과",body:"벤조피렌은 IARC 1군 발암물질이지만, 그 근거는 주로 흡연·직업 노출입니다. 구운 고기로 먹는 양의 사람 암 위험은 정량화되지 않았습니다."}]},{title:"AGEs: RAGE 수용체 → NF-κB → 산화 스트레스·염증",evidence:"limited",steps:[{title:"생성",body:"단백질·지방이 많은 식품을 물 없이 고온으로 굽거나 튀기면 마이야르 반응으로 카르복시메틸라이신(CML) 같은 최종당화산물(AGEs)이 크게 늘어납니다. 삶기·찌기·조림에서는 훨씬 적게 생깁니다."},{title:"흡수",body:"식품 속 AGEs의 일부(약 10%로 추정)가 흡수되어 혈액으로 들어갑니다. 몸 안에서도 혈당이 높으면 AGEs가 만들어집니다."},{title:"RAGE 신호",body:"AGEs가 혈관 내피세포·대식세포의 RAGE 수용체에 결합하면 NADPH 산화효소가 켜져 활성산소가 생기고, 이것이 NF-κB를 활성화해 TNF-α·IL-6·VCAM-1 발현을 늘립니다. NF-κB는 RAGE 자체도 늘려 신호가 스스로 증폭됩니다."},{title:"사람에서는",body:"당뇨병·신장병 환자 등에서 저AGE 식단(삶기·찌기 위주)이 염증·산화 스트레스 지표를 낮췄다는 소규모 무작위 대조시험이 있지만, 연구 질이 낮고 일반인에서의 장기 효과는 불확실합니다."}]}],evidenceNote:"동물: HCA·PAH의 발암성과 AGEs의 염증 유발은 근거가 강합니다. 사람: HCA·PAH가 DNA 부가물을 만든다는 것은 확인됐지만, 구운 고기 섭취와 암의 관찰연구 결과는 엇갈립니다. IARC는 벤조피렌을 1군, HCA 중 IQ를 2A군, MeIQx·PhIP 등을 2B군으로 분류합니다. 저AGE 식단의 효과는 소규모 시험 수준입니다. 줄이는 조리법은 비용이 거의 들지 않으므로 실천할 가치가 있습니다.",facts:["줄이는 법: 굽기 전 양념에 재우기(허브·마늘·레몬즙·식초 양념에서 HCA·AGEs가 줄었다는 실험), 자주 뒤집기, 직화 대신 팬·오븐 사용, 탄 부분 잘라내기, 굽기 전 전자레인지로 살짝 익혀 고온 조리 시간 줄이기.","삼겹살처럼 기름이 많은 고기를 숯불 석쇠에서 구우면 기름이 불에 떨어져 PAH가 든 연기가 많이 납니다. 기름이 불에 떨어지지 않는 불판이나 불과 거리를 두는 방식이 낫습니다.","같은 닭고기라도 삶거나 찌면 HCA가 거의 생기지 않고 AGEs도 구운 것보다 훨씬 적습니다.",'구운 고기와 함께 먹는 쌈 채소·마늘이 발암물질을 "해독"한다는 말은 실험실 결과에서 나온 추론으로, 사람 근거는 제한적입니다. 그래도 채소를 곁들이면 고기 양이 줄고 식이섬유가 늘어나는 이점이 있습니다.'],cautions:["고기 굽는 연기에도 PAH·알데하이드가 들어 있으니 실내에서는 환기를 충분히 하세요.","까맣게 탄 부분, 바싹 탄 생선 껍질은 먹지 마세요."],refs:["U.S. National Cancer Institute — Chemicals in Meat Cooked at High Temperatures and Cancer Risk (Fact Sheet)","Uribarri J, et al. J Am Diet Assoc 2010 — 식품 속 최종당화산물과 식단에서 줄이는 실용 가이드","IARC Monographs Vol. 100F (2012) — 벤조[a]피렌 1군 분류","IARC Monographs Vol. 56 (1993) — 헤테로고리아민(IQ, MeIQx, PhIP 등) 평가"]},{id:"methylmercury",name:"메틸수은",en:"Methylmercury",aliases:["수은","mercury","MeHg","미나마타병","참치 수은","생선 수은"],kind:"오염물질·기타",effect:"harm",tags:["brain","oxidative-risk"],summary:"석탄 연소·화산 등으로 물에 들어간 수은이 미생물에 의해 메틸수은으로 바뀐 뒤 먹이사슬을 따라 농축된 것입니다. 대형 참치·황새치·상어처럼 오래 사는 대형 포식 어류에 많고, 혈뇌장벽과 태반을 통과해 특히 태아의 뇌 발달에 해롭습니다. 대부분의 생선은 수은이 적어 종류를 가려 먹는 것이 핵심입니다.",pathways:[{title:"생물농축 → 흡수 → 혈뇌장벽·태반 통과",evidence:"strong",steps:[{title:"메틸화",body:"바다·호수 바닥의 황산염 환원 세균 등이 무기 수은에 메틸기를 붙여 메틸수은을 만듭니다."},{title:"먹이사슬 농축",body:"플랑크톤 → 작은 물고기 → 큰 물고기로 올라갈수록 메틸수은이 근육 단백질에 붙어 배출되지 않고 쌓여, 대형 포식 어류에서는 물보다 수백만 배 높은 농도가 됩니다."},{title:"흡수",body:"먹은 메틸수은의 약 95%가 장에서 흡수됩니다. 근육 단백질에 결합해 있어 굽거나 삶아도 줄지 않습니다."},{title:"분자 흉내",body:"혈액에서 시스테인과 결합한 메틸수은은 필수 아미노산 메티오닌과 모양이 비슷해, 아미노산 운반체(LAT1)를 타고 혈뇌장벽과 태반을 통과합니다. 몸에서 절반이 빠져나가는 데 약 두 달(대략 50~70일)이 걸립니다."}]},{title:"티올·셀레노효소 결합 → 산화 스트레스 → 신경세포 손상",evidence:"moderate",steps:[{title:"티올 결합",body:"메틸수은은 단백질과 글루타티온의 티올기(-SH)에 강하게 결합해 글루타티온을 고갈시키고 효소 기능을 떨어뜨립니다."},{title:"항산화 효소 마비",body:"특히 셀레늄을 품은 항산화 효소(글루타티온 과산화효소, 티오레독신 환원효소)의 셀레늄 자리에 결합해 이들을 무력화합니다. 활성산소를 치우는 능력이 떨어지고 미토콘드리아에서 활성산소가 새어 나옵니다."},{title:"신경 손상",body:"성상교세포의 글루탐산 재흡수를 막아 신경세포가 과도하게 흥분하고(흥분독성) 칼슘이 쏟아져 들어옵니다. 세포 골격(미세소관)도 흐트러뜨려, 뇌가 만들어지는 중인 태아에서는 신경세포의 분열과 이동이 방해받습니다."},{title:"결과",body:"고농도 노출(미나마타병)에서는 감각 이상, 운동 실조, 시야 협착, 선천성 뇌 손상이 생겼습니다. 페로 제도 코호트처럼 중간 수준의 태아기 노출에서도 아이의 주의력·언어·기억 검사 점수가 조금 낮았습니다."}],note:"고농도의 신경 독성은 확실하지만, 일상적인 생선 섭취 수준에서의 영향은 연구마다 다릅니다(생선을 많이 먹는 세이셸 코호트에서는 뚜렷한 해가 없었습니다)."},{title:"셀레늄과의 관계",evidence:"limited",steps:[{title:"결합",body:"셀레늄은 수은과 매우 강하게 결합해 녹지 않는 셀렌화수은을 만듭니다."},{title:"보호 가설",body:"대부분의 바다 생선은 수은보다 셀레늄이 더 많아(셀레늄:수은 몰비 1 초과), 메틸수은이 셀레노효소를 빼앗는 효과를 상쇄할 수 있다는 가설이 있습니다."},{title:"한계",body:"동물 연구에서는 보호 효과가 관찰됐지만, 사람에서 셀레늄 비율로 생선의 안전성을 판단할 근거는 아직 부족합니다. 상어·황새치처럼 수은이 매우 많은 어종은 여전히 섭취 제한 대상입니다."}]}],evidenceNote:"확실한 것: 메틸수은은 고농도에서 강력한 신경 독성 물질이며(미나마타병, 이라크 오염 곡물 사건), 태아가 가장 취약합니다. 중간 수준 노출(페로 제도)에서도 아이의 신경 발달 점수가 낮았습니다. 균형: 생선의 DHA·셀레늄·요오드는 태아 뇌 발달에 이롭고, 임신 중 생선을 적당히 먹은 엄마의 아이가 발달 점수가 더 좋았다는 코호트도 있습니다. FAO/WHO는 대부분의 생선에서 이득이 위험보다 크다고 결론지었습니다. 핵심은 생선을 피하는 것이 아니라 수은이 많은 어종을 가리는 것입니다.",facts:["수은이 많은 어종: 상어, 황새치·청새치 같은 새치류, 참다랑어·눈다랑어 같은 대형 참치(주로 횟감).","수은이 적은 어종: 연어, 고등어, 꽁치, 정어리, 멸치, 명태, 새우, 오징어, 조개류.","참치통조림은 대부분 몸집이 작은 가다랑어로 만들어, 횟감용 대형 참치보다 수은이 적습니다.","한국인은 생선·해산물을 많이 먹어 혈중 수은 농도가 미국·유럽보다 몇 배 높은 편으로 보고됩니다.","미나마타병은 1950년대 일본 미나마타만에서 화학공장이 흘려보낸 메틸수은에 오염된 어패류를 먹은 주민들에게 생긴 집단 중독입니다."],cautions:["식약처는 임신·수유 중인 여성에게 일반 어류와 참치통조림은 주 400g 이하, 다랑어(참치회)·새치류·상어류는 주 100g 이하로 먹도록 권고합니다. 생선을 끊으라는 뜻이 아니라 종류를 가리라는 뜻입니다.","어린이는 체중당 노출이 커지므로 대형 포식 어류는 양을 줄이세요."],refs:["Grandjean P, et al. Neurotoxicol Teratol 1997 — 페로 제도 코호트: 태아기 메틸수은 노출과 7세 아동의 인지 결손","FAO/WHO 2010 — 생선 섭취의 위험과 이득에 관한 합동 전문가 회의 보고서","Clarkson TW, Magos L. Crit Rev Toxicol 2006 — 수은과 그 화합물의 독성학","식품의약품안전처 — 임신·수유부 등을 위한 생선 섭취 권고 (수은)"]},{id:"ethanol",name:"알코올 (에탄올)",en:"Alcohol (ethanol)",aliases:["알코올","술","음주","에탄올","alcohol","ethanol","아세트알데하이드","acetaldehyde","ALDH2","숙취"],kind:"오염물질·기타",effect:"harm",tags:["liver","cancer","oxidative-risk","inflammation-risk","gut"],summary:"술의 주성분으로, 간에서 IARC 1군 발암물질인 아세트알데하이드로 바뀐 뒤 아세트산으로 분해됩니다. 분해 과정에서 활성산소와 NADH가 넘쳐 지방간을 만들고, 느슨해진 장벽으로 새어 든 장내 세균 독소(LPS)가 간 염증을 일으킵니다. 얼굴이 빨개지는 한국인(ALDH2 변이)은 같은 양에도 식도암 위험이 크게 오르며, 암에 대해서는 안전한 음주량이 확인되지 않았습니다.",pathways:[{title:"ADH → 아세트알데하이드 → ALDH2: 홍조와 발암",evidence:"strong",steps:[{title:"흡수",body:"위에서 약 20%, 나머지는 소장에서 빠르게 흡수됩니다. 빈속일수록 흡수가 빨라 혈중 농도가 높아집니다."},{title:"1단계: ADH",body:"간의 알코올 탈수소효소(ADH)가 에탄올을 아세트알데하이드로 바꿉니다. 이때 NAD⁺가 NADH로 환원됩니다."},{title:"2단계: ALDH2",body:"미토콘드리아의 알데하이드 탈수소효소 2(ALDH2)가 아세트알데하이드를 아세트산으로 바꿉니다. 한국인의 약 30%는 이 효소의 활성이 크게 떨어지는 ALDH2*2 변이를 가지고 있어, 아세트알데하이드가 쌓여 얼굴이 붉어지고 심장이 두근거립니다."},{title:"DNA 손상",body:"아세트알데하이드는 DNA에 부가물과 가닥 간 교차결합을 만들어 돌연변이를 일으킵니다. 입안 세균도 침 속 에탄올을 아세트알데하이드로 바꿔 입·목·식도가 직접 노출됩니다."},{title:"결과",body:"술을 마시면 얼굴이 빨개지는 ALDH2 변이 보유자가 꾸준히 마시면 정상 효소를 가진 음주자보다 식도암 위험이 여러 배 높아집니다. 흡연이 겹치면 위험이 더 커집니다."}]},{title:"CYP2E1 유도·NADH 과잉 → 활성산소와 지방간",evidence:"moderate",steps:[{title:"CYP2E1 유도",body:"술을 자주 많이 마시면 간의 CYP2E1(미크로솜 에탄올 산화계)이 몇 배로 늘어납니다. 이 효소는 반응 중 전자가 새기 쉬워 슈퍼옥사이드·과산화수소·하이드록시에틸 라디칼 같은 활성산소를 많이 만듭니다."},{title:"지질과산화",body:"활성산소가 간세포막의 불포화지방을 공격해 4-HNE·말론디알데하이드가 생기고, 글루타티온이 고갈되며 미토콘드리아가 손상됩니다. CYP2E1은 니트로사민 같은 발암 전구물질과 아세트아미노펜(타이레놀)도 독성 형태로 더 많이 바꿉니다."},{title:"NADH 과잉",body:"ADH·ALDH 반응이 NAD⁺를 NADH로 바꿔 NADH/NAD⁺ 비율이 높아지면, 지방산 베타산화와 TCA 회로가 억제되고 중성지방 합성 재료(글리세롤-3-인산)가 늘어납니다. 에탄올은 지방 합성 스위치 SREBP-1c를 켜고, 지방 연소 스위치 PPAR-α와 AMPK를 억제합니다."},{title:"결과",body:"과음 며칠 만에도 간에 지방이 쌓이며(알코올성 지방간), 계속되면 알코올성 간염·간경변으로 진행할 수 있습니다. NADH 과잉은 젖산·요산을 올리고 공복 음주 시 저혈당도 일으킵니다."}]},{title:"장 투과성 → 내독소(LPS) → 간의 TLR4 염증",evidence:"moderate",steps:[{title:"장벽 약화",body:"에탄올과 아세트알데하이드는 장 상피의 치밀결합 단백(ZO-1, 오클루딘)을 흐트러뜨리고 장내 세균 구성을 바꿉니다."},{title:"내독소 유입",body:"그람음성균의 세포벽 성분인 LPS(내독소)가 문맥을 타고 간으로 더 많이 들어갑니다. 과음하는 사람의 혈중 LPS가 높다는 사람 연구가 있습니다."},{title:"쿠퍼세포 활성화",body:"간의 대식세포(쿠퍼세포)가 CD14·TLR4 수용체로 LPS를 인식해 NF-κB를 켜고 TNF-α·IL-1β·IL-6를 쏟아내며, NADPH 산화효소로 활성산소도 만듭니다."},{title:"결과",body:"간세포 사멸과 호중구 침윤(알코올성 간염)이 일어나고, 간 성상세포가 활성화되어 콜라겐이 쌓이며 섬유화·간경변으로 이어집니다. TLR4나 CD14가 없는 생쥐는 알코올성 간 손상이 크게 줄었습니다."}]}],evidenceNote:'확실한 것: 알코올음료와 그로 인한 아세트알데하이드는 IARC 1군 발암물질로 구강·인두·후두·식도·간·대장·유방암 위험을 높이며, 소량부터 용량 의존적으로 증가합니다(유방암은 하루 10g당 약 7%). 논쟁이 정리되고 있는 부분: "적당한 음주가 심장에 좋다"는 J자 곡선은 건강이 나빠 술을 끊은 사람이 비음주군에 섞이는 등의 편향 때문일 가능성이 큽니다. ALDH2 유전자를 이용한 중국 50만 명 멘델 무작위 분석에서 음주는 혈압과 뇌졸중 위험을 용량 의존적으로 높였고 뇌졸중 보호 효과는 없었습니다. WHO는 2023년 건강에 안전한 음주량은 없다는 입장을 밝혔습니다.',facts:["에탄올은 1g에 약 7kcal입니다. 소주 1병(360mL, 16~17%)에는 순알코올이 약 45~48g, 맥주 500mL(5%)에는 약 20g 들어 있습니다.",'술을 한두 잔만 마셔도 얼굴이 빨개진다면 ALDH2 변이일 가능성이 높습니다. 계속 마시다 보면 홍조가 줄어드는 "내성"이 생기기도 하지만 아세트알데하이드 분해 능력은 좋아지지 않습니다.','국립암센터의 국민 암 예방 수칙(2016 개정)은 "암 예방을 위해 하루 한두 잔의 소량 음주도 피하기"를 권합니다.',"여성은 위의 ADH 활성이 낮고 체수분이 적어, 같은 양을 마셔도 혈중 알코올 농도가 더 높아집니다."],cautions:["술을 자주 마시는 사람은 아세트아미노펜(타이레놀)의 간독성 위험이 커집니다. 음주 전후 복용을 피하고 용량을 지키세요.","임신 중에는 안전한 음주량이 없습니다(태아 알코올 스펙트럼 장애).","수면제·진정제·일부 당뇨약(설포닐우레아 등)과 함께 마시면 호흡 억제나 저혈당 위험이 커집니다."],refs:["IARC Monographs Vol. 100E (2012) — 알코올음료 섭취와 관련된 에탄올·아세트알데하이드 1군 분류","Brooks PJ, et al. PLoS Med 2009 — 알코올 홍조 반응(ALDH2 결핍)과 식도암 위험","Millwood IY, et al. Lancet 2019 — 중국 50만 명 코호트의 음주와 혈관질환: 관찰·유전 분석","Anderson BO, et al. Lancet Public Health 2023 — 저용량 음주의 건강·암 위험 (WHO 유럽사무소 성명)"]},{id:"sodium",name:"나트륨",en:"Sodium",aliases:["소금","염분","식염","염화나트륨","salt","Na","짠 음식","저염"],kind:"무기질·영양소",effect:"caution",tags:["vascular","cancer","inflammation-risk","oxidative-risk","immune"],summary:"소금(염화나트륨) 무게의 약 40%를 차지하는 필수 무기질로, 체액량과 신경·근육 기능에 꼭 필요하지만 한국인은 필요량보다 훨씬 많이 먹습니다. 과잉 나트륨은 체액을 늘리고 혈관을 뻣뻣하게 해 혈압을 올리는 것이 확실하며, 짠 절임 음식은 헬리코박터균과 함께 위암 위험을 높입니다.",pathways:[{title:"체액량·혈관·신장 → 혈압 상승",evidence:"strong",steps:[{title:"체액 증가",body:"짜게 먹으면 혈중 나트륨 농도를 맞추려고 갈증과 항이뇨호르몬이 늘어 물이 몸에 붙잡히고, 혈액량과 심장 박출량이 늘어납니다."},{title:"신장의 배출 한계",body:'건강한 신장은 혈압을 조금 올려 여분의 나트륨을 내보내는데(압력-나트륨 배설), 나이가 들거나 신장 기능이 떨어지면 같은 양을 배출하는 데 더 높은 혈압이 필요해집니다. 이런 사람을 "소금 민감성"이라고 합니다.'},{title:"혈관 경직",body:"세포 연구에서 나트륨이 많으면 혈관 내피세포가 뻣뻣해지고 산화질소(NO) 생성이 줄었습니다. 교감신경 활성이 높아지고, 내인성 우아바인 유사 물질이 나트륨-칼륨 펌프를 억제해 혈관 평활근 속 칼슘을 늘린다는 가설도 있습니다."},{title:"결과",body:"혈압이 오릅니다. 무작위 대조시험에서 나트륨을 줄이면 혈압이 용량 의존적으로 내려갔고, 고혈압 환자와 고령자에게서 효과가 더 컸습니다. 중국 농촌의 뇌졸중 병력자·고령 고혈압 환자에게 소금 일부를 칼륨으로 바꾼 대체 소금을 쓰게 하자 뇌졸중이 약 14% 줄었습니다."}]},{title:"혈관·신장의 산화 스트레스와 면역 자극",evidence:"limited",steps:[{title:"NADPH 산화효소",body:"소금 민감성 동물에게 고염식을 주면 혈관·신장의 NADPH 산화효소가 활성화되어 슈퍼옥사이드가 늘고, 이것이 산화질소와 반응해 퍼옥시나이트라이트를 만들면서 산화질소가 줄어듭니다."},{title:"섬유화 신호",body:"신장에서는 TGF-β 신호가 켜져 사구체·세뇨관 주변에 섬유화가 진행되고 단백뇨가 늘어납니다."},{title:"면역세포 자극",body:"고농도 나트륨은 SGK1 효소를 통해 염증성 Th17 세포의 분화를 촉진하고, 생쥐에서는 장내 유산균(락토바실러스)을 줄여 Th17 반응을 키웠습니다. 소규모 사람 연구에서도 고염식 뒤 장내 유산균 감소가 관찰됐습니다."},{title:"의미",body:"혈압과 별개로 나트륨이 혈관·신장·면역에 직접 영향을 줄 수 있다는 근거지만, 대부분 세포·동물 연구입니다."}]},{title:"짠 음식 → 위 점막 손상 + 헬리코박터 → 위암",evidence:"moderate",steps:[{title:"점막 보호층 손상",body:"고농도 소금은 위 점막을 덮는 점액층을 손상시키고 상피세포에 염증과 세포 증식을 일으킵니다."},{title:"헬리코박터와 상승작용",body:"고염 환경에서 헬리코박터 파일로리가 위에 더 잘 정착하고, 독성 단백질 CagA의 발현이 늘어난다는 실험 결과가 있습니다."},{title:"위축성 위염",body:"만성 염증이 위축성 위염 → 장상피화생으로 진행하면서 위암의 토양이 됩니다. 젓갈·염장 생선 같은 절임 식품에는 니트로사민도 함께 들어 있을 수 있습니다(→ 아질산염·니트로사민 참고)."},{title:"결과",body:'세계암연구기금(WCRF)은 소금 절임 식품이 위암 위험을 높일 "가능성이 높다(probable)"고 평가했습니다. 헬리코박터 감염률과 소금 섭취가 모두 높았던 것이 한국·일본의 높은 위암 발생률의 요인 중 하나로 꼽힙니다.'}]}],evidenceNote:"강한 근거: 나트륨 섭취를 줄이면 혈압이 내려가고(무작위 대조시험 메타분석), 대체 소금으로 나트륨을 줄이고 칼륨을 늘리면 뇌졸중·심혈관 사건·사망이 줄었습니다(대규모 무작위 대조시험). 중간 근거: 짠 절임 식품과 위암(관찰연구). 논쟁: 나트륨 섭취가 매우 낮은 구간에서 오히려 위험이 늘었다는 일부 코호트 결과는 측정 방법(1회 소변)과 역인과 문제로 논쟁 중입니다. 산화 스트레스·면역 경로는 주로 동물 연구입니다.",facts:["WHO는 하루 나트륨 2,000mg(소금 5g) 미만을 권합니다. 한국인 영양소 섭취기준(2020)의 만성질환 위험 감소 섭취량은 2,300mg이며, 국민건강영양조사에서 한국인의 평균 섭취량은 하루 약 3,000mg 안팎으로 여전히 권고보다 많습니다.","한국인 나트륨의 주요 공급원은 김치, 국·찌개·면류의 국물, 간장·된장·고추장 같은 장류입니다. 라면 한 봉지에는 대략 1,500~1,900mg이 들어 있어, 국물을 남기면 상당량을 줄일 수 있습니다.","소금 1g에는 나트륨 약 400mg이 들어 있습니다. 천일염·죽염·히말라야 소금도 대부분이 염화나트륨이라 나트륨 섭취를 줄이는 효과는 거의 없고, 미네랄 함량 차이도 건강에 의미 있는 양이 아닙니다.","칼륨은 신장의 나트륨 배출을 돕고 혈관을 이완시킵니다. 채소·과일·콩을 충분히 먹어 나트륨:칼륨 비율을 낮추는 것이 혈압 관리에 도움이 됩니다(→ 칼륨 참고).","나트륨을 많이 먹으면 소변으로 칼슘이 더 빠져나가 수산칼슘 결석 위험이 커집니다(→ 옥살산 참고)."],cautions:["칼륨이 든 저나트륨 소금(대체 소금)은 만성 신장질환 환자나 칼륨을 올리는 약(ACE 억제제·ARB 계열 혈압약, 칼륨 보존 이뇨제)을 먹는 사람에게 고칼륨혈증을 일으킬 수 있으니 의료진과 상의하세요.","고혈압·신장질환·심부전 환자에게 나트륨 제한은 치료의 일부입니다."],refs:["He FJ, et al. BMJ 2013 — 장기간 소금 섭취 감소가 혈압에 미치는 효과 (무작위 대조시험 메타분석)","Sacks FM, et al. N Engl J Med 2001 — DASH-나트륨 시험: 나트륨 감소와 DASH 식단의 혈압 효과","Neal B, et al. N Engl J Med 2021 — 대체 소금과 뇌졸중·심혈관 사건 (중국 SSaSS 무작위 대조시험)","WHO 2012 — Guideline: Sodium intake for adults and children"]}],O=[...Yt,...Qt,...Xt,...Zt,...te],$=new Map(O.map(t=>[t.id,t])),ee={},ie={},ae={},oe={},ne={},le={},se={},de={},re={},ce={},me={},ge={},ue={},be={},ye={},pe={},fe={},he={},ve={},Ae={},De={},it={...ee,...ie,...ae,...oe,...ne,...le,...se,...de,...re,...ce,...me,...ge},Ft={...ue,...be,...ye,...pe,...fe,...he,...ve,...Ae,...De},Le=[{id:"spinach",name:"시금치",en:"Spinach",aliases:["시금치나물","포항초","섬초","spinach"],emoji:"🥬",category:"채소",summary:"질산염·루테인·비타민 K·엽산·마그네슘이 풍부한 대표 녹색 잎채소입니다. 대신 옥살산이 채소 중 최상위권이라, 데쳐서 기름에 무치는 한국식 나물 조리법이 장점은 살리고 단점은 줄이는 방식입니다.",verdict:{tone:"good",text:"자주 먹기 좋은 채소. 살짝 데쳐 기름에 무치면 흡수는 늘고 옥살산은 줄어듭니다."},basis:"생 시금치 100g",serving:{label:"나물 한 접시 분량 (생것 약 150g)",grams:150},nutrients:{kcal:23,carb:3.6,sugar:.4,fiber:2.2,protein:2.9,fat:.4,satFat:.06,mufa:.01,pufa:.17,la:.03,ala:.14,sodium:79,potassium:558,calcium:99,magnesium:79,iron:2.7,zinc:.53,selenium:1,vitA:469,vitC:28.1,vitE:2,vitK:483,vitB1:.08,vitB2:.19,vitB6:.2,folate:194},compounds:[{id:"dietary-nitrate",amount:"대략 100~250mg/100g (재배 조건·계절에 따라 편차 큼)",role:"장과 입속 세균을 거쳐 산화질소(NO)로 바뀌어 혈관을 넓히고 혈압을 낮추는 재료가 됩니다. 시금치는 질산염이 많은 대표 채소입니다."},{id:"lutein",amount:"루테인+제아잔틴 약 12mg/100g",role:"눈의 황반에 쌓여 청색광을 걸러내고 망막의 산화 손상을 줄입니다. 녹색 채소 중에서도 함량이 최상위권입니다."},{id:"vitamin-k",amount:"약 480μg/100g (기준치의 약 690%)",role:"혈액 응고 단백질과 뼈 단백질(오스테오칼신)을 활성화합니다. 한 접시로 하루 필요량을 몇 배 넘깁니다."},{id:"folate",amount:"194μg/100g",role:"DNA 합성과 메틸화 회로에 쓰여 호모시스테인을 낮추는 데 관여합니다. 열에 약해 오래 삶으면 줄어듭니다."},{id:"magnesium",amount:"79mg/100g",role:"300가지가 넘는 효소 반응의 보조 인자로, 근육 이완과 혈당 조절에 관여합니다."},{id:"beta-carotene",amount:"약 5.6mg/100g",role:"필요한 만큼 비타민 A로 바뀌어 점막과 시각 기능을 돕습니다."},{id:"nonheme-iron",amount:"2.7mg/100g (흡수율은 낮음)",role:"철 함량은 높은 편이지만 식물성 비헴철인 데다 옥살산이 흡수를 방해해, 실제로 흡수되는 양은 적습니다."},{id:"oxalate",amount:"약 600~1,000mg/100g (채소 중 최상위권)",role:"칼슘·철과 결합해 흡수를 방해하고, 수산칼슘 신장결석 위험이 있는 사람에게 부담이 됩니다. 데치면 크게 줄어듭니다."}],howToEat:[{title:"끓는 물에 30초~1분 데치고 물은 버리기",body:"수용성 옥살산이 데친 물로 빠져나가 30~87%까지 줄어듭니다. 대신 비타민 C·엽산도 함께 빠지므로 짧게 데치고, 데친 물은 국물로 쓰지 않는 것이 좋습니다."},{title:"참기름·들기름에 무치기",body:"루테인·베타카로틴·비타민 K는 지용성이라 기름과 함께 먹을 때 흡수가 몇 배 높아집니다. 나물 무침이 과학적으로 좋은 조합입니다."},{title:"비타민 C와 함께 먹기",body:"비헴철은 비타민 C와 함께 먹으면 흡수가 늘어납니다. 레몬즙을 조금 뿌리거나 파프리카·과일을 곁들이세요."},{title:"생으로 대량 섭취는 피하기",body:"그린 스무디처럼 생시금치를 매일 많이 갈아 먹으면 옥살산 섭취가 크게 늘어납니다. 생으로는 샐러드에 곁들이는 정도가 적당합니다."},{title:"데친 시금치는 빨리 먹기",body:"조리한 시금치를 따뜻한 곳에 오래 두거나 여러 번 데우면 세균이 질산염을 아질산염으로 바꿉니다. 냉장 보관하고 1~2일 안에 드세요."}],pairings:{good:["참기름·들기름 (지용성 성분 흡수↑)","두부·멸치 (장 속에서 옥살산을 칼슘이 붙잡아 배출)","레몬·파프리카 (철 흡수↑)"],avoid:["식사 직후 진한 녹차·커피 (탄닌이 비헴철 흡수를 방해)"]},cautions:["와파린(쿠마딘) 복용 중이라면 비타민 K가 약효에 영향을 줍니다. 끊기보다는 매일 비슷한 양을 일정하게 먹는 것이 원칙이며, 담당 의사와 상의하세요.","수산칼슘 신장결석 병력이 있다면 생시금치 대량 섭취를 피하고, 데쳐서 칼슘 식품과 함께 드세요.","어린 영아에게 조리한 시금치를 오래 보관·재가열해 먹이면 아질산염이 늘어 메트헤모글로빈혈증 위험이 있습니다."],myths:[{claim:"시금치는 철분의 왕이라 빈혈에 최고다",truth:"철 함량 자체는 채소 중 높은 편(2.7mg/100g)이지만 흡수율이 낮은 비헴철이고, 옥살산이 흡수를 더 방해합니다. 빈혈 관리에는 헴철 식품(육류·조개류)이나 비타민 C와의 조합이 더 효과적입니다."},{claim:"시금치와 두부를 같이 먹으면 결석이 생긴다",truth:"오히려 반대에 가깝습니다. 장 속에서 옥살산이 두부의 칼슘과 결합해 대변으로 배출되므로 몸에 흡수되는 옥살산이 줄어듭니다. 다만 그만큼 칼슘 흡수도 일부 줄어듭니다."}]},{id:"blueberry",name:"블루베리",en:"Blueberry",aliases:["블루베리","냉동블루베리","야생블루베리","blueberries","빌베리"],emoji:"🫐",category:"과일",summary:"안토시아닌이 풍부한 대표 베리입니다. 몸속에서는 안토시아닌이 활성산소를 직접 없애기보다 장내 미생물 대사물과 세포 신호를 통해 혈관 기능과 항산화 방어력을 높이는 것으로 보이며, 사람 대상 시험에서 혈관 기능 개선이 확인됐습니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 하루 한 줌~한 컵, 생으로 또는 냉동으로."},basis:"생 블루베리 100g",serving:{label:"1컵 (약 150g)",grams:150},nutrients:{kcal:57,carb:14.5,sugar:10,fiber:2.4,protein:.7,fat:.3,satFat:.03,mufa:.05,pufa:.15,la:.09,ala:.06,sodium:1,potassium:77,calcium:6,magnesium:6,iron:.28,zinc:.16,selenium:.1,vitA:3,vitC:9.7,vitE:.57,vitK:19.3,vitB1:.04,vitB2:.04,vitB6:.05,folate:6},compounds:[{id:"anthocyanin",amount:"재배종 약 160mg/100g, 야생종은 2~3배",role:"블루베리의 핵심 성분. 대장 미생물이 만든 페놀산 대사물과 함께 Nrf2 항산화 스위치를 켜고, 혈관 내피의 산화질소를 늘려 혈관 기능을 개선합니다."},{id:"chlorogenic-acid",amount:"과일 중 많은 편",role:"포도당 흡수를 늦추고 간의 당 생성을 조절하는 폴리페놀로, 식후 혈당 상승을 완만하게 하는 데 기여할 수 있습니다."},{id:"quercetin",amount:"소량 (약 3~8mg/100g)",role:"안토시아닌과 함께 작용하는 플라보놀로, 항염 신호 조절에 관여합니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.4g/100g (펙틴 포함)",role:"펙틴 같은 발효성 섬유가 장내 유익균의 먹이가 되어 짧은사슬지방산을 만듭니다."},{id:"vitamin-k",amount:"19μg/100g",role:"과일 치고는 비타민 K가 있는 편으로, 한 컵이면 기준치의 약 40%입니다."}],howToEat:[{title:"생으로, 또는 냉동으로",body:"냉동해도 안토시아닌은 대부분 유지됩니다. 제철이 아닐 때는 무가당 냉동 블루베리가 경제적이고 영양 손실도 적습니다."},{title:"오래 가열하지 않기",body:"잼·머핀처럼 오래 가열하거나 굽는 조리는 안토시아닌을 크게 줄입니다. 요거트·오트밀에 마지막에 올리세요."},{title:"하루 한 컵(약 150g) 정도",body:"대사증후군 환자의 6개월 무작위 대조시험에서 하루 한 컵 분량의 블루베리가 혈관 기능과 콜레스테롤 지표를 개선했습니다."},{title:"껍질째, 작은 알일수록 좋다",body:"색소는 껍질에 몰려 있어, 알이 작을수록 무게 대비 안토시아닌이 많습니다. 짙은 남색이 선명한 것을 고르세요."}],pairings:{good:["플레인 요거트·오트밀 (섬유·단백질과 함께 먹으면 혈당이 완만)","호두·아몬드 (지방과 함께 폴리페놀 흡수 보조)"],avoid:["설탕 시럽·가당 잼 (당 부담이 효과를 상쇄)"]},cautions:["블루베리 주스·가당 건블루베리는 당이 농축되어 있어 생과를 대신하기 어렵습니다.","블루베리 추출물 보충제는 식품과 같은 효과가 입증되지 않았습니다."],myths:[{claim:"블루베리의 안토시아닌이 몸속 활성산소를 직접 중화한다",truth:"시험관에서는 맞지만, 혈액 속 안토시아닌 농도는 요산·비타민 C보다 수천 배 낮아 직접 중화하는 몫은 작습니다. 실제로는 ① 대장 미생물이 만든 대사물, ② 세포의 방어 스위치(Nrf2)를 켜는 신호, ③ 혈관 내피의 산화질소 증가를 통해 작용합니다. 산화 스트레스를 낮추는 방향은 같지만 경로가 다릅니다."},{claim:"블루베리를 먹으면 시력이 좋아진다",truth:"2차대전 조종사의 빌베리 잼 일화에서 퍼진 이야기입니다. 야간 시력 개선을 검증한 대조시험들에서는 효과가 확인되지 않았습니다."}]},{id:"kidney-bean",name:"강낭콩",en:"Kidney bean",aliases:["붉은강낭콩","빨간강낭콩","키드니빈","kidney beans","울타리콩"],emoji:"🫘",category:"콩·견과·씨앗",summary:"식이섬유·식물성 단백질·엽산이 풍부한 콩입니다. 날것이나 덜 익힌 강낭콩의 렉틴(PHA)은 급성 식중독을 일으키지만, 불려서 충분히 삶으면 렉틴 활성이 99% 이상 사라집니다. 렉틴 논쟁의 대표 식품이라 조리법이 핵심입니다.",verdict:{tone:"good",text:"반드시 불려서 팔팔 끓여 익히세요. 제대로 익히면 섬유·단백질·엽산이 풍부한 좋은 식품입니다."},basis:"삶은 강낭콩 100g (무염)",serving:{label:"반 컵 (약 90g)",grams:90},nutrients:{kcal:127,carb:22.8,sugar:.3,fiber:6.4,protein:8.7,fat:.5,satFat:.07,mufa:.04,pufa:.28,sodium:2,potassium:405,calcium:28,magnesium:45,iron:2.9,zinc:1.07,selenium:1.2,vitC:1.2,vitK:8.4,vitB1:.16,vitB2:.06,vitB6:.12,folate:130},compounds:[{id:"lectin",amount:"날것 20,000~70,000 단위 → 충분히 삶으면 200~400 단위",role:"날콩·설익은 콩에서는 급성 구토·설사를 일으키는 원인 물질입니다. 충분한 가열로 거의 불활성화됩니다."},{id:"resistant-starch",amount:"콩류 중 많은 편, 식히면 증가",role:"소장에서 소화되지 않고 대장으로 가서 유익균의 먹이가 되며, 식후 혈당 상승을 완만하게 합니다."},{id:"prebiotic-fiber",amount:"식이섬유 6.4g/100g",role:"올리고당·수용성 섬유가 장내 발효되어 부티르산 같은 짧은사슬지방산을 만듭니다. 가스가 차는 이유이기도 합니다."},{id:"folate",amount:"130μg/100g",role:"엽산이 풍부해 반 컵으로 기준치의 약 30%를 채웁니다."},{id:"potassium",amount:"405mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."},{id:"nonheme-iron",amount:"2.9mg/100g",role:"식물성 철로, 비타민 C와 함께 먹으면 흡수가 늘어납니다."},{id:"phytate",amount:"콩류 전반에 존재",role:"철·아연 흡수를 일부 방해하지만, 불리고 익히면 줄어들고 항산화 작용도 있습니다."}],howToEat:[{title:"5시간 이상 불리고 불린 물은 버리기",body:"불리면 조리 시간이 줄고, 가스를 만드는 올리고당과 피트산 일부가 빠져나갑니다."},{title:"새 물에서 팔팔 끓여 충분히 삶기",body:"끓는 상태를 최소 10분 이상, 가능하면 30분 이상 유지해 속까지 익히세요. 압력솥이면 더 확실합니다. 끓는점에 못 미치는 저온 조리(슬로우쿠커)는 오히려 독성을 키울 수 있어, 먼저 팔팔 끓인 뒤 넣어야 합니다."},{title:"밥에 넣을 때는 불린 콩을 압력밥솥으로",body:"불린 강낭콩을 압력밥솥으로 지으면 충분히 익습니다. 씹었을 때 딱딱하거나 설익었다면 먹지 마세요."},{title:"식혀 먹으면 저항성 전분 증가",body:"익힌 콩을 냉장고에서 식히면 전분이 재결정화되어 저항성 전분이 늘어납니다. 샐러드로 먹기 좋습니다."},{title:"양은 조금씩 늘리기",body:"평소 콩을 적게 먹었다면 소량부터 시작하세요. 장내 미생물이 적응하면서 가스·복부 팽만이 줄어듭니다."}],pairings:{good:["현미·잡곡밥 (곡물과 콩의 아미노산이 서로 보완)","토마토·파프리카 (비타민 C로 철 흡수↑)"],avoid:["설익은 상태로 먹기"]},cautions:["날것·설익은 강낭콩은 절대 먹지 마세요. 4~5알로도 1~3시간 안에 심한 구토·설사가 생길 수 있습니다.","신장질환으로 칼륨 제한 중이라면 양을 조절하세요.","과민성대장증후군(FODMAP 민감)이 있으면 가스·복통이 생길 수 있어 소량부터 시도하세요."],myths:[{claim:"콩의 렉틴이 장누수와 자가면역질환을 일으키니 콩을 끊어야 한다",truth:'충분히 익힌 콩의 렉틴 활성은 날것의 1% 미만으로 떨어집니다. 콩을 많이 먹는 식단(지중해식·장수 지역)에서 자가면역질환이 늘었다는 근거는 없고, 콩 섭취는 심혈관질환·당뇨 위험 감소와 연관됩니다. "렉틴이 자가면역을 일으킨다"는 것은 세포·동물 연구에 기반한 가설 단계입니다.'}]},{id:"canola-oil",name:"카놀라유",en:"Canola oil",aliases:["카놀라","유채유","채종유","canola","rapeseed oil","씨앗기름","시드오일"],emoji:"🫗",category:"기름·지방",summary:"단일불포화지방(올레산)이 약 60%, 오메가6 리놀레산 약 19%, 식물성 오메가3(ALA) 약 9%인 기름입니다. 신선한 기름을 적당히 쓰면 포화지방 대비 LDL을 낮추지만, 여러 번 튀김에 재사용하면 산화 알데하이드가 쌓여 산화 스트레스와 염증 쪽으로 기울 수 있습니다.",verdict:{tone:"balanced",text:"신선하게, 적당량 쓰면 괜찮은 기름. 반복 가열 튀김은 피하세요."},basis:"카놀라유 100g",serving:{label:"1큰술 (약 14g)",grams:14},nutrients:{kcal:884,fat:100,satFat:7.4,mufa:63.3,pufa:28.1,transFat:.4,la:18.6,ala:9.1,vitE:17.5,vitK:71.3},compounds:[{id:"oleic-acid",amount:"약 60g/100g",role:"가장 많은 지방산. 이중결합이 하나라 비교적 산화에 강하고, 포화지방 대신 먹으면 LDL을 낮춥니다."},{id:"linoleic-acid",amount:"약 19g/100g",role:"필수 오메가6. 신선할 때는 LDL 저하에 기여하지만, 고온 반복 가열 시 산화의 주요 출발점이 됩니다."},{id:"ala",amount:"약 9g/100g",role:"식물성 오메가3. 1큰술로 ALA 기준치(1.3g)에 가까운 양을 채우지만, 이중결합이 3개라 가열에 가장 약한 성분입니다."},{id:"oxidized-lipids",amount:"신선할 때 낮음 → 튀김 재사용 시 급증",role:"재사용한 튀김기름에서 늘어나는 4-HNE·아크롤레인 같은 알데하이드가 몸속 산화 스트레스와 염증 신호를 늘릴 수 있습니다."},{id:"vitamin-e",amount:"약 17mg/100g",role:"기름 속 불포화지방이 산화되지 않도록 지켜주는 천연 항산화제입니다. 가열할수록 소모됩니다."},{id:"vitamin-k",amount:"약 71μg/100g",role:"식물성 기름 중 비타민 K1이 많은 편입니다."},{id:"trans-fat",amount:"약 0.4g/100g (정제 과정에서 미량 생성)",role:"고온 탈취 공정에서 소량 생깁니다. 한 번에 쓰는 양에서는 매우 적습니다."}],howToEat:[{title:"볶음·부침 같은 중간 온도 조리에",body:"단일불포화지방이 많아 콩기름·해바라기씨유보다는 산화에 강하지만, ALA 때문에 엑스트라버진 올리브유보다는 약합니다."},{title:"연기가 나기 전까지만 가열",body:"정제 카놀라유의 발연점은 약 200~230℃입니다. 연기가 나면 이미 산화·분해가 빨라진 상태입니다."},{title:"튀김기름 재사용은 1~2회까지",body:"색이 짙어지거나, 거품이 잘 꺼지지 않거나, 쩐내가 나면 버리세요. 튀김 찌꺼기는 걸러내고 밀봉해 서늘한 곳에 둡니다."},{title:"빛과 열을 피해 보관",body:"투명 용기는 빛 산화가 빨라집니다. 가스레인지 옆을 피해 어두운 곳에 두고, 개봉 후 몇 달 안에 쓰세요."}],pairings:{good:["채소 볶음 (지용성 비타민·카로티노이드 흡수↑)"],avoid:["같은 기름으로 반복 튀김"]},cautions:["열량 밀도가 높아 1큰술(14g)이 약 120kcal입니다.","튀김용으로 반복 가열하면 산화물이 급격히 늘어납니다."],myths:[{claim:"카놀라유 같은 식물성 씨앗기름은 몸에 들어오면 활성산소를 만들고 염증을 일으킨다",truth:'두 경우를 구분해야 합니다. ① 신선한 기름을 적당량 먹을 때: 무작위 대조시험에서 염증 지표(CRP 등)가 오르지 않았고, 포화지방 대신 쓰면 LDL 콜레스테롤이 낮아졌습니다. ② 여러 번 재사용한 튀김기름: 조리 중 이미 생긴 4-HNE 같은 알데하이드가 몸에 들어와 글루타티온을 소모시키고 NF-κB 염증 신호를 켤 수 있습니다. 문제의 핵심은 "식물성 기름 자체"보다 "산화된 기름"입니다.'},{claim:"카놀라유는 유채의 독성 물질(에루크산) 때문에 위험하다",truth:"카놀라는 캐나다에서 에루크산과 글루코시놀레이트를 낮추도록 품종 개량한 유채입니다(이름도 Canada+oil). 식용 카놀라유의 에루크산은 2% 미만으로 관리됩니다."},{claim:"헥산으로 추출해 기름에 용매가 남아 있다",truth:"정제 과정에서 헥산은 거의 제거되며 잔류량은 규제 기준 이하로 관리됩니다. 신경 쓰인다면 압착(expeller-pressed) 제품을 고르면 됩니다."}]}],Ce=[{id:"broccoli",name:"브로콜리",en:"Broccoli",aliases:["브로컬리","브로콜리새싹","새싹브로콜리","브로콜리순","데친브로콜리","broccoli","broccoli sprouts"],emoji:"🥦",category:"채소",summary:"설포라판의 원료(글루코라파닌)와 비타민 C·K·엽산이 풍부한 대표 십자화과 채소입니다. 설포라판은 브로콜리 자체의 효소(미로시나아제)가 살아 있어야 잘 만들어지므로, 썰어서 잠시 두었다가 짧게 찌는 조리법이 핵심입니다.",verdict:{tone:"good",text:"자주 먹기 좋은 채소. 썰어서 30~40분 두었다가 짧게 찌면 설포라판이 가장 잘 남습니다."},basis:"생 브로콜리 100g",serving:{label:"한 접시 (송이 1컵, 약 90g)",grams:90},nutrients:{kcal:34,carb:6.6,sugar:1.7,fiber:2.6,protein:2.8,fat:.37,satFat:.04,mufa:.01,pufa:.04,sodium:33,potassium:316,calcium:47,magnesium:21,iron:.73,zinc:.41,selenium:2.5,vitA:31,vitC:89,vitE:.78,vitK:102,vitB1:.07,vitB2:.12,vitB6:.18,folate:63},compounds:[{id:"sulforaphane",amount:"원료(글루코라파닌)는 품종·재배 조건에 따라 편차가 크고, 3일 된 새싹은 다 자란 브로콜리의 약 10~100배",role:"썰거나 씹어 세포가 부서질 때 미로시나아제가 글루코라파닌을 설포라판으로 바꿉니다. 설포라판은 Keap1 단백질을 건드려 Nrf2를 풀어주고, NQO1·글루타티온 S-전이효소 같은 해독·항산화 효소 유전자를 켜는 이 식품의 핵심 성분입니다."},{id:"vitamin-c",amount:"89mg/100g",role:"한 접시로 하루 기준치(100mg)에 가깝게 채웁니다. 수용성이고 열에 약해 물에 오래 삶으면 크게 줄고, 찌거나 전자레인지로 짧게 익히면 더 많이 남습니다."},{id:"vitamin-k",amount:"약 100μg/100g",role:"혈액 응고 인자와 뼈 단백질(오스테오칼신)을 활성화합니다. 한 접시가 하루 기준치(70μg)를 넘습니다."},{id:"folate",amount:"63μg/100g",role:"DNA 합성과 메틸화 회로에 쓰입니다. 열과 물에 약해 삶는 물로 많이 빠져나갑니다."},{id:"lutein",amount:"약 1.4mg/100g",role:"황반에 쌓여 청색광을 거르는 카로티노이드입니다. 지용성이라 기름과 함께 먹을 때 흡수가 잘 됩니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.6g/100g",role:"장내 세균의 먹이가 되는 섬유입니다. 장내 세균 일부는 익혀서 효소가 파괴된 브로콜리의 글루코라파닌도 설포라판으로 바꿔 주지만, 그 양은 적습니다."},{id:"potassium",amount:"316mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."}],howToEat:[{title:"썰어서 30~40분 두었다가 조리하기",body:"글루코라파닌을 설포라판으로 바꾸는 미로시나아제는 열에 약해, 썰자마자 삶으면 효소가 먼저 파괴됩니다. 미리 썰어 두면 가열 전에 설포라판이 만들어지고, 이미 만들어진 설포라판은 효소보다는 열에 덜 약해 상당 부분 남습니다."},{title:"삶기보다 짧게 찌기 (2~4분)",body:"물에 오래 삶으면 글루코시놀레이트·비타민 C·엽산이 물로 빠지고 효소도 파괴됩니다. 반면 살짝 찌면, 설포라판 대신 효과 없는 니트릴을 만들게 하는 단백질(ESP)이 효소보다 먼저 불활성화되어 오히려 설포라판 생성이 늘 수 있습니다. 전자레인지도 물 없이 짧게 하면 비슷합니다."},{title:"푹 익힌 브로콜리엔 겨자가루 한 꼬집",body:"겨자씨·무·와사비·루꼴라에는 미로시나아제가 들어 있습니다. 이미 익혀 효소가 사라진 브로콜리에 생겨자가루나 간 무를 곁들이면 이 효소가 대신 설포라판을 만들어 줍니다."},{title:"브로콜리 새싹은 생으로 조금씩",body:"새싹은 글루코라파닌이 다 자란 브로콜리보다 몇 배~수십 배 많고, 생으로 먹으면 효소도 살아 있습니다. 샐러드·비빔밥에 한 줌 올리는 정도가 좋습니다."},{title:"기름과 함께",body:"루테인·비타민 K는 지용성이라 올리브유·들기름·참깨 드레싱과 함께 먹을 때 흡수가 늘어납니다."}],pairings:{good:["겨자·간 무·와사비 (미로시나아제 공급으로 설포라판↑)","올리브유·들기름 (루테인·비타민 K 흡수↑)","달걀·두부 (단백질을 더한 한 끼)"],avoid:["오래 삶고 물은 버리는 조리 (글루코시놀레이트·비타민 C 손실)"]},cautions:["와파린(쿠마딘) 복용 중이라면 비타민 K가 약효에 영향을 줍니다. 끊기보다 매일 비슷한 양을 일정하게 먹고 담당 의사와 상의하세요.","생 새싹채소는 씨앗 단계에서 살모넬라·대장균에 오염될 수 있어, 임신부·영유아·면역저하자는 익혀 먹는 것이 안전합니다.","많이 먹으면 라피노스 같은 올리고당이 대장에서 발효되어 가스·복부 팽만이 생길 수 있습니다."],myths:[{claim:"브로콜리 같은 십자화과 채소는 갑상선을 망가뜨린다",truth:"글루코시놀레이트 분해물(티오시아네이트·고이트린)은 갑상선의 요오드 흡수(NIS)와 호르몬 합성 효소(TPO)를 방해할 수 있습니다. 하지만 문제가 된 사례는 요오드가 부족한 상태에서 날것을 매일 1kg 이상처럼 극단적으로 먹은 경우입니다. 해조류로 요오드를 충분히 먹는 한국인이 익힌 브로콜리를 보통 양 먹는 것은 걱정할 수준이 아닙니다."},{claim:"브로콜리(설포라판)를 먹으면 암이 예방된다",truth:"십자화과 채소 섭취가 많을수록 일부 암 위험이 낮다는 관찰연구가 있지만 결과가 일관되지 않습니다. 사람 시험에서는 브로콜리 새싹 음료가 대기오염 물질(벤젠·아크롤레인)의 소변 배출을 늘린 결과처럼 해독 지표 변화가 확인된 정도이고, 암 발생 자체를 줄였다는 무작위 대조시험은 없습니다. 설포라판 보충제 역시 식품과 같은 효과가 입증되지 않았습니다."}]},{id:"kale",name:"케일",en:"Kale",aliases:["케일쌈","쌈케일","케일녹즙","케일주스","녹즙","곱슬케일","kale"],emoji:"🥬",category:"채소",summary:"비타민 K·루테인·비타민 C·칼슘이 풍부한 십자화과 잎채소입니다. 시금치와 달리 옥살산이 적어 칼슘 흡수율이 우유와 비슷하거나 더 높습니다. 한국에서는 쌈과 녹즙으로 많이 먹는데, 녹즙은 비타민 K·칼륨이 농축되므로 약을 먹거나 신장질환이 있으면 주의가 필요합니다.",verdict:{tone:"good",text:"자주 먹기 좋은 잎채소. 기름과 함께 먹고, 녹즙은 하루 한 잔 이내로."},basis:"생 케일 100g",serving:{label:"쌈·샐러드 한 줌 (약 50g)",grams:50},nutrients:{kcal:35,carb:4.4,sugar:1,fiber:4.1,protein:2.9,fat:1.5,sodium:53,potassium:348,calcium:254,magnesium:33,iron:1.6,vitA:241,vitC:93,vitK:390,folate:62},compounds:[{id:"vitamin-k",amount:"약 390μg/100g (분석 자료에 따라 400~800μg으로 보고되기도 함)",role:"한 줌(50g)으로 하루 기준치의 2~3배를 채웁니다. 혈액 응고 인자와 뼈 단백질을 활성화하지만, 와파린 복용자에게는 약효를 떨어뜨리는 변수가 됩니다."},{id:"lutein",amount:"녹색 채소 중 시금치와 함께 최상위권",role:"망막 황반에 쌓여 청색광을 거르고 산화 손상을 줄입니다. 기름 없이 생잎만 먹으면 흡수가 적습니다."},{id:"calcium",amount:"약 250mg/100g, 흡수율 약 40%",role:"옥살산이 적어 칼슘이 잘 흡수됩니다. 사람 연구에서 케일 칼슘의 흡수율은 약 41%로 우유(약 32%)보다 높았고, 시금치(약 5%)와는 큰 차이를 보였습니다."},{id:"vitamin-c",amount:"약 93mg/100g",role:"생으로 먹으면 과일에 버금가는 비타민 C를 얻고, 함께 먹은 식물성 철의 흡수를 돕습니다."},{id:"beta-carotene",amount:"비타민 A 약 240μg RAE/100g",role:"필요한 만큼 비타민 A로 바뀌어 점막과 시각 기능을 돕습니다."},{id:"sulforaphane",amount:"글루코시놀레이트 구성은 품종마다 다름",role:"케일의 글루코시놀레이트는 주로 글루코브라시신(→ 인돌-3-카비놀)·시니그린·프로고이트린 계열이고, 설포라판의 원료인 글루코라파닌은 브로콜리보다 적습니다. 그래도 같은 이소티오시아네이트 계열로 Nrf2 해독 효소를 켜는 방향으로 작용합니다."},{id:"oxalate",amount:"적음 (시금치의 수십 분의 1 수준)",role:"옥살산이 적어 칼슘·철과 결합해 흡수를 막는 문제가 거의 없고, 수산칼슘 결석 걱정도 시금치보다 훨씬 적습니다."}],howToEat:[{title:"기름과 함께 먹기",body:"루테인·베타카로틴·비타민 K는 지용성이라 들기름·올리브유·쌈장 속 참기름과 함께 먹을 때 장에서 미셀에 녹아 흡수가 몇 배 늘어납니다."},{title:"샐러드는 잎을 주물러서",body:"억센 줄기는 빼고, 잎에 올리브유와 소금을 조금 넣고 1~2분 주무르면 세포벽이 부드러워집니다. 생으로 먹으면 미로시나아제가 살아 있어 이소티오시아네이트도 잘 만들어집니다."},{title:"살짝 데치거나 볶아 양을 늘리기",body:"짧게 가열하면 부피가 크게 줄어 더 많이 먹을 수 있고 카로티노이드 흡수도 늘어납니다. 대신 비타민 C와 효소는 일부 줄어듭니다."},{title:"녹즙은 하루 한 잔 이내로",body:"녹즙기는 불용성 섬유를 걸러내고 잎 여러 장을 한 번에 농축합니다. 비타민 K·칼륨 섭취가 급격히 늘어나므로 매일 일정한 양으로, 가능하면 통째로 먹는 방식과 섞으세요."}],pairings:{good:["들기름·올리브유 (지용성 성분 흡수↑)","사과·레몬 (녹즙 맛을 살리고 비타민 C 보강)","두부·달걀 (단백질 보완)"],avoid:["와파린 복용 중 갑자기 녹즙을 시작하거나 끊기"]},cautions:["와파린 복용 중이라면 케일 녹즙처럼 비타민 K를 한꺼번에 많이 먹으면 INR이 떨어질 수 있습니다. 먹는 양을 일정하게 유지하고 의사와 상의하세요.","만성콩팥병으로 칼륨을 제한 중이라면 녹즙은 칼륨이 농축되어 위험할 수 있습니다.","요오드가 부족한 상태에서 날 케일을 매일 대량으로(녹즙 여러 잔) 먹으면 갑상선 기능에 부담이 될 수 있습니다."],myths:[{claim:"케일도 시금치처럼 칼슘이 옥살산에 묶여 흡수가 안 된다",truth:"반대입니다. 케일은 옥살산이 적어 칼슘 흡수율이 약 40%로 우유와 비슷하거나 더 높았습니다. 다만 한 번에 먹는 양이 적어서, 우유 한 컵(칼슘 약 200mg 이상)만큼 채우려면 케일을 꽤 많이 먹어야 합니다."},{claim:"케일 녹즙을 마시면 몸속 독소가 해독된다",truth:'해독은 간과 신장이 합니다. 케일의 글루코시놀레이트가 간의 해독 효소(2상 효소)를 늘린다는 결과는 주로 세포·동물 연구와 소규모 사람 연구이며, 녹즙이 "독소를 배출한다"는 것을 입증한 시험은 없습니다. 녹즙은 채소를 더 먹는 방법 중 하나일 뿐입니다.'}]},{id:"carrot",name:"당근",en:"Carrot",aliases:["홍당무","당근주스","미니당근","베이비당근","carrot","carrots"],emoji:"🥕",category:"채소",summary:"베타카로틴이 채소 중 최상위권(100g에 약 8mg)인 뿌리채소입니다. 생으로 씹을 때보다 익혀서 기름과 함께 먹을 때 베타카로틴 흡수가 몇 배 늘어나고, 몸이 필요한 만큼만 비타민 A로 바꾸기 때문에 음식으로 먹어서 비타민 A가 넘칠 걱정은 거의 없습니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 기름에 볶거나 익혀 먹으면 베타카로틴 흡수가 크게 늘어납니다."},basis:"생 당근 100g",serving:{label:"중간 크기 1/2개 (약 80g)",grams:80},nutrients:{kcal:41,carb:9.6,sugar:4.7,fiber:2.8,protein:.93,fat:.24,satFat:.04,mufa:.01,pufa:.12,sodium:69,potassium:320,calcium:33,magnesium:12,iron:.3,zinc:.24,vitA:835,vitC:5.9,vitE:.66,vitK:13.2,vitB1:.07,vitB2:.06,vitB6:.14,folate:19},compounds:[{id:"beta-carotene",amount:"약 8.3mg/100g (알파카로틴도 약 3.5mg)",role:"소장 세포의 효소(BCO1)가 필요한 만큼만 쪼개 비타민 A(레티날)로 바꿉니다. 비타민 A가 충분하면 전사인자(ISX)가 이 효소를 억제해 전환이 줄어드는 되먹임 조절이 있어, 음식으로는 비타민 A 과잉이 생기지 않습니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.8g/100g (펙틴 포함)",role:"펙틴 같은 수용성 섬유가 대장에서 발효되어 짧은사슬지방산을 만들고, 식후 혈당 상승을 완만하게 합니다."},{id:"potassium",amount:"320mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."}],howToEat:[{title:"기름에 볶거나 익혀 먹기",body:"베타카로틴은 세포 속 색소체에 결정 형태로 단단한 세포벽에 갇혀 있습니다. 가열하면 세포벽이 부드러워져 빠져나오기 쉬워지고, 기름이 있어야 장에서 미셀에 녹아 흡수됩니다. 생당근만 씹어 먹을 때보다 흡수가 몇 배 높아집니다."},{title:"껍질은 얇게, 또는 잘 씻어 그대로",body:"카로티노이드와 팔카리놀 같은 폴리아세틸렌 성분은 껍질 바로 아래층에 많습니다. 두껍게 깎지 말고 솔로 문질러 씻거나 얇게 벗기세요."},{title:"생으로 먹을 땐 지방과 함께",body:"당근 스틱은 견과·치즈·올리브유 드레싱·후무스와 곁들이면 흡수가 나아집니다."},{title:"당근주스는 한 잔 정도",body:"주스로 갈면 베타카로틴 흡수는 좋아지지만 섬유 일부가 빠지고 당이 빠르게 흡수됩니다. 여러 잔을 매일 마시면 피부가 노래지는 카로틴혈증이 생기기 쉽습니다."}],pairings:{good:["올리브유·들기름 (베타카로틴 흡수↑)","달걀 (달걀 지방이 카로티노이드 흡수 보조)","식초 드레싱 (당근 라페)"]},cautions:["당근을 많이 먹으면 손바닥·발바닥이 노랗게 되는 카로틴혈증이 생길 수 있습니다. 무해하고 섭취를 줄이면 사라지며, 눈 흰자까지 노랗다면 황달이므로 병원을 찾으세요.","흡연자가 베타카로틴 고용량 보충제(하루 20~30mg)를 먹은 대규모 시험에서 폐암이 오히려 늘었습니다. 음식 속 베타카로틴과는 별개 문제입니다.","자작나무 꽃가루 알레르기가 있으면 생당근에 입안이 가려운 구강알레르기 증후군이 생길 수 있습니다. 익히면 대개 괜찮습니다."],myths:[{claim:"당근을 먹으면 시력이 좋아진다",truth:'비타민 A가 부족해 생긴 야맹증은 당근으로 회복되지만, 이미 충분한 사람의 시력이 더 좋아지지는 않습니다. 2차대전 영국 공군이 레이더 기술을 숨기려 "조종사들이 당근을 먹어 밤눈이 밝다"고 퍼뜨린 이야기가 널리 알려진 배경입니다.'},{claim:"당근과 오이를 같이 먹으면 비타민 C가 파괴된다",truth:"당근·오이에는 아스코르빈산 산화효소가 있어 비타민 C를 디하이드로아스코르브산으로 바꿉니다. 하지만 이 형태도 몸속에서 다시 비타민 C로 환원되어 대부분 효과를 유지합니다. 신경 쓰인다면 식초나 레몬즙을 조금 넣으면 효소 작용이 줄어듭니다."}]},{id:"tomato",name:"토마토",en:"Tomato",aliases:["방울토마토","대추방울토마토","완숙토마토","찰토마토","토마토소스","토마토페이스트","tomato","tomatoes","cherry tomato"],emoji:"🍅",category:"채소",summary:'라이코펜의 대표 공급원으로 비타민 C·칼륨도 들어 있습니다. 라이코펜은 생토마토보다 익혀서 기름과 함께 먹을 때 훨씬 잘 흡수되어, 토마토소스·볶음이 생으로 먹는 것보다 유리한 드문 경우입니다. "가지과 채소의 렉틴·알칼로이드가 관절염·자가면역을 악화시킨다"는 주장은 근거가 약합니다.',verdict:{tone:"good",text:"자주 먹기 좋아요. 생으로도 좋지만, 올리브유에 익히면 라이코펜 흡수가 늘어납니다."},basis:"생 완숙 토마토 100g",serving:{label:"중간 크기 1개 (약 150g)",grams:150},nutrients:{kcal:18,carb:3.9,sugar:2.6,fiber:1.2,protein:.88,fat:.2,satFat:.03,mufa:.03,pufa:.08,sodium:5,potassium:237,calcium:10,magnesium:11,iron:.27,zinc:.17,vitA:42,vitC:13.7,vitE:.54,vitK:7.9,vitB1:.04,vitB2:.02,vitB6:.08,folate:15},compounds:[{id:"lycopene",amount:"생토마토 약 2.6mg/100g, 토마토 페이스트는 약 10배",role:"토마토의 붉은색을 내는 카로티노이드입니다. 비타민 A로 바뀌지 않고, 일중항산소를 소거하며 전립선·피부 등에 쌓입니다. 익히면 세포벽이 부서지고 일부가 흡수가 더 잘 되는 cis형으로 바뀝니다."},{id:"vitamin-c",amount:"약 14mg/100g",role:"중간 크기 한 개로 하루 기준치의 약 20%를 채웁니다. 생으로 먹을 때 가장 많이 남습니다."},{id:"potassium",amount:"237mg/100g (페이스트·주스는 농축)",role:"나트륨 배출을 도와 혈압 조절에 기여합니다. 소스·페이스트로 졸이면 칼륨도 함께 농축됩니다."},{id:"beta-carotene",amount:"약 0.45mg/100g",role:"라이코펜보다 적지만 비타민 A로 바뀌는 카로티노이드를 함께 공급합니다."},{id:"glycoalkaloid",amount:"익은 토마토의 토마틴은 매우 적음, 풋토마토에 많음",role:"토마토의 글리코알칼로이드는 솔라닌이 아닌 토마틴입니다. 익어 가며 대부분 분해되고, 먹은 토마틴은 장에서 콜레스테롤과 결합해 잘 흡수되지 않습니다."},{id:"lectin",amount:"소량",role:"토마토에도 당에 결합하는 렉틴이 있지만, 강낭콩 렉틴(PHA)처럼 급성 독성을 일으키는 종류가 아니며 사람에게 해를 준다는 근거는 없습니다."}],howToEat:[{title:"올리브유에 볶거나 소스로 익히기",body:"가열하면 라이코펜을 가둔 세포벽이 부서지고, 일부가 cis형으로 바뀌어 장에서 미셀에 더 잘 녹습니다. 사람 연구에서 토마토 페이스트의 라이코펜 흡수가 생토마토의 약 2.5배였습니다. 비타민 C는 반대로 가열하면 줄어드니 생과 익힌 것을 섞어 드세요."},{title:"생으로 먹을 땐 기름과 함께",body:"카프레제처럼 올리브유·치즈를 곁들이면 지용성인 라이코펜·베타카로틴 흡수가 늘어납니다."},{title:"충분히 붉게 익은 것 고르기",body:"익을수록 라이코펜은 늘고 토마틴은 줄어듭니다. 덜 익은 토마토는 냉장고보다 상온에 두어 후숙시키세요. 차가운 곳에서는 숙성과 향 생성이 멈춥니다."},{title:"설탕 대신 소금·올리브유",body:"토마토에 설탕을 뿌리면 첨가당만 늘어납니다. 소금 한 꼬집과 올리브유가 맛도 살리고 흡수에도 유리합니다."}],pairings:{good:["올리브유 (라이코펜 흡수↑)","달걀 (토마토달걀볶음: 가열+지방)","양파·마늘 (함께 볶는 소스)"],avoid:["설탕을 듬뿍 뿌려 먹기"]},cautions:["위식도역류가 있다면 토마토의 구연산·말산과 소스의 산도가 속쓰림을 악화시킬 수 있습니다.","만성콩팥병으로 칼륨을 제한 중이라면 토마토 소스·주스·페이스트처럼 농축된 형태의 양을 조절하세요.","시판 토마토소스·케첩은 설탕과 나트륨이 많은 제품이 있어 성분표를 확인하세요."],myths:[{claim:"토마토·가지·감자·고추 같은 가지과 채소의 렉틴·알칼로이드가 관절염과 자가면역질환을 악화시킨다",truth:"가지과 채소를 끊었을 때 관절염이 좋아지는지 검증한 무작위 대조시험은 없고, 관절염 관련 학회들도 근거가 없다고 봅니다. 익은 토마토의 토마틴은 매우 적고 잘 흡수되지 않습니다. 특정 음식에 증상이 반복된다면 몇 주 빼 보고 다시 먹어 보는 개인별 확인이 현실적입니다."},{claim:"토마토(라이코펜)를 먹으면 전립선암이 예방된다",truth:'토마토 소스를 자주 먹는 남성의 전립선암 위험이 낮았다는 코호트 연구가 있지만, 전체 연구를 모으면 결과가 엇갈립니다. 미국 FDA는 2005년 토마토와 전립선암의 관련 근거를 "매우 제한적"으로, 라이코펜 보충제는 근거가 없다고 평가했습니다.'},{claim:"토마토 씨가 신장결석을 만든다",truth:"토마토는 옥살산이 적은 편이고 씨는 소화되지 않고 배출됩니다. 결석 예방에는 충분한 물, 나트륨 줄이기가 더 중요합니다."}]},{id:"beet",name:"비트",en:"Beetroot",aliases:["비트루트","레드비트","비트주스","비트즙","비트잎","beetroot","beet","beets"],emoji:"🟣",category:"채소",summary:'식이 질산염이 채소 중 최상위권인 뿌리채소로, 비트 주스가 혈압을 낮추고 운동할 때 산소 효율을 높인다는 무작위 대조시험이 여럿 있습니다. 진한 자주색은 안토시아닌이 아닌 베타레인(베타닌) 색소 때문이며, 먹은 뒤 소변이 붉어지는 "비트뇨"는 대개 무해합니다.',verdict:{tone:"good",text:"자주 먹기 좋아요. 삶은 물을 버리기보다 찌거나 굽고, 먹기 전후 항균 가글은 피하세요."},basis:"생 비트 뿌리 100g",serving:{label:"중간 크기 1/2개 (약 80g)",grams:80},nutrients:{kcal:43,carb:9.6,sugar:6.8,fiber:2.8,protein:1.6,fat:.17,satFat:.03,mufa:.03,pufa:.06,sodium:78,potassium:325,calcium:16,magnesium:23,iron:.8,zinc:.35,selenium:.7,vitC:4.9,vitB1:.03,vitB2:.04,vitB6:.07,folate:109},compounds:[{id:"dietary-nitrate",amount:"대략 100~300mg/100g (재배 조건에 따라 편차 큼)",role:"흡수된 질산염의 약 4분의 1이 침샘으로 모였다가 혀 뒤쪽 세균이 아질산염으로 바꾸고, 삼킨 뒤 위산과 혈관 조직에서 산화질소(NO)가 됩니다. 산화질소가 혈관을 넓혀 혈압을 낮추고, 근육 미토콘드리아의 산소 효율을 높입니다."},{id:"folate",amount:"109μg/100g",role:"뿌리채소 중 엽산이 많은 편으로, 반 개로 하루 기준치의 약 20%를 채웁니다."},{id:"potassium",amount:"325mg/100g",role:"나트륨 배출을 도와 질산염과 함께 혈압 조절에 기여합니다."},{id:"oxalate",amount:"뿌리는 중간 정도, 잎은 시금치에 가까울 만큼 많음",role:"칼슘과 결합해 수산칼슘 결석 위험이 있는 사람에게 부담이 될 수 있습니다. 특히 비트 잎과 농축 주스에서 신경 쓸 부분입니다."},{id:"nonheme-iron",amount:"0.8mg/100g",role:"붉은색 때문에 철이 많다고 오해받지만 실제 철 함량은 평범한 수준의 식물성 철입니다."}],howToEat:[{title:"찌거나 굽기, 또는 생으로",body:"질산염은 물에 잘 녹아 삶은 물을 버리면 상당량이 빠져나갑니다. 껍질째 굽거나 찌면 질산염과 베타레인 색소가 더 많이 남습니다. 생으로 얇게 썰어 샐러드에 넣어도 좋습니다."},{title:"먹기 전후 항균 가글은 피하기",body:"질산염을 아질산염으로 바꾸는 것은 입속 세균입니다. 클로르헥시딘 같은 항균 구강청결제를 쓰면 이 세균이 줄어 혈압 저하 효과가 사라졌고, 건강한 사람도 1주일 사용 후 혈압이 약간 올랐습니다. 침을 자주 뱉는 것도 이 경로를 끊습니다."},{title:"운동에 쓰려면 2~3시간 전에",body:"혈중 아질산염은 섭취 후 2~3시간에 최고치가 됩니다. 비트 주스 연구는 대개 질산염 약 300~600mg(주스 약 500ml 또는 농축 주스 1~2병)을 운동 2~3시간 전에 마셨습니다."},{title:"비트 잎은 데쳐서",body:"잎은 옥살산이 많아 끓는 물에 데쳐 물을 버리면 크게 줄어듭니다. 데친 뒤 나물처럼 무치면 좋습니다."}],pairings:{good:["레몬·오렌지 (비타민 C가 위에서 니트로사민 생성 억제)","올리브유·요거트 (비트 샐러드)","견과류 (지방과 단백질로 당 흡수 완만)"],avoid:["항균 구강청결제 사용 직후"]},cautions:["수산칼슘 신장결석 병력이 있다면 비트 잎과 농축 주스를 많이 먹지 마세요.","혈압약을 먹는 사람이 매일 많은 양의 비트 주스를 시작하면 혈압이 추가로 떨어질 수 있으니 혈압을 확인하며 조절하세요.","만성콩팥병으로 칼륨을 제한 중이라면 양을 조절하세요.","비트 주스는 당이 농축되어 있어(뿌리 100g에 당 약 7g), 혈당 관리 중이라면 통째로 먹는 쪽이 낫습니다."],myths:[{claim:"비트는 붉어서 피를 만들고 빈혈에 좋다",truth:"붉은색은 베타레인 색소 때문이지 철 때문이 아닙니다. 철은 100g에 0.8mg으로 평범하고 흡수율이 낮은 식물성 철입니다. 엽산이 부족한 빈혈에는 도움이 될 수 있지만 철결핍성 빈혈의 해결책은 아닙니다."},{claim:"비트를 먹고 소변이 빨개지면 몸에 문제가 있다",truth:'사람의 약 10~14%에서 베타레인 색소가 분해되지 않고 소변으로 나오는 "비트뇨"가 생기며 대개 무해합니다. 철결핍이 있는 사람에게 더 흔하다는 보고가 있습니다. 비트를 먹지 않았는데도 붉은 소변이 나오면 혈뇨일 수 있으니 진료를 받으세요.'},{claim:"질산염은 발암물질이라 비트 같은 고질산염 채소도 위험하다",truth:'국제암연구소(IARC)는 "몸속에서 니트로사민이 생기는 조건에서 섭취한 질산염·아질산염"을 발암 추정 물질(2A군)로 봅니다. 가공육은 아질산염·아민·헴철이 함께 있어 이 조건에 해당하지만, 채소는 비타민 C·폴리페놀이 니트로사민 생성을 억제하고, 채소 속 질산염은 관찰연구에서 암 위험 증가와 연결되지 않았습니다.'}]},{id:"garlic",name:"마늘",en:"Garlic",aliases:["생마늘","다진마늘","깐마늘","통마늘","구운마늘","흑마늘","마늘기름","garlic","black garlic"],emoji:"🧄",category:"채소",summary:"으깨거나 다질 때 알리인과 효소(알리이나아제)가 만나 알리신이 만들어지고, 이것이 여러 유황화합물로 바뀌며 혈압·혈소판 기능에 작용합니다. 이 효소는 열에 약해, 다진 뒤 10분쯤 기다렸다 가열하는 것이 요령입니다. 프럭탄(프리바이오틱 섬유)도 채소 중 최상위권입니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 다지고 10분 뒤 가열하세요. 항응고제 복용 중이거나 수술 전이라면 마늘 보충제는 주의."},basis:"생 마늘 100g",serving:{label:"3쪽 (약 9g)",grams:9},nutrients:{kcal:149,carb:33,sugar:1,fiber:2.1,protein:6.4,fat:.5,satFat:.09,mufa:.01,pufa:.25,sodium:17,potassium:401,calcium:181,magnesium:25,iron:1.7,zinc:1.16,selenium:14.2,vitC:31,vitK:1.7,vitB1:.2,vitB2:.11,vitB6:1.24,folate:3},compounds:[{id:"allicin",amount:"마늘 1쪽을 으깨면 대략 수~십수 mg 생성",role:"통마늘 속 알리인과 알리이나아제는 세포 안 다른 칸에 떨어져 있다가, 으깨는 순간 만나 수십 초~수 분 만에 알리신이 됩니다. 알리신은 불안정해 다이알릴 다이설파이드·트라이설파이드·아조엔 등으로 바뀌고, 이들이 적혈구에서 황화수소(H₂S)를 내놓아 혈관을 이완하고 혈소판 응집을 억제합니다."},{id:"prebiotic-fiber",amount:"프럭탄(이눌린 계열)이 채소 중 최상위권",role:"소장에서 소화되지 않고 대장에서 비피도박테리아 등의 먹이가 되어 짧은사슬지방산을 만듭니다. 과민성대장증후군이 있는 사람에게는 가스·복통의 원인(FODMAP)이 되기도 합니다."},{id:"selenium",amount:"14μg/100g (3쪽이면 약 1μg)",role:"채소 중 셀레늄이 많은 편이지만 한 번에 먹는 양이 적어 하루 필요량에 대한 기여는 작습니다. 셀레늄이 풍부한 토양에서 키운 마늘은 함량이 훨씬 높아집니다."}],howToEat:[{title:"다지거나 으깨고 10분 기다린 뒤 가열",body:"알리이나아제는 열에 약해, 통마늘을 바로 가열하거나 다지자마자 전자레인지에 돌리면 알리신이 거의 생기지 않습니다. 동물 연구에서 으깬 뒤 10분 두고 가열한 마늘은 효과가 유지됐고, 바로 가열한 마늘은 효과가 사라졌습니다."},{title:"생마늘은 음식과 함께 조금씩",body:"생마늘은 알리신이 가장 많지만 위 점막을 자극합니다. 빈속에 여러 쪽을 먹기보다 무침·드레싱·쌈으로 음식과 함께 1~2쪽씩 드세요."},{title:"통마늘 구이·흑마늘은 성분이 다름",body:"통째로 구우면 효소가 먼저 파괴되어 알리신은 적지만 부드럽고 달아집니다. 흑마늘은 60~80℃ 높은 습도에서 몇 주 숙성시켜 알리신은 거의 없고, 물에 녹는 S-알릴시스테인과 마이야르 반응 산물이 늘어난 다른 식품이라고 보는 편이 정확합니다."},{title:"FODMAP에 민감하면 마늘기름으로",body:"프럭탄은 물에는 녹지만 기름에는 녹지 않습니다. 기름에 마늘을 넣어 향만 우리고 건더기를 건져내면 과민성대장 증상 없이 풍미를 낼 수 있습니다. 집에서 만든 마늘기름은 보툴리누스균 위험이 있어 냉장 보관하고 며칠 안에 쓰세요."}],pairings:{good:["올리브유 (다진 마늘을 약불에서 천천히)","양파·대파·부추 (같은 파속 채소의 유황화합물)","생선·고기 요리 (풍미를 살려 소금 사용↓)"],avoid:["항응고제·항혈소판제 복용 중 고용량 마늘 보충제"]},cautions:["와파린·아스피린·클로피도그렐 같은 약을 먹는 중이라면 마늘 보충제나 매우 많은 생마늘이 출혈 위험을 높일 수 있습니다. 수술 1~2주 전에는 마늘 보충제를 중단하는 것이 일반적인 권고입니다.","마늘 보충제는 HIV 치료제 사퀴나비르의 혈중 농도를 낮춘 보고가 있어, 복용 중인 약이 있다면 의사·약사와 상의하세요.","위염·역류성 식도염이 있으면 생마늘이 증상을 악화시킬 수 있습니다.","생마늘을 피부에 오래 붙이면 화학 화상이 생길 수 있습니다."],myths:[{claim:"마늘을 먹으면 콜레스테롤이 크게 떨어진다",truth:"생마늘(하루 약 1쪽)과 마늘 보충제를 6개월 먹게 한 무작위 대조시험에서 LDL 콜레스테롤은 변하지 않았습니다. 메타분석에서는 일부 보충제의 작은 효과가 보고되지만 결과가 엇갈립니다. 근거가 더 일관된 쪽은 혈압으로, 고혈압 환자에서 마늘 보충제가 수축기 혈압을 평균 수 mmHg 낮췄다는 메타분석이 있습니다."},{claim:"마늘이 감기를 예방하고 치료한다",truth:"코크란 체계적 고찰에서 조건에 맞는 시험은 소규모 한 건뿐이었고, 감기 예방·치료 효과를 판단할 근거가 부족하다고 결론 내렸습니다."},{claim:"흑마늘은 생마늘보다 몇 배 더 몸에 좋다",truth:'흑마늘은 S-알릴시스테인과 일부 항산화 물질이 늘지만 알리신은 거의 사라집니다. "몇 배 좋다"는 것은 특정 성분 수치를 비교한 마케팅 표현이며, 사람 대상 효과 연구는 소규모에 그칩니다.'}]},{id:"onion",name:"양파",en:"Onion",aliases:["적양파","자색양파","흰양파","햇양파","양파즙","양파껍질","양파껍질차","onion","red onion"],emoji:"🧅",category:"채소",summary:"퀘르세틴이 채소 중 가장 많은 편이고, 이눌린·프럭탄 같은 프리바이오틱 섬유와 마늘과 같은 계열의 유황화합물을 가진 파속 채소입니다. 퀘르세틴은 겉껍질에 가까운 층과 적양파·노란 양파에 많아, 껍질을 너무 두껍게 벗기지 않는 것이 요령입니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 껍질은 얇게 벗기고, 기름에 볶거나 국물째 드세요."},basis:"생 양파 100g",serving:{label:"중간 크기 1/2개 (약 100g)",grams:100},nutrients:{kcal:40,carb:9.3,sugar:4.2,fiber:1.7,protein:1.1,fat:.1,satFat:.04,mufa:.01,pufa:.02,sodium:4,potassium:146,calcium:23,magnesium:10,iron:.21,zinc:.17,selenium:.5,vitC:7.4,vitK:.4,vitB1:.05,vitB2:.03,vitB6:.12,folate:19},compounds:[{id:"quercetin",amount:"대략 10~40mg/100g (품종·부위에 따라 차이 큼, 적양파·노란 양파 > 흰 양파)",role:"양파 퀘르세틴은 포도당이 붙은 형태(글루코사이드)라 소장의 당 수송체와 효소를 통해 잘 흡수됩니다. 사람 연구에서 양파 퀘르세틴의 흡수는 사과의 약 3배였습니다. 흡수 후 간에서 포합체로 바뀌어 혈관 내피의 염증 신호와 산화 스트레스 조절에 관여합니다."},{id:"prebiotic-fiber",amount:"프럭탄·이눌린 포함",role:"대장에서 비피도박테리아의 먹이가 되어 짧은사슬지방산을 만듭니다. 과민성대장증후군이 있으면 가스·복통의 원인이 되기도 합니다."},{id:"allicin",amount:"마늘의 알리신 자체는 거의 없고, 같은 계열의 유황화합물이 있음",role:"양파의 주 원료는 이소알리인입니다. 썰 때 알리이나아제가 이를 설펜산으로 바꾸면 대부분은 눈물 성분(프로판티알 S-옥사이드)이 되고, 나머지가 마늘 알리신과 같은 티오설피네이트·세파엔으로 바뀌어 혈소판 응집 억제 작용(주로 실험실 결과)을 보입니다. 익히면 단맛을 내는 황화물로 바뀝니다."},{id:"anthocyanin",amount:"적양파의 붉은 겉층에만",role:"적양파의 자주색을 내며, 바깥쪽 몇 겹에 몰려 있습니다. 퀘르세틴과 함께 적양파의 폴리페놀 함량을 높입니다."},{id:"vitamin-c",amount:"7.4mg/100g",role:"양은 많지 않지만 생양파로 먹으면 함께 섭취됩니다."}],howToEat:[{title:"껍질은 얇게 벗기기",body:"퀘르세틴은 바깥쪽 살 층에 가장 많고 안쪽으로 갈수록 줄어듭니다. 마른 겉껍질만 벗기고 먹을 수 있는 첫 겹은 살리세요. 마른 껍질 자체도 퀘르세틴이 매우 많아 육수에 함께 넣고 끓였다가 건져 내는 방법이 있습니다."},{title:"볶거나 굽기, 삶으면 국물까지",body:"퀘르세틴은 비교적 열에 강해 볶거나 구워도 잘 남습니다. 반면 물에 삶으면 국물로 빠져나가므로 국·찌개처럼 국물째 먹는 요리가 좋습니다."},{title:"기름과 함께",body:"퀘르세틴은 물에 잘 녹지 않아, 지방과 함께 먹을 때 흡수가 늘었다는 사람 연구가 있습니다. 올리브유·들기름에 볶는 조리가 유리합니다."},{title:"생양파 매운맛은 찬물에 잠깐만",body:"매운맛 성분은 물에 녹아 나오므로 찬물에 5~10분 담그면 순해집니다. 오래 담그면 수용성 성분도 함께 빠집니다."}],pairings:{good:["올리브유·들기름 (퀘르세틴 흡수↑)","토마토 (함께 볶으면 라이코펜 흡수에도 도움)","마늘·대파 (같은 파속 채소의 유황화합물)"],avoid:["과민성대장 증상이 있을 때 생양파를 많이"]},cautions:["과민성대장증후군(FODMAP 민감)이 있으면 프럭탄 때문에 가스·복통·설사가 생길 수 있습니다. 대파의 초록 부분이나 기름에 향만 우린 방법으로 대체할 수 있습니다.","위식도역류가 있으면 생양파가 역류 증상을 늘릴 수 있다는 연구가 있습니다.","개·고양이에게는 양파가 적혈구를 파괴하는 빈혈(하인츠소체 빈혈)을 일으키므로 절대 먹이지 마세요."],myths:[{claim:"양파즙을 마시면 혈관이 깨끗해지고 혈압이 내려간다",truth:'퀘르세틴 보충제를 하루 500mg 이상 먹은 시험을 모은 메타분석에서 혈압이 약 3mmHg 낮아졌습니다. 양파즙 한 포에 든 퀘르세틴은 이보다 훨씬 적고, "혈관 청소"처럼 쌓인 플라크를 없앤다는 근거는 없습니다. 양파를 요리에 꾸준히 쓰는 것이 현실적입니다.'},{claim:"썬 양파를 방에 두면 감기 바이러스를 빨아들인다",truth:"1919년 독감 유행 무렵부터 전해진 민간요법으로, 양파가 공기 중 바이러스를 흡수한다는 근거는 없습니다."}]},{id:"cabbage",name:"양배추",en:"Cabbage",aliases:["적양배추","적채","자색양배추","양배추즙","사보이양배추","캐비지","cabbage","red cabbage"],emoji:"🥬",category:"채소",summary:'비타민 C·K와 글루코시놀레이트가 풍부한 십자화과 채소이고, 적양배추는 안토시아닌까지 더해집니다. "양배추가 위를 보호한다(비타민 U)"는 이야기는 1950년 전후의 소규모 비대조 연구에서 시작됐고 현대적 근거는 약합니다.',verdict:{tone:"good",text:"자주 먹기 좋아요. 생으로 채 썰어 먹거나 짧게 익히세요. 적양배추는 식초와 잘 맞습니다."},basis:"생 양배추(녹색) 100g",serving:{label:"채 썬 것 1컵 (약 90g)",grams:90},nutrients:{kcal:25,carb:5.8,sugar:3.2,fiber:2.5,protein:1.3,fat:.1,satFat:.03,mufa:.02,pufa:.02,sodium:18,potassium:170,calcium:40,magnesium:12,iron:.47,zinc:.18,selenium:.3,vitA:5,vitC:37,vitE:.15,vitK:76,vitB1:.06,vitB2:.04,vitB6:.12,folate:43},compounds:[{id:"sulforaphane",amount:"주 글루코시놀레이트는 시니그린·글루코브라시신, 글루코라파닌은 소량",role:"썰거나 씹을 때 미로시나아제가 글루코시놀레이트를 이소티오시아네이트(설포라판·알릴이소티오시아네이트)와 인돌 화합물로 바꿉니다. 이들이 Nrf2 해독 효소를 켜는 방향으로 작용하며, 톡 쏘는 맛의 원인이기도 합니다."},{id:"vitamin-c",amount:"37mg/100g (적양배추는 약 57mg)",role:"1컵으로 하루 기준치의 약 3분의 1을 채웁니다. 생으로 먹거나 짧게 익힐 때 많이 남습니다."},{id:"vitamin-k",amount:"76μg/100g",role:"1컵으로 하루 기준치(70μg)를 채웁니다. 혈액 응고와 뼈 단백질 활성화에 쓰입니다."},{id:"anthocyanin",amount:"적양배추 약 100~300mg/100g (녹색 양배추에는 거의 없음)",role:"적양배추의 보라색 색소로, 베리류에 버금가는 양입니다. 산에서는 붉게, 알칼리에서는 푸르게 변합니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.5g/100g",role:"장내 세균의 먹이가 됩니다. 라피노스 같은 올리고당도 있어 많이 먹으면 가스가 차기 쉽습니다."},{id:"folate",amount:"43μg/100g",role:"생으로 먹을 때 엽산이 잘 남습니다."}],howToEat:[{title:"생으로 채 썰어 잠시 두기",body:"생으로 먹으면 미로시나아제가 살아 있어 이소티오시아네이트가 잘 만들어지고 비타민 C도 온전히 남습니다. 채 썰어 몇 분 두었다가 먹으면 더 좋습니다."},{title:"익힐 땐 짧게",body:"오래 삶으면 글루코시놀레이트·비타민 C가 물로 빠지고, 유황화합물이 분해되며 특유의 쿰쿰한 냄새(황화수소·다이메틸설파이드)가 납니다. 찌거나 볶아서 아삭함이 남을 정도로 익히세요."},{title:"적양배추는 식초와 함께",body:"안토시아닌은 산성에서 안정적이고 선명한 붉은색이 됩니다. 식초 드레싱이나 절임으로 먹으면 색과 성분이 잘 유지됩니다. 반대로 베이킹소다가 닿으면 푸르게 변하고 분해가 빨라집니다."},{title:"발효해서 먹기 (사우어크라우트·양배추 김치)",body:"유산균 발효로 글루코시놀레이트가 이소티오시아네이트·인돌 화합물로 바뀌고 소화가 쉬워집니다. 살아 있는 균을 원한다면 살균하지 않은 제품을 고르세요."}],pairings:{good:["올리브유·마요 드레싱 (비타민 K 흡수↑)","겨자 (미로시나아제 보충)","식초 (적양배추 안토시아닌 안정)"]},cautions:["와파린 복용 중이라면 양배추즙처럼 한꺼번에 많이 먹는 것을 피하고 매일 비슷한 양을 유지하세요.","많이 먹으면 라피노스·유황화합물 때문에 가스와 복부 팽만이 생길 수 있습니다.","요오드가 부족한 상태에서 날 양배추·양배추즙을 매일 대량으로 먹으면 갑상선에 부담이 될 수 있습니다."],myths:[{claim:"양배추(비타민 U)가 위궤양을 치료하고 위를 보호한다",truth:'"비타민 U"는 비타민이 아니라 S-메틸메티오닌이라는 아미노산 유도체입니다. 1950년 전후 미국 의사 체니의 양배추즙 궤양 연구는 소규모 비대조 연구였고, 이후 제대로 된 무작위 대조시험은 없습니다. 위궤양의 주원인은 헬리코박터균과 소염진통제이며 치료는 약물로 해야 합니다. 양배추 속 설포라판이 실험실에서 헬리코박터균을 억제한 결과는 있지만, 사람 효과는 제한적입니다.'},{claim:'양배추는 소화에 쓰는 열량이 더 많은 "마이너스 칼로리" 식품이다',truth:"음식을 소화하는 데 드는 에너지는 그 음식 열량의 약 10% 안팎이라, 100g에 25kcal인 양배추도 열량이 남습니다. 다만 열량이 낮고 부피가 커서 포만감에는 도움이 됩니다."}]},{id:"sweet-potato",name:"고구마",en:"Sweet potato",aliases:["자색고구마","호박고구마","밤고구마","꿀고구마","군고구마","찐고구마","고구마말랭이","sweet potato","purple sweet potato"],emoji:"🍠",category:"채소",summary:"속이 주황색인 고구마는 베타카로틴, 자색고구마는 안토시아닌이 풍부하고 식이섬유와 칼륨도 들어 있습니다. 같은 고구마라도 조리법에 따라 혈당지수가 크게 달라져, 찌거나 삶은 것이 오래 구운 것보다 혈당을 덜 올리고, 식혀 먹으면 저항성 전분이 늘어납니다.",verdict:{tone:"good",text:"좋은 탄수화물 식품. 군고구마보다 찐 고구마, 한 번에 중간 크기 1개 정도로."},basis:"생 고구마(주황색 속 품종) 100g",serving:{label:"중간 크기 1개 (약 150g)",grams:150},nutrients:{kcal:86,carb:20.1,sugar:4.2,fiber:3,protein:1.6,fat:.05,sodium:55,potassium:337,calcium:30,magnesium:25,iron:.61,zinc:.3,vitA:709,vitC:2.4,vitE:.26,vitB1:.08,vitB2:.06,vitB6:.21,folate:11},compounds:[{id:"beta-carotene",amount:"주황색 속 품종 약 8.5mg/100g",role:"속이 주황색일수록 많아 호박고구마가 밤고구마보다 훨씬 많습니다. 영양성분의 비타민 A 수치는 주황색 품종 기준이며, 속이 노르스름한 밤고구마는 베타카로틴이 훨씬 적습니다."},{id:"anthocyanin",amount:"자색고구마에만",role:'자색고구마의 안토시아닌은 페룰산·카페산이 붙은 "아실화" 형태라 베리류 안토시아닌보다 열과 pH 변화에 강해, 찌거나 구워도 상당 부분 남습니다.'},{id:"resistant-starch",amount:"익혀서 식히면 증가",role:"익힌 고구마를 식히면 호화됐던 전분이 다시 결정화(노화)되어 소화 효소가 잘 분해하지 못하는 저항성 전분(RS3)이 늘어납니다. 혈당 상승이 완만해지고 대장 세균의 먹이가 됩니다."},{id:"prebiotic-fiber",amount:"식이섬유 3.0g/100g",role:"껍질째 먹으면 섬유가 더 늘어 포만감을 주고 장내 발효로 짧은사슬지방산을 만듭니다."},{id:"potassium",amount:"337mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."},{id:"chlorogenic-acid",amount:"껍질과 껍질 바로 아래에 많음",role:"고구마의 주된 폴리페놀인 카페오일퀸산류입니다. 자른 단면이 갈색으로 변하는 것은 이 성분이 산화되기 때문입니다."}],howToEat:[{title:"오래 굽기보다 찌거나 삶기",body:"고구마에는 열에 비교적 강한 β-아밀레이스가 있어, 천천히 오래 구우면 호화된 전분이 엿당(말토스)으로 분해되어 달아지고 혈당도 빨리 오릅니다. 한 연구에서 삶은 고구마의 GI는 약 45, 구운 고구마는 80~90대로 측정됐습니다."},{title:"식혀 먹거나 식힌 것을 데워 먹기",body:"익힌 고구마를 냉장고에서 식히면 저항성 전분이 늘어납니다. 다시 데워도 일부는 유지됩니다."},{title:"껍질째 먹기",body:"섬유와 클로로겐산 같은 폴리페놀이 껍질 쪽에 많습니다. 흙을 잘 씻어 껍질째 드세요."},{title:"단백질·지방과 함께",body:"우유·달걀·견과를 곁들이면 위 배출이 느려져 혈당 상승이 완만해지고, 지용성인 베타카로틴 흡수도 늘어납니다."}],pairings:{good:["우유·요거트·달걀 (혈당 완만 + 베타카로틴 흡수↑)","견과류","김치·나물 반찬과 한 끼로"],avoid:["맛탕·고구마튀김 (설탕 시럽·튀김기름)"]},cautions:["검은 반점이 있거나 쓴맛이 나는 부분은 곰팡이 감염·상처에 반응해 생긴 이포메아마론 같은 독성 물질일 수 있습니다. 열에 파괴되지 않으므로 넉넉히 도려내고, 전체가 쓰면 버리세요.","당뇨가 있다면 군고구마는 혈당을 빠르게 올릴 수 있어, 찐 고구마로 양을 정해 드세요.","만성콩팥병으로 칼륨을 제한 중이라면 양을 조절하세요."],myths:[{claim:"고구마는 다이어트 식품이라 많이 먹어도 살이 안 찐다",truth:"생 고구마 100g에 약 86kcal이고, 수분이 적은 밤고구마는 더 높습니다. 중간 크기 한두 개면 밥 한 공기에 가까운 열량이 됩니다. 섬유가 많아 포만감이 좋을 뿐, 탄수화물 식품이라는 점은 같습니다."},{claim:"고구마는 GI가 낮아 당뇨에 좋다",truth:"조리법에 따라 다릅니다. 삶거나 찐 고구마는 GI가 중간 정도지만, 오래 구운 군고구마는 흰쌀밥 못지않게 높게 측정됩니다. 찌거나 삶아서, 식혀서, 단백질과 함께 먹는 것이 혈당에 유리합니다."}]},{id:"potato",name:"감자",en:"Potato",aliases:["찐감자","햇감자","알감자","수미감자","감자샐러드","삶은감자","potato","potatoes"],emoji:"🥔",category:"채소",summary:"칼륨·비타민 C·비타민 B6가 들어 있는 전분 채소입니다. 뜨겁게 으깬 감자는 흰쌀밥처럼 혈당을 빠르게 올리지만, 삶아서 식히면 저항성 전분이 늘어 혈당 반응이 낮아집니다. 초록색으로 변한 부분·싹의 글리코알칼로이드와 튀김의 아크릴아마이드는 보관과 조리로 줄일 수 있는 위험입니다.",verdict:{tone:"balanced",text:"삶거나 쪄서, 가능하면 식혀 드세요. 튀김은 가끔, 녹색·싹 부위는 깊게 도려내세요."},basis:"생 감자(껍질 포함) 100g",serving:{label:"중간 크기 1개 (약 150g)",grams:150},nutrients:{kcal:77,carb:17.5,sugar:.8,fiber:2.1,protein:2.1,fat:.09,sodium:6,potassium:425,calcium:12,magnesium:23,iron:.81,zinc:.3,vitC:19.7,vitB1:.08,vitB2:.03,vitB6:.3,folate:15},compounds:[{id:"potassium",amount:"425mg/100g",role:"바나나(358mg)보다 많은 칼륨을 줍니다. 칼륨은 물에 녹아 나오므로 잘게 썰어 삶으면 줄고, 껍질째 찌거나 구우면 잘 남습니다."},{id:"vitamin-c",amount:"약 20mg/100g (조리 시 일부 손실)",role:"감자는 한 번에 먹는 양이 많아 비타민 C 공급원 역할을 합니다. 껍질째 찌면 손실이 적습니다."},{id:"resistant-starch",amount:"삶아 식히면 증가",role:"삶은 감자를 냉장고에서 식히면 전분이 재결정화되어 저항성 전분이 늘고, 식후 혈당 반응이 크게 낮아집니다. 대장에서 부티르산을 만드는 세균의 먹이가 됩니다."},{id:"refined-carb",amount:"뜨거운 으깬 감자·튀김은 GI 높음",role:"감자 전분은 익히면 쉽게 호화되어 소화 효소가 빠르게 포도당으로 분해합니다. 뜨거운 으깬 감자·인스턴트 감자는 GI가 80 이상으로 흰빵과 비슷해, 정제 탄수화물처럼 혈당과 인슐린을 빠르게 올립니다."},{id:"glycoalkaloid",amount:"보통 기준치(20mg/100g)보다 훨씬 낮음, 녹색 부위·싹·눈 주변은 몇 배~수십 배",role:"솔라닌·차코닌은 감자가 스스로를 지키는 물질로, 세포막 콜레스테롤과 결합해 막을 손상시키고 아세틸콜린 분해효소를 억제합니다. 빛을 받으면 엽록소(녹색)와 함께 늘어나며, 삶거나 튀겨도 거의 파괴되지 않습니다."},{id:"acrylamide",amount:"생감자·삶은 감자에는 거의 없음, 튀김·칩에서 생성",role:"감자에 많은 아스파라긴과 당이 120℃ 이상에서 마이야르 반응을 일으켜 생깁니다. 국제암연구소 2A군(발암 추정)이며, 짙은 갈색으로 튀기거나 구울수록 늘어납니다."}],howToEat:[{title:"삶거나 쪄서 식혀 먹기",body:"식힌 감자는 저항성 전분이 늘어납니다. 같은 감자를 뜨겁게 먹었을 때 GI가 약 89, 식혀서 먹었을 때 약 56으로 측정된 연구가 있습니다. 감자샐러드처럼 식초 드레싱을 더하면 위 배출이 느려져 혈당 반응이 더 낮아졌습니다."},{title:"녹색·싹·눈은 깊게 도려내기",body:"글리코알칼로이드는 껍질과 그 바로 아래, 싹과 눈 주변에 몰려 있고 가열해도 없어지지 않습니다. 녹색 부위는 껍질을 두껍게 벗기고, 넓게 초록색이거나 쓴맛·아린 맛이 나면 버리세요."},{title:"튀김·구이는 노릇하게까지만",body:"썬 감자를 물에 15~30분 담그거나 살짝 데친 뒤 튀기면 표면의 당과 아스파라긴이 빠져 아크릴아마이드가 줄어듭니다. 갈색이 아닌 황금색에서 멈추고, 같은 기름을 반복해 쓰지 마세요."},{title:"서늘하고 어두운 곳에 보관",body:"빛을 받으면 초록색으로 변하면서 글리코알칼로이드도 함께 늘어납니다. 종이봉투나 상자에 넣어 햇빛·형광등을 피하세요."},{title:"단백질·채소와 한 끼로",body:"감자만 먹기보다 달걀·고기·채소와 함께 먹으면 소화 속도가 느려져 혈당 상승이 완만해집니다."}],pairings:{good:["식초·올리브유 드레싱 (식힌 감자샐러드: 혈당 반응↓)","달걀·고기·채소 (혼합 식사로 혈당 완만)"],avoid:["싹 나고 초록색으로 변한 감자","반복 사용한 기름으로 튀긴 감자튀김"]},cautions:["녹색으로 변했거나 싹이 많이 난 감자, 먹었을 때 쓰거나 입이 아린 감자는 글리코알칼로이드가 많을 수 있습니다. 구토·설사·복통·두통이 생길 수 있고, 몸집이 작은 어린이가 더 취약합니다.","만성콩팥병으로 칼륨을 제한 중이라면 껍질을 벗겨 잘게 썬 뒤 물에 담갔다가 새 물에 삶으면 칼륨을 줄일 수 있습니다. 담당 의료진의 지침을 따르세요.","당뇨가 있다면 뜨거운 으깬 감자·튀김보다 삶아 식힌 감자를 적당량 드세요."],myths:[{claim:"감자는 살찌고 당뇨를 부르는 나쁜 탄수화물이다",truth:"먹는 형태에 따라 다릅니다. 미국의 대규모 코호트 연구에서 감자튀김 섭취는 제2형 당뇨 위험 증가와 뚜렷하게 연관됐지만, 삶거나 구운 감자의 연관성은 약했습니다. 감자는 칼륨·비타민 C를 주는 식품이며, 튀김·버터·치즈를 더하는 조리와 양이 더 큰 문제입니다."},{claim:"싹만 도려내면 초록색 감자도 안전하다",truth:"초록색 자체는 무해한 엽록소지만, 빛을 받아 글리코알칼로이드가 함께 늘었다는 신호입니다. 싹뿐 아니라 초록 부위와 그 아래까지 두껍게 도려내야 하고, 넓게 초록색이거나 쓴맛이 나면 버리는 것이 안전합니다."}]},{id:"shiitake",name:"표고버섯",en:"Shiitake mushroom",aliases:["표고","생표고","건표고","말린표고","표고가루","표고버섯가루","shiitake","shiitake mushroom"],emoji:"🍄",category:"채소",summary:"렌티난 같은 베타글루칸과 감칠맛 성분(구아닐산)이 풍부한 버섯입니다. 햇볕이나 자외선을 쬐면 에르고스테롤이 비타민 D2로 바뀌고, 버섯에 특히 많은 항산화 아미노산 에르고티오네인도 들어 있습니다. 다만 날것이나 덜 익힌 표고는 드물게 채찍 모양 발진(표고버섯 피부염)을 일으킵니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 반드시 충분히 익혀 드세요. 햇볕에 한 번 더 쬐면 비타민 D가 늘어납니다."},basis:"생 표고버섯 100g",serving:{label:"생표고 3개 (약 50g)",grams:50},nutrients:{kcal:34,carb:6.8,sugar:2.4,fiber:2.5,protein:2.2,fat:.49,sodium:9,potassium:304,calcium:2,magnesium:20,iron:.41,zinc:1.03,selenium:5.7,vitD:.4,vitB1:.02,vitB2:.22,vitB6:.29,folate:13},compounds:[{id:"beta-glucan",amount:"세포벽 다당류 (렌티난 포함)",role:"렌티난은 β-1,3 사슬에 β-1,6 가지가 붙은 베타글루칸입니다. 먹으면 거의 흡수되지 않지만, 소장 파이어판의 M세포가 일부를 받아들이고 대식세포·수지상세포의 덱틴-1 수용체가 이를 인식해 면역 반응을 조절합니다. 대장에서는 발효성 섬유로도 작용합니다."},{id:"vitamin-d",amount:"생표고 약 0.4μg/100g, 햇볕·자외선을 쬐면 수 배~수십 배",role:"버섯 세포막의 에르고스테롤이 자외선(UVB)을 받으면 비타민 D2로 바뀝니다. 실내에서 기른 생표고와 열풍 건조한 표고는 적고, 햇볕에 말리거나 자외선 처리한 제품은 많습니다."},{id:"selenium",amount:"5.7μg/100g",role:"채소류 중에는 셀레늄이 있는 편으로, 글루타티온 과산화효소 같은 항산화 효소의 재료가 됩니다."},{id:"potassium",amount:"304mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다. 감칠맛이 강해 요리의 소금을 줄이는 데도 도움이 됩니다."}],howToEat:[{title:"속까지 충분히 익혀 먹기",body:"표고버섯 피부염은 날것이나 덜 익힌 표고를 먹은 뒤 생기며, 열에 약한 렌티난이 원인으로 추정됩니다. 볶음·구이·찌개에서 속까지 충분히 익히면 위험이 크게 줄어듭니다."},{title:"주름이 위를 향하게 햇볕에 쬐기",body:"먹기 전 생표고나 말린 표고를 주름이 위로 오게 펼쳐 한낮 햇볕에 몇 시간 두면 비타민 D2가 크게 늘어납니다. 유리창을 거치면 UVB가 차단되므로 바깥에서 쬐어야 합니다."},{title:"말린 표고 불린 물은 육수로",body:"불리는 동안 구아닐산·수용성 다당류·칼륨이 물로 빠져나옵니다. 찬물에 천천히 불리고 그 물은 국물로 쓰세요."},{title:"기름에 볶기",body:"비타민 D는 지용성이라 들기름·참기름에 볶으면 흡수에 유리하고, 버섯이 기름을 흡수해 풍미도 좋아집니다."}],pairings:{good:["다시마 (다시마 글루탐산 + 표고 구아닐산의 감칠맛 상승 → 소금 사용↓)","들기름·참기름 (비타민 D 흡수↑)","두부·달걀 (단백질 보완)"],avoid:["날표고 샐러드·덜 익힌 표고 꼬치구이"]},cautions:["날것·덜 익힌 표고를 먹고 1~2일 뒤 몸통·팔다리에 채찍으로 긁은 듯한 가려운 붉은 줄무늬 발진이 생기면 표고버섯 피부염일 수 있습니다. 대개 수 주 안에 가라앉지만 피부과 진료를 받고 표고를 날로 먹지 마세요.","말린 표고는 퓨린이 비교적 많은 편이라 통풍이 있으면 많이 먹지 않는 것이 좋습니다.","렌티난·버섯 추출물 보충제는 면역 기능에 영향을 줄 수 있어 면역억제제 복용 중이거나 자가면역질환이 있다면 의사와 상의하세요."],myths:[{claim:"표고버섯의 렌티난이 암을 치료한다",truth:"렌티난은 일본에서 위암 항암치료에 함께 쓰는 주사제로 승인된 적이 있지만, 이는 정제한 성분을 혈관에 주사한 경우입니다. 먹은 베타글루칸은 거의 흡수되지 않아 같은 효과를 기대할 수 없습니다. 표고를 4주간 매일 먹은 소규모 연구에서 일부 면역 지표가 변했지만, 질병 예방·치료 효과로 이어지는지는 확인되지 않았습니다."},{claim:"말린 표고는 모두 비타민 D가 풍부하다",truth:"햇볕에 말렸을 때만 그렇습니다. 시판 건표고는 대부분 열풍 건조라 비타민 D가 적을 수 있어, 먹기 전 햇볕을 쬐는 것이 확실합니다. 버섯의 비타민 D2도 혈중 비타민 D를 올리지만, 동물성·보충제의 D3보다 오래 유지하는 효과는 약하다는 메타분석이 있습니다."}]},{id:"chili-pepper",name:"고추",en:"Chili pepper",aliases:["청양고추","풋고추","홍고추","꽈리고추","오이고추","고춧가루","할라피뇨","매운고추","chili","chili pepper","hot pepper"],emoji:"🌶️",category:"채소",summary:'매운맛 성분 캡사이신과 과일보다 많은 비타민 C를 가진 채소입니다. 캡사이신은 열·통증 감각 수용체(TRPV1)를 자극해 "화끈한" 느낌을 만들고 에너지 소비를 조금 늘립니다. 대규모 코호트에서 매운 음식을 자주 먹는 사람의 사망률이 조금 낮았지만, 역류성 식도염·과민성대장이 있으면 증상을 악화시킬 수 있습니다.',verdict:{tone:"good",text:"위장 증상이 없다면 즐겨도 좋아요. 역류·과민성대장이 있으면 양을 조절하고, 짠 양념과의 조합에 주의하세요."},basis:"생 홍고추 100g",serving:{label:"고추 2~3개 (약 30g)",grams:30},nutrients:{kcal:40,carb:8.8,sugar:5.3,fiber:1.5,protein:1.9,fat:.44,satFat:.04,mufa:.02,pufa:.24,sodium:9,potassium:322,calcium:14,magnesium:23,iron:1.03,zinc:.26,vitA:48,vitC:144,vitE:.69,vitK:14,vitB1:.07,vitB2:.09,vitB6:.51,folate:23},compounds:[{id:"capsaicin",amount:"품종에 따라 수십 배 차이 (청양고추 > 풋고추 > 꽈리·오이고추)",role:'입과 위장의 감각신경에 있는 TRPV1 채널에 결합해 칼슘을 유입시키고, 뇌는 이를 "뜨거움·통증"으로 인식합니다. 교감신경을 자극해 열 생산을 약간 늘리고, 반복 노출되면 수용체가 둔해져 매운맛에 익숙해집니다.'},{id:"vitamin-c",amount:"홍고추 약 140mg, 풋고추 약 240mg/100g (USDA 기준, 품종에 따라 차이)",role:"무게당 비타민 C가 귤·오렌지보다 많습니다. 풋고추 몇 개를 생으로 먹으면 하루 기준치의 상당 부분을 채웁니다. 열과 건조에 약해 고춧가루에는 적게 남습니다."},{id:"beta-carotene",amount:"홍고추에 많음",role:"홍고추의 붉은색은 주로 캡산틴·캡소루빈이라는 카로티노이드이고 베타카로틴도 함께 들어 있습니다. 모두 지용성이라 고추기름처럼 기름에 볶으면 흡수가 늘어납니다."}],howToEat:[{title:"매운 정도는 흰 심지(태좌)가 좌우",body:"캡사이신은 씨 자체보다 씨가 붙어 있는 흰 심지(태좌)에 가장 많습니다. 덜 맵게 먹으려면 심지와 씨를 긁어내세요."},{title:"비타민 C는 생으로",body:"비타민 C는 열에 약해 오래 끓이거나 말리면 크게 줄어듭니다. 풋고추를 된장에 찍어 먹는 방식이 비타민 C 면에서는 가장 좋습니다."},{title:"매울 땐 물 대신 우유·기름진 음식",body:"캡사이신은 물에 녹지 않고 지방에 녹습니다. 물은 오히려 입안에 퍼뜨리고, 우유의 지방과 카제인 단백질이 캡사이신을 씻어 냅니다."},{title:"고춧가루는 서늘·건조·밀봉 보관",body:"습한 곳에 두면 곰팡이가 자라 아플라톡신 같은 곰팡이독소가 생길 수 있고, 빛과 산소에 붉은 색소가 산화되어 색이 바랩니다. 밀봉해 냉장·냉동 보관하세요."}],pairings:{good:["기름 (고추기름: 캡사이신·카로티노이드가 녹아 흡수↑)","된장 (풋고추 생식)","우유·요거트 (매운맛 진정)"],avoid:["짠 양념과 과다 조합 (매운 음식은 나트륨이 함께 많아지기 쉬움)"]},cautions:["역류성 식도염·위염이 있으면 캡사이신이 속쓰림을 악화시킬 수 있습니다.","과민성대장증후군 환자는 장의 TRPV1이 예민해져 있어, 매운 음식이 복통·설사를 유발하기 쉽습니다.","청양고추를 손질한 손으로 눈·코를 만지면 심한 자극이 생깁니다. 장갑을 끼거나 손을 기름·비누로 씻으세요."],myths:[{claim:"매운 음식이 위궤양을 만든다",truth:"위궤양의 주원인은 헬리코박터균과 소염진통제입니다. 캡사이신은 오히려 감각신경의 CGRP 분비로 위 점막 혈류를 늘려 점막을 보호한다는 동물·소규모 사람 연구도 있습니다. 다만 이미 위염·궤양이 있으면 통증을 악화시킬 수 있습니다. 매운 음식과 위암의 관련성은 연구마다 엇갈리며, 한국인에게는 함께 먹는 짠 음식과 헬리코박터 감염이 더 중요한 요인으로 봅니다."},{claim:"매운 음식을 먹으면 살이 빠진다",truth:"캡사이신은 에너지 소비를 조금 늘리지만 하루 수십 kcal 수준으로 작습니다. 식욕을 약간 줄인다는 연구도 있지만, 매운 음식은 기름·당·나트륨이 많은 양념과 함께 먹는 경우가 많아 전체 식사가 더 중요합니다."}]},{id:"apple",name:"사과",en:"Apple",aliases:["부사","홍로","홍옥","아오리","청사과","풋사과","사과껍질","apple","apples"],emoji:"🍎",category:"과일",summary:"껍질의 퀘르세틴, 과육의 펙틴과 클로로겐산을 가진 과일입니다. 과당이 들어 있지만 섬유와 세포 구조에 싸여 천천히 흡수되어, 같은 당이라도 주스나 첨가당과는 몸의 반응이 다릅니다. 폴리페놀의 상당 부분이 껍질에 있어 잘 씻어 껍질째 먹는 것이 좋습니다.",verdict:{tone:"good",text:"자주 먹기 좋아요. 껍질째 하루 1개, 주스보다 통사과로."},basis:"생 사과(껍질 포함) 100g",serving:{label:"중간 크기 1개 (약 200g)",grams:200},nutrients:{kcal:52,carb:13.8,sugar:10.4,fiber:2.4,protein:.26,fat:.17,satFat:.03,mufa:.01,pufa:.05,sodium:1,potassium:107,calcium:6,magnesium:5,iron:.12,zinc:.04,vitA:3,vitC:4.6,vitE:.18,vitK:2.2,vitB1:.02,vitB2:.03,vitB6:.04,folate:3},compounds:[{id:"prebiotic-fiber",amount:"식이섬유 2.4g/100g (상당 부분이 펙틴)",role:"펙틴은 장에서 젤을 만들어 당 흡수를 늦추고 담즙산과 결합해 콜레스테롤 배출을 돕습니다. 대장에서 발효되어 짧은사슬지방산을 만듭니다. 하루 사과 2개를 8주간 먹은 무작위 교차시험에서 총콜레스테롤과 LDL이 소폭 낮아졌습니다."},{id:"quercetin",amount:"껍질째 약 4mg/100g (대부분 껍질에)",role:"사과 퀘르세틴은 주로 껍질에 있고, 에피카테킨·프로시아니딘 같은 다른 플라보노이드와 함께 혈관 내피의 산화질소를 늘리는 쪽으로 작용합니다. 껍질을 벗기면 상당 부분이 사라집니다."},{id:"chlorogenic-acid",amount:"과육에 많은 편",role:"장에서 포도당 흡수를 늦추는 폴리페놀입니다. 자른 사과가 갈색으로 변하는 것은 폴리페놀 산화효소가 이 성분을 산화시키기 때문입니다."},{id:"added-sugar",effect:"mixed",amount:"과당 약 6g/100g (첨가당 아님)",role:"통사과의 과당은 섬유·세포벽에 싸여 천천히 흡수되어 소장이 대부분 처리하고, 간으로 한꺼번에 몰리지 않습니다. 대규모 코호트에서 사과 같은 통과일은 당뇨 위험 감소와, 과일주스는 위험 증가와 연관됐습니다."},{id:"vitamin-c",amount:"4.6mg/100g",role:"흔한 인식과 달리 사과의 비타민 C는 적은 편입니다. 사과의 강점은 섬유와 폴리페놀입니다."}],howToEat:[{title:"잘 씻어 껍질째",body:"퀘르세틴·프로시아니딘은 껍질에 과육보다 몇 배 많고, 섬유도 껍질에 많습니다. 흐르는 물에 문질러 씻으면 표면 잔류 농약이 줄고, 베이킹소다 물에 잠시 담갔다 헹구면 더 줄어든다는 연구가 있습니다."},{title:"주스보다 통째로 씹어서",body:"주스로 짜면 섬유와 껍질의 폴리페놀 대부분이 빠지고, 당이 빠르게 흡수됩니다. 같은 사과라도 통째로 먹는 쪽이 포만감과 혈당 면에서 유리합니다."},{title:"단백질·지방 간식과 함께",body:"땅콩버터·견과·치즈를 곁들이면 위 배출이 느려져 혈당 상승이 더 완만해지고 포만감이 오래갑니다."},{title:"갈변은 레몬즙으로 늦추기",body:"갈변은 폴리페놀이 산화된 결과로 해롭지는 않지만 폴리페놀 일부가 줄어든 것입니다. 레몬즙이나 옅은 소금물이 산화효소를 억제합니다."}],pairings:{good:["견과·땅콩버터·치즈 (혈당 완만, 포만감)","요거트·오트밀 (섬유 추가)"],avoid:["사과주스를 물처럼 마시기 (섬유 없는 당)"]},cautions:["과민성대장증후군(FODMAP 민감)이 있으면 사과의 과당·솔비톨이 가스·설사를 일으킬 수 있습니다.","자작나무 꽃가루 알레르기가 있으면 생사과에 입안이 가려운 구강알레르기 증후군이 생길 수 있습니다. 익힌 사과는 대개 괜찮습니다."],myths:[{claim:"아침 사과는 금, 저녁 사과는 독",truth:"먹는 시간에 따라 사과의 성분이 달라지지 않고, 저녁 사과가 해롭다는 근거는 없습니다. 역류나 장이 예민한 사람이 자기 전에 먹으면 산·발효 때문에 불편할 수 있는 정도의 개인차입니다."},{claim:"사과 씨에는 청산가리가 있어 몇 개만 먹어도 위험하다",truth:"사과 씨의 아미그달린은 씨를 씹어 부수면 시안화수소를 조금 내놓습니다. 하지만 씨 몇 개를 삼키거나 씹는 정도로는 해가 없고, 통째로 삼킨 씨는 단단한 껍질 때문에 대부분 그대로 배출됩니다. 위험하려면 많은 양의 씨를 곱게 갈아 먹어야 하므로, 씨를 모아 갈아 먹는 것만 피하면 됩니다."},{claim:"하루 사과 한 개면 의사가 필요 없다",truth:"미국 성인 조사에서 매일 사과를 먹는 사람과 아닌 사람의 병원 방문 횟수는 다른 조건을 보정하면 차이가 없었습니다. 사과는 좋은 식품이지만 마법의 식품은 아닙니다."}]},{id:"banana",name:"바나나",en:"Banana",aliases:["초록바나나","그린바나나","덜익은바나나","몽키바나나","바나나가루","banana","bananas","green banana"],emoji:"🍌",category:"과일",summary:"칼륨·비타민 B6·마그네슘을 가진 과일로, 익은 정도에 따라 성분이 크게 달라집니다. 초록빛이 도는 덜 익은 바나나는 저항성 전분이 많아 혈당을 천천히 올리고, 노랗게 익어 갈색 반점이 생길수록 전분이 당으로 바뀌어 달고 혈당을 더 빨리 올립니다.",verdict:{tone:"good",text:"하루 1개 정도 좋아요. 혈당이 신경 쓰이면 덜 익은 것으로, 요거트·견과와 함께."},basis:"생 바나나(과육) 100g",serving:{label:"중간 크기 1개 (껍질 제외 약 120g)",grams:120},nutrients:{kcal:89,carb:22.8,sugar:12.2,fiber:2.6,protein:1.1,fat:.33,satFat:.11,mufa:.03,pufa:.07,sodium:1,potassium:358,calcium:5,magnesium:27,iron:.26,zinc:.15,selenium:1,vitA:3,vitC:8.7,vitE:.1,vitK:.5,vitB1:.03,vitB2:.07,vitB6:.37,folate:20},compounds:[{id:"potassium",amount:"358mg/100g",role:"한 개로 하루 기준치의 약 12%를 채웁니다. 나트륨 배출을 돕고 근육·신경의 전기 신호에 쓰입니다."},{id:"resistant-starch",amount:"초록 바나나에 많고 익을수록 급감",role:"덜 익은 바나나의 전분은 결정 구조가 치밀한 RS2형이라 소장 효소가 잘 분해하지 못하고 대장으로 넘어가 부티르산을 만드는 세균의 먹이가 됩니다. 익어 가면서 이 전분 대부분이 당으로 바뀝니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.6g/100g (펙틴·프럭토올리고당 포함)",role:"펙틴과 소량의 프럭토올리고당이 장내 유익균의 먹이가 됩니다."},{id:"added-sugar",effect:"mixed",amount:"익은 바나나 당 약 12g/100g (첨가당 아님)",role:"익을수록 전분이 포도당·과당·자당으로 바뀌어 단맛과 혈당 반응이 커집니다. 갈색 반점이 많은 바나나는 당이 가장 많은 상태입니다."},{id:"magnesium",amount:"27mg/100g",role:"과일 중에는 마그네슘이 있는 편으로, 근육 이완과 에너지 대사 효소에 쓰입니다."}],howToEat:[{title:"혈당이 신경 쓰이면 덜 익은 것으로",body:"끝이 약간 초록빛인 바나나는 저항성 전분이 많고 당이 적어 GI가 낮습니다. 갈색 반점이 많아질수록 GI가 올라갑니다."},{title:"요거트·견과·땅콩버터와 함께",body:"단백질과 지방이 위 배출을 늦춰 혈당 상승을 완만하게 하고 포만감을 늘립니다."},{title:"운동 전후 간식",body:"소화가 쉬운 탄수화물과 칼륨을 함께 줍니다. 장거리 사이클 선수 연구에서 바나나가 스포츠음료와 비슷한 수준으로 운동 수행을 지원했습니다."},{title:"초록 바나나 가루는 가열하지 않고",body:"초록 바나나의 저항성 전분(RS2)은 가열하면 호화되어 대부분 사라집니다. 바나나 가루는 요거트·스무디에 섞어 생으로 쓰세요."},{title:"익은 바나나는 냉장·냉동으로 속도 조절",body:"냉장하면 껍질은 검게 변해도 과육 숙성은 느려집니다. 너무 익은 것은 껍질을 벗겨 냉동해 두었다가 스무디에 쓰세요."}],pairings:{good:["요거트·견과 (단백질·지방으로 혈당 완만)","오트밀 (섬유 추가, 설탕 대신 단맛)"],avoid:["연유·시럽을 더한 바나나 디저트"]},cautions:["만성콩팥병이 있거나 칼륨을 올리는 약(ACE 억제제, ARB, 스피로놀락톤 등)을 먹는 경우 고칼륨혈증 위험이 있어 양을 의료진과 상의하세요. 신장이 건강하면 과일 속 칼륨은 소변으로 잘 배출됩니다.","당뇨가 있다면 잘 익은 바나나는 반 개씩 나누어 먹거나 단백질과 함께 드세요.","라텍스 알레르기가 있으면 바나나·아보카도·키위 등에 교차 반응(라텍스-과일 증후군)이 생길 수 있습니다."],myths:[{claim:"바나나는 칼륨의 왕이다",truth:"100g당 칼륨은 바나나 358mg으로 적지 않지만, 감자(425mg)·시금치(558mg)·콩류가 더 많습니다. 바나나는 먹기 편한 칼륨 공급원 중 하나일 뿐입니다."},{claim:"바나나를 먹으면 세로토닌이 늘어 기분이 좋아진다",truth:"바나나에 세로토닌이 들어 있는 것은 맞지만, 먹은 세로토닌은 혈액-뇌 장벽을 통과하지 못해 뇌에 가지 않습니다. 원료인 트립토판 함량도 많지 않아, 바나나가 기분을 좋게 한다는 사람 근거는 없습니다."}]}],Ee=[{id:"orange",name:"귤·오렌지",en:"Mandarin & orange",aliases:["귤","감귤","밀감","온주밀감","한라봉","천혜향","레드향","황금향","오렌지","자몽","만다린","탠저린","오렌지주스","귤껍질","진피","mandarin","tangerine","orange","grapefruit","citrus"],emoji:"🍊",category:"과일",summary:"비타민 C, 헤스페리딘 같은 감귤 플라보노이드, 펙틴이 풍부한 감귤류입니다. 귤은 특히 몸에서 비타민 A로 바뀌는 카로티노이드인 β-크립토잔틴이 많습니다. 흰 속껍질까지 통째로 먹을 때 이점이 가장 크고, 주스로 마시면 섬유가 빠져 당이 빠르게 흡수됩니다. 같은 감귤류라도 자몽은 여러 약물의 대사를 방해하므로 따로 주의해야 합니다.",verdict:{tone:"good",text:"자주 먹기 좋은 과일. 주스보다 통과일로, 흰 속껍질(귤락)째 드세요. 자몽은 복용 중인 약을 먼저 확인하세요."},basis:"생 귤(만다린) 과육 100g",serving:{label:"중간 크기 귤 2개 (과육 약 150g)",grams:150},nutrients:{kcal:53,carb:13.3,sugar:10.6,fiber:1.8,protein:.8,fat:.31,satFat:.04,mufa:.06,pufa:.07,sodium:2,potassium:166,calcium:37,magnesium:12,iron:.15,zinc:.07,vitA:34,vitC:26.7,vitE:.2,vitB1:.06,vitB2:.04,vitB6:.08,folate:16},compounds:[{id:"vitamin-c",amount:"귤 약 27mg/100g, 오렌지 약 53mg/100g",role:"콜라겐을 만드는 수산화효소(프롤린·라이신 수산화효소)의 보조 인자이자 혈액 속 대표 수용성 항산화제입니다. 귤 2개면 하루 기준치의 약 40%, 오렌지 1개(약 130g)면 약 70%를 채웁니다."},{id:"hesperidin",amount:"과육 수십 mg/100g, 흰 속껍질·과피에 훨씬 많음",role:"감귤류에만 많은 플라바논입니다. 대장 미생물이 당을 떼어낸 헤스페레틴 형태로 흡수되어 혈관 내피 기능과 모세혈관 건강에 관여하는 것으로 연구됩니다. 흰 속껍질(귤락)과 알맹이 막에 몰려 있어 즙만 짜면 상당 부분 버려집니다."},{id:"beta-carotene",amount:"β-크립토잔틴 약 0.4mg/100g (USDA 만다린 기준, 품종에 따라 편차 큼)",role:"귤의 주황색 색소 β-크립토잔틴은 베타카로틴처럼 장 점막에서 BCO1 효소로 잘려 비타민 A(레티날)로 바뀌는 프로비타민 A 카로티노이드입니다. 귤을 많이 먹는 사람은 혈중 β-크립토잔틴 농도가 뚜렷하게 올라가, 귤 섭취를 반영하는 지표로 쓰일 정도입니다."},{id:"prebiotic-fiber",amount:"식이섬유 1.8g/100g (상당 부분 펙틴)",role:"펙틴이 물을 머금어 젤을 만들어 당 흡수를 늦추고, 대장에서 발효되어 짧은사슬지방산이 됩니다. 알맹이 막과 속껍질에 많아 주스에는 거의 남지 않습니다."},{id:"folate",amount:"귤 16μg/100g, 오렌지 약 30μg/100g",role:"과일 치고 엽산이 있는 편이라 DNA 합성과 메틸화 회로에 보탬이 됩니다."},{id:"potassium",amount:"166mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."}],howToEat:[{title:"흰 속껍질(귤락)은 떼지 말고 먹기",body:"헤스페리딘과 펙틴은 알맹이를 감싼 흰 실과 막에 과육보다 몇 배 많이 들어 있습니다. 귤은 알맹이째, 오렌지는 즙을 짜기보다 조각내 먹는 것이 좋습니다."},{title:"주스보다 통과일로",body:"주스로 만들면 섬유 구조가 깨지고 펙틴·속껍질이 걸러져, 같은 당이 훨씬 빠르게 흡수됩니다. 오렌지주스 한 컵(200mL)에는 당이 약 17~20g 들어 있어 오렌지 1.5~2개 분량의 당을 몇 분 만에 마시는 셈입니다. 대규모 코호트(Muraki 등, BMJ 2013)에서 통과일 섭취는 제2형 당뇨 위험 감소와, 과일주스는 위험 증가와 연관됐습니다."},{title:"철이 있는 식사 뒤 디저트로",body:"비타민 C가 식물성 비헴철(Fe³⁺)을 흡수되기 쉬운 Fe²⁺로 환원하고 녹는 형태로 붙잡아 흡수를 높입니다. 콩·시금치·잡곡밥 식사 뒤 귤 한두 개가 좋은 조합입니다."},{title:"까거나 짠 뒤에는 바로 먹기",body:"비타민 C는 공기·빛·열에 산화됩니다. 통째로 두면 비교적 안정적이지만, 껍질을 깐 과육이나 짜 둔 주스는 시간이 지날수록 줄어듭니다."},{title:"귤껍질(진피)은 잘 씻어 말려 쓰기",body:"과피에는 헤스페리딘과 노빌레틴 같은 폴리메톡시플라본이 과육보다 훨씬 많아 전통적으로 말려 차로 씁니다. 표면 왁스와 잔류 농약이 있을 수 있으니 흐르는 물에 문질러 씻어 쓰세요."}],pairings:{good:["콩·두부·시금치 등 철이 있는 식물성 식사 (비헴철 흡수↑)","견과 한 줌 (지방이 β-크립토잔틴 흡수를 도움)"],avoid:["자몽과 CYP3A4로 대사되는 약 (일부 스타틴·혈압약·면역억제제 등)","과일주스를 물처럼 마시기"]},cautions:["자몽(자몽주스 포함)과 포멜로·스위티·광귤(세빌 오렌지)에는 푸라노쿠마린(베르가모틴 등)이 있어 장벽의 약물 대사효소 CYP3A4를 비가역적으로 망가뜨립니다. 그 결과 심바스타틴·로바스타틴 같은 일부 스타틴, 펠로디핀 같은 칼슘통로차단제, 사이클로스포린·타크롤리무스 등의 혈중 농도가 크게 오를 수 있습니다. 효소가 새로 만들어지는 데 1~3일이 걸려 복용 시간을 떼는 것만으로는 피하기 어려우니, 복용 중인 약이 있다면 약사·의사에게 확인하세요.","귤과 일반 오렌지에는 푸라노쿠마린이 거의 없어 자몽 같은 문제는 일반적으로 없습니다. 다만 오렌지·자몽·사과 주스는 장의 약물 흡수 수송체(OATP)를 억제해 펙소페나딘(알레르기약) 같은 일부 약의 흡수를 줄일 수 있으니, 약은 물과 함께 드세요.","귤을 많이 먹어 손바닥·발바닥이 노랗게 되는 것은 카로티노이드가 피부에 쌓인 카로틴혈증으로, 눈 흰자는 노래지지 않고 섭취를 줄이면 사라집니다. 눈 흰자까지 노랗다면 황달일 수 있어 진료가 필요합니다.","위식도역류가 있다면 산미 때문에 속쓰림이 심해질 수 있습니다."],myths:[{claim:"감기에 걸렸을 때 귤·비타민 C를 많이 먹으면 감기가 낫는다",truth:"코크란 메타분석(Hemilä 등, 2013)에서 평소 비타민 C를 꾸준히 먹은 성인은 감기 기간이 약 8% 짧았지만, 감기에 걸린 뒤 먹기 시작하는 것은 일관된 효과가 없었습니다. 마라톤 선수처럼 극심한 신체 스트레스를 받는 사람에서는 감기 발생이 약 절반으로 줄었습니다. 부족하지 않게 꾸준히 먹는 것이 핵심입니다."},{claim:"비타민 C는 과일보다 고용량 보충제로 먹는 편이 낫다",truth:"혈중 비타민 C는 하루 약 200mg 섭취에서 거의 포화되고, 그 이상은 흡수율이 떨어지며 소변으로 나갑니다. 고용량 보충제를 먹는 남성에서 신장결석 위험이 높았다는 코호트 결과도 있습니다. 과일은 비타민 C 외에 플라보노이드와 섬유를 함께 줍니다."}]},{id:"strawberry",name:"딸기",en:"Strawberry",aliases:["설향","매향","금실","킹스베리","냉동딸기","딸기스무디","strawberry","strawberries"],emoji:"🍓",category:"과일",summary:"100g에 비타민 C가 약 59mg으로 오렌지보다 많고, 붉은색 안토시아닌(펠라고니딘 배당체)과 엘라지탄닌·엽산이 들어 있는 저열량·저당 과일입니다. 사람 시험에서 고탄수화물 식사와 함께 먹었을 때 식후 인슐린 반응과 염증·산화 지표를 줄였다는 결과가 있으나 대부분 소규모·단기 연구입니다. 어린이의 입 주변 발진은 대개 가벼운 반응이지만 드물게 진짜 알레르기도 있습니다.",verdict:{tone:"good",text:"자주 먹기 좋은 과일. 꼭지째 흐르는 물에 씻어 생으로, 8~10알이면 비타민 C 하루 기준치의 약 90%입니다."},basis:"생 딸기 100g",serving:{label:"8~10알 (약 150g)",grams:150},nutrients:{kcal:32,carb:7.7,sugar:4.9,fiber:2,protein:.67,fat:.3,satFat:.02,mufa:.04,pufa:.16,la:.09,ala:.07,sodium:1,potassium:153,calcium:16,magnesium:13,iron:.41,zinc:.14,selenium:.4,vitA:1,vitC:58.8,vitE:.29,vitK:2.2,vitB1:.02,vitB2:.02,vitB6:.05,folate:24},compounds:[{id:"vitamin-c",amount:"약 59mg/100g",role:"딸기의 대표 영양소로 과일 중 최상위권입니다. 콜라겐 합성과 비헴철 흡수를 돕고, 혈중 농도가 충분히 높아 몸속에서 활성산소를 실제로 직접 환원해 없애는 몇 안 되는 식이 항산화 물질입니다."},{id:"anthocyanin",amount:"대략 20~40mg/100g (대부분 펠라고니딘-3-글루코사이드)",role:"딸기의 붉은색은 블루베리의 시아니딘·델피니딘과 달리 주로 펠라고니딘 계열입니다. 흡수된 뒤 펠라고니딘 글루쿠로나이드 같은 대사물로 혈중에 나타나며, 식후 염증 지표와 인슐린 반응을 낮췄다는 소규모 사람 시험이 있습니다."},{id:"ellagitannin",amount:"엘라지탄닌·엘라그산 수십 mg/100g (겉에 박힌 씨에도 많음)",role:"대장 미생물이 유롤리틴으로 바꾸는 폴리페놀입니다. 유롤리틴을 얼마나 잘 만드는지는 사람마다 장내 미생물에 따라 크게 다릅니다."},{id:"folate",amount:"24μg/100g",role:"과일 중 엽산이 많은 편으로 150g이면 기준치의 약 9%입니다."},{id:"prebiotic-fiber",amount:"식이섬유 2.0g/100g",role:"펙틴 등 발효성 섬유가 당 흡수를 늦추고 장내 유익균의 먹이가 됩니다."}],howToEat:[{title:"꼭지째 흐르는 물에 씻고, 먹기 직전에 꼭지 떼기",body:"꼭지를 먼저 떼고 물에 담그면 잘린 곳으로 물이 스며들어 수용성인 비타민 C가 빠져나가고 맛도 싱거워집니다. 오래 담가 두기보다 흐르는 물에 30초 정도 헹구는 편이 낫습니다."},{title:"생으로, 또는 무가당 냉동으로",body:"비타민 C와 안토시아닌은 열에 약해 잼처럼 오래 졸이면 크게 줄어듭니다. 냉동은 대부분 보존하지만 해동하면 조직이 물러지니 스무디·요거트용으로 쓰세요."},{title:"빵·떡 같은 탄수화물 식사에 곁들이기",body:"고탄수화물 식사에 딸기를 곁들이면 식후 인슐린 반응과 염증 지표 상승이 줄었다는 소규모 시험들이 있습니다. 딸기 폴리페놀이 장의 포도당 수송체(SGLT1·GLUT2)와 전분 분해효소(α-글루코시데이스)를 일부 억제하는 것으로 추정됩니다."},{title:"딸기우유·딸기라떼·케이크는 별개로 보기",body:"시판 딸기 음료와 디저트는 과즙 함량이 낮고 당의 대부분이 첨가당이라 딸기의 장점을 기대하기 어렵습니다."}],pairings:{good:["플레인 요거트 (단백질·유산균과 함께)","시금치·콩 샐러드 (비타민 C로 비헴철 흡수↑)","견과류"],avoid:["연유·설탕 듬뿍 (당 부담이 효과를 상쇄)"]},cautions:["딸기를 먹은 뒤 입 주변이 붉어지는 것은 어린이에게 흔하며, 대개 과일산 자극이나 히스타민 유리 같은 비면역성 반응이라 가볍고 금방 사라집니다. 두드러기가 온몸에 퍼지거나 입술·목이 붓고 숨이 차다면 진짜 알레르기(자작나무 꽃가루 교차반응 단백질 Fra a 1, 지질전달단백질 Fra a 3 등)일 수 있어 진료가 필요합니다.","무르거나 잿빛 곰팡이가 핀 딸기는 곰팡이가 보이지 않는 곳까지 퍼졌을 수 있어 통째로 버리는 것이 안전합니다."],myths:[{claim:"딸기는 달아서 혈당을 많이 올린다",truth:"딸기의 당은 100g당 약 5g으로 과일 중 적은 편이고 식이섬유가 2g 있어 GI도 약 40으로 낮습니다. 한 접시(150g)를 먹어도 당은 약 7g입니다."},{claim:"딸기는 잔류 농약이 많아 먹지 않는 게 낫다",truth:"딸기는 잔류 농약이 검출되는 빈도가 높은 과일로 꼽히지만 대부분 기준치 이내이고, 흐르는 물에 씻으면 표면 잔류물이 상당히 줄어듭니다. 먹는 이득을 포기할 만한 근거는 부족합니다."}]},{id:"pomegranate",name:"석류",en:"Pomegranate",aliases:["석류알","석류즙","석류주스","석류농축액","석류청","pomegranate"],emoji:"🔴",category:"과일",summary:"석류의 붉은 알갱이에는 안토시아닌과 당이, 껍질·속막에는 퓨니칼라진이라는 거대한 엘라지탄닌이 몰려 있습니다. 퓨니칼라진은 거의 흡수되지 않고 대장 미생물이 유롤리틴으로 바꿔야 작용하는데, 이 변환 능력은 사람마다 크게 다릅니다. 혈압·혈관·전립선암 관련 사람 연구가 있지만 대부분 소규모이고 결과가 엇갈립니다.",verdict:{tone:"good",text:'알갱이를 씨째 먹으면 좋은 과일. 석류즙·농축액은 당이 많고, "여성호르몬" 효과는 과장입니다.'},basis:"생 석류 알갱이(씨 포함) 100g",serving:{label:"알갱이 반 컵 (약 87g)",grams:87},nutrients:{kcal:83,carb:18.7,sugar:13.7,fiber:4,protein:1.67,fat:1.17,satFat:.12,mufa:.09,pufa:.08,sodium:3,potassium:236,calcium:10,magnesium:12,iron:.3,zinc:.35,selenium:.5,vitC:10.2,vitE:.6,vitK:16.4,vitB1:.07,vitB2:.05,vitB6:.08,folate:38},compounds:[{id:"ellagitannin",amount:"퓨니칼라진은 주로 껍질·속막에, 알갱이에는 적음 (껍질째 압착한 주스에 비교적 많음)",role:"석류의 대표 성분입니다. 분자가 커서 거의 흡수되지 않고 장에서 엘라그산으로 풀린 뒤 대장 미생물(Gordonibacter 등)이 유롤리틴 A·B로 바꿉니다. 유롤리틴을 잘 만드는 사람과 거의 못 만드는 사람(메타보타입 0)이 있어 효과가 사람마다 다를 수 있습니다."},{id:"anthocyanin",amount:"알갱이·즙의 붉은색 (델피니딘·시아니딘·펠라고니딘 배당체)",role:"알갱이의 붉은 색소로, 흡수된 대사물이 Nrf2 항산화 신호와 혈관 내피의 산화질소 생성에 관여할 수 있습니다."},{id:"prebiotic-fiber",amount:"식이섬유 4.0g/100g (씨를 함께 씹을 때)",role:"섬유 대부분은 알갱이 속 씨에 있어 씨째 씹어 먹어야 얻을 수 있습니다. 주스에는 거의 남지 않습니다."},{id:"added-sugar",effect:"mixed",amount:"알갱이 약 14g/100g, 주스 약 12~13g/100mL",role:"알갱이로 먹을 때는 씨의 섬유가 흡수를 늦추지만, 주스·농축액·석류청·젤리 스틱은 당이 빠르게 흡수되고 설탕이 더해진 제품도 많습니다."},{id:"potassium",amount:"236mg/100g",role:"나트륨 배출을 도와 혈압 조절에 기여합니다."},{id:"vitamin-k",amount:"약 16μg/100g",role:"과일 치고 비타민 K가 있는 편으로, 반 컵이면 기준치의 약 20%입니다."}],howToEat:[{title:"알갱이를 씨째 씹어 먹기",body:"씨에 식이섬유와 석류씨유(퓨니식산이라는 특이한 공액 지방산)가 들어 있습니다. 씨를 뱉으면 섬유의 대부분을 버리게 됩니다."},{title:"주스는 100% 착즙·무가당으로 소량",body:"껍질째 압착한 주스는 퓨니칼라진이 알갱이보다 많지만, 섬유가 없고 한 컵(200mL)에 당이 약 25g입니다. 하루 100~150mL 이내가 무난하고, 농축액·석류청은 과즙 함량과 첨가당을 꼭 확인하세요."},{title:"요거트·샐러드·호두와 함께",body:"단백질·지방과 함께 먹으면 당 흡수가 완만해지고, 호두의 엘라지탄닌까지 더해 장내 유롤리틴의 원료가 늘어납니다."},{title:"껍질 추출물 보충제는 신중히",body:"껍질 추출물은 퓨니칼라진을 고농도로 담고 있지만 제품마다 성분 편차가 크고 장기 안전성 자료가 적습니다. 식품으로 먹는 것이 우선입니다."}],pairings:{good:["호두 (엘라지탄닌 원료↑)","플레인 요거트·채소 샐러드 (혈당 완만)"],avoid:["가당 석류 음료·석류청·젤리 (첨가당)"]},cautions:["와파린 복용 중 석류 주스를 마신 뒤 INR이 변했다는 사례 보고가 있고, 동물·시험관에서는 약물 대사효소(CYP2C9) 억제가 관찰됐습니다. 사람에서의 영향은 일정하지 않지만, 항응고제를 먹는다면 갑자기 많이 마시지 말고 의사와 상의하세요.","신장질환으로 칼륨을 제한 중이라면 주스·농축액 섭취량에 주의하세요."],myths:[{claim:"석류에는 여성호르몬(에스트로겐)이 많아 갱년기 증상에 좋다",truth:'1960년대 석류 씨에서 에스트론이 검출됐다는 보고에서 시작된 이야기이지만, 이후 분석에서는 검출되지 않거나 극미량이었고 콩 이소플라본보다도 에스트로겐 작용이 훨씬 약합니다. 갱년기 증상을 개선한다
