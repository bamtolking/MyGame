고 젖을 잘 나오게 한다",truth:"요오드·철·칼슘이 있는 미역이 산후 회복식으로 자리 잡은 전통이지만, 피를 맑게 하거나 모유량을 늘린다는 임상 근거는 부족합니다. 오히려 과잉 섭취하면 요오드가 모유로 많이 넘어가므로 적당히 먹는 것이 좋습니다."},{claim:"해조류의 알긴산이 중금속·방사능·미세먼지를 몸 밖으로 빼낸다",truth:"알긴산이 장 속에서 스트론튬 같은 일부 금속과 결합해 흡수를 줄인다는 연구(주로 동물·소규모 연구)는 있지만, 이미 몸에 쌓인 중금속이나 폐로 들어온 미세먼지를 빼낸다는 근거는 없습니다."},{claim:"후코이단은 암을 치료한다",truth:"세포·동물 실험에서 암세포 증식 억제가 보고됐지만 사람의 암 치료 효과는 입증되지 않았습니다. 후코이단은 헤파린처럼 항응고 작용을 보일 수 있어, 항암 치료·항응고제 복용 중이면 고농축 보충제는 의료진과 상의하세요."}]},{id:"milk",name:"우유",en:"Milk (cow)",aliases:["흰우유","전지우유","저지방우유","무지방우유","멸균우유","락토프리우유","생우유","우유 한잔","milk","whole milk","cow milk"],emoji:"🥛",category:"유제품",summary:'칼슘·양질의 단백질(카제인 약 80%, 유청 약 20%)·비타민 B2·B12를 한 번에 채우는 식품입니다. 다만 한국 성인의 다수는 유당 분해효소가 줄어든 유당불내증이고, 포화지방이 있으며, IGF-1 증가와 여드름·전립선암의 연관이나 "많이 마셔도 골절이 줄지 않는다"는 역설처럼 근거가 엇갈리는 쟁점도 있습니다.',verdict:{tone:"balanced",text:"하루 1~2잔은 칼슘·단백질을 채우기 좋은 방법입니다. 유당불내증이면 락토프리 우유나 요거트로."},basis:"우유 100g (일반 전지우유, 지방 약 3.3%)",serving:{label:"1팩 (200ml, 약 206g)",grams:206},nutrients:{kcal:61,carb:4.8,sugar:4.8,protein:3.2,fat:3.3,satFat:1.87,mufa:.81,pufa:.2,cholesterol:10,sodium:43,potassium:132,calcium:113,magnesium:10,zinc:.37,selenium:3.7,vitA:46,vitB1:.05,vitB2:.17,vitB6:.04,folate:5,vitB12:.45},compounds:[{id:"calcium",amount:"약 113mg/100g (200ml 한 팩에 약 230mg)",role:"흡수율이 약 30% 안팎으로 안정적이어서, 칼슘 섭취가 부족한 편인 한국인에게 가장 효율적인 공급원 중 하나입니다."},{id:"vitamin-b12",amount:"약 0.45μg/100g (한 팩에 기준치의 약 40%)",role:"적혈구 생성과 신경 유지에 필요한 B12를 채식 위주 식단에서 보충하는 주요 경로입니다."},{id:"saturated-fat",amount:"약 1.9g/100g (한 팩 약 3.8g)",role:"유지방의 약 60%가 포화지방입니다. 유제품의 포화지방은 고기와 달리 심혈관 위험과의 연관이 약하게 나오는 경우가 많아(식품 매트릭스 효과) 논쟁 중이며, LDL이 높다면 저지방 우유가 선택지입니다."},{id:"potassium",amount:"약 132mg/100g",role:"칼슘·마그네슘과 함께 혈압 조절을 돕는 조합으로, 혈압을 낮추는 DASH 식단에도 저지방 유제품이 들어갑니다."},{id:"vitamin-d",amount:"강화하지 않은 우유에는 거의 없음 (강화 제품은 표시 확인)",role:"미국·캐나다는 우유에 비타민 D를 의무적으로 강화하지만, 한국 일반 우유는 강화하지 않은 제품이 많습니다. 칼슘 흡수에 필요한 비타민 D는 햇볕·생선·강화 제품으로 채워야 합니다."}],howToEat:[{title:"유당불내증이면 조금씩, 식사와 함께",body:"유당분해효소(락테이스)가 부족하면 소화되지 않은 유당이 대장에서 발효되어 가스·복통·설사가 생깁니다. 한 번에 한 컵(유당 약 12g) 이하를 식사와 함께 마시면 증상이 적은 경우가 많고, 조금씩 꾸준히 마시면 장내 미생물이 적응하기도 합니다."},{title:"락토프리 우유·요거트·숙성 치즈로 대체",body:"락토프리 우유는 유당을 미리 분해해 영양은 거의 같습니다. 요거트는 유산균이 유당 일부를 분해하고, 숙성 치즈는 유당이 거의 남아 있지 않습니다."},{title:"데워 마셔도 영양은 거의 그대로",body:"데워도 칼슘·단백질은 거의 변하지 않습니다. 오래 끓이면 비타민 B1·B12 일부가 줄고, 표면의 막은 유청 단백질과 지방이 굳은 것이라 버릴 필요가 없습니다."},{title:"빛을 피해 보관",body:"비타민 B2(리보플라빈)는 빛에 약하고, 빛을 받으면 유지방이 산화되어 이취가 생깁니다. 불투명 용기에 담아 냉장 보관하세요."},{title:"LDL이 높다면 저지방 우유",body:"저지방·무지방 우유는 칼슘·단백질은 거의 같고 포화지방과 열량이 줄어듭니다. 대신 지용성 비타민 A도 줄어듭니다(강화 제품 제외)."}],pairings:{good:["통곡물 시리얼·오트밀 (단백질·칼슘 보완, 혈당 완화)","연어·달걀 노른자 (칼슘 흡수에 필요한 비타민 D)"],avoid:["철분제·일부 항생제·갑상선호르몬제와 동시 복용 (칼슘이 흡수를 방해)"]},cautions:["테트라사이클린·퀴놀론계 항생제(시프로플록사신 등), 레보티록신(갑상선호르몬제), 비스포스포네이트(골다공증약), 철분제는 우유의 칼슘과 결합해 흡수가 줄어듭니다. 약에 따라 2~4시간 간격을 두세요.","우유 단백질 알레르기(주로 영유아)는 유당불내증과 다른 면역 반응이라 락토프리 우유도 안 됩니다.","돌 전 영아에게 생우유를 주식으로 주지 마세요. 철 결핍과 신장 부담의 원인이 됩니다.","여드름이 심한 사람 중 일부는 우유(특히 탈지우유) 섭취와 악화가 연관된다는 관찰연구가 있어, 몇 주 줄여 보고 변화를 확인해 볼 수 있습니다."],myths:[{claim:"우유를 많이 마실수록 뼈가 튼튼해져 골절이 줄어든다",truth:"칼슘이 뼈의 재료인 것은 맞지만, 대규모 코호트 메타분석에서 우유 섭취량과 고관절 골절 감소의 연관은 뚜렷하지 않았습니다. 스웨덴 코호트(2014, BMJ)에서는 하루 3잔 이상 마신 여성의 골절·사망이 오히려 높게 나왔지만(갈락토스의 산화 스트레스 가설), 관찰연구라 인과는 불분명합니다. 칼슘이 부족한 사람에게 하루 1~2잔을 권하는 근거는 유지됩니다."},{claim:"우유는 IGF-1을 높여 여드름과 암을 일으킨다",truth:'우유 섭취가 혈중 IGF-1을 10% 안팎 높이는 것은 여러 연구에서 확인됩니다. 여드름과의 연관은 관찰연구 수준이고, 전립선암은 세계암연구기금(WCRF)이 "제한적 근거"로 분류합니다. 반대로 유제품은 대장암 위험 감소와 연관된 근거("가능성 높음")가 있어, 암 전체로 보면 한쪽으로 단정하기 어렵습니다.'}]},{id:"yogurt",name:"플레인 요거트",en:"Plain yogurt",aliases:["요거트","요구르트","그릭요거트","그릭 요거트","무가당 요거트","떠먹는 요구르트","마시는 요구르트","발효유","수제요거트","yogurt","yoghurt","greek yogurt","plain yogurt"],emoji:"🥣",category:"유제품",summary:"우유를 유산균(불가리쿠스균·서모필루스균)으로 발효한 식품으로, 단백질·칼슘은 우유와 비슷하면서 유당 일부가 분해되어 유당불내증에도 편합니다. 관찰연구에서 요거트를 자주 먹는 사람은 제2형 당뇨 위험이 낮았습니다. 다만 시판 요구르트의 상당수는 설탕이 들어간 가당 제품이라, 무가당 플레인을 고르는 것이 핵심입니다.",verdict:{tone:"good",text:"무가당 플레인으로 하루 한 그릇이면 좋아요. 단맛은 과일로 더하세요."},basis:"플레인 요거트 100g (전지우유, 무가당)",serving:{label:"한 그릇 (약 150g)",grams:150},nutrients:{kcal:61,carb:4.7,sugar:4.7,protein:3.5,fat:3.3,satFat:2.1,mufa:.89,pufa:.09,cholesterol:13,sodium:46,potassium:155,calcium:121,magnesium:12,zinc:.59,selenium:2.2,vitA:27,vitB2:.14,vitB12:.37},compounds:[{id:"probiotics",amount:"살아 있는 유산균 1g당 대략 1,000만~10억 마리 (국내 발효유 기준 1ml당 1,000만 이상)",role:'요거트 균은 장에 오래 정착하지는 않지만, 지나가면서 자체 효소(β-갈락토시데이스)로 유당을 분해해 소화를 돕습니다. 유럽식품안전청(EFSA)이 인정한 거의 유일한 유산균 건강 표시가 이 "유당 소화 개선"입니다.'},{id:"calcium",amount:"약 121mg/100g",role:"우유와 비슷한 양의 칼슘을 유당 부담은 더 적게 공급합니다."},{id:"vitamin-b12",amount:"약 0.37μg/100g",role:"한 그릇으로 기준치의 약 20%를 채웁니다."},{id:"saturated-fat",amount:"약 2.1g/100g (전지 제품)",role:"전지 요거트에는 포화지방이 있지만, 발효 유제품은 관찰연구에서 심혈관 위험과 중립~약간 낮은 연관을 보여 포화지방 양만으로 판단하기 어렵습니다."},{id:"added-sugar",amount:"무가당 0g, 가당 제품은 총당류가 100g당 약 10~15g",role:'시판 요거트의 설탕·과당·과일 시럽은 "건강식" 이미지 뒤에 숨은 첨가당입니다. 한 컵에 각설탕 몇 개 분량이 들어가기도 해 당류 표시를 확인해야 합니다.'}],howToEat:[{title:'"무가당"과 당류 표시 확인',body:'무가당 플레인 요거트의 당류는 원래 우유의 유당인 100g당 약 4~5g입니다. 이보다 훨씬 많으면 설탕이 들어간 제품입니다. "플레인"이라는 이름만으로는 무가당인지 알 수 없습니다.'},{title:"단맛은 과일·견과로",body:"블루베리·바나나·사과를 더하면 단맛과 함께 섬유·폴리페놀이 들어가, 유산균과 장내 미생물의 먹이(프리바이오틱스)를 함께 먹는 셈이 됩니다."},{title:"그릭요거트는 단백질이 2~3배",body:"유청을 걸러내 단백질이 100g당 약 9~10g으로 늘고 유당은 줄어듭니다. 대신 걸러낸 유청과 함께 칼슘 일부가 빠집니다."},{title:"가열하지 않기",body:"60℃ 이상으로 데우면 유산균 대부분이 죽습니다. 요리에 넣을 때는 불을 끈 뒤에 섞으세요."}],pairings:{good:["블루베리·바나나 등 과일 (단맛과 섬유)","견과·오트밀 (섬유·불포화지방)","김치·된장 등 다른 발효식품과 번갈아 (미생물 다양성)"],avoid:["가당 그래놀라·시럽 토핑 과다"]},cautions:["우유 단백질 알레르기가 있으면 요거트도 먹을 수 없습니다.","마시는 요구르트(액상 발효유)는 대부분 당이 많은 가당 제품입니다.","면역억제 치료 중이거나 중환자라면 고농도 유산균 제품은 의료진과 상의하세요. 일반 요거트는 대개 안전합니다."],myths:[{claim:"요거트 유산균이 장에 자리 잡아 장내 세균을 바꾼다",truth:"대부분의 요거트 균은 며칠 안에 대변으로 빠져나가며 장에 정착하지 않습니다. 그래도 지나가는 동안 유당을 분해하고 면역 신호에 영향을 줄 수 있으며, 발효식품을 여러 종류 늘린 10주 무작위 시험(Stanford, 2021)에서는 장내 미생물 다양성이 늘고 염증 지표가 줄었습니다."},{claim:"요거트를 먹으면 당뇨가 예방된다",truth:'관찰연구 메타분석에서 요거트를 하루 한 번 먹을 때마다 제2형 당뇨 위험이 약 18% 낮았고, 미국 FDA는 2024년 "근거가 제한적"이라는 조건을 달아 제한적 건강 표시를 허용했습니다. 요거트를 먹는 사람의 다른 생활습관 영향일 수 있어 인과는 확실하지 않습니다.'}]},{id:"kimchi",name:"김치",en:"Kimchi",aliases:["배추김치","포기김치","깍두기","총각김치","열무김치","갓김치","백김치","물김치","묵은지","겉절이","신김치","kimchi","kimchee"],emoji:"🌶️",category:"발효식품",summary:'배추·무에 고춧가루·마늘·생강·젓갈을 넣어 젖산 발효한 식품입니다. 익으면서 류코노스톡 → 락토바실러스(플란타룸·사케이) 순으로 유산균이 바뀌고, 발효성 식이섬유·캡사이신·마늘 유황화합물이 더해집니다. 반면 나트륨이 많고, 짠 절임 채소와 위암의 연관이 한국·중국·일본 연구에서 논쟁 중이라 "덜 짜게, 적당량"이 핵심입니다.',verdict:{tone:"balanced",text:"덜 짜게 담근 김치를 끼니마다 한 접시(약 50g) 정도. 김칫국물까지 많이 먹는 습관은 줄이세요."},basis:"배추김치 100g",serving:{label:"한 접시 (약 50g)",grams:50},nutrients:{kcal:15,carb:2.4,sugar:1.1,fiber:1.6,protein:1.1,fat:.5,sodium:498,potassium:151,calcium:33},compounds:[{id:"probiotics",amount:"잘 익었을 때 1g당 약 1억~10억 마리",role:"담근 직후에는 류코노스톡 메센테로이데스가 탄산가스와 부드러운 신맛을 만들고, 익을수록 산에 강한 락토바실러스 플란타룸·사케이가 우세해집니다. 지나치게 시어지면 균 수는 다시 줄고, 찌개로 끓이면 균은 죽습니다."},{id:"sodium",amount:"약 500~900mg/100g (제품·집마다 차이)",role:"김치는 한국인 나트륨 섭취의 상위 공급원입니다. 한 접시(50g)로 하루 기준치의 약 10~20%를 채우며, 국물까지 먹으면 더 늘어납니다."},{id:"prebiotic-fiber",amount:"식이섬유 약 1.6g/100g",role:"배추·무·고춧가루의 섬유가 대장 미생물의 먹이가 되어 짧은사슬지방산을 만듭니다."},{id:"capsaicin",amount:"고춧가루에서 유래",role:"통증·열 수용체(TRPV1)를 자극해 매운맛을 내고 열 생산에 약하게 관여합니다. 위 점막이 약한 사람에게는 자극이 될 수 있습니다."},{id:"allicin",amount:"다진 마늘 양념에서 유래",role:"마늘을 다질 때 생긴 알리신이 발효 중 다른 유황화합물로 바뀌어 김치 특유의 향과 항균 작용에 기여합니다."},{id:"dietary-nitrate",amount:"배추·무에 자연적으로 존재",role:"발효 초기에 일부가 아질산염으로 바뀌지만, 익으면서 유산균이 아질산염을 분해해 다시 줄어듭니다."},{id:"nitrosamine",amount:"매우 적음 (젓갈·오래된 김치에서 미량 검출 보고)",role:"젓갈의 아민류와 아질산염이 위 속 산성 환경에서 만나 N-니트로소화합물이 생길 수 있다는 것이 짠 절임식품과 위암을 잇는 가설 중 하나입니다."}],howToEat:[{title:"싱겁게 담그고 국물은 적게",body:"김치 나트륨의 상당 부분이 국물에 녹아 있습니다. 소금을 줄여 담그고, 김칫국물·물김치 국물을 들이키는 습관을 줄이면 나트륨이 크게 줄어듭니다."},{title:"적당히 익었을 때 생으로",body:"유산균이 가장 많은 것은 새콤하게 잘 익은 시점입니다. 찌개·볶음으로 끓이면 균은 죽지만 섬유·캡사이신은 남습니다."},{title:"채소·과일·콩을 함께",body:"칼륨이 많은 채소·과일·콩은 나트륨 배출을 도와 김치의 혈압 부담을 일부 상쇄합니다."},{title:"묵은지·김치찌개는 짠맛이 농축",body:"오래 익히거나 오래 끓이면 수분이 날아가 짠맛이 진해집니다. 물을 넉넉히 잡고 간은 마지막에 보세요."},{title:"하얀 골마지는 걷어내고 판단",body:"표면의 하얀 막(골마지)은 산막효모로 독소를 만드는 곰팡이와는 다르지만 맛과 식감을 떨어뜨립니다. 걷어내고 씻어 가열 조리에 쓰되, 초록·검은 털곰팡이가 피었거나 물러졌다면 버리세요."}],pairings:{good:["두부·달걀·돼지고기 (단백질 보완: 두부김치·김치찌개)","잡곡밥 (섬유 추가)"],avoid:["라면·젓갈·장아찌와 한 끼에 겹치기 (나트륨 누적)"]},cautions:["고혈압·신장질환·심부전으로 나트륨을 제한 중이면 저염 김치·백김치의 건더기 위주로, 양을 정해 드세요.","위염·위궤양·역류성 식도염이 있으면 매운 김치가 증상을 악화할 수 있습니다.","발효 중 생기는 히스타민·티라민 같은 생체아민에 민감한 사람은 오래 익힌 김치나 젓갈이 많이 든 김치에 두통·두드러기가 생길 수 있습니다."],myths:[{claim:"김치는 짜서 위암의 원인이다",truth:"한국·중국 연구를 중심으로 한 메타분석(2012)에서 절임 채소를 많이 먹을수록 위암 위험이 약 1.5배로 나왔지만, 김치만 따로 본 연구들은 결과가 엇갈립니다. 짠 음식 전반이 위 점막을 손상해 헬리코박터 감염의 해를 키우는 것이 주된 기전으로 보이며, 헬리코박터 감염·흡연이 더 큰 위험 요인입니다. 저염 김치를 적당량 먹는 것까지 피할 근거는 없습니다."},{claim:"김치 유산균은 요거트의 수십 배라 김치만 먹으면 장이 건강해진다",truth:"잘 익은 김치의 유산균 수는 요거트와 비슷한 수준(1g당 1억 마리 안팎)이고, 사람 장에 정착한다는 근거는 제한적입니다. 발효식품을 늘린 무작위 시험에서 미생물 다양성이 늘었지만 김치 단독 효과는 아니며, 김치 섭취와 체지방·혈당을 본 한국 시험들은 규모가 작습니다."},{claim:"김치가 사스·코로나 같은 바이러스 감염을 막는다",truth:"시험관·동물 연구와 나라별 사망률을 비교한 생태학 연구가 있었을 뿐, 사람에서 감염 예방 효과가 확인된 적은 없습니다."}]},{id:"doenjang",name:"된장·청국장",en:"Doenjang & cheonggukjang (fermented soybean pastes)",aliases:["된장","청국장","생청국장","막장","쌈장","재래식된장","된장찌개","청국장찌개","낫토","미소","메주","doenjang","cheonggukjang","natto","miso","fermented soybean paste"],emoji:"🍲",category:"발효식품",summary:"콩을 곰팡이·고초균(바실러스)으로 발효한 장입니다. 발효 중 이소플라본이 흡수가 빠른 비배당체(제니스테인·다이드제인)로 바뀌고, 청국장은 바실러스 발효로 비타민 K2(MK-7)와 혈전 분해 효소(낫토키나아제류)가 생깁니다. 반면 된장은 100g당 나트륨이 수천 mg에 이르고, 관리가 안 된 재래식 메주에서는 곰팡이독소(아플라톡신) 오염 가능성이 있습니다.",verdict:{tone:"balanced",text:"된장은 짜지 않게 양념 정도로, 청국장은 좋은 발효 콩 식품입니다. 와파린 복용자는 청국장·낫토를 주의하세요."},basis:"된장 100g (USDA 미소 값 기준 — 한국 된장은 탄수화물이 더 적고 나트륨은 비슷하거나 더 많음)",serving:{label:"된장찌개 1인분에 넣는 된장 (약 20g)",grams:20},nutrients:{kcal:198,carb:25,sugar:6.2,fiber:5.4,protein:12,fat:6,sodium:3730,potassium:210,calcium:57,magnesium:48,iron:2.5,zinc:2.6,selenium:7,vitK:29},compounds:[{id:"isoflavone",amount:"미소 약 40mg/100g, 낫토 약 80mg/100g (발효로 비배당체 비율 증가)",role:"콩 이소플라본은 원래 당이 붙은 배당체(제니스틴·다이드진)인데, 발효 미생물의 β-글루코시데이스가 당을 떼어 비배당체로 바꿉니다. 비배당체는 장에서 더 빨리 흡수되며, 에스트로겐 수용체 β에 약하게 결합하는 식물성 에스트로겐입니다."},{id:"sodium",amount:"된장 약 3,700~5,000mg/100g (1큰술 약 18g에 약 700~900mg), 무염 생청국장은 훨씬 적음",role:"된장의 가장 큰 부담입니다. 찌개 한 그릇으로 하루 기준치(2,000mg)의 절반 가까이를 먹기 쉽습니다."},{id:"vitamin-k",amount:"청국장·낫토의 K2(MK-7) 100g당 대략 수백~1,000μg (된장은 훨씬 적음)",role:"MK-7은 반감기가 약 3일로 길어 뼈·혈관 단백질(오스테오칼신·MGP)까지 활성화합니다. 일본 관찰연구에서 낫토 섭취와 골절 감소의 연관이 보고됐지만 인과는 불확실하며, 와파린의 작용을 강하게 방해합니다."},{id:"probiotics",amount:"청국장의 고초균(바실러스 서브틸리스), 된장의 바실러스·곰팡이·효모",role:"바실러스는 열에 강한 포자를 만들어 찌개로 끓여도 일부가 살아남습니다. 다만 장 속에서 어떤 건강 효과를 내는지는 사람 근거가 적습니다."},{id:"prebiotic-fiber",amount:"식이섬유 약 5g/100g",role:"콩 껍질·세포벽 섬유가 남아 장내 발효 재료가 됩니다. 청국장처럼 콩알을 통째로 먹을수록 섬유가 많습니다."}],howToEat:[{title:"된장은 적게, 찌개는 싱겁게",body:"된장찌개 1인분에 된장 1큰술만 넣어도 나트륨이 약 700~1,000mg입니다. 멸치·다시마 육수로 감칠맛을 내면 된장을 줄일 수 있고, 건더기 위주로 먹고 국물은 남기세요."},{title:"청국장은 불을 끄기 직전에, 또는 생으로",body:"혈전 분해 효소(낫토키나아제류)는 단백질이라 70℃ 안팎 이상으로 끓이면 활성을 잃습니다. 찌개에는 마지막에 넣고, 생청국장·낫토로 먹으면 효소와 균이 더 많이 남습니다."},{title:"채소·두부·버섯을 넉넉히",body:"같은 국물 양에서 된장 비율이 줄고, 채소의 칼륨이 나트륨 배출을 도와 혈압 부담을 줄입니다."},{title:"재래식 된장은 곰팡이 관리가 된 제품으로",body:"메주를 띄울 때 온도·습도 관리가 나쁘면 아플라톡신을 만드는 곰팡이(아스페르길루스 플라버스)가 자랄 수 있습니다. 된장 표면에 검거나 초록·노란 곰팡이가 넓게 번졌다면 걷어내기보다 버리는 것이 안전합니다."}],pairings:{good:["애호박·버섯·시금치 등 채소 (칼륨·섬유)","두부 (단백질, 된장을 줄여도 풍미 유지)","잡곡밥"],avoid:["젓갈·장아찌와 한 끼에 겹치기 (나트륨 누적)"]},cautions:["와파린 복용자: 청국장·낫토의 비타민 K2는 적은 양으로도 약효를 떨어뜨릴 수 있어, 일본에서는 와파린 복용자에게 낫토를 먹지 않도록 안내합니다. 담당 의사와 상의 없이 먹지 마세요. (아픽사반·리바록사반 같은 신규 경구 항응고제는 비타민 K의 영향을 받지 않습니다.)","고혈압·신장질환·심부전이면 된장·쌈장의 양을 정해 두고 드세요.","레보티록신(갑상선호르몬제)은 콩 식품과 함께 먹으면 흡수가 줄 수 있어 시간 간격을 두세요.","대두 알레르기가 있으면 피해야 합니다."],myths:[{claim:"청국장·낫토를 먹으면 혈전이 녹아 뇌졸중을 예방한다",truth:"낫토키나아제는 시험관·동물에서 피브린을 분해하고 소규모 사람 시험에서 일부 응고 지표 변화가 보고됐지만, 장에서 효소가 얼마나 흡수되는지 불확실하고 끓이면 활성이 사라집니다. 3년간 보충제를 쓴 무작위 시험(2021)에서도 동맥경화 진행을 늦추지 못했고, 뇌졸중 예방 효과는 입증되지 않았습니다."},{claim:"된장은 발효식품이라 짜도 괜찮다",truth:"발효 여부와 관계없이 나트륨은 혈압에 그대로 작용합니다. 콩 발효 성분이 소금의 혈압 상승을 일부 완화한다는 동물 연구가 있지만, 사람에서 나트륨 부담을 상쇄한다는 근거는 없습니다."},{claim:"콩 이소플라본은 여성호르몬처럼 작용해 유방암을 일으킨다",truth:"콩 식품을 많이 먹는 아시아 여성 코호트에서 콩 섭취는 유방암 위험 증가와 연관되지 않았고 오히려 약간 낮았습니다. 이소플라본은 인체 에스트로겐보다 작용이 훨씬 약하며, 우려는 주로 고용량 보충제와 동물 실험에서 나왔습니다."}]},{id:"turmeric",name:"강황",en:"Turmeric",aliases:["강황가루","강황차","울금","터메릭","카레","카레가루","커리","커큐민","turmeric","curry","curcuma"],emoji:"🍛",category:"향신료·차·음료",summary:"카레의 노란색을 내는 생강과 뿌리줄기로, 핵심 성분 커큐민은 강황가루 무게의 약 3% 안팎입니다. 시험관에서는 NF-κB 억제 같은 강한 항염 작용을 보이지만, 먹으면 흡수가 매우 낮고 빠르게 대사되어 사람 효과는 관절 통증 완화 등 일부에서만 작게 확인됩니다. 음식 향신료로는 안전하지만, 흡수를 높인 강황·커큐민 보충제는 간 손상 사례가 보고되어 신중해야 합니다.",verdict:{tone:"good",text:"카레·볶음에 향신료로 자주 쓰기 좋아요. 후추·기름과 함께. 고용량 보충제는 신중하게."},basis:"강황가루 100g",serving:{label:"1작은술 (약 3g)",grams:3},nutrients:{kcal:312,carb:67,sugar:3.2,fiber:22.7,protein:9.7,fat:3.3,satFat:1.8,mufa:.45,pufa:.76,sodium:27,potassium:2080,calcium:168,magnesium:208,zinc:4.5,vitC:.7,vitK:13.4,vitB6:.11},compounds:[{id:"curcumin",amount:"강황가루의 약 3% (1작은술에 약 90mg), 카레가루는 그 10분의 1 수준",role:"세포 실험에서는 대식세포의 NF-κB 염증 신호와 COX-2를 억제하고 Nrf2 항산화 스위치를 켭니다. 하지만 먹으면 장과 간에서 글루쿠론산·황산 포합으로 빠르게 비활성화되어 혈중 원형 커큐민은 극히 적습니다."},{id:"oxalate",amount:"향신료 중 많은 편 (수용성 비율이 높음)",role:"향신료로 쓰는 양에서는 문제가 적지만, 강황 보충제를 매일 여러 g 먹으면 소변 옥살산이 늘어 수산칼슘 결석 위험이 커질 수 있습니다(소규모 사람 시험)."},{id:"nonheme-iron",amount:"분석값은 100g당 수십 mg (1작은술에 약 1~2mg)",role:"향신료치고 철이 많게 측정되지만 흙·가공 환경의 영향도 섞인 값이고, 비헴철이라 흡수율이 낮습니다. 커큐민은 철과 결합하는 성질이 있어 고용량 보충제는 오히려 철 흡수를 줄일 수 있다는 동물 연구도 있습니다."}],howToEat:[{title:"후추와 함께",body:"후추의 피페린은 장·간에서 커큐민을 비활성화하는 포합 효소(UGT)를 억제합니다. 사람 시험에서 커큐민 2g에 피페린 20mg을 더하자 혈중 농도가 약 20배 높아졌습니다. 카레·강황라테에 후추를 조금 넣으세요."},{title:"기름·지방과 함께 조리",body:"커큐민은 물에 거의 녹지 않고 기름에 녹습니다. 기름에 잠깐 볶거나 우유·코코넛밀크와 함께 먹으면 장에서 미셀에 녹아 흡수가 늘어납니다."},{title:"오래 끓이거나 빛에 두지 않기",body:"커큐민은 중성~알칼리 조건과 빛에서 분해가 빨라집니다. 일반적인 카레 조리는 괜찮지만 오래 끓일수록 일부 줄어들고, 강황가루는 밀봉해 어두운 곳에 보관하세요."},{title:"시판 카레는 강황 비율이 낮다",body:"카레 가루·고형 카레는 여러 향신료와 전분이 섞여 커큐민이 적습니다. 커큐민을 늘리고 싶다면 강황가루를 따로 조금 더 넣으세요."}],pairings:{good:["후추 (피페린: 흡수 증가)","올리브유·코코넛밀크·우유 (지방에 녹아 흡수 증가)","생강·마늘 (카레 향신료 조합)"],avoid:["항응고제·항혈소판제 복용 중 고용량 보충제"]},cautions:["강황·커큐민 보충제(특히 피페린·나노 제형 등으로 흡수를 높인 제품)에서 간 손상 사례가 늘고 있으며, 미국 약물 간손상 네트워크 보고에서는 특정 면역 유전형(HLA-B*35:01)을 가진 사람에게 많았습니다. 피로·황달·짙은 소변이 생기면 중단하고 진료를 받으세요.","와파린·항혈소판제를 먹거나 수술을 앞두고 있다면 고용량 보충제를 피하세요. 출혈 경향 증가 보고가 있습니다.","담석·담도 폐쇄가 있으면 강황이 담낭 수축을 자극해 통증을 일으킬 수 있습니다.","방글라데시 등에서 색을 진하게 하려고 크롬산납을 섞은 강황이 확인된 바 있습니다. 출처가 불분명한 값싼 강황가루는 피하세요."],myths:[{claim:"커큐민은 천연 항염제로 소염진통제만큼 효과가 있다",truth:"무릎 골관절염 소규모 무작위 시험들을 모은 분석에서 통증이 소염진통제와 비슷하게 줄었다는 결과가 있지만, 연구 규모가 작고 질이 낮아 확정적이지 않습니다. 또 커큐민은 여러 시험관 검사에서 가짜 양성 반응을 잘 내는 물질(PAINS)로 지적되어, 시험관 결과만으로 효능을 기대하기 어렵습니다."},{claim:"카레를 많이 먹는 인도에 치매가 적은 것은 강황 덕분이다",truth:"인도 고령자의 알츠하이머 유병률이 낮다는 초기 역학 관찰에서 나온 가설로, 평균 수명·진단율 차이 같은 교란 요인이 큽니다. 커큐민 보충제의 사람 인지 기능 시험은 결과가 엇갈리고 대부분 뚜렷한 효과가 없었습니다."}]},{id:"ginger",name:"생강",en:"Ginger",aliases:["생강차","생강청","말린생강","생강가루","편강","초생강","진저","ginger","ginger tea","ginger root"],emoji:"🫚",category:"향신료·차·음료",summary:"매운맛 성분 진저롤이 말리거나 가열하면 쇼가올·진저론으로 바뀌는 향신료입니다. 임신 입덧·항암 치료 오심에 대한 무작위 대조시험이 여럿 있어 향신료 중 사람 근거가 비교적 좋은 편이고, 위 배출을 빠르게 해 소화를 돕습니다. 고용량은 속쓰림을 일으킬 수 있고, 항응고제와의 상호작용이 이론적으로 거론됩니다.",verdict:{tone:"good",text:"양념·생강차로 자주 먹기 좋아요. 입덧에는 하루 1g(말린 생강 기준) 안팎이 연구된 양입니다."},basis:"생 생강 100g",serving:{label:"생강 한 톨·다진 생강 1큰술 (약 5g)",grams:5},nutrients:{kcal:80,carb:17.8,sugar:1.7,fiber:2,protein:1.8,fat:.75,satFat:.2,mufa:.15,pufa:.15,sodium:13,potassium:415,calcium:16,magnesium:43,iron:.6,zinc:.34,vitC:5,vitB6:.16,folate:11},compounds:[{id:"gingerol",amount:"생강 매운맛의 주성분 (품종·신선도에 따라 편차)",role:"생강의 매운맛은 열 수용체(TRPV1)를 자극하는 진저롤이 내고, 말리거나 가열하면 물 분자가 빠져 더 매운 쇼가올로 바뀝니다. 장의 세로토닌(5-HT3) 신호를 누그러뜨리고 위 배출을 빠르게 해 메스꺼움을 줄이는 것으로 보입니다."},{id:"added-sugar",amount:"시판 생강청은 설탕이 절반 가까이",role:"생강차를 생강청으로 타면 한 잔에 설탕이 10~20g 더해질 수 있어, 생강의 이점보다 당 부담이 커지기 쉽습니다."},{id:"potassium",amount:"약 415mg/100g",role:"무게당 칼륨은 많지만 한 번에 먹는 양이 몇 g이라 실제 기여는 작습니다."}],howToEat:[{title:"생강과 말린 생강의 차이",body:"생강의 진저롤은 위 배출·메스꺼움 완화에, 말린 생강의 쇼가올은 더 맵고 시험관에서 항염 작용이 더 강합니다. 요리 목적에 따라 생강과 생강가루를 골라 쓰면 됩니다."},{title:"입덧·메스꺼움에는 조금씩 나눠서",body:"연구에 쓰인 양은 대개 말린 생강 1g(생강 약 4~5g)을 하루 몇 번에 나눈 것입니다. 얇게 저민 생강차나 생강 캔디로 조금씩 드세요."},{title:"생강차는 저며서 끓이기",body:"끓이면 진저롤 일부가 진저론으로 바뀌어 매운맛이 부드러워지고 단 향이 납니다. 설탕을 넣은 생강청 대신 무가당으로, 필요하면 꿀을 조금만."},{title:"생강즙으로 고기 밑간",body:"생 생강에는 단백질 분해효소(진지베인)가 있어 고기를 연하게 하고 비린내·잡내를 줄입니다. 효소는 가열하면 사라지므로 조리 전에 재워 두세요."}],pairings:{good:["마늘·파 (한식 양념 조합)","레몬·꿀 약간 (생강차)","생선·돼지고기 (비린내·잡내 제거)"],avoid:["설탕이 많은 시판 생강청 과다"]},cautions:["하루 몇 g 이상(말린 생강 기준)의 고용량은 속쓰림·설사·복부 불편을 일으킬 수 있습니다. 역류성 식도염이 있다면 소량부터 시작하세요.","시험관에서 혈소판 응집을 억제해, 와파린·항혈소판제 복용자가 고용량 보충제를 먹는 것은 주의가 필요합니다. 음식 양념 수준은 대개 문제없습니다.","임신 중 입덧 연구 용량(하루 1g 안팎)에서는 안전성 문제가 보이지 않았지만, 고용량 보충제는 의사와 상의하세요.","담석이 있다면 고용량 섭취 전에 상의하세요(담즙 분비 자극)."],myths:[{claim:"생강은 몸을 따뜻하게 해 대사를 크게 올리고 살을 빼 준다",truth:'매운 성분이 열 수용체를 자극해 따뜻한 느낌과 약간의 열 생산을 일으키지만, 소규모 시험에서 늘어난 식후 열 생산은 40kcal 남짓이었습니다. 체중 감량이나 "냉한 체질" 개선으로 볼 근거는 약합니다.'},{claim:"생강은 멀미약만큼 효과가 있다",truth:"임신 입덧에는 여러 무작위 시험에서 위약보다 효과가 있었지만, 멀미에 대한 시험은 결과가 엇갈려 멀미약을 대신할 만큼 확실하지 않습니다."}]},{id:"green-tea",name:"녹차",en:"Green tea",aliases:["말차","가루녹차","녹찻잎","현미녹차","세작","우전","녹차티백","녹차추출물","green tea","matcha","sencha"],emoji:"🍵",category:"향신료·차·음료",summary:"카테킨, 특히 EGCG가 가장 많은 차입니다. 한 잔(200ml)에 카페인 약 20~40mg과 진정 작용이 있는 아미노산 L-테아닌이 함께 있어 커피보다 각성이 부드럽습니다. 일본 대규모 코호트에서 녹차를 많이 마시는 사람의 심혈관 사망이 낮았고, 무작위 시험에서 LDL이 조금 낮아졌습니다. 다만 식사 직후 진한 차는 철 흡수를, 매우 뜨거운 차는 식도를, 고농축 추출물 보충제는 간을 주의해야 합니다.",verdict:{tone:"good",text:"하루 2~4잔, 70~80℃ 물에 우려 조금 식혀 마시기 좋아요. 식사 직후보다는 식간에."},basis:"우린 녹차 100g",serving:{label:"1잔 (약 200ml)",grams:200},nutrients:{kcal:1,protein:.2},compounds:[{id:"egcg",amount:"우린 녹차 100ml당 대략 수십 mg (잎 양·물 온도·우리는 시간에 따라 몇 배 차이), 말차는 더 많음",role:"카테킨 중 가장 많고 활성이 큰 성분입니다. 흡수율이 낮아 대부분 대장으로 가서 미생물이 작은 페놀 대사물로 바꿉니다. 장에서 콜레스테롤 흡수를 방해하고 혈관 내피의 산화질소 생성을 돕는 것으로 보입니다."},{id:"caffeine",amount:"100ml당 약 12mg (한 잔 약 20~40mg), 말차는 더 많음",role:"아데노신 수용체를 막아 각성을 높입니다. 커피의 3분의 1~4분의 1 수준이고, 함께 든 L-테아닌이 긴장을 누그러뜨리는 쪽으로 작용하는 것으로 보입니다(근거 제한적)."},{id:"quercetin",amount:"녹차는 플라보놀(퀘르세틴·캠페롤·미리세틴)의 주요 공급원 중 하나",role:"카테킨과 함께 항산화·항염 신호에 관여합니다. 양은 카테킨보다 훨씬 적습니다."},{id:"vitamin-k",amount:"우린 차에는 거의 없음, 잎을 통째로 먹는 말차·가루녹차에는 많음",role:"가루녹차를 매일 많이 먹으면 비타민 K 섭취가 늘어 와파린 효과에 영향을 줄 수 있습니다."}],howToEat:[{title:"70~80℃ 물에 2~3분",body:"끓는 물로 오래 우리면 카테킨·카페인이 더 많이 나오지만 쓰고 떫어집니다. 낮은 온도에서는 감칠맛을 내는 L-테아닌이 상대적으로 많이 우러나 맛이 부드럽습니다."},{title:"조금 식혀서 (65℃ 미만)",body:'국제암연구소(IARC)는 65℃가 넘는 매우 뜨거운 음료를 "인체 발암 추정 물질(2A군)"로 분류했습니다. 차의 성분이 아니라 뜨거운 온도가 식도 점막을 반복해서 손상하기 때문입니다. 몇 분 식혀 드세요.'},{title:"식사 직후보다는 식간에",body:"카테킨은 식사 속 비헴철과 결합해 흡수를 방해합니다. 빈혈이 있거나 철이 부족하기 쉬운 사람(가임기 여성·채식인)은 식사 전후 1시간을 피하세요."},{title:"레몬을 조금 곁들이기",body:"감귤류의 비타민 C가 소화 과정에서 카테킨이 분해되는 것을 줄인다는 시험관 연구가 있습니다."},{title:"말차는 잎을 통째로 먹는 것",body:"가루를 통째로 마시는 말차는 카테킨·카페인·비타민 K를 우린 차보다 몇 배 많이 섭취하게 됩니다."}],pairings:{good:["레몬 (카테킨 안정성 증가, 시험관)","식간 간식과 함께 (철 흡수 간섭 최소화)"],avoid:["철분제·철 강화식품과 동시 섭취","공복에 진한 차 여러 잔 (속쓰림)"]},cautions:["녹차 추출물 보충제(다이어트 제품 포함)에서 간 손상 사례가 보고되어, 유럽식품안전청(EFSA)은 2018년 보충제로 EGCG를 하루 800mg 이상 먹으면 간 수치가 오른다고 평가했습니다. 공복 섭취에서 더 위험하며, 우려 마시는 녹차는 해당하지 않습니다.","임신 중이거나 카페인에 민감하면 녹차의 카페인도 하루 총량(임산부 300mg 이하)에 포함해 계산하세요.","고농도 녹차는 일부 약(베타차단제 나돌롤, 항암제 보르테조밉 등)의 효과를 떨어뜨린 보고가 있어, 복용 중이면 약사와 상의하세요."],myths:[{claim:"녹차를 마시면 살이 빠진다",truth:"카테킨과 카페인이 에너지 소비와 지방 산화를 약간 늘린다는 시험이 있지만, 코크란 리뷰(2012)에서 체중 감소는 대개 1kg 미만으로 임상적으로 의미 있는 수준이 아니었습니다."},{claim:"녹차는 암을 예방한다",truth:"시험관·동물에서 EGCG가 암세포 증식을 억제했지만, 사람 코호트 결과는 암 종류별로 엇갈리고 무작위 시험에서 암 예방 효과는 확인되지 않았습니다. 뜨겁게 마시는 습관은 오히려 식도암 위험을 높일 수 있습니다."}]},{id:"coffee",name:"커피",en:"Coffee",aliases:["아메리카노","에스프레소","드립커피","핸드드립","콜드브루","믹스커피","인스턴트커피","카페라테","라떼","디카페인","프렌치프레스","원두커피","coffee","americano","espresso","latte"],emoji:"☕",category:"향신료·차·음료",summary:"클로로겐산 같은 폴리페놀과 카페인의 주요 공급원입니다. 대규모 관찰연구에서 하루 2~4잔 마시는 사람의 제2형 당뇨·사망 위험이 낮았고, 디카페인에서도 비슷해 카페인 외 성분의 역할이 거론됩니다. 반면 종이 필터를 거치지 않은 커피(프렌치프레스·터키식·끓인 커피)의 카페스톨·카웨올은 LDL을 올리고, 믹스커피는 설탕·크리머가 더해지며, 늦은 시간의 카페인은 수면을 해칩니다.",verdict:{tone:"balanced",text:"종이 필터로 내린 블랙커피 하루 2~4잔 정도가 무난합니다. 오후 늦게는 피하고, 임산부는 하루 카페인 300mg 이하."},basis:"내린 커피 100g (드립 커피, 블랙)",serving:{label:"1잔 (약 240ml)",grams:240},nutrients:{kcal:1,protein:.1,potassium:49,magnesium:3,vitB2:.08},compounds:[{id:"caffeine",amount:"내린 커피 100ml당 약 40mg (한 잔 약 80~150mg, 에스프레소 1샷 약 60~80mg)",role:"뇌의 아데노신 A1·A2A 수용체를 막아 졸음 신호를 차단합니다. 간의 CYP1A2 효소가 분해하며, 반감기는 평균 약 5시간이지만 사람에 따라 2~10시간으로 차이가 큽니다."},{id:"chlorogenic-acid",amount:"한 잔에 약 70~350mg (약하게 볶을수록 많음)",role:"장에서 포도당 흡수를 늦추고 간의 포도당 생성을 억제하는 것으로 보여, 커피와 당뇨 위험 감소를 잇는 후보 성분입니다. 강하게 볶을수록 분해되어 줄어듭니다."},{id:"acrylamide",amount:"원두 로스팅 중 생성, 한 잔에 수 μg 이하",role:"원두를 볶을 때 아스파라긴과 당이 반응해 생기며, 로스팅 초기에 많다가 강하게 볶으면 오히려 줄어듭니다. 커피를 많이 마시는 사람의 주요 노출원이지만, 커피 섭취와 암 증가의 연관은 확인되지 않았습니다."},{id:"added-sugar",amount:"믹스커피 1봉(약 12g)에 당류 약 6g 안팎 (제품마다 다름)",role:"블랙커피의 대사 이점을 설탕이 일부 상쇄합니다. 하루 서너 봉이면 당류만 20g 안팎이 됩니다."},{id:"saturated-fat",amount:"믹스커피 크리머 1봉에 약 1~2g",role:'크리머는 대개 야자유·팜핵유를 경화한 포화지방 위주의 식물성 유지로 만들어, "식물성"이지만 포화지방입니다. 카페라테는 우유의 포화지방이 더해집니다.'}],howToEat:[{title:"종이 필터로 내리기",body:"원두 기름 속 카페스톨·카웨올은 간의 담즙산·콜레스테롤 조절 신호에 작용해 LDL 수용체를 줄이고 LDL 콜레스테롤을 높입니다. 종이 필터가 이 기름 성분을 거의 걸러내므로 LDL이 높다면 핸드드립·드립 머신이 유리합니다. 프렌치프레스·터키식·끓인 커피에 많고, 에스프레소는 한 잔 양이 적어 그 중간입니다."},{title:"잠들기 6시간 전부터는 피하기",body:"반감기가 약 5시간이라 오후에 마신 카페인의 절반이 밤까지 남습니다. 취침 6시간 전에 먹은 카페인도 총수면 시간을 1시간 가까이 줄였다는 시험이 있습니다."},{title:"블랙으로, 믹스커피는 줄이기",body:"설탕·크리머·시럽이 더해지면 열량·당·포화지방이 커지고, 관찰연구에서 보인 이점과는 다른 음료가 됩니다."},{title:"식사 직후는 피하기",body:"커피의 폴리페놀도 식사 속 비헴철 흡수를 줄입니다. 빈혈이 있다면 식사 1시간 뒤에 드세요."},{title:"카페인이 부담되면 디카페인",body:"디카페인에도 클로로겐산은 대부분 남아 있고, 관찰연구에서 당뇨 위험 감소 연관이 비슷하게 나타났습니다."}],pairings:{good:["무가당 우유·두유 약간 (쓴맛 완화)","견과 한 줌 (빈속 속쓰림 완화)"],avoid:["설탕 시럽·휘핑크림 음료","에너지음료와 겹치기 (카페인 과다)","식사 직후 (철 흡수 감소)"]},cautions:["식약처 카페인 권고: 성인 하루 400mg 이하, 임산부 300mg 이하, 어린이·청소년 체중 kg당 2.5mg 이하. 커피 전문점 큰 컵은 한 잔에 200mg을 넘기도 합니다.","불안장애·불면증·부정맥·위식도역류가 있으면 증상을 악화시킬 수 있습니다.","플루복사민(항우울제)·시프로플록사신(항생제)은 CYP1A2를 억제해 카페인이 몸에 오래 남게 하고, 흡연은 반대로 분해를 빠르게 합니다. 레보티록신(갑상선호르몬제)은 커피와 30~60분 간격을 두세요."],myths:[{claim:"커피는 발암물질(아크릴아마이드) 때문에 암을 일으킨다",truth:'IARC는 2016년 커피를 "발암성으로 분류할 수 없음(3군)"으로 재분류했고, 간암·자궁내막암은 오히려 위험이 낮은 쪽으로 나타났습니다. 아크릴아마이드가 들어 있지만 커피 섭취와 암 증가의 연관은 확인되지 않았습니다. 다만 65℃가 넘게 매우 뜨겁게 마시는 습관은 별개로 주의가 필요합니다.'},{claim:"커피는 이뇨 작용 때문에 마신 것보다 많은 수분을 빼앗는다",truth:"카페인에 익숙하지 않은 사람이 고용량을 마시면 약한 이뇨 작용이 있지만, 평소 커피를 마시는 사람에서 적당량의 커피는 물과 비슷하게 수분 섭취로 계산됩니다."},{claim:"커피를 하루 몇 잔 마시면 오래 산다",truth:"여러 대규모 코호트에서 하루 2~4잔 마시는 사람의 사망 위험이 약 15% 낮았지만 관찰연구입니다. 건강이 나쁜 사람이 커피를 끊는 역인과 가능성도 있어, 안 마시던 사람이 건강을 위해 시작할 근거까지는 아닙니다."}]},{id:"dark-chocolate",name:"다크초콜릿",en:"Dark chocolate",aliases:["다크 초콜릿","초콜릿","초콜렛","카카오","카카오닙스","고카카오","코코아","코코아가루","핫초코","dark chocolate","cocoa","cacao"],emoji:"🍫",category:"가공식품·기호식품",summary:"카카오 고형분 70% 이상 다크초콜릿은 코코아 플라바놀(에피카테킨)·마그네슘·철이 많습니다. 플라바놀은 혈관 내피의 산화질소를 늘려 혈관 기능과 혈압을 약간 개선한다는 무작위 시험이 있습니다. 하지만 100g에 약 600kcal, 포화지방 24g, 당 24g인 고열량 식품이고, 알칼리 처리(더치 공정)로 플라바놀이 크게 줄며, 일부 제품에서는 카드뮴·납 검출이 보고됐습니다.",verdict:{tone:"balanced",text:"카카오 70% 이상으로 하루 2~3조각(20~30g) 정도. 건강을 위해 많이 먹을 식품은 아닙니다."},basis:"다크초콜릿 100g (카카오 70~85%)",serving:{label:"2~3조각 (약 20g)",grams:20},nutrients:{kcal:598,carb:45.9,sugar:24,fiber:10.9,protein:7.8,fat:42.6,satFat:24.5,mufa:12.8,pufa:1.26,transFat:.03,cholesterol:3,sodium:20,potassium:715,calcium:73,magnesium:228,iron:11.9,zinc:3.3,selenium:6.8,vitE:.59,vitK:7.3},compounds:[{id:"cocoa-flavanol",amount:"제품에 따라 100g당 수백 mg, 알칼리 처리·고온 로스팅 시 크게 감소",role:"에피카테킨이 혈관 내피의 산화질소합성효소(eNOS)를 활성화해 혈관 확장을 돕습니다. 코코아 플라바놀 500mg 보충제를 쓴 대규모 무작위 시험(COSMOS, 2022)에서 전체 심혈관 사건은 유의하게 줄지 않았고, 심혈관 사망은 줄어든 경향이 있었습니다(2차 지표)."},{id:"magnesium",amount:"약 228mg/100g (20g에 약 46mg)",role:"두세 조각으로 하루 기준치의 약 15%를 채웁니다."},{id:"nonheme-iron",amount:"약 12mg/100g (20g에 약 2.4mg)",role:"양은 많지만 폴리페놀과 함께 있어 흡수율은 낮은 편입니다."},{id:"saturated-fat",amount:"약 24g/100g",role:"코코아버터는 스테아르산(약 3분의 1)·팔미트산·올레산으로 이루어져 있습니다. 스테아르산은 몸에서 일부 올레산으로 바뀌어 LDL을 거의 올리지 않지만, 팔미트산은 올리고 열량 밀도가 높다는 점은 그대로입니다."},{id:"added-sugar",amount:"약 24g/100g (카카오 비율이 높을수록 적음)",role:"카카오 70%라도 나머지 상당 부분이 설탕입니다. 85~90% 제품은 당이 훨씬 적습니다."},{id:"caffeine",amount:"카페인 약 80mg/100g, 테오브로민 약 800mg/100g",role:"테오브로민은 카페인과 비슷한 메틸잔틴으로 각성 효과는 약하지만 오래 갑니다. 저녁에 많이 먹으면 수면에 영향을 줄 수 있고, 개·고양이에게는 테오브로민이 독이 됩니다."}],howToEat:[{title:"카카오 70% 이상, 알칼리 처리 표시 확인",body:'알칼리 처리(더치 공정, "알칼리화 코코아")는 쓴맛을 줄이고 색을 진하게 하지만 플라바놀을 절반 이상, 강하게 처리하면 90% 가까이 없앱니다.'},{title:"하루 20~30g, 과자 대신",body:"한 판(100g)이면 약 600kcal입니다. 간식 과자를 두세 조각으로 바꾸는 개념으로 드세요."},{title:"무가당 천연 코코아가루도 좋은 대안",body:"알칼리 처리하지 않은 무가당 코코아가루는 초콜릿보다 당·지방이 훨씬 적으면서 플라바놀을 얻을 수 있습니다. 우유·요거트에 타 드세요."},{title:"플라바놀 표시 제품의 기준",body:"유럽식품안전청(EFSA)은 코코아 플라바놀 하루 200mg이 혈관 탄력 유지에 도움이 된다는 표시를 인정했지만, 이는 플라바놀을 보존하도록 가공한 제품(고플라바놀 초콜릿 약 10g)을 기준으로 한 것입니다. 일반 제품은 함량이 제각각입니다."},{title:"여러 브랜드를 번갈아",body:"제품마다 카드뮴·납 함량이 달라, 한 제품만 매일 많이 먹기보다 번갈아 먹으면 노출을 분산할 수 있습니다."}],pairings:{good:["견과·베리 (섬유·폴리페놀 조합)","무가당 요거트"],avoid:["밀크초콜릿·초콜릿 가공 과자로 대체 (카카오 적고 당 많음)","밤늦게 많이 (테오브로민·카페인)"]},cautions:["2022년 미국 소비자단체(Consumer Reports) 검사에서 다크초콜릿 다수가 캘리포니아 기준을 넘는 카드뮴·납을 함유했습니다. 카드뮴은 토양에서, 납은 건조·가공 중 먼지에서 주로 옵니다. 임산부·어린이는 매일 많이 먹지 않는 것이 좋습니다.","편두통·위식도역류가 있는 일부 사람에서는 증상을 유발할 수 있습니다.","수산칼슘 결석 병력이 있다면 코코아·초콜릿의 옥살산을 고려해 양을 조절하세요."],myths:[{claim:"다크초콜릿은 건강식품이라 많이 먹을수록 좋다",truth:"혈압을 낮추는 효과는 무작위 시험 메타분석에서 평균 약 2mmHg로 작고, 대규모 보충제 시험에서도 심혈관 사건 감소가 뚜렷하지 않았습니다. 많이 먹으면 열량·당·포화지방 부담이 이점을 넘어서므로, 과자 대신 소량이 현실적입니다."},{claim:"초콜릿 속 행복 물질(페닐에틸아민·아난다마이드)이 우울을 낫게 한다",truth:"초콜릿에 들어 있는 양은 매우 적고 대부분 빠르게 대사되어 뇌에 의미 있게 도달하지 않습니다. 기분이 좋아지는 것은 주로 맛과 보상 반응 때문으로 보입니다."}]},{id:"sugary-drink",name:"설탕·가당 음료",en:"Sugar-sweetened beverages",aliases:["콜라","사이다","탄산음료","가당음료","청량음료","에너지드링크","에너지음료","이온음료","스포츠음료","과채음료","아이스티","버블티","밀크티","액상과당","고과당옥수수시럽","설탕","시럽","soda","soft drink","cola","sugary drinks","HFCS"],emoji:"🥤",category:"가공식품·기호식품",summary:"콜라·사이다·과채음료·아이스티·가당 커피처럼 설탕이나 액상과당을 넣은 음료입니다. 콜라 한 캔(355ml)에 당이 약 39g으로, 하루 첨가당 권고(총열량의 10%, 약 50g)의 대부분을 한 번에 채웁니다. 액체 당은 포만감을 거의 주지 않고, 과당은 간에서 곧바로 지방과 요산으로 이어져 제2형 당뇨·통풍·지방간과 일관되게 연관됩니다.",verdict:{tone:"limit",text:"줄이는 것이 좋은 대표 식품입니다. 갈증에는 물·탄산수·무가당 차로 바꾸세요."},basis:"콜라 100g (일반 콜라, 당 약 10.5%)",serving:{label:"1캔 (355ml, 약 370g)",grams:370},nutrients:{kcal:42,carb:10.5,sugar:10.5},compounds:[{id:"added-sugar",amount:"100g당 약 10~11g (355ml 한 캔 약 39g, 각설탕 약 13개)",role:"설탕(포도당+과당)이나 액상과당(과당 약 55%)이 빠르게 흡수됩니다. 과당은 간의 과당인산화효소(KHK)가 속도 조절 단계 없이 처리해 지방 합성과 요산 생성으로 이어지고, 포도당은 혈당·인슐린을 급하게 올립니다."},{id:"caffeine",amount:"콜라 100ml당 약 10mg, 에너지음료는 한 캔에 약 60~100mg",role:"카페인의 가벼운 의존성이 단 음료를 반복해서 찾게 하는 요인이 될 수 있고, 청소년은 체중당 한도(kg당 2.5mg)를 넘기기 쉽습니다."},{id:"vitamin-c",amount:"비타민 C 강화 과채음료에 첨가",role:'"비타민 C 함유" 표시가 건강 음료 인상을 주지만 당 부담을 상쇄하지 못합니다. 보존료 안식향산나트륨과 비타민 C가 함께 든 음료에서는 열·빛에 노출되면 벤젠이 미량 생길 수 있어, 업계가 배합을 바꿔 왔습니다(대부분 기준 이하).'}],howToEat:[{title:"물·탄산수·무가당 차로 바꾸기",body:"가당 음료를 물로 바꾼 무작위 시험들에서 체중·허리둘레가 조금씩 줄었습니다. 청량감이 필요하면 무가당 탄산수에 레몬·라임을 넣으세요."},{title:'영양성분표의 "당류"를 총량으로 확인',body:"작은 병도 2회 제공량으로 나눠 표시된 경우가 있습니다. 당류 g을 3으로 나누면 대략 각설탕(약 3g) 개수입니다."},{title:"마신다면 작은 용량을 식사와 함께",body:"공복에 큰 컵으로 마시면 혈당이 가장 빨리 오릅니다. 작은 캔으로, 식사와 함께 마시는 편이 부담이 적습니다."},{title:"마신 뒤 물로 헹구고 양치는 30분 뒤",body:"콜라(pH 약 2.5)·이온음료의 산은 치아 법랑질을 약하게 하고, 입속 세균은 당을 젖산으로 바꿔 충치를 만듭니다. 산에 약해진 직후 양치하면 법랑질이 더 닳을 수 있습니다."},{title:"제로 음료는 줄이는 징검다리로",body:"감미료 음료는 당·열량이 없지만 장기 체중 관리 효과는 분명하지 않아, WHO는 2023년 체중 조절 목적의 비당류 감미료 사용을 권하지 않는다고 발표했습니다. 가당 음료를 끊는 과정의 대체재로 쓰고 결국 물로 가는 것이 좋습니다."}],pairings:{good:["물·탄산수 + 레몬","무가당 보리차·녹차"],avoid:["피자·치킨·패스트푸드와 세트 (당·나트륨·열량 누적)"]},cautions:["통풍·고요산혈증이 있으면 특히 피하세요. 미국 남성 코호트에서 가당 탄산음료를 하루 2잔 이상 마신 사람의 통풍 위험이 약 2배였습니다.","당뇨가 있으면 피해야 하지만, 저혈당이 왔을 때는 빠르게 흡수되는 당음료가 응급 처치가 됩니다.","신장질환으로 인 섭취를 제한 중이면 인산이 첨가된 콜라류를 피하세요.","어린이·청소년은 충치·비만 위험과 함께 카페인 음료 섭취량도 확인하세요."],myths:[{claim:"액상과당은 설탕보다 훨씬 해롭다",truth:"설탕은 포도당:과당이 50:50, 음료용 액상과당은 약 45:55로 조성이 비슷하고, 같은 양을 비교한 사람 시험에서 대사 영향의 차이는 크지 않았습니다. 문제는 종류보다 양, 그리고 액체로 빠르게 많이 먹는 형태입니다."},{claim:"과일주스·이온음료는 탄산음료보다 건강하다",truth:"100% 과일주스도 한 컵(200ml)에 당이 약 17~20g으로 콜라와 큰 차이가 없고 섬유는 거의 없습니다. 이온음료는 1시간 넘게 격렬하게 운동할 때 외에는 가당 음료와 다르지 않습니다."},{claim:"제로 콜라의 아스파탐은 암을 일으킨다",truth:'IARC는 2023년 아스파탐을 "발암 가능 물질(2B군)"로 분류했지만, 같은 해 WHO·FAO 전문가위원회는 하루 허용량(체중 kg당 40mg)을 유지했습니다. 체중 70kg 성인이 제로 탄산음료를 하루 9~14캔 넘게 마셔야 도달하는 양입니다. 다만 건강 이득이 확인된 것도 아니어서 물이 가장 좋은 선택입니다.'}]},{id:"ramen",name:"라면",en:"Instant ramen (fried noodles)",aliases:["컵라면","봉지라면","인스턴트라면","유탕면","인스턴트면","라볶이","짬뽕라면","비빔라면","ramen","ramyeon","instant noodles","cup noodles"],emoji:"🍜",category:"가공식품·기호식품",summary:"정제 밀가루 면을 팜유에 튀긴(유탕면) 인스턴트 식품입니다. 한 봉지(약 120g)에 약 500kcal, 나트륨 약 1,700~1,900mg으로 WHO 하루 권고량(2,000mg)에 가깝고 포화지방도 많습니다. 한국 성인 분석에서 라면을 주 2회 이상 먹는 여성의 대사증후군 유병이 더 높았습니다. 먹는다면 스프를 줄이고 채소·달걀을 더하는 방식이 현실적입니다.",verdict:{tone:"limit",text:"가끔, 줄여서. 스프 절반·채소와 달걀 추가·국물 남기기로 부담을 크게 줄일 수 있습니다."},basis:"유탕면 라면 100g (면+스프, 조리 전, 국내 대표 제품 표시값 기준)",serving:{label:"1봉지 (약 120g)",grams:120},nutrients:{kcal:420,carb:66,sugar:3.3,protein:8.5,fat:14,satFat:7,sodium:1500},compounds:[{id:"sodium",amount:"100g당 약 1,500mg (1봉지 약 1,700~1,900mg, 상당 부분이 스프)",role:"국물까지 다 먹으면 한 끼로 하루 권고량 가까이를 먹게 됩니다. 나트륨은 혈압을 올리고, 짠 국물 습관은 위 점막 손상과도 연관됩니다."},{id:"refined-carb",amount:"탄수화물 약 66g/100g, 식이섬유는 적음",role:"정제 밀가루 전분에 단백질·섬유가 적은 조합이라 포만감이 오래가지 않고, 밥을 말아 먹으면 탄수화물이 더 늘어납니다."},{id:"saturated-fat",amount:"약 7g/100g (1봉지 약 8g, 하루 기준치의 절반 이상)",role:"면을 튀기는 팜유에서 옵니다. 팜유는 포화지방이 약 절반이라 산화에 강해 튀김·보존에 유리하지만, LDL을 올리는 팔미트산이 많습니다. 정제 팜유의 공정 부산물(글리시딜 에스터·3-MCPD)은 팜유 항목을 참고하세요."},{id:"oxidized-lipids",amount:"보관 기간·온도에 따라 증가",role:"튀긴 면의 기름은 오래 두거나 더운 곳에 보관하면 산패가 진행됩니다. 쩐내가 나는 오래된 라면은 먹지 않는 것이 좋습니다."}],howToEat:[{title:"스프는 절반만",body:"나트륨의 상당 부분이 스프에서 옵니다. 절반만 넣고 파·마늘·후추·고춧가루로 풍미를 보완하면 나트륨을 수백 mg 줄일 수 있습니다."},{title:"국물은 남기기",body:"나트륨은 국물에 녹아 있으므로, 면과 건더기만 먹고 국물을 남기면 섭취량이 크게 줄어듭니다."},{title:"채소·달걀·두부 추가",body:"양배추·콩나물·버섯·대파는 칼륨과 섬유를, 달걀·두부는 단백질을 더해 포만감을 늘리고 혈당 상승을 완만하게 합니다."},{title:"면을 한 번 데쳐 물 버리기",body:"면을 먼저 삶아 그 물을 버리고 새 물에 끓이면 면에 밴 기름 일부가 빠집니다. 맛은 조금 담백해집니다."},{title:"횟수부터 줄이기",body:"한국인 분석에서 위험 차이가 나타난 기준이 주 2회 이상이었습니다. 자주 먹는다면 먹는 횟수를 먼저 줄이세요."}],pairings:{good:["달걀·두부 (단백질)","양배추·콩나물·버섯 (칼륨·섬유)"],avoid:["김치·단무지 듬뿍 (나트륨 추가)","밥 말아 국물까지 (나트륨·탄수화물 과다)"]},cautions:["고혈압·신장질환·심부전이면 국물은 먹지 말고 먹는 횟수를 줄이세요.","어린이·청소년이 자주 먹으면 짠맛에 입맛이 길들고 한 끼 영양이 크게 치우칩니다.","밀가루 면이라 셀리악병·밀 알레르기가 있으면 피해야 합니다."],myths:[{claim:"MSG(글루탐산나트륨)가 라면의 가장 큰 문제다",truth:'MSG는 이중맹검 시험에서 일반적인 섭취량으로 두통 같은 "중국 음식 증후군"이 재현되지 않았고, 국제 식품안전기구들이 안전하다고 평가합니다. MSG의 나트륨 비율은 소금의 약 3분의 1(약 12% 대 39%)이라 오히려 소금을 줄이는 데 쓰이기도 합니다. 라면의 진짜 문제는 총 나트륨·포화지방·영양 불균형입니다.'},{claim:"라면에는 방부제가 많아 오래 두어도 썩지 않는다",truth:"유탕면은 튀기면서 수분이 5% 안팎으로 빠져 미생물이 자랄 수 없기 때문에 오래 보관되는 것입니다. 다만 기름 산패는 시간이 지나면 진행되므로 유통기한 안에 드세요."},{claim:"라면 면은 위에서 소화되지 않고 몇 시간씩 남는다",truth:"캡슐 내시경 영상으로 퍼진 이야기지만 아주 작은 관찰이었습니다. 기름진 음식이 위 배출을 조금 늦추는 정도일 뿐, 라면 면도 결국 정상적으로 소화·흡수됩니다."}]},{id:"fried-food",name:"튀김·감자튀김",en:"Fried foods (French fries, fried chicken)",aliases:["튀김","감자튀김","프렌치프라이","후렌치후라이","치킨","프라이드치킨","후라이드치킨","양념치킨","돈가스","돈까스","새우튀김","분식튀김","핫도그","french fries","fries","fried chicken","fried food","deep fried"],emoji:"🍟",category:"가공식품·기호식품",summary:"감자·닭·해물 등을 160~190℃ 기름에 담가 익힌 음식입니다. 고열량 외에도 ① 반복 사용한 기름에서 생긴 산화 지질(알데하이드), ② 감자처럼 전분이 많은 식품에서 생기는 아크릴아마이드, ③ 고기 튀김의 헤테로고리아민 같은 고온 부산물이 문제로 꼽힙니다. 관찰연구 메타분석에서 튀김을 가장 많이 먹는 사람의 주요 심혈관 사건 위험이 약 28% 높았습니다.",verdict:{tone:"limit",text:"가끔 즐기는 음식으로. 집에서는 새 기름과 적정 온도로, 또는 에어프라이어·오븐으로."},basis:"패스트푸드 감자튀김 100g (식물성 기름에 튀긴 것)",serving:{label:"중간 크기 1봉 (약 110g)",grams:110},nutrients:{kcal:312,carb:41,sugar:.3,fiber:3.8,protein:3.4,fat:14.7,satFat:2.3,sodium:210,potassium:579},compounds:[{id:"oxidized-lipids",amount:"새 기름에서는 적고, 같은 기름을 여러 번·오래 쓸수록 증가",role:"튀김 온도에서 기름의 리놀레산 같은 다불포화지방이 산소와 반응해 과산화물을 거쳐 4-HNE·아크롤레인·말론디알데하이드 같은 알데하이드가 됩니다. 이것이 튀김에 흡수되어 몸에 들어오면 글루타티온을 소모하고 단백질·DNA에 결합해 산화 스트레스와 염증 신호를 늘릴 수 있습니다(주로 동물·세포 근거)."},{id:"acrylamide",amount:"감자튀김 대략 수백 μg/kg (EU 기준치 500μg/kg)",role:"감자 속 아스파라긴과 환원당이 120℃ 이상에서 마이야르 반응을 하며 생깁니다. IARC 2A군으로 동물에서는 발암성이 확인됐지만, 사람의 식이 노출과 암의 연관은 뚜렷하지 않습니다."},{id:"heat-byproducts",amount:"치킨·돈가스 등 고기 튀김의 겉면",role:"고기를 고온으로 튀기면 크레아틴과 아미노산이 반응해 헤테로고리아민(HCA)이, 당과 단백질이 반응해 최종당화산물(AGEs)이 생깁니다. 튀김옷이 고기 표면을 일부 보호합니다."},{id:"linoleic-acid",amount:"콩기름·옥수수유로 튀기면 많음",role:"튀김은 식단의 오메가6 섭취를 크게 늘립니다. 신선한 리놀레산 자체보다 튀기는 과정에서 산화된 형태가 문제의 핵심입니다."},{id:"trans-fat",amount:"부분경화유를 쓰지 않으면 매우 적음",role:"과거 쇼트닝(부분경화유) 튀김에는 트랜스지방이 많았지만, 2007년 표시 의무화 이후 국내 튀김유는 대부분 바뀌었습니다. 식물성 기름을 오래 고온 가열하면 소량이 새로 생깁니다."},{id:"sodium",amount:"감자튀김 약 210mg/100g, 치킨은 염지·양념으로 훨씬 많음",role:"치킨은 염지(소금물 절임)와 양념 소스 때문에 한 마리의 나트륨이 하루 기준치를 넘기 쉽습니다."}],howToEat:[{title:"적정 온도(170~180℃)에서 짧게",body:"온도가 낮으면 기름을 많이 먹고, 연기가 날 만큼 높으면 기름 분해와 아크릴아마이드가 급증합니다. 감자는 175℃ 안팎에서 연한 황금색이 되면 멈추세요."},{title:"감자는 썰어서 물에 담갔다가",body:"썬 감자를 물에 15~30분 담가 표면의 당과 전분을 빼고 물기를 잘 닦은 뒤 튀기면 아크릴아마이드가 줄어듭니다."},{title:"기름 재사용은 짧게",body:"튀김 찌꺼기를 걸러내고, 색이 짙어지거나 거품이 잘 꺼지지 않거나 연기가 쉽게 나면 버리세요. 단일불포화지방이 많은 기름(고올레산 해바라기유·카놀라유·쌀겨유 등)이 반복 가열에 상대적으로 강합니다."},{title:"에어프라이어·오븐으로 대체",body:"기름을 거의 쓰지 않아 지방·열량과 산화 기름 섭취가 크게 줄어듭니다. 다만 고온 건조 조리라 감자의 아크릴아마이드는 여전히 생기니 너무 진하게 굽지 마세요."},{title:"기름을 빼고 채소와 함께",body:"키친타월로 기름을 빼고 양배추 샐러드·채소를 곁들이면 한 끼의 열량 밀도가 낮아집니다."}],pairings:{good:["양배추 샐러드·채소 (섬유·칼륨)","레몬 (소스·소금 대신 풍미)"],avoid:["가당 음료·맥주와 세트","양념 소스 듬뿍 (당·나트륨)"]},cautions:["심혈관질환·이상지질혈증·비만이 있으면 빈도를 줄이세요. 메타분석에서 주당 튀김 섭취가 한 번(약 114g) 늘 때마다 심혈관 위험이 함께 증가했습니다.","길거리·업소에서 오래 쓴 튀김 기름에는 산화물이 많습니다. 기름 냄새가 역하거나 튀김이 거무스름하면 피하세요.","튀김을 할 때 나오는 기름 연기(조리흄)는 폐에 해로울 수 있어, 집에서도 환기와 후드 사용이 중요합니다."],myths:[{claim:"식물성 기름으로 튀기면 건강한 튀김이다",truth:"기름 종류보다 온도·재사용 횟수·먹는 빈도가 더 중요합니다. 식물성 기름은 포화지방이 적지만, 다불포화지방이 많을수록 반복 가열에서 알데하이드가 많이 생깁니다."},{claim:"에어프라이어 음식은 튀김과 달리 해가 전혀 없다",truth:"기름이 적어 열량과 산화 기름은 크게 줄지만, 감자·빵가루는 고온 건조 조건에서 갈색이 짙어질수록 아크릴아마이드가 생깁니다. 온도와 시간을 과하지 않게 조절하세요."},{claim:"튀김은 트랜스지방 덩어리다",truth:"부분경화유(쇼트닝)를 쓰던 시절의 이야기에 가깝습니다. 현재 국내 튀김유는 대부분 트랜스지방이 적고, 더 큰 문제는 열량·산화 기름·아크릴아마이드입니다."}]},{id:"alcohol",name:"술 (소주·맥주·와인)",en:"Alcoholic beverages",aliases:["술","소주","맥주","와인","레드와인","막걸리","위스키","양주","소맥","청주","사케","고량주","하이볼","음주","alcohol","soju","beer","wine","makgeolli","liquor"],emoji:"🍶",category:"가공식품·기호식품",summary:'에탄올은 간에서 아세트알데하이드(IARC 1군 발암물질)로 바뀐 뒤 ALDH2 효소가 초산으로 분해합니다. 한국인의 약 30%는 ALDH2 활성이 약한 변이를 가져 조금만 마셔도 얼굴이 붉어지고, 이런 사람이 계속 마시면 식도암 위험이 크게 높아집니다. 에탄올은 지방간·수면 질 저하·장벽 약화도 일으키며, 최신 유전 연구는 "적당한 음주가 심장에 좋다"는 이점을 지지하지 않습니다.',verdict:{tone:"limit",text:"마시지 않는 것이 가장 안전하고, 마신다면 적게·드물게. 얼굴이 붉어지는 사람은 특히 줄이세요."},basis:"소주 100g (알코올 약 16.5%, 에탄올 약 13g)",serving:{label:"소주 1병 (360ml, 약 350g)",grams:350},nutrients:{kcal:93},compounds:[{id:"ethanol",amount:"소주 1병 약 47g, 맥주 500ml 약 18~20g, 와인 1잔(150ml) 약 14g",role:"간의 알코올탈수소효소(ADH)와 CYP2E1이 아세트알데하이드로 바꾸고 ALDH2가 초산으로 분해합니다. 이 과정에서 NADH가 쌓여 지방 분해가 막히고 지방 합성이 늘어 지방간이 생기며, 만성 음주로 늘어난 CYP2E1은 활성산소를 만듭니다. 장벽을 느슨하게 해 장내 세균의 내독소가 간으로 들어가 염증을 키우기도 합니다."},{id:"resveratrol",amount:"레드와인 1잔에 대략 1mg 미만 (품종·산지에 따라 편차)",role:'"레드와인이 건강에 좋다"는 이야기의 주인공이지만, 동물 실험에서 효과를 낸 양을 와인으로 채우려면 하루 수백 잔 이상이 필요합니다. 와인 속 알코올의 해로움을 상쇄할 수 없습니다.'},{id:"refined-carb",amount:"맥주 100ml당 당질 약 3~4g, 막걸리는 제품에 따라 더 많음",role:"맥주·막걸리는 에탄올 외에 맥아당·덱스트린 같은 당질이 열량을 더합니다. 에탄올이 먼저 연료로 쓰이는 동안 함께 먹은 안주의 지방·당은 저장되기 쉽습니다."},{id:"probiotics",amount:"살균하지 않은 생막걸리의 효모·유산균",role:"생막걸리에는 살아 있는 효모와 유산균이 있지만, 에탄올과 함께 먹는 이상 장 건강 식품으로 보기는 어렵습니다. 살균 막걸리에는 살아 있는 균이 거의 없습니다."}],howToEat:[{title:"얼굴이 붉어지면 멈추기",body:"음주 후 얼굴 홍조·두근거림은 아세트알데하이드가 쌓인다는 신호입니다. ALDH2 변이의 표시이며, 계속 마시면 식도암 위험이 여러 배로 높아집니다. 마시다 보면 홍조가 덜해지는 것은 내성일 뿐 위험은 그대로입니다."},{title:"양을 에탄올 g으로 계산하기",body:"소주 1잔(50ml)은 에탄올 약 6.5g, 맥주 1캔(355ml, 5%)은 약 14g, 와인 1잔(150ml, 12%)은 약 14g입니다. 소주 1병(약 47g)은 표준 1잔(에탄올 10g)의 약 5배입니다."},{title:"빈속에 마시지 말고 물과 번갈아",body:"음식이 있으면 위 배출이 늦어져 혈중 알코올 최고치가 낮아집니다. 물을 번갈아 마시면 전체 음주량도 줄어듭니다."},{title:"안주는 두부·생선·채소 위주로",body:"치킨·튀김·라면 같은 안주는 열량과 나트륨을 크게 더합니다."},{title:"잠들기 직전 음주 피하기",body:"술은 잠드는 것을 빠르게 하지만, 밤 후반에 대사되면서 렘수면을 줄이고 자주 깨게 해 수면의 질을 떨어뜨립니다."}],pairings:{good:["물 (번갈아 마시기)","두부·생선·채소 안주"],avoid:["에너지음료와 섞기 (취기를 덜 느껴 더 마시게 됨)","아세트아미노펜(타이레놀)과 과음","수면제·항불안제"]},cautions:["임신 중에는 안전한 음주량이 알려져 있지 않습니다(태아알코올스펙트럼장애).","만성 과음자는 CYP2E1이 늘고 글루타티온이 부족해, 아세트아미노펜의 독성 대사물(NAPQI)로 인한 간 손상 위험이 커집니다.","수면제·진정제·항히스타민제·오피오이드와 함께 먹으면 중추신경 억제가 겹쳐 위험하고, 메트로니다졸 같은 일부 약은 심한 홍조·구토 반응을 일으킵니다.","통풍이 있으면 특히 맥주를 피하세요. 맥주의 퓨린에 더해, 모든 술은 젖산을 늘려 요산 배설을 줄입니다.","간질환·췌장염·위식도역류·심방세동이 있으면 금주가 원칙입니다."],myths:[{claim:"하루 한두 잔 적당한 음주는 심장에 좋다",truth:'과거 관찰연구의 J자 곡선에는 건강이 나빠 술을 끊은 사람이 비음주군에 섞이는 편향이 있었습니다. 음주량을 좌우하는 유전자 변이(ALDH2·ADH1B)를 이용한 멘델 무작위 분석(중국 50만 명, 2019 Lancet)에서는 소량 음주의 뇌졸중 예방 효과가 나타나지 않고 음주량에 비례해 위험이 올라갔으며, 2023년 메타분석에서도 소량 음주의 사망률 이득은 확
