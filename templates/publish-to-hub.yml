# ─────────────────────────────────────────────────────────────────────────────
# [템플릿] 정식 개발 게임의 Private 저장소 → 공개 허브(bamtolking/MyGame)로 "빌드 결과물만" 올리는 워크플로
#
# 사용법 (Private 저장소 쪽):
#   1. 이 파일을 Private 저장소의 .github/workflows/publish-to-hub.yml 로 복사
#   2. 아래 env 의 HUB_GAME_SLUG 를 허브 주소 이름으로 바꿈 (예: thief → https://bamtolking.github.io/MyGame/thief/)
#   3. GitHub → 본인 프로필 Settings → Developer settings → Personal access tokens → Fine-grained tokens 에서
#      토큰 생성: Repository access = "Only select repositories" → MyGame 만 선택, Permissions → Contents: Read and write
#   4. Private 저장소 → Settings → Secrets and variables → Actions → New repository secret
#      이름 HUB_PUSH_TOKEN, 값 = 위 토큰   (토큰은 절대 코드/README 에 적지 않음)
#   5. 허브(MyGame)의 games.json 에서 이 게임 항목을  "build": { "prebuilt": true }  로 바꿈
#      (허브는 games/<slug>/ 폴더를 빌드 없이 그대로 배포)
#
# 결과: Private 저장소의 main 에 push → 여기서 빌드 → 빌드 결과(dist/)만 허브의 games/<slug>/ 에 커밋·push
#       → 허브의 Pages 워크플로가 자동 배포. 원본 소스(TS·테스트·문서)는 공개되지 않음.
# 주의: 브라우저 게임의 빌드된 JS 자체는 누구나 내려받을 수 있습니다(난독화 ≠ 암호화). 비밀키·서버 로직은 절대 넣지 마세요.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish build to public game hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_REPO: bamtolking/MyGame
  HUB_BRANCH: main                                    # 허브 배포 브랜치
  HUB_GAME_SLUG: CHANGE-ME                            # 예: thief
  BUILD_DIR: dist                                     # vite.config.ts 의 build.outDir

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private game source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build (base './' 가 vite.config.ts 에 있어야 /MyGame/<slug>/ 에서 경로가 맞음)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f "$BUILD_DIR/index.html"

      - name: Check the build output for secrets
        run: |
          if grep -rIEn 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|sk-(ant-)?[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY' "$BUILD_DIR"; then
            echo "빌드 결과물에 비밀키로 보이는 문자열이 있습니다. 배포를 중단합니다."; exit 1; fi

      - name: Checkout public hub
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HUB_REPO }}
          ref: ${{ env.HUB_BRANCH }}
          token: ${{ secrets.HUB_PUSH_TOKEN }}
          path: hub

      - name: Replace games/<slug>/ with the new build only
        run: |
          test "$HUB_GAME_SLUG" != "CHANGE-ME" || { echo "HUB_GAME_SLUG 를 설정하세요"; exit 1; }
          rm -rf "hub/games/$HUB_GAME_SLUG"
          mkdir -p "hub/games/$HUB_GAME_SLUG"
          cp -R "$BUILD_DIR"/. "hub/games/$HUB_GAME_SLUG"/
          cd hub
          git config user.name "hub-publish-bot"
          git config user.email "hub-publish-bot@users.noreply.github.com"
          git add "games/$HUB_GAME_SLUG"
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "$HUB_GAME_SLUG: 빌드 결과물 갱신 ($GITHUB_SHA)"
          git push origin "HEAD:$HUB_BRANCH"
