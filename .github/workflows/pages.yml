# GitHub Pages 배포: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾸면
# main(또는 master)에 push할 때마다 https://<계정>.github.io/<저장소>/ 에 게임이 올라갑니다.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, claude/naruto-random-defense-mobile-h3lssi]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
