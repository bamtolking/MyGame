# GitHub Pages 자동 배포: main 에 push(또는 PR 병합)될 때마다 games.json 의 게임을 모두 빌드해 한 사이트(/MyGame/<게임>/)로 올립니다.
#   - 복사본 게임: main 의 games/<slug>/ 를 빌드
#   - live 게임(games.json 의 "live"): 실행할 때마다 원본 브랜치(claude/*)의 최신 커밋을 받아 빌드
#     → 게임 세션은 자기 브랜치에 push 한 뒤 이 워크플로를 ref=main 으로 수동 실행(workflow_dispatch)하면 주소에 바로 반영됩니다.
# 처음 한 번 확인: Settings → Pages → Source = "GitHub Actions",
#                 Settings → Environments → github-pages → Deployment branches 에 main 허용.
name: Deploy game hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # 수동 실행(Actions → Run workflow 또는 API, ref=main)만 추가로 허용. 다른 브랜치 push 로는 실행되지 않음.

permissions:
  contents: read
  pages: write
  id-token: write

# 여러 세션이 거의 동시에 배포를 실행해도 진행 중인 배포는 끝까지 마치고, 대기 중인 것 중 가장 마지막 실행만 이어서 돈다
# (마지막 실행이 모든 원본 브랜치의 최신 커밋을 다시 받으므로 먼저 요청한 세션의 업데이트도 포함됨).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build all games
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/*/package-lock.json

      - name: Check for secrets in the checked-out tree
        run: node scripts/check-secrets.mjs

      - name: Build every game and the hub page (→ _site/, live 게임은 원본 브랜치에서 받아 빌드)
        run: node scripts/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
