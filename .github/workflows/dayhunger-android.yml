name: 데이헝거 Android APK

on:
  push:
    branches: ['**']
    paths: ['dayhunger/**', '.github/workflows/dayhunger-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayhunger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dayhunger/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 의존성 설치
        run: npm ci
      - name: 규칙 테스트
        run: npm test
      - name: 웹 자산 모으기 + Capacitor 동기화
        run: npm run android:sync
      - name: 비밀 서명 키 준비 (DH_KEYSTORE_B64 시크릿이 있을 때만)
        if: ${{ env.DH_KEYSTORE_B64 != '' }}
        env:
          DH_KEYSTORE_B64: ${{ secrets.DH_KEYSTORE_B64 }}
        run: |
          echo "$DH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/secret.jks"
          echo "DH_KEYSTORE=$RUNNER_TEMP/secret.jks" >> "$GITHUB_ENV"
          echo "DH_KEYSTORE_PASS=${{ secrets.DH_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          echo "DH_KEY_ALIAS=${{ secrets.DH_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DH_KEY_PASS=${{ secrets.DH_KEY_PASS }}" >> "$GITHUB_ENV"
      - name: APK 빌드 (release, 고정 키 서명)
        env:
          DH_VERSION_CODE: ${{ github.run_number }}
          DH_VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../dayhunger.apk
      - name: 서명 확인
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dayhunger.apk | grep -i "SHA-256\|Verified" || true
          "$APKSIGNER" verify --print-certs dayhunger.apk | grep -i "certificate SHA-256"
      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dayhunger-apk
          path: dayhunger/dayhunger.apk
      - name: 최신 릴리스 갱신 (dayhunger-latest)
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/starcraft-eud-mobile-game-1ytq58'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dayhunger-latest
          name: 데이헝거 안드로이드 (최신 빌드)
          prerelease: true
          body: |
            자동 빌드된 안드로이드 APK입니다. 휴대폰에서 `dayhunger.apk`를 내려받아 설치하세요 ("출처를 알 수 없는 앱" 허용 필요).
            "앱이 설치되지 않음"이 뜨면 예전 버전(다른 서명 키)이 남아 있는 것이니 기존 데이헝거 앱을 삭제한 뒤 다시 설치하세요. 이 빌드부터는 키가 고정되어 이후 버전은 덮어쓰기 설치가 됩니다.
            버전 0.2.${{ github.run_number }} · 빌드 커밋: ${{ github.sha }} (${{ github.ref_name }})
          files: dayhunger/dayhunger.apk
