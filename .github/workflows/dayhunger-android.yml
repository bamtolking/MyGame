name: 데이헝거 Android APK

on:
  push:
    branches: ['**']
    paths: ['dayhunger/**', '.github/workflows/dayhunger-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayhunger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dayhunger/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 의존성 설치
        run: npm ci
      - name: 규칙 테스트
        run: npm test
      - name: 웹 자산 모으기 + Capacitor 동기화
        run: npm run android:sync
      - name: APK 빌드 (debug 서명)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dayhunger.apk
      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dayhunger-apk
          path: dayhunger/dayhunger.apk
      - name: 최신 릴리스 갱신 (dayhunger-latest)
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/starcraft-eud-mobile-game-1ytq58'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dayhunger-latest
          name: 데이헝거 안드로이드 (최신 빌드)
          prerelease: true
          body: |
            자동 빌드된 안드로이드 APK입니다. 휴대폰에서 `dayhunger.apk`를 내려받아 설치하세요 ("출처를 알 수 없는 앱" 허용 필요).
            빌드 커밋: ${{ github.sha }} (${{ github.ref_name }})
          files: dayhunger/dayhunger.apk
