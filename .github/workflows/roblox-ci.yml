name: roblox-ci
on:
  push:
    paths: ["roblox/**", ".github/workflows/roblox-ci.yml"]
  pull_request:
    paths: ["roblox/**", ".github/workflows/roblox-ci.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox
    steps:
      - uses: actions/checkout@v5
      - name: 도구 설치 (rojo, luau, luau-lsp, lune)
        run: bash scripts/setup-tools.sh
      - name: 순수 로직 테스트
        run: tests/run.sh
      - name: Roblox API 타입 검사
        run: |
          .tools/rojo sourcemap default.project.json -o sourcemap.json
          .tools/luau-lsp analyze --definitions=.tools/globalTypes.d.luau --sourcemap=sourcemap.json --base-luaurc .luaurc src/shared/*.luau src/server/*.luau src/client/*.luau
      - name: 도우미 속성 이름 검사
        run: python3 tests/check_props.py .tools/globalTypes.d.luau
      - name: 빌드 및 커밋된 rbxlx 와 비교
        run: |
          .tools/rojo build default.project.json -o /tmp/GhostDiner.rbxlx
          if ! cmp -s /tmp/GhostDiner.rbxlx build/GhostDiner.rbxlx; then
            echo "build/GhostDiner.rbxlx 가 소스와 다릅니다. 'rojo build default.project.json -o build/GhostDiner.rbxlx' 로 다시 만들어 커밋하세요."
            exit 1
          fi
      - name: 헤드리스 통합 시뮬레이션 (최대 2회 시도)
        run: |
          for i in 1 2; do
            if .tools/lune run tests/sim/run.luau .; then exit 0; fi
            echo "시뮬레이션 실패, 재시도 $i"
          done
          exit 1
