릿해요.","눈치 백단은 획득 반경을 넓혀 줘요. 보석 줍다가 포위당할 일이 줄어듭니다.","커피는 체력 조금, 치킨은 체력 전부 회복! 치킨은 언제나 옳다.","폭탄을 주우면 화면의 적이 싹 정리됩니다(보스는 버팀).","시계를 주우면 적이 5초간 멈춥니다. 도망칠 시간!","같은 적에게는 0.8초에 한 번만 맞아요. 포위당하면 가장 얇은 곳으로 뚫고 나가세요.","철벽 멘탈(방어)은 잔챙이가 많을수록 효과가 커집니다.","열정 페이는 적이 많고 단단해지는 대신 피해·경험치·월급이 늘어요. 자신 있을 때만!","화면 가장자리 화살표는 엘리트·상자·보스의 위치를 알려 줍니다.","죽어도 벌어둔 월급은 챙겨갑니다. 조퇴도 월급은 나와요.","월급(코인)으로 복지를 사면 모든 캐릭터가 영구히 강해집니다.","업적을 달성하면 새 무기·캐릭터·스테이지가 풀립니다. 업적 목록을 자주 확인하세요.","오늘의 업무는 매일 바뀌는 특수 규칙 도전이에요. 모두 같은 조건이니 친구와 비교해 보세요.","야근 강도를 올리면 적이 강해지는 만큼 월급 배율도 올라갑니다.","출석 체크는 매일 한 번! 연속으로 찍을수록 보상이 커져요.",'팁: "혹시 5분만 시간 되세요?"는 질문이 아닙니다.',"팁: 전체 회신 버튼은 신중하게 누르세요.","팁: 퇴근 인사는 짧게, 발걸음은 빠르게.","팁: 탕비실 과자는 오후 3시 전에 확보해야 합니다.","팁: 금요일 오후 배포는 전설로만 남겨 두세요.",'팁: "최종.psd"는 절대 최종이 아닙니다.',"팁: 모니터에 엑셀을 띄워 두면 일하는 것처럼 보입니다.","팁: 회식에서 건배사를 피하려면 화장실 타이밍이 전부입니다."],da=["오늘은 조퇴 처리되었습니다. 내일 다시 출근!","오늘은 여기까지… 나머지는 내일의 내가 하겠지.","업무에 깔려 기절했습니다. 메일은 여전히 999+",'"이 사람 어디 갔어요?" — 팀장님',"칼퇴는 실패했지만, 퇴사는 아직 안 했다.","버그는 이겼고, 나는 졌다.","결재 서류 더미 아래에서 발견되었습니다.","회의가… 너무… 길었다…","체력이 0이 되었습니다. 다행히 월급은 들어옵니다.",'"내일은 진짜 칼퇴한다." (어제도 한 말)',"사내 메신저 상태: 자리 비움",'책상 위에 포스트잇이 남겨졌다: "내일 잠깐 봅시다"',"재부팅이 필요합니다. 컴퓨터 말고 나요.","열정은 있었다. 체력이 없었을 뿐.","오늘의 교훈: 전체 회신은 무섭다.","퇴근 버스는 이미 떠났습니다.","장렬하게 쓰러졌지만 KPI에는 반영되지 않습니다.","괜찮아요, 월급날은 반드시 옵니다.","아무도 모르게 조용히 로그아웃했습니다.","다음 판은 국밥 먹고 다시 도전!","업무 폭탄 앞에서 잠시 전원이 꺼졌습니다.",'"이거 누가 했어요?" 대답할 사람이 없다.'],ha=["18:00 정각. 컴퓨터 끄는 소리가 이렇게 아름다웠나.","칼퇴 성공! 오늘의 나, 아주 칭찬해.",'"먼저 들어가 보겠습니다!" — 역사에 남을 한마디',"엘리베이터 문이 닫히는 순간, 자유.","보스가 부르기 전에 이미 1층입니다.","퇴근길 지하철이 오늘따라 반갑다.","오늘 업무 완료. 내일 업무는 내일의 나에게.","메일함 0. 전설은 실존했다.","칼퇴 도장 쾅! 인사고과 +1(마음속으로)","오늘은 치킨 시켜도 되는 날입니다.",'"오늘 일찍 가네?" "아뇨, 정시인데요."',"저녁이 있는 삶, 오늘만큼은 내 것.","6시 종소리와 함께 퇴근 완료.","오늘의 MVP: 나. 이견 없음.","업무 폭탄을 전부 처리하고 유유히 퇴장.","출입 카드 태그 성공. 삑-","노트북 덮는 속도, 사내 신기록 달성.","월급 루팡이 아니라 월급 챔피언.","보스도 오늘은 인정했다(표정으로).","오늘도 살아남았다. 내일의 나, 잘 부탁해.","회사 밖 공기가 이렇게 달았나.","퇴근 후 계획: 아무것도 안 하기. 완벽하다."],ua=["승진각!","연봉협상 각","능력치 상승!","일잘러 등극","성과급 예약","에이스 인정","실력 +1","오늘 좀 되는데?","폼 미쳤다","인사고과 A+","스펙 업!
